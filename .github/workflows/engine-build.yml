name: OUTLANDS Engine Build

on:
  push:
    branches: [main]
    paths:
      - "engine/**"
      - "gry2/**"
      - "anticheat/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "index.html"
      - "silnik/**"
      - "vite.config.ts"
      - ".github/workflows/engine-build.yml"
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Build engine
        run: npm run build
