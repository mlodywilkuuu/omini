
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kontynuuj grę | Władca Narodów</title>

<style>
* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: #080d20;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: "Segoe UI", Arial, sans-serif;
  color: #f5f7ff;
  background: linear-gradient(
    125deg,
    #080d20,
    #172c54,
    #34214d,
    #092c42
  );
  background-size: 400% 400%;
  animation: gradient 16s ease infinite;
  overflow-x: hidden;
}

@keyframes gradient {
  0%, 100% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
}

.orb {
  position: fixed;
  z-index: 0;
  width: 320px;
  height: 320px;
  border-radius: 50%;
  filter: blur(80px);
  opacity: .35;
  pointer-events: none;
  animation: float 12s ease-in-out infinite;
}

.orb.one {
  top: -110px;
  left: -110px;
  background: #527cff;
}

.orb.two {
  right: -110px;
  bottom: -110px;
  background: #a44dff;
  animation-delay: -5s;
}

@keyframes float {
  50% {
    transform: translate(35px, -35px);
  }
}

main {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 12px;
}

.panel {
  width: 100%;
  max-width: 690px;
  padding: 22px;
  border: 1px solid #ffffff30;
  border-radius: 22px;
  background: rgba(255,255,255,.08);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  box-shadow:
    0 20px 70px #0005,
    inset 0 1px 0 #ffffff25;
}

.header {
  text-align: center;
  margin-bottom: 16px;
}

.crown {
  font-size: 30px;
  color: #f6d38a;
  text-shadow: 0 0 25px #f6d38a88;
}

h1 {
  margin: 5px 0;
  font-size: 28px;
  color: #f6d38a;
  letter-spacing: 1px;
}

.subtitle {
  margin: 0;
  color: #a9b8d1;
  font-size: 12px;
}

.saves {
  display: grid;
  gap: 9px;
  max-height: min(47vh, 330px);
  overflow-y: auto;
  padding: 3px;
}

.save-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 13px;
  border: 1px solid #ffffff27;
  border-radius: 13px;
  background: rgba(255,255,255,.06);
  transition: .2s;
}

.save-card:hover {
  background: rgba(255,255,255,.12);
  border-color: #f6d38a77;
}

.save-name {
  margin: 0 0 5px;
  font-size: 15px;
  font-weight: bold;
  color: #f4dfb5;
  overflow-wrap: anywhere;
}

.save-details {
  display: flex;
  flex-wrap: wrap;
  gap: 5px 13px;
  color: #b5c4dd;
  font-size: 11px;
}

.actions {
  display: flex;
  gap: 6px;
}

button, .back {
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
}

.small-btn {
  padding: 9px 12px;
  border-radius: 9px;
  border: 1px solid #ffffff30;
  background: rgba(255,255,255,.1);
  color: white;
  font-size: 11px;
}

.small-btn.gold {
  background: linear-gradient(
    120deg,
    #bd8c42,
    #ffe6aa,
    #d7a54c
  );
  border-color: #f6d38a;
  color: #171822;
}

.small-btn.danger {
  color: #ffd2d2;
  border-color: #ff777755;
}

.small-btn:hover,
.back:hover {
  transform: translateY(-2px);
  filter: brightness(1.1);
}

button:focus-visible,
.back:focus-visible {
  outline: 3px solid #f6d38a;
  outline-offset: 3px;
}

.empty {
  padding: 32px 15px;
  border: 1px dashed #ffffff35;
  border-radius: 14px;
  text-align: center;
  background: rgba(0,0,0,.12);
}

.empty-icon {
  font-size: 32px;
  margin-bottom: 8px;
}

.empty h2 {
  margin: 0 0 7px;
  color: #f6d38a;
  font-size: 17px;
}

.empty p {
  margin: 0;
  color: #b5c4dd;
  font-size: 12px;
  line-height: 1.6;
}

.bottom {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 14px;
}

.back {
  display: block;
  padding: 12px;
  border: 1px solid #ffffff30;
  border-radius: 10px;
  background: rgba(255,255,255,.08);
  color: white;
  text-align: center;
  text-decoration: none;
  font-size: 12px;
}

.back.gold {
  background: linear-gradient(
    120deg,
    #bd8c42,
    #ffe6aa,
    #d7a54c
  );
  color: #171822;
  border-color: #f6d38a;
}

.footer {
  margin-top: 12px;
  text-align: center;
  color: #91a1ba;
  font-size: 10px;
}

.status {
  min-height: 16px;
  margin-top: 8px;
  text-align: center;
  font-size: 11px;
  color: #ffcbcb;
}

@media (max-width: 520px) {
  .panel {
    padding: 16px 12px;
  }

  h1 {
    font-size: 23px;
  }

  .save-card {
    grid-template-columns: 1fr;
  }

  .actions {
    justify-content: flex-end;
  }

  .bottom {
    grid-template-columns: 1fr;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<div class="orb one"></div>
<div class="orb two"></div>

<main>
<section class="panel">

  <header class="header">
    <div class="crown">♛</div>
    <h1 id="pageTitle">KONTYNUUJ GRĘ</h1>
    <p class="subtitle" id="pageSubtitle">
      Wybierz zapis, aby kontynuować rządy
    </p>
  </header>

  <div class="saves" id="saves"></div>

  <div class="status" id="status"
    role="status" aria-live="polite"></div>

  <div class="bottom">
    <a href="index.html" class="back" id="backBtn">
      ← POWRÓT
    </a>

    <a href="nowa-gra.html" class="back gold" id="newBtn">
      ✦ NOWA GRA
    </a>
  </div>

  <div class="footer">
    WŁADCA NARODÓW • ALPHA 0.2
  </div>

</section>
</main>

<script>
"use strict";

/*
  SYSTEM ZAPISÓW WŁADCA NARODÓW

  Klucz listy zapisów:
  wladcaNarodowSaves

  Klucz aktywnego zapisu:
  wladcaNarodowActiveSave

  Strona gry:
  gra.html
*/

const SAVE_KEY = "wladcaNarodowSaves";
const ACTIVE_KEY = "wladcaNarodowActiveSave";
const SETTINGS_KEY = "wladcaNarodowSettings";

const savesContainer = document.getElementById("saves");
const statusElement = document.getElementById("status");

let language = "pl";

try {
  const settings = JSON.parse(
    localStorage.getItem(SETTINGS_KEY) || "{}"
  );

  if (settings.language) {
    language = settings.language;
  }

  if (settings.animations === false) {
    document.body.style.animation = "none";

    document.querySelectorAll(".orb").forEach(orb => {
      orb.style.animation = "none";
    });
  }

  if (settings.particles === false) {
    document.querySelectorAll(".orb").forEach(orb => {
      orb.style.display = "none";
    });
  }
} catch {
  // Używamy ustawień domyślnych.
}

/* TŁUMACZENIA */

const translations = {
  pl: {
    title: "KONTYNUUJ GRĘ",
    subtitle: "Wybierz zapis, aby kontynuować rządy",
    empty: "Brak zapisanych gier",
    emptyInfo: "Rozpocznij nową grę, aby utworzyć pierwszy zapis.",
    load: "WCZYTAJ",
    delete: "USUŃ",
    back: "← POWRÓT",
    newGame: "✦ NOWA GRA",
    turn: "Tura",
    date: "Data gry",
    saved: "Zapisano",
    unknown: "Nieznane państwo",
    confirmDelete: "Czy na pewno usunąć ten zapis?",
    broken: "Nie udało się odczytać zapisów.",
    saveError: "Nie udało się wybrać zapisu."
  },
  en: {
    title: "CONTINUE GAME",
    subtitle: "Choose a save to continue ruling",
    empty: "No saved games",
    emptyInfo: "Start a new game to create your first save.",
    load: "LOAD",
    delete: "DELETE",
    back: "← BACK",
    newGame: "✦ NEW GAME",
    turn: "Turn",
    date: "Game date",
    saved: "Saved",
    unknown: "Unknown country",
    confirmDelete: "Delete this save?",
    broken: "Could not read saved games.",
    saveError: "Could not select the save."
  },
  es: {
    title: "CONTINUAR PARTIDA",
    subtitle: "Elige una partida guardada",
    empty: "No hay partidas guardadas",
    emptyInfo: "Inicia una nueva partida para crear un guardado.",
    load: "CARGAR",
    delete: "ELIMINAR",
    back: "← VOLVER",
    newGame: "✦ NUEVA PARTIDA",
    turn: "Turno",
    date: "Fecha del juego",
    saved: "Guardado",
    unknown: "País desconocido",
    confirmDelete: "¿Eliminar esta partida?",
    broken: "No se pudieron leer las partidas.",
    saveError: "No se pudo seleccionar la partida."
  },
  ru: {
    title: "ПРОДОЛЖИТЬ ИГРУ",
    subtitle: "Выберите сохранение",
    empty: "Нет сохранённых игр",
    emptyInfo: "Начните новую игру, чтобы создать сохранение.",
    load: "ЗАГРУЗИТЬ",
    delete: "УДАЛИТЬ",
    back: "← НАЗАД",
    newGame: "✦ НОВАЯ ИГРА",
    turn: "Ход",
    date: "Дата игры",
    saved: "Сохранено",
    unknown: "Неизвестная страна",
    confirmDelete: "Удалить это сохранение?",
    broken: "Не удалось прочитать сохранения.",
    saveError: "Не удалось выбрать сохранение."
  },
  de: {
    title: "SPIEL FORTSETZEN",
    subtitle: "Wähle einen Spielstand",
    empty: "Keine Spielstände",
    emptyInfo: "Starte ein neues Spiel, um einen Spielstand zu erstellen.",
    load: "LADEN",
    delete: "LÖSCHEN",
    back: "← ZURÜCK",
    newGame: "✦ NEUES SPIEL",
    turn: "Runde",
    date: "Spieldatum",
    saved: "Gespeichert",
    unknown: "Unbekanntes Land",
    confirmDelete: "Diesen Spielstand löschen?",
    broken: "Spielstände konnten nicht gelesen werden.",
    saveError: "Spielstand konnte nicht ausgewählt werden."
  },
  fr: {
    title: "CONTINUER",
    subtitle: "Choisissez une sauvegarde",
    empty: "Aucune sauvegarde",
    emptyInfo: "Commencez une partie pour créer une sauvegarde.",
    load: "CHARGER",
    delete: "SUPPRIMER",
    back: "← RETOUR",
    newGame: "✦ NOUVELLE PARTIE",
    turn: "Tour",
    date: "Date du jeu",
    saved: "Enregistré",
    unknown: "Pays inconnu",
    confirmDelete: "Supprimer cette sauvegarde ?",
    broken: "Impossible de lire les sauvegardes.",
    saveError: "Impossible de sélectionner la sauvegarde."
  },
  ar: {
    title: "متابعة اللعبة",
    subtitle: "اختر ملف حفظ للمتابعة",
    empty: "لا توجد ألعاب محفوظة",
    emptyInfo: "ابدأ لعبة جديدة لإنشاء أول حفظ.",
    load: "تحميل",
    delete: "حذف",
    back: "← رجوع",
    newGame: "✦ لعبة جديدة",
    turn: "الدور",
    date: "تاريخ اللعبة",
    saved: "تم الحفظ",
    unknown: "دولة غير معروفة",
    confirmDelete: "هل تريد حذف هذا الحفظ؟",
    broken: "تعذر قراءة الملفات المحفوظة.",
    saveError: "تعذر اختيار ملف الحفظ."
  }
};

const t = translations[language] || translations.pl;

document.documentElement.lang =
  translations[language] ? language : "pl";

document.documentElement.dir =
  language === "ar" ? "rtl" : "ltr";

document.getElementById("pageTitle").textContent = t.title;
document.getElementById("pageSubtitle").textContent = t.subtitle;
document.getElementById("backBtn").textContent = t.back;
document.getElementById("newBtn").textContent = t.newGame;

/* ODCZYT ZAPISÓW */

function getSaves() {
  const raw = localStorage.getItem(SAVE_KEY);

  if (!raw) return [];

  const saves = JSON.parse(raw);

  if (!Array.isArray(saves)) {
    throw new Error("Invalid save list");
  }

  return saves;
}

/* DATA ZAPISU */

function formatDate(value) {
  if (!value) return "—";

  const date = new Date(value);

  if (Number.isNaN(date.getTime())) {
    return "—";
  }

  return date.toLocaleString(
    language === "ar" ? "ar" : language,
    {
      year: "numeric",
      month: "short",
      day: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}

/* POMOCNICZE ELEMENTY */

function makeElement(tag, className, content) {
  const element = document.createElement(tag);
  element.className = className;

  if (content !== undefined) {
    element.textContent = String(content);
  }

  return element;
}

/* RYSOWANIE ZAPISÓW */

function renderSaves() {
  savesContainer.replaceChildren();
  statusElement.textContent = "";

  let saves;

  try {
    saves = getSaves();
  } catch {
    statusElement.textContent = t.broken;
    return;
  }

  if (saves.length === 0) {
    const empty = makeElement("div", "empty");
    empty.appendChild(
      makeElement("div", "empty-icon", "📂")
    );
    empty.appendChild(
      makeElement("h2", "", t.empty)
    );
    empty.appendChild(
      makeElement("p", "", t.emptyInfo)
    );
    savesContainer.appendChild(empty);
    return;
  }

  saves.sort((a, b) => {
    return new Date(b.savedAt || 0) -
           new Date(a.savedAt || 0);
  });

  saves.forEach(save => {
    if (!save || typeof save !== "object") return;

    const card = makeElement("article", "save-card");
    const info = makeElement("div", "");
    const actions = makeElement("div", "actions");

    const name = makeElement(
      "h2",
      "save-name",
      save.countryName || t.unknown
    );

    const details = makeElement("div", "save-details");

    details.appendChild(
      makeElement(
        "span",
        "",
        t.turn + ": " + (save.turn ?? 1)
      )
    );

    details.appendChild(
      makeElement(
        "span",
        "",
        t.date + ": " + (save.gameDate || "—")
      )
    );

    details.appendChild(
      makeElement(
        "span",
        "",
        t.saved + ": " + formatDate(save.savedAt)
      )
    );

    const loadButton = makeElement(
      "button",
      "small-btn gold",
      t.load
    );

    loadButton.type = "button";

    loadButton.addEventListener("click", () => {
      try {
        if (!save.id) {
          throw new Error("Missing save ID");
        }

        localStorage.setItem(
          ACTIVE_KEY,
          String(save.id)
        );

        window.location.href = "./gra.html";
      } catch {
        statusElement.textContent = t.saveError;
      }
    });

    const deleteButton = makeElement(
      "button",
      "small-btn danger",
      t.delete
    );

    deleteButton.type = "button";

    deleteButton.addEventListener("click", () => {
      if (!confirm(t.confirmDelete)) return;

      try {
        const updated = getSaves().filter(
          item => item && item.id !== save.id
        );

        localStorage.setItem(
          SAVE_KEY,
          JSON.stringify(updated)
        );

        if (
          localStorage.getItem(ACTIVE_KEY) ===
          String(save.id)
        ) {
          localStorage.removeItem(ACTIVE_KEY);
        }

        renderSaves();
      } catch {
        statusElement.textContent = t.broken;
      }
    });

    info.appendChild(name);
    info.appendChild(details);

    actions.appendChild(loadButton);
    actions.appendChild(deleteButton);

    card.appendChild(info);
    card.appendChild(actions);

    savesContainer.appendChild(card);
  });
}

renderSaves();

</script>
</body>
</html>
