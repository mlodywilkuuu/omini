<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fast Food Empire — World Tycoon</title><style>
:root{font-family:system-ui,sans-serif;color:#eef5ff;background:#0b1320}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 20px;background:#16263b;position:sticky;top:0;z-index:3;border-bottom:1px solid #314a62}header strong{color:#ffd16c}main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(310px,1fr);gap:14px;padding:14px}.panel{background:#15263a;border:1px solid #2c4660;border-radius:14px;padding:15px;min-width:0}button,select,input{font:inherit;border:1px solid #55718c;border-radius:8px;padding:8px;background:#233e5a;color:#fff}button{cursor:pointer}button:hover{background:#315a7e}button:disabled{opacity:.4;cursor:not-allowed}input{width:100%;margin:5px 0}nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}.active{background:#a66b24!important}.map{position:relative;min-height:520px;overflow:hidden;border-radius:12px;background:linear-gradient(130deg,#214b43,#315f48);border:2px solid #496d62}.map:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 84px,#70827b 85px 95px),repeating-linear-gradient(90deg,transparent 0 105px,#70827b 106px 118px);opacity:.7;pointer-events:none}.building{position:absolute;width:105px;min-height:64px;transform:translate(-50%,-50%);background:#f5d78d;color:#152332;border:3px solid #ad7834;box-shadow:0 5px 0 #183b30;font-weight:750;font-size:12px;z-index:1}.building.mine{background:#b5f2b6;border-color:#369a62}.building.selected{outline:3px solid #fff}.muted{color:#a9bfd4;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:9px 0}.row>*{max-width:100%}.tile{background:#203751;padding:10px;border-radius:10px;margin:8px 0;border:1px solid #3b536b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px}.stat{font-weight:750;color:#ffda81}h2{font-size:20px;margin:6px 0 12px}h3{font-size:16px;margin:12px 0 7px}p{line-height:1.5}#toast{position:fixed;right:15px;top:75px;z-index:10;pointer-events:none}.pop{padding:9px 15px;border-radius:9px;background:#18364a;margin:5px;animation:rise 2.1s forwards;border:1px solid #50768e}.plus{color:#70ffa7}.minus{color:#ff9797}@keyframes rise{to{opacity:0;transform:translateY(-65px)}}@media(max-width:850px){main{grid-template-columns:1fr}.map{min-height:450px}header{position:static}}
</style></head><body><header><strong>🍔 FAST FOOD EMPIRE</strong><span>💰 <b id="cash"></b></span><span>📈 <b id="rate"></b>/s</span><span>📅 Dzień <b id="day"></b></span><button onclick="save()">💾 Zapisz</button><button onclick="if(confirm('Usunąć postęp?')){localStorage.removeItem(KEY);location.reload()}">Nowa gra</button></header><main><section class="panel"><div class="row"><label>Kraj mapy <select id="country" onchange="S.country=this.value;S.selected=null;render()"></select></label><button onclick="build()">🏗️ Buduj lokal</button><button onclick="generate()">🔎 Odkryj firmę</button></div><div id="map" class="map"></div><p class="muted">Kliknij budynek, aby zobaczyć udziały, zarządzanie i przejęcie. Mapa jest fikcyjną mapą miast, a nie rzeczywistą mapą ulic.</p><h3>📰 Wiadomości gospodarcze</h3><div id="news"></div></section><section class="panel"><nav id="tabs"></nav><div id="content"></div></section></main><div id="toast"></div><script>
'use strict';const KEY='ffe-world-v3',COUNTRIES=['Polska','USA','Niemcy','Francja','Włochy','Japonia','Hiszpania','Wielka Brytania','Kanada','Brazylia','Indie','Australia'],BRANDS=['McDonald’s','KFC','Pizza Hut','Domino’s','Taco Bell','Burger King','Popeyes','Subway','Wendy’s','QuickBite','Golden Chicken','Pizza Planet','Burger Point'],FIRST=['Anna Nowak','Jan Kowalski','Marta Wiśniewska','Olivia Smith','Liam Brown','Sophia Garcia','Noah Wilson'],SPORTS=['Liga piłkarska','Turniej koszykówki','Grand Prix wyścigów','Turniej tenisowy','Liga siatkówki','Mistrzostwa hokejowe'],DRINKS=['Pepsi','Coca-Cola','Sprite','7UP','Fanta'];const pick=a=>a[Math.floor(Math.random()*a.length)],rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,fmt=n=>Math.round(n).toLocaleString('pl-PL')+' $',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch{}if(!S)S={cash:200000,debt:0,day:1,country:'Polska',tab:'Firma',selected:null,next:1,companies:[],subs:[],contracts:[],factories:[],warehouses:[],events:[],bankDeposit:0};S.companies??=[];S.subs??=[];S.contracts??=[];S.factories??=[];S.warehouses??=[];S.events??=[];S.bankDeposit??=0;S.next??=1;S.tab??='Firma';S.country??='Polska';
function company(name=pick(BRANDS),country=pick(COUNTRIES),owned=0){let id=S.next++;return{id,name,country,x:rnd(12,87),y:rnd(12,87),owned,holders:owned===100?[]:Array.from({length:4},(_,i)=>({name:pick(FIRST)+' '+rnd(1,999),shares:i===0?100-owned-3*Math.floor((100-owned)/4):Math.floor((100-owned)/4)})),price:rnd(350,1100),base:rnd(15,55),cost:rnd(5,14),staff:3,level:1,quality:70,priceFactor:1,sub:null,ai:owned===0};}
function normalize(c){let left=100-c.owned;let sum=c.holders.reduce((a,h)=>a+h.shares,0);if(sum!==left&&c.holders.length)c.holders[0].shares+=left-sum;}
if(!S.companies.length){for(let i=0;i<25;i++){let c=company(BRANDS[i%BRANDS.length],COUNTRIES[i%COUNTRIES.length]);normalize(c);S.companies.push(c)}}S.companies.forEach(normalize);
function toast(message,amount){let e=document.createElement('div');e.className='pop '+(amount>0?'plus':amount<0?'minus':'');e.textContent=(amount>0?'+':'')+(amount!==undefined?fmt(amount)+' • ':'')+message;document.getElementById('toast').append(e);setTimeout(()=>e.remove(),2100)}function spend(n,reason){n=Math.round(n);if(S.cash<n){toast('Za mało gotówki');return false}S.cash-=n;toast(reason,-n);return true}function earn(n,reason){S.cash+=n;toast(reason,n)}function save(){localStorage.setItem(KEY,JSON.stringify(S));toast('Zapisano grę')}function selected(){return S.companies.find(c=>c.id===S.selected)}function controlled(c){return c.owned>50}function factoryBonus(c){return S.factories.some(f=>f.country===c.country)?1.15:1}function logisticsBonus(c){return S.warehouses.some(f=>f.country===c.country)?1.1:1}function contractBonus(c){return 1+Math.min(.6,S.contracts.filter(k=>k.company===c.id).reduce((s,k)=>s+k.bonus,0))}function profit(c){return Math.max(-40,(c.base*c.level*c.priceFactor*(.5+c.quality/140)*factoryBonus(c)*logisticsBonus(c)*contractBonus(c)-c.cost-c.staff*2)*c.owned/100)}function rate(){return S.companies.reduce((a,c)=>a+profit(c),0)-S.debt*.000004+S.bankDeposit*.000001}
function generate(){if(S.companies.length>=120){toast('Limit 120 firm');return}let c=company();normalize(c);S.companies.push(c);S.events.unshift('Nowa firma: '+c.name+' ('+c.country+')');render()}function build(){let name=prompt('Nazwa nowej restauracji:','Moja Restauracja');if(!name?.trim())return;if(!spend(25000,'Budowa restauracji'))return;let c=company(name.trim().slice(0,40),S.country,100);c.holders=[];c.ai=false;S.companies.push(c);S.selected=c.id;render()}
function buy(id,i,n){let c=S.companies.find(c=>c.id===id),h=c?.holders[i];if(!h||h.shares<=0)return;let qty=Math.min(n,h.shares),price=Math.round(qty*c.price*(c.owned>=50?1.12:1));if(!spend(price,'Zakup '+qty+'% udziałów'))return;h.shares-=qty;c.owned+=qty;if(c.owned===100){c.ai=false;toast('👑 Pełne przejęcie!')}else if(c.owned>50)toast('🔓 Większość udziałów!');render()}
function manage(action){let c=selected();if(!c||!controlled(c))return;let cost=action==='level'?12000:action==='staff'?2500:4000;if(!spend(cost,'Rozwój restauracji'))return;if(action==='level')c.level++;if(action==='staff')c.staff++;if(action==='quality')c.quality=Math.min(100,c.quality+10);render()}
function priceChange(v){let c=selected();if(c&&controlled(c)){c.priceFactor=Number(v);render()}}function createSub(){let name=prompt('Nazwa spółki córki:');if(!name?.trim())return;let input=prompt('Kraje działalności (oddziel przecinkami):','Polska, Niemcy');if(input===null)return;let countries=parseCountries(input);if(!countries.length)return toast('Podaj kraj');S.subs.push({id:S.next++,name:name.trim().slice(0,45),countries,budget:0});render()}function parseCountries(s){return [...new Set(s.split(',').map(x=>x.trim()).filter(Boolean))].slice(0,20)}function editCountries(id){let sub=S.subs.find(x=>x.id===id),s=prompt('Kraje po przecinku:',sub.countries.join(', '));if(s===null)return;let arr=parseCountries(s);if(!arr.length)return toast('Zostaw przynajmniej jeden kraj');sub.countries=arr;render()}function assign(v){let c=selected();if(c&&c.owned===100){c.sub=v?Number(v):null;render()}}function transfer(id){let sub=S.subs.find(x=>x.id===id),n=Number(prompt('Wpłać środki do spółki córki:','10000'));if(!sub||!Number.isFinite(n)||n<=0)return;if(spend(n,'Kapitał spółki'))sub.budget+=n;render()}
function contract(type){let c=selected();if(!c||!controlled(c))return;let label=type==='sport'?pick(SPORTS):pick(DRINKS),cost=type==='sport'?18000:9000;if(!spend(cost,'Kontrakt: '+label))return;S.contracts.push({id:S.next++,company:c.id,type,label,bonus:type==='sport'?.13:.09,expires:S.day+45});render()}
function bank(type){let n=Number(prompt('Kwota w $:','10000'));if(!Number.isFinite(n)||n<=0)return;n=Math.round(n);if(type==='loan'){S.cash+=n;S.debt+=n;toast('Kredyt',n)}if(type==='repay'&&n<=S.debt&&spend(n,'Spłata kredytu'))S.debt-=n;if(type==='deposit'&&spend(n,'Lokata'))S.bankDeposit+=n;if(type==='withdraw'&&n<=S.bankDeposit){S.bankDeposit-=n;earn(n,'Wypłata lokaty')}render()}
function infrastructure(type){let cost=type==='factory'?60000:25000;if(!spend(cost,type==='factory'?'Fabryka':'Magazyn'))return;(type==='factory'?S.factories:S.warehouses).push({id:S.next++,country:S.country});render()}
function franchise(){let c=selected();if(!c||c.owned!==100)return;earn(9000,'Opłata franczyzowa');c.quality=Math.max(30,c.quality-3);render()}
function dividend(){let total=0;for(let c of S.companies)if(c.owned>0)total+=Math.max(0,profit(c))*15;earn(total,'Dywidenda symulacyjna');render()}
function aiTurn(){for(let c of S.companies){if(c.ai&&c.owned<100){c.base=Math.max(8,c.base+rnd(-3,4));c.price=Math.max(150,Math.round(c.price*(1+rnd(-5,6)/100)));if(Math.random()<.12)c.level++}}let story=pick(['Rosną ceny żywności','Nowe trendy w dostawach','Większy ruch w restauracjach','Konkurencja inwestuje w marketing']);S.events.unshift('Dzień '+S.day+': '+story);S.events=S.events.slice(0,8);if(S.companies.length<120&&Math.random()<.4){let c=company();normalize(c);S.companies.push(c)}}
function tick(){S.day++;let amount=rate()*5;S.cash+=amount;if(Math.abs(amount)>1)toast('Wynik działalności',amount);S.contracts=S.contracts.filter(k=>k.expires>S.day);if(S.day%6===0)aiTurn();localStorage.setItem(KEY,JSON.stringify(S));render()}
const tabs=['Firma','Holding','Giełda','Kontrakty','Bank','Logistyka','Raport'];function setTab(t){S.tab=t;render()}function viewCompany(){let c=selected();if(!c)return '<h2>🏪 Wybierz restaurację</h2><p>Kliknij budynek na mapie. Możesz kupować udziały od udziałowców albo budować własne lokale.</p>';let out='<h2>'+esc(c.name)+'</h2><p>🌍 '+esc(c.country)+' · Udziały: <b>'+c.owned+'%</b> · Cena 1%: '+fmt(c.price)+'</p><p>📈 Twój wynik: <span class="stat">'+fmt(profit(c))+'/s</span></p><h3>Udziałowcy</h3>';c.holders.forEach((h,i)=>{if(h.shares>0)out+='<div class="tile">'+esc(h.name)+' — '+h.shares+'%<div class="row"><button onclick="buy('+c.id+','+i+',1)">Kup 1%</button><button onclick="buy('+c.id+','+i+',10)">Kup do 10%</button><button onclick="buy('+c.id+','+i+','+h.shares+')">Kup pakiet</button></div></div>'});if(controlled(c))out+='<h3>🔓 Zarząd</h3><p>Poziom '+c.level+' · Pracownicy '+c.staff+' · Jakość '+c.quality+'%</p><div class="row"><button onclick="manage(\'level\')">Rozbuduj 12 000 $</button><button onclick="manage(\'staff\')">Zatrudnij 2 500 $</button><button onclick="manage(\'quality\')">Popraw jakość 4 000 $</button></div><label>Ceny menu <select onchange="priceChange(this.value)">'+[.8,1,1.2,1.5].map(v=>'<option value="'+v+'" '+(c.priceFactor===v?'selected':'')+'>'+Math.round(v*100)+'%</option>').join('')+'</select></label><div class="row"><button onclick="contract(\'sport\')">⚽ Sponsoring</button><button onclick="contract(\'drink\')">🥤 Napoje</button></div>';if(c.owned===100)out+='<h3>👑 Pełne przejęcie</h3><label>Spółka córka <select onchange="assign(this.value)"><option value="">Centrala</option>'+S.subs.map(s=>'<option value="'+s.id+'" '+(c.sub===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label><div class="row"><button onclick="franchise()">Sprzedaj franczyzę (+9 000 $)</button></div>';return out}
function viewHolding(){return '<h2>🏢 Holding i spółki córki</h2><button onclick="createSub()">+ Nowa spółka córka</button>'+S.subs.map(s=>'<div class="tile"><b>'+esc(s.name)+'</b><p>🌍 '+s.countries.map(esc).join(', ')+'</p><p>Budżet: '+fmt(s.budget)+' · Restauracje: '+S.companies.filter(c=>c.sub===s.id).length+'</p><div class="row"><button onclick="editCountries('+s.id+')">Zmień kraje</button><button onclick="transfer('+s.id+')">Zasil kapitał</button></div></div>').join('')+'<p class="muted">Przypisywanie restauracji do spółki córki jest dostępne po wykupieniu 100% udziałów.</p>'}
function viewStock(){return '<h2>📊 Rynek udziałów</h2><p>Notowania zmieniają się wraz z rozwojem konkurencji AI.</p>'+S.companies.slice(0,45).map(c=>'<div class="tile"><button onclick="S.country=\''+c.country+'\';S.selected='+c.id+';S.tab=\'Firma\';render()">'+esc(c.name)+'</button> '+esc(c.country)+' · '+fmt(c.price)+'/1% · Twoje '+c.owned+'%</div>').join('')}
function viewContracts(){return '<h2>🤝 Sponsoring i dostawcy</h2><p>Wybierz restaurację na mapie i zdobądź większość udziałów, aby podpisywać umowy.</p>'+S.contracts.map(k=>{let c=S.companies.find(c=>c.id===k.company);return '<div class="tile">'+esc(k.label)+' · '+esc(c?.name||'Firma')+' · wygasa dzień '+k.expires+'</div>'}).join('')}
function viewBank(){return '<h2>🏦 Bank i finanse</h2><p>Gotówka: '+fmt(S.cash)+'</p><p>Dług: '+fmt(S.debt)+'</p><p>Lokaty: '+fmt(S.bankDeposit)+'</p><div class="row"><button onclick="bank(\'loan\')">Weź kredyt</button><button onclick="bank(\'repay\')">Spłać kredyt</button><button onclick="bank(\'deposit\')">Wpłać na lokatę</button><button onclick="bank(\'withdraw\')">Wypłać lokatę</button></div><p class="muted">Kredyty generują koszty odsetek, a lokaty niewielki przychód.</p>'}
function viewLogistics(){return '<h2>🏭 Produkcja i logistyka</h2><p>Infrastruktura w kraju: '+esc(S.country)+'</p><div class="row"><button onclick="infrastructure(\'factory\')">Fabryka 60 000 $</button><button onclick="infrastructure(\'warehouse\')">Magazyn 25 000 $</button></div><h3>Fabryki</h3>'+S.factories.map(f=>'<div class="tile">🏭 '+esc(f.country)+'</div>').join('')+'<h3>Magazyny</h3>'+S.warehouses.map(f=>'<div class="tile">🚚 '+esc(f.country)+'</div>').join('')+'<p class="muted">Infrastruktura zwiększa dochód restauracji w danym kraju.</p>'}
function viewReport(){return '<h2>📈 Raport holdingu</h2><div class="grid"><div class="tile">Restauracje: <b>'+S.companies.length+'</b></div><div class="tile">Pełne przejęcia: <b>'+S.companies.filter(c=>c.owned===100).length+'</b></div><div class="tile">Spółki córki: <b>'+S.subs.length+'</b></div><div class="tile">Wynik / s: <b>'+fmt(rate())+'</b></div></div><button onclick="dividend()">Wypłać dywidendę (symulacja)</button><p class="muted">Podatki i prawo są uproszczone: koszty działalności uwzględniono w wyniku lokali. To gra ekonomiczna, nie rzeczywisty model prawny.</p>'}
function render(){document.getElementById('cash').textContent=fmt(S.cash);document.getElementById('rate').textContent=fmt(rate());document.getElementById('day').textContent=S.day;document.getElementById('country').innerHTML=COUNTRIES.map(x=>'<option '+(x===S.country?'selected':'')+'>'+esc(x)+'</option>').join('');document.getElementById('map').innerHTML=S.companies.filter(c=>c.country===S.country).map(c=>'<button class="building '+(c.owned===100?'mine ':'')+(S.selected===c.id?'selected':'')+'" style="left:'+c.x+'%;top:'+c.y+'%" onclick="S.selected='+c.id+';S.tab=\'Firma\';render()">🏪 '+esc(c.name)+'<br>'+c.owned+'% udziałów</button>').join('');document.getElementById('news').innerHTML=(S.events.slice(0,3).map(e=>'<p class="muted">📰 '+esc(e)+'</p>').join('')||'<p class="muted">Nowe wiadomości pojawią się w kolejnych dniach.</p>');document.getElementById('tabs').innerHTML=tabs.map(t=>'<button class="'+(S.tab===t?'active':'')+'" onclick="setTab(\''+t+'\')">'+t+'</button>').join('');document.getElementById('content').innerHTML=({Firma:viewCompany,Holding:viewHolding,'Giełda':viewStock,Kontrakty:viewContracts,Bank:viewBank,Logistyka:viewLogistics,Raport:viewReport}[S.tab]||viewCompany)()}
render();setInterval(tick,5000);window.addEventListener('beforeunload',()=>localStorage.setItem(KEY,JSON.stringify(S)));
</script></body></html>
