<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamForge</title>

<style>
:root{
  --bg:#080b10;
  --p:#10151d;
  --p2:#151c26;
  --line:#263141;
  --txt:#eef3f8;
  --mut:#91a0b3;
  --a:#ff3d55;
  --g:#3ddc97
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--txt);
  font:14px system-ui
}

.app{
  display:grid;
  grid-template-columns:230px 1fr;
  min-height:100vh
}

aside{
  background:#0c1118;
  border-right:1px solid var(--line);
  padding:20px 14px
}

.logo{
  font-size:21px;
  font-weight:900;
  margin:4px 8px 25px
}

.logo b{color:var(--a)}

.nav{
  width:100%;
  border:0;
  background:transparent;
  color:#aeb8c6;
  padding:11px;
  border-radius:9px;
  text-align:left;
  margin:2px;
  cursor:pointer
}

.nav.active,
.nav:hover{
  background:#1c2633;
  color:white
}

.nav span{
  display:inline-block;
  width:28px
}

.top{
  height:70px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  background:#0c1118
}

.stats,
.row{
  display:flex;
  gap:9px;
  align-items:center;
  flex-wrap:wrap
}

.pill,
.card{
  background:var(--p);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px
}

.content{
  padding:24px;
  max-width:1400px;
  margin:auto
}

.hero{
  background:linear-gradient(135deg,#1c1a28,#121923);
  border:1px solid #343246;
  padding:22px;
  border-radius:18px;
  margin-bottom:16px
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:12px;
  margin:12px 0
}

.mut{color:var(--mut)}

button,input,select{
  font:inherit
}

.btn{
  border:1px solid #39475a;
  background:#202b39;
  color:white;
  padding:9px 12px;
  border-radius:9px;
  cursor:pointer
}

.primary{
  background:var(--a);
  border-color:var(--a);
  font-weight:800
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--p)
}

th,td{
  padding:10px;
  border-bottom:1px solid var(--line);
  text-align:left
}

input,select{
  background:#0b1017;
  color:white;
  border:1px solid #354254;
  border-radius:8px;
  padding:8px
}

.good{color:var(--g)}
.bad{color:#ff7183}

.decision{
  border-left:4px solid #ffc857
}

@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .top{height:auto;padding:12px}
  .content{padding:12px}
}
</style>
</head>

<body>

<div class="app">

<aside>

<div class="logo">
▶ <b>Stream</b>Forge
<div class="mut" style="font-size:10px">
VIDEO PLATFORM SIMULATOR
</div>
</div>

<button class="nav active" data-p="dash">
<span>📊</span>Dashboard
</button>

<button class="nav" data-p="office">
<span>🏢</span>Biuro i pracownicy
</button>

<button class="nav" data-p="service">
<span>🎨</span>Serwis
</button>

<button class="nav" data-p="tech">
<span>🧪</span>Technologie
</button>

<button class="nav" data-p="infra">
<span>🖥️</span>Infrastruktura
</button>

<button class="nav" data-p="creators">
<span>🎬</span>Twórcy
</button>

<button class="nav" data-p="premium">
<span>💎</span>Subskrypcje
</button>

<button class="nav" data-p="ads">
<span>📣</span>Reklamy
</button>

<button class="nav" data-p="finance">
<span>💰</span>Finanse
</button>

<button class="nav" data-p="decisions">
<span>🔔</span>Centrum decyzji
</button>

</aside>

<main>

<div class="top">

<b id="date"></b>

<div class="stats">

<div class="pill">
💰 <b id="money"></b>
</div>

<div class="pill">
👥 <b id="users"></b>
</div>

<div class="pill">
🖥️ <b id="load"></b>
</div>

<button class="btn" onclick="speed()">
⏩ <span id="speed">x1</span>
</button>

<button class="btn" onclick="save()">
💾
</button>

</div>
</div>

<div class="content" id="panel"></div>

</main>
</div>

<script>

const F=n=>Math.round(n).toLocaleString('pl-PL');

const fresh=()=>({
  day:1,
  month:1,
  year:2026,

  money:250000,

  users:1500,
  active:.42,

  reputation:50,

  dev:0,
  design:0,

  servers:2,
  serverCapacity:5000,

  storage:10,

  premiumPrice:24.99,
  premiumUsers:0,

  adCPM:8,
  adLoad:2,

  creators:12,
  videos:45,

  version:1,
  ui:'Klasyczny',

  speed:1,

  staff:[],

  unlocked:[
    'Komentarze'
  ],

  ledger:[],

  decisions:[],

  nextDecision:1
});

let G;

try{
  G=JSON.parse(
    localStorage.getItem('streamforge-save')
  ) || fresh();
}
catch(e){
  G=fresh();
}

/* =========================
   PRACOWNICY
========================= */

const roles={

  'Programista':{
    salary:8500,
    dev:7,
    design:0
  },

  'Designer UI/UX':{
    salary:7200,
    dev:1,
    design:8
  },

  'Administrator serwerów':{
    salary:7800,
    dev:1,
    design:0
  },

  'Moderator':{
    salary:5200,
    dev:0,
    design:0
  },

  'Marketing':{
    salary:6500,
    dev:0,
    design:1
  },

  'Sprzedaż reklam':{
    salary:7000,
    dev:0,
    design:0
  },

  'Support':{
    salary:5000,
    dev:0,
    design:0
  }
};

/* =========================
   TECHNOLOGIE
========================= */

const techs=[

  ['Wyszukiwarka',120,20000],

  ['Kanały twórców',160,30000],

  ['1080p',220,50000],

  ['Aplikacja mobilna',300,80000],

  ['Rekomendacje v1',380,100000],

  ['Transmisje live',500,150000],

  ['Krótkie filmy',600,180000],

  ['4K',750,250000],

  ['Smart TV',900,320000],

  ['Rekomendacje AI',1200,500000],

  ['Studio twórcy Pro',1500,700000]

];

/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem(
    'streamforge-save',
    JSON.stringify(G)
  );

}

/* =========================
   INFRASTRUKTURA
========================= */

function cap(){

  return G.servers *
         G.serverCapacity;

}

function load(){

  return Math.min(
    200,
    G.users / cap() * 100
  );

}

/* =========================
   PRACOWNICY
========================= */

function cnt(r){

  return G.staff.filter(
    x=>x.role===r
  ).length;

}

/* =========================
   FINANSE
========================= */

function cash(v,c,d){

  G.money+=v;

  G.ledger.unshift({

    date:`${G.day}.${G.month}.${G.year}`,

    value:v,

    category:c,

    description:d

  });

  G.ledger=
    G.ledger.slice(0,300);

}

/* =========================
   DECYZJE
========================= */

function decision(title,text){

  if(
    G.decisions.some(
      d=>d.open &&
      d.title===title
    )
  ) return;

  G.decisions.unshift({

    id:G.nextDecision++,

    title,

    text,

    open:true

  });

}

function closeDecision(id){

  const d=
    G.decisions.find(
      x=>x.id===id
    );

  if(d)
    d.open=false;

  render();

}

/* =========================
   DZIEŃ GRY
========================= */

function day(){

  /* R&D */

  G.dev +=
    G.staff.reduce(
      (a,s)=>
        a+(roles[s.role].dev||0),
      0
    ) / 30;

  G.design +=
    G.staff.reduce(
      (a,s)=>
        a+(roles[s.role].design||0),
      0
    ) / 30;


  /* WZROST UŻYTKOWNIKÓW */

  let growth =
    .002 +
    (G.reputation-50)/50000 +
    G.unlocked.length*.00012;


  /* PRZECIĄŻENIE */

  if(load()>90)
    growth-=.008;


  const newUsers =
    Math.max(
      -G.users*.02,
      G.users*growth
    );


  G.users=
    Math.max(
      0,
      G.users+newUsers
    );


  /* TWÓRCY */

  G.creators +=
    Math.max(
      0,
      newUsers/700
    );


  G.videos +=
    Math.max(
      1,
      G.creators*.015
    );


  /* PREMIUM */

  const premiumTarget=
    Math.min(
      .18,
      .005 +
      G.reputation/1200 +
      G.unlocked.length/1000
    );


  G.premiumUsers +=
    (
      G.users*premiumTarget -
      G.premiumUsers
    )*.01;


  /* REKLAMY */

  const adRevenue=

    G.users *
    G.active *
    3 /
    1000 *
    G.adCPM *
    G.adLoad *
    .55;


  /* PREMIUM */

  const premiumRevenue=

    G.premiumUsers *
    G.premiumPrice /
    30;


  /* PENSJE */

  const salaries=

    G.staff.reduce(
      (a,s)=>
        a+
        roles[s.role].salary/30,
      0
    );


  /* SERWERY */

  const serversCost=

    G.servers*55 +
    G.storage*3;


  /* WYNIK */

  cash(

    adRevenue +
    premiumRevenue -
    salaries -
    serversCost,

    'Dzienny wynik',

    'Reklamy + Premium - koszty'

  );


  /* ALERT SERWERÓW */

  if(load()>85){

    decision(

      'Serwery przeciążone',

      `Obciążenie wynosi ${load().toFixed(0)}%. Rozbuduj infrastrukturę.`

    );

  }


  /* ALERT MODERATORÓW */

  if(
    G.staff.length>8 &&
    !cnt('Moderator')
  ){

    decision(

      'Brak moderatorów',

      'Platforma rośnie. Zatrudnij moderatorów.'

    );

  }


  /* DATA */

  G.day++;

  if(G.day>30){

    G.day=1;
    G.month++;

    if(G.month>12){

      G.month=1;
      G.year++;

    }

  }

}

/* =========================
   CZAS
========================= */

setInterval(()=>{

  for(
    let i=0;
    i<G.speed;
    i++
  ){

    day();

  }

  save();
  render();

},1200);


function speed(){

  G.speed =
    G.speed===1
      ? 2
      : G.speed===2
        ? 5
        : 1;

  render();

}

/* =========================
   ZATRUDNIANIE
========================= */

function hire(role){

  const salary=
    roles[role].salary;

  if(G.money<salary){

    alert(
      'Za mało pieniędzy.'
    );

    return;

  }

  cash(
    -salary,
    'HR',
    'Zatrudnienie: '+role
  );

  G.staff.push({

    id:
      Date.now()+
      Math.random(),

    role,

    exp:1

  });

  render();

}


function fire(id){

  G.staff=
    G.staff.filter(
      x=>x.id!==id
    );

  render();

}

/* =========================
   SERWERY
========================= */

function buyServer(){

  if(G.money<60000){

    alert(
      'Za mało pieniędzy.'
    );

    return;

  }

  cash(
    -60000,
    'Infrastruktura',
    'Nowy serwer'
  );

  G.servers++;

  render();

}


function buyStorage(){

  if(G.money<15000){

    alert(
      'Za mało pieniędzy.'
    );

    return;

  }

  cash(
    -15000,
    'Infrastruktura',
    'Storage +10 TB'
  );

  G.storage+=10;

  render();

}

/* =========================
   TECHNOLOGIE
========================= */

function unlock(
  name,
  costDev,
  costMoney
){

  if(
    G.unlocked.includes(name)
  )
    return;


  if(
    G.dev<costDev ||
    G.money<costMoney
  ){

    alert(
      'Brakuje punktów R&D lub pieniędzy.'
    );

    return;

  }


  G.dev-=costDev;


  cash(
    -costMoney,
    'R&D',
    'Technologia: '+name
  );


  G.unlocked.push(name);


  G.reputation+=2;


  render();

}

/* =========================
   NOWY WYGLĄD
========================= */

function redesign(){

  if(
    G.design<80 ||
    G.money<25000
  ){

    alert(
      'Potrzebujesz 80 pkt designu i 25 000 zł.'
    );

    return;

  }


  G.design-=80;


  cash(
    -25000,
    'Serwis',
    'Nowy wygląd'
  );


  G.version++;


  const styles=[

    'Klasyczny',
    'Nowoczesny',
    'Minimal',
    'Cinema',
    'Dynamic'

  ];


  G.ui=
    styles[
      G.version %
      styles.length
    ];


  G.reputation+=3;


  render();

}

/* =========================
   KARTY
========================= */

function stat(
  title,
  value,
  description
){

  return `

  <div class="card">

    <div class="mut">
      ${title}
    </div>

    <h2>
      ${value}
    </h2>

    <div class="mut">
      ${description}
    </div>

  </div>

  `;

}

/* =========================
   DASHBOARD
========================= */

function dash(){

  return `

  <div class="hero">

    <h1>
      ▶ StreamForge
    </h1>

    <p class="mut">
      Buduj własną platformę wideo.
      Zatrudniaj pracowników,
      rozwijaj technologie,
      zdobywaj użytkowników
      i skaluj infrastrukturę.
    </p>

  </div>


  <div class="grid">

    ${stat(
      '👥 Użytkownicy',
      F(G.users),
      (G.active*100).toFixed(0)
      +'% aktywnych'
    )}


    ${stat(
      '🎬 Twórcy',
      F(G.creators),
      F(G.videos)+' filmów'
    )}


    ${stat(
      '💎 Premium',
      F(G.premiumUsers),
      G.premiumPrice.toFixed(2)
      +' zł/mies.'
    )}


    ${stat(
      '⭐ Reputacja',
      G.reputation.toFixed(0)
      +'/100',
      'Wersja '+G.version
    )}


    ${stat(
      '🧪 R&D',
      G.dev.toFixed(1),
      G.design.toFixed(1)
      +' design'
    )}


    ${stat(
      '🖥️ Obciążenie',
      load().toFixed(1)+'%',
      F(cap())+
      ' pojemności'
    )}

  </div>

  `;

}

/* =========================
   BIURO
========================= */

function office(){

  return `

  <h1>
    🏢 Biuro i pracownicy
  </h1>


  <div class="card row">

    <select id="role">

      ${Object.keys(roles)
        .map(
          r=>`<option>${r}</option>`
        )
        .join('')}

    </select>


    <button
      class="btn primary"
      onclick="
        hire(
          document.getElementById('role').value
        )
      "
    >

      ＋ Zatrudnij

    </button>

  </div>


  <div class="grid">

    ${Object.entries(roles)
      .map(
        ([role,data])=>
          stat(
            role,
            cnt(role),
            F(data.salary)
            +' zł/mies.'
          )
      )
      .join('')}

  </div>


  <table>

    <tr>

      <th>
        Stanowisko
      </th>

      <th>
        Doświadczenie
      </th>

      <th>
        Pensja
      </th>

      <th></th>

    </tr>


    ${G.staff
      .map(
        s=>`

        <tr>

          <td>
            ${s.role}
          </td>

          <td>
            ${s.exp.toFixed(1)}
          </td>

          <td>
            ${F(
              roles[s.role].salary
            )} zł
          </td>

          <td>

            <button
              class="btn"
              onclick="
                fire(${s.id})
              "
            >

              Zwolnij

            </button>

          </td>

        </tr>

        `
      )
      .join('')}

  </table>

  `;

}

/* =========================
   SERWIS
========================= */

function service(){

  return `

  <h1>
    🎨 Rozwój serwisu
  </h1>


  <div class="hero">

    <h2>
      Interfejs:
      ${G.ui}
    </h2>


    <p>
      Wersja ${G.version}.0
      • reputacja
      ${G.reputation.toFixed(0)}/100
    </p>


    <button
      class="btn primary"
      onclick="redesign()"
    >

      🎨 Wydaj nowy wygląd
      — 80 design /
      25 000 zł

    </button>

  </div>


  <div class="grid">

    ${G.unlocked
      .map(
        x=>`

        <div class="card">

          ✅
          <b>${x}</b>

        </div>

        `
      )
      .join('')}

  </div>

  `;

}

/* =========================
   TECHNOLOGIE
========================= */

function technology(){

  return `

  <h1>
    🧪 Technologie
  </h1>


  <p>

    R&D:

    <b>
      ${G.dev.toFixed(1)}
    </b>

    pkt

  </p>


  <div class="grid">

    ${techs
      .map(
        t=>`

        <div class="card">

          <h3>

            ${
              G.unlocked.includes(t[0])
              ? '✅'
              : '🔬'
            }

            ${t[0]}

          </h3>


          <p class="mut">

            ${t[1]} R&D
            •
            ${F(t[2])} zł

          </p>


          <button
            class="btn"

            ${
              G.unlocked.includes(t[0])
              ? 'disabled'
              : ''
            }

            onclick='
              unlock(
                ${JSON.stringify(t[0])},
                ${t[1]},
                ${t[2]}
              )
            '
          >

            Opracuj

          </button>

        </div>

        `
      )
      .join('')}

  </div>

  `;

}

/* =========================
   INFRASTRUKTURA
========================= */

function infra(){

  return `

  <h1>
    🖥️ Infrastruktura
  </h1>


  <div class="grid">

    ${stat(
      'Serwery',
      G.servers,
      F(cap())+
      ' użytkowników'
    )}


    ${stat(
      'Storage',
      G.storage+' TB',
      F(G.videos)+
      ' filmów'
    )}


    ${stat(
      'Obciążenie',
      load().toFixed(1)+'%',
      'Cel: poniżej 80%'
    )}

  </div>


  <div class="card row">

    <button
      class="btn primary"
      onclick="buyServer()"
    >

      ＋ Serwer
      — 60 000 zł

    </button>


    <button
      class="btn"
      onclick="buyStorage()"
    >

      ＋ 10 TB
      — 15 000 zł

    </button>

  </div>

  `;

}

/* =========================
   TWÓRCY
========================= */

function creators(){

  const top=
    Math.max(
      100,
      Math.round(
        G.users*.12
      )
    );


  return `

  <h1>
    🎬 Twórcy
  </h1>


  <div class="grid">

    ${stat(
      'Kanały',
      F(G.creators),
      'rosną automatycznie'
    )}


    ${stat(
      'Filmy',
      F(G.videos),
      'biblioteka platformy'
    )}


    ${stat(
      'Największy kanał',
      F(top),
      'subskrybentów'
    )}

  </div>


  <div class="card">

    <h3>
      Ekosystem twórców
    </h3>

    <p class="mut">

      Wzrost liczby użytkowników
      przyciąga nowych twórców.

      Technologie takie jak
      transmisje live,
      4K czy Studio Pro
      zwiększają atrakcyjność
      platformy.

    </p>

  </div>

  `;

}

/* =========================
   PREMIUM
========================= */

function premium(){

  return `

  <h1>
    💎 Subskrypcje
  </h1>


  <div class="grid">

    ${stat(
      'Premium',
      F(G.premiumUsers),
      (
        G.premiumUsers /
        Math.max(1,G.users) *
        100
      ).toFixed(2)
      +'% użytkowników'
    )}


    ${stat(
      'Cena',
      G.premiumPrice.toFixed(2)
      +' zł',
      'miesięcznie'
    )}

  </div>


  <div class="card">

    <label>

      Cena Premium:

      <input
        type="number"
        step=".01"
        value="${G.premiumPrice}"

        onchange="
          G.premiumPrice=
            Math.max(
              1,
              Number(this.value)
            );

          render();
        "
      >

      zł

    </label>


    <p class="mut">

      Rozwój funkcji,
      reputacja platformy
      i cena wpływają
      na zainteresowanie Premium.

    </p>

  </div>

  `;

}

/* =========================
   REKLAMY
========================= */

function ads(){

  const views=
    G.users *
    G.active *
    3;


  return `

  <h1>
    📣 Reklamy
  </h1>


  <div class="grid">

    ${stat(
      'CPM',
      G.adCPM.toFixed(2)
      +' zł',
      'za 1000 wyświetleń'
    )}


    ${stat(
      'Dzienne odsłony reklam',
      F(
        views *
        G.adLoad
      ),
      G.adLoad+
      ' sloty'
    )}

  </div>


  <div class="card">

    <label>

      Liczba reklam:

      <input
        type="range"
        min="1"
        max="5"
        value="${G.adLoad}"

        onchange="
          G.adLoad=
            Number(this.value);

          render();
        "
      >

      ${G.adLoad}

    </label>

  </div>

  `;

}

/* =========================
   FINANSE
========================= */

function finance(){

  const groups={};


  G.ledger.forEach(
    x=>{

      groups[x.category] =
        (
          groups[x.category] ||
          0
        )
        +
        x.value;

    }
  );


  return `

  <h1>
    💰 Finanse
  </h1>


  <div class="grid">

    ${stat(
      'Gotówka',
      F(G.money)+' zł',
      'saldo firmy'
    )}


    ${Object.entries(groups)
      .slice(0,5)
      .map(
        ([name,value])=>
          stat(
            name,
            F(value)+' zł',
            'zaksięgowane'
          )
      )
      .join('')}

  </div>


  <table>

    <tr>

      <th>
        Data
      </th>

      <th>
        Kategoria
      </th>

      <th>
        Opis
      </th>

      <th>
        Kwota
      </th>

    </tr>


    ${G.ledger
      .slice(0,30)
      .map(
        x=>`

        <tr>

          <td>
            ${x.date}
          </td>

          <td>
            ${x.category}
          </td>

          <td>
            ${x.description}
          </td>

          <td
            class="${
              x.value>=0
              ? 'good'
              : 'bad'
            }"
          >

            ${F(x.value)} zł

          </td>

        </tr>

        `
      )
      .join('')}

  </table>

  `;

}

/* =========================
   CENTRUM DECYZJI
========================= */

function decisions(){

  const open=
    G.decisions.filter(
      x=>x.open
    );


  return `

  <h1>
    🔔 Centrum decyzji
  </h1>


  ${
    open
      .map(
        x=>`

        <div class="card decision">

          <h3>
            ${x.title}
          </h3>

          <p>
            ${x.text}
          </p>

          <button
            class="btn"
            onclick="
              closeDecision(${x.id})
            "
          >

            ✓ Zamknij

          </button>

        </div>

        `
      )
      .join('')

      ||

      `

      <div class="card">

        Brak pilnych spraw.

      </div>

      `
  }

  `;

}

/* =========================
   MENU
========================= */

document
.querySelectorAll('.nav')
.forEach(

  button=>{

    button.onclick=()=>{

      document
      .querySelectorAll('.nav')
      .forEach(
        x=>
          x.classList.remove(
            'active'
          )
      );


      button
      .classList
      .add('active');


      render();

    };

  }

);

/* =========================
   RENDER
========================= */

function render(){

  document
  .getElementById('date')
  .textContent=
    `Dzień ${G.day} • ${G.month}/${G.year}`;


  document
  .getElementById('money')
  .textContent=
    F(G.money)+' zł';


  document
  .getElementById('users')
  .textContent=
    F(G.users);


  document
  .getElementById('load')
  .textContent=
    load().toFixed(0)+'%';


  document
  .getElementById('speed')
  .textContent=
    'x'+G.speed;


  const current=
    document
    .querySelector(
      '.nav.active'
    )
    .dataset.p;


  const pages={

    dash,

    office,

    service,

    tech:technology,

    infra,

    creators,

    premium,

    ads,

    finance,

    decisions

  };


  document
  .getElementById('panel')
  .innerHTML=
    pages[current]();

}

render();

</script>

</body>
</html>
