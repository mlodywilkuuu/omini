<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101713">
  <meta name="description" content="Market Tycoon — zbuduj własne imperium handlowe.">
  <title>MARKET TYCOON — Imperium handlowe</title>
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="Market Tycoon"><span class="brand-kicker">BUSINESS SIMULATOR</span><strong>MARKET <em>TYCOON</em></strong></a>
      <div class="holding-card"><small>TWÓJ HOLDING</small><b>Wilk Investments</b><span id="levelText">Poziom 1 · Początkujący</span></div>
      <nav class="navigation" aria-label="Główna nawigacja">
        <span class="nav-label">ZARZĄDZANIE</span>
        <button class="nav-link active" data-page="overview"><i>▦</i>Pulpit główny</button>
        <button class="nav-link" data-page="shops"><i>▤</i>Moje sklepy</button>
        <button class="nav-link" data-page="companies"><i>◈</i>Spółki córki</button>
        <button class="nav-link" data-page="market"><i>▥</i>Giełda udziałów</button>
        <button class="nav-link" data-page="districts"><i>⌖</i>Rejony działania</button>
        <button class="nav-link" data-page="finance"><i>↗</i>Finanse</button>
      </nav>
      <div class="sidebar-footer">WŁAŚCICIEL HOLDINGU<br><b>Ty decydujesz o rozwoju.</b><br>Wersja 0.2 · modułowa</div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="breadcrumb">MARKET TYCOON <span>/</span> <b id="breadcrumb">Pulpit główny</b></div><div class="top-actions"><div class="top-pill">DZIEŃ <b id="day">1</b></div><div class="top-pill">KAPITAŁ <b id="topCash">250 000 zł</b></div><button class="button button-primary" id="nextDay">▶ Następny dzień</button></div></header>
      <div class="content">
        <section id="page-overview" class="page"></section>
        <section id="page-shops" class="page hidden"></section>
        <section id="page-companies" class="page hidden"></section>
        <section id="page-market" class="page hidden"></section>
        <section id="page-districts" class="page hidden"></section>
        <section id="page-finance" class="page hidden"></section>
      </div>
    </main>
  </div>
  <dialog id="modal" class="modal"><form method="dialog"><button class="modal-close" aria-label="Zamknij">×</button></form><h2 id="modalTitle"></h2><p id="modalDescription"></p><div id="modalBody"></div><div class="modal-actions"><button class="button button-ghost" id="modalCancel">Anuluj</button><button class="button button-primary" id="modalConfirm">Potwierdź</button></div></dialog>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
