</style></head><body><header><div><h1>♻ WASTE EMPIRE</h1><small>Ekonomiczna strategia odpadowa · wersja 0.2</small></div><div class="stats"><span>📅 <b id="date"></b></span><span>💰 <b id="cash"></b></span><span>🚛 <b id="fleet"></b></span><span>🏢 <b id="subs"></b></span><button id="pause">⏸ Pauza</button><select id="speed" style="width:92px;margin:0"><option value="1">×1</option><option value="5" selected>×5</option><option value="15">×15</option><option value="60">×60</option></select></div></header><main><nav id="nav"></nav><div id="map"></div><aside class="panel" id="panel"></aside></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const money=n=>Math.round(n).toLocaleString('pl-PL')+' zł';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const seed=()=>({month:0,gameMinutes:0,paused:false,speed:5,lastDay:-1,lastWeek:-1,lastMonth:-1,research:0,tech:[],materials:{plastik:0,papier:0,szklo:0,metal:0,bio:0},prices:{plastik:510,papier:240,szklo:135,metal:920,bio:90},reputation:72,complaints:0,energy:100,loans:0,cash:4000000,vehicles:3,workers:8,subs:[],routes:[{street:'Lipowa',waste:'Zmieszane',day:'Poniedziałek',price:390,vehicle:1}],contracts:[0],shares:{},buildings:[],logs:['Witaj w Waste Empire. Wybierz sektor na mapie.'],ai:[{name:'EcoMax',cash:3800000,vehicles:5,subs:0,shares:0},{name:'GreenPol',cash:2600000,vehicles:4,subs:0,shares:0},{name:'Recyklon',cash:2100000,vehicles:3,subs:0,shares:0}]});let s;try{s=JSON.parse(localStorage.getItem('waste-empire-v1'))||seed()}catch{s=seed()};s={...seed(),...s};s.materials={...seed().materials,...s.materials};s.prices={...seed().prices,...s.prices};if(!Array.isArray(s.tech))s.tech=[];const sectors=[{name:'Centrum',xy:[53.133,23.16],radius:1350,tons:420,fee:420,owner:'Gracz'},{name:'Antoniuk',xy:[53.148,23.135],radius:1250,tons:350,fee:405,owner:'EcoMax'},{name:'Piaski',xy:[53.119,23.163],radius:1100,tons:300,fee:430,owner:'GreenPol'},{name:'Białostoczek',xy:[53.148,23.172],radius:1200,tons:370,fee:415,owner:'Recyklon'},{name:'Nowe Miasto',xy:[53.106,23.149],radius:1450,tons:470,fee:400,owner:'EcoMax'},{name:'Wygoda',xy:[53.145,23.204],radius:1250,tons:320,fee:440,owner:'GreenPol'}];const tabs=[['mapa','🗺 Mapa i sektory'],['przetargi','📑 Przetargi'],['flota','🚛 Flota i kadry'],['trasy','📅 Harmonogramy'],['spolki','🏢 Spółki córki'],['udzialy','📈 Udziały firm'],['zaklady','🏭 Zakłady'],['rynek','🤖 Konkurencja AI'],['badania','🔬 Badania'],['handel','📦 Rynek surowców'],['miasto','🏙 Mieszkańcy'],['raport','💹 Finanse i zapis']];let tab='mapa',selected=0;const save=()=>localStorage.setItem('waste-empire-v1',JSON.stringify(s));const note=t=>{s.logs.unshift('M'+(s.month+1)+': '+t);s.logs=s.logs.slice(0,35)};const owned=i=>s.contracts.includes(i);const button=(label,action,disabled=false)=>`<button ${disabled?'disabled':''} data-action="${action}">${label}</button>`;const map=L.map('map').setView([53.1325,23.165],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);const layers=[];sectors.forEach((x,i)=>{const l=L.circle(x.xy,{radius:x.radius,weight:2,color:'#2bbd88',fillOpacity:.16}).addTo(map);l.on('click',()=>{selected=i;tab='mapa';render()});layers.push(l)});function updateMap(){sectors.forEach((x,i)=>{let color=owned(i)?'#17bd7d':'#f1a84b';layers[i].setStyle({color,fillColor:color,fillOpacity:selected===i?.26:.12,weight:selected===i?4:2});layers[i].bindTooltip(x.name+' · '+(owned(i)?'Twoja firma':'Konkurencja'))})}function spend(n){if(s.cash<n){alert('Brak środków: potrzebujesz '+money(n));return false}s.cash-=n;return true}function show(t){tab=t;render()}function render(){document.getElementById('date').textContent=clockLabel();document.getElementById('cash').textContent=money(s.cash);document.getElementById('fleet').textContent=s.vehicles+' poj.';document.getElementById('subs').textContent=s.subs.length+' spółek';document.getElementById('nav').innerHTML=tabs.map(([id,label])=>`<button class="${tab===id?'primary':''}" data-tab="${id}">${label}</button>`).join('')+'<p class="help">Mapa jest prawdziwa (OSM). Granice sektorów, kontrakty i wszystkie ceny są fikcyjną symulacją.</p>';updateMap();let h='';const x=sectors[selected];if(tab==='mapa'){h=`<h2>🗺 ${x.name}</h2><div class="card"><p>Operator: <b>${owned(selected)?'Twoja firma':x.owner}</b></p><p>Odpady: ${x.tons} ton / miesiąc</p><p>Stawka kontraktu: ${money(x.fee)} / tonę</p><p>Szacowany przychód: <b>${money(x.tons*x.fee)}/mies.</b></p>${button('Centruj mapę','center')} ${!owned(selected)?button('Złóż ofertę','bid'):''}</div><p class="help">Klikaj zielone i pomarańczowe sektory na mapie, aby wyświetlić szczegóły.</p>`}
if(tab==='przetargi'){h='<h2>📑 Przetargi miejskie</h2>'+sectors.map((x,i)=>`<div class="card"><h3>${x.name} ${owned(i)?'<span class="pill">Twój kontrakt</span>':''}</h3><p>${x.tons} t/mies. · stawka ${money(x.fee)}/t</p><p>Szacowany przychód: ${money(x.tons*x.fee)}/mies.</p>${!owned(i)?button('Oferta: 80 000 zł wadium','bid:'+i):'<p>Kontrakt aktywny</p>'}</div>`).join('')}
if(tab==='flota'){h=`<h2>🚛 Flota i pracownicy</h2><div class="card"><p>Śmieciarki: <b>${s.vehicles}</b></p><p>Pracownicy: <b>${s.workers}</b></p><p>Wolne pojazdy: <b>${Math.max(0,s.vehicles-s.routes.length)}</b></p>${button('Kup śmieciarkę · 240 000 zł','vehicle')} ${button('Zatrudnij 2 osoby · 12 000 zł','hire')}</div><p class="help">Każda linia wymaga osobnego pojazdu i dwóch pracowników. Koszty utrzymania naliczane są co miesiąc.</p>`}
if(tab==='trasy'){h=`<h2>📅 Harmonogramy wywozu</h2><div class="card"><h3>Nowa linia</h3><label>Ulica</label><input id="street" maxlength="65" placeholder="np. Warszawska"><label>Rodzaj odpadów</label><select id="waste"><option>Zmieszane</option><option>Plastik i metale</option><option>Papier</option><option>Szkło</option><option>Bio</option></select><label>Dzień odbioru</label><select id="day">${['Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota'].map(d=>`<option>${d}</option>`).join('')}</select><label>Cena za tonę (zł)</label><input id="price" type="number" min="100" max="1500" value="400">${button('Utwórz linię','route')}</div>`+s.routes.map((r,i)=>`<div class="card"><h3>${esc(r.street)} · ${esc(r.waste)}</h3><p>${esc(r.day)} · ${money(r.price)}/t</p><p>Śmieciarka #${r.vehicle}</p>${button('Usuń linię','delroute:'+i)}</div>`).join('')+'<p class="help">Ulice wpisujesz ręcznie; prototyp nie wyznacza jeszcze rzeczywistych tras po drogach.</p>'}
if(tab==='spolki'){h=`<h2>🏢 Spółki córki</h2><div class="card"><label>Nazwa nowej spółki</label><input id="subname" maxlength="50" placeholder="np. EcoSort Polska"><label>Profil</label><select id="subtype"><option>Transport</option><option>Sortowanie</option><option>Recykling</option><option>Energia</option></select>${button('Załóż spółkę · 150 000 zł','subsidiary')}</div>`+s.subs.map((v,i)=>`<div class="card"><h3>${esc(v.name)}</h3><p>${esc(v.type)} · 100% udziałów</p><p>Kapitał zakładowy (symulacja): 150 000 zł</p></div>`).join('')}
if(tab==='udzialy'){h='<h2>📈 Kupowanie udziałów</h2><p class="help">Każdy zakup to 10 punktów procentowych udziałów. Udziały wpływają na dywidendy w symulacji.</p>'+s.ai.map((v,i)=>{let p=s.shares[i]||0;return `<div class="card"><h3>${esc(v.name)}</h3><p>Twoje udziały: <b>${p}%</b></p><p>Cena pakietu 10%: ${money(250000+i*90000)}</p>${button('Kup 10%','share:'+i,p>=100)}</div>`}).join('')}
if(tab==='zaklady'){h='<h2>🏭 Zakłady przemysłowe</h2><div class="card"><p>Sortownia: 900 000 zł · miesięczny przychód 80 000 zł, utrzymanie 36 000 zł</p>'+button('Wybuduj sortownię','build:sort')+'</div><div class="card"><p>Recykling plastiku: 1 400 000 zł · miesięczny przychód 135 000 zł, utrzymanie 58 000 zł</p>'+button('Wybuduj fabrykę','build:plastic')+'</div>'+s.buildings.map(b=>`<div class="card"><h3>${b==='sort'?'Sortownia':'Fabryka recyklingu plastiku'}</h3><p>Zakład aktywny</p></div>`).join('')}
if(tab==='rynek'){h='<h2>🤖 Konkurencja AI</h2><p class="help">Konkurenci automatycznie rozwijają firmy przy przejściu do kolejnego miesiąca.</p>'+s.ai.map(v=>`<div class="card"><h3>${esc(v.name)}</h3><p>Kapitał: ${money(v.cash)}</p><p>Flota: ${v.vehicles} pojazdów</p><p>Spółki córki: ${v.subs}</p><p>Pakiety udziałów innych firm: ${v.shares}</p></div>`).join('')}
if(tab==='badania'){h='<h2>🔬 Badania i rozwój</h2><div class="card"><p>Punkty badań: <b>'+Math.floor(s.research)+'</b> · Energia zakładów: '+Math.round(s.energy)+'%</p>'+[['sort','Sortowanie optyczne',100],['fleet','Eco-driving',80],['bio','Zaawansowany biorecykling',120],['solar','Fotowoltaika',150]].map(([id,name,cost])=>'<div class="card"><h3>'+name+'</h3><p>Koszt: '+cost+' punktów</p>'+button(s.tech.includes(id)?'Odkryto':'Opracuj', 'tech:'+id,s.tech.includes(id)||s.research<cost)+'</div>').join('')+'</div><p class="help">Punkty badań naliczają się każdego dnia. Technologie obniżają koszty lub zwiększają wydajność.</p>'}
if(tab==='handel'){h='<h2>📦 Giełda surowców</h2><p class="help">Ceny zmieniają się codziennie. Sortownie i fabryki produkują surowce co dzień.</p>'+Object.entries(s.materials).map(([k,v])=>'<div class="card"><h3>'+k+'</h3><p>Magazyn: '+v.toFixed(1)+' t · Cena: '+money(s.prices[k])+'/t</p>'+button('Sprzedaj 1 tonę','sell:'+k,v<1)+'</div>').join('')}
if(tab==='miasto'){h='<h2>🏙 Miasto i mieszkańcy</h2><div class="card"><p>Reputacja: <b>'+Math.round(s.reputation)+'/100</b></p><p>Skargi mieszkańców: '+s.complaints+'</p><p>Obsługiwane sektory: '+s.contracts.length+' / '+sectors.length+'</p><p>Pracownicy: '+s.workers+' · Linie: '+s.routes.length+'</p>'+button('Kampania edukacyjna · 25 000 zł','campaign')+'</div>'+sectors.map((v,i)=>'<div class="card"><h3>'+v.name+'</h3><p>Produkcja: '+v.tons+' t/mies. · '+(owned(i)?'Twój kontrakt':'Konkurencja')+'</p></div>').join('')}
if(tab==='raport'){let income=s.contracts.reduce((a,i)=>a+sectors[i].tons*sectors[i].fee,0)+s.buildings.reduce((a,b)=>a+(b==='sort'?80000:135000),0);let costs=s.vehicles*(s.tech.includes('fleet')?7200:9000)+s.workers*6500+s.routes.length*3500+s.buildings.reduce((a,b)=>a+(b==='sort'?36000:58000),0);h=`<h2>💹 Raport finansowy</h2><div class="card"><p>Przychody miesięczne: <b>${money(income)}</b></p><p>Koszty miesięczne: <b>${money(costs)}</b></p><p>Wynik przed dywidendami: <b>${money(income-costs)}</b></p><p>Gotówka: <b>${money(s.cash)}</b></p><p>Reputacja: ${Math.round(s.reputation)}/100 · Dług: ${money(s.loans)}</p><p>Punkty badań: ${Math.floor(s.research)}</p></div>${button('Zapisz teraz','save')} ${button('Nowa gra (usuwa zapis)','reset')}<h3>Dziennik zdarzeń</h3><div class="log">${s.logs.map(v=>`<div>• ${esc(v)}</div>`).join('')}</div>`}
document.getElementById('panel').innerHTML=h;save()}
function action(a){if(a.startsWith('sell:')){let k=a.split(':')[1];if(s.materials[k]>=1){s.materials[k]-=1;s.cash+=s.prices[k];note('Sprzedano tonę surowca: '+k)}}else if(a.startsWith('tech:')){let id=a.split(':')[1],cost={sort:100,fleet:80,bio:120,solar:150}[id];if(!s.tech.includes(id)&&s.research>=cost){s.research-=cost;s.tech.push(id);note('Opracowano technologię '+id)}}else if(a==='campaign'){if(spend(25000)){s.reputation=Math.min(100,s.reputation+5);s.complaints=Math.max(0,s.complaints-2);note('Przeprowadzono kampanię edukacyjną')}}else if(a==='center'){map.flyTo(sectors[selected].xy,14);return}if(a.startsWith('bid')){let i=a.includes(':')?Number(a.split(':')[1]):selected;if(owned(i))return;if(!spend(80000))return;const chance=.48+Math.min(.2,s.vehicles*.025);if(Math.random()<chance){s.contracts.push(i);note('Wygrano przetarg: '+sectors[i].name)}else note('Przegrano przetarg: '+sectors[i].name+' (wadium zwrócone)');if(!owned(i))s.cash+=80000;selected=i;tab='przetargi'}else if(a==='vehicle'){if(spend(240000)){s.vehicles++;note('Kupiono nową śmieciarkę')}}else if(a==='hire'){if(spend(12000)){s.workers+=2;note('Zatrudniono dwie osoby')}}else if(a==='route'){let street=document.getElementById('street').value.trim(),price=Number(document.getElementById('price').value);if(!street||!Number.isFinite(price)||price<100||price>1500){alert('Podaj ulicę i cenę 100–1500 zł/t');return}if(s.routes.length>=s.vehicles||s.routes.length*2+2>s.workers){alert('Brak wolnego pojazdu lub załogi. Kup śmieciarkę i zatrudnij ludzi.');return}s.routes.push({street,waste:document.getElementById('waste').value,day:document.getElementById('day').value,price,vehicle:s.routes.length+1});note('Dodano linię: '+street)}else if(a.startsWith('delroute:')){s.routes.splice(Number(a.split(':')[1]),1);note('Usunięto linię')}else if(a==='subsidiary'){let name=document.getElementById('subname').value.trim();if(!name){alert('Podaj nazwę spółki');return}if(spend(150000)){s.subs.push({name,type:document.getElementById('subtype').value});note('Założono spółkę córkę '+name)}}else if(a.startsWith('share:')){let i=Number(a.split(':')[1]),price=250000+i*90000;if((s.shares[i]||0)>=100)return;if(spend(price)){s.shares[i]=(s.shares[i]||0)+10;note('Kupiono 10% udziałów '+s.ai[i].name)}}else if(a.startsWith('build:')){let type=a.split(':')[1],price=type==='sort'?900000:1400000;if(spend(price)){s.buildings.push(type);note('Wybudowano '+(type==='sort'?'sortownię':'fabrykę recyklingu'))}}else if(a==='save'){save();note('Gra zapisana')}else if(a==='reset'){if(confirm('Usunąć cały postęp?')){s=seed();selected=0;tab='mapa'}}render()}
function nextMonth(){s.month++;let income=s.contracts.reduce((a,i)=>a+sectors[i].tons*sectors[i].fee,0)+s.buildings.reduce((a,b)=>a+(b==='sort'?80000:135000),0);let costs=s.vehicles*(s.tech.includes('fleet')?7200:9000)+s.workers*6500+s.routes.length*3500+s.buildings.reduce((a,b)=>a+(b==='sort'?36000:58000),0);let dividend=0;s.ai.forEach((v,i)=>{dividend+=Math.round((s.shares[i]||0)/100*18000);v.cash+=100000+Math.floor(Math.random()*120000);let r=Math.random();if(r<.24&&v.cash>300000){v.vehicles++;v.cash-=240000;note(v.name+' kupuje śmieciarkę')}else if(r<.38&&v.cash>200000){v.subs++;v.cash-=150000;note(v.name+' zakłada spółkę córkę')}else if(r<.51&&v.cash>350000){v.shares++;v.cash-=280000;note(v.name+' kupuje udziały innej firmy')}else if(r<.58){note(v.name+' reorganizuje harmonogramy wywozu')}});s.cash+=income-costs+dividend;s.cash-=s.loans*.007;s.reputation=Math.max(0,Math.min(100,s.reputation+(s.routes.length>=s.contracts.length?1:-2)));note('Rozliczenie: '+money(income-costs)+'; dywidendy: '+money(dividend));if(s.cash<0)note('Uwaga: ujemny stan konta!');render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab)show(b.dataset.tab);if(b.dataset.action)action(b.dataset.action)});function clockLabel(){let d=Math.floor(s.gameMinutes/1440),hour=Math.floor(s.gameMinutes%1440/60),min=Math.floor(s.gameMinutes%60);let date=new Date(Date.UTC(2026,0,1+d));return date.toLocaleDateString('pl-PL',{timeZone:'UTC',day:'2-digit',month:'short',year:'numeric'})+' '+String(hour).padStart(2,'0')+':'+String(min).padStart(2,'0')}
function daily(){s.research+=1+s.subs.length*.25;let ownedTons=s.contracts.reduce((v,i)=>v+sectors[i].tons,0)/30;let capacity=Math.min(1,(s.vehicles*85)/(Math.max(1,ownedTons*30)));let service=Math.min(1,(s.routes.length+1)/Math.max(1,s.contracts.length));if(Math.random()>.93*capacity*service){s.complaints++;s.reputation=Math.max(0,s.reputation-.35)}else{s.reputation=Math.min(100,s.reputation+.04)}let output=ownedTons*.12*(s.tech.includes('sort')?1.25:1);let factors={plastik:.32,papier:.26,szklo:.19,metal:.08,bio:.15};Object.keys(factors).forEach(k=>s.materials[k]+=output*factors[k]);if(s.buildings.includes('plastic')&&s.materials.plastik>2){s.materials.plastik-=2;s.cash+=2400}if(s.buildings.includes('sort'))s.research+=.5;if(s.tech.includes('solar'))s.energy=Math.min(100,s.energy+.2);else s.energy=Math.max(40,s.energy-.01);for(const k of Object.keys(s.prices))s.prices[k]=Math.max(30,Math.round(s.prices[k]*(.97+Math.random()*.06)));if(Math.random()<.04){let e=['Wzrost ruchu drogowego utrudnia odbiór','Przegląd instalacji zakończony','Zwiększone zapotrzebowanie na recyklat','Mieszkańcy zgłaszają przepełniony pojemnik'];note(e[Math.floor(Math.random()*e.length)])}}
function weekly(){s.ai.forEach((v,i)=>{v.cash+=25000+Math.round(Math.random()*35000);let r=Math.random();if(r<.3&&v.cash>250000){v.vehicles++;v.cash-=240000;note(v.name+' kupuje pojazd')}else if(r<.45&&v.cash>180000){v.subs++;v.cash-=150000;note(v.name+' tworzy spółkę córkę')}else if(r<.58&&v.cash>350000){v.shares++;v.cash-=280000;note(v.name+' kupuje udziały')}else if(r<.67)note(v.name+' aktualizuje harmonogramy odbioru')})}
function advance(minutes){let oldDay=Math.floor(s.gameMinutes/1440),oldWeek=Math.floor(s.gameMinutes/10080),oldMonth=Math.floor(s.gameMinutes/43200);s.gameMinutes+=minutes;let day=Math.floor(s.gameMinutes/1440),week=Math.floor(s.gameMinutes/10080),month=Math.floor(s.gameMinutes/43200);for(let i=oldDay;i<day;i++)daily();for(let i=oldWeek;i<week;i++)weekly();for(let i=oldMonth;i<month;i++)nextMonth();document.getElementById('date').textContent=clockLabel();}
const pause=document.getElementById('pause'),speed=document.getElementById('speed');speed.value=String(s.speed||5);pause.textContent=s.paused?'▶ Wznów':'⏸ Pauza';pause.onclick=()=>{s.paused=!s.paused;pause.textContent=s.paused?'▶ Wznów':'⏸ Pauza';save()};speed.onchange=()=>{s.speed=Number(speed.value);save()};let last=performance.now(),redraw=0,autosave=0;function loop(now){let delta=Math.min(3,(now-last)/1000);last=now;if(!s.paused){advance(delta*(s.speed||5));redraw+=delta;autosave+=delta;if(redraw>2){redraw=0;render()}if(autosave>15){autosave=0;save()}}requestAnimationFrame(loop)}render();requestAnimationFrame(loop);
</script></body></html>
