<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Mood Board & Planner v2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #02233b, #090d16);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.4);
        }
        .draggable-note {
            position: absolute;
            cursor: move;
            user-select: none;
            touch-action: none;
        }
    </style>
</head>
<body class="animated-bg text-slate-100 h-screen flex flex-col overflow-hidden font-sans">

    <!-- Górny pasek -->
    <header class="glass-panel border-b border-slate-750 px-6 py-4 flex justify-between items-center shadow-xl z-30">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-indigo-500 animate-pulse shadow-lg shadow-indigo-500/50"></div>
            <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">Mood Board <span class="text-xs bg-indigo-500/20 border border-indigo-500/40 text-indigo-300 px-2.5 py-0.5 rounded-full ml-2">v2.0</span></h1>
        </div>
        <div class="flex gap-2 bg-slate-950/40 p-1.5 rounded-2xl border border-slate-800">
            <button onclick="switchTab('board')" id="btn-board" class="px-5 py-2 rounded-xl font-medium text-sm transition bg-indigo-600 text-white shadow-lg shadow-indigo-600/30">Tablica Karteczek</button>
            <button onclick="switchTab('todos')" id="btn-todos" class="px-5 py-2 rounded-xl font-medium text-sm transition text-slate-400 hover:text-white">Lista Zadań</button>
        </div>
    </header>

    <!-- Główna zawartość -->
    <main class="flex-1 flex overflow-hidden relative">

        <!-- ZAKŁADKA 1: TABLICA KARTECZEK -->
        <div id="tab-board" class="flex-1 relative overflow-hidden bg-slate-950/30">
            <!-- Pasek akcji na tablicy -->
            <div class="absolute top-6 left-6 z-20 flex gap-3 flex-wrap">
                <button onclick="openNoteModal()" class="glass-card hover:border-indigo-500/50 px-5 py-2.5 rounded-xl font-medium text-sm transition shadow-lg flex items-center gap-2">
                    <span class="text-indigo-400 font-bold text-lg">+</span> Dodaj karteczkę
                </button>
                <button onclick="resetNotesPosition()" class="glass-card hover:bg-slate-800 px-4 py-2.5 rounded-xl font-medium text-sm transition text-slate-400 hover:text-white">
                    Ułóż domyślnie
                </button>
                <button onclick="clearAllNotes()" class="glass-card hover:bg-red-950/30 px-4 py-2.5 rounded-xl font-medium text-sm transition text-red-400 hover:text-red-300 border-red-500/20">
                    Wyczyść tablicę
                </button>
            </div>

            <!-- Obszar roboczy tablicy -->
            <div id="notes-container" class="w-full h-full relative overflow-auto p-6 pt-24">
                <!-- Tutaj lądują karteczki -->
            </div>
        </div>

        <!-- ZAKŁADKA 2: LISTA ZADAŃ -->
        <div id="tab-todos" class="flex-1 p-8 overflow-y-auto hidden">
            <div class="max-w-2xl mx-auto">
                <h2 class="text-2xl font-bold mb-6 text-slate-100">Moje Zadania & Cele</h2>
                
                <form onsubmit="addTodo(event)" class="glass-panel p-4 rounded-2xl mb-6 shadow-xl flex gap-3">
                    <input type="text" id="todo-input" required placeholder="Co dzisiaj zrobimy? np. Przygotować materiały..." class="flex-1 px-4 py-3 bg-slate-950/60 border border-slate-700/60 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-100 text-sm">
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-medium transition shadow-lg shadow-indigo-600/30 text-sm">Dodaj</button>
                </form>

                <div class="glass-panel rounded-2xl overflow-hidden shadow-2xl divide-y divide-slate-800/60" id="todos-list">
                    <!-- Dynamiczne zadania -->
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL DODAWANIA KARTECZKI -->
    <div id="note-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="glass-panel text-slate-100 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden p-6 border border-slate-700/60">
            <h3 class="text-xl font-bold mb-4 text-indigo-300">Nowa karteczka inspiracji</h3>
            <form onsubmit="saveNewNote(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Tytuł / Nagłówek</label>
                    <input type="text" id="note-title" required placeholder="np. Pomysł na ujęcie" class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-700/60 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-100 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Treść</label>
                    <textarea id="note-content" rows="4" required placeholder="Opisz swój pomysł..." class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-700/60 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-100 text-sm resize-none"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeNoteModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm font-medium transition border border-slate-700">Anuluj</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/30">Przypnij</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let notes = JSON.parse(localStorage.getItem('mood_notes')) || [
            { id: 1, title: '🎬 Scena w deszczu', content: 'Główny bohater idzie ciemną aleją. Zwrócić uwagę na oświetlenie neonów.', x: 60, y: 110, color: 'border-indigo-500/40' },
            { id: 2, title: '💡 Zadanie na dziś', content: 'Skończyć konfigurację skryptów i przetestować deploy na GitHub.', x: 380, y: 130, color: 'border-purple-500/40' },
            { id: 3, title: '🎨 Paleta barw', content: 'Ciemny granat, neonowy fiolet i akcenty szmaragdowej zieleni.', x: 700, y: 100, color: 'border-emerald-500/40' }
        ];

        let todos = JSON.parse(localStorage.getItem('mood_todos')) || [
            { id: 1, text: 'Stworzyć strukturę projektu', done: true },
            { id: 2, text: 'Wgrać zaktualizowany index.html na GitHub', done: false },
            { id: 3, text: 'Przetestować responsywność', done: false }
        ];

        function saveStorage() {
            localStorage.setItem('mood_notes', JSON.stringify(notes));
            localStorage.setItem('mood_todos', JSON.stringify(todos));
        }

        function switchTab(tab) {
            document.getElementById('tab-board').classList.toggle('hidden', tab !== 'board');
            document.getElementById('tab-todos').classList.toggle('hidden', tab !== 'todos');
            
            const btnBoard = document.getElementById('btn-board');
            const btnTodos = document.getElementById('btn-todos');

            btnBoard.className = "px-5 py-2 rounded-xl font-medium text-sm transition " + (tab === 'board' ? "bg-indigo-600 text-white shadow-lg shadow-indigo-600/30" : "text-slate-400 hover:text-white");
            btnTodos.className = "px-5 py-2 rounded-xl font-medium text-sm transition " + (tab === 'todos' ? "bg-indigo-600 text-white shadow-lg shadow-indigo-600/30" : "text-slate-400 hover:text-white");

            if(tab === 'board') renderNotes();
            if(tab === 'todos') renderTodos();
        }

        // --- OBSŁUGA KARTECZEK (DRAG & DROP) ---
        function renderNotes() {
            const container = document.getElementById('notes-container');
            container.innerHTML = '';

            notes.forEach(note => {
                const el = document.createElement('div');
                el.className = `draggable-note glass-card p-5 rounded-2xl w-80 border ${note.color || 'border-slate-700/50'} shadow-xl flex flex-col justify-between`;
                el.style.left = `${note.x}px`;
                el.style.top = `${note.y}px`;
                el.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <input type="text" value="${note.title}" onchange="updateNoteTitle(${note.id}, this.value)" class="bg-transparent font-bold text-slate-200 text-sm w-full focus:outline-none focus:border-b focus:border-indigo-500">
                            <button onclick="deleteNote(${note.id})" class="text-slate-500 hover:text-red-400 text-sm font-bold px-1 transition">&times;</button>
                        </div>
                        <textarea onchange="updateNoteContent(${note.id}, this.value)" rows="3" class="bg-transparent text-xs text-slate-400 leading-relaxed w-full focus:outline-none resize-none">${note.content}</textarea>
                    </div>
                    <div class="mt-2 text-[10px] text-slate-600 text-right select-none">przeciągnij za krawędź</div>
                `;

                // Poprawiona, płynna logika przeciąganja
                let isDragging = false;
                let startX, startY;

                el.addEventListener('pointerdown', (e) => {
                    if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;
                    isDragging = true;
                    startX = e.clientX - note.x;
                    startY = e.clientY - note.y;
                    el.setPointerCapture(e.pointerId);
                    el.style.zIndex = 1000;
                });

                el.addEventListener('pointermove', (e) => {
                    if (!isDragging) return;
                    note.x = e.clientX - startX;
                    note.y = e.clientY - startY;
                    el.style.left = `${note.x}px`;
                    el.style.top = `${note.y}px`;
                });

                el.addEventListener('pointerup', (e) => {
                    if (isDragging) {
                        isDragging = false;
                        el.releasePointerCapture(e.pointerId);
                        el.style.zIndex = 1;
                        saveStorage();
                    }
                });

                container.appendChild(el);
            });
        }

        function updateNoteTitle(id, newTitle) {
            const n = notes.find(item => item.id === id);
            if(n) { n.title = newTitle; saveStorage(); }
        }

        function updateNoteContent(id, newContent) {
            const n = notes.find(item => item.id === id);
            if(n) { n.content = newContent; saveStorage(); }
        }

        function openNoteModal() {
            document.getElementById('note-modal').classList.remove('hidden');
        }

        function closeNoteModal() {
            document.getElementById('note-modal').classList.add('hidden');
            document.getElementById('note-title').value = '';
            document.getElementById('note-content').value = '';
        }

        function saveNewNote(e) {
            e.preventDefault();
            const title = document.getElementById('note-title').value;
            const content = document.getElementById('note-content').value;
            
            const colors = ['border-indigo-500/40', 'border-purple-500/40', 'border-emerald-500/40', 'border-amber-500/40', 'border-rose-500/40'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];

            notes.push({
                id: Date.now(),
                title,
                content,
                x: 80 + Math.random() * 150,
                y: 150 + Math.random() * 80,
                color: randomColor
            });

            saveStorage();
            closeNoteModal();
            renderNotes();
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            saveStorage();
            renderNotes();
        }

        function clearAllNotes() {
            if(confirm('Usunąć wszystkie karteczki z tablicy?')) {
                notes = [];
                saveStorage();
                renderNotes();
            }
        }

        function resetNotesPosition() {
            let startX = 60;
            let startY = 110;
            notes.forEach((n, index) => {
                n.x = startX + (index % 3) * 320;
                n.y = startY + Math.floor(index / 3) * 220;
            });
            saveStorage();
            renderNotes();
        }

        // --- OBSŁUGA ZADAŃ ---
        function renderTodos() {
            const list = document.getElementById('todos-list');
            list.innerHTML = '';

            if (todos.length === 0) {
                list.innerHTML = `<div class="p-8 text-center text-slate-500 text-sm">Brak zaplanowanych zadań</div>`;
                return;
            }

            todos.forEach(todo => {
                list.innerHTML += `
                    <div class="p-4 flex items-center justify-between hover:bg-slate-900/30 transition">
                        <div class="flex items-center gap-3">
                            <input type="checkbox" ${todo.done ? 'checked' : ''} onclick="toggleTodo(${todo.id})" class="w-4 h-4 rounded border-slate-700 bg-slate-950 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
                            <span class="text-sm ${todo.done ? 'line-through text-slate-500' : 'text-slate-200'}">${todo.text}</span>
                        </div>
                        <button onclick="deleteTodo(${todo.id})" class="text-slate-500 hover:text-red-400 text-xs transition px-2 py-1">Usuń</button>
                    </div>
                `;
            });
        }

        function addTodo(e) {
            e.preventDefault();
            const input = document.getElementById('todo-input');
            todos.push({
                id: Date.now(),
                text: input.value,
                done: false
            });
            input.value = '';
            saveStorage();
            renderTodos();
        }

        function toggleTodo(id) {
            const t = todos.find(item => item.id === id);
            if(t) {
                t.done = !t.done;
                saveStorage();
                renderTodos();
            }
        }

        function deleteTodo(id) {
            todos = todos.filter(item => item.id !== id);
            saveStorage();
            renderTodos();
        }

        renderNotes();
    </script>
</body>
</html>
