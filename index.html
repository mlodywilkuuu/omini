<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MANDAT — Political Strategy</title>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,Arial,sans-serif;background:#11162e;color:#fff}
button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#app{min-height:100vh;padding:24px 16px;background:linear-gradient(125deg,#101b42,#65206d);background-size:220% 220%;animation:bg 10s ease-in-out infinite}
.container{width:min(1180px,100%);margin:auto}
.glass{background:rgba(8,10,30,.28);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px);border-radius:22px}
.panel{padding:17px}.muted{color:rgba(255,255,255,.52)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.45)}
h1,h2,h3{margin:0}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:17px}
.btn{min-height:48px;border:0;border-radius:999px;padding:0 21px;background:#fff;color:#18181c;font-weight:800}
.soft{min-height:43px;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:0 16px;background:rgba(255,255,255,.08);color:#fff;font-weight:700}
.center{min-height:calc(100vh - 48px);display:flex;justify-content:center;align-items:center;text-align:center}
.logo{font-size:clamp(65px,13vw,120px);font-weight:950;letter-spacing:-.07em;line-height:.85;background:linear-gradient(90deg,#fff,#d4c9ff,#ffb8ea,#fff);background-size:250%;color:transparent;-webkit-background-clip:text;background-clip:text;animation:title 4s linear infinite}
.menu{width:min(360px,100%);display:grid;gap:11px;margin:40px auto 0}.menu2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.choice{position:relative;padding:14px;border:1px solid rgba(255,255,255,.11);border-radius:17px;background:rgba(255,255,255,.065);color:#fff;text-align:left}
.choice.selected{background:rgba(255,255,255,.17);border-color:rgba(255,255,255,.58)}
.check{position:absolute;right:9px;top:9px;width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:white;color:#111;opacity:0}
.choice.selected .check{opacity:1}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.field{width:100%;min-height:45px;border:1px solid rgba(255,255,255,.14);border-radius:13px;background:rgba(255,255,255,.08);color:white;padding:0 12px}
select.field option{color:#111}
.sep{height:1px;background:rgba(255,255,255,.09);margin:19px 0}

.gameHead{padding:14px 16px;margin-bottom:12px}.gameHeadRow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.clock{display:flex;gap:6px;flex-wrap:wrap}.clockBox{padding:8px 11px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.06)}
.speed{min-height:35px;min-width:40px;border:1px solid rgba(255,255,255,.11);border-radius:10px;background:rgba(255,255,255,.07);color:white;font-weight:800}
.speed.active{background:white;color:#111}
.tabs{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;min-height:40px;border:1px solid rgba(255,255,255,.11);border-radius:999px;background:rgba(255,255,255,.06);color:rgba(255,255,255,.68);padding:0 14px;font-weight:700}
.tab.active{background:white;color:#111}

.stat{padding:12px;border:1px solid rgba(255,255,255,.09);border-radius:15px;background:rgba(255,255,255,.055)}
.statTop{display:flex;justify-content:space-between;gap:8px;font-size:13px}.bar{height:7px;margin-top:8px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}.bar div{height:100%;background:white}
.action{width:100%;min-height:55px;padding:10px 12px;border:1px solid rgba(255,255,255,.11);border-radius:14px;background:rgba(255,255,255,.065);color:white;text-align:left;font-weight:800}
.action small{display:block;margin-top:4px;font-weight:400;color:rgba(255,255,255,.46)}
.big{font-size:29px;font-weight:950}.tag{display:inline-flex;align-items:center;min-height:25px;padding:0 9px;border-radius:99px;background:rgba(255,255,255,.1);font-size:11px;font-weight:800}
.row{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}.row:last-child{border-bottom:0}
.relation{display:grid;grid-template-columns:minmax(130px,1fr) 1.3fr auto;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.relScore{font-size:20px;font-weight:900;text-align:right}
.badge{padding:5px 9px;border-radius:99px;background:rgba(255,255,255,.09);font-size:11px;font-weight:800}
.notice{padding:13px;border:1px solid rgba(255,255,255,.1);border-radius:15px;background:rgba(0,0,0,.12)}
.sandbox{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.045));border:1px solid rgba(255,255,255,.2)}
.modalBg{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.62);backdrop-filter:blur(7px)}
.modal{width:min(500px,100%);max-height:85vh;overflow:auto;padding:21px;border:1px solid rgba(255,255,255,.13);border-radius:23px;background:#151733}
.productGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.product{padding:11px;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:rgba(255,255,255,.055)}
.product.active{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.5)}
@media(max-width:800px){.grid3,.grid2{grid-template-columns:1fr}.relation{grid-template-columns:1fr}.relScore{text-align:left}.menu2{grid-template-columns:1fr 1fr}}
@keyframes bg{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes title{from{background-position:0}to{background-position:250%}}
</style>
</head>

<body>
<div id="app">
<div class="container">

<section id="home" class="center">
  <div>
    <div class="logo">MANDAT</div>
    <div style="margin-top:18px;letter-spacing:.33em;font-size:11px;font-weight:800;color:rgba(255,255,255,.5)">POLITICAL STRATEGY</div>
    <div class="menu">
      <button id="newGame" class="btn">Nowa gra</button>
      <div class="menu2">
        <button id="settings" class="btn">Ustawienia</button>
        <button id="about" class="btn">O grze</button>
      </div>
    </div>
  </div>
</section>

<section id="setup" class="hidden">
  <div class="top">
    <div><div class="eyebrow">Nowa gra</div><h2>Wybierz rozgrywkę</h2></div>
    <button id="backHome" class="soft">Wróć</button>
  </div>

  <div class="glass panel">
    <div class="eyebrow">Kraj</div>
    <div id="countries" class="grid3" style="margin-top:11px"></div>

    <div class="sep"></div>

    <div class="eyebrow">Tryb gry</div>
    <div class="grid3" style="margin-top:11px">
      <button class="choice mode selected" data-mode="career"><span class="check">✓</span><b>Pełna kariera</b><div class="muted">Wybory → prezydentura.</div></button>
      <button class="choice mode" data-mode="election"><span class="check">✓</span><b>Tylko wybory</b><div class="muted">Kampania i wynik.</div></button>
      <button class="choice mode" data-mode="president"><span class="check">✓</span><b>Prezydent</b><div class="muted">Start bez kampanii.</div></button>
    </div>

    <div class="sep"></div>

    <button id="sandboxChoice" class="choice sandbox" style="width:100%">
      <span class="check">✓</span>
      <b>Piaskownica MAX</b>
      <span class="tag">∞</span>
      <div class="muted">Brak zwykłych limitów, edycja statystyk i ręczna kontrola systemów.</div>
    </button>
  </div>

  <div style="display:flex;justify-content:flex-end;margin-top:12px">
    <button id="nextCandidate" class="btn">Dalej</button>
  </div>
</section>

<section id="candidate" class="hidden">
  <div class="top">
    <div><div class="eyebrow">Kandydat</div><h2>Stwórz postać</h2></div>
    <button id="candidateBack" class="soft">Wróć</button>
  </div>

  <div class="glass panel">
    <div class="grid2">
      <label>Imię<input id="firstName" class="field" value="Alex"></label>
      <label>Nazwisko<input id="lastName" class="field" value="Nowak"></label>
      <label>Partia / komitet<input id="party" class="field" value="Nowa Droga"></label>
      <label>Wiek<input id="age" type="number" class="field" value="45"></label>
    </div>
  </div>

  <div style="display:flex;justify-content:flex-end;margin-top:12px">
    <button id="start" class="btn">Rozpocznij</button>
  </div>
</section>

<section id="game" class="hidden">

  <div class="glass gameHead">
    <div class="gameHeadRow">
      <div>
        <div id="phase" class="eyebrow"></div>
        <h2 id="gameTitle"></h2>
        <div id="gameSub" class="muted"></div>
      </div>

      <div class="clock">
        <div class="clockBox">
          <div class="eyebrow">Data</div>
          <b id="date"></b>
        </div>

        <button id="pause" class="speed">Ⅱ</button>
        <button class="speed active" data-speed="1">×1</button>
        <button class="speed" data-speed="4">×4</button>
        <button class="speed" data-speed="12">×12</button>
        <button id="leave" class="soft">Menu</button>
      </div>
    </div>
  </div>

  <div id="tabs" class="tabs"></div>
  <div id="content"></div>

</section>

</div>
</div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

const screens={home:$("#home"),setup:$("#setup"),candidate:$("#candidate"),game:$("#game")};
let screen="home";
function show(x){screen=x;Object.entries(screens).forEach(([k,v])=>v.classList.toggle("hidden",k!==x))}

const countryList=[
  "Polska","Stany Zjednoczone","Francja","Niemcy","Wielka Brytania",
  "Rosja","Włochy","Hiszpania","Brazylia"
];

let selectedCountry="Polska";
let mode="career";
let sandbox=false;
let activeTab="overview";
let state=null;
let timer=null;

countryList.forEach((name,i)=>{
  const b=document.createElement("button");
  b.className="choice country"+(i===0?" selected":"");
  b.dataset.country=name;
  b.innerHTML='<span class="check">✓</span><b>'+name+'</b>';
  $("#countries").appendChild(b);
});

$$(".country").forEach(b=>b.onclick=()=>{
  $$(".country").forEach(x=>x.classList.remove("selected"));
  b.classList.add("selected");
  selectedCountry=b.dataset.country;
});

$$(".mode").forEach(b=>b.onclick=()=>{
  $$(".mode").forEach(x=>x.classList.remove("selected"));
  b.classList.add("selected");
  mode=b.dataset.mode;
});

$("#sandboxChoice").onclick=()=>{
  sandbox=!sandbox;
  $("#sandboxChoice").classList.toggle("selected",sandbox);
};

$("#newGame").onclick=()=>show("setup");
$("#backHome").onclick=()=>show("home");
$("#nextCandidate").onclick=()=>show("candidate");
$("#candidateBack").onclick=()=>show("setup");
$("#leave").onclick=()=>{if(state)state.paused=true;show("home")};

/* ===========================
   NOWA GRA
=========================== */

function createState(){
  const foreign={};

  countryList
    .filter(c=>c!==selectedCountry)
    .forEach((c,i)=>{
      foreign[c]={
        relation:45+((i*7)%15),
        embassy:"none",
        embassyFinish:null,
        meetings:0,
        lastMeeting:null,
        alliance:false,
        embargoes:[],
        trade:50+((i*9)%30)
      };
    });

  return{
    phase:mode==="president"?"president":"campaign",
    date:new Date(2026,8,1,8,0,0),
    election:new Date(2026,9,31,20,0,0),
    speed:1,
    paused:false,

    support:31,
    rivalA:36,
    rivalB:33,
    campaignMoney:sandbox?999999:150,

    approval:55,
    economy:52,
    inflation:48,
    employment:54,
    services:50,
    stability:55,
    treasury:sandbox?999999:140,

    diplomaticCapital:sandbox?999:50,
    internationalReputation:50,

    military:{
      budget:45,
      readiness:50,
      equipment:50,
      personnel:50,
      morale:55
    },

    opinion:{
      general:55,
      workers:52,
      business:50,
      young:54,
      seniors:55,
      security:50
    },

    foreign,
    alliances:[],
    news:[],
    daysInOffice:0,
    lastMonth:-1,
    finished:false
  };
}

$("#start").onclick=()=>{
  state=createState();
  activeTab="overview";
  show("game");
  startClock();
  render();
};

/* ===========================
   CZAS
=========================== */

function startClock(){
  clearInterval(timer);
  timer=setInterval(()=>{
    if(!state||state.paused||screen!=="game"||state.finished)return;

    const oldDay=state.date.getDate();
    const oldMonth=state.date.getMonth();

    state.date=new Date(state.date.getTime()+state.speed*3600000);

    if(state.date.getDate()!==oldDay)dailyTick();
    if(state.date.getMonth()!==oldMonth)monthlyTick();

    $("#date").textContent=formatDate(state.date);
  },1000);
}

function dailyTick(){

  if(state.phase==="campaign"){
    if(state.date>=state.election)finishElection();
    return;
  }

  state.daysInOffice++;

  Object.entries(state.foreign).forEach(([country,f])=>{

    if(f.embassy==="building"&&state.date>=f.embassyFinish){
      f.embassy="open";
      f.embassyFinish=null;
      f.relation=clamp(f.relation+5,0,100);
      news("Otwarto ambasadę w państwie: "+country+".");
    }

    if(f.embassy==="open"){
      f.relation=clamp(f.relation+.08,0,100);
    }

    if(f.alliance){
      f.relation=clamp(f.relation+.05,0,100);
    }

    if(f.embargoes.length){
      f.relation=clamp(f.relation-.05*f.embargoes.length,0,100);
    }
  });

  state.economy=clamp(state.economy+rand(-.08,.1),0,100);
  state.approval=clamp(state.approval+rand(-.08,.08),0,100);

  opinionSync();
}

function monthlyTick(){

  if(state.phase!=="president")return;

  const embassies=Object.values(state.foreign).filter(x=>x.embassy==="open").length;
  const allianceCount=state.alliances.length;
  const embargoCount=Object.values(state.foreign).reduce((s,x)=>s+x.embargoes.length,0);

  if(!sandbox){
    state.treasury-=embassies*1;
    state.treasury-=state.military.budget*.08;
  }

  state.economy=clamp(
    state.economy
      +(state.employment-50)*.025
      -(state.inflation-50)*.02
      -embargoCount*.08,
    0,100
  );

  state.stability=clamp(state.stability+allianceCount*.15,0,100);
  state.internationalReputation=clamp(state.internationalReputation+allianceCount*.12-embargoCount*.08,0,100);

  news("Zakończył się kolejny miesiąc urzędowania.");
}

$$(".speed[data-speed]").forEach(b=>b.onclick=()=>{
  state.speed=Number(b.dataset.speed);
  state.paused=false;
  $$(".speed[data-speed]").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  $("#pause").classList.remove("active");
});

$("#pause").onclick=()=>{
  state.paused=!state.paused;
  $("#pause").classList.toggle("active",state.paused);
};

/* ===========================
   ZAKŁADKI
=========================== */

function tabs(){
  if(state.phase==="campaign"){
    return[
      ["overview","Pulpit"],
      ["campaign","Kampania"],
      ["polls","Sondaże"]
    ];
  }

  const t=[
    ["overview","Pulpit"],
    ["foreign","Relacje"],
    ["embassies","Ambasady"],
    ["meetings","Spotkania"],
    ["embargo","Embarga"],
    ["alliances","Sojusze"],
    ["military","Wojsko"],
    ["economy","Gospodarka"],
    ["opinion","Opinia"]
  ];

  if(sandbox)t.push(["sandbox","Piaskownica"]);
  return t;
}

function renderTabs(){
  $("#tabs").innerHTML="";
  tabs().forEach(([id,label])=>{
    const b=document.createElement("button");
    b.className="tab"+(activeTab===id?" active":"");
    b.textContent=label;
    b.onclick=()=>{activeTab=id;renderTabs();renderContent()};
    $("#tabs").appendChild(b);
  });
}

/* ===========================
   GŁÓWNY RENDER
=========================== */

function render(){
  $("#date").textContent=formatDate(state.date);

  if(state.phase==="campaign"){
    $("#phase").textContent=mode==="career"?"Pełna kariera · kampania":"Kampania";
    $("#gameTitle").textContent="Kampania wyborcza";
  }else{
    $("#phase").textContent=mode==="career"?"Pełna kariera · prezydentura":"Prezydentura";
    $("#gameTitle").textContent="Urząd prezydenta";
  }

  $("#gameSub").textContent=selectedCountry+" · "+$("#firstName").value+" "+$("#lastName").value;

  renderTabs();
  renderContent();
}

function renderContent(){

  if(state.phase==="campaign"){
    if(activeTab==="overview")campaignOverview();
    if(activeTab==="campaign")campaignActions();
    if(activeTab==="polls")campaignPolls();
    return;
  }

  const f={
    overview:presidentOverview,
    foreign:foreignRelations,
    embassies:embassies,
    meetings:meetings,
    embargo:embargoes,
    alliances:alliances,
    military:military,
    economy:economy,
    opinion:opinion,
    sandbox:sandboxTab
  };

  (f[activeTab]||presidentOverview)();
}

/* ===========================
   KAMPANIA
=========================== */

function campaignOverview(){
  $("#content").innerHTML=`
  <div class="grid2">
    <div class="glass panel">
      <div class="eyebrow">Kampania</div>
      ${stat("Poparcie",state.support)}
      <div class="row"><span class="muted">Budżet</span><div class="big">${Math.round(state.campaignMoney)}</div></div>
    </div>

    <div class="glass panel">
      <div class="eyebrow">Do wyborów</div>
      <div class="big" style="margin-top:8px">${daysToElection()} dni</div>
      <div class="muted">Czas płynie automatycznie.</div>
    </div>
  </div>`;
}

function campaignActions(){
  $("#content").innerHTML=`
  <div class="glass panel">
    <div class="eyebrow">Działania</div>
    <div class="grid2" style="margin-top:12px">
      <button class="action ca" data-cost="8" data-gain=".5">Spotkania lokalne<small>Koszt 8</small></button>
      <button class="action ca" data-cost="15" data-gain="1">Wiec<small>Koszt 15</small></button>
      <button class="action ca" data-cost="22" data-gain="1.3">Media<small>Koszt 22</small></button>
      <button class="action ca" data-cost="10" data-gain=".7">Debata<small>Koszt 10</small></button>
    </div>
  </div>`;

  $$(".ca").forEach(b=>b.onclick=()=>{
    const cost=Number(b.dataset.cost);
    if(!sandbox&&state.campaignMoney<cost)return;
    if(!sandbox)state.campaignMoney-=cost;
    state.support+=rand(-.2,Number(b.dataset.gain));
    normalizePoll();
    campaignActions();
  });
}

function campaignPolls(){
  $("#content").innerHTML=`
  <div class="glass panel">
    ${poll($("#lastName").value||"Ty",state.support)}
    ${poll("Rywal A",state.rivalA)}
    ${poll("Rywal B",state.rivalB)}
  </div>`;
}

function finishElection(){
  normalizePoll();
  const won=state.support>state.rivalA&&state.support>state.rivalB;
  state.paused=true;

  $("#tabs").innerHTML="";
  $("#content").innerHTML=`
  <div class="glass panel" style="text-align:center">
    <div class="big" style="font-size:55px">${state.support.toFixed(1)}%</div>
    <h2 style="margin-top:12px">${won?"Zwycięstwo":"Koniec kampanii"}</h2>
    ${won&&mode==="career"?'<button id="presidentNow" class="btn" style="margin-top:18px">Rozpocznij prezydenturę</button>':'<button id="endMenu" class="btn" style="margin-top:18px">Menu</button>'}
  </div>`;

  if($("#presidentNow"))$("#presidentNow").onclick=()=>{
    state.phase="president";
    state.paused=false;
    state.daysInOffice=0;
    activeTab="overview";
    news("Rozpoczęła się prezydentura.");
    render();
  };

  if($("#endMenu"))$("#endMenu").onclick=()=>show("home");
}

/* ===========================
   PULPIT PREZYDENTA
=========================== */

function presidentOverview(){
  $("#content").innerHTML=`
  <div class="grid2">

    <div class="glass panel">
      <div class="eyebrow">Państwo</div>
      <div class="grid2" style="margin-top:10px">
        ${stat("Poparcie",state.approval)}
        ${stat("Gospodarka",state.economy)}
        ${stat("Stabilność",state.stability)}
        ${stat("Reputacja międzynarodowa",state.internationalReputation)}
      </div>
      <div class="row">
        <span class="muted">Budżet państwa</span>
        <div class="big">${Math.round(state.treasury)}</div>
      </div>
    </div>

    <div class="glass panel">
      <div class="eyebrow">Dyplomacja</div>
      <div class="row">
        <span class="muted">Kapitał dyplomatyczny</span>
        <div class="big">${Math.round(state.diplomaticCapital)}</div>
      </div>
      <div class="row"><b>Ambasady</b><span style="float:right">${Object.values(state.foreign).filter(x=>x.embassy==="open").length}</span></div>
      <div class="row"><b>Sojusze</b><span style="float:right">${state.alliances.length}</span></div>
      <div class="row"><b>Aktywne embarga</b><span style="float:right">${Object.values(state.foreign).reduce((s,x)=>s+x.embargoes.length,0)}</span></div>
    </div>

  </div>

  <div class="glass panel" style="margin-top:11px">
    <div class="eyebrow">Ostatnie wydarzenia</div>
    ${(state.news.slice(0,8).map(n=>`<div class="row"><small class="muted">${n.date}</small><div>${n.text}</div></div>`).join("")||'<div class="muted" style="margin-top:10px">Brak wydarzeń.</div>')}
  </div>`;
}

/* ===========================
   RELACJE
=========================== */

function foreignRelations(){
  $("#content").innerHTML=`
  <div class="glass panel">
    <div class="eyebrow">Relacje dwustronne</div>
    <div class="muted" style="margin-top:5px">Wartości są elementem symulacji gry.</div>
    ${Object.entries(state.foreign).map(([c,f])=>`
      <div class="relation">
        <div>
          <b>${c}</b>
          <div class="muted">${relationLabel(f.relation)}</div>
        </div>

    `).join("")}

}

function embassies(){
  $("#content").innerHTML=`
  <div class="glass panel">
    <div class="eyebrow">Sieć ambasad</div>
    <div class="muted" style="margin-top:5px">Ambasada poprawia relacje każdego dnia i ułatwia spotkania oraz sojusze.</div>

    ${Object.entries(state.foreign).map(([country,f])=>{
      let button="";

      if(f.embassy==="none"){
        button=`<button class="soft embassyBuild" data-country="${country}">Buduj · 20</button>`;
      }else if(f.embassy==="building"){
        button=`<span class="badge">W budowie · ${daysUntil(f.embassyFinish)} dni</span>`;
      }else{
        button=`<span class="badge">Otwarta</span>`;
      }

      return`
      <div class="row" style="display:flex;justify-content:space-between;gap:12px;align-items:center">
        <div>
          <b>${country}</b>
          <div class="muted">Relacje: ${Math.round(f.relation)}</div>
        </div>
        ${button}
      </div>`;
    }).join("")}
  </div>`;

  $$(".embassyBuild").forEach(b=>b.onclick=()=>{
    const c=b.dataset.country;
    const f=state.foreign[c];

    if(!sandbox&&state.treasury<20)return;

    if(!sandbox)state.treasury-=20;

    f.embassy="building";
    f.embassyFinish=new Date(state.date.getTime()+20*86400000);

    state.opinion.business=clamp(state.opinion.business+1,0,100);
    news("Rozpoczęto budowę ambasady w państwie: "+c+".");
    embassies();
  });
}

function meetings(){

    <div class="muted" style="margin-top:5px">Spotkania zużywają kapitał dyplomatyczny i mogą poprawiać relacje.</div>

    ${Object.entries(state.foreign).map(([country,f])=>{
      const cooldown=f.lastMeeting?Math.max(0,30-Math.floor((state.date-f.lastMeeting)/86400000)):0;

          <div class="muted">Spotkania: ${f.meetings} · Relacje ${Math.round(f.relation)}</div>
        </div>
        <button class="soft leaderMeeting" data-country="${country}" ${cooldown>0?"disabled":""}>
          ${cooldown>0?"Ponownie za "+cooldown+" dni":"Spotkanie · 8"}
        </button>
      </div>`;
    }).join("")}
  </div>`;

  $$(".leaderMeeting").forEach(b=>b.onclick=()=>{
    const c=b.dataset.country;

    if(!sandbox&&state.diplomaticCapital<8)return;

    f.meetings++;

    f.relation=clamp(f.relation+rand(5,10)+(f.embassy==="open"?2:0),0,100);

    state.internationalReputation=clamp(state.internationalReputation+1,0,100);
    state.opinion.business=clamp(state.opinion.business+1,0,100);
    state.opinion.general=clamp(state.opinion.general+rand(0,1.5),0,100);

/* ===========================
   EMBARGA
=========================== */

const products=[
  "Energia",
  "Żywność",
  "Elektronika",
  "Maszyny",
  "Surowce",
  "Usługi finansowe"
];

function embargoes(){
  $("#content").innerHTML=`
  <div class="glass panel">
    <div class="eyebrow">Embarga sektorowe</div>
    <div class="muted" style="margin-top:5px">
      Embargo pogarsza relacje i handel. W grze może również wpływać na opinię publiczną i gospodarkę.
    </div>

    <label style="display:block;margin-top:14px">
      Państwo
      <select id="embargoCountry" class="field" style="margin-top:5px">
        ${Object.keys(state.foreign).map(c=>`<option>${c}</option>`).join("")}
      </select>
    </label>

    <div id="productEmbargoes" class="productGrid" style="margin-top:12px"></div>
  </div>`;

  $("#embargoCountry").onchange=renderProductEmbargoes;
  renderProductEmbargoes();
}

function renderProductEmbargoes(){
  const c=$("#embargoCountry").value;
  const f=state.foreign[c];

  $("#productEmbargoes").innerHTML=products.map(p=>`
    <button class="product ${f.embargoes.includes(p)?"active":""}" data-product="${p}">
      <b>${p}</b>
      <div class="muted">${f.embargoes.includes(p)?"Embargo aktywne":"Brak embargo"}</div>
    </button>
  `).join("");

  $$(".product").forEach(b=>b.onclick=()=>{
    const p=b.dataset.product;

    if(f.embargoes.includes(p)){
      f.embargoes=f.embargoes.filter(x=>x!==p);
      f.relation=clamp(f.relation+4,0,100);
      state.opinion.business=clamp(state.opinion.business+1,0,100);
      news("Zniesiono embargo na sektor "+p+" wobec państwa: "+c+".");
    }else{
      f.embargoes.push(p);
      f.relation=clamp(f.relation-12,0,100);
      state.economy=clamp(state.economy-.7,0,100);
      state.opinion.business=clamp(state.opinion.business-2,0,100);

      if(f.relation<35){
        state.opinion.security=clamp(state.opinion.security+2,0,100);
      }else{
        state.opinion.general=clamp(state.opinion.general-1,0,100);
      }

      news("Nałożono embargo na sektor "+p+" wobec państwa: "+c+".");
    }

    opinionSync();
    renderProductEmbargoes();
  });
}

   SOJUSZE
=========================== */

function alliances(){
  $("#content").innerHTML=`
  <div class="grid2">
    <div class="glass panel">
      <div class="eyebrow">Aktywne sojusze</div>
      ${state.alliances.length?state.alliances.map(c=>`
        <div class="row">
          <b>${c}</b>
          <div class="muted">Relacje ${Math.round(state.foreign[c].relation)}</div>
          <button class="soft leaveAlliance" data-country="${c}" style="margin-top:7px">Zakończ sojusz</button>
        </div>
      `).join(""):'<div class="muted" style="margin-top:12px">Brak formalnych sojuszy.</div>'}
    </div>

    <div class="glass panel">
      <div class="eyebrow">Nowy sojusz</div>
      ${Object.entries(state.foreign).filter(([c,f])=>!f.alliance).map(([c,f])=>{
        const ready=f.relation>=70&&f.embassy==="open"&&f.meetings>=1;
        return`
        <div class="row">
          <b>${c}</b>
          <div class="muted">Relacje ${Math.round(f.relation)} · Spotkania ${f.meetings}</div>
          <button class="soft createAlliance" data-country="${c}" ${!ready?"disabled":""} style="margin-top:7px">
            ${ready?"Zaproponuj sojusz · 20":"Wymaga: 70 relacji, ambasady i spotkania"}
          </button>
        </div>`;
      }).join("")}
    </div>
  </div>`;

  $$(".createAlliance").forEach(b=>b.onclick=()=>{
    const c=b.dataset.country;
    const f=state.foreign[c];

    if(!sandbox&&state.diplomaticCapital<20)return;

    if(!sandbox)state.diplomaticCapital-=20;

    f.alliance=true;
    f.relation=clamp(f.relation+8,0,100);
    state.alliances.push(c);

    state.stability=clamp(state.stability+2,0,100);
    state.opinion.security=clamp(state.opinion.security+3,0,100);
    state.internationalReputation=clamp(state.internationalReputation+2,0,100);

    news("Utworzono sojusz z państwem: "+c+".");
    alliances();
  });

  $$(".leaveAlliance").forEach(b=>b.onclick=()=>{
    const c=b.dataset.country;
    const f=state.foreign[c];

    f.alliance=false;
    f.relation=clamp(f.relation-20,0,100);
    state.alliances=state.alliances.filter(x=>x!==c);

    state.opinion.security=clamp(state.opinion.security-3,0,100);
    state.internationalReputation=clamp(state.internationalReputation-2,0,100);

    news("Zakończono sojusz z państwem: "+c+".");
    alliances();
  });
}

function military(){
  const m=state.military;

  $("#content").innerHTML=`
  <div class="grid2">

      <div class="grid2" style="margin-top:11px">

      </div>

      <div class="row">
        <span class="muted">Budżet wojskowy</span>
        <div class="big">${Math.round(m.budget)}</div>
      </div>
    </div>

    <div class="glass panel">
      <div class="eyebrow">Decyzje wojskowe</div>

      <button class="action militaryAction" data-action="budget" style="margin-top:10px">
        Zwiększ budżet obronny
        <small>Koszt budżetu państwa · poprawia gotowość i wyposażenie</small>
      </button>

      <button class="action militaryAction" data-action="modernize" style="margin-top:8px">
        Program modernizacji
        <small>Koszt 15 · poprawia wyposażenie</small>
      </button>

      <button class="action militaryAction" data-action="training" style="margin-top:8px">
        Rozszerzone ćwiczenia
        <small>Koszt 7 · poprawia gotowość i morale</small>
      </button>

      <button class="action militaryAction" data-action="reduce" style="margin-top:8px">
        Ogranicz wydatki
        <small>Zwiększa budżet państwa, obniża część parametrów wojskowych</small>
      </button>

    </div>

  </div>`;

  $$(".militaryAction").forEach(b=>b.onclick=()=>{
    const a=b.dataset.action;

    if(a==="budget"){
      if(!sandbox&&state.treasury<10)return;
      if(!sandbox)state.treasury-=10;
      m.budget+=5;
      m.readiness=clamp(m.readiness+3,0,100);
      m.equipment=clamp(m.equipment+2,0,100);
      state.opinion.security=clamp(state.opinion.security+3,0,100);
      state.opinion.business=clamp(state.opinion.business-1,0,100);
    }

    if(a==="modernize"){
      if(!sandbox&&state.treasury<15)return;
      if(!sandbox)state.treasury-=15;
      m.equipment=clamp(m.equipment+8,0,100);
      m.readiness=clamp(m.readiness+2,0,100);
      state.economy=clamp(state.economy+.5,0,100);
    }

    if(a==="training"){
      if(!sandbox&&state.treasury<7)return;
      if(!sandbox)state.treasury-=7;
      m.readiness=clamp(m.readiness+6,0,100);
      m.morale=clamp(m.morale+4,0,100);
      state.opinion.security=clamp(state.opinion.security+1,0,100);
    }

    if(a==="reduce"){
      state.treasury+=8;
      m.budget=Math.max(10,m.budget-5);
      m.readiness=clamp(m.readiness-3,0,100);
      m.equipment=clamp(m.equipment-2,0,100);
      state.opinion.business=clamp(state.opinion.business+2,0,100);
      state.opinion.security=clamp(state.opinion.security-3,0,100);
    }

    opinionSync();
    news("Podjęto nową decyzję dotyczącą polityki obronnej.");
    military();
  });
}

function economy(){
  $("#content").innerHTML=`

    </div>

    <div class="glass panel">
      <div class="eyebrow">Decyzje gospodarcze</div>

      <button class="action eco" data-action="infra" style="margin-top:10px">

        <small>Koszt 18 · gospodarka + usługi</small>
      </button>

      <button class="action eco" data-action="services" style="margin-top:8px">
        Rozszerz finansowanie usług
        <small>Koszt 14 · usługi + opinia pracowników</small>
      </button>

      <button class="action eco" data-action="business" style="margin-top:8px">
        Program inwestycji prywatnych
        <small>Koszt 8 · biznes + gospodarka</small>
      </button>

      <button class="action eco" data-action="reserve" style="margin-top:8px">
        Ograniczenie nowych wydatków
        <small>Budżet +, możliwy spadek części opinii</small>
      </button>

  $$(".eco").forEach(b=>b.onclick=()=>{

      if(!sandbox)state.treasury-=18;
      state.economy=clamp(state.economy+5,0,100);
      state.services=clamp(state.services+3,0,100);
      state.employment=clamp(state.employment+2,0,100);
      state.opinion.workers=clamp(state.opinion.workers+2,0,100);
      state.opinion.business=clamp(state.opinion.business+1,0,100);
    }

    if(a==="services"){
      if(!sandbox&&state.treasury<14)return;
      if(!sandbox)state.treasury-=14;

      state.opinion.workers=clamp(state.opinion.workers+3,0,100);
      state.opinion.seniors=clamp(state.opinion.seniors+3,0,100);

    if(a==="business"){

      if(!sandbox)state.treasury-=8;
      state.economy=clamp(state.economy+4,0,100);
      state.employment=clamp(state.employment+2,0,100);

    if(a==="reserve"){

      state.opinion.workers=clamp(state.opinion.workers-2,0,100);

      state.opinion.business=clamp(state.opinion.business+1,0,100);

}

/* ===========================
   HELPERY
=========================== */

function opinionSync(){
  const o=state.opinion;
  o.general=clamp(
    (o.workers+o.business+o.young+o.seniors+o.security)/5
      +(state.economy-50)*.08
      +(state.stability-50)*.05,
    0,100
  );
  state.approval=o.general;
}

function relationLabel(v){
  if(v>=80)return"Bardzo dobre";
  if(v>=65)return"Dobre";
  if(v>=45)return"Neutralne";
  if(v>=25)return"Napięte";
  return"Bardzo napięte";
}

function news(text){
  state.news.unshift({date:formatDate(state.date),text});
  if(state.news.length>30)state.news.length=30;
}

function stat(name,v){
  return`<div class="stat"><div class="statTop"><span class="muted">${name}</span><b>${Math.round(v)}</b></div><div class="bar"><div style="width:${clamp(v,0,100)}%"></div></div></div>`;
}

function opinionRow(n,v){
  return`<div class="row"><div class="statTop"><span>${n}</span><b>${Math.round(v)}%</b></div><div class="bar"><div style="width:${v}%"></div></div></div>`;
}

function poll(n,v){
  return`<div class="row"><div class="statTop"><span>${n}</span><b>${v.toFixed(1)}%</b></div><div class="bar"><div style="width:${v}%"></div></div></div>`;
}

function slider(id,label,value){
  return`<label>${label}: <b id="${id}Val">${Math.round(value)}</b><input id="${id}" type="range" min="0" max="100" value="${value}"></label>`;
}

function bindRange(id,cb){
  $("#"+id).oninput=e=>{
    const v=Number(e.target.value);
    $("#"+id+"Val").textContent=v;
    cb(v);
  };
}

function normalizePoll(){
  state.support=clamp(state.support,2,90);
  const rem=100-state.support;
  const total=state.rivalA+state.rivalB||1;
  state.rivalA=rem*state.rivalA/total;
  state.rivalB=100-state.support-state.rivalA;
}

function daysToElection(){
  return Math.max(0,Math.ceil((state.election-state.date)/86400000));
}

function daysUntil(date){
  return Math.max(0,Math.ceil((date-state.date)/86400000));
}

function formatDate(d){
  return new Intl.DateTimeFormat("pl-PL",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(d);
}

function rand(a,b){return Math.random()*(b-a)+a}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
