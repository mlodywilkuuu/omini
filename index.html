function migrate(s){const d=defaultState();s={...d,...s};s.version=6;s.office={...d.office,...(s.office||{})};s.regions={...d.regions,...(s.regions||{})};COUNTRIES.forEach(c=>{if(!(c in s.regions))s.regions[c]=false});s.regions.Polska=true;s.timeSpeed=Number(s.timeSpeed)||1;s.paused=!!s.paused;s.timeTick=Number(s.timeTick)||0;s.gpu=Number(s.gpu)||0;s.gpuLevel=Number(s.gpuLevel)||1;s.gpuUsed=0;s.models=Array.isArray(s.models)?s.models:[];s.employees=Array.isArray(s.employees)?s.employees:[];s.products=Array.isArray(s.products)?s.products:[];s.subsidiaries=Array.isArray(s.subsidiaries)?s.subsidiaries:[];s.technologies=Array.isArray(s.technologies)?s.technologies:[];s.events=Array.isArray(s.events)?s.events:[];s.acquiredCompanies=Array.isArray(s.acquiredCompanies)?s.acquiredCompanies:[];s.incomeHistory=Array.isArray(s.incomeHistory)?s.incomeHistory:[];s.expenseHistory=Array.isArray(s.expenseHistory)?s.expenseHistory:[];s.profitHistory=Array.isArray(s.profitHistory)?s.profitHistory:[];s.userHistory=Array.isArray(s.userHistory)?s.userHistory:[s.users];s.products.forEach(p=>{p.id=p.id||uid();p.status=p.status||'AKTYWNY';p.version=p.version||'v1.0';p.markets=Array.isArray(p.markets)?p.markets:(p.market?[p.market]:['Polska']);p.languages=Array.isArray(p.languages)?p.languages:['polski'];p.value=Number(p.value)||100000;p.revenueDay=Number(p.revenueDay)||0;p.updates=Number(p.updates)||0;p.updatesLog=Array.isArray(p.updatesLog)?p.updatesLog:[];p.ownerId=p.ownerId||'NEXORA'});s.subsidiaries.forEach(c=>{c.id=c.id||uid();c.parentId=c.parentId||null;c.type=c.type||'Software';c.strategy=c.strategy||'Wzrost';c.products=Array.isArray(c.products)?c.products:[];c.children=Array.isArray(c.children)?c.children:[]});s.companies=Array.isArray(s.companies)?s.companies:d.companies;s.companies.forEach(c=>{c.shares=100;c.holders=Array.isArray(c.holders)?c.holders:[];if(!c.holders.length)c.holders=[['Public Investors',100]];normalize(c);c.history=Array.isArray(c.history)?c.history:[c.price]});return s}
function normalize(c){c.holders=(c.holders||[]).filter(h=>Number(h[1]||0)>0);let total=c.holders.reduce((a,h)=>a+Number(h[1]||0),0);if(total!==100){let pub=c.holders.find(h=>h[0]==='Public Investors');if(!pub){pub=['Public Investors',0];c.holders.push(pub)}pub[1]+=100-total}c.holders=c.holders.filter(h=>Number(h[1]||0)>0);c.owned=playerShares(c);c.controlled=c.owned>=51}
function playerShares(c){const h=c.holders.find(x=>x[0]==='NEXORA');return h?Number(h[1]):0}
function shareholderCount(c){normalize(c);return c.holders.filter(h=>Number(h[1]||0)>0).length}
function save(show=false){localStorage.setItem(KEY,JSON.stringify(S));if(show)toast('💾 Gra zapisana')}
function money(n){return '$'+Math.round(n).toLocaleString('en-US')}
function num(n){return Math.round(n||0).toLocaleString('pl-PL')}
function escapeHtml(x){return String(x??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\':'&#92;'}[m]))}
function toast(t){const x=document.createElement('div');x.textContent=t;document.getElementById('toast').appendChild(x);setTimeout(()=>x.remove(),2800)}
function cashEffect(amount,label){if(!amount)return;const e=document.createElement('div');e.className='cashfloat '+(amount>0?'plus':'minus');e.textContent=(amount>0?'+':'−')+money(Math.abs(amount))+(label?' · '+label:'');document.body.appendChild(e);setTimeout(()=>e.remove(),1300)}
function refreshTopCash(){const c=document.getElementById('cashValue'),d=document.getElementById('cashDay'),p=document.getElementById('cashProfit'),sh=document.getElementById('cashShares');if(c)c.textContent=money(S.cash);if(d)d.textContent=`Dzień ${S.day} · ${S.month}/${S.year}`;const last=S.profitHistory.at(-1)||0;if(p)p.textContent=`Wynik: ${last>=0?'+':'−'}${money(Math.abs(last))}`;if(sh)sh.textContent=`Udziały: +${money(sharesDailyIncome())}/d`}
function changeCash(v,label=''){S.cash=Math.max(0,S.cash+v);cashEffect(v,label);refreshTopCash()}
function spend(v,label='wydatek'){if(S.cash<v){toast('Brakuje '+money(v-S.cash));return false}changeCash(-v,label);return true}
function earn(v,label='przychód'){changeCash(v,label)}
function officeCapacity(){return 5+(S.office.level-1)*5}
function officeCost(){return Math.round(75000*Math.pow(S.office.level,1.28))}
function gpuUpgradeCost(){return 60000*(S.gpuLevel||1)}
function serverUpgradeCost(s){return 80000*s.level}
function techBonus(){return S.technologies.reduce((a,id)=>{const t=TECHS.find(x=>x[0]===id);return a+(t?t[3]:0)},0)}
function sharesDailyIncome(){return S.companies.reduce((a,c)=>a+playerShares(c)*c.price*.012,0)}
function valuation(){const p=S.products.reduce((a,x)=>a+x.value,0),subs=S.subsidiaries.reduce((a,x)=>a+x.value,0),stocks=S.companies.reduce((a,c)=>a+playerShares(c)*c.price,0);return Math.max(2500000,S.cash*2+p*3+subs+stocks+S.users*1.7+S.reputation*10000)}
function dailyCalc(){let income=0,expense=0;const prodBonus=1+techBonus()/2;S.products.forEach(p=>{const growth=Math.max(1,Math.round(p.users*(.012+(p.rating-60)/5000)));p.users+=growth;p.value=Math.max(p.value,p.users*p.rating*4);let r=Math.round(p.users*(.12+p.rating/700)*prodBonus);if(p.type==='AI')r=Math.round(r*1.35);if(p.markets?.length)r=Math.round(r*(1+Math.min(.5,p.markets.length*.015)));if(p.languages?.length)r=Math.round(r*(1+Math.min(.35,p.languages.length*.006)));p.revenueDay=r;income+=r});S.subsidiaries.forEach(c=>{let r=Math.round((c.revenueDay||5000)*(c.strategy==='Zysk'?1.15:c.strategy==='Innowacje'?1.10:1.05));c.revenueDay=r;income+=r});income+=Math.round(S.users*(.025+S.reputation/10000)*(S.products.length?1:.35));income+=Math.round(sharesDailyIncome());expense+=S.employees.reduce((a,e)=>a+(Number(e.salary)||0),0);expense+=S.servers.reduce((a,s)=>a+2500+s.level*900,0);expense+=S.gpu*35;expense+=S.office.level*750;const profit=income-expense;if(income)earn(income,'przychód dnia');if(expense)changeCash(-expense,'pensje + infrastruktura');S.users=Math.round(S.users*(1.012+S.reputation/50000));S.researchPoints+=10;S.incomeHistory.push(income);S.expenseHistory.push(expense);S.profitHistory.push(profit);S.userHistory.push(S.users);S.incomeHistory=S.incomeHistory.slice(-40);S.expenseHistory=S.expenseHistory.slice(-40);S.profitHistory=S.profitHistory.slice(-40);S.userHistory=S.userHistory.slice(-40);S.stats={day:S.day,income,expense,profit,payroll:S.employees.reduce((a,e)=>a+(Number(e.salary)||0),0),products:S.products.length,productUsers:S.products.reduce((a,p)=>a+p.users,0),productRevenue:S.products.reduce((a,p)=>a+(p.revenueDay||0),0),subsidiaryRevenue:S.subsidiaries.reduce((a,c)=>a+(c.revenueDay||0),0),gpu:S.gpu,gpuLevel:S.gpuLevel,servers:S.servers.length,employees:S.employees.length,models:S.models.length,valuation:valuation()};S.companies.forEach(c=>{c.prev=c.price;c.price=Math.max(1,Math.round(c.price*(1+(Math.random()-.45)*.08+(c.controlled?.012:0))*100)/100);c.history.push(c.price);c.history=c.history.slice(-40);normalize(c)});return{income,expense,profit}}
function nextDay(auto=false){const r=dailyCalc();S.day++;if(S.day>30){S.day=1;S.month++;if(S.month>12){S.month=1;S.year++}}if(Math.random()<.18)randomEvent();save();render();if(!auto)toast(`Dzień ${S.day}: ${r.profit>=0?'zysk ':'strata '}${money(Math.abs(r.profit))}`)}
function tickTime(){if(S.paused)return;S.timeTick++;if(S.timeTick>=Math.max(1,Math.round(30/S.timeSpeed))){S.timeTick=0;nextDay(true)}else{refreshTopCash()}}
setInterval(tickTime,1000);setInterval(()=>save(),5000);
function setSpeed(v){S.timeSpeed=v;S.paused=false;save();render();toast(`⏱ Czas: ${v===.5?'wolno':v===1?'normalnie':v===2?'szybko':'bardzo szybko'}`)}
function togglePause(){S.paused=!S.paused;save();render()}
function randomEvent(){const e=[['🚀 Viral produktu','Reputacja +3',()=>S.reputation=Math.min(100,S.reputation+3)],['📉 Rynek zwalnia','Reputacja -2',()=>S.reputation=Math.max(0,S.reputation-2)],['☁️ Boom na cloud','Użytkownicy +1.5%',()=>S.users=Math.round(S.users*1.015)],['⚖️ Regulator','Koszt 25k',()=>changeCash(-Math.min(S.cash,25000),'kara regulatora')]][Math.floor(Math.random()*4)];e[2]();S.events.unshift(`${e[0]} — ${e[1]}`);S.events=S.events.slice(0,50)}
function renderNav(){document.getElementById('nav').innerHTML=NAV.map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]} &nbsp; ${n[2]}</button>`).join('')}
function go(p){page=p;render()}
function render(){renderNav();const meta={dashboard:['Dashboard','Centrum dowodzenia NEXORA.'],products:['Produkty','Produkcja, aktualizacje, rynki i języki.'],ai:['AI Lab','Modele AI i rozwój sztucznej inteligencji.'],employees:['Pracownicy','Zespół i rzeczywiste koszty wynagrodzeń.'],servers:['Data Center','Serwery, GPU i ulepszanie infrastruktury.'],companies:['Firmy','Spółki córki, podspółki i przypisywanie produktów.'],stocks:['Giełda','Lista inwestorów, zakupy udziałów i przejęcia.'],world:['Ekspansja','Wszystkie kraje świata.'],rnd:['R&D','Technologie zwiększające przewagę NEXORA.'],stats:['Statystyki','Żywe dane całego imperium.'],finance:['Finanse','Przychody i wszystkie koszty.'],events:['Wydarzenia','Historia zdarzeń.'],settings:['Ustawienia','Tempo czasu i zapis.']}[page];document.getElementById('pageTitle').textContent=meta[0];document.getElementById('pageSub').textContent=meta[1];document.getElementById('content').innerHTML=pages[page]?pages[page]():pages.dashboard();refreshTopCash()}
function stat(a,b,c,g=true){return`<div class="card stat"><div class="label">${a}</div><div class="value">${b}</div><div class="delta ${g?'goodtxt':'badtxt'}">${c}</div></div>`}
function mini(a,b){return`<div class="row"><span>${a}</span><b>${b}</b></div>`}
function goal(label,val,max){const p=Math.min(100,val/max*100);return`<div style="margin:13px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${label}</span><span class="muted">${num(val)}/${num(max)}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}
function chart(arr){if(!arr.length)return`<div class="empty">Brak danych — czas musi wykonać pierwszy dzień.</div>`;const mx=Math.max(1,...arr.map(x=>Math.abs(x)));return`<div class="chart">${arr.slice(-14).map(v=>`<div class="col"><i title="${money(v)}" style="height:${Math.max(4,Math.abs(v)/mx*125)}px"></i><span>${v>=0?'+':'−'}</span></div>`).join('')}</div>`}
function selectionGrid(id,items,selected=[]){return`<div class="checkgrid">${items.map(x=>`<label class="check"><input type="checkbox" data-group="${id}" value="${escapeHtml(x)}" ${selected.includes(x)?'checked':''}>${escapeHtml(x)}</label>`).join('')}</div>`}
function checkedValues(group){return[...document.querySelectorAll(`input[data-group="${group}"]:checked`)].map(x=>x.value)}
const pages={
 dashboard(){return`<div class="hero"><h2>${escapeHtml(S.companyName)} — dzień ${S.day}, ${S.month}/${S.year}</h2><p>Czas gry działa automatycznie. Możesz go zatrzymać, zwolnić albo przyspieszyć.</p></div><div class="grid section">${stat('Wycena',money(valuation()),'szacunkowa')}${stat('Użytkownicy',num(S.users),'wzrost organiczny')}${stat('Pracownicy',`${S.employees.length} / ${officeCapacity()}`,`pensje ${money(S.employees.reduce((a,e)=>a+e.salary,0))}/d`,false)}${stat('GPU',num(S.gpu),`poziom ${S.gpuLevel}`)}</div><div class="card section"><div class="sectionTitle"><h2>⏱ Sterowanie czasem</h2><span class="pill">${S.paused?'ZATRZYMANY':'AKTYWNY'}</span></div><div class="speedbar"><button class="small ${S.paused?'active':''}" onclick="togglePause()">${S.paused?'▶ Wznów':'⏸ Zatrzymaj'}</button><button class="small ${S.timeSpeed===.5&&!S.paused?'active':''}" onclick="setSpeed(.5)">0.5× Wolno</button><button class="small ${S.timeSpeed===1&&!S.paused?'active':''}" onclick="setSpeed(1)">1× Normalnie</button><button class="small ${S.timeSpeed===2&&!S.paused?'active':''}" onclick="setSpeed(2)">2× Szybko</button><button class="small ${S.timeSpeed===4&&!S.paused?'active':''}" onclick="setSpeed(4)">4× Bardzo szybko</button></div><p class="muted">1 dzień trwa około ${Math.round(30/S.timeSpeed)} sekund przy aktualnej prędkości.</p></div><div class="two section"><div class="card"><h2>📈 Wynik</h2>${chart(S.profitHistory)}</div><div class="card"><h2>🎯 Cele</h2>${goal('100 tys. użytkowników',S.users,100000)}${goal('10 produktów',S.products.length,10)}${goal('51% jednej firmy',Math.max(0,...S.companies.map(playerShares)),51)}${goal('10 poziom HQ',S.office.level,10)}</div></div>`},
 products(){return`<div class="sectionTitle"><h2>Ekosystem produktów</h2><button onclick="createProduct()">＋ Nowy produkt</button></div>${S.products.length?`<div class="productGrid">${S.products.map(productCard).join('')}</div>`:`<div class="empty">Brak produktów. Uruchom pierwszy w oknie Centrum produkcji.</div>`}`},
 ai(){return`<div class="two"><div class="card"><div class="sectionTitle"><h2>🧠 Moje modele AI</h2><button onclick="trainAI()">＋ Trenuj nowy model</button></div><p class="muted">Modele zapisują się w grze i pozostają na liście po odświeżeniu.</p>${S.models.length?`<div class="list">${S.models.map((m,i)=>`<div class="row"><div><strong>${escapeHtml(m.name)}</strong><small>${m.params}B parametrów · jakość ${m.quality}/100 · ${m.architecture||'Neural'}</small></div><span class="pill">${m.status}</span></div>`).join('')}</div>`:`<div class="empty">Nie masz jeszcze własnego modelu AI.</div>`}</div><div class="card"><div class="sectionTitle"><h2>⚡ GPU</h2><span class="pill">LVL ${S.gpuLevel}</span></div><div class="metric">${num(S.gpu)} GPU</div><p class="muted">${num(S.gpuUsed)} zajętych · ${num(S.gpu-S.gpuUsed)} wolnych</p><div class="progress"><i style="width:${Math.min(100,S.gpuUsed/Math.max(1,S.gpu)*100)}%"></i></div><div class="actions"><button onclick="buyGPU()">＋ Kup GPU — $35k</button><button onclick="upgradeGPU()">⚡ Ulepsz GPU — ${money(gpuUpgradeCost())}</button></div>${mini('Poziom sprzętu',S.gpuLevel)}${mini('Łączny koszt GPU/d',money(S.gpu*35))}${mini('Modeli AI',S.models.length)}</div></div>`},

 servers(){return`<div class="two"><div class="card"><div class="sectionTitle"><h2>☁️ Data Center</h2><button onclick="buyServer()">＋ Kup serwer</button></div><div class="list">${S.servers.map((s,i)=>`<div class="row"><div><strong>${escapeHtml(s.name)}</strong><small>Poziom ${s.level} · obciążenie ${s.load}%</small></div><div class="actions"><button class="small" onclick="upgradeServer(${i})">Ulepsz ${money(serverUpgradeCost(s))}</button><button class="small danger" onclick="removeServer(${i})">Usuń</button></div></div>`).join('')}</div></div><div class="card"><h2>📊 Stan infrastruktury</h2>${mini('Serwery',S.servers.length)}${mini('GPU',S.gpu)}${mini('GPU poziom',S.gpuLevel)}${mini('Modele AI',S.models.length)}${mini('Koszty serwerów/d',money(S.servers.reduce((a,s)=>a+2500+s.level*900,0)))}</div></div>`},
 companies(){const roots=S.subsidiaries.filter(c=>!c.parentId);return`<div class="sectionTitle"><h2>Struktura korporacyjna</h2><button onclick="createSubsidiary()">＋ Utwórz spółkę</button></div><div class="three section">${roots.map(c=>subsidiaryCard(c,S.subsidiaries.indexOf(c))).join('')||'<div class="empty">Nie masz spółek zależnych.</div>'}</div><div class="card section"><h2>📦 Wszystkie produkty i właściciele</h2><table class="table"><tr><th>Produkt</th><th>Typ</th><th>Właściciel</th><th>Rynki</th><th>Języki</th></tr>${S.products.map(p=>`<tr><td><b>${escapeHtml(p.name)}</b></td><td>${p.type}</td><td>${escapeHtml(ownerName(p.ownerId))}</td><td>${(p.markets||[]).length}</td><td>${(p.languages||[]).length}</td></tr>`).join('')||'<tr><td colspan="5">Brak produktów</td></tr>'}</table></div><div class="card section"><h2>📈 Spółki giełdowe</h2><table class="table"><tr><th>Firma</th><th>Branża</th><th>NEXORA</th><th>Kontrola</th><th></th></tr>${S.companies.map((c,i)=>`<tr><td><b>${escapeHtml(c.name)}</b><br><small>${c.ticker}</small></td><td>${c.type}</td><td>${playerShares(c)}/100</td><td>${c.controlled?'<span class="goodtxt">51%+ KONTROLA</span>':'Brak'}</td><td><button class="small" onclick="openCompany(${i})">Otwórz inwestorów</button></td></tr>`).join('')}</table></div>`},
 stocks(){S.companies.forEach(normalize);return`<div class="card"><div class="sectionTitle"><h2>📈 Giełda NEXORA</h2><span class="pill">100 udziałów / firma</span></div><p class="muted">Udziały zmieniają się tylko po transakcjach. Po przejęciu 100% firma znika z giełdy i trafia do portfela NEXORA.</p><div class="three">${S.companies.map((c,i)=>`<div class="card clickable" onclick="openCompany(${i})"><div class="productTop"><h3>${escapeHtml(c.name)}</h3><span class="pill">${c.ticker}</span></div><div class="metric">${money(c.price)}</div><p class="muted">NEXORA: ${playerShares(c)}/100 · ${c.controlled?'KONTROLA':'mniejszość'} · <b>${shareholderCount(c)} udziałowców</b></p><div class="list">${c.holders.map(h=>`<div class="row"><span>${escapeHtml(h[0])}</span><b>${h[1]}%</b></div>`).join('')}</div><button class="small" onclick="event.stopPropagation();openCompany(${i})">Zobacz / kup udziały</button></div>`).join('')||'<div class="empty">Brak firm na giełdzie.</div>'}</div>${S.acquiredCompanies.length?`<div class="card section"><div class="sectionTitle"><h2>🏢 Przejęte firmy</h2><span class="pill">${S.acquiredCompanies.length}</span></div><div class="three">${S.acquiredCompanies.map(c=>`<div class="card"><div class="productTop"><h3>${escapeHtml(c.name)}</h3><span class="pill">${c.ticker}</span></div><p class="muted">100% własności NEXORA · ${escapeHtml(c.type)}</p><div class="metric">${money(c.price)}</div><small>Usunięta z giełdy po pełnym przejęciu.</small></div>`).join('')}</div></div>`:''}</div>`},
 world(){const active=Object.values(S.regions).filter(Boolean).length;return`<div class="two"><div class="card"><h2>🌍 Globalna ekspansja</h2><div class="map">${COUNTRIES.slice(0,35).map((r,i)=>`<div class="city" style="left:${5+(i*17)%88}%;top:${8+(i*29)%82}%">${S.regions[r]?'●':'○'} <b>${escapeHtml(r)}</b></div>`).join('')}</div><p class="muted">Aktywne rynki: ${active}/${COUNTRIES.length}</p></div><div class="card"><div class="sectionTitle"><h2>Wszystkie kraje</h2><input id="countrySearch" oninput="filterCountries()" placeholder="Szukaj kraju..." style="max-width:200px"></div><div class="list" id="countryList">${COUNTRIES.map(r=>`<div class="row countryRow"><div><strong>${escapeHtml(r)}</strong><small>${S.regions[r]?'Rynek aktywny':'Rynek zamknięty'}</small></div>${S.regions[r]?'<span class="pill goodtxt">AKTYWNY</span>':`<button class="small" onclick="expandCountry('${escapeHtml(r)}')">Otwórz</button>`}</div>`).join('')}</div></div></div>`},
 rnd(){return`<div class="two"><div class="card"><h2>🔬 Technologie</h2>${TECHS.map(t=>`<div class="row"><div><strong>${t[0]}</strong><small>${t[2]}</small></div><button class="small" ${S.technologies.includes(t[0])?'disabled':''} onclick="research('${t[0]}',${t[1]})">${S.technologies.includes(t[0])?'ODBLOCKOWANA':t[1]+' RP'}</button></div>`).join('')}</div><div class="card"><h2>Postęp R&D</h2><div class="metric">${S.researchPoints} RP</div><p class="muted">Odblokowano ${S.technologies.length}/${TECHS.length}</p><div class="progress"><i style="width:${S.technologies.length/TECHS.length*100}%"></i></div></div></div>`},
 stats(){const productUsers=S.products.reduce((a,p)=>a+p.users,0),prodRev=S.products.reduce((a,p)=>a+(p.revenueDay||0),0),subRev=S.subsidiaries.reduce((a,c)=>a+(c.revenueDay||0),0),pay=S.employees.reduce((a,e)=>a+(Number(e.salary)||0),0),srv=S.servers.reduce((a,s)=>a+2500+s.level*900,0),gpuCost=S.gpu*35;return`<div class="grid">${stat('Wycena',money(valuation()),'aktualizowana na żywo')}${stat('Produktów',S.products.length,`${num(productUsers)} użytkowników`)}${stat('Modeli AI',S.models.length,`GPU ${num(S.gpu)} / lvl ${S.gpuLevel}`)}${stat('Spółek',S.subsidiaries.length,`${S.subsidiaries.filter(c=>c.parentId).length} podspółek`)}</div><div class="three section">${stat('Przychód produktów',money(prodRev),'/ dzień')}${stat('Przychód spółek',money(subRev),'/ dzień')}${stat('Pensje',money(pay),'/ dzień',false)}${stat('Serwery',S.servers.length,`koszt ${money(srv)}/d`)}${stat('GPU',S.gpu,`koszt ${money(gpuCost)}/d`)}${stat('Udziały',money(S.companies.reduce((a,c)=>a+playerShares(c)*c.price,0)),'wartość portfela')}</div><div class="two section"><div class="card"><h2>📊 Przychody vs wydatki</h2>${cashFlowChart()}</div><div class="card"><h2>👥 Użytkownicy</h2>${chart(S.userHistory)}</div></div>`},
 finance(){const inc=S.incomeHistory.at(-1)||0,exp=S.expenseHistory.at(-1)||0,profit=S.profitHistory.at(-1)||0;return`<div class="grid">${stat('Przychód/d',money(inc),'ostatni dzień')}${stat('Wydatki/d',money(exp),'ostatni dzień',false)}${stat('Zysk/d',money(profit),profit>=0?'dodatni':'ujemny',profit>=0)}${stat('Gotówka',money(S.cash),'saldo')}</div><div class="two section"><div class="card"><h2>Wynik dzienny</h2>${chart(S.profitHistory)}</div><div class="card"><h2>Struktura kosztów</h2>${costBars()}</div></div>`},
 events(){return`<div class="card"><h2>📰 Historia</h2><div class="timeline">${S.events.map(e=>`<div class="event"><strong>${escapeHtml(e)}</strong><div class="muted">Dzień ${S.day}</div></div>`).join('')}</div></div>`},
 settings(){return`<div class="three"><div class="card"><h2>⏱ Czas</h2><p class="muted">Aktualnie: ${S.paused?'zatrzymany':S.timeSpeed+'×'}</p><div class="actions"><button onclick="togglePause()">${S.paused?'▶ Wznów':'⏸ Zatrzymaj'}</button><button onclick="setSpeed(.5)">0.5×</button><button onclick="setSpeed(1)">1×</button><button onclick="setSpeed(2)">2×</button><button onclick="setSpeed(4)">4×</button></div></div><div class="card"><h2>💾 Zapis</h2><button onclick="save(true)">Zapisz teraz</button></div><div class="card"><h2>🔄 Nowa gra</h2><button class="danger" onclick="resetGame()">Reset gry</button></div></div>`}
};
function productCard(p,i){return`<div class="card product clickable" onclick="openProduct(${i})"><div class="productTop"><h3>${escapeHtml(p.name)}</h3><span class="pill">${p.type}</span></div><div class="metric">${num(p.users)}</div><small class="muted">użytkowników</small><div class="miniGrid"><div class="mini"><span>Ocena</span><b>${p.rating}/100</b></div><div class="mini"><span>Przychód/d</span><b>${money(p.revenueDay)}</b></div><div class="mini"><span>Rynki</span><b>${(p.markets||[]).length}</b></div><div class="mini"><span>Języki</span><b>${(p.languages||[]).length}</b></div></div><div class="productStatus">● ${p.status} · ${p.version} · właściciel: ${escapeHtml(ownerName(p.ownerId))}</div><div class="actions"><button class="small" onclick="event.stopPropagation();openUpdateProduct(${i})">🔄 Aktualizuj</button><button class="small secondary" onclick="event.stopPropagation();openProductAssignment(${i})">🏢 Przypisz</button><button class="small danger" onclick="event.stopPropagation();removeProduct(${i})">Wycofaj</button></div></div>`}
function candidateHTML(){if(!S.candidate)return`<div class="empty" style="margin-top:14px">Wygeneruj kandydata.</div>`;const c=S.candidate;return`<div class="card successBox" style="margin-top:14px"><strong>${escapeHtml(c.name)}</strong><p class="muted">${c.role} · ${c.department}<br>Poziom ${c.level} · produktywność ${c.productivity}% · ${money(c.salary)}/dzień</p><div class="actions"><button onclick="hireCandidate()">Zatrudnij</button><button class="secondary" onclick="S.candidate=null;save();render()">Odrzuć</button></div></div>`}
function cashFlowChart(){const n=Math.max(S.incomeHistory.length,S.expenseHistory.length);if(!n)return'<div class="empty">Brak danych.</div>';const max=Math.max(1,...S.incomeHistory,...S.expenseHistory);return`<div class="chart">${Array.from({length:Math.min(14,n)},(_,k)=>{const i=n-Math.min(14,n)+k,inc=S.incomeHistory[i]||0,exp=S.expenseHistory[i]||0;return`<div class="col"><i title="Przychód ${money(inc)}" style="height:${Math.max(4,inc/max*125)}px"></i><i title="Wydatki ${money(exp)}" style="height:${Math.max(4,exp/max*90)}px;opacity:.4"></i><span>${i+1}</span></div>`}).join('')}</div>`}
function costBars(){const total=Math.max(1,S.expenseHistory.at(-1)||1),a=S.employees.reduce((x,e)=>x+e.salary,0),b=S.servers.reduce((x,s)=>x+2500+s.level*900,0),c=S.gpu*35,d=S.office.level*750;return goal('Pensje',a,total)+goal('Serwery',b,total)+goal('GPU',c,total)+goal('HQ',d,total)}
function openModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function upgradeOffice(){if(S.office.level>=100)return toast('HQ ma maksymalny poziom');if(spend(officeCost(),'ulepszenie HQ')){S.office.level++;save();render();toast('🏢 HQ ulepszone do poziomu '+S.office.level)}}
function generateCandidate(){if(S.employees.length>=officeCapacity())return toast('Brak miejsca w biurze');const r=ROLES[Math.floor(Math.random()*ROLES.length)];S.candidate={name:['Adam','Maja','Oskar','Julia','Kacper','Zofia','Leon','Lena','Maks','Nina'][Math.floor(Math.random()*10)]+' '+['Kowalski','Nowak','Wójcik','Mazur','Lis','Kaczmarek'][Math.floor(Math.random()*6)],role:r[0],salary:r[1]+Math.floor(Math.random()*600-300),department:r[2],level:1+Math.floor(Math.random()*8),productivity:70+Math.floor(Math.random()*31)};save();render()}
function hireCandidate(){if(!S.candidate)return;if(S.employees.length>=officeCapacity())return toast('Brak miejsca');S.employees.push({...S.candidate,id:uid()});S.candidate=null;save();render();toast('👨‍💻 Zatrudniono pracownika')}
function fire(i){if(confirm('Zwolnić pracownika?')){S.employees.splice(i,1);save();render()}}
function createProduct(){if(!S.employees.length)return toast('Najpierw zatrudnij pracownika');openModal(`<div class="modalHead"><div><h2>🚀 Centrum produkcji</h2><p class="muted">Wybierz wiele rynków i wiele języków.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>Nazwa<input id="newProductName" placeholder="np. NEXORA Search"></label><label>Typ<select id="newProductType">${PRODUCT_TYPES.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Rynki${selectionGrid('newMarkets',COUNTRIES,['Polska'])}</label><label>Języki${selectionGrid('newLanguages',LANGUAGES,['polski','angielski'])}</label><div class="card"><b>Koszt uruchomienia: ${money(25000+S.employees.length*2500)}</b></div><button onclick="confirmCreateProduct()">🚀 Uruchom produkt</button></div>`)}
function confirmCreateProduct(){const name=document.getElementById('newProductName').value.trim(),type=document.getElementById('newProductType').value,markets=checkedValues('newMarkets'),languages=checkedValues('newLanguages');if(!name)return toast('Podaj nazwę');if(!markets.length)return toast('Wybierz rynek');if(!languages.length)return toast('Wybierz język');const cost=25000+S.employees.length*2500;if(!spend(cost,'uruchomienie produktu'))return;S.products.push({id:uid(),name,type,rating:60+Math.floor(Math.random()*40),users:300+Math.floor(Math.random()*3000),value:100000,revenueDay:0,version:'v1.0',status:'AKTYWNY',markets,languages,updates:0,updatesLog:[],ownerId:'NEXORA'});save();closeModal();render();toast('🚀 Produkt uruchomiony')}
function openProduct(i){const p=S.products[i];openModal(`<div class="modalHead"><div><h2>📦 ${escapeHtml(p.name)}</h2><p class="muted">${p.type} · ${p.version} · ${escapeHtml(ownerName(p.ownerId))}</p></div><button class="close" onclick="closeModal()">×</button></div><div class="grid">${stat('Użytkownicy',num(p.users),'aktywni')}${stat('Ocena',p.rating+'/100','jakość')}${stat('Przychód/d',money(p.revenueDay),'ostatni dzień')}${stat('Aktualizacje',p.updates||0,'wdrożonych')}</div><div class="card section"><h3>🌍 Zasięg</h3><p class="muted">${(p.markets||[]).length} rynków · ${(p.languages||[]).length} języków</p><div class="actions"><button onclick="openUpdateProduct(${i})">🔄 Panel aktualizacji</button><button onclick="openProductAssignment(${i})">🏢 Przypisz do spółki</button></div></div><div class="card section"><h3>📜 Ostatnie aktualizacje</h3>${(p.updatesLog||[]).slice(0,8).map(u=>`<div class="row"><div><strong>Dzień ${u.day}</strong><small>${u.options.join(' · ')}</small></div><span class="pill">${u.markets.length} rynków · ${u.langs.length} jęz.</span></div>`).join('')||'<div class="empty">Brak aktualizacji.</div>'}</div>`)}
function openUpdateProduct(i){const p=S.products[i];const base=Math.round(18000+(p.rating||60)*350);openModal(`<div class="modalHead"><div><h2>🔄 Panel aktualizacji — ${escapeHtml(p.name)}</h2><p class="muted">Możesz zaznaczyć wiele zmian, krajów i języków jednocześnie.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>Co aktualizujesz?${selectionGrid('updateOptions',UPDATE_OPTIONS.map(x=>x[1]),[])}</label><label>Rynki / kraje${selectionGrid('updateMarkets',COUNTRIES,p.markets||['Polska'])}</label><label>Języki${selectionGrid('updateLanguages',LANGUAGES,p.languages||['polski'])}</label><div class="card"><h3>💰 Koszt bazowy</h3><div class="metric">${money(base)}</div><p class="muted">Więcej zaznaczonych zmian zwiększa koszt, ale również efekt.</p></div><button onclick="confirmProductUpdate(${i},${base})">🚀 Wdróż aktualizację</button></div>`)}
function confirmProductUpdate(i,base){const p=S.products[i],opts=checkedValues('updateOptions'),markets=checkedValues('updateMarkets'),langs=checkedValues('updateLanguages');if(!opts.length)return toast('Wybierz aktualizację');if(!markets.length)return toast('Wybierz rynek');if(!langs.length)return toast('Wybierz język');const cost=Math.round(base*(1+Math.max(0,opts.length-1)*.55));if(!spend(cost,'aktualizacja produktu'))return;let usersMult=1,valueBonus=0,rating=0;opts.forEach(label=>{const o=UPDATE_OPTIONS.find(x=>x[1]===label);if(!o)return;if(o[0]==='bugs')rating+=3;if(o[0]==='content')usersMult*=1.14;if(o[0]==='ai'){rating+=8;p.aiLevel=(p.aiLevel||0)+1}if(o[0]==='features')valueBonus+=.18;if(o[0]==='performance')usersMult*=1.09;if(o[0]==='security'){rating+=3;S.reputation=Math.min(100,S.reputation+3)}if(o[0]==='design')rating+=4;if(['ads','mobile','localization','accessibility'].includes(o[0]))usersMult*=o[0]==='ads'?1.10:o[0]==='mobile'?1.12:o[0]==='localization'?1.08:1.04;if(['cloud','hardware','analytics','subscriptions'].includes(o[0]))valueBonus+=o[3]||.1});p.markets=markets;p.languages=langs;p.users=Math.round(p.users*usersMult);p.rating=Math.min(100,p.rating+rating);p.value=Math.round(p.value*(1+valueBonus)+cost*4);p.version='v'+((parseInt(String(p.version).replace(/[^0-9]/g,''))||1)+1)+'.0';p.updates=(p.updates||0)+1;p.updatesLog.unshift({day:S.day,options:opts,markets,langs,cost});save();closeModal();render();toast(`🔄 ${p.name}: ${opts.length} zmian · ${markets.length} rynków · ${langs.length} języków`)}
function openProductAssignment(i){const p=S.products[i];openModal(`<div class="modalHead"><h2>🏢 Właściciel produktu</h2><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>Przypisz do<select id="assignOwner"><option value="NEXORA">NEXORA</option>${S.subsidiaries.map(c=>`<option value="${c.id}" ${p.ownerId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></label><button onclick="assignProduct(${i})">Zapisz</button></div>`)}
function assignProduct(i){const id=document.getElementById('assignOwner').value,p=S.products[i];S.subsidiaries.forEach(c=>c.products=(c.products||[]).filter(x=>x!==p.id));p.ownerId=id;if(id!=='NEXORA'){const c=S.subsidiaries.find(x=>x.id===id);if(c){c.products=c.products||[];c.products.push(p.id)}}save();closeModal();render();toast('📦 Produkt przypisany')}
function buyGPU(){if(spend(35000,'zakup GPU')){S.gpu++;save();render();toast(`🧩 GPU: ${S.gpu}`)}}
function upgradeGPU(){const cost=gpuUpgradeCost();if(spend(cost,'ulepszenie GPU')){S.gpuLevel++;S.gpu+=5;S.models.forEach(m=>m.quality=Math.min(100,(m.quality||70)+1));save();render();toast(`⚡ GPU ulepszone: poziom ${S.gpuLevel}, ${S.gpu} GPU`)}}
function trainAI(){if(S.gpu-S.gpuUsed<5)return toast('Potrzebujesz 5 wolnych GPU');if(!spend(25000,'trening AI'))return;S.gpuUsed+=5;const m={id:uid(),name:'NEXORA Neural '+(S.models.length+1),params:4+Math.floor(Math.random()*22),quality:70+Math.floor(Math.random()*30),status:'TRENING',architecture:['Transformer','Multimodal','Agentic','Neural Search'][Math.floor(Math.random()*4)]};S.models.push(m);save();render();setTimeout(()=>{S.gpuUsed=Math.max(0,S.gpuUsed-5);m.status='GOTOWY';m.quality=Math.min(100,m.quality+2);save();render();toast('🧠 Model gotowy')},3500)}
function buyServer(){const cost=150000+S.servers.length*50000;if(spend(cost,'zakup serwera')){S.servers.push({id:uid(),name:'NEXORA Core-'+String(S.servers.length+1).padStart(2,'0'),level:1,load:10+Math.floor(Math.random()*25)});save();render();toast(`☁️ Serwery: ${S.servers.length}`)}}
function upgradeServer(i){const s=S.servers[i],cost=serverUpgradeCost(s);if(spend(cost,'ulepszenie serwera')){s.level++;s.load=Math.max(5,s.load-4);save();render();toast(`${s.name} → poziom ${s.level}`)}}
function removeServer(i){if(S.servers.length<=1)return toast('Musisz mieć minimum 1 serwer');if(confirm('Usunąć serwer?')){S.servers.splice(i,1);save();render()}}
function ownerName(id){if(!id||id==='NEXORA')return S.companyName;const c=S.subsidiaries.find(x=>x.id===id);return c?c.name:S.companyName}
function subsidiaryCard(c,i){const children=S.subsidiaries.filter(x=>x.parentId===c.id);return`<div class="card"><div class="productTop"><h3>${escapeHtml(c.name)}</h3><span class="pill">${escapeHtml(c.type||'Software')}</span></div><p class="muted">${c.strategy} · nadrzędna: ${escapeHtml(ownerName(c.parentId))}</p><div class="miniGrid"><div class="mini"><span>Wartość</span><b>${money(c.value)}</b></div><div class="mini"><span>Przychód/d</span><b>${money(c.revenueDay)}</b></div><div class="mini"><span>Produkty</span><b>${(c.products||[]).length}</b></div><div class="mini"><span>Podspółki</span><b>${children.length}</b></div></div><div class="actions"><button class="small" onclick="manageSub(${i})">Zarządzaj</button><button class="small secondary" onclick="createSubsidiary(${i})">＋ Podspółka</button><button class="small danger" onclick="closeSub(${i})">Zamknij</button></div>${children.length?`<div class="subtree">${children.map(x=>subsidiaryCard(x,S.subsidiaries.indexOf(x))).join('')}</div>`:''}</div>`}
function createSubsidiary(parentIndex=null){const parentId=parentIndex!=null?S.subsidiaries[parentIndex]?.id:null;openModal(`<div class="modalHead"><div><h2>🏢 Nowa spółka</h2><p class="muted">Pełna konfiguracja i możliwość tworzenia podspółek.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>Nazwa<input id="subName" placeholder="np. NEXORA Cloud"></label><label>Typ<select id="subType">${['AI','Cloud','Software','Hardware','Media','Cybersecurity','Gaming','Fintech','Robotics'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Strategia<select id="subStrategy"><option>Wzrost</option><option>Zysk</option><option>Innowacje</option><option>Ekspansja</option></select></label><label>Spółka nadrzędna<select id="subParent"><option value="">NEXORA</option>${S.subsidiaries.map(c=>`<option value="${c.id}" ${parentId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></label><label>Kapitał startowy<input id="subBudget" type="number" min="50000" step="10000" value="150000"></label><label>Przypisz istniejące produkty${selectionGrid('subProducts',S.products.map(p=>p.id),[])}</label><button onclick="confirmCreateSubsidiary()">🏢 Utwórz spółkę</button></div>`)}
function confirmCreateSubsidiary(){const name=document.getElementById('subName').value.trim(),type=document.getElementById('subType').value,strategy=document.getElementById('subStrategy').value,parentId=document.getElementById('subParent').value||null,budget=Math.max(50000,Number(document.getElementById('subBudget').value)||150000),prodIds=checkedValues('subProducts');if(!name)return toast('Podaj nazwę');if(!spend(budget,'kapitał spółki'))return;const c={id:uid(),name,type,strategy,parentId,value:budget*3,revenueDay:Math.round(budget*.035),capital:budget,products:[],children:[]};S.subsidiaries.push(c);prodIds.forEach(id=>{const p=S.products.find(x=>x.id===id);if(p)assignProductToSub(p,c)});save();closeModal();render();toast('◆ Utworzono '+name)}
function assignProductToSub(p,c){S.subsidiaries.forEach(x=>x.products=(x.products||[]).filter(id=>id!==p.id));p.ownerId=c.id;c.products.push(p.id)}
function manageSub(i){const c=S.subsidiaries[i];openModal(`<div class="modalHead"><div><h2>⚙ ${escapeHtml(c.name)}</h2><p class="muted">${c.type} · nadrzędna: ${escapeHtml(ownerName(c.parentId))}</p></div><button class="close" onclick="closeModal()">×</button></div><div class="grid">${stat('Wartość',money(c.value),'kapitał')}${stat('Przychód/d',money(c.revenueDay),'operacyjny')}${stat('Produkty',(c.products||[]).length,'przypisane')}${stat('Podspółki',S.subsidiaries.filter(x=>x.parentId===c.id).length,'poziom niżej')}</div><div class="actions"><button onclick="subInvest(${i})">Zainwestuj $100k</button><button onclick="subStrategy(${i})">Zmień strategię</button><button onclick="openSubProducts(${i})">📦 Produkty</button><button onclick="createSubsidiary(${i})">＋ Utwórz podspółkę</button></div>`)}
function openSubProducts(i){const c=S.subsidiaries[i];openModal(`<div class="modalHead"><h2>📦 Produkty — ${escapeHtml(c.name)}</h2><button class="close" onclick="closeModal()">×</button></div>${S.products.map((p,j)=>`<label class="check"><input type="checkbox" id="subprod${j}" ${p.ownerId===c.id?'checked':''}>${escapeHtml(p.name)} · ${p.type}</label>`).join('')||'<div class="empty">Brak produktów</div>'}<div class="actions"><button onclick="saveSubProducts(${i})">Zapisz</button></div>`)}
function saveSubProducts(i){const c=S.subsidiaries[i];S.products.forEach((p,j)=>{const b=document.getElementById('subprod'+j);if(b?.checked)assignProductToSub(p,c);else if(p.ownerId===c.id)p.ownerId='NEXORA';c.products=(c.products||[]).filter(id=>S.products.some(p=>p.id===id&&p.ownerId===c.id))});save();closeModal();render();toast('📦 Przypisania zapisane')}
function subInvest(i){if(spend(100000,'inwestycja w spółkę')){const c=S.subsidiaries[i];c.capital+=100000;c.value+=150000;c.revenueDay+=1500;closeModal();save();render();toast('Kapitał przekazany')}}
function subStrategy(i){const c=S.subsidiaries[i];c.strategy=c.strategy==='Wzrost'?'Zysk':c.strategy==='Zysk'?'Innowacje':'Wzrost';closeModal();save();render()}
function closeSub(i){const id=S.subsidiaries[i].id;if(confirm('Zamknąć spółkę?')){S.products.forEach(p=>{if(p.ownerId===id)p.ownerId='NEXORA'});S.subsidiaries=S.subsidiaries.filter(c=>c.id!==id&&c.parentId!==id);save();render()}}
function openCompany(i){const c=S.companies[i];normalize(c);openModal(`<div class="modalHead"><div><h2>📈 ${escapeHtml(c.name)} <span class="pill">${c.ticker}</span></h2><p class="muted">Cena jednego udziału: <b>${money(c.price)}</b> · 100 udziałów</p></div><button class="close" onclick="closeModal()">×</button></div><div class="grid">${stat('NEXORA',playerShares(c)+'%','udziały')}${stat('Wartość pakietu',money(playerShares(c)*c.price),'portfel')}${stat('Kontrola',c.controlled?'TAK':'NIE',c.controlled?'panel odblokowany':'potrzebujesz 51%',c.controlled)}</div><h3>Lista inwestorów <span class="pill">${shareholderCount(c)}</span></h3><div class="list">${c.holders.map((h,j)=>`<div class="row"><div><strong>${escapeHtml(h[0])}</strong><small>${h[1]} udziałów · ${money(h[1]*c.price)}</small></div>${h[0]!=='NEXORA'&&h[1]>0?`<button class="small" onclick="openBuyShares(${i},${j})">Kup od inwestora</button>`:''}</div>`).join('')}</div><div class="actions">${playerShares(c)>0?`<input id="sellQty" type="number" min="1" max="${playerShares(c)}" value="1" style="width:120px"><button class="secondary" onclick="sellShares(${i})">Sprzedaj</button>`:''}${c.controlled?`<button class="good" onclick="manageControlled(${i})">⚙ Zarządzaj firmą</button>`:''}${playerShares(c)<100?`<button class="danger" onclick="buyout(${i})">Wykup całą resztę</button>`:''}</div>`)}
function openBuyShares(ci,hi){const c=S.companies[ci];normalize(c);const h=c.holders[hi];if(!h||h[0]==='NEXORA'||h[1]<=0)return toast('Ten inwestor nie ma już udziałów');const seller=escapeHtml(h[0]);openModal(`<div class="modalHead"><div><h2>💰 Kup udziały</h2><p class="muted">${seller} · cena za udział: <b>${money(c.price)}</b></p></div><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>Liczba udziałów<input id="buyQty" type="number" min="1" max="${h[1]}" value="1"></label><div class="card"><div class="metric" id="buyTotal">${money(c.price)}</div><p class="muted">Dostępne u inwestora: ${h[1]}</p></div><button onclick="confirmBuyShares(${ci},${hi})">Kup udziały</button></div>`)}
function confirmBuyShares(ci,hi){const c=S.companies[ci];normalize(c);const row=c.holders[hi];if(!row||row[0]==='NEXORA'||row[1]<=0)return toast('Ten inwestor nie ma już udziałów');const sellerName=row[0];const h=c.holders.find(x=>x[0]===sellerName);if(!h||h[1]<=0)return toast('Ten inwestor nie ma już udziałów');const input=document.getElementById('buyQty');const q=Math.max(1,Math.min(Number(h[1]),Math.floor(Number(input?.value)||1))),cost=q*c.price;if(!spend(cost,'zakup udziałów'))return;let ph=c.holders.find(x=>x[0]==='NEXORA');if(!ph){ph=['NEXORA',0];c.holders.push(ph)}h[1]-=q;ph[1]+=q;normalize(c);save();closeModal();render();openCompany(ci);toast(`Kupiono ${q} udziałów ${c.ticker} od ${sellerName}`)}
function sellShares(i){const c=S.companies[i];normalize(c);const q=Math.min(Number(document.getElementById('sellQty').value)||0,playerShares(c));if(q<=0)return;const ph=c.holders.find(x=>x[0]==='NEXORA');if(!ph)return;let pub=c.holders.find(x=>x[0]==='Public Investors');if(!pub){pub=['Public Investors',0];c.holders.push(pub)}earn(q*c.price,'sprzedaż udziałów');ph[1]-=q;pub[1]+=q;normalize(c);save();render();openCompany(i)}
function buyout(i){const c=S.companies[i];normalize(c);const q=100-playerShares(c);if(q<=0)return toast('Masz już 100% udziałów');const cost=q*c.price;if(!spend(cost,'wykup firmy'))return;let ph=c.holders.find(h=>h[0]==='NEXORA');if(!ph){ph=['NEXORA',0];c.holders.push(ph)}ph[1]=100;c.holders=[['NEXORA',100]];c.owned=100;c.controlled=true;c.acquired=true;S.acquiredCompanies.push(c);S.companies.splice(i,1);save();closeModal();render();toast('🏆 Firma przejęta w 100% — usunięto ją z giełdy')}
function manageControlled(i){const c=S.companies[i];openModal(`<div class="modalHead"><h2>⚙ Zarządzanie: ${escapeHtml(c.name)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="card"><h3>Kontrola właścicielska</h3><p class="muted">NEXORA posiada ${playerShares(c)}%. Panel zarządzania jest odblokowany od 51%.</p></div><div class="actions"><button onclick="changeCompanyStrategy(${i})">Strategia: ${c.strategy}</button><button onclick="injectCapital(${i})">Zainwestuj $100k</button><button class="danger" onclick="mergeCompany(${i})">Połącz z NEXORA</button></div>`)}
function changeCompanyStrategy(i){const c=S.companies[i];c.strategy=c.strategy==='Wzrost'?'Zysk':'Wzrost';save();closeModal();render()}
function injectCapital(i){if(spend(100000,'kapitał firmy')){S.companies[i].capital=(S.companies[i].capital||0)+100000;S.companies[i].price*=1.04;save();closeModal();render()}}
function mergeCompany(i){const c=S.companies[i];normalize(c);if(!c.controlled)return toast('Najpierw zdobądź minimum 51% udziałów');if(!S.acquiredCompanies.some(x=>x.id===c.id)){c.holders=[['NEXORA',100]];c.owned=100;c.controlled=true;c.acquired=true;c.merged=true;S.acquiredCompanies.push(c)}S.companies.splice(i,1);closeModal();save();render();toast('🔗 Firma połączona z NEXORA — usunięto ją z giełdy')}
function expandCountry(region){const cost=region==='Polska'?0:50000+Math.round(Math.random()*950000);if(!spend(cost,'ekspansja'))return;S.regions[region]=true;S.users=Math.round(S.users*(region==='Stany Zjednoczone'?1.18:1.05));S.reputation=Math.min(100,S.reputation+1);save();render();toast('🌍 Otworzono '+region)}
function filterCountries(){const q=document.getElementById('countrySearch').value.toLowerCase();document.querySelectorAll('.countryRow').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'flex':'none')}
function research(name,cost){if(S.technologies.includes(name)||S.researchPoints<cost)return;S.researchPoints-=cost;S.technologies.push(name);save();render();toast('✦ Odblokowano '+name)}
function toggleCheats(force){const o=document.getElementById('cheatOverlay');if(!o)return;const open=typeof force==='boolean'?force:!o.classList.contains('open');o.classList.toggle('open',open);if(open)setTimeout(()=>{const i=document.getElementById('cheatInput');if(i){i.focus();i.select()}},50)}
function executeCheatText(text){const i=document.getElementById('cheatInput');if(i)i.value=text;executeCheat()}
function executeCheat(){
 const input=document.getElementById('cheatInput');
 if(!input)return;
 const raw=input.value.trim();
 if(!raw)return;
 const x=raw.split(/\s+/),cmd=(x[0]||'').toLowerCase(),v=Number(x[1]);
 let msg='Nieznana komenda';
 if(cmd==='money'&&Number.isFinite(v)){changeCash(v,'cheat');msg='Dodano '+money(v)}
 else if(cmd==='users'&&Number.isFinite(v)){S.users=Math.max(0,S.users+v);msg='Dodano '+num(v)}
 else if(cmd==='gpu'&&Number.isFinite(v)){S.gpu=Math.max(0,S.gpu+v);msg='Dodano '+v+' GPU'}
 else if(cmd==='maxgpu'){S.gpu=10000;S.gpuLevel=100;msg='MAX GPU: 10 000 / lvl 100'}
 else if(cmd==='employees'&&Number.isFinite(v)){for(let i=0;i<Math.max(0,Math.floor(v))&&S.employees.length<officeCapacity();i++){const r=ROLES[S.employees.length%ROLES.length];S.employees.push({id:uid(),name:'Cheat Employee '+(S.employees.length+1),role:r[0],salary:1,department:r[2],level:100,productivity:100})}msg='Pracownicy: '+S.employees.length}
 else if(cmd==='maxemployees'||cmd==='maxworkers'){S.office.level=100;const max=officeCapacity();while(S.employees.length<max){const r=ROLES[S.employees.length%ROLES.length];S.employees.push({id:uid(),name:'NEXORA Elite '+(S.employees.length+1),role:r[0],salary:1,department:r[2],level:100,productivity:100})}msg='MAX pracownicy: '+S.employees.length}
 else if(cmd==='rp'&&Number.isFinite(v)){S.researchPoints+=v;msg='Dodano '+v+' RP'}
 else if(cmd==='day'&&Number.isFinite(v)){S.day=Math.max(1,Math.floor(v));msg='Dzień ustawiony na '+S.day}
 else if(cmd==='office'&&Number.isFinite(v)){S.office.level=Math.max(1,Math.min(100,Math.floor(v)));msg='HQ ustawione na lvl '+S.office.level}
 else if(cmd==='rich'){S.cash+=100000000;S.users+=10000000;S.gpu+=500;msg='RICH: +$100M, +10M users, +500 GPU'}
 else if(cmd==='unlockall'){S.technologies=TECHS.map(t=>t[0]);COUNTRIES.forEach(c=>S.regions[c]=true);S.reputation=100;S.office.level=100;msg='Odblokowano wszystko'}
 document.getElementById('consoleLog').textContent='> '+raw+'\n'+msg;
 save();render();toast(msg);
 input.value='';
 input.focus();
}
document.getElementById('cheatInput').addEventListener('keydown',e=>{if(e.key==='Enter')executeCheat();if(e.key==='Escape')toggleCheats()});document.addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();toggleCheats()}if(e.key==='Escape'){closeModal();document.getElementById('cheatOverlay').classList.remove('open')}});
render();
</script>
</body>
</html>
