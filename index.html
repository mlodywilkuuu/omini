<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamForge Simulator</title>

<style>
:root{
 --bg:#070a0f;
 --side:#0b1017;
 --panel:#101720;
 --panel2:#151e29;
 --line:#263344;
 --txt:#eef4fa;
 --mut:#8f9caf;
 --red:#ff4058;
 --green:#39d98a;
 --yellow:#ffc857;
 --blue:#55a8ff;
 --purple:#a47cff
}

*{box-sizing:border-box}

body{
 margin:0;
 background:var(--bg);
 color:var(--txt);
 font:14px system-ui,Arial;
}

.app{
 display:grid;
 grid-template-columns:250px 1fr;
 min-height:100vh;
}

aside{
 background:var(--side);
 border-right:1px solid var(--line);
 padding:17px 12px;
 height:100vh;
 overflow:auto;
 position:sticky;
 top:0;
}

.logo{
 font-size:21px;
 font-weight:900;
 margin:5px 8px 20px;
}

.logo b{color:var(--red)}

.small{
 font-size:11px;
 color:var(--mut);
}

.nav{
 width:100%;
 border:0;
 background:transparent;
 color:#aab6c5;
 padding:10px 11px;
 margin:2px 0;
 border-radius:9px;
 text-align:left;
 cursor:pointer;
}

.nav span{
 display:inline-block;
 width:27px;
}

.nav:hover,
.nav.active{
 background:#1b2633;
 color:white;
}

main{
 min-width:0;
}

.top{
 min-height:68px;
 border-bottom:1px solid var(--line);
 background:#0b1017;
 padding:10px 20px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
 position:sticky;
 top:0;
 z-index:10;
}

.topstats,
.row{
 display:flex;
 gap:8px;
 align-items:center;
 flex-wrap:wrap;
}

.pill{
 background:#151e29;
 border:1px solid var(--line);
 border-radius:10px;
 padding:8px 11px;
}

.content{
 padding:22px;
 max-width:1500px;
 margin:auto;
}

.hero{
 padding:20px;
 border-radius:17px;
 border:1px solid #343246;
 background:linear-gradient(135deg,#1c1929,#111923);
 margin-bottom:14px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(205px,1fr));
 gap:11px;
 margin:12px 0;
}

.card{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:13px;
 padding:14px;
 margin-bottom:10px;
}

.card h2,
.card h3{
 margin-top:3px;
}

.mut{color:var(--mut)}
.good{color:var(--green)}
.bad{color:#ff7183}
.warn{color:var(--yellow)}
.blue{color:var(--blue)}

.btn{
 border:1px solid #3a495d;
 background:#202c3a;
 color:white;
 padding:9px 11px;
 border-radius:9px;
 cursor:pointer;
}

.btn:hover{
 filter:brightness(1.15);
}

.btn:disabled{
 opacity:.4;
 cursor:not-allowed;
}

.primary{
 background:var(--red);
 border-color:var(--red);
 font-weight:800;
}

.goodbtn{
 background:#16734b;
 border-color:#239963;
}

input,
select{
 background:#0b1119;
 color:white;
 border:1px solid #354458;
 border-radius:8px;
 padding:8px;
}

table{
 width:100%;
 border-collapse:collapse;
 background:var(--panel);
 border-radius:12px;
 overflow:hidden;
}

th,td{
 padding:10px;
 border-bottom:1px solid var(--line);
 text-align:left;
}

th{
 color:#aab7c7;
}

.tag{
 display:inline-block;
 border:1px solid #3a4a5f;
 border-radius:20px;
 padding:3px 7px;
 margin:2px;
 font-size:11px;
}

.bar{
 height:8px;
 background:#222c39;
 border-radius:20px;
 overflow:hidden;
 margin:7px 0;
}

.bar i{
 display:block;
 height:100%;
 background:var(--red);
}

.notice{
 border-left:4px solid var(--yellow);
}

.danger{
 border-left:4px solid #ff536b;
}

.success{
 border-left:4px solid var(--green);
}

h1{
 margin-top:0;
}

@media(max-width:800px){
 .app{grid-template-columns:1fr}
 aside{
   position:relative;
   height:auto;
 }
 .top{
   position:relative;
 }
 .content{
   padding:12px;
 }
}
</style>
</head>

<body>

<div class="app">

<aside>

<div class="logo">
▶ <b>Stream</b>Forge
<div class="small">VIDEO PLATFORM TYCOON</div>
</div>

<button class="nav active" data-page="dashboard">
<span>📊</span>Dashboard
</button>

</button>

</button>

</button>

<button class="nav" data-page="creators">

</button>

<button class="nav" data-page="partners">
<span>🤝</span>Program partnerski
</button>

<button class="nav" data-page="algorithm">
<span>🤖</span>Algorytm
</button>

<button class="nav" data-page="monetization">
<span>💎</span>Monetyzacja
</button>

<button class="nav" data-page="markets">
<span>🌍</span>Ekspansja
</button>

<button class="nav" data-page="competition">
<span>⚔️</span>Konkurencja
</button>

<button class="nav" data-page="investors">

</button>

<button class="nav" data-page="analytics">

</button>

<button class="nav" data-page="achievements">

</button>

</button>

<span>💰</span>Finanse
</button>

<button class="nav" data-page="decisions">

</button>

</aside>

<main>

<div class="top">

<b id="date"></b>

<div class="topstats">

<div class="pill">
💰 <b id="money"></b>
</div>

<div class="pill">
👥 <b id="users"></b>
</div>

<div class="pill">
⭐ <b id="rep"></b>
</div>

<button class="btn" onclick="changeSpeed()">
⏩ <span id="speed"></span>
</button>

<button class="btn" onclick="saveGame()">
💾
</button>

</div>

</div>

<div id="panel" class="content"></div>

</main>

</div>

<script>

/* ================================
   PODSTAWOWE FUNKCJE
================================ */

const fmt=n=>
 Math.round(Number(n)||0)
 .toLocaleString("pl-PL");

const rnd=(a,b)=>
 Math.floor(Math.random()*(b-a+1))+a;

const pick=a=>
 a[Math.floor(Math.random()*a.length)];

const clamp=(v,a,b)=>
 Math.max(a,Math.min(b,v));

const uid=()=>G.nextId++;


/* ================================
   NOWA GRA
================================ */

function fresh(){

 return{

  day:1,
  month:1,
  year:2026,

  nextId:1,

  speed:1,

  money:250000,

  launched:false,

  users:0,
  dau:0,

  creators:[],

  totalVideos:0,

  reputation:10,

  version:"0.1 Alpha",

  staff:[],

  candidates:[],

  projects:[],

  technologies:[],

  unlocked:[],

  devPoints:0,

  techLevel:1,

  bugs:0,

  stability:70,

  security:50,

  recommendation:10,

  serverCount:1,

  serverCapacity:2000,

  serverHealth:100,

  cloudCapacity:0,

  storage:5,

  premiumPrice:19.99,

  premiumUsers:0,

  adCPM:5,

  adIntensity:2,

  creatorShare:55,

  partnerMinSubs:1000,

  countries:["Polska"],

  officeLevel:1,

  officeCapacity:8,

  competitors:[
   {
    name:"Viewly",
    users:120000,
    tech:15,
    reputation:45
   },
   {
    name:"Clipster",
    users:65000,
    tech:12,
    reputation:38
   },
   {
    name:"VibeVideo",
    users:30000,
    tech:9,
    reputation:33
   }
  ],

  products:{
   Web:{level:1,quality:45,bugs:0,unlocked:true},
   Android:{level:0,quality:0,bugs:0,unlocked:false},
   iOS:{level:0,quality:0,bugs:0,unlocked:false},
   "Smart TV":{level:0,quality:0,bugs:0,unlocked:false}
  },

  trend:"Vlogi",

  worldEvent:"Brak",

  companyShares:100,

  valuation:250000,

  debt:0,

  ledger:[],

  history:[],

  decisions:[],

  achievements:[],

  outages:[],

  creatorDeals:[],

  lastCandidateDay:0,

  lastTechDay:0,

  lastWorldEvent:0,

  lastCreatorDay:0

 };

}

let G;

try{

 G=
 JSON.parse(
  localStorage.getItem(
   "streamforge-mega"
  )
 )
 || fresh();

}catch(e){

 G=fresh();

}

const base=fresh();

for(const k in base){

 if(G[k]===undefined)
  G[k]=base[k];

}


/* ================================
   PRACOWNICY
================================ */

const roles={

 "Programista":{
  salary:8500,
  department:"Development",
  dev:8,
  research:2,
  repair:2
 },

 "Badacz R&D":{
  salary:9500,
  department:"R&D",
  dev:2,
  research:10,
  repair:0
 },

 "Technik":{
  salary:7000,
  department:"Techniczny",
  dev:1,
  research:1,
  repair:10
 },

 "Administrator":{
  salary:8000,
  department:"Techniczny",
  dev:1,
  research:1,
  repair:8
 },

 "Designer UI/UX":{
  salary:7200,
  department:"Design",
  dev:5,
  research:2,
  repair:0
 },

 "Moderator":{
  salary:5200,
  department:"Moderacja",
  dev:0,
  research:0,
  repair:0
 },

 "Marketing":{
  salary:6800,
  department:"Marketing",
  dev:0,
  research:1,
  repair:0
 },

 "Creator Manager":{
  salary:7500,
  department:"Creator Relations",
  dev:0,
  research:1,
  repair:0
 },

 "Sprzedaż reklam":{
  salary:7800,
  department:"Sprzedaż",
  dev:0,
  research:0,
  repair:0
 },

 "Cybersecurity":{
  salary:10500,
  department:"Security",
  dev:2,
  research:4,
  repair:3
 },

 "HR":{
  salary:6500,
  department:"HR",
  dev:0,
  research:0,
  repair:0
 }

};

const perks=[

 "Badacz",
 "Wizjoner",
 "Technik",
 "Serwisant",
 "Administrator",
 "Optymalizator",
 "Debuger",
 "Architekt",
 "Growth Hacker",
 "Negocjator",
 "Cyber Expert",
 "Lider",
 "Szybki uczeń"

];

const perkBonus={

 "Badacz":{
  research:4
 },

 "Wizjoner":{
  research:7
 },

 "Technik":{
  repair:3
 },

 "Serwisant":{
  repair:6
 },

 "Administrator":{
  repair:4
 },

 "Optymalizator":{
  repair:3,
  dev:2
 },

 "Debuger":{
  repair:4,
  dev:2
 },

 "Architekt":{
  dev:6
 },

 "Growth Hacker":{},

 "Negocjator":{},

 "Cyber Expert":{
  research:3,
  repair:2
 },

 "Lider":{
  dev:2,
  research:2,
  repair:2
 },

 "Szybki uczeń":{
  dev:1,
  research:1,
  repair:1
 }

};

const firstNames=[
 "Maja","Julia","Zofia","Lena","Oliwia",
 "Kacper","Jakub","Michał","Adam","Filip",
 "Emilia","Natalia","Igor","Antoni","Amelia"
];

const lastNames=[
 "Nowak","Kowalski","Wiśniewski",
 "Wójcik","Kamiński","Lewandowski",
 "Zieliński","Szymański","Woźniak"
];

function employeeLevel(e){

 if(e.exp>=100)
  return "Lead";

 if(e.exp>=60)
  return "Senior";

 if(e.exp>=25)
  return "Mid";

 return "Junior";

}

function levelBonus(e){

 const l=employeeLevel(e);

 if(l==="Lead")return 1.65;
 if(l==="Senior")return 1.4;
 if(l==="Mid")return 1.18;

 return 1;

}

function staffPower(type){

 return G.staff.reduce(
  (sum,e)=>{

   const role=
    roles[e.role]?.[type]||0;

   const perk=
    perkBonus[e.perk]?.[type]||0;

   return sum+
    (role+perk)*
    levelBonus(e)*
    (.6+e.skill/100);

  },0
 );

}

function generateCandidates(){

 const count=rnd(4,7);

 for(let i=0;i<count;i++){

  const role=
   pick(Object.keys(roles));

  const skill=
   rnd(35,95);

  const salary=
   Math.round(
    roles[role].salary*
    (.75+skill/130)
    /100
   )*100;

  G.candidates.push({

   id:uid(),

   name:
    pick(firstNames)+" "+
    pick(lastNames),

   role,

   perk:pick(perks),

   skill,

   salary,

   exp:rnd(0,18)

  });

 }

 G.candidates=
  G.candidates.slice(-25);

 G.lastCandidateDay=
  absoluteDay();

}

function hire(id){

 if(
  G.staff.length>=
  G.officeCapacity
 ){

  alert(
   "Brak miejsca w biurze."
  );

  return;

 }

 const c=
  G.candidates.find(
   x=>x.id===id
  );

 if(!c)return;

 if(G.money<c.salary){

  alert(
   "Za mało pieniędzy."
  );

  return;

 }

 cash(
  -c.salary,
  "HR",
  "Rekrutacja "+c.name
 );

 G.staff.push({...c});

 G.candidates=
  G.candidates.filter(
   x=>x.id!==id
  );

 addHistory(
  "Zatrudniono "+c.name+
  " — "+c.role
 );

 render();

}

function fireEmployee(id){

 G.staff=
  G.staff.filter(
   x=>x.id!==id
  );

 render();

}


/* ================================
   DZIAŁY
================================ */

function departmentData(){

 const d={};

 G.staff.forEach(e=>{

  const name=
   roles[e.role].department;

  if(!d[name])
   d[name]=[];

  d[name].push(e);

 });

 return d;

}


/* ================================
   TECHNOLOGIE
================================ */

const techPrefix=[
 "Adaptive","Neural","Quantum",
 "Smart","Hyper","Edge","Cloud",
 "Auto","Creator","Stream",
 "Vision","Safe","Dynamic"
];

const techCore=[
 "Codec","Streaming","CDN",
 "Search","Discovery","Upload",
 "Compression","Security",
 "Moderation","Recommendations",
 "Analytics","Creator Tools",
 "Transcoding","Player"
];

const techCategories=[
 "Streaming",
 "AI",
 "Security",
 "Creator",
 "Infrastructure",
 "Applications"
];

function generateTechnology(){

 let name;

 do{

  name=
   pick(techPrefix)+" "+
   pick(techCore)+" "+
   rnd(1,20);

 }while(
  G.technologies.some(
   x=>x.name===name
  )
 );

 const difficulty=
  Math.round(
   rnd(80,170)*
   (
    1+
    G.techLevel*.12
   )
  );

 G.technologies.push({

  id:uid(),

  name,

  category:
   pick(techCategories),

  difficulty,

  progress:0,

  done:false,

  level:G.techLevel

 });

 G.lastTechDay=
  absoluteDay();

}

function researchTick(){

 const power=
  staffPower("research");

 const tech=
  G.technologies.find(
   x=>!x.done
  );

 if(
  !tech ||
  power<=0
 )
 return;

 tech.progress+=
  power/7;

 if(
  tech.progress>=
  tech.difficulty
 ){

  tech.progress=
   tech.difficulty;

  tech.done=true;

  G.techLevel++;

  G.reputation+=2;

  G.unlocked.push(
   tech.name
  );

  if(
   tech.category===
   "Infrastructure"
  ){

   G.serverCapacity=
    Math.round(
     G.serverCapacity*1.12
    );

  }

  if(
   tech.category==="Security"
  ){

   G.security=
    clamp(
     G.security+8,
     0,
     100
    );

  }

  if(
   tech.category==="AI"
  ){

   G.recommendation=
    clamp(
     G.recommendation+6,
     0,
     100
    );

  }

  addHistory(
   "Opracowano technologię: "+
   tech.name
  );

  addDecision(
   "Nowa technologia",
   tech.name+
   " została opracowana automatycznie."
  );

 }

}


/* ================================
   PROJEKTY
================================ */

const projectTypes={

 "Nowy player":{
  cost:35000,
  work:100,
  rep:4
 },

 "Aplikacja Android":{
  cost:70000,
  work:180,
  rep:8,
  product:"Android"
 },

 "Aplikacja iOS":{
  cost:80000,
  work:200,
  rep:8,
  product:"iOS"
 },

 "Smart TV":{
  cost:110000,
  work:250,
  rep:10,
  product:"Smart TV"
 },

 "Transmisje Live":{
  cost:100000,
  work:220,
  rep:10
 },

 "Short Videos":{
  cost:90000,
  work:190,
  rep:9
 },

 "Nowy wygląd":{
  cost:40000,
  work:110,
  rep:5
 },

 "AI Moderation":{
  cost:160000,
  work:320,
  rep:10
 }

};

function startProject(name){

 const p=
  projectTypes[name];

 if(!p)return;

 if(G.money<p.cost){

  alert(
   "Za mało pieniędzy."
  );

  return;

 }

 cash(
  -p.cost,
  "Projekt",
  name
 );

 G.projects.push({

  id:uid(),

  name,

  work:p.work,

  progress:0,

  rep:p.rep,

  product:p.product||null,

  done:false

 });

 render();

}

function projectsTick(){

 const power=
  staffPower("dev");

 G.devPoints+=
  power/15;

 const p=
  G.projects.find(
   x=>!x.done
  );

 if(
  !p ||
  power<=0
 )
 return;

 p.progress+=
  power/9;

 if(
  p.progress>=p.work
 ){

  p.progress=p.work;

  p.done=true;

  G.reputation+=p.rep;

  if(p.product){

   G.products[p.product]
   .unlocked=true;

   G.products[p.product]
   .level=1;

   G.products[p.product]
   .quality=50;

  }

  addHistory(
   "Ukończono projekt: "+
   p.name
  );

 }

}


/* ================================
   TECHNICY / AWARIE
================================ */

function technicalTick(){

 const repair=
  staffPower("repair");

 if(repair>0){

  G.bugs=
   Math.max(
    0,
    G.bugs-repair/18
   );

  G.stability=
   clamp(
    G.stability+
    repair/140,
    0,
    100
   );

  G.serverHealth=
   clamp(
    G.serverHealth+
    repair/180,
    0,
    100
   );

 }

 G.outages.forEach(o=>{

  if(!o.fixed){

   o.progress+=
    repair/8;

   if(o.progress>=100){

    o.progress=100;
    o.fixed=true;

    addHistory(
     "Naprawiono awarię: "+
     o.name
    );

   }

  }

 });

}

function randomOutage(){

 if(!G.launched)return;

 let risk=
  .01;

 risk+=
  (100-G.serverHealth)/4000;

 risk+=
  G.bugs/5000;

 if(
  Math.random()<risk
 ){

  const name=
   pick([
    "Awaria CDN",
    "Problemy z uploadem",
    "Awaria playera",
    "Problemy z bazą danych",
    "Awaria API",
    "Problemy z logowaniem"
   ]);

  G.outages.push({

   id:uid(),

   name,

   progress:0,

   fixed:false

  });

  G.reputation=
   Math.max(
    0,
    G.reputation-2
   );

  addDecision(
   "Awaria",
   name+
   ". Technicy rozpoczęli automatyczną naprawę."
  );

 }

}


/* ================================
   TWÓRCY
================================ */

const channelA=[
 "Tech","Game","Daily","Pixel",
 "Mega","Neo","Pro","Studio",
 "Crazy","World","Epic","Next"
];

const channelB=[
 "Zone","TV","Hub","Play",
 "Lab","Show","Life","Gaming",
 "Vision","Channel","Media"
];

const categories=[
 "Gaming",
 "Technologia",
 "Muzyka",
 "Vlogi",
 "Edukacja",
 "Sport",
 "Rozrywka",
 "News"
];

function createCreator(){

 const subs=
  rnd(0,Math.max(
   10,
   Math.round(
    G.users*.05
   )
  ));

 G.creators.push({

  id:uid(),

  name:
   pick(channelA)+
   pick(channelB),

  category:
   pick(categories),

  subs,

  views:rnd(0,subs*10+100),

  loyalty:rnd(45,95),

  quality:rnd(30,95),

  partner:false,

  videos:rnd(1,20)

 });

}

function creatorsTick(){

 if(!G.launched)return;

 if(
  absoluteDay()-
  G.lastCreatorDay>=3
 ){

  const amount=
   Math.max(
    1,
    Math.floor(
     G.users/5000
    )
   );

  for(
   let i=0;
   i<Math.min(amount,5);
   i++
  ){

   createCreator();

  G.lastCreatorDay=
   absoluteDay();

 }

 G.creators.forEach(c=>{

  let growth=
   rnd(0,5)+
   G.recommendation/20;

   growth*=2;

  c.subs+=growth;

  c.views+=
   growth*rnd(5,30);

  if(
   Math.random()<.003
  ){

   const viral=
    rnd(
     1000,
     Math.max(
      2000,
      Math.round(
       G.users*.4
      )
     )
    );

   c.views+=viral;

   c.subs+=
    Math.round(
     viral*.03
    );

   G.users+=
    Math.round(
     viral*.015
    );

   addDecision(
    "🔥 Viral",
    c.name+
    " opublikował viralowy film: "+
    fmt(viral)+
    " dodatkowych wyświetleń."
   );

   addHistory(
    "Viral na kanale "+
    c.name
   );

  }

 });

 G.totalVideos=
  G.creators.reduce(
   (a,c)=>a+c.videos,
   0
  );

}
