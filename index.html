function extraRender(){const c=state.city,m=monthly();if(tab==='city')return `<div class="section-title">🏙 Żyjące miasto</div><div class="item"><b>Populacja: ${fmt(c.population)} mieszkańców</b><p>Zmiana miesięczna: ${c.growth>=0?'+':''}${fmt(c.growth)} · Reputacja: ${c.reputation}/100</p><p>Pogoda: ${state.weather==='rain'?'🌧 Deszcz':state.weather==='snow'?'❄ Śnieg':'☀ Pogodnie'} · Pasażerowie: ${fmt(m.passengers)}/dzień</p></div><div class="section-title">Promocja komunikacji</div><div class="item"><p>Kampanie marketingowe: ${c.marketing||0} · Utrzymanie: ${fmt((c.marketing||0)*1500)} zł/mies.</p><div class="actions"><button data-extra="marketing">📣 Kampania (25 000 zł)</button><button data-extra="stopmarketing">Zakończ kampanię</button></div></div><div class="section-title">Finansowanie inwestycji</div><div class="item"><p>Dług: ${fmt(c.loans||0)} zł · Odsetki: ${fmt((c.loans||0)*.008)} zł/mies.</p><div class="actions"><button data-extra="loan">🏦 Pożycz 250 000 zł</button><button data-extra="repay">Spłać 100 000 zł</button></div></div><div class="section-title">Wydarzenia miejskie</div>${(c.events||[]).map(e=>`<div class="item">${esc(e)}</div>`).join('')||'<div class="hint">Wydarzenia pojawiają się co cztery miesiące.</div>'}<div class="section-title">Rodzaj dnia</div><div class="actions"><button data-extra="weekday">Dzień roboczy</button><button data-extra="weekend">Weekend</button></div>`;
if(tab==='career')return `<div class="section-title">🏆 Misje i osiągnięcia</div><div class="hint">Osiągaj cele, aby zdobywać jednorazowe nagrody. Postępy zapisują się razem z grą.</div>${MISSIONS.map((x,i)=>`<div class="item"><div class="itemhead"><b>${i+1}. ${x[0]}</b><span class="badge">${state.career.claimed.includes(i)?'✓ Odebrano':x[1]()?'Gotowe':'W trakcie'}</span></div><p>Nagroda: ${fmt(x[2])} zł</p>${x[1]()&&!state.career.claimed.includes(i)?`<button data-claim="${i}" class="primary">Odbierz nagrodę</button>`:''}</div>`).join('')}`;
if(tab==='diagram')return `<div class="section-title">🗺 Schemat sieci</div><div class="hint">Schemat liniowy wszystkich tras i przesiadek. Kliknij nazwę linii, aby zobaczyć jej przebieg na mapie.</div>${state.lines.map(l=>`<div class="item"><div class="itemhead"><b style="color:${esc(l.color||COLOR[l.type])}">● ${esc(l.name)}</b><button data-diagram="${l.id}">Pokaż</button></div><div style="display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:12px">${l.stops.map((id,i)=>`<span style="border:1px solid ${esc(l.color||COLOR[l.type])};padding:5px 8px;border-radius:20px;font-size:11px">${esc(stopById(id)?.name||'?')}</span>${i<l.stops.length-1?'→':''}`).join('')}</div><p>${fmt(lineLength(l)*10)/10} km · ${l.vehicles} pojazdów · co ${l.interval} min</p></div>`).join('')||'<div class="hint">Najpierw utwórz linię.</div>'}`;return ''}
function bindExtras(){document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{const i=+b.dataset.claim;if(!state.career.claimed.includes(i)&&MISSIONS[i][1]()){state.career.claimed.push(i);changeMoney(MISSIONS[i][2]);addLog('Misja: '+MISSIONS[i][0]);save();render()}});document.querySelectorAll('[data-diagram]').forEach(b=>b.onclick=()=>{const l=state.lines.find(x=>x.id===+b.dataset.diagram);if(l){const pts=lineCoords(l);if(pts.length>1)map.fitBounds(pts,{padding:[50,50]});paths.get(l.id)?.openPopup()}});document.querySelectorAll('[data-extra]').forEach(b=>b.onclick=()=>{const a=b.dataset.extra,c=state.city;if(a==='marketing'&&charge(25000))c.marketing=(c.marketing||0)+1;else if(a==='stopmarketing')c.marketing=0;else if(a==='loan'){c.loans=(c.loans||0)+250000;changeMoney(250000)}else if(a==='repay'){const n=Math.min(100000,c.loans||0);if(n&&charge(n))c.loans-=n}else if(a==='weekday'||a==='weekend')state.dayType=a;save();render()})}
function render(){reconcileFleet();renderStats();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';if(tab==='traffic'){html=renderTrafficPanel()}else if(tab==='depotfleet'){html=renderDepotFleet()}else if(tab==='boards'){html=renderBoards()}else if(tab==='analytics'){const total=state.lines.reduce((n,l)=>n+transitDemand(l),0);const staffed=state.lines.filter(l=>staffCoverage(l.type)>=.99).length;html=`<div class="section-title">📈 Analiza sieci i rekomendacje</div><div class="hint">Dane są symulowane. Sprawdź obciążenie, braki kadrowe i wydajność linii, a potem wprowadź zmiany jednym kliknięciem.</div><div class="mini-grid"><div class="metric"><small>Popyt dzienny</small><strong>${fmt(total)}</strong></div><div class="metric"><small>Linie z obsadą</small><strong>${staffed}/${state.lines.length}</strong></div><div class="metric"><small>Satysfakcja</small><strong>${satisfaction()}%</strong></div><div class="metric"><small>Bilans miesiąca</small><strong>${fmt(monthly().profit)} zł</strong></div></div><div class="section-title">Ocena linii</div>${state.lines.map(l=>{const occ=lineOccupancy(l),staff=Math.round(staffCoverage(l.type)*100),status=staff<100?'Brak pracowników':occ>90?'Wysokie obciążenie':(l.delay||0)>8?'Opóźnienia':'Działa prawidłowo';return `<div class="item"><div class="itemhead"><b>${ICON[l.type]} ${esc(l.name)}</b><span class="badge">${esc(status)}</span></div><small>Popyt ${fmt(transitDemand(l))}/dzień · Zapełnienie ${occ}% · Obsada ${staff}% · Opóźnienie ${Math.round(l.delay||0)} min</small><div class="actions"><button data-analyze-focus="${l.id}">🗺 Pokaż</button><button data-analyze-frequency="${l.id}">⏱ Częściej</button><button data-analyze-driver="${l.id}">👨‍✈️ Zatrudnij</button></div></div>`}).join('')||'<div class="hint">Utwórz pierwszą linię, aby zobaczyć raport.</div>'}<div class="section-title">Szybkie działania</div><div class="actions"><button data-analyze-action="maintenance">🔧 Przegląd sieci · 25 000 zł</button><button data-analyze-action="campaign">📣 Promocja · 18 000 zł</button></div><div class="hint">Częstsze kursy wymagają odpowiedniej floty i obsady. Pensje i koszty utrzymania są rozliczane co miesiąc.</div>`}else if(tab==='dispatch'){const o=state.operations;html=`<div class="section-title">📡 Centrum dyspozytorskie</div><div class="hint">Monitoruj opóźnienia, awarie i obciążenie linii. Symulacja opiera się na modelu ruchu, nie na rzeczywistych danych o korkach.</div><div class="mini-grid"><div class="metric"><small>Natężenie ruchu</small><strong>${o.traffic}%</strong></div><div class="metric"><small>Rezerwowe pojazdy</small><strong>${o.spare}</strong></div><div class="metric"><small>Awarie ogółem</small><strong>${o.breakdowns}</strong></div><div class="metric"><small>Sprawność sieci</small><strong>${satisfaction()}%</strong></div></div><div class="actions"><button data-ops="spare">🚌 Kup rezerwowy · 85 000 zł</button><button data-ops="repair">🔧 Napraw awarie · 12 000 zł</button></div>${state.lines.map(l=>`<div class="item"><div class="itemhead"><b>${ICON[l.type]} ${esc(l.name)}</b><span class="badge">${Math.round(l.delay||0)} min opóźnienia</span></div><small>${l.vehicles} poj. · punktualność ${l.reliability}% · szac. obłożenie ${lineOccupancy(l)}%</small><div class="actions"><button data-focusline="${l.id}">🗺 Pokaż</button><button data-rescue="${l.id}">🚍 Wyślij rezerwowy</button></div></div>`).join('')||'<div class="hint">Najpierw utwórz linię.</div>'}<div class="section-title">Zdarzenia</div>${o.events.slice(0,8).map(e=>`<div class="item"><small>${esc(e)}</small></div>`).join('')||'<div class="hint">Brak nowych zdarzeń.</div>'}`}
else if(tab==='passengers'){html=`<div class="section-title">👥 Ruch pasażerski i tablice odjazdów</div><div class="hint">Kolejki są symulowane na podstawie popytu, liczby pojazdów, pojemności i rozkładów. Przesiadki zwiększają zainteresowanie węzłami.</div>${state.stops.map(st=>{const lines=state.lines.filter(l=>l.stops.includes(st.id));const waiting=st.waiting||0;return `<div class="item"><div class="itemhead"><b>${ICON[st.type]} ${esc(st.name)}</b><span class="badge">👥 ${waiting} oczekujących</span></div><small>Wiata ${st.shelter?'✓':'—'} · tablica ${st.display?'✓':'—'} · perony ${st.platforms||1} · obsłużono ${fmt(st.boarded||0)}</small><div class="actions"><button data-stopfocus="${st.id}">📍 Mapa</button><button data-stopupgrade="${st.id}:shelter">🏠 Wiata 12 tys.</button><button data-stopupgrade="${st.id}:display">📟 Tablica 25 tys.</button>${st.type==='metro'?`<button data-stopupgrade="${st.id}:platforms">🚇 Peron 250 tys.</button>`:''}</div><small>Najbliższe kursy: ${lines.map(l=>`${esc(l.name)} — ${Math.max(1,Math.round((l.interval||15)/2+(l.delay||0)))} min`).join(' · ')||'brak połączeń'}</small></div>`}).join('')||'<div class="hint">Zbuduj przystanki, aby obserwować pasażerów.</div>'}`}
else if(tab==='invest'){const o=state.operations;html=`<div class="section-title">🏗 Inwestycje i rozwój sieci</div><div class="hint">Inwestycje wpływają na punktualność, popyt i miesięczne koszty. Zajezdnie są widoczne na mapie po wskazaniu lokalizacji.</div>${[['buslanes','🚌 Buspasy',180000,'Zmniejszają opóźnienia autobusów'],['signals','🚦 Priorytet tramwajów',240000,'Poprawia punktualność tramwajów'],['chargers','⚡ Ładowarki',125000,'Wspierają elektryczne autobusy'],['ads','📣 Reklamy na pojazdach',45000,'Dają miesięczny przychód'],['inspectors','🎟 System kontroli biletów',60000,'Zwiększa przychody z biletów']].map(([id,name,cost,desc])=>`<div class="item"><div class="itemhead"><b>${name}</b><span class="badge">Poziom ${o[id]}</span></div><small>${desc}</small><div class="actions"><button data-invest="${id}">Rozbuduj · ${fmt(cost*(1+o[id]*.6))} zł</button></div></div>`).join('')}<div class="section-title">Zajezdnie na mapie</div><div class="hint">Wybierz typ, a potem kliknij mapę, żeby postawić zajezdnię. Koszt jest naliczany przy budowie.</div><div class="actions">${['bus','tram','metro'].map(t=>`<button data-depotmode="${t}">${ICON[t]} Zajezdnia · ${fmt(DEPOT_COST[t])} zł</button>`).join('')}</div><button data-heat="1">${o.heat?'✓ Ukryj mapę popytu':'🌡 Pokaż mapę popytu'}</button>`}
else if(['city','career','diagram'].includes(tab)){html=extraRender()}else if(tab==='staff'){html=`<div class="section-title">👨‍✈️ Zatrudnienie i wynagrodzenia</div><div class="hint">Każdy aktywny pojazd potrzebuje kierowcy lub motorniczego. Bez obsady liczba pasażerów i przychody spadają. Pensje pobierane są co miesiąc.</div>${Object.entries(SALARY).map(([role,wage])=>`<div class="item"><div class="itemhead"><b>${{bus:'🚌 Kierowcy autobusów',tram:'🚋 Motorniczowie',metro:'🚇 Maszyniści metra',mechanic:'🔧 Mechanicy',inspector:'🎟 Kontrolerzy'}[role]}</b><span class="badge">${state.staff[role]||0} osób</span></div><small>Pensja ${fmt(wage)} zł / miesiąc ${['bus','tram','metro'].includes(role)?`· potrzebnych ${staffNeeded(role)}`:''}</small><div class="actions"><button data-hire="${role}">+ Zatrudnij</button><button data-fire="${role}">− Zwolnij</button></div></div>`).join('')}<div class="item"><b>Łączne wynagrodzenia</b><p>${fmt(Object.entries(state.staff).reduce((n,[r,c])=>n+(SALARY[r]||0)*c,0))} zł / miesiąc</p></div>`}else if(tab==='build'){html=`<div class="section-title">Wybierz rodzaj przystanku</div><div class="toolgrid">${['bus','tram','metro'].map(t=>`<button data-mode="${t}" class="${mode===t?'active':''}">${ICON[t]} ${LABEL[t]}<br><small>${fmt(COST[t])} zł</small></button>`).join('')}<button data-mode="inspect" class="${mode==='inspect'?'active':''}">👆 Przeglądaj mapę</button></div><div class="hint">${mode==='inspect'?'Klikaj znaczniki, aby oglądać przystanki.':`Kliknij miejsce na mapie, aby zbudować ${mode==='metro'?'stację metra':'przystanek'}. Następnie przejdź do zakładki „Linie”, żeby połączyć przystanki.`}</div><div class="section-title">Twoje przystanki (${state.stops.length})</div>${state.stops.length?state.stops.slice().reverse().map(s=>`<div class="item"><div class="itemhead"><b>${ICON[s.type]} ${esc(s.name)}</b><span class="badge">#${s.id}</span></div><div class="actions"><button data-focus="${s.id}">Pokaż</button><button data-rename="${s.id}">Zmień nazwę</button><button class="danger" data-remove="${s.id}">Usuń</button></div></div>`).join(''):'<div class="hint">Nie masz jeszcze przystanków. Postaw pierwszy na mapie!</div>'}`}
if(tab==='lines'){const chosenType=editing?.type||selectedLineType;html=`<div class="section-title">${editing?'Edytowanie linii':'Utwórz nową linię'}</div><div class="row"><input id="lineName" placeholder="Nazwa, np. Autobus 1" value="${esc(editing?.name||'')}"></div><div class="row"><select id="lineType">${['bus','tram','metro'].map(t=>`<option value="${t}" ${chosenType===t?'selected':''}>${ICON[t]} ${LABEL[t]}</option>`).join('')}</select><input id="lineColor" type="color" value="${editing?.color||COLOR[chosenType]}" style="max-width:55px;padding:3px;height:40px"></div><div class="hint">Klikaj na mapie znaczniki przystanków w kolejności przejazdu. Autobus spróbuje wyznaczyć trasę po prawdziwych ulicach (OSRM). Typ przystanków musi odpowiadać rodzajowi linii. Możesz dodać przystanek ponownie, żeby utworzyć trasę powrotną.</div><div class="item"><b>Trasa: ${draft.length} przystanków</b><div style="font-size:12px;color:#b8cce0;margin-top:5px">${draft.map((id,i)=>`${i+1}. ${esc(stopById(id)?.name||'?')}`).join(' → ')||'Wybierz przystanki na mapie'}</div><div class="actions"><button id="undo">↶ Cofnij</button><button id="clearDraft">Wyczyść</button></div></div><button id="commit" class="primary full">${editing?'💾 Zapisz zmiany':'➕ Utwórz linię'}</button>${editing?'<button id="cancelEdit" class="full" style="margin-top:7px">Anuluj edycję</button>':''}<div class="section-title" style="margin-top:17px">Istniejące linie (${state.lines.length})</div>${state.lines.length?state.lines.map(l=>`<div class="item"><div class="itemhead"><b><span style="color:${l.color||COLOR[l.type]}">●</span> ${esc(l.name)}</b><span class="badge">${ICON[l.type]}</span></div><small>${l.stops.length} przystanków · ${routeKm(l.stops).toFixed(1)} km · ${l.vehicles} pojazdów · ${fmt(lineDemand(l))} pasażerów/dzień</small><div class="actions"><button data-addvehicle="${l.id}">+ Pojazd</button><button data-subvehicle="${l.id}">− Pojazd</button><button data-edit="${l.id}">Edytuj</button><button class="danger" data-delline="${l.id}">Usuń</button></div></div>`).join(''):'<div class="hint">Najpierw zbuduj przystanki, a potem połącz je w linię.</div>'}`}

function commitLine(){const name=$('lineName').value.trim().slice(0,70),type=$('lineType').value,color=$('lineColor').value;if(!name){toast('Wpisz nazwę linii');return}if(draft.length<2||new Set(draft).size<2){toast('Linia wymaga co najmniej dwóch różnych przystanków');return}if(draft.some(id=>stopById(id)?.type!==type)){toast('Wybierz przystanki właściwego typu');return}if(editing){editing.name=name;editing.type=type;editing.color=color;editing.stops=[...draft];upgradeLine(editing);addLog('Zmieniono trasę '+name);editing=null}else{if(!charge(LINE_COST[type]))return;const l={id:state.nextId++,name,type,color,stops:[...draft],vehicles:1,interval:15,startHour:5,endHour:23,vehicleModel:'standard',reliability:95};state.lines.push(l);upgradeLine(l);registerFleetVehicle(l.type,l.id,'standard',false);addLog('Uruchomiono linię '+name)}draft=[];save();render();toast('Linia gotowa!')}
function advance(){ageFleet();if(!state.city)state.city={population:285000,growth:0,marketing:0,loans:0,events:[],upgrades:[],reputation:55};const c=state.city,o=state.operations;o.traffic=trafficAtHour(simHour()).level;for(const st of state.stops){const lines=state.lines.filter(l=>l.stops.includes(st.id));const arrivals=lines.reduce((n,l)=>n+Math.round(transitDemand(l)/Math.max(2,l.stops.length)/3),0);const capacity=lines.reduce((n,l)=>n+Math.round(l.vehicles*{bus:85,tram:190,metro:700}[l.type]*staffCoverage(l.type)/Math.max(1,l.stops.length)),0);const boarded=Math.min((st.waiting||0)+arrivals,capacity);st.waiting=Math.min(9999,Math.max(0,(st.waiting||0)+arrivals-boarded));st.boarded=(st.boarded||0)+boarded}for(const l of state.lines){const traffic=l.type==='bus'?Math.max(0,o.traffic-40)*.055/(1+o.buslanes*.4):l.type==='tram'?Math.max(0,o.traffic-50)*.025/(1+o.signals*.5):0;l.delay=Math.max(0,Math.min(45,Math.round((l.delay||0)*.55+traffic+(l.breakdowns||0)*1.5)));}if(Math.random()<.28){const ev=['Remont ulicy — opóźnienia autobusów','Koncert — większy ruch pasażerów','Deszcz — trudniejsze warunki','Awaria sygnalizacji','Dodatkowe kursy na wydarzenie sportowe'][Math.floor(Math.random()*5)];o.events.unshift('M'+state.month+': '+ev);o.events=o.events.slice(0,12);if(ev.includes('Remont'))for(const l of state.lines.filter(x=>x.type==='bus'))l.delay+=4;}const served=state.lines.length*3+state.stops.length;const delta=Math.round((Math.random()*2-0.65)*220+served*9);c.population=Math.max(25000,c.population+delta);c.growth=delta;c.reputation=Math.max(0,Math.min(100,c.reputation+(satisfaction()>65?1:-1)));if(state.month%4===0){const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];c.events.unshift('M'+state.month+': '+ev[0]);c.events=c.events.slice(0,8);changeMoney(ev[1]);addLog(ev[0]+' ('+(ev[1]>0?'+':'')+fmt(ev[1])+' zł)')}state.weather=['clear','clear','rain','snow'][Math.floor(Math.random()*4)];for(const l of state.lines){const breakdown=Math.random()<Math.max(.02,(105-(l.reliability||95))/160);if(breakdown){l.reliability=Math.max(45,(l.reliability||95)-Math.round(3+Math.random()*9));l.breakdowns=(l.breakdowns||0)+1;o.breakdowns++;addLog('Awaria na linii '+l.name)}else l.reliability=Math.min(100,(l.reliability||95)+1)}if(state.month%3===0&&state.rivals.length<9){const types=['bus','tram','metro'],t=types[Math.floor(Math.random()*3)];state.rivals.push({name:['Mobilis','CityLink','MetroExpress','UrbanGo','TransPol','NovaBus'][state.rivals.length%6]+' '+(state.rivals.length+1),type:t,stops:3+Math.floor(Math.random()*9)});addLog('Konkurencja uruchomiła linię '+LABEL[t])}for(const r of state.rivals)if(Math.random()<.2)r.stops++;const m=monthly();state.history.push({month:state.month,profit:m.profit,riders:m.passengers});state.history=state.history.slice(-36);changeMoney(m.profit);state.month++;addLog(`Bilans: ${m.profit>=0?'+':''}${fmt(m.profit)} zł, ${fmt(m.passengers)} pasażerów dziennie`);save();render();toast(`Miesiąc ${state.month}: ${m.profit>=0?'+':''}${fmt(m.profit)} zł`)}
map.on('click',e=>{if(mode.startsWith('depot:')&&tab==='invest'){const type=mode.split(':')[1];if(charge(DEPOT_COST[type])){state.operations.depotsOnMap.push({type,lat:e.latlng.lat,lng:e.latlng.lng});state.depots[type]++;addLog('Zajezdnia '+LABEL[type]);mode='inspect';save();render();toast('Zbudowano zajezdnię')}return}if(tab==='build'&&mode!=='inspect'){if(!charge(COST[mode]))return;const near=state.stops.some(s=>km(s,e.latlng)<.075);if(near){changeMoney(COST[mode]);toast('Przystanki muszą być oddalone od siebie o co najmniej 75 m');return}const s={id:state.nextId++,type:mode,name:`${LABEL[mode]} ${state.stops.filter(x=>x.type===mode).length+1}`,lat:e.latlng.lat,lng:e.latlng.lng};state.stops.push(s);addLog('Zbudowano '+s.name);save();render();toast('Zbudowano '+s.name)}else if(tab==='lines'){const type=$('lineType').value;let nearest=null,dist=Infinity;for(const s of state.stops){if(s.type!==type)continue;const d=map.latLngToContainerPoint([s.lat,s.lng]).distanceTo(map.latLngToContainerPoint(e.latlng));if(d<dist){dist=d;nearest=s}}if(nearest&&dist<27){draft.push(nearest.id);render();toast('Dodano: '+nearest.name)}else toast('Kliknij bliżej znacznika przystanku odpowiedniego typu')}});

// Symulowane sygnalizatory i znaki na trasach autobusowych (nie są rzeczywistymi znakami OSM).
const vehicleMotion=new Map();
let signsVisible=true;
function roadControl(line,seg){
 if(line.type!=='bus')return null;
 if(seg%4===1)return 'signal';
 if(seg%4===3)return 'stop';
 if(seg%4===2)return 'yield';
 return 'limit';
}
function signalGreen(line,seg,t){
 const offset=((Number(line.id)||1)*1900+seg*3100)%18000;
 return (t+offset)%18000<9500;
}
function roadRuleName(rule,green){
 return rule==='signal'?(green?'🟢 Zielone światło':'🔴 Czerwone światło'):rule==='stop'?'🛑 STOP':rule==='yield'?'🔻 Ustąp pierwszeństwa':'🚧 Ograniczenie 30 km/h';
}
function drawRoadSigns(t){
 roadSignsLayer.clearLayers();
 if(!signsVisible)return;
 for(const line of state.lines){
  if(line.type!=='bus')continue;
  const pts=lineCoords(line);
  for(let j=0;j<pts.length-1;j++){
   const rule=roadControl(line,j);
   const a=pts[j],b=pts[j+1];
   const lat=a[0]+(b[0]-a[0])*.68,lng=a[1]+(b[1]-a[1])*.68;
   const green=signalGreen(line,j,t);
   const symbol=rule==='signal'?(green?'🟢':'🔴'):rule==='stop'?'🛑':rule==='yield'?'🔻':'③⓪';
   L.marker([lat,lng],{icon:L.divIcon({className:'',html:`<div style="background:#0d2639e8;border:1px solid #d7edff80;border-radius:9px;padding:3px 5px;font-size:17px;white-space:nowrap">${symbol}</div>`,iconSize:[32,30],iconAnchor:[16,15]})})
   .bindPopup(`<b>${roadRuleName(rule,green)}</b><br>${esc(line.name)}<br><small>Symulowany znak drogowy</small>`)
   .addTo(roadSignsLayer);
  }
 }
}
function moveVehicles(t){
 vehicleLayer.clearLayers();
 let stoppedAtRed=0,stoppedAtSign=0;
 const alive=new Set();
 for(const line of state.lines){
  const points=lineCoords(line);
  if(points.length<2||serviceFactor(line)<=.01)continue;
  const segments=[],total=points.reduce((n,p,i)=>{
   if(i){const d=km({lat:points[i-1][0],lng:points[i-1][1]},{lat:p[0],lng:p[1]});segments.push(d);return n+d}
   return n
  },0);
  if(!total)continue;
  const count=Math.min(Math.floor(line.vehicles*staffCoverage(line.type)),12);
  for(let i=0;i<count;i++){
   const key=line.id+':'+i;alive.add(key);
   let m=vehicleMotion.get(key);
   if(!m){m={dist:total*i/Math.max(1,count),last:t,waitUntil:0,stopKey:'',status:'W trasie'};vehicleMotion.set(key,m)}
   const dt=Math.max(0,Math.min(1,(t-m.last)/1000));m.last=t;
   let d=m.dist%total,j=0;
   while(j<segments.length-1&&d>=segments[j]){d-=segments[j];j++}
   const rule=roadControl(line,j),stopDist=segments[j]*.68;
   const signalRed=rule==='signal'&&!signalGreen(line,j,t);
   const crossingKey=j+':'+Math.floor(m.dist/total);
   let speed=total/(line.type==='metro'?9:line.type==='tram'?14:19);
   if(line.type==='bus'){
    const congestion=segmentCongestion(line,j,simHour());
    speed*=Math.max(.30,1-congestion*.0055);
    if(rule==='limit')speed*=.58;
    if(rule==='yield')speed*=.68;
   }
   const proposed=d+speed*dt;
   if(line.type==='bus'&&d<=stopDist+.0001&&proposed>=stopDist){
    if(rule==='signal'&&signalRed){
     m.dist+=Math.max(0,stopDist-d);m.status='🔴 Czeka na zielone';stoppedAtRed++;
    }else if((rule==='stop'||rule==='yield')&&m.stopKey!==crossingKey){
     m.dist+=Math.max(0,stopDist-d);
     m.stopKey=crossingKey;
     m.waitUntil=t+(rule==='stop'?1900:900);
     m.status=rule==='stop'?'🛑 Zatrzymany przy STOP':'🔻 Ustępuje pierwszeństwa';
     stoppedAtSign++;
    }else{m.dist+=speed*dt;m.status='W trasie'}
   }else if(m.waitUntil>t){
    m.status=rule==='stop'?'🛑 Zatrzymany przy STOP':'🔻 Ustępuje pierwszeństwa';
    stoppedAtSign++;
   }else if(line.type==='bus'&&Math.abs(d-stopDist)<.0001&&signalRed){
    m.status='🔴 Czeka na zielone';stoppedAtRed++;
   }else{
    m.waitUntil=0;m.dist+=speed*dt;
    m.status=rule==='limit'?'🚧 Jedzie wolniej (30 km/h)':rule==='yield'?'🔻 Ostrożnie na skrzyżowaniu':'W trasie';
   }
   m.dist%=total;
   let travel=m.dist,k=0;
   while(k<segments.length-1&&travel>=segments[k]){travel-=segments[k];k++}
   const a=points[k],b=points[k+1],f=Math.min(1,travel/Math.max(.000001,segments[k]));
   L.marker([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f],{interactive:true,
    icon:L.divIcon({className:'',html:`<div class="vehicle" title="${esc(m.status)}">${ICON[line.type]}</div>`,iconSize:[25,25],iconAnchor:[12,12]})})
    .bindPopup(vehiclePopup(line,i)+`<hr><b>${esc(m.status)}</b><br><small>Znaki i światła są symulowane.</small>`)
    .addTo(vehicleLayer);
  }
 }
 for(const key of vehicleMotion.keys())if(!alive.has(key))vehicleMotion.delete(key);
 const status=$('signalStatus');
 if(status)status.textContent=`🔴 Czeka na światłach: ${stoppedAtRed} · 🛑 Przy znakach: ${stoppedAtSign}`;
}

let last=0;function animate(t){if(t-last>350){moveVehicles(t);if(Math.floor(t/2500)!==Math.floor(last/2500))drawRoadSigns(t);last=t}requestAnimationFrame(animate)}requestAnimationFrame(animate);
$('toggle').onclick=()=>{$('workspace').classList.toggle('hidden-island');$('toggle').textContent=$('workspace').classList.contains('hidden-island')?'☰ Pokaż':'✕ Ukryj';requestAnimationFrame(()=>map.invalidateSize({pan:false}))};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draft=[];editing=null;render()});render();syncRouting();
// Map tiles remain aligned after layout changes; scrolling the sidebar never zooms the map.
const mapElement=$('map');
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>map.invalidateSize({pan:false,debounceMoveend:true})).observe(mapElement);
window.addEventListener('resize',()=>map.invalidateSize({pan:false}));
window.addEventListener('load',()=>setTimeout(()=>map.invalidateSize({pan:false}),180));
map.whenReady(()=>setTimeout(()=>map.invalidateSize({pan:false}),100));
for(const el of document.querySelectorAll('.app,.topright,.maplegend')){
  L.DomEvent.disableScrollPropagation(el);
  el.addEventListener('wheel',e=>e.stopPropagation(),{passive:true});
}
setTimeout(()=>map.invalidateSize({pan:false}),300);setTimeout(()=>map.invalidateSize({pan:false}),1200);

// Ruch miejski: jedna doba symulacji w 45 sekund, godziny szczytu 7-9 i 15-18.
function simHour(){return (6+Math.floor((performance.now()-monthStart)/MONTH_MS*24))%24}
function trafficAtHour(hour){
 const rushMorning=Math.exp(-Math.pow((hour-8)/1.65,2))*53;
 const rushEvening=Math.exp(-Math.pow((hour-16.5)/2.05,2))*48;
 const midday=Math.exp(-Math.pow((hour-12.5)/3.5,2))*13;
 let level=16+rushMorning+rushEvening+midday;
 if(state.dayType==='weekend')level=16+(level-16)*.55;
 if(state.weather==='rain')level+=9;
 if(state.weather==='snow')level+=17;
 return {level:Math.max(5,Math.min(100,Math.round(level))),hour};
}
let lastTrafficHour=-1;
function updateCityTraffic(){
 const hour=simHour(),traffic=trafficAtHour(hour);
 state.operations.traffic=traffic.level;
 if(hour!==lastTrafficHour){
  lastTrafficHour=hour;
  for(const line of state.lines){
   if(line.type==='metro')continue;
   const congestion=Math.max(0,traffic.level-35);
   const buses=line.type==='bus';
   const mitigation=buses?1+(state.operations.buslanes||0)*.55:1+(state.operations.signals||0)*.65;
   const impact=congestion*(buses?.095:.032)/mitigation;
   const recovery=traffic.level<40?(buses?2.2:2.8):.65;
   line.delay=Math.round(Math.max(0,Math.min(45,(line.delay||0)*.82+impact-recovery)));
  }
  if(trafficVisible)refreshTrafficOverlay();if(tab==='traffic'||tab==='dispatch'||tab==='boards')render();
 }
 const clock=$('cityClock');
 if(clock)clock.textContent=String(hour).padStart(2,'0')+':00';
 const meter=$('trafficMeter');
 if(meter)meter.textContent=traffic.level+'%';
 const desc=$('trafficPhase');
 if(desc)desc.textContent=hour>=7&&hour<=9?'Poranny szczyt':hour>=15&&hour<=18?'Popołudniowy szczyt':hour>=22||hour<5?'Noc — mały ruch':'Ruch poza szczytem';
 const bar=$('trafficBar');
 if(bar)bar.style.width=traffic.level+'%';
}

// Odcinki korków na trasach autobusowych — syntetyczny model, bez zewnętrznego API.

function segmentCongestion(line,index,hour){
 const base=trafficAtHour(hour).level;
 const hash=(Math.abs((Number(line.id)||1)*31+index*73)%23)-11;
 const corridor=(index%5===1?17:index%5===3?-13:0);
 return Math.max(0,Math.min(100,Math.round(base+hash+corridor)));
}
function refreshTrafficOverlay(){
 trafficLayer.clearLayers();
 if(!trafficVisible)return;
 const hour=simHour();
 for(const line of state.lines){
  if(line.type!=='bus')continue;
  const pts=lineCoords(line);
  for(let i=1;i<pts.length;i++){
   const level=segmentCongestion(line,i-1,hour);
   const color=level>=72?'#e75050':level>=47?'#efb94e':'#43ca91';
   L.polyline([pts[i-1],pts[i]],{color,weight:6,opacity:.78,interactive:true})
    .bindPopup(`<b>${esc(line.name)}</b><br>Natężenie: ${level}%<br>Opóźnienie linii: +${Math.round(line.delay||0)} min<br><small>Szacunkowy ruch w grze</small>`)
    .addTo(trafficLayer);
  }
 }
}
function trafficIncident(){
 const buses=state.lines.filter(l=>l.type==='bus');
 if(!buses.length){toast('Najpierw utwórz linię autobusową');return}
 const l=buses[Math.floor(Math.random()*buses.length)];
 l.delay=Math.min(45,(l.delay||0)+8);
 state.operations.traffic=Math.min(100,(state.operations.traffic||30)+12);
 addLog('🚧 Utrudnienia na linii '+l.name+' (+8 min)');
 save();render();toast('🚧 Roboty drogowe: '+l.name+' — dodatkowe opóźnienie');
}
function renderTrafficPanel(){
 const h=simHour(),t=trafficAtHour(h),peak=state.lines.filter(l=>l.type==='bus').sort((a,b)=>(b.delay||0)-(a.delay||0));
 return `<div class="section-title">🚦 Ruch miejski — symulacja dobowa</div>
 <div class="hint">Godzina gry zmienia się automatycznie. Szczyty 7:00–9:00 i 15:00–18:00 zwiększają korki i opóźnienia autobusów. Buspasy ograniczają ich wpływ. Weekend i pogoda także zmieniają natężenie ruchu. To symulacja, nie dane o rzeczywistych korkach.</div>
 <div class="item"><div class="itemhead"><b>🕒 ${String(h).padStart(2,'0')}:00</b><span class="badge" id="trafficPhase">Ruch miejski</span></div>
 <div style="font-size:24px;font-weight:800;margin:10px 0" id="trafficMeter">${t.level}%</div>
 <div style="height:13px;border-radius:10px;background:#112b3b;overflow:hidden"><div id="trafficBar" style="height:100%;width:${t.level}%;background:linear-gradient(90deg,#49c9b7,#f2c65e,#ee6a65);border-radius:10px"></div></div>
 <small>Buspasy: ${state.operations.buslanes||0} · Priorytet tramwajów: ${state.operations.signals||0}</small></div>
 <div class="item"><div class="itemhead"><b>🚥 Sygnalizacja i znaki</b><button id="toggleSigns">${signsVisible?'Ukryj znaki':'Pokaż znaki'}</button></div><p>Autobusy zatrzymują się na czerwonym, ruszają na zielonym, zatrzymują się przy STOP, ustępują pierwszeństwa i zwalniają przy ograniczeniu prędkości.</p><small id="signalStatus">Sprawdzanie pojazdów…</small><p class="hint">Sygnalizatory i znaki są generowane na trasach autobusów. Nie odpowiadają rzeczywistym skrzyżowaniom i oznakowaniu ulic.</p></div>
 <div class="item"><div class="itemhead"><b>🗺 Warstwa korków na mapie</b><button id="toggleTrafficLayer">${trafficVisible?'Ukryj korki':'Pokaż korki'}</button></div><p>Kolory odcinków tras: 🟢 płynny ruch · 🟡 umiarkowany · 🔴 korek. Kliknij odcinek, aby sprawdzić natężenie.</p><button id="incidentTraffic">🚧 Zasymuluj roboty drogowe</button></div><div class="section-title">🚌 Opóźnienia autobusów</div>
 ${peak.map(l=>`<div class="item"><div class="itemhead"><b>${esc(l.name)}</b><span class="badge">+${Math.round(l.delay||0)} min</span></div><small>${l.vehicles} pojazdów · ${l.stops.length} przystanków</small></div>`).join('')||'<div class="hint">Utwórz linię autobusową, żeby obserwować wpływ korków.</div>'}
 <div class="hint">🟢 Noc: mały ruch · 🟡 Poza szczytem: umiarkowany · 🔴 Szczyt: duże korki</div>`;
}

// One fixed game pace: no pause, speed-up or manual skipping.
const MONTH_MS=45000;let monthStart=performance.now();
setInterval(()=>{const now=performance.now();if(now-monthStart>=MONTH_MS){monthStart+=MONTH_MS;if(now-monthStart>=MONTH_MS)monthStart=now;advance()}const label=$('clockProgress');if(label)label.textContent=Math.min(99,Math.floor((now-monthStart)/MONTH_MS*100))+'%';updateCityTraffic();},250);
})();
</script></body></html>
