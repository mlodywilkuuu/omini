
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Władca Narodów</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  min-height: 100%;
}

body {
  font-family: "Segoe UI", Arial, sans-serif;
  background: #080d20;
  color: white;
  overflow-x: hidden;
}

/* TŁO */

.bg {
  position: fixed;
  inset: 0;
  z-index: -3;
  background: linear-gradient(
    120deg,
    #080d20,
    #172c54,
    #34214d,
    #092e43
  );
  background-size: 400% 400%;
  animation: gradient 15s ease infinite;
}

@keyframes gradient {
  0%, 100% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
}

/* ŚWIATŁA */

.orb {
  position: fixed;
  z-index: -2;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(80px);
  opacity: .45;
  pointer-events: none;
  animation: float 10s ease-in-out infinite;
}

.orb1 {
  background: #527cff;
  top: -100px;
  left: -100px;
}

.orb2 {
  background: #a44dff;
  right: -100px;
  bottom: -100px;
  animation-delay: -5s;
}

@keyframes float {
  50% {
    transform: translate(35px, -35px);
  }
}

/* GŁÓWNY UKŁAD */

main {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 10px;
}

/* SZKŁO */

.panel {
  width: 100%;
  max-width: 380px;
  padding: 20px 25px;
  text-align: center;

  background: rgba(255,255,255,.07);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);

  border: 1px solid #ffffff30;
  border-radius: 20px;

  box-shadow:
    0 20px 70px #0007,
    inset 0 1px 0 #ffffff25;

  animation: appear .7s ease both;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* KORONA */

.crown {
  font-size: 32px;
  color: #f6d38a;
  text-shadow: 0 0 25px #f6d38a88;
  animation: crown 4s ease-in-out infinite;
}

@keyframes crown {
  50% {
    transform: translateY(-5px);
  }
}

/* NAZWA */

h1 {
  font-size: 27px;
  line-height: 1.1;
  letter-spacing: 1px;
  margin: 6px 0;

  background: linear-gradient(
    90deg,
    #fff3cb,
    #d8a54b,
    #ffffff,
    #d8a54b
  );

  background-size: 250%;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;

  animation: shine 5s linear infinite;
}

@keyframes shine {
  to {
    background-position: 250%;
  }
}

.subtitle {
  color: #a9b8d1;
  font-size: 11px;
  line-height: 1.5;
  margin: 9px 0 15px;
}

/* PRZYCISKI */

.btn {
  display: block;
  position: relative;
  width: 100%;
  padding: 11px;
  margin: 7px 0;

  background: rgba(255,255,255,.08);
  border: 1px solid #ffffff30;
  border-radius: 10px;

  color: white;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .5px;
  font-family: inherit;

  cursor: pointer;
  overflow: hidden;
  transition: .3s;
}

.btn:hover {
  transform: translateY(-3px);
  background: rgba(255,255,255,.17);
  box-shadow: 0 10px 30px #0005;
}

.btn:focus-visible {
  outline: 3px solid #f6d38a;
  outline-offset: 3px;
}

.btn.gold {
  color: #171822;
  background: linear-gradient(
    120deg,
    #bd8c42,
    #ffe6aa,
    #d7a54c
  );
  background-size: 250%;
  border-color: #f6d38a;
  box-shadow: 0 5px 25px #d6a34c44;
  animation: shine 5s linear infinite;
}

.btn.gold:hover {
  box-shadow: 0 8px 35px #e9ba6488;
}

/* BŁYSK PRZYCISKÓW */

.btn::after {
  content: "";
  position: absolute;
  top: 0;
  left: -130%;
  width: 60%;
  height: 100%;
  transform: skewX(-25deg);
  background: linear-gradient(
    90deg,
    transparent,
    #ffffff55,
    transparent
  );
  transition: left .6s;
}

.btn:hover::after {
  left: 150%;
}

.footer {
  margin-top: 14px;
  font-size: 10px;
  color: #91a1ba;
}

/* BARDZO NISKIE EKRANY */

@media (max-height: 500px) {
  .panel {
    padding: 10px 20px;
  }

  .crown {
    font-size: 22px;
  }

  h1 {
    font-size: 21px;
  }

  .subtitle {
    margin: 5px 0;
  }

  .btn {
    padding: 7px;
    margin: 4px 0;
  }

  .footer {
    margin-top: 6px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>

<main>
  <section class="panel">

    <div class="crown">♛</div>

    <h1>WŁADCA<br>NARODÓW</h1>

    <p class="subtitle">
      Każda decyzja zmienia historię.<br>
      Zbuduj potęgę swojego państwa.
    </p>

    <button class="btn gold"
      onclick="go('nowa-gra.html')">
      ✦ NOWA GRA
    </button>

    <button class="btn"
      onclick="go('wczytaj.html')">
      ◈ KONTYNUUJ GRĘ
    </button>

    <button class="btn"
      onclick="go('ustawienia.html')">
      ⚙ USTAWIENIA
    </button>

    <button class="btn"
      onclick="go('o-grze.html')">
      ⓘ O GRZE
    </button>

    <div class="footer">
      STRATEGIA • POLITYKA • GOSPODARKA
      <div>ALPHA 0.1</div>
    </div>

  </section>
</main>

<script>
function go(page) {
  window.location.href = page;
}
</script>

</body>
</html>
