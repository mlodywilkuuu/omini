<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaawansowany Symulator Zarządzania Ligą</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col md:flex-row">
    
    <!-- Boczne Menu (Sidebar) -->
    <aside class="w-full md:w-72 bg-slate-900 border-r border-slate-800 p-6 flex flex-col justify-between shrink-0 shadow-2xl">
        <div class="space-y-6">
            <div>
                <h1 id="tytul-ligi" class="text-xl font-bold tracking-wide text-emerald-400">Ekstraklasa</h1>
                <p class="text-xs text-slate-400 mt-1">Prezydent: <span class="text-slate-200 font-medium">Jan Kowalski</span></p>
            </div>

            <nav class="space-y-2 text-sm">
                <button onclick="zmienWidok('tabela')" id="nav-tabela" class="w-full bg-emerald-600 hover:bg-emerald-500 font-semibold p-3 rounded-xl transition shadow-lg text-left flex items-center gap-3">
                    <span>🏆</span> Tabela i Rozgrywki
                </button>
                <button onclick="zmienWidok('wydarzenia')" id="nav-wydarzenia" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 font-medium p-3 rounded-xl transition text-left flex items-center gap-3">
                    <span>⚡</span> Wydarzenia z Meczów
                </button>
                <button onclick="zmienWidok('finanse')" id="nav-finanse" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 font-medium p-3 rounded-xl transition text-left flex items-center gap-3">
                    <span>💰</span> Finanse i Sponsorzy
                </button>
                <button onclick="zmienWidok('kontrakty')" id="nav-kontrakty" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 font-medium p-3 rounded-xl transition text-left flex items-center gap-3">
                    <span>📝</span> Negocjacje Kontraktów
                </button>
                <button onclick="zmienWidok('sedziowie')" id="nav-sedziowie" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 font-medium p-3 rounded-xl transition text-left flex items-center gap-3">
                    <span>🚩</span> Sędziowie i Mecze
                </button>
                <button onclick="zmienWidok('kary')" id="nav-kary" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 font-medium p-3 rounded-xl transition text-left flex items-center gap-3">
                    <span>⚖️</span> Komisja i Kary
                </button>
                <button onclick="zmienWidok('licencje')" id="nav-licencje" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 font-medium p-3 rounded-xl transition text-left flex items-center gap-3">
                    <span>🛡️</span> Licencje Klubowe
                </button>
                <button onclick="zmienWidok('zarzadzanie')" id="nav-zarzadzanie" class="w-full bg-slate-800 hover:bg-slate-700 border border-slate-700 font-medium p-3 rounded-xl transition text-left flex items-center gap-3">
                    <span>⚙️</span> Kluby i Ligi
                </button>
            </nav>
        </div>

        <div class="pt-6 border-t border-slate-800 mt-6">
            <button onclick="resetujGre()" class="w-full bg-rose-900/40 hover:bg-rose-900/60 border border-rose-800 text-rose-300 font-medium p-3 rounded-xl transition text-center">
                🔄 Resetuj Sezon
            </button>
        </div>
    </aside>

    <!-- Główna zawartość ekranu -->
    <main class="flex-1 p-4 md:p-8 space-y-6 overflow-y-auto">
        
        <!-- Pasek statystyk -->
        <header class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl grid grid-cols-1 sm:grid-cols-4 gap-4 text-center">
            <div class="bg-slate-800/60 px-4 py-3 rounded-xl border border-slate-700/50">
                <span class="block text-xs text-slate-400 uppercase">Kolejka</span>
                <span id="stat-kolejka" class="text-xl font-bold text-amber-400">1 / 35</span>
            </div>
            <div class="bg-slate-800/60 px-4 py-3 rounded-xl border border-slate-700/50">
                <span class="block text-xs text-slate-400 uppercase">Reputacja</span>
                <span id="stat-reputacja" class="text-xl font-bold text-sky-400">65/100</span>
            </div>
            <div class="bg-slate-800/60 px-4 py-3 rounded-xl border border-slate-700/50">
                <span class="block text-xs text-slate-400 uppercase">Budżet Związku</span>
                <span id="stat-budzet" class="text-xl font-bold text-emerald-400">15,000,000 PLN</span>
            </div>
            <div class="bg-slate-800/60 px-4 py-3 rounded-xl border border-slate-700/50 flex items-center justify-center">
                <button onclick="symulujKolejke()" id="btn-symuluj" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-2 px-4 rounded-xl transition shadow">
                    ⚽ Symuluj Kolejkę
                </button>
            </div>
        </header>

        <!-- Dynamiczny Widok / Ekran -->
        <div id="widok-kontener" class="space-y-6">
            <!-- Wypełniane przez JavaScript -->
        </div>

    </main>

    <script>
        let stan = {
            aktualnaLiga: "Ekstraklasa",
            ligi: ["Ekstraklasa", "1. Liga", "2. Liga"],
            kolejka: 1,
            budzet_centralny: 15000000,
            reputacja: 65,
            aktywnyWidok: 'tabela',
            kluby: {
                // Ekstraklasa
                "Legion Białystok": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 2500000, forma: 3, licencja: true, liga: "Ekstraklasa" },
                "Super Strikers": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 2200000, forma: 3, licencja: true, liga: "Ekstraklasa" },
                "FC Dinamo Wrocław": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 3000000, forma: 3, licencja: true, liga: "Ekstraklasa" },
                "Jagiellonia Futsal": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 3500000, forma: 3, licencja: true, liga: "Ekstraklasa" },
                "Orły Warszawa": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 2800000, forma: 3, licencja: true, liga: "Ekstraklasa" },
                "Błękitni Poznań": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 2000000, forma: 3, licencja: true, liga: "Ekstraklasa" },
                // 1. Liga
                "Znicz Pruszków": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 1800000, forma: 3, licencja: true, liga: "1. Liga" },
                "AZS UW Warszawa": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 1900000, forma: 3, licencja: true, liga: "1. Liga" },
                "Piast Gliwice Futsal": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 2100000, forma: 3, licencja: true, liga: "1. Liga" },
                "Rekord Bielsko-B.": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 2400000, forma: 3, licencja: true, liga: "1. Liga" },
                // 2. Liga
                "Gryf Wejherowo": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 1200000, forma: 3, licencja: true, liga: "2. Liga" },
                "Iskra Kielce": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 1100000, forma: 3, licencja: true, liga: "2. Liga" },
                "Warta Sieradz": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 1000000, forma: 3, licencja: true, liga: "2. Liga" },
                "Odra Opole Futsal": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 1300000, forma: 3, licencja: true, liga: "2. Liga" }
            },
            kontrakty: [
                { id: 1, nazwa: "Sponsor Główny (BetPol)", typ: "sponsor", zyskNaKolejke: 300000, pozostałoKolejek: 35 },
                { id: 2, nazwa: "Prawa Telewizyjne (Polsat Sport)", typ: "tv", zyskNaKolejke: 500000, pozostałoKolejek: 35 },
                { id: 3, nazwa: "Sponsor Techniczny (Sportwear)", typ: "sponsor", zyskNaKolejke: 150000, pozostałoKolejek: 35 }
            ],
            ofertyKontraktow: [
                { id: 101, nazwa: "Sponsor Strategiczny (Orlen)", zyskNaKolejke: 450000, kolejek: 35, kosztPodpisania: 200000 },
                { id: 102, nazwa: "Partner Techniczny (Adidas)", zyskNaKolejke: 200000, kolejek: 20, kosztPodpisania: 100000 }
            ],
            sedziowie: [
                { id: 1, imie: "Piotr Sędzia (FIFA)", poziom: "Wysoki", kontrowersje: "Niskie", przypisanyMecz: null },
                { id: 2, imie: "Jan Frankowski", poziom: "Średni", kontrowersje: "Średnie", przypisanyMecz: null },
                { id: 3, imie: "Tomasz Kwiatkowski", poziom: "Wysoki", kontrowersje: "Niskie", przypisanyMecz: null },
                { id: 4, imie: "Krzysztof Jakubik", poziom: "Niski", kontrowersje: "Wysokie", przypisanyMecz: null },
                { id: 5, imie: "Paweł Raczkowski", poziom: "Wysoki", kontrowersje: "Średnie", przypisanyMecz: null },
                { id: 6, imie: "Damian Sylwestrzak", poziom: "Średni", kontrowersje: "Niskie", przypisanyMecz: null },
                { id: 7, imie: "Jarosław Przybył", poziom: "Średni", kontrowersje: "Wysokie", przypisanyMecz: null },
                { id: 8, imie: "Wojciech Myć", poziom: "Niski", kontrowersje: "Średnie", przypisanyMecz: null }
            ],
            logi: ["Rozpoczął się nowy 35-kolejkowy sezon rozgrywek ligowych."],
            meczoweWydarzenia: []
        };

        function zmienWidok(widok) {
            stan.aktywnyWidok = widok;
            document.querySelectorAll('aside nav button').forEach(b => {
                b.classList.remove('bg-emerald-600', 'font-semibold');
                b.classList.add('bg-slate-800', 'font-medium');
            });
            let aktywnyBtn = document.getElementById('nav-' + widok);
            if (aktywnyBtn) {
                aktywnyBtn.classList.remove('bg-slate-800', 'font-medium');
                aktywnyBtn.classList.add('bg-emerald-600', 'font-semibold');
            }
            renderujWidok();
        }

        function odswiezUI() {
            document.getElementById('stat-kolejka').innerText = `${stan.kolejka} / 35`;
            document.getElementById('stat-reputacja').innerText = `${stan.reputacja}/100`;
            document.getElementById('stat-budzet').innerText = stan.budzet_centralny.toLocaleString() + " PLN";
            document.getElementById('tytul-ligi').innerText = stan.aktualnaLiga;
            renderujWidok();
        }

        function dodajLog(tekst) {
            stan.logi.unshift(tekst);
            if (stan.logi.length > 25) stan.logi.pop();
        }

        function dodajWydarzenieMeczowe(tekst) {
            stan.meczoweWydarzenia.unshift(tekst);
            if (stan.meczoweWydarzenia.length > 100) stan.meczoweWydarzenia.pop();
        }

        function zmienLige(nowaLiga) {
            stan.aktualnaLiga = nowaLiga;
            renderujWidok();
        }

        function generujParyDlaLigi(nazwaLigi) {
            let kluby = Object.keys(stan.kluby).filter(k => stan.kluby[k].liga === nazwaLigi && stan.kluby[k].licencja);
            let pary = [];
            for (let i = 0; i < kluby.length; i += 2) {
                if (i + 1 < kluby.length) {
                    pary.push([kluby[i], kluby[i+1]]);
                }
            }
            return pary;
        }

        function renderujWidok() {
            let kontener = document.getElementById('widok-kontener');
            kontener.innerHTML = '';

            if (stan.aktywnyWidok === 'tabela') {
                let klubyW1Lidze = Object.entries(stan.kluby).filter(([k, d]) => d.liga === stan.aktualnaLiga);
                let posortowane = klubyW1Lidze.sort((a, b) => {
                    if (b[1].punkty !== a[1].punkty) return b[1].punkty - a[1].punkty;
                    let bilansA = a[1].bramki_strzelone - a[1].bramki_stracone;
                    let bilansB = b[1].bramki_strzelone - b[1].bramki_stracone;
                    if (bilansB !== bilansA) return bilansB - bilansA;
                    return b[1].bramki_strzelone - a[1].bramki_strzelone;
                });

                let wierszeTabeli = posortowane.map(([nazwa, dane], idx) => {
                    let bilans = dane.bramki_strzelone - dane.bramki_stracone;
                    return `
                        <tr class="border-b border-slate-800/50 hover:bg-slate-800/30">
                            <td class="py-3 px-2 font-semibold text-slate-400">${idx + 1}</td>
                            <td class="py-3 px-2 font-medium text-slate-200">${nazwa}</td>
                            <td class="py-3 px-2 text-center text-slate-400">${stan.kolejka - 1}</td>
                            <td class="py-3 px-2 text-center font-bold text-emerald-400">${dane.punkty}</td>
                            <td class="py-3 px-2 text-center text-slate-300">${dane.bramki_strzelone}:${dane.bramki_stracone} (${bilans > 0 ? '+' + bilans : bilans})</td>
                            <td class="py-3 px-2 text-right">
                                <span class="px-2 py-0.5 rounded text-[10px] font-semibold ${dane.licencja ? 'bg-emerald-900/50 text-emerald-300 border border-emerald-700' : 'bg-rose-900/50 text-rose-300 border border-rose-700'}">
                                    ${dane.licencja ? 'Aktywna' : 'Brak'}
                                </span>
                            </td>
                        </tr>
                    `;
                }).join('');

                kontener.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="text-lg font-bold text-slate-200">Tabela: ${stan.aktualnaLiga}</h2>
                                <select onchange="zmienLige(this.value)" class="bg-slate-800 border border-slate-700 text-sm rounded-lg px-3 py-1.5 text-slate-200">
                                    ${stan.ligi.map(l => `<option value="${l}" ${l === stan.aktualnaLiga ? 'selected' : ''}>${l}</option>`).join('')}
                                </select>
                            </div>
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse text-sm">
                                    <thead>
                                        <tr class="border-b border-slate-800 text-slate-400">
                                            <th class="py-2 px-2">Poz</th>
                                            <th class="py-2 px-2">Klub</th>
                                            <th class="py-2 px-2 text-center">M</th>
                                            <th class="py-2 px-2 text-center">Pkt</th>
                                            <th class="py-2 px-2 text-center">Bilans</th>
                                            <th class="py-2 px-2 text-right">Licencja</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${wierszeTabeli || '<tr><td colspan="6" class="py-4 text-center text-slate-500">Brak klubów w tej lidze</td></tr>'}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col">
                            <h2 class="text-lg font-bold mb-4 text-slate-200">Dziennik Związku</h2>
                            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex-1 text-xs text-slate-300 space-y-2 overflow-y-auto max-h-[380px]">
                                ${stan.logi.map(l => `<p class="border-l-2 border-emerald-500 pl-2 py-0.5">${l}</p>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (stan.aktywnyWidok === 'wydarzenia') {
                kontener.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                        <h2 class="text-xl font-bold text-slate-100">Kronika Wydarzeń i Meczów</h2>
                        <p class="text-xs text-slate-400">Tutaj pojawiają się szczegółowe zapisy spotkań, gole, kartki i przebieg rywalizacji z każdej kolejki.</p>
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs text-slate-300 space-y-3 overflow-y-auto max-h-[500px]">
                            ${stan.meczoweWydarzenia.length > 0 ? stan.meczoweWydarzenia.map(w => `<div class="border-b border-slate-800/80 pb-2">${w}</div>`).join('') : '<p class="text-slate-500">Brak zarejestrowanych wydarzeń z meczów. Rozegraj pierwszą kolejkę!</p>'}
                        </div>
                    </div>
                `;
            } else if (stan.aktywnyWidok === 'finanse') {
                kontener.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                        <h2 class="text-xl font-bold text-slate-100">Zarządzanie Finansami i Marketingiem</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl">
                                <h3 class="font-semibold text-emerald-400 mb-2">Pakiet Medialny TV</h3>
                                <p class="text-xs text-slate-300 mb-4">Zainwestuj w nowoczesny sprzęt transmisyjny, aby podnieść atrakcyjność ligi.</p>
                                <button onclick="inwestujFinanse('tv')" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded-lg text-sm font-medium">Inwestuj (1.000.000 PLN)</button>
                            </div>
                            <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl">
                                <h3 class="font-semibold text-sky-400 mb-2">Kampania Wizerunkowa</h3>
                                <p class="text-xs text-slate-300 mb-4">Ogólnokrajowa akcja marketingowa zwiększająca reputację organizacji (+8 pkt).</p>
                                <button onclick="inwestujFinanse('marketing')" class="w-full bg-sky-600 hover:bg-sky-500 py-2 rounded-lg text-sm font-medium">Kup Kampanię (750.000 PLN)</button>
                            </div>
                            <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl">
                                <h3 class="font-semibold text-amber-400 mb-2">Gala Sezonu</h3>
                                <p class="text-xs text-slate-300 mb-4">Organizacja prestiżowej gali nagród dla najlepszych zawodników i klubów.</p>
                                <button onclick="inwestujFinanse('gala')" class="w-full bg-amber-600 hover:bg-amber-500 py-2 rounded-lg text-sm font-medium">Zorganizuj Galę (500.000 PLN)</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (stan.aktywnyWidok === 'kontrakty') {
                kontener.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                        <h2 class="text-xl font-bold text-slate-100">Aktywne Kontrakty i Nowe Oferty</h2>
                        <p class="text-xs text-slate-400">Zarządzaj trwającymi umowami oraz przeglądaj automatycznie generowane propozycje rynkowe.</p>
                        
                        <div class="space-y-3">
                            <h3 class="font-semibold text-sm text-slate-300">Podpisane Kontrakty:</h3>
                            ${stan.kontrakty.map(k => `
                                <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex justify-between items-center">
                                    <div>
                                        <h4 class="font-bold text-slate-200">${k.nazwa}</h4>
                                        <p class="text-xs text-emerald-400">Przychód: +${k.zyskNaKolejke.toLocaleString()} PLN / kolejkę</p>
                                        <p class="text-xs text-amber-400">Pozostało kolejek: ${k.pozostałoKolejek}</p>
                                    </div>
                                    <button onclick="negocjujKontrakt(${k.id})" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-medium">Przedłuż (+5 kolejek)</button>
                                </div>
                            `).join('')}
                        </div>

                        <div class="pt-4 border-t border-slate-800 space-y-3">
                            <h3 class="font-semibold text-sm text-slate-300">Dostępne Nowe Oferty na Rynku:</h3>
                            ${stan.ofertyKontraktow.length > 0 ? stan.ofertyKontraktow.map(o => `
                                <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                                    <div>
                                        <h4 class="font-bold text-emerald-400">${o.nazwa}</h4>
                                        <p class="text-xs text-slate-300">Zysk: +${o.zyskNaKolejke.toLocaleString()} PLN/kolejkę \vert{} Czas: ${o.kolejek} kolejek</p>
                                        <p class="text-xs text-slate-400">Koszt podpisania: ${o.kosztPodpisania.toLocaleString()} PLN</p>
                                    </div>
                                    <button onclick="podpiszOfertu(${o.id})" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-medium">Podpisz Umowę</button>
                                </div>
                            `).join('') : '<p class="text-xs text-slate-500">Brak nowych ofert. Pojawią się w kolejnych kolejkach.</p>'}
                        </div>
                    </div>
                `;
            } else if (stan.aktywnyWidok === 'sedziowie') {
                kontener.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                        <h2 class="text-xl font-bold text-slate-100">Obsada Sędziowska na Kolejkę ${stan.kolejka} (Wszystkie Ligi)</h2>
                        <p class="text-xs text-slate-400">Przypisz sędziów do meczów ze wszystkich prowadzonych lig.</p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-4">
                                ${stan.ligi.map(liga => {
                                    let pary = generujParyDlaLigi(liga);
                                    if(pary.length === 0) return '';
                                    return `
                                        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-2">
                                            <h3 class="font-bold text-emerald-400 text-sm border-b border-slate-800 pb-1">Liga: ${liga}</h3>${pary.map((para, pIdx) => {
                                                let globalnyID = `${liga}_${pIdx}`;
                                                return `
                                                    <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-lg text-xs space-y-1">
                                                        <p class="font-medium text-slate-200">${para[0]} vs ${para[1]}</p>
                                                        <div class="flex items-center gap-2">
                                                            <span class="text-slate-400">Sędzia:</span>
                                                            <select onchange="przypiszSedziego('${globalnyID}', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 flex-1 text-slate-200">
                                                                <option value="">-- Wybierz sędziego --</option>
                                                                ${stan.sedziowie.filter(s => s.przypisanyMecz === null || s.przypisanyMecz === globalnyID).map(s => `
                                                                    <option value="${s.id}" ${s.przypisanyMecz === globalnyID ? 'selected' : ''}>${s.imie} (${s.poziom})</option>
                                                                `).join('')}
                                                            </select>
                                                        </div>
                                                    </div>
                                                `;
                                            }).join('')}
                                        </div>
                                    `;
                                }).join('')}
                            </div>

                            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-3 h-fit">
                                <h3 class="font-semibold text-sm text-slate-300">Wszyscy Sędziowie Związku:</h3>
                                <div class="space-y-2 max-h-[450px] overflow-y-auto">
                                    ${stan.sedziowie.map(s => `
                                        <div class="bg-slate-900 border border-slate-800 p-2 rounded-lg text-xs flex justify-between items-center">
                                            <div>
                                                <span class="font-medium text-slate-200">${s.imie}</span>
                                                <p class="text-[10px] text-slate-400">Poziom: ${s.poziom} \vert{} Kontrowersje:${s.kontrowersje}</p>
                                            </div>
                                            <span class="px-2 py-1 rounded text-[10px] ${s.przypisanyMecz !== null ? 'bg-amber-900/50 text-amber-300 border border-amber-800' : 'bg-emerald-900/50 text-emerald-300 border border-emerald-800'}">
                                                ${s.przypisanyMecz !== null ? 'Delegowany' : 'Wolny'}
                                            </span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (stan.aktywnyWidok === 'kary') {
                kontener.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6 max-w-xl">
                        <h2 class="text-xl font-bold text-slate-100">Komisja Dyscyplinarna - Nakładanie Kar</h2>
                        <p class="text-xs text-slate-400">Wprowadź sankcje regulaminowe dla wybranego klubu. Kara finansowa pomniejsza budżet klubu, a punkty są bezpośrednio odejmowane w tabeli.</p>
                        
                        <div class="space-y-4">
                            <div>
                                <label class="block text-xs text-slate-300 mb-1">Wybierz Klub:</label>
                                <select id="kara-klub" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200">
                                    ${Object.keys(stan.kluby).map(k => `<option value="${k}">${k} (${stan.kluby[k].liga})</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-300 mb-1">Odejmowane punkty:</label>
                                <input type="number" id="kara-pkt" value="1" min="0" max="20" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-300 mb-1">Kara finansowa dla klubu (PLN):</label>
                                <input type="number" id="kara-kasa" value="50000" step="10000" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200">
                            </div>
                            <button onclick="zastosujKare()" class="w-full bg-rose-700 hover:bg-rose-600 py-3 rounded-xl font-medium text-sm transition">Nałóż Oficjalną Karę</button>
                        </div>
                    </div>
                `;
            } else if (stan.aktywnyWidok === 'licencje') {
                kontener.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                        <h2 class="text-xl font-bold text-slate-100">Zarządzanie Licencjami Klubowymi</h2>
                        <p class="text-xs text-slate-400">Kluby bez ważnej licencji nie mogą brać udziału w oficjalnych rozgrywkach związku.</p>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                            ${Object.entries(stan.kluby).map(([nazwa, dane]) => `
                                <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex justify-between items-center">
                                    <div>
                                        <h4 class="font-bold text-slate-200">${nazwa}</h4>
                                        <p class="text-xs text-slate-400">Liga: ${dane.liga}</p>
                                        <span class="inline-block mt-2 px-2 py-0.5 rounded text-[10px] font-semibold ${dane.licencja ? 'bg-emerald-900/50 text-emerald-300 border border-emerald-700' : 'bg-rose-900/50 text-rose-300 border border-rose-700'}">
                                            ${dane.licencja ? 'Licencja aktywna' : 'Brak licencji'}
                                        </span>
                                    </div>
                                    <button onclick="przelaczLicencje('${nazwa}')" class="px-4 py-2 rounded-lg text-xs font-medium ${dane.licencja ? 'bg-rose-800 hover:bg-rose-700 text-slate-100' : 'bg-emerald-700 hover:bg-emerald-600 text-slate-100'}">
                                        ${dane.licencja ? 'Odbierz' : 'Przyznaj'}
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (stan.aktywnyWidok === 'zarzadzanie') {
                kontener.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                            <h2 class="text-xl font-bold text-slate-100">Dodaj Nowy Klub</h2>
                            <div class="space-y-3">
                                <input type="text" id="nowy-klub-nazwa" placeholder="Nazwa klubu" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200">
                                <select id="nowy-klub-liga" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200">
                                    ${stan.ligi.map(l => `<option value="${l}">${l}</option>`).join('')}
                                </select>
                                <button onclick="dodajKlub()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2.5 rounded-xl text-sm font-medium">Zarejestruj Klub</button>
                            </div>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                            <h2 class="text-xl font-bold text-slate-100">Zarządzanie Ligami (Tworzenie, Edycja, Usuwanie)</h2>
                            <div class="space-y-3">
                                <input type="text" id="nowa-liga-nazwa" placeholder="Nazwa nowej ligi" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-sm text-slate-200">
                                <button onclick="dodajLige()" class="w-full bg-sky-600 hover:bg-sky-500 py-2.5 rounded-xl text-sm font-medium">Utwórz Rozgrywki</button>
                            </div>
                            <div class="pt-3 border-t border-slate-800 space-y-2">
                                <p class="text-xs text-slate-400">Edytuj lub usuń istniejące ligi:</p>
                                ${stan.ligi.map((l, index) => `
                                    <div class="flex gap-2 items-center">
                                        <input type="text" id="edit-liga-${index}" value="${l}" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-200 flex-1">
                                        <button onclick="zapiszNazweLigi(${index})" class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-xs">Zmień</button>
                                        <button onclick="usunLige(${index})" class="bg-rose-900/60 hover:bg-rose-900 text-rose-300 px-3 py-1 rounded text-xs">Usuń</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="md:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                            <h2 class="text-xl font-bold text-slate-100">Istniejące Kluby (Usuwanie)</h2>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                                ${Object.keys(stan.kluby).map(k => `
                                    <div class="bg-slate-800 p-3 rounded-xl flex justify-between items-center text-xs">
                                        <span class="font-medium text-slate-200">${k}</span>
                                        <button onclick="usunKlub('${k}')" class="text-rose-400 hover:text-rose-300 font-bold px-2 py-1">Usuń</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function inwestujFinanse(typ) {
            if (typ === 'tv' && stan.budzet_centralny >= 1000000) {
                stan.budzet_centralny -= 1000000;
                stan.reputacja = Math.min(100, stan.reputacja + 5);
                dodajLog("📺 Zakupiono nowoczesny pakiet medialny TV. Reputacja ligi wzrosła.");
            } else if (typ === 'marketing' && stan.budzet_centralny >= 750000) {
                stan.budzet_centralny -= 750000;
                stan.reputacja = Math.min(100, stan.reputacja + 8);
                dodajLog("📈 Przeprowadzono ogólnokrajową kampanię wizerunkową.");
            } else if (typ === 'gala' && stan.budzet_centralny >= 500000) {
                stan.budzet_centralny -= 500000;
                stan.reputacja = Math.min(100, stan.reputacja + 4);
                dodajLog("✨ Zorganizowano prestiżową galę sezonu.");
            } else {
                alert("Brak wystarczających środków w budżecie centralnym!");
            }
            odswiezUI();
        }

        function negocjujKontrakt(id) {
            let k = stan.kontrakty.find(x => x.id === id);
            if (k) {
                k.pozostałoKolejek += 5;
                k.zyskNaKolejke += 50000;
                dodajLog(`📝 Przedłużono kontrakt "${k.nazwa}". Nowy zysk: +${k.zyskNaKolejke.toLocaleString()} PLN/kolejkę.`);
                odswiezUI();
            }
        }

        function podpiszOfertu(id) {
            let oferta = stan.ofertyKontraktow.find(o => o.id === id);
            if (oferta) {
                if (stan.budzet_centralny >= oferta.kosztPodpisania) {
                    stan.budzet_centralny -= oferta.kosztPodpisania;
                    stan.kontrakty.push({
                        id: Date.now(),
                        nazwa: oferta.nazwa,
                        typ: "sponsor",
                        zyskNaKolejke: oferta.zyskNaKolejke,
                        pozostałoKolejek: oferta.kolejek
                    });
                    stan.ofertyKontraktow = stan.ofertyKontraktow.filter(o => o.id !== id);
                    dodajLog(`🤝 Podpisano nową umowę: "${oferta.nazwa}" (+${oferta.zyskNaKolejke.toLocaleString()} PLN/kolejkę).`);
                    odswiezUI();
                } else {
                    alert("Brak środków na pokrycie kosztów podpisania umowy!");
                }
            }
        }

        function generujLosowaOfertaKontraktu() {
            if (Math.random() < 0.7 && stan.ofertyKontraktow.length < 3) {
                let firmy = ["Lotos", "Orlen", "Żywiec", "T-Mobile", "Pekao SA", "4F", "Kratki"];
                let losowaFirma = firmy[Math.floor(Math.random() * firmy.length)];
                let zysk = Math.floor(Math.random() * 300000) + 150000;
                let koszt = Math.floor(zysk * 0.5);
                stan.ofertyKontraktow.push({
                    id: Date.now(),
                    nazwa: `Sponsor / Partner (${losowaFirma})`,
                    zyskNaKolejke: zysk,
                    kolejek: 35,
                    kosztPodpisania: koszt
                });
                dodajLog(`📢 Na rynku pojawiła się nowa oferta sponsorska od ${losowaFirma}! Sprawdź zakładkę Kontrakty.`);
            }
        }

        function przypiszSedziego(globalnyID, idSedziego) {
            stan.sedziowie.forEach(s => {
                if (s.przypisanyMecz === globalnyID) s.przypisanyMecz = null;
            });
            if (idSedziego !== "") {
                let sedzia = stan.sedziowie.find(s => s.id == idSedziego);
                if (sedzia) sedzia.przypisanyMecz = globalnyID;
            }
            renderujWidok();
        }

        function zastosujKare() {
            let klub = document.getElementById('kara-klub').value;
            let pkt = parseInt(document.getElementById('kara-pkt').value) || 0;
            let kasa = parseInt(document.getElementById('kara-kasa').value) || 0;

            if (stan.kluby[klub]) {
                // Poprawka: odejmowanie punktów od aktualnego dorobku w tabeli
                stan.kluby[klub].punkty = Math.max(0, stan.kluby[klub].punkty - pkt);
                // Kara finansowa pomniejsza budżet klubu, ale NIE trafia do budżetu centralnego związku
                stan.kluby[klub].budzet = Math.max(0, stan.kluby[klub].budzet - kasa);
                
                let komunikat = `⚖️ Komisja Dyscyplinarna ukarala klub ${klub}: -${pkt} pkt oraz grzywna finansowa w wysokości ${kasa.toLocaleString()} PLN.`;
                dodajLog(komunikat);
                dodajWydarzenieMeczowe(`[SANKCJA] ${komunikat}`);
                zmienWidok('tabela');
            }
        }

        function przelaczLicencje(nazwa) {
            stan.kluby[nazwa].licencja = !stan.kluby[nazwa].licencja;
            dodajLog(`🛡️ Zmieniono status licencji dla klubu ${nazwa} na: ${stan.kluby[nazwa].licencja ? 'Aktywna' : 'Odebrana'}.`);
            renderujWidok();
        }

        function dodajKlub() {
            let nazwa = document.getElementById('nowy-klub-nazwa').value.trim();
            let liga = document.getElementById('nowy-klub-liga').value;
            if (nazwa && !stan.kluby[nazwa]) {
                stan.kluby[nazwa] = { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 2000000, forma: 3, licencja: true, liga: liga };
                dodajLog(`🏢 Zarejestrowano nowy klub ${nazwa} w lidze ${liga}.`);
                zmienWidok('tabela');
            } else {
                alert("Podaj poprawną lub unikalną nazwę klubu.");
            }
        }

        function usunKlub(nazwa) {
            delete stan.kluby[nazwa];
            dodajLog(`🗑️ Usunięto klub ${nazwa} ze struktur związku.`);
            renderujWidok();
        }

        function dodajLige() {
            let nazwa = document.getElementById('nowa-liga-nazwa').value.trim();
            if (nazwa && !stan.ligi.includes(nazwa)) {
                stan.ligi.push(nazwa);
                dodajLog(`⚙️ Utworzono nowe rozgrywki ligowe: ${nazwa}.`);
                zmienWidok('tabela');
            } else {
                alert("Podaj poprawną lub unikalną nazwę ligi.");
            }
        }

        function usunLige(index) {
            let ligaDoUsuniecia = stan.ligi[index];
            if (stan.ligi.length <= 1) {
                alert("Musisz zostawić przynajmniej jedną ligę!");
                return;
            }
            if (confirm(`Czy na pewno chcesz usunąć ligę "${ligaDoUsuniecia}"? Kluby z tej ligi zostaną przeniesione.`)) {
                stan.ligi.splice(index, 1);
                let nowaDomyslna = stan.ligi[0];
                for (let k in stan.kluby) {
                    if (stan.kluby[k].liga === ligaDoUsuniecia) {
                        stan.kluby[k].liga = nowaDomyslna;
                    }
                }
                if (stan.aktualnaLiga === ligaDoUsuniecia) {
                    stan.aktualnaLiga = nowaDomyslna;
                }
                dodajLog(`🗑️ Usunięto ligę "${ligaDoUsuniecia}". Kluby przeniesiono do: ${nowaDomyslna}.`);
                odswiezUI();
            }
        }

        function zapiszNazweLigi(index) {
            let inputEl = document.getElementById(`edit-liga-${index}`);
            if (!inputEl) return;
            let inputVal = inputEl.value.trim();
            if (inputVal) {
                let staraNazwa = stan.ligi[index];
                if (staraNazwa === inputVal) return;
                
                stan.ligi[index] = inputVal;
                for (let k in stan.kluby) {
                    if (stan.kluby[k].liga === staraNazwa) {
                        stan.kluby[k].liga = inputVal;
                    }
                }
                if (stan.aktualnaLiga === staraNazwa) {
                    stan.aktualnaLiga = inputVal;
                }
                dodajLog(`⚙️ Zmieniono nazwę ligi z "${staraNazwa}" na "${inputVal}".`);
                odswiezUI();
            }
        }

        function symulujKolejke() {
            if (stan.kolejka > 35) return;

            let sumaPrzychodow = 0;
            stan.kontrakty.forEach(k => {
                sumaPrzychodow += k.zyskNaKolejke;
                k.pozostałoKolejek--;
            });
            stan.budzet_centralny += sumaPrzychodow;
            stan.kontrakty = stan.kontrakty.filter(k => k.pozostałoKolejek > 0);

            stan.ligi.forEach(liga => {
                let klubyW2Lidze = Object.keys(stan.kluby).filter(k => stan.kluby[k].liga === liga && stan.kluby[k].licencja);
                for (let i = klubyW2Lidze.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [klubyW2Lidze[i], klubyW2Lidze[j]] = [klubyW2Lidze[j], klubyW2Lidze[i]];
                }

                let wynikiTekst = `<strong>Wyniki kolejki ${stan.kolejka} (${liga}):</strong><br>`;
                let rozegranoMecze = false;
                for (let i = 0; i < klubyW2Lidze.length; i += 2) {
                    if (i + 1 >= klubyW2Lidze.length) break;
                    rozegranoMecze = true;
                    let g = klubyW2Lidze[i];
                    let as = klubyW2Lidze[i+1];

                    let gBramki = Math.floor(Math.random() * 5) + (stan.kluby[g].forma > 3 ? 1 : 0);
                    let asBramki = Math.floor(Math.random() * 5) + (stan.kluby[as].forma > 3 ? 1 : 0);

                    stan.kluby[g].bramki_strzelone += gBramki;
                    stan.kluby[g].bramki_stracone += asBramki;
                    stan.kluby[as].bramki_strzelone += asBramki;
                    stan.kluby[as].bramki_stracone += gBramki;

                    if (gBramki > asBramki) {
                        stan.kluby[g].punkty += 3;
                    } else if (asBramki > gBramki) {
                        stan.kluby[as].punkty += 3;
                    } else {
                        stan.kluby[g].punkty += 1;
                        stan.kluby[as].punkty += 1;
                    }

                    wynikiTekst += `🏟️ ${g} ${gBramki} : ${asBramki} ${as}<br>`;
                    
                    // Generowanie szczegółowych wydarzeń do nowej zakładki
                    let opisMeczu = `[Kolejka ${stan.kolejka} | ${liga}] ${g} ${gBramki}:${asBramki} ${as} — Mecz stał na zaciętym poziomie. Oddano łącznie ${gBramki + asBramki + 4} strzały na bramkę. Sędzia pokazał kilka żółtych kar.`;
                    dodajWydarzenieMeczowe(opisMeczu);
                }
                if (rozegranoMecze) {
                    dodajLog(wynikiTekst);
                }
            });

            dodajLog(`💰 Zasilenie budżetu z aktywnych kontraktów: +${sumaPrzychodow.toLocaleString()} PLN.`);

            stan.sedziowie.forEach(s => s.przypisanyMecz = null);
            generujLosowaOfertaKontraktu();

            stan.kolejka++;

            if (stan.kolejka > 35) {
                rozstrzygnijAwansISpadek();
            }

            odswiezUI();
        }

        function rozstrzygnijAwansISpadek() {
            dodajLog("🏆 Koniec 35. kolejki! Sezon dobiegł końca. Następuje automatyczna aktualizacja tabel i rozstrzygnięcie sezonu.");
            stan.ligi.forEach(liga => {
                let klubyLigi = Object.entries(stan.kluby).filter(([k, d]) => d.liga === liga);
                klubyLigi.sort((a, b) => b[1].punkty - a[1].punkty);
                if (klubyLigi.length >= 2) {
                    let mistrz = klubyLigi[0][0];
                    let spadkowicz = klubyLigi[klubyLigi.length - 1][0];
                    dodajLog(`🥇 W lidze ${liga} mistrzem zostaje ${mistrz}, a spada ${spadkowicz}!`);
                }
            });

            for (let k in stan.kluby) {
                stan.kluby[k].punkty = 0;
                stan.kluby[k].bramki_strzelone = 0;
                stan.kluby[k].bramki_stracone = 0;
            }
            stan.kolejka = 1;
            dodajLog("🔄 Tabela została automatycznie zresetowana. Rozpoczyna się nowy sezon!");
        }

        function resetujGre() {
            if (confirm("Czy na pewno chcesz zresetować cały sezon ligowy?")) {
                location.reload();
            }
        }

        odswiezUI();
    </script>
</body>
</html>
