<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StreamForge — Startup Video Platform Simulator</title>

<style>
:root{
  --bg:#080b10;
  --panel:#10151d;
  --panel2:#151c26;
  --line:#263141;
  --txt:#eef3f8;
  --mut:#91a0b3;
  --accent:#ff3d55;
  --good:#3ddc97;
  --warn:#ffc857
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--txt);
  font:14px system-ui,Arial
}

.app{
  display:grid;
  grid-template-columns:240px 1fr;
  min-height:100vh
}

aside{
  background:#0c1118;
  border-right:1px solid var(--line);
  padding:18px 12px;
  position:sticky;
  top:0;
  height:100vh;
  overflow:auto
}

.logo{
  font-size:21px;
  font-weight:900;
  margin:5px 8px 22px
}

.logo b{color:var(--accent)}

.nav{
  width:100%;
  border:0;
  background:transparent;
  color:#aeb8c6;
  padding:11px;
  border-radius:9px;
  text-align:left;
  margin:2px 0;
  cursor:pointer
}

.nav:hover,.nav.active{
  background:#1c2633;
  color:#fff
}

.nav span{
  display:inline-block;
  width:28px
}

main{min-width:0}

.top{
  min-height:68px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 22px;
  background:#0c1118;
  position:sticky;
  top:0;
  z-index:5
}

.topstats,.row{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap
}

.pill,.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px
}

.content{
  padding:22px;
  max-width:1450px;
  margin:auto
}

.hero{
  background:linear-gradient(135deg,#1c1a28,#121923);
  border:1px solid #343246;
  padding:20px;
  border-radius:17px;
  margin-bottom:14px
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:11px;
  margin:11px 0
}

.mut{color:var(--mut)}
.good{color:var(--good)}
.bad{color:#ff7183}
.warn{color:var(--warn)}

button,input,select{font:inherit}

.btn{
  border:1px solid #39475a;
  background:#202b39;
  color:#fff;
  padding:9px 11px;
  border-radius:9px;
  cursor:pointer
}

.btn:hover{filter:brightness(1.14)}

.primary{
  background:var(--accent);
  border-color:var(--accent);
  font-weight:800
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed
}

input,select{
  background:#0b1017;
  color:#fff;
  border:1px solid #354254;
  border-radius:8px;
  padding:8px
}

table{
  width:100%;
  border-collapse:collapse;
  background:var(--panel);
  border-radius:12px;
  overflow:hidden
}

th,td{
  padding:10px;
  border-bottom:1px solid var(--line);
  text-align:left
}

.tag{
  display:inline-block;
  padding:3px 7px;
  border:1px solid #3a485a;
  border-radius:20px;
  margin:2px;
  font-size:12px
}

.bar{
  height:8px;
  background:#222b38;
  border-radius:20px;
  overflow:hidden
}

.bar i{
  display:block;
  height:100%;
  background:var(--accent)
}

.decision{
  border-left:4px solid var(--warn)
}

.tech-card.done{
  opacity:.6
}

.small{
  font-size:12px
}

@media(max-width:780px){
  .app{grid-template-columns:1fr}
  aside{height:auto;position:relative}
  .top{position:relative}
  .content{padding:12px}
}
</style>
</head>

<body>

<div class="app">

<aside>

<div class="logo">
▶ <b>Stream</b>Forge
<div class="mut small">STARTUP SIMULATOR</div>
</div>

<button class="nav active" data-page="dashboard">
<span>📊</span>Dashboard
</button>

<button class="nav" data-page="launch">
<span>🚀</span>Start i MVP
</button>

<button class="nav" data-page="staff">
<span>👥</span>Pracownicy
</button>

<button class="nav" data-page="projects">
<span>📋</span>Projekty
</button>

<button class="nav" data-page="research">
<span>🧪</span>Badania
</button>

<button class="nav" data-page="service">
<span>🛠️</span>Serwis i technicy
</button>

<button class="nav" data-page="infra">
<span>🖥️</span>Serwery
</button>

<button class="nav" data-page="creators">
<span>🎬</span>Twórcy
</button>

<button class="nav" data-page="business">
<span>💎</span>Monetyzacja
</button>

<button class="nav" data-page="finance">
<span>💰</span>Finanse
</button>

<button class="nav" data-page="decisions">
<span>🔔</span>Decyzje
</button>

</aside>

<main>

<div class="top">

<b id="date"></b>

<div class="topstats">

<div class="pill">
💰 <b id="money"></b>
</div>

<div class="pill">
👥 <b id="users"></b>
</div>

<div class="pill">
⭐ <b id="rep"></b>
</div>

<button class="btn" onclick="cycleSpeed()">
⏩ <span id="speed"></span>
</button>

<button class="btn" onclick="saveGame()">
💾 Zapisz
</button>

</div>
</div>

<div id="panel" class="content"></div>

</main>
</div>

<script>

const fmt=n=>
  Math.round(Number(n)||0)
  .toLocaleString("pl-PL");

const rnd=(a,b)=>
  Math.floor(
    Math.random()*(b-a+1)
  )+a;

const pick=a=>
  a[
    Math.floor(
      Math.random()*a.length
    )
  ];

const clamp=(v,a,b)=>
  Math.max(
    a,
    Math.min(b,v)
  );

/* =========================
   NOWA GRA
========================= */

function fresh(){

 return {

  day:1,
  month:1,
  year:2026,

  money:250000,

  speed:1,

  launched:false,

  users:0,
  creators:0,
  videos:0,

  reputation:15,

  bugs:0,

  stability:65,
  security:45,

  devPoints:0,
  researchPoints:0,

  techLevel:1,

  version:"0.1 Alpha",

  servers:1,
  serverCapacity:1500,
  storage:2,

  staff:[],
  candidates:[],

  projects:[],

  technologies:[],
  unlocked:[],

  premiumPrice:19.99,
  premiumUsers:0,

  adCPM:5,

  creatorShare:55,

  ledger:[],

  decisions:[],

  nextId:1,

  lastCandidateDay:0,
  lastTechDay:0

 };

}

let G;

try{

 G=
   JSON.parse(
     localStorage.getItem(
       "streamforge-v2"
     )
   )
   ||
   fresh();

}
catch(e){

 G=fresh();

}

for(
 const [k,v]
 of Object.entries(fresh())
){

 if(G[k]===undefined)
   G[k]=v;

}

/* =========================
   ROLE PRACOWNIKÓW
========================= */

const roles={

 "Programista":{
   salary:8000,
   dev:7,
   repair:2,
   research:1,
   perks:[
     "Badacz",
     "Architekt",
     "Debuger"
   ]
 },

 "Technik":{
   salary:6500,
   dev:1,
   repair:9,
   research:1,
   perks:[
     "Serwisant",
     "Administrator",
     "Optymalizator"
   ]
 },

 "Badacz R&D":{
   salary:9000,
   dev:2,
   repair:1,
   research:9,
   perks:[
     "Badacz",
     "Wizjoner",
     "Analityk"
   ]
 },

 "Designer UI/UX":{
   salary:7000,
   dev:4,
   repair:1,
   research:2,
   perks:[
     "Projektant",
     "Analityk UX"
   ]
 },

 "Moderator":{
   salary:5000,
   dev:0,
   repair:1,
   research:0,
   perks:[
     "Moderator",
     "Community"
   ]
 },

 "Marketing":{
   salary:6500,
   dev:0,
   repair:0,
   research:1,
   perks:[
     "Growth",
     "PR"
   ]
 },

 "Creator Manager":{
   salary:7200,
   dev:0,
   repair:0,
   research:1,
   perks:[
     "Negocjator",
     "Community"
   ]
 }

};

/* =========================
   BONUSY PERKÓW
========================= */

const perkBonus={

 "Badacz":{
   research:4
 },

 "Wizjoner":{
   research:6
 },

 "Analityk":{
   research:3
 },

 "Serwisant":{
   repair:5
 },

 "Administrator":{
   repair:4
 },

 "Optymalizator":{
   repair:3,
   dev:2
 },

 "Architekt":{
   dev:5
 },

 "Debuger":{
   repair:3,
   dev:2
 },

 "Projektant":{
   dev:4
 },

 "Analityk UX":{
   dev:3
 },

 "Moderator":{},
 "Community":{},
 "Growth":{},
 "PR":{},
 "Negocjator":{}

};

/* =========================
   GENEROWANIE PRACOWNIKÓW
========================= */

const names=[
 "Kacper",
 "Maja",
 "Oliwia",
 "Jan",
 "Zofia",
 "Michał",
 "Julia",
 "Antoni",
 "Lena",
 "Filip",
 "Amelia",
 "Jakub",
 "Natalia",
 "Igor",
 "Emilia",
 "Adam"
];

const surnames=[
 "Nowak",
 "Kowalski",
 "Wiśniewski",
 "Wójcik",
 "Kamiński",
 "Lewandowski",
 "Zieliński",
 "Szymański",
 "Woźniak",
 "Dąbrowski"
];

/* =========================
   GENEROWANIE TECHNOLOGII
========================= */

const techNamesA=[
 "Adaptive",
 "Quantum",
 "Smart",
 "Creator",
 "Stream",
 "Cloud",
 "Vision",
 "Pulse",
 "Auto",
 "Hyper",
 "Safe",
 "Studio",
 "Neural",
 "Edge"
];

const techNamesB=[
 "Codec",
 "Discovery",
 "CDN",
 "Moderation",
 "Search",
 "Analytics",
 "Player",
 "Upload",
 "Recommendations",
 "Transcoding",
 "Security",
 "Creator Tools",
 "Compression",
 "Streaming"
];

const techEffects=[
 "capacity",
 "growth",
 "stability",
 "research",
 "reputation"
];

/* =========================
   CZAS
========================= */

function absDay(){

 return (
   (
     G.year*12+
     G.month
   )*30
 )+G.day;

}

/* =========================
   FINANSE
========================= */

function cash(
 v,
 cat,
 desc
){

 G.money+=v;

 G.ledger.unshift({

   date:
     `${G.day}.${G.month}.${G.year}`,

   value:v,

   cat,

   desc

 });

 G.ledger=
   G.ledger.slice(0,400);

}

/* =========================
   SAVE
========================= */

function saveGame(){

 localStorage.setItem(
   "streamforge-v2",
   JSON.stringify(G)
 );

}

/* =========================
   MOC PRACOWNIKÓW
========================= */

function staffPower(type){

 return G.staff.reduce(
   (sum,s)=>{

     const base=
       roles[s.role]?.[type]
       ||
       0;

     const perk=
       perkBonus[s.perk]?.[type]
       ||
       0;

     return sum+
       (base+perk)*
       (
         0.7+
         s.skill/100
       );

   },
   0
 );

}

/* =========================
   SERWERY
========================= */

function capacity(){

 return (
   G.servers *
   G.serverCapacity *
   (
     1+
     G.techLevel*.08
   )
 );

}

function load(){

 return G.launched

 ? clamp(
     G.users /
     Math.max(
       1,
       capacity()
     )
     *100,
     0,
     250
   )

 : 0;

}

/* =========================
   DECYZJE
========================= */

function addDecision(
 title,
 text
){

 if(
   G.decisions.some(
     d=>
       d.open &&
       d.title===title
   )
 )
 return;

 G.decisions.unshift({

   id:G.nextId++,

   title,

   text,

   open:true,

   date:
     `${G.day}.${G.month}.${G.year}`

 });

}

/* =========================
   KANDYDACI
========================= */

function generateCandidates(){

 const count=
   rnd(3,6);

 for(
   let i=0;
   i<count;
   i++
 ){

   const role=
     pick(
       Object.keys(roles)
     );

   const skill=
     rnd(35,92);

   const perk=
     pick(
       roles[role].perks
     );

   const salary=
     Math.round(
       roles[role].salary *
       (
         .8+
         skill/150
       )
       /100
     )*100;

   G.candidates.push({

     id:G.nextId++,

     name:
       pick(names)
       +" "+
       pick(surnames),

     role,

     skill,

     perk,

     salary

   });

 }

 G.candidates=
   G.candidates.slice(-20);

 G.lastCandidateDay=
   absDay();

}

/* =========================
   ZATRUDNIANIE
========================= */

function hire(id){

 const c=
   G.candidates.find(
     x=>x.id===id
   );

 if(!c)
   return;

 if(G.money<c.salary){

   alert(
     "Za mało gotówki na koszt rekrutacji."
   );

   return;

 }

 cash(
   -c.salary,
   "HR",
   "Rekrutacja: "+c.name
 );

 G.staff.push({

   ...c,

   experience:0

 });

 G.candidates=
   G.candidates.filter(
     x=>x.id!==id
   );

 render();

}

function fire(id){

 G.staff=
   G.staff.filter(
     x=>x.id!==id
   );

 render();

}

/* =========================
   NOWE TECHNOLOGIE
========================= */

function generateTech(){

 let name;

 do{

   name=
     pick(techNamesA)
     +" "+
     pick(techNamesB)
     +" "+
     rnd(1,9);

 }
 while(
   G.technologies.some(
     t=>t.name===name
   )
 );

 const effect=
   pick(techEffects);

 const difficulty=
   Math.round(
     (
       80+
       rnd(0,100)
     )
     *
     (
       1+
       G.techLevel*.15
     )
   );

 G.technologies.push({

   id:G.nextId++,

   name,

   effect,

   difficulty,

   progress:0,

   done:false,

   created:absDay()

 });

 G.lastTechDay=
   absDay();

 G.technologies=
   G.technologies.slice(-25);

}

/* =========================
   AUTOMATYCZNE BADANIA
========================= */

function researchTick(){

 const p=
   staffPower(
     "research"
   );

 if(p<=0)
   return;

 const t=
   G.technologies.find(
     x=>!x.done
   );

 if(!t)
   return;

 t.progress+=
   p/8;

 if(
   t.progress>=
   t.difficulty
 ){

   t.done=true;

   t.progress=
     t.difficulty;

   G.unlocked.push(
     t.name
   );

   G.techLevel++;

   G.reputation+=2;

   if(
     t.effect==="capacity"
   ){

     G.serverCapacity=
       Math.round(
         G.serverCapacity*
         1.12
       );

   }

   if(
     t.effect==="stability"
   ){

     G.stability=
       clamp(
         G.stability+8,
         0,
         100
       );

   }

   if(
     t.effect==="reputation"
   ){

     G.reputation=
       clamp(
         G.reputation+4,
         0,
         100
       );

   }

   addDecision(
     "Technologia opracowana",
     `${t.name} została automatycznie ukończona przez dział badań.`
   );

 }

}

/* =========================
   TECHNICY
========================= */

function techniciansTick(){

 const p=
   staffPower(
     "repair"
   );

 if(p<=0)
   return;

 G.bugs=
   Math.max(
     0,
     G.bugs-p/20
   );

 G.stability=
   clamp(
     G.stability+
     p/120,
     0,
     100
   );

 if(
   G.stability>85 &&
   Math.random()<
   p/3000
 ){

   G.serverCapacity=
     Math.round(
       G.serverCapacity*
       1.01
     );

 }

}

/* =========================
   PREMIERA PLATFORMY
========================= */

function canLaunch(){

 return (

   G.staff.some(
     s=>
       s.role===
       "Programista"
   )

   &&

   G.devPoints>=60

   &&

   G.stability>=60

 );

}

function launch(){

 if(G.launched)
   return;

 if(!canLaunch()){

   alert(
     "Potrzebujesz programisty, 60 pkt developmentu i minimum 60% stabilności."
   );

   return;

 }

 G.launched=true;

 G.version="1.0";

 G.reputation+=10;

 addDecision(
   "Platforma wystartowała",
   "Serwis jest publiczny. Od teraz mogą pojawiać się pierwsi użytkownicy i twórcy."
 );

 render();

}

/* =========================
   NOWY SERWER
========================= */

function buyServer(){

 if(G.money<50000){

   alert(
     "Za mało pieniędzy."
   );

   return;

 }

 cash(
   -50000,
   "Infrastruktura",
   "Nowy serwer"
 );

 G.servers++;

 render();

}

/* =========================
   PROJEKTY
========================= */

function createProject(type){

 const defs={

   "Player 2.0":[
     120,
     45000,
     8
   ],

   "Aplikacja mobilna":[
     180,
     70000,
     12
   ],

   "Live":[
     250,
     110000,
     18
   ],

   "Short videos":[
     220,
     90000,
     15
   ],

   "Premium":[
     160,
     60000,
     10
   ],

   "Nowy interfejs":[
     100,
     35000,
     7
   ]

 };

 const d=
   defs[type];

 if(!d)
   return;

 if(G.money<d[1]){

   alert(
     "Za mało pieniędzy."
   );

   return;

 }

 cash(
   -d[1],
   "Projekt",
   type
 );

 G.projects.push({

   id:G.nextId++,

   name:type,

   need:d[0],

   progress:0,

   rep:d[2],

   done:false

 });

 render();

}

/* =========================
   AUTOMATYCZNE PROJEKTY
========================= */

function projectTick(){

 const p=
   staffPower(
     "dev"
   );

 G.devPoints+=
   p/15;

 const active=
   G.projects.find(
     x=>!x.done
   );

 if(
   !active ||
   p<=0
 )
 return;

 active.progress+=
   p/10;

 if(
   active.progress>=
   active.need
 ){

   active.progress=
     active.need;

   active.done=true;

   G.reputation+=
     active.rep;

   G.version=
     (
       (parseFloat(G.version)||1)
       +
       0.1
     )
     +"";

   addDecision(
     "Projekt ukończony",
     `${active.name} jest gotowy do użycia.`
   );

 }

}

/* =========================
   DZIEŃ GRY
========================= */

function daily(){

 /* KANDYDACI */

 if(
   absDay()-
   G.lastCandidateDay>=7
   ||
   !G.candidates.length
 ){

   generateCandidates();

 }

 /* TECHNOLOGIE */

 if(
   absDay()-
   G.lastTechDay>=
   rnd(12,22)
   ||
   !G.technologies.length
 ){

   generateTech();

 }

 /* AUTOMATYZACJA */

 projectTick();

 researchTick();

 techniciansTick();

 /* PENSJE */

 const salaries=
   G.staff.reduce(
     (a,s)=>
       a+
       s.salary/30,
     0
   );

 /* INFRA */

 const infra=
   G.servers*45+
   G.storage*2;

 let revenue=0;

 /* DZIAŁAJĄCA PLATFORMA */

 if(G.launched){

   let growth=
     .004+
     G.reputation/15000+
     G.techLevel*.00025+
     G.staff.filter(
       s=>
         s.role===
         "Marketing"
     ).length*.0004;

   if(load()>90)
     growth-=.015;

   if(G.bugs>20)
     growth-=.01;

   const newUsers=
     Math.max(
       -G.users*.03,
       Math.max(
         1,
         G.users*growth
         ||
         rnd(1,5)
       )
     );

   G.users=
     Math.max(
       0,
       G.users+
       newUsers
     );

   /* TWÓRCY */

   G.creators+=
     Math.max(
       .02,
       newUsers/800
     );

   /* FILMY */

   G.videos+=
     Math.max(
       .1,
       G.creators*.008
     );

   /* PREMIUM */

   G.premiumUsers+=
     (
       G.users*.025-
       G.premiumUsers
     )
     *.015;

   /* PRZYCHÓD */

   revenue=
     G.users*.03+
     G.premiumUsers*
     G.premiumPrice/30;

   /* LOSOWE BUGI */

   if(
     Math.random()<.06
   ){

     G.bugs+=
       rnd(1,4);

   }

   /* ALERT SERWERÓW */

   if(load()>85){

     addDecision(
       "Wysokie obciążenie serwerów",
       `Obciążenie: ${load().toFixed(0)}%. Rozbuduj infrastrukturę lub opracuj lepszą technologię.`
     );

   }

   /* ALERT BUGÓW */

   if(G.bugs>15){

     addDecision(
       "Dużo błędów",
       `W serwisie jest ${Math.round(G.bugs)} punktów błędów. Technicy i programiści naprawiają je automatycznie.`
     );

   }

 }

 /* DZIENNY WYNIK */

 cash(

   revenue-
   salaries-
   infra,

   "Dzienny wynik",

   "Przychody - pensje - infrastruktura"

 );

 /* DOŚWIADCZENIE */

 G.staff.forEach(
   s=>
     s.experience+=.01
 );

 /* DATA */

 G.day++;

 if(G.day>30){

   G.day=1;

   G.month++;

   if(G.month>12){

     G.month=1;

     G.year++;

   }

 }

}

========================= */

function cycleSpeed(){

   : G.speed===2
   ? 5
   : 1;

 render();

}

/* =========================
   PĘTLA GRY
========================= */

setInterval(
 ()=>{

   for(
     let i=0;
     i<G.speed;
     i++
   ){

     daily();

   }

   saveGame();

   render();

 },
 1200
);
