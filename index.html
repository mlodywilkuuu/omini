<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Empire - Media Conglomerate Simulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');

        :root {
            --bg-primary: #030712;
            --glass-bg: rgba(17, 24, 39, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --accent-primary: #6366f1;
            --accent-secondary: #ec4899;
            --accent-success: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animowane tło z płynnymi gradientami */
        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.5;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            animation: floatBlob 20s infinite alternate ease-in-out;
        }

        .blob-1 {
            width: 500px;
            height: 500px;
            background: #4f46e5;
            top: -100px;
            left: -100px;
        }

        .blob-2 {
            width: 600px;
            height: 600px;
            background: #db2777;
            bottom: -200px;
            right: -100px;
            animation-delay: -5s;
        }

        .blob-3 {
            width: 400px;
            height: 400px;
            background: #0ea5e9;
            top: 40%;
            left: 30%;
            animation-delay: -10s;
        }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 40px) scale(1.1); }
            100% { transform: translate(-40px, 80px) scale(0.95); }
        }

        /* Efekt szkła (Glassmorphism) */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Górny panel statystyk */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 32px;
        }

        .logo-area h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-area p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .stats-grid {
            display: flex;
            gap: 24px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .stat-value.money { color: #34d399; }

        /* Główny układ gry */
        .game-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .game-layout {
                grid-template-columns: 1fr;
            }
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .panel-content {
            padding: 28px;
        }

        /* Sekcja produkcji filmowych */
        .production-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }

        input, select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            padding: 12px 16px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        select option {
            background: #111827;
        }

        /* Przyciski z efektem szkła i połysku */
        .btn {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.8), rgba(79, 70, 229, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.6);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Sekcja rynku M&A (Przejęcia) */
        .acquisition-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .acquisition-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--glass-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .acquisition-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--glass-highlight);
            transform: scale(1.01);
        }

        .acq-info h4 {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .acq-info p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .btn-buy {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.8), rgba(5, 150, 105, 0.9));
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3);
            padding: 10px 16px;
            font-size: 13px;
        }

        .btn-buy:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
            border-color: transparent;
            transform: none;
        }

        /* Dziennik wydarzeń / logi */
        .log-panel {
            grid-column: 1 / -1;
            padding: 24px;
        }

        .log-content {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px;
            height: 140px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            color: #d1d5db;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .log-item {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Pasek przewijania */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- Animowane tło gradientowe -->
    <div class="animated-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="container">
        <!-- Górny panel (Dashboard) -->
        <header class="glass-panel">
            <div class="logo-area">
                <h1>🎬 STUDIO EMPIRE</h1>
                <p>Global Media Conglomerate</p>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">Budżet</span>
                    <span class="stat-value money" id="stat-money">$50.0M</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Udział w Rynku</span>
                    <span class="stat-value" id="stat-market">4.2%</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Przejęte Firmy</span>
                    <span class="stat-value" id="stat-companies">0 / 4</span>
                </div>
            </div>
        </header>

        <!-- Główny grid gry -->
        <div class="game-layout">
            <!-- Lewa strona: Produkcja projektów -->
            <div class="glass-panel panel-content">
                <div class="section-title">🚀 Nowa Produkcja</div>
                <div class="production-box">
                    <div class="input-group">
                        <label>Tytuł Projektu</label>
                        <input type="text" id="project-title" value="Kosmiczna Odyseja 3D">
                    </div>
                    <div class="input-group">
                        <label>Format Medialny</label>
                        <select id="project-type">
                            <option value="movie">Film Kinowy (Wysokie ryzyko / Duży zysk)</option>
                            <option value="series">Serial Streamingowy (Stały pasywny dochód)</option>
                            <option value="animation">Animacja Rodzinna (Bonus do Merchandise)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Budżet Produkcyjny ($)</label>
                        <select id="project-budget">
                            <option value="10">Niski ($10M)</option>
                            <option value="25" selected>Średni ($25M)</option>
                            <option value="60">Blockbuster ($60M)</option>
                        </select>
                    </div>
                    <button class="btn" onclick="startProduction()">Rozpocznij Produkcję</button>
                </div>
            </div>

            <!-- Prawa strona: Giełda i M&A (Przejęcia) -->
            <div class="glass-panel panel-content">
                <div class="section-title">🏢 Fuzje i Przejęcia (M&A)</div>
                <div class="acquisition-list" id="acquisition-list">
                    <!-- Generowane dynamicznie przez JS -->
                </div>
            </div>

            <!-- Dziennik zdarzeń na dole -->
            <div class="glass-panel log-panel">
                <div class="section-title" style="margin-bottom: 10px;">📋 Dziennik Korporacyjny</div>
                <div class="log-content" id="game-logs">
                    <div class="log-item">[System] Witaj w świecie wielkiego Hollywood! Zbuduj swoje imperium medialne i przejmij konkurencję.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Stan gry
        let gameState = {
            money: 50.0, // w milionach $
            marketShare: 4.2, // w %
            acquiredCount: 0
        };

        // Lista firm do przejęcia
        let targetCompanies = [
            { id: 1, name: "PixelCraft Animation", type: "Studio Animacji", cost: 35.0, marketBoost: 2.5, acquired: false },
            { id: 2, name: "CineSound VFX Labs", type: "Dział Efektów Specjalnych", cost: 60.0, marketBoost: 4.0, acquired: false },
            { id: 3, name: "StreamWave TV Network", type: "Platforma Streamingowa", cost: 120.0, marketBoost: 8.5, acquired: false },
            { id: 4, name: "Global Pictures 20th", type: "Klasyczne Studio Filmowe", cost: 250.0, marketBoost: 15.0, acquired: false }
        ];

        function updateUI() {
            document.getElementById('stat-money').innerText = `$${gameState.money.toFixed(1)}M`;
            document.getElementById('stat-market').innerText = `${gameState.marketShare.toFixed(1)}%`;
            document.getElementById('stat-companies').innerText = `${gameState.acquiredCount} / ${targetCompanies.length}`;
            renderAcquisitions();
        }

        function addLog(message) {
            const logContainer = document.getElementById('game-logs');
            const logItem = document.createElement('div');
            logItem.className = 'log-item';
            logItem.innerText = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContainer.prepend(logItem);
        }

        function renderAcquisitions() {
            const listEl = document.getElementById('acquisition-list');
            listEl.innerHTML = '';

            targetCompanies.forEach(comp => {
                const card = document.createElement('div');
                card.className = 'acquisition-card';
                
                card.innerHTML = `
                    <div class="acq-info">
                        <h4>${comp.name}</h4>
                        <p>${comp.type} • Koszt: $${comp.cost}M • Udział: +${comp.marketBoost}%</p>
                    </div>
                    <button class="btn btn-buy" ${comp.acquired || gameState.money < comp.cost ? 'disabled' : ''} onclick="buyCompany(${comp.id})">
                        ${comp.acquired ? 'Przejęto' : 'Kup Spółkę'}
                    </button>
                `;
                listEl.appendChild(card);
            });
        }

        function startProduction() {
            const title = document.getElementById('project-title').value || "Nieznany Projekt";
            const type = document.getElementById('project-type').value;
            const cost = parseFloat(document.getElementById('project-budget').value);

            if (gameState.money < cost) {
                addLog(`Błąd: Zbyt mały budżet na produkcję "${title}"! Potrzebujesz $${cost}M.`);
                return;
            }

            gameState.money -= cost;
            updateUI();
            addLog(`Rozpoczęto produkcję projektu: "${title}" (Budżet: $${cost}M). Czekamy na wyniki box office...`);

            // Symulacja premiery po 4 sekundach
            setTimeout(() => {
                let multiplier = 0.8 + Math.random() * 1.2; // losowy zwrot z inwestycji
                if (type === 'animation') multiplier += 0.3; // animacje lepiej się zwracają z gadżetów
                
                let revenue = cost * multiplier;
                let profit = revenue - cost;
                gameState.money += revenue;
                
                // Zwiększanie udziałów w rynku za udane projekty
                let marketGain = (cost / 50);
                gameState.marketShare += marketGain;

                updateUI();
                addLog(`Premiera "${title}"! Przychód wyniósł $${revenue.toFixed(1)}M (Zysk: $${profit.toFixed(1)}M). Udział w rynku wzrósł o +${marketGain.toFixed(1)}%.`);
            }, 4000);
        }

        function buyCompany(id) {
            const company = targetCompanies.find(c => c.id === id);
            if (!company || company.acquired || gameState.money < company.cost) return;

            gameState.money -= company.cost;
            gameState.marketShare += company.marketBoost;
            gameState.acquiredCount++;
            company.acquired = true;

            updateUI();
            addLog(`🎉 Sukces fuzji! Przejęto firmę/dział: ${company.name}. Twój udział w rynku skoczył o +${company.marketBoost}%!`);
        }

        // Inicjalizacja startowa
        updateUI();
    </script>
</body>
</html>
