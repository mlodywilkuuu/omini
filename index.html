<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medieval Empire</title><style>*{box-sizing:border-box}body{margin:0;background:#17231f;color:#f3e7c9;font:15px Georgia}header{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:13px;background:#293a30;border-bottom:2px solid #bda069}h1{color:#efce83;font-size:24px;margin:0 16px 0 0}button,select{padding:9px;background:#395542;color:#f9eaca;border:1px solid #9b9d70;border-radius:5px;cursor:pointer}button:hover{background:#527358}.stats{padding:7px;background:#14271d;border-radius:5px}section{display:grid;grid-template-columns:180px 1fr 300px;min-height:85vh}nav,aside{background:#202e26;padding:12px}nav button{width:100%;text-align:left;margin-bottom:7px}.trade-note{color:#e7d09b;font-size:13px}.positive{color:#a9e4a3}.negative{color:#ffaaa0}main{padding:15px;min-width:0}h2,h3{color:#ebc984}canvas{width:100%;height:550px;background:#294c57;border:3px solid #927f52;border-radius:8px;cursor:pointer}.card{padding:12px;background:#2c4033;border:1px solid #607255;border-radius:7px;margin:10px 0}.muted{color:#c1c6ad;font-size:13px}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}.scroll{max-height:450px;overflow:auto}select{max-width:100%}@media(max-width:900px){section{grid-template-columns:125px 1fr}aside{grid-column:1/-1}canvas{height:400px}}@media(max-width:600px){section{display:block}nav{display:flex;overflow:auto}nav button{min-width:120px}canvas{height:340px}}</style><header><h1>⚜ Medieval Empire</h1><span class="stats" id="date"></span><span class="stats" id="gold"></span><span class="stats" id="food"></span><span class="stats" id="wood"></span><span class="stats" id="stone"></span><span class="stats" id="land"></span><button onclick="paused=!paused;this.textContent=paused?'▶ Wznów':'⏸ Pauza'">⏸ Pauza</button><select id="speed"><option value="1">1×</option><option value="3">3×</option><option value="6">6×</option></select></header><section><nav><button onclick="tab('map')">🗺 Mapa</button><button onclick="tab('cities')">🏘 Miasta</button><button onclick="tab('army')">⚔ Armie</button><button onclick="tab('court')">👑 Dwór</button><button onclick="tab('tech')">📜 Technologie</button><button onclick="tab('dip')">🤝 Dyplomacja</button><button onclick="tab('trade')">⚖ Handel</button><button onclick="tab('history')">📖 Kronika</button><hr><button onclick="save()">💾 Zapisz</button><button onclick="load()">📂 Wczytaj</button><button onclick="if(confirm('Nowa gra?')){G=newGame();render()}">🔄 Nowa gra</button></nav><main><div id="map"><h2>Mapa królestw</h2><canvas id="canvas"></canvas><p class="muted">Kliknij prowincję. Zielone obszary należą do Ciebie. Gra przesuwa się automatycznie co 3 sekundy.</p></div><div id="cities" class="hidden"></div><div id="army" class="hidden"></div><div id="court" class="hidden"></div><div id="tech" class="hidden"></div><div id="dip" class="hidden"></div><div id="trade" class="hidden"></div><div id="history" class="hidden"></div></main><aside><h2>Wybrana prowincja</h2><div id="info"></div><h3>Bilans miesięczny</h3><div id="balance"></div><h3>Wydarzenia</h3><div id="events" class="scroll"></div></aside></section><script>
'use strict';const $=x=>document.getElementById(x),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const cityNames=['Kraków','Sandomierz','Lublin','Warszawa','Płock','Gniezno','Poznań','Wrocław','Legnica','Gdańsk','Toruń','Kalisz','Opole','Szczecin','Elbląg','Olsztyn','Brześć','Wilno','Grodno','Lwów','Przemyśl','Halicz','Łuck','Chełm','Bydgoszcz','Kielce','Radom','Racibórz','Kołobrzeg','Białystok','Kowno','Rzeszów','Tarnów','Piotrków','Czersk','Malbork'];
const nations=[['Korona','#78b07c','Bolesław I'],['Księstwo Zachodu','#cf9770','Henryk II'],['Królestwo Północy','#7db5c8','Eryk I'],['Księstwo Wschodu','#d5bd77','Władysław I'],['Marchia Południa','#b293cf','Otton I']];
const types={farm:['🌾 Folwark',{gold:130,wood:30}],wood:['🪵 Tartak',{gold:150,wood:20}],stone:['⛏ Kamieniołom',{gold:180,wood:35}],market:['🏪 Targ',{gold:320,wood:40,stone:20}],walls:['🏰 Mury',{gold:380,stone:80}],school:['📚 Skryptorium',{gold:450,wood:35,stone:25}],barracks:['🛡 Koszary',{gold:260,wood:45,stone:25}]};
const technologies=[['Pług żelazny',100,'+20% żywności'],['Trójpolówka',180,'+20% żywności'],['Gildie',220,'+20% podatków'],['Kamienne fortyfikacje',200,'+20% obrony'],['Stal hartowana',260,'+20% siły armii'],['Kusze',320,'+15% siły armii'],['Medycyna klasztorna',280,'+50% wzrostu ludności'],['Architektura gotycka',360,'-10% kosztów budowy'],['Machiny oblężnicze',420,'+25% ataku'],['Żegluga',390,'+15% podatków']];
let G,chosen=0,paused=false,current='map';
function newGame(){return {year:1200,month:1,gold:2500,food:900,wood:350,stone:180,science:0,known:[],rel:[0,-10,-20,5,0],alliances:[],tradeRoutes:[],embargoes:[],tradeHistory:[],king:{name:'Bolesław I',age:30,heir:'Mieszko',heirAge:8},vassals:[{name:'Wojewoda Dobiesław',loyal:78},{name:'Kasztelan Jarosław',loyal:67}],log:['Rok 1200: Powstaje Twoje królestwo.'],tick:0,provinces:cityNames.map((name,id)=>({id,name,owner:id<5?0:id<12?1:id<18?2:id<25?3:4,pop:R(700,1800),army:R(30,85),loyal:R(55,95),fort:R(10,20),b:{farm:1,wood:1,stone:0,market:0,walls:0,school:0,barracks:0}}))}}
function owned(){return G.provinces.filter(p=>p.owner===0)}function news(t){G.log.unshift(`${G.month}/${G.year}: ${t}`);G.log=G.log.slice(0,120)}
function afford(cost){return Object.entries(cost).every(([k,v])=>G[k]>=v)}function pay(cost){if(!afford(cost)){news('Brakuje surowców.');render();return false}for(let k in cost)G[k]-=cost[k];return true}function price(c){return Object.entries(c).map(([k,v])=>v+' '+({gold:'zł',wood:'drew.',stone:'kam.',food:'żyw.'}[k])).join(' • ')}
function economy(){let x={gold:0,food:0,wood:0,stone:0,science:0};owned().forEach(p=>{x.gold+=Math.floor(p.pop/85)+p.b.market*65-Math.floor(p.army*.3);x.food+=p.b.farm*25-Math.ceil(p.pop/190);x.wood+=p.b.wood*13;x.stone+=p.b.stone*10;x.science+=p.b.school*5});if(G.known.includes('Pług żelazny'))x.food=Math.floor(x.food*1.2);if(G.known.includes('Trójpolówka'))x.food=Math.floor(x.food*1.2);if(G.known.includes('Gildie'))x.gold=Math.floor(x.gold*1.2);return x}
function build(id,key){let p=G.provinces[id];if(p.owner!==0)return;let cost={...types[key][1]};if(G.known.includes('Architektura gotycka'))for(let k in cost)cost[k]=Math.floor(cost[k]*.9);if(pay(cost)){p.b[key]++;news('Zbudowano '+types[key][0]+' w '+p.name);render()}}
function recruit(id){let p=G.provinces[id];if(p.owner!==0)return;if(pay({gold:p.b.barracks?105:130,food:40})){p.army+=30;news('Rekrutacja 30 wojowników w '+p.name);render()}}
function adjacent(a,b){return Math.abs(a%6-b%6)+Math.abs(Math.floor(a/6)-Math.floor(b/6))===1}
function march(from,to){from=+from;to=+to;let a=G.provinces[from],b=G.provinces[to];if(!a||!b||a.owner!==0||a.army<15||!adjacent(from,to))return;let n=Math.floor(a.army*.7);a.army-=n;if(b.owner===0){b.army+=n;news('Przesunięto '+n+' wojowników do '+b.name)}else{let attack=n*(G.known.includes('Stal hartowana')?1.2:1)*(G.known.includes('Kusze')?1.15:1)*(G.known.includes('Machiny oblężnicze')?1.25:1)*R(80,120)/100;let defense=b.army*(1+b.fort/100+b.b.walls*.25)*(G.known.includes('Kamienne fortyfikacje')?1.2:1)*R(80,120)/100;if(attack>defense){b.owner=0;b.army=Math.max(8,Math.floor(n*.5));b.loyal=40;news('⚔ Zwycięstwo! Zdobyto '+b.name)}else{b.army=Math.max(8,Math.floor(b.army*.65));news('⚔ Porażka pod '+b.name)}}render()}
function discover(i){let t=technologies[i];if(G.known.includes(t[0]))return;if(G.science<t[1]){news('Za mało punktów nauki');render();return}G.science-=t[1];G.known.push(t[0]);news('📜 Odkryto '+t[0]);render()}
function diplomacy(i,act){if(act==='gift'){if(!pay({gold:250}))return;G.rel[i]=Math.min(100,G.rel[i]+25);news('Wysłano dar do '+nations[i][0])}if(act==='ally'){if(G.rel[i]<35)news('Wymagane relacje +35');else{if(!G.alliances.includes(i))G.alliances.push(i);news('Zawarto sojusz z '+nations[i][0])}}if(act==='vassal'){if(G.rel[i]<65||!pay({gold:450}))news('Wymagane relacje +65 i 450 zł');else{let p=G.provinces.find(p=>p.owner===i);if(p){p.owner=0;p.loyal=60;news(p.name+' dołącza do Korony')}}}render()}

const tradeGoods={
 food:{label:'🌾 Żywność',base:3},
 wood:{label:'🪵 Drewno',base:5},
 stone:{label:'🪨 Kamień',base:7}
};
function tradeState(){
 if(!Array.isArray(G.tradeRoutes))G.tradeRoutes=[];
 if(!Array.isArray(G.embargoes))G.embargoes=[];
 if(!Array.isArray(G.tradeHistory))G.tradeHistory=[];
}
function isEmbargoed(i){tradeState();return G.embargoes.includes(i)}
function changeEmbargo(i){
 tradeState();
 if(i<1||i>=nations.length)return;
 if(isEmbargoed(i)){
  G.embargoes=G.embargoes.filter(x=>x!==i);
  G.rel[i]=Math.min(100,G.rel[i]+3);
  news('Zniesiono embargo wobec '+nations[i][0]+'.');
 }else{
  G.embargoes.push(i);
  G.tradeRoutes=G.tradeRoutes.filter(x=>x.partner!==i);
  G.rel[i]=Math.max(-100,G.rel[i]-20);
  news('⛔ Nałożono embargo na '+nations[i][0]+'. Szlaki handlowe zamknięto.');
 }
 render();
}
function tradePrice(i,good,mode){
 let factor=1+(i-2)*.08;
 return Math.max(1,Math.round(tradeGoods[good].base*factor*(mode==='buy'?1.3:.85)));
}
function createTrade(i,good,mode,qty){
 tradeState();i=Number(i);qty=Number(qty);
 if(!Number.isInteger(i)||i<1||i>=nations.length||!tradeGoods[good]||!['buy','sell'].includes(mode)||!Number.isInteger(qty)||qty<5||qty>100)return;
 if(isEmbargoed(i)){news('Nie możesz handlować z krajem objętym embargiem.');render();return}
 if(G.rel[i]<-45){news('Zbyt złe relacje na zawarcie umowy handlowej.');render();return}
 if(G.tradeRoutes.some(x=>x.partner===i&&x.good===good&&x.mode===mode)){news('Taki szlak już działa.');render();return}
 if(G.tradeRoutes.length>=12){news('Osiągnięto limit 12 szlaków handlowych.');render();return}
 let setup=75;
 if(!pay({gold:setup}))return;
 G.tradeRoutes.push({partner:i,good,mode,qty,months:0});
 G.rel[i]=Math.min(100,G.rel[i]+4);
 news('⚖ Otwarto szlak: '+(mode==='buy'?'import':'eksport')+' '+tradeGoods[good].label+' ×'+qty+' z '+nations[i][0]+'. Relacje +4.');
 render();
}
function closeTrade(index){
 tradeState();let route=G.tradeRoutes[index];if(!route)return;
 news('Zamknięto szlak handlowy z '+nations[route.partner][0]+'.');
 G.tradeRoutes.splice(index,1);render();
}
function processTrade(){
 tradeState();
 for(const route of G.tradeRoutes){
  if(isEmbargoed(route.partner))continue;
  const price=tradePrice(route.partner,route.good,route.mode);
  if(route.mode==='buy'){
   const qty=Math.min(route.qty,Math.floor(Math.max(0,G.gold)/price));
   if(qty>0){G.gold-=qty*price;G[route.good]+=qty}
   if(qty<route.qty&&G.tick%3===0)news('Kupcy nie mieli dość złota na pełny import z '+nations[route.partner][0]+'.');
  }else{
   const qty=Math.min(route.qty,Math.max(0,Math.floor(G[route.good])));
   if(qty>0){G[route.good]-=qty;G.gold+=qty*price}
   if(qty<route.qty&&G.tick%3===0)news('Brak pełnego zapasu towarów na eksport do '+nations[route.partner][0]+'.');
  }
  route.months++;
  // Długotrwały, działający handel powoli wzmacnia relacje.
  if(route.months%3===0){
   G.rel[route.partner]=Math.min(100,G.rel[route.partner]+1);
   if(route.months%12===0)news('🤝 Handel z '+nations[route.partner][0]+' umocnił relacje.');
  }
 }
}
function tradeRender(){
 tradeState();
 const options=nations.slice(1).map((n,j)=>`<option value="${j+1}">${n[0]} (relacje ${G.rel[j+1]})${isEmbargoed(j+1)?' — EMBARGO':''}</option>`).join('');
 $('trade').innerHTML=`<h2>⚖ Handel międzynarodowy</h2>
 <p class="trade-note">Szlaki działają co miesiąc. Otwarcie szlaku poprawia relacje o 4, a każde 3 miesiące współpracy o kolejne 1. Embargo zrywa handel i pogarsza relacje o 20.</p>
 <div class="card"><h3>Nowa umowa handlowa</h3>
 <div class="row"><label>Królestwo<br><select id="tradePartner">${options}</select></label>
 <label>Towar<br><select id="tradeGood">${Object.entries(tradeGoods).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select></label>
 <label>Kierunek<br><select id="tradeMode"><option value="sell">Eksport — sprzedawaj</option><option value="buy">Import — kupuj</option></select></label>
 <label>Ilość miesięcznie<br><select id="tradeQty"><option value="10">10</option><option value="25" selected>25</option><option value="50">50</option><option value="100">100</option></select></label></div>
 <p class="muted">Otwarcie szlaku: 75 zł. Ceny zależą od królestwa i rodzaju transakcji.</p>
 <button onclick="createTrade(+$('tradePartner').value,$('tradeGood').value,$('tradeMode').value,+$('tradeQty').value)">Zawrzyj umowę</button></div>
 <h3>Aktywne szlaki (${G.tradeRoutes.length}/12)</h3>
 ${G.tradeRoutes.length?G.tradeRoutes.map((r,i)=>`<div class="card">${r.mode==='buy'?'📥 Import':'📤 Eksport'} ${tradeGoods[r.good].label} ×${r.qty} / miesiąc<br>${nations[r.partner][0]} • ${tradePrice(r.partner,r.good,r.mode)} zł / szt. • ${r.months} mies. współpracy<br><button onclick="closeTrade(${i})">Zamknij szlak</button></div>`).join(''):'<p class="muted">Nie masz jeszcze aktywnych umów.</p>'}
 <h3>Embarga i polityka handlowa</h3>
 ${nations.slice(1).map((n,j)=>{let i=j+1;return `<div class="card"><b>${n[0]}</b> — relacje ${G.rel[i]} ${isEmbargoed(i)?'<span class="negative">⛔ EMBARGO</span>':'<span class="positive">✓ Handel dozwolony</span>'}<br><button onclick="changeEmbargo(${i})">${isEmbargoed(i)?'Znieś embargo':'Nałóż embargo'}</button></div>`}).join('')}`;
}
function nextMonth(){G.month++;if(G.month>12){G.month=1;G.year++;G.king.age++;G.king.heirAge++}G.tick++;let x=economy();for(let k in x)G[k]+=x[k];processTrade();if(G.food<0){G.food=0;owned().forEach(p=>{p.pop=Math.floor(p.pop*.98);p.loyal=Math.max(0,p.loyal-5)});news('⚠ Głód w królestwie!')}G.provinces.forEach(p=>{if(p.owner===0){p.pop+=Math.max(1,Math.floor(p.pop*(G.known.includes('Medycyna klasztorna')?.005:.003)));p.loyal=Math.min(100,p.loyal+1);if(p.loyal<15&&Math.random()<.05){p.owner=R(1,4);news('Bunt w '+p.name)}}else if(Math.random()<.08)p.army+=R(1,5)});if(G.tick%6===0){let p=G.provinces.filter(p=>p.owner!==0);if(p.length){let q=p[R(0,p.length-1)];q.b.farm++;news(nations[q.owner][0]+' rozbudowuje '+q.name)}}if(G.tick%12===0){G.rel=G.rel.map((x,i)=>i?Math.max(-100,Math.min(100,x+R(-6,6))):x);G.vassals.forEach(v=>v.loyal=Math.max(0,Math.min(100,v.loyal+R(-5,5))));save(false)}if(G.king.age>65&&Math.random()<.06){G.king={name:G.king.heir+' I',age:Math.max(18,G.king.heirAge),heir:'Kazimierz',heirAge:1};news('👑 Nowy władca: '+G.king.name)}render()}
function draw(){let c=$('canvas'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);let ctx=c.getContext('2d');ctx.scale(d,d);let w=r.width/6,h=r.height/6;G.provinces.forEach(p=>{let x=p.id%6*w,y=Math.floor(p.id/6)*h;ctx.fillStyle=nations[p.owner][1];ctx.fillRect(x+2,y+2,w-4,h-4);ctx.strokeStyle=p.id===chosen?'#fff0a0':p.owner===0?'#b2f8a0':'#415149';ctx.lineWidth=p.id===chosen?5:p.owner===0?3:1;ctx.strokeRect(x+3,y+3,w-6,h-6);ctx.fillStyle='#17231e';ctx.textAlign='center';ctx.font='bold '+Math.max(10,Math.min(14,w/9))+'px Georgia';ctx.fillText(p.name,x+w/2,y+h*.46);ctx.font='12px Georgia';ctx.fillText('⚔ '+p.army,x+w/2,y+h*.7)})}
function render(){['date','gold','food','wood','stone','land'].forEach((k,i)=>$(k).textContent=[`📅 ${G.month}/${G.year}`,`🪙 ${G.gold}`,`🌾 ${G.food}`,`🪵 ${G.wood}`,`🪨 ${G.stone}`,`🏰 ${owned().length} prowincji`][i]);let p=G.provinces[chosen];$('info').innerHTML=`<div class="card"><h3>${p.name}</h3><p>${nations[p.owner][0]}<br>👥 ${p.pop} mieszkańców<br>⚔ ${p.army} wojowników<br>🛡 ${p.fort+p.b.walls*25} obrony<br>❤️ ${p.loyal}% lojalności</p>${p.owner===0?'<button onclick="tab(\'cities\')">🏗 Buduj</button> <button onclick="tab(\'army\')">⚔ Armia</button>':'<span class="muted">Możesz zdobyć tę prowincję.</span>'}</div>`;let x=economy();$('balance').innerHTML='<div class="card">'+Object.entries(x).map(([k,v])=>`${{gold:'🪙',food:'🌾',wood:'🪵',stone:'🪨',science:'📜'}[k]} ${v>=0?'+':''}${v}`).join('<br>')+'</div>';$('events').innerHTML=G.log.slice(0,10).map(v=>'<p class="muted">'+v+'</p>').join('');$('cities').innerHTML='<h2>🏘 Miasta i budowa</h2>'+owned().map(p=>`<div class="card"><h3>${p.name} — 👥 ${p.pop}</h3><p class="muted">${Object.entries(p.b).filter(v=>v[1]).map(([k,v])=>types[k][0]+' ×'+v).join(' • ')}</p><div class="row">${Object.entries(types).map(([k,v])=>`<button onclick="build(${p.id},'${k}')">${v[0]}<br><small>${price(v[1])}</small></button>`).join('')}</div></div>`).join('');$('army').innerHTML='<h2>⚔ Wojsko i podboje</h2><p>Możesz atakować tylko sąsiednie prowincje. Wysyłasz 70% garnizonu.</p>'+owned().map(p=>`<div class="card"><b>${p.name} — ${p.army} wojowników</b> <button onclick="recruit(${p.id})">+30 wojowników</button><div class="row"><select id="dest${p.id}">${G.provinces.filter(q=>adjacent(p.id,q.id)).map(q=>`<option value="${q.id}">${q.name} (${nations[q.owner][0]})</option>`).join('')}</select><button onclick="march(${p.id},+$('dest${p.id}').value)">Wyślij wojsko</button></div></div>`).join('');$('court').innerHTML=`<h2>👑 Dwór i dynastia</h2><div class="card">Władca: ${G.king.name}<br>Wiek: ${G.king.age}<br>Następca: ${G.king.heir} (${G.king.heirAge} lat)</div><h3>Wasale</h3>`+G.vassals.map(v=>`<div class="card">${v.name} — lojalność ${v.loyal}%</div>`).join('')+'<p class="muted">Dynastia i wasale rozwijają się w trakcie gry.</p>';$('tech').innerHTML=`<h2>📜 Technologie</h2><p>Punkty nauki: ${G.science}. Buduj skryptoria, aby je zdobywać.</p>`+technologies.map((t,i)=>`<div class="card"><b>${t[0]}</b> — ${t[2]}<br>Koszt: ${t[1]} <button ${G.known.includes(t[0])?'disabled':''} onclick="discover(${i})">${G.known.includes(t[0])?'✓ Odkryto':'Badaj'}</button></div>`).join('');$('dip').innerHTML='<h2>🤝 Dyplomacja</h2>'+nations.slice(1).map((n,j)=>{let i=j+1;return `<div class="card"><h3>${n[0]}</h3><p>Władca: ${n[2]} • Relacje: ${G.rel[i]} • Prowincje: ${G.provinces.filter(p=>p.owner===i).length}</p><div class="row"><button onclick="diplomacy(${i},'gift')">Dar 250 zł</button><button onclick="diplomacy(${i},'ally')">Sojusz (+35)</button><button onclick="diplomacy(${i},'vassal')">Lenno (+65)</button></div></div>`}).join('');$('history').innerHTML='<h2>📖 Kronika</h2>'+G.log.map(v=>'<div class="card">'+v+'</div>').join('');if(current==='trade')tradeRender();draw()}
function tab(id){current=id;['map','cities','army','court','tech','dip','trade','history'].forEach(x=>$(x).classList.toggle('hidden',x!==id));render()}
function save(notice=true){try{localStorage.setItem('medievalEmpireV1',JSON.stringify(G));if(notice){news('Zapisano grę');render()}}catch(e){alert('Błąd zapisu: '+e.message)}}function load(){try{let x=localStorage.getItem('medievalEmpireV1');if(!x)return alert('Brak zapisu');let y=JSON.parse(x);if(!Array.isArray(y.provinces)||!y.king)throw Error('Niepoprawny zapis');G=y;news('Wczytano grę');render()}catch(e){alert('Błąd wczytywania: '+e.message)}}
$('canvas').onclick=e=>{let r=e.currentTarget.getBoundingClientRect();chosen=Math.min(35,Math.max(0,Math.floor((e.clientY-r.top)/r.height*6)*6+Math.floor((e.clientX-r.left)/r.width*6)));render()};window.addEventListener('resize',draw);G=newGame();render();setInterval(()=>{if(!paused)for(let i=0;i<+$('speed').value;i++)nextMonth()},3000);
</script></html>
