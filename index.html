 let c=v8Company(),sub=v8Sub(),amount,txt;
 if(kind==='pause'){W.paused=!W.paused;render();return}

 if(kind==='ceo'){if(!sub)return toast('Wybierz spółkę córkę');W.managers[sub.id]??={enabled:false,strategy:'stable'};W.managers[sub.id].enabled=!W.managers[sub.id].enabled;toast(W.managers[sub.id].enabled?'Prezes aktywny':'Prezes wstrzymany')}

 if(kind==='vote'){if(!c||!own(c))return toast('Wybierz kontrolowaną restaurację');let approval=Math.min(95,Math.round(c.owned+Math.random()*20));W.votes.unshift({name:c.name,day:S.day,approval,passed:approval>50});toast(approval>50?'Uchwała przyjęta':'Uchwała odrzucona')}
 if(kind==='offer'){if(!c||c.owned===100)return toast('Wybierz firmę do przejęcia');let qty=Math.min(100-c.owned,25),cost=Math.round(qty*c.price*1.15);if(!await gameConfirm('Oferta za '+qty+'% udziałów: '+fmt(cost)+'?'))return;if(Math.random()<.65){if(!spend(cost,'Oferta przejęcia'))return;let left=qty;for(const h of c.holders){let n=Math.min(left,Math.max(0,h.shares));h.shares-=n;left-=n;if(!left)break}c.owned+=qty;normalize(c);if(c.owned===100)c.ai=false;toast('Oferta zaakceptowana')}else toast('Akcjonariusze odrzucili ofertę')}
 if(kind==='city'){if(!map)return;let p=map.getCenter(),near=S.companies.filter(x=>{let a=point(x);return Math.abs(a[0]-p.lat)<.15&&Math.abs(a[1]-p.lng)<.2});gameAlert('Analiza okolicy\nRestauracje: '+near.length+'\nSzacowany popyt: '+Math.max(15,100-near.length*6)+'/100\nZoom: '+map.getZoom())}
 if(kind==='location'){if(!c)return toast('Wybierz restaurację');let p=point(c),near=S.companies.filter(x=>x.id!==c.id&&Math.abs(point(x)[0]-p[0])<.08&&Math.abs(point(x)[1]-p[1])<.1).length;gameAlert('Konkurencja w pobliżu: '+near+'\nWskaźnik lokalizacji: '+Math.max(15,100-near*8)+'/100')}
 if(kind==='menu'){if(!c||!own(c))return toast('Wybierz kontrolowaną restaurację');let price=safeNum(await gamePrompt('Średnia cena zestawu ($)','12'));if(price<3||price>100)return toast('Cena od 3 do 100 $');W.menus[c.id]=price;c.priceFactor=Math.max(.65,Math.min(1.6,price/12));toast('Zapisano menu')}

 if(kind==='hours'){if(!c||!own(c))return toast('Wybierz restaurację');W.hours[c.id]=W.hours[c.id]==='24h'?'8–22':'24h';toast('Godziny: '+W.hours[c.id])}
 if(kind==='payments'){if(!c||!own(c))return toast('Wybierz restaurację');W.payments[c.id]=!W.payments[c.id];toast('Płatności mobilne: '+(W.payments[c.id]?'tak':'nie'))}
 if(kind==='premium'){if(!c||!own(c))return toast('Wybierz restaurację');if(!W.premium[c.id]&&!spend(30000,'Lokal premium'))return;W.premium[c.id]=!W.premium[c.id];toast('Tryb premium zmieniony')}
 if(kind==='online'){if(!c||!own(c))return toast('Wybierz restaurację');if(!W.online[c.id]&&!spend(5000,'Zamówienia online'))return;W.online[c.id]=!W.online[c.id];toast('Zamówienia online zmienione')}

 if(kind==='rivals'){if(S.companies.length>=400)return toast('Limit firm');let b=company();normalize(b);S.companies.push(b);W.globalRivals++;toast('Konkurencja otworzyła nową firmę')}

}

<div id="ffe-modal" role="dialog" aria-modal="true" aria-label="Tworzenie spółki córki"></div>
<script>
/* UI extension. Preserve existing save schema and old tabs. */
const nav=document.getElementById('tabs');
document.querySelector('main').before(nav);
if(!tabs.includes('Mapa'))tabs.unshift('Mapa');
S.tab=S.tab||'Mapa';
S.marketOffers??=[];
S.marketSerial??=0;
function renderFullLayout(){
 document.body.classList.toggle('view-map',S.tab==='Mapa');
 const nav=document.getElementById('tabs');
 nav.innerHTML=tabs.map(t=>'<button class="'+(S.tab===t?'active':'')+'" onclick="setTab(\''+t+'\')">'+(t==='Mapa'?'🗺️ ':'')+esc(t)+'</button>').join('');
 
}
const renderBeforeFull=render;
render=function(){renderBeforeFull();renderFullLayout();if(S.tab==='Holding')document.getElementById('content').innerHTML=viewHoldingModern();if(S.tab==='Kontrakty')document.getElementById('content').innerHTML=viewMarketOffers()};
const setTabBeforeFull=setTab;
setTab=function(t){const prev=S.tab;S.tab=t;render();if(t==='Mapa'&&prev!=='Mapa'&&map){requestAnimationFrame(()=>{map.invalidateSize({pan:false});setTimeout(()=>map.invalidateSize({pan:false}),250)})}};
function openSubWizard(id){
 const old=id?S.subs.find(x=>x.id===id):null;
 const modal=document.getElementById('ffe-modal');
 modal.innerHTML='<form class="wizard" id="sub-form"><h2>🏢 '+(old?'Edytuj spółkę córkę':'Utwórz spółkę córkę')+'</h2><p class="muted">Wybierz nazwę i wszystkie kraje, w których spółka może prowadzić działalność.</p><label for="sub-name">Nazwa spółki</label><input id="sub-name" required maxlength="45" placeholder="np. Empire Europe" value="'+esc(old?.name||'')+'"><label>Kraje działalności (możesz wybrać wiele)</label><input type="search" id="sub-country-search" placeholder="Szukaj kraju..." oninput="filterSubCountries(this.value)"><div class="country-choices">'+COUNTRIES.map(c=>'<label><input type="checkbox" name="countries" value="'+esc(c)+'" '+(old?.countries?.includes(c)?'checked':'')+'>'+esc(c)+'</label>').join('')+'</div><div class="wizard-actions"><button type="button" onclick="closeSubWizard()">Anuluj</button><button type="submit">'+(old?'Zapisz zmiany':'Utwórz spółkę')+'</button></div></form>';
 modal.classList.add('show');
 document.getElementById('sub-form').onsubmit=e=>{
  e.preventDefault();const name=document.getElementById('sub-name').value.trim();
  const countries=[...modal.querySelectorAll('input[name="countries"]:checked')].map(x=>x.value);
  if(!name||!countries.length){toast('Wybierz nazwę i przynajmniej jeden kraj');return}
  if(old){old.name=name;old.countries=countries}
  else S.subs.push({id:S.next++,name,countries,budget:0});
  closeSubWizard();render();localStorage.setItem(KEY,JSON.stringify(S));toast('Spółka zapisana');
 };
 document.getElementById('sub-name').focus();
}
function closeSubWizard(){document.getElementById('ffe-modal').classList.remove('show')}
document.getElementById('ffe-modal').addEventListener('click',e=>{if(e.target.id==='ffe-modal')closeSubWizard()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSubWizard()});
createSub=function(){openSubWizard()};
editCountries=function(id){openSubWizard(id)};
function viewHoldingModern(){
 return '<h2>🏢 Twoje spółki córki</h2><p class="muted">Twórz regionalne spółki, przypisuj kilka krajów, przekazuj budżety i zarządzaj restauracjami.</p><div class="row"><button onclick="openSubWizard()">✨ + Utwórz nową spółkę</button></div><div class="subcards">'+S.subs.map(x=>'<article class="subcard"><h3>🏢 '+esc(x.name)+'</h3><p>'+x.countries.map(c=>'<span class="pill">🌍 '+esc(c)+'</span>').join('')+'</p><p>💰 Kapitał: <strong>'+fmt(x.budget)+'</strong></p><p>🍔 Restauracje: '+S.companies.filter(c=>c.sub===x.id).length+'</p><div class="actions"><button onclick="openSubWizard('+x.id+')">✏️ Edytuj</button><button onclick="transfer('+x.id+')">💸 Przekaż środki</button></div></article>').join('')+'</div>'+(S.subs.length?'':'<p>Nie masz jeszcze spółek córek. Utwórz pierwszą!</p>')+'<p class="muted">Restaurację możesz przypisać do spółki po przejęciu 100% udziałów.</p>';
}
const SPORT_LABELS=['Liga piłkarska','Turniej tenisowy','Liga koszykówki','Wyścigi samochodowe','Turniej siatkówki','Liga hokejowa','Maraton miejski','Mistrzostwa e-sportowe'];
const DRINK_LABELS=['Pepsi','Coca-Cola','7UP','Sprite','Fanta','Mountain Dew','Dr Pepper','Mirinda'];
function makeMarketOffer(){
 const type=Math.random()<.55?'sport':'drink';
 const label=pick(type==='sport'?SPORT_LABELS:DRINK_LABELS);
 return {id:++S.marketSerial,type,label,cost:type==='sport'?rnd(11000,32000):rnd(5500,16000),bonus:type==='sport'?.10+.01*rnd(0,7):.06+.01*rnd(0,7),duration:rnd(20,70),expires:S.day+rnd(9,22)};
}
function refillMarket(){S.marketOffers=S.marketOffers.filter(x=>x.expires>S.day);while(S.marketOffers.length<8)S.marketOffers.push(makeMarketOffer())}
function acceptMarketOffer(id){
 const o=S.marketOffers.find(x=>x.id===id),c=selected();
 if(!o)return toast('Oferta już wygasła');
 if(!c||c.owned<=50)return toast('Najpierw wybierz firmę z ponad 50% udziałów w zakładce Firma');
 if(!spend(o.cost,'Kontrakt '+o.label))return;
 S.contracts.push({id:S.next++,company:c.id,type:o.type,label:o.label,bonus:o.bonus,expires:S.day+o.duration});
 S.marketOffers=S.marketOffers.filter(x=>x.id!==id);refillMarket();render();toast('Podpisano kontrakt: '+o.label);
}
function viewMarketOffers(){
 refillMarket();const c=selected();
 return '<h2>🤝 Rynek kontraktów</h2><p>Nowe oferty pojawiają się automatycznie w trakcie gry. Wybierz firmę z większością udziałów, aby podpisać umowę.</p><div id="ffe-alert">🏪 Wybrana firma: <b>'+esc(c?.name||'Brak')+'</b> · Udziały: '+(c?.owned||0)+'%</div><h3>✨ Dostępne oferty</h3><div class="offer-grid">'+S.marketOffers.map(o=>'<article class="offer-card"><h3>'+(o.type==='sport'?'🏆 ':'🥤 ')+esc(o.label)+'</h3><p>Opłata: <b>'+fmt(o.cost)+'</b></p><p>Premia do przychodów: +'+Math.round(o.bonus*100)+'% · Czas: '+o.duration+' dni</p><p class="muted">Oferta dostępna do dnia '+o.expires+'</p><button onclick="acceptMarketOffer('+o.id+')">Podpisz kontrakt</button></article>').join('')+'</div><h3>📋 Aktywne umowy</h3><div class="offer-grid">'+S.contracts.map(k=>{let c=S.companies.find(c=>c.id===k.company);return '<div class="offer-card"><b>'+esc(k.label)+'</b><p>'+esc(c?.name||'Firma')+' · wygasa dzień '+k.expires+'</p></div>'}).join('')+'</div>';
}
const oldTickFull=tick;
tick=function(){oldTickFull();if(S.day%3===0){S.marketOffers=S.marketOffers.filter(x=>x.expires>S.day);S.marketOffers.push(makeMarketOffer());if(S.marketOffers.length>14)S.marketOffers.shift();S.events.unshift('Nowa oferta kontraktu na rynku');S.events=S.events.slice(0,12)}refillMarket();render()};
refillMarket();
S.tab='Mapa';
render();
</script>

<script>
/* V15: independently managed AI competitors. No API keys or external services. */
const AI_CITIES={
 'Polska':[['Warszawa',52.2297,21.0122],['Kraków',50.0647,19.945],['Gdańsk',54.352,18.6466],['Wrocław',51.1079,17.0385],['Poznań',52.4064,16.9252],['Białystok',53.1325,23.1688]],
 'USA':[['Nowy Jork',40.7128,-74.006],['Los Angeles',34.0522,-118.2437],['Chicago',41.8781,-87.6298],['Houston',29.7604,-95.3698]],
 'Niemcy':[['Berlin',52.52,13.405],['Hamburg',53.5511,9.9937],['Monachium',48.1351,11.582],['Frankfurt',50.1109,8.6821]],
 'Francja':[['Paryż',48.8566,2.3522],['Lyon',45.764,4.8357],['Marsylia',43.2965,5.3698]],
 'Włochy':[['Rzym',41.9028,12.4964],['Mediolan',45.4642,9.19],['Neapol',40.8518,14.2681]],
 'Japonia':[['Tokio',35.6762,139.6503],['Osaka',34.6937,135.5023],['Kioto',35.0116,135.7681]],
 'Hiszpania':[['Madryt',40.4168,-3.7038],['Barcelona',41.3874,2.1686],['Walencja',39.4699,-.3763]],
 'Wielka Brytania':[['Londyn',51.5072,-.1276],['Manchester',53.4808,-2.2426],['Birmingham',52.4862,-1.8904]],
 'Kanada':[['Toronto',43.6532,-79.3832],['Vancouver',49.2827,-123.1207],['Montreal',45.5019,-73.5674]],
 'Brazylia':[['São Paulo',-23.5505,-46.6333],['Rio de Janeiro',-22.9068,-43.1729],['Brasília',-15.7939,-47.8828]],
 'Indie':[['Delhi',28.6139,77.209],['Mumbai',19.076,72.8777],['Bengaluru',12.9716,77.5946]],
 'Australia':[['Sydney',-33.8688,151.2093],['Melbourne',-37.8136,144.9631],['Brisbane',-27.4698,153.0251]]
};
S.aiEmpire??={groups:{},log:[],lastDay:0};
const AE=S.aiEmpire;
function aiGroup(c){
 const key=c.name+'|'+c.country;
 if(!AE.groups[key])AE.groups[key]={budget:rnd(85000,260000),strategy:pick(['jedno','wszystkie','losowe']),contracts:[],lastBuild:0};
 return AE.groups[key];
}
function aiCompetitor(c){return !c.closed&&c.owned<=50&&c.ai!==false}
function aiLog(msg){AE.log.unshift('Dzień '+S.day+': '+msg);AE.log=AE.log.slice(0,45);S.events.unshift('🤖 '+msg);S.events=S.events.slice(0,20)}
function aiPickCity(country,strategy,group){
 const cities=AI_CITIES[country]||[['Centrum',...(GEO[country]||GEO.Polska)]];
 if(strategy==='jedno'){group.homeCity??=pick(cities)[0];return cities.find(x=>x[0]===group.homeCity)||cities[0]}
 if(strategy==='wszystkie'){group.cityCursor??=0;return cities[group.cityCursor++%cities.length]}
 return pick(cities);
}
function aiBuild(brand,country,group){
 if(S.companies.length>=400||group.budget<26000)return false;
 const city=aiPickCity(country,group.strategy,group);
 const c=company(brand,country,0);
 c.city=city[0];c.lat=city[1]+(Math.random()-.5)*.035;c.lng=city[2]+(Math.random()-.5)*.05;
 c.ai=true;c.aiGroup=brand+'|'+country;c.staff=rnd(3,7);c.level=1;
 normalize(c);S.companies.push(c);group.budget-=26000;group.lastBuild=S.day;
 aiLog(brand+' otwiera restaurację: '+city[0]+' ('+country+')');
 return true;
}
function aiBusinessDay(){
 const groups=new Map();
 for(const c of S.companies){
  if(!aiCompetitor(c)||c.closed)continue;
  const key=c.name+'|'+c.country;
  if(!groups.has(key))groups.set(key,[]);
  groups.get(key).push(c);
 }
 // Rotate active groups to keep large saves fast.
 const keys=[...groups.keys()];
 const offset=S.day%Math.max(1,keys.length);
 for(let k=0;k<Math.min(14,keys.length);k++){
  const key=keys[(offset+k)%keys.length],list=groups.get(key),g=aiGroup(list[0]);
  const avgIncome=list.reduce((sum,c)=>sum+Math.max(0,c.base*c.level-c.cost-c.staff*2),0);
  g.budget=Math.min(2500000,g.budget+Math.round(avgIncome*3)+rnd(300,1800));
  const choice=Math.random();
  if(choice<.27&&g.budget>=2500){
   const c=pick(list);c.staff=Math.min(45,c.staff+1);g.budget-=2500;
   aiLog(c.name+' zatrudnia pracownika w '+(c.city||c.country));
  }else if(choice<.49&&g.budget>=12000){
   const c=pick(list);c.level=Math.min(12,c.level+1);c.quality=Math.min(100,c.quality+2);g.budget-=12000;
   aiLog(c.name+' modernizuje restaurację');
  }else if(choice<.64&&g.budget>=6500){
   const c=pick(list),sport=Math.random()<.5,label=pick(sport?SPORTS:DRINKS);
   const cost=sport?13000:6500;if(g.budget<cost)continue;
   g.budget-=cost;
   S.contracts.push({id:S.next++,company:c.id,type:sport?'sport':'drink',label,bonus:sport?.11:.07,expires:S.day+rnd(20,65),ai:true});
   aiLog(c.name+' podpisuje kontrakt: '+label);
  }else if(choice<.91&&S.day-g.lastBuild>=3){
   aiBuild(list[0].name,list[0].country,g);
  }else{
   const c=pick(list);c.price=Math.max(150,Math.round(c.price*(1+rnd(-3,5)/100)));
   c.quality=Math.min(100,c.quality+1);
  }
 }
 AE.lastDay=S.day;
}
function setAIStrategy(key,strategy){
 const c=S.companies.find(c=>aiCompetitor(c)&&c.name+'|'+c.country===key);
 if(!c)return;
 aiGroup(c).strategy=strategy;
 render();
}
function aiDashboard(){
 const comps=S.companies.filter(aiCompetitor);
 const keys=[...new Set(comps.map(c=>c.name+'|'+c.country))];
 const employees=comps.reduce((a,c)=>a+c.staff,0);
 const active=S.contracts.filter(k=>k.ai&&k.expires>S.day).length;
 return '<div id="ai-dashboard"><h2>🤖 Konkurencja AI</h2><p>Nieprzejęte firmy działają niezależnie: zatrudniają, ulepszają lokale, podpisują kontrakty i otwierają restauracje. Strategie są ustawiane automatycznie. Po zdobyciu większości udziałów przejmujesz kontrolę nad danym lokalem.</p>'+
 '<div class="ai-summary"><div class="ai-box">Restauracje konkurencji<div class="ai-number">'+comps.length+'</div></div><div class="ai-box">Sieci i rynki<div class="ai-number">'+keys.length+'</div></div><div class="ai-box">Pracownicy AI<div class="ai-number">'+employees+'</div></div><div class="ai-box">Kontrakty AI<div class="ai-number">'+active+'</div></div></div>'+
 '<h3>Sieci konkurencyjne</h3><div class="ai-cards">'+keys.slice(0,60).map(key=>{
 const list=comps.filter(c=>c.name+'|'+c.country===key),g=aiGroup(list[0]);
 const cities=[...new Set(list.map(c=>c.city||'Inne lokalizacje'))];
 return '<article class="ai-card"><h3>🍔 '+esc(list[0].name)+'</h3><span class="ai-chip">🌍 '+esc(list[0].country)+'</span><span class="ai-chip">🏪 '+list.length+' lokali</span><p>👥 '+list.reduce((a,c)=>a+c.staff,0)+' pracowników · 💰 Budżet: '+fmt(g.budget)+'</p><p>Strategia: <b>'+({jedno:'Jedno miasto',wszystkie:'Wszystkie miasta',losowe:'Różne miasta'}[g.strategy])+'</b></p><p class="muted">Miasta: '+esc(cities.slice(0,5).join(', '))+'</p></article>';
 }).join('')+'</div><h3>📰 Działania konkurencji</h3>'+AE.log.slice(0,18).map(x=>'<div class="tile" style="display:block;width:auto">'+esc(x)+'</div>').join('')+'</div>';
}
if(!tabs.includes('Konkurencja AI'))tabs.push('Konkurencja AI');
const beforeAIRender=render;
render=function(){beforeAIRender();if(S.tab==='Konkurencja AI')document.getElementById('content').innerHTML=aiDashboard()};
const beforeAITick=tick;
tick=function(){beforeAITick();if(S.day%3===0){aiBusinessDay();localStorage.setItem(KEY,JSON.stringify(S));if(S.tab==='Konkurencja AI')render()}};
render();
</script>

<script>
/* V16: AI corporations expand across countries, improve operations and compete globally. */
S.globalAI??={corporations:{},history:[],lastRun:-1};
const GA=S.globalAI;
function globalCorporation(name){
 if(!GA.corporations[name])GA.corporations[name]={capital:rnd(120000,340000),strategy:pick(['agresywna','zrównoważona','ostrożna']),lastExpansion:-10,marketing:0,logistics:0,training:0,technology:0,regionalHQ:[],homeCountry:null};
 return GA.corporations[name];
}
function globalAILog(text){GA.history.unshift('Dzień '+S.day+': '+text);GA.history=GA.history.slice(0,65);aiLog(text)}
function globalAIInvest(name,corp,locations){
 const choice=Math.random();
 if(choice<.19&&corp.capital>=18000){
  corp.capital-=18000;corp.marketing++;globalAILog(name+' uruchamia międzynarodową kampanię reklamową');
 }else if(choice<.35&&corp.capital>=22000){
  corp.capital-=22000;corp.logistics++;globalAILog(name+' inwestuje w logistykę i dostawy');
 }else if(choice<.49&&corp.capital>=15000){
  corp.capital-=15000;corp.training++;for(const c of locations.slice(0,5)){c.staff=Math.min(55,c.staff+1);c.quality=Math.min(100,c.quality+1)}
  globalAILog(name+' szkoli pracowników w swoich restauracjach');
 }else if(choice<.61&&corp.capital>=28000){
  corp.capital-=28000;corp.technology++;for(const c of locations.slice(0,5))c.level=Math.min(15,c.level+1);
  globalAILog(name+' modernizuje technologię sieci');
 }else if(choice<.74&&corp.capital>=20000){
  const c=pick(locations),sport=Math.random()<.5,label=pick(sport?SPORTS:DRINKS);
  corp.capital-=20000;S.contracts.push({id:S.next++,company:c.id,type:sport?'sport':'drink',label,bonus:sport?.13:.09,expires:S.day+rnd(30,90),ai:true});
  globalAILog(name+' zawiera międzynarodowy kontrakt: '+label);
 }else if(choice<.87&&corp.capital>=40000){
  const markets=[...new Set(locations.map(c=>c.country))];
  const available=COUNTRIES.filter(c=>!markets.includes(c));
  if(!available.length)return;
  const country=pick(available);corp.capital-=14000;corp.regionalHQ.push(country);
  globalAILog(name+' otwiera biuro regionalne w '+country);
 }else if(corp.capital>=30000){
  const c=pick(locations);c.staff=Math.min(55,c.staff+2);c.quality=Math.min(100,c.quality+3);corp.capital-=9000;
  globalAILog(name+' powiększa zespół w '+(c.city||c.country));
 }
}
function globalAIExpansion(){
 if(GA.lastRun===S.day)return;
 GA.lastRun=S.day;
 const byBrand=new Map();
 for(const c of S.companies){if(!aiCompetitor(c)||c.closed)continue;if(!byBrand.has(c.name))byBrand.set(c.name,[]);byBrand.get(c.name).push(c)}
 const brands=[...byBrand.keys()];if(!brands.length)return;
 const offset=S.day%brands.length;
 for(let i=0;i<Math.min(9,brands.length);i++){
  const brand=brands[(offset+i)%brands.length],locations=byBrand.get(brand),corp=globalCorporation(brand);
  corp.homeCountry??=locations[0].country;
  corp.capital=Math.min(3500000,corp.capital+Math.round(locations.reduce((sum,c)=>sum+Math.max(5,c.base*c.level-c.cost),0)*3)+rnd(2500,7000));
  const cost=corp.strategy==='agresywna'?42000:corp.strategy==='ostrożna'?75000:56000;
  const threshold=corp.strategy==='agresywna'?.76:corp.strategy==='ostrożna'?.35:.55;
  if(S.companies.length<400&&corp.capital>=cost&&S.day-corp.lastExpansion>=4&&Math.random()<threshold){
   const countries=[...new Set(locations.map(c=>c.country))];
   const abroad=COUNTRIES.filter(x=>!countries.includes(x));
   const country=abroad.length&&Math.random()<.72?pick(abroad):pick(countries);
   const city=pick(AI_CITIES[country]||[['Centrum',...(GEO[country]||GEO.Polska)]]);
   const c=company(brand,country,0);
   c.city=city[0];c.lat=city[1]+(Math.random()-.5)*.045;c.lng=city[2]+(Math.random()-.5)*.06;
   c.ai=true;c.staff=rnd(4,9);c.level=Math.min(5,1+Math.floor(corp.technology/3));c.quality=Math.min(95,70+corp.training);
   normalize(c);S.companies.push(c);corp.capital-=cost;corp.lastExpansion=S.day;

<script>
/* V17: ten new simulation mechanics. Simulated brands, no external services. */
S.ai17??={firms:{},history:[],lastDay:-1,bankruptcies:0,mergers:0,takeovers:0};
const A17=S.ai17;
function ai17Firm(name){
 if(!A17.firms[name])A17.firms[name]={cash:120000+rnd(0,170000),priceIndex:1,ads:0,factories:0,hq:[],subs:[],properties:0,debts:0,score:50,lossDays:0,contracts:0,shareholdings:{},lastAction:-1};
 return A17.firms[name];
}
function ai17Log(t){const msg='Dzień '+S.day+': '+t;A17.history.unshift(msg);A17.history=A17.history.slice(0,70);if(typeof globalAILog==='function')globalAILog(t)}
function ai17Rivals(){return S.companies.filter(c=>aiCompetitor(c)&&!c.closed)}
function ai17Groups(){const groups=new Map();for(const c of ai17Rivals()){if(!groups.has(c.name))groups.set(c.name,[]);groups.get(c.name).push(c)}return groups}
function ai17Score(name,cs){
 const f=ai17Firm(name);
 const n=cs.length;
 return Math.round(n*24000+cs.reduce((a,c)=>a+(c.base||0)*1100+(c.level||1)*7000,0)+f.cash+f.factories*26000+f.properties*15000-f.debts);
}
function ai17Close(c){
 if(!c||c.closed)return;
 c.closed=true;c.closedByAI=true;c.closedDay=S.day;
 c.resalePrice=Math.max(4500,Math.round(9000+c.level*3800+c.staff*900));
 S.contracts=S.contracts.filter(k=>k.company!==c.id);
 if(S.selected===c.id)S.selected=null;
}
function ai17OneAction(name,cs,all){
 const f=ai17Firm(name);
 const rivalNames=[...all.keys()].filter(n=>n!==name);
 const roll=Math.random();
 // 1. Price wars, with demand and profit pressure.
 if(roll<.15){
  const drop=rnd(3,10)/100;
  f.priceIndex=Math.max(.68,+(f.priceIndex-drop).toFixed(2));
  f.ads=Math.max(0,f.ads-1);
  f.cash-=Math.round(cs.length*550);
  for(const c of cs.slice(0,7))c.base=Math.max(8,Math.round(c.base*(1+drop*.2)));
  ai17Log(name+' rozpoczyna wojnę cenową: ceny -'+Math.round(drop*100)+'%');
 }
 // 2. AI takeover of minority shares in a competitor restaurant.
 else if(roll<.27&&rivalNames.length){
  const target=pick(all.get(pick(rivalNames)));
  const buyerShare=Number(target.aiOwners?.[name]||0);
  const available=Math.max(0,100-(target.owned||0)-Object.values(target.aiOwners||{}).reduce((a,b)=>a+Number(b||0),0));
  const qty=Math.min(10,available);
  const cost=Math.round(qty*(target.price||1000));
  if(qty>=2&&f.cash>cost+20000){
   f.cash-=cost;target.aiOwners??={};target.aiOwners[name]=buyerShare+qty;
   f.shareholdings[target.id]=target.aiOwners[name];A17.takeovers++;
   ai17Log(name+' kupuje '+qty+'% udziałów lokalu '+target.name+' ('+target.country+')');
  }
 }
 // 3. Insolvency, debt and closures
 else if(roll<.37){
  const worst=[...cs].sort((a,b)=>(a.base*a.level-a.cost-a.staff*2)-(b.base*b.level-b.cost-b.staff*2))[0];
  if(worst&&f.cash<25000&&cs.length>1){
   ai17Close(worst);f.cash+=6000;A17.bankruptcies++;
   ai17Log(name+' zamyka nierentowną restaurację w '+(worst.city||worst.country));
  }else if(f.cash<50000){f.debts+=25000;f.cash+=25000;ai17Log(name+' zaciąga kredyt ratunkowy')}
  else {f.cash-=3500;f.score=Math.min(100,f.score+2);ai17Log(name+' tworzy rezerwę na trudniejszy okres')}
 }
 // 4. Merger as a strategic alliance (no renaming/ownership changes to protect saves).
 else if(roll<.45&&rivalNames.length&&f.cash>25000){
  const other=pick(rivalNames),partner=ai17Firm(other);
  f.cash-=18000;partner.cash+=9000;f.score=Math.min(100,f.score+5);partner.score=Math.min(100,partner.score+3);
  A17.mergers++;ai17Log(name+' i '+other+' zawierają umowę o połączeniu operacyjnym');
 }
 // 5. Own factories
 else if(roll<.57&&f.cash>45000){
  f.cash-=45000;f.factories++;f.score=Math.min(100,f.score+2);
  ai17Log(name+' buduje fabrykę produktów i opakowań');
 }
 // 6. Regional pricing
 else if(roll<.67){
  const country=pick([...new Set(cs.map(c=>c.country))]);
  const factor=1+rnd(-6,9)/100;
  for(const c of cs.filter(c=>c.country===country))c.price=Math.max(100,Math.round(c.price*factor));
  ai17Log(name+' zmienia ceny na rynku: '+country);
 }
 // 7. Advertising war
 else if(roll<.77&&f.cash>14000){
  f.cash-=14000;f.ads++;f.score=Math.min(100,f.score+4);
  for(const c of cs.slice(0,6))c.quality=Math.min(100,c.quality+1);
  ai17Log(name+' uruchamia kampanię reklamową przeciw konkurentom');
 }
 // 8. AI holding / subsidiaries
 else if(roll<.86&&f.cash>28000){
  const country=pick(COUNTRIES);
  if(!f.subs.includes(country)){f.cash-=28000;f.subs.push(country);ai17Log(name+' tworzy spółkę córkę w '+country)}
 }
 // 9. Property investments
 else if(roll<.94&&f.cash>35000){
  f.cash-=35000;f.properties++;ai17Log(name+' kupuje lokal gastronomiczny na własność');
 }
 // 10. Media and global ranking
 else {
  f.score=Math.min(100,f.score+2);
  ai17Log(name+' publikuje raport finansowy i poprawia reputację');
 }
}
function ai17Day(){
 if(A17.lastDay===S.day)return;A17.lastDay=S.day;
 const groups=ai17Groups();if(!groups.size)return;
 const names=[...groups.keys()];
 for(let i=0;i<Math.min(7,names.length);i++){
  const name=names[(S.day+i)%names.length],cs=groups.get(name),f=ai17Firm(name);
  let income=cs.reduce((a,c)=>a+Math.max(-300,(c.base||20)*(c.level||1)-(c.cost||0)-(c.staff||0)*2),0);
  const operating=income*2+f.factories*200+f.properties*70+f.ads*35-Math.round(f.debts*.0005);
  f.cash=Math.max(-150000,Math.min(5000000,f.cash+Math.round(operating)));
  if(operating<0)f.lossDays++;else f.lossDays=0;
  if(f.cash<0&&cs.length>1){
   const worst=[...cs].sort((a,b)=>a.base*a.level-a.cost-(b.base*b.level-b.cost))[0];
   ai17Close(worst);f.cash+=15000;A17.bankruptcies++;ai17Log(name+' zamyka lokal z powodu strat');
  }
  if(Math.random()<.78)ai17OneAction(name,cs,groups);
  f.priceIndex+=(1-f.priceIndex)*.06;
 }
}
function ai17View(){
 const groups=ai17Groups(),ranking=[...groups].map(([name,cs])=>({name,cs,f:ai17Firm(name),value:ai17Score(name,cs)})).sort((a,b)=>b.value-a.value);
 const all=ai17Rivals();
 return '<div id="ai17"><h2>🏆 Rynek i wojny korporacji AI</h2><p>Konkurenci prowadzą wojny cenowe, kupują udziały, zamykają nierentowne lokale, współpracują, budują fabryki, reklamują się i tworzą spółki córki. Wszystko jest symulowane automatycznie.</p>'+
 '<div class="summary17"><div class="stat17">Konkurencyjne lokale<div class="big17">'+all.length+'</div></div><div class="stat17">Przejęcia udziałów<div class="big17">'+A17.takeovers+'</div></div><div class="stat17">Umowy o fuzji<div class="big17">'+A17.mergers+'</div></div><div class="stat17">Zamknięte lokale<div class="big17">'+A17.bankruptcies+'</div></div></div>'+
 '<h3>📊 Ranking największych sieci</h3><div class="grid17">'+ranking.slice(0,40).map((r,i)=>'<article class="corp17"><h3>#'+(i+1)+' 🍔 '+esc(r.name)+'</h3><p>Wycena: <strong>'+fmt(r.value)+'</strong></p><p>🏪 '+r.cs.length+' restauracji · 🌍 '+new Set(r.cs.map(c=>c.country)).size+' krajów</p><p>💰 '+fmt(r.f.cash)+' · 🏭 '+r.f.factories+' fabryk · 🏢 '+r.f.subs.length+' spółek córek</p><p>📣 Reklamy: '+r.f.ads+' · 🏬 Nieruchomości: '+r.f.properties+' · ⭐ '+r.f.score+'/100</p>'+[...new Set(r.cs.map(c=>c.country))].map(c=>'<span class="tag17">'+esc(c)+'</span>').join('')+'</article>').join('')+'</div>'+
 '<h3>📰 Wiadomości gospodarcze</h3>'+A17.history.slice(0,25).map(x=>'<div class="log17">'+esc(x)+'</div>').join('')+'</div>';
}
if(!tabs.includes('Rynek AI'))tabs.push('Rynek AI');
const renderBefore17=render;
render=function(){renderBefore17();if(S.tab==='Rynek AI')document.getElementById('content').innerHTML=ai17View()};

tick=function(){tickBefore17();if(S.day%4===0){ai17Day();localStorage.setItem(KEY,JSON.stringify(S));if(S.tab==='Rynek AI')render()}};

</script>

<script>
let ffeDialogQueue=Promise.resolve();
function ffeDialog(kind,message,defaultValue=''){
 const task=()=>new Promise(resolve=>{
  const overlay=document.getElementById('ffe-dialog-overlay'),input=document.getElementById('ffe-dialog-input'),cancel=document.getElementById('ffe-dialog-cancel'),ok=document.getElementById('ffe-dialog-ok');
  document.getElementById('ffe-dialog-text').textContent=String(message??'');
  document.getElementById('ffe-dialog-title').textContent=kind==='confirm'?'🤝 Potwierdzenie':kind==='prompt'?'✨ Wprowadź dane':'📋 Informacja';
  input.style.display=kind==='prompt'?'block':'none';input.value=String(defaultValue??'');
  cancel.style.display=kind==='alert'?'none':'inline-block';ok.textContent=kind==='alert'?'Zamknij':'Zatwierdź';
  overlay.classList.add('open');
  function finish(value){overlay.classList.remove('open');ok.onclick=null;cancel.onclick=null;input.onkeydown=null;document.removeEventListener('keydown',esc);resolve(value)}
  function esc(e){if(e.key==='Escape'){e.preventDefault();finish(kind==='confirm'?false:null)}}
  ok.onclick=()=>finish(kind==='prompt'?input.value:true);
  cancel.onclick=()=>finish(kind==='confirm'?false:null);
  input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();ok.click()}};
  document.addEventListener('keydown',esc);
  if(kind==='prompt')setTimeout(()=>{input.focus();input.select()},30);else setTimeout(()=>ok.focus(),30);
 });
 const result=ffeDialogQueue.then(task);ffeDialogQueue=result.then(()=>{},()=>{});return result;
}
function gamePrompt(message,defaultValue=''){return ffeDialog('prompt',message,defaultValue)}
function gameConfirm(message){return ffeDialog('confirm',message)}
function gameAlert(message){return ffeDialog('alert',message)}
</script>

 if(!ok)return;
 if(S.cash<cost){toast('Brakuje pieniędzy na budowę');return}
 if(S.companies.length>=500){toast('Limit 500 lokali');return}
 S.cash-=cost;
 const c=company(brand,country,100);
 c.lat=lat;c.lng=lng;c.holders=[];c.ai=false;c.demand=demand;c.reviews=72;c.deliveryLevel=0;
 c.base=Math.max(8,Math.round(c.base*demand));
 S.companies.push(c);S.selected=c.id;
 v21Log('🏗️ Otwarto '+brand+' w '+country);
 v21Save();render();toast('Restauracja zbudowana!',-cost);
}
async function v21Close(id){

 if(!c||c.closed||!controlled(c))return;

<script>
/* V22 simulation: 20 systems integrated with existing company, finance, AI and map data. */
S.v22??={cities:{},managers:{},investors:0,investorDebt:0,products:[],appLevel:0,fleet:0,marketResearch:[],stock:{},awards:[],log:[],cycle:0,crisis:0,weather:'Słonecznie',event:'Brak',globalTax:0,antitrust:0};
const V22=S.v22;
const V22_WEATHERS=['Słonecznie','Deszcz','Śnieg','Upał','Wiatr'];
const V22_EVENTS=['Brak','Koncert','Mecz','Festiwal','Targi'];
const V22_TAX={'Polska':.19,'USA':.21,'Niemcy':.30,'Francja':.25,'Japonia':.30,'Wielka Brytania':.25,'Hiszpania':.25,'Włochy':.24,'Kanada':.27,'Australia':.25,'Indie':.30,'Brazylia':.34};
function v22Rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function v22Save(){localStorage.setItem(KEY,JSON.stringify(S))}
function v22Log(t){V22.log.unshift('Dzień '+S.day+': '+t);V22.log=V22.log.slice(0,65)}
function v22Fmt(n){return typeof fmt==='function'?fmt(Math.round(n)):Math.round(n).toLocaleString('pl-PL')+' $'}
function v22CityName(c){
 if(c.city)return c.city;
 const cities=(typeof AI_CITIES!=='undefined'&&AI_CITIES[c.country])||[];
 if(c.lat!=null&&cities.length){
  const near=[...cities].sort((a,b)=>Math.hypot(a[1]-c.lat,a[2]-c.lng)-Math.hypot(b[1]-c.lat,b[2]-c.lng))[0];
  if(near&&Math.hypot(near[1]-c.lat,near[2]-c.lng)<1.8)return near[0];
 }
 return 'Region '+c.country;
}
function v22City(c){
 const key=c.country+'|'+v22CityName(c);
 if(!V22.cities[key]){
  const seed=[...key].reduce((a,x)=>(a*31+x.charCodeAt(0))>>>0,17);
  V22.cities[key]={population:60000+seed%4200000,wealth:55+(seed>>>5)%91,demand:65+(seed>>>9)%76,traffic:55+(seed>>>12)%91};
 }
 return V22.cities[key];
}
function v22Tax(country){return V22_TAX[country]??.23}
function v22Location(c){
 const city=v22City(c);
 const traffic=(c.traffic??city.traffic)/100;
 const wealth=city.wealth/100,demand=city.demand/100;
 return Math.max(.65,Math.min(1.7,(traffic*.26+wealth*.3+demand*.44)));
}
function v22EarningsFactor(c){
 if(c.closed)return 0;
 const loc=v22Location(c);
 const mall=c.mall?1.16:1;
 const drive=c.driveThru?1.15:1;
 const training=1+(c.training||0)*.045;
 const app=1+V22.appLevel*.025;
 const delivery=1+Math.min(20,V22.fleet)*.012;
 const products=1+Math.min(12,V22.products.length)*.016;
 const manager=V22.managers[c.country]?1.08:1;
 const weather=V22.weather==='Śnieg'?.91:V22.weather==='Deszcz'?.95:V22.weather==='Upał'?1.03:1;
 const event=V22.event==='Brak'?1:1.08;
 const crisis=V22.crisis>0?.82:1;
 const reputation=.8+Math.min(100,c.reviews??70)/350;
 const malfunction=c.breakdown?.65:1;
 return loc*mall*drive*training*app*delivery*products*manager*weather*event*crisis*reputation*malfunction;
}
const v22OriginalProfit=profit;
profit=function(c){
 if(c.closed)return 0;
 const base=v22OriginalProfit(c);
 if(!controlled(c))return base;
 const factor=v22EarningsFactor(c);
 const expenses=(c.mall?9:0)+(c.driveThru?3:0)+(c.training||0)*2;
 return (base>=0?base*factor:base)-expenses-(Math.max(0,base)*v22Tax(c.country)*.2);
};
function v22Own(){return S.companies.filter(c=>controlled(c)&&!c.closed)}
function v22Competitors(){return S.companies.filter(c=>!controlled(c)&&!c.closed)}
function v22CanPay(cost){if(S.cash<cost){toast('Brakuje gotówki');return false}return true}
async function v22Upgrade(id,type){
 const c=S.companies.find(x=>x.id===id);
 if(!c||!controlled(c)||c.closed)return;
 const defs={
 mall:['Wynająć lokal w centrum handlowym',18000,()=>!c.mall,()=>{c.mall=true}],
 drive:['Zbudować drive-thru',14500,()=>!c.driveThru,()=>{c.driveThru=true}],
 training:['Przeszkolić pracowników',4200+2500*(c.training||0),()=>(c.training||0)<8,()=>{c.training=(c.training||0)+1;c.quality=Math.min(100,c.quality+2)}],
 repair:['Naprawić restaurację',6000,()=>!!c.breakdown,()=>{c.breakdown=false}]
 };
 const d=defs[type];if(!d||!d[2]())return;
 if(!await gameConfirm(d[0]+' za '+v22Fmt(d[1])+'?'))return;
 if(!v22CanPay(d[1]))return;
 S.cash-=d[1];d[3]();v22Log(d[0]+': '+c.name);v22Save();render();
}
async function v22Global(type){
 const costs={app:26000,fleet:8000,invest:0};
 if(type==='app'){
  const cost=costs.app+V22.appLevel*14000;
  if(!await gameConfirm('Rozwinąć aplikację mobilną za '+v22Fmt(cost)+'?'))return;
  if(!v22CanPay(cost))return;S.cash-=cost;V22.appLevel++;v22Log('Rozwój aplikacji mobilnej'); 
 }else if(type==='fleet'){
  const cost=costs.fleet+V22.fleet*1700;
  if(!await gameConfirm('Kupić pojazd i zatrudnić kuriera za '+v22Fmt(cost)+'?'))return;
  if(!v22CanPay(cost))return;S.cash-=cost;V22.fleet++;v22Log('Nowy kurier i pojazd');
 }else if(type==='invest'){
  if(!await gameConfirm('Pozyskać 100 000 $ od inwestorów? W zamian firma spłaci 130 000 $ w ratach.'))return;
  S.cash+=100000;V22.investors++;V22.investorDebt+=130000;v22Log('Pozyskano inwestora: 100 000 $');
 }else if(type==='repay'){
  const cost=Math.min(25000,V22.investorDebt);if(!cost||!v22CanPay(cost))return;
  if(!await gameConfirm('Spłacić '+v22Fmt(cost)+' zobowiązań wobec inwestorów?'))return;
  S.cash-=cost;V22.investorDebt-=cost;v22Log('Spłata inwestorów');
 }else if(type==='product'){
  const name=await gamePrompt('Nazwa nowego produktu (burger, pizza, zestaw itd.):','Nowy zestaw');
  if(!name?.trim())return;
  const cost=11000+V22.products.length*1200;
  if(!await gameConfirm('Wprowadzić '+name.trim()+' za '+v22Fmt(cost)+'?'))return;
  if(!v22CanPay(cost))return;
  S.cash-=cost;V22.products.push(name.trim().slice(0,42));v22Log('Premiera produktu: '+name.trim().slice(0,42));
 }else if(type==='research'){
  const country=await gamePrompt('Podaj kraj do zbadania:',S.country);
  if(!country?.trim())return;
  const target=country.trim();
  const match=COUNTRIES.find(c=>c.toLocaleLowerCase('pl')===target.toLocaleLowerCase('pl'));
  if(!match){toast('Nie znaleziono kraju');return}
  if(!v22CanPay(3500))return;
  S.cash-=3500;
  const restaurants=S.companies.filter(c=>c.country===match);
  const names=[...new Set(restaurants.map(c=>c.name))];
  const result={country:match,restaurants:restaurants.length,brands:names.length,day:S.day};
  V22.marketResearch.unshift(result);V22.marketResearch=V22.marketResearch.slice(0,20);
  v22Log('Badanie rynku: '+match);
 }else if(type==='manager'){
  const country=await gamePrompt('W jakim kraju zatrudnić dyrektora?',S.country);
  if(!country?.trim())return;
  const match=COUNTRIES.find(c=>c.toLocaleLowerCase('pl')===country.trim().toLocaleLowerCase('pl'));
  if(!match){toast('Nie znaleziono kraju');return}
  if(V22.managers[match]){toast('Dyrektor już zatrudniony');return}
  if(!v22CanPay(22000))return;
  S.cash-=22000;V22.managers[match]=true;v22Log('Zatrudniono dyrektora regionalnego: '+match);
 }else if(type==='takeover'){
  const name=await gamePrompt('Jaką markę konkurencji chcesz przejąć?','');
  if(!name?.trim())return;
  const targets=v22Competitors().filter(c=>c.name.toLocaleLowerCase('pl')===name.trim().toLocaleLowerCase('pl'));
  if(!targets.length){toast('Nie znaleziono aktywnej marki konkurencji');return}
  const share=targets.reduce((a,c)=>a+(c.owned||0),0)/targets.length;
  const price=Math.round(targets.reduce((a,c)=>a+Math.max(15000,(c.price||500)*Math.max(10,100-(c.owned||0))+(c.level||1)*9000),0));
  const market=S.companies.filter(c=>c.country===S.country&&!c.closed);
  const ours=market.filter(controlled).length;
  const dominance=(ours+targets.length)/Math.max(1,market.length);
  if(dominance>.82&&market.length>=6){V22.antitrust++;toast('Urząd antymonopolowy blokuje przejęcie: dominacja rynku');return}
  if(!await gameConfirm('Przejąć '+targets.length+' restauracji marki '+name.trim()+' za '+v22Fmt(price)+'?\\nPrzejmiesz 100% udziałów w aktywnych lokalach tej marki.'))return;
  if(!v22CanPay(price))return;
  S.cash-=price;for(const c of targets){c.owned=100;c.ai=false;c.aiOwners={};c.holders=[]}
  v22Log('Przejęto sieć '+name.trim()+' ('+targets.length+' lokali)');
 }
 v22Save();render();
}
function v22StockPrice(name){
 const key=String(name);
 if(!V22.stock[key])V22.stock[key]={price:80+v22Rand(10,130),change:0,history:[]};
 return V22.stock[key];
}
function v22Day(){
 if(V22.cycle===S.day)return;V22.cycle=S.day;
 if(S.day%7===0){
  V22.weather=V22_WEATHERS[v22Rand(0,V22_WEATHERS.length-1)];
  V22.event=V22_EVENTS[v22Rand(0,V22_EVENTS.length-1)];
  if(V22.crisis>0)V22.crisis=Math.max(0,V22.crisis-7);
  else if(Math.random()<.11){V22.crisis=v22Rand(14,35);v22Log('📉 Kryzys gospodarczy: spadek popytu')}
  v22Log('Pogoda: '+V22.weather+'; wydarzenie: '+V22.event);
 }
 if(S.day%3===0){
  for(const name of [...new Set(S.companies.map(c=>c.name))].slice(0,45)){
   const st=v22StockPrice(name),before=st.price;
   st.price=Math.max(3,Math.round(st.price*(1+(Math.random()-.48)*(V22.crisis>0?.18:.1))));
   st.change=Math.round((st.price/before-1)*1000)/10;
   st.history.push(st.price);if(st.history.length>25)st.history.shift();
  }
  for(const c of v22Own()){
   if(!c.breakdown&&Math.random()<.007){c.breakdown=true;v22Log('🔧 Awaria: '+c.name+' ('+c.country+')')}
  }
  if(V22.investorDebt>0){const due=Math.min(V22.investorDebt,Math.max(0,Math.round(S.cash*.007)));S.cash-=due;V22.investorDebt-=due}
 }
 if(S.day%20===0){
  const ranked=[...v22Own()].sort((a,b)=>(b.reviews??70)+(b.quality||0)-(a.reviews??70)-(a.quality||0));
  if(ranked.length){const c=ranked[0];V22.awards.unshift({day:S.day,name:c.name,country:c.country});V22.awards=V22.awards.slice(0,15);S.cash+=7500;v22Log('🏆 Nagroda dla '+c.name+' w '+c.country+' (+7500 $)')}
 }
 v22Save();
}

function v22View(){
 const own=v22Own(),brands=[...new Set(S.companies.map(c=>c.name))];
 const cities=[...new Set(own.map(c=>c.country+'|'+v22CityName(c)))];
