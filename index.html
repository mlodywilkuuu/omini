<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Ropucha Group Tycoon</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:#111;
color:#fff
}

button,input,select{font:inherit}

#map{
position:absolute;
inset:0;
z-index:1
}

.leaflet-tile{
image-rendering:auto!important
}

/* HUD */

#hud{
position:fixed;
top:10px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:5px;
z-index:1500;
pointer-events:none
}

.hud{
background:#111e;
border:2px solid #333;
border-radius:9px;
padding:7px 11px;
min-width:90px;
text-align:center
}

.hud small{
display:block;
font-size:9px;
color:#999;
text-transform:uppercase
}

.hud strong{font-size:16px}
#money{color:#68e97a}

/* SIDEBAR */

#sidebar{
position:fixed;
top:75px;
bottom:10px;
left:10px;
width:390px;
z-index:1400;
background:#111e;
border:2px solid #333;
border-radius:13px;
padding:11px;
overflow-y:auto;
backdrop-filter:blur(8px)
}

.logo{
font-size:19px;
font-weight:900;
color:#68e97a;
margin-bottom:9px
}

.tabs{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:4px;
margin-bottom:9px
}

.tab{
border:0;
border-radius:6px;
padding:8px 4px;
background:#292929;
color:#fff;
cursor:pointer;
font-size:11px
}

.tab.active{background:#176d38}

.panel{display:none}
.panel.active{display:block}

.box,.company,.card{
background:#252525;
border-radius:8px;
padding:9px;
margin-bottom:7px
}

.box h3,.company h3,.card h3{
margin:0 0 7px;
font-size:14px
}

.row{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
margin:5px 0;
font-size:12px;
color:#ccc
}

.row b{
color:#fff;
text-align:right
}

.btn{
width:100%;
border:0;
border-radius:6px;
padding:8px;
margin-top:5px;
background:#176d38;
color:#fff;
font-weight:bold;
cursor:pointer
}

.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.blue{background:#285e9b}
.orange{background:#9c5e22}
.red{background:#8d3838}
.gray{background:#555}
.purple{background:#68458d}

input,select{
background:#333;
color:#fff;
border:1px solid #555;
border-radius:5px;
padding:6px
}

.full{width:100%}

.grid2{
display:grid;
grid-template-columns:1fr 1fr;
gap:5px
}

.grid3{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:4px
}

.badge{
display:inline-block;
padding:3px 7px;
border-radius:10px;
font-size:10px;
background:#444;
margin:2px
}

.green{color:#68e97a}
.redText{color:#ff7070}
.yellow{color:#ffd56b}

.shareBar{
height:7px;
background:#444;
border-radius:5px;
overflow:hidden;
margin:7px 0
}

.shareFill{
height:100%;
background:#68e97a
}

.investor{
background:#303030;
padding:7px;
border-radius:6px;
margin-top:5px
}

.groupTree{
border-left:3px solid #68e97a;
padding-left:10px;
margin:8px 0
}

.childTree{
border-left:2px solid #555;
margin-left:12px;
padding-left:10px;
margin-top:6px
}

/* MAP MARKERS */

.gameMarker{
width:35px;
height:35px;
border-radius:50%;
border:3px solid white;
display:flex;
align-items:center;
justify-content:center;
font-size:18px;
box-shadow:0 3px 10px #0008
}

.storeMarker{background:#18733b}
.centerMarker{background:#285e9d}
.factoryMarker{background:#9d612b}
.competitorMarker{background:#8d3838}

/* BUILD */

#buildInfo{
display:none;
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
z-index:4000;
background:#111e;
border:2px solid #555;
border-radius:8px;
padding:10px 18px
}

/* NOTIFICATIONS */

#notifications{
position:fixed;
right:12px;
bottom:12px;
width:320px;
z-index:9000
}

.notification{
background:#111f;
border-left:5px solid #63df73;
border-radius:6px;
padding:9px;
margin-top:5px;
font-size:12px
}

/* MONEY */

.moneyFx{
position:fixed;
top:70px;
left:50%;
z-index:10000;
font-size:24px;
font-weight:900;
pointer-events:none;
animation:moneyFx 1.3s forwards
}

.plus{color:#68f079}
.minus{color:#ff6262}

@keyframes moneyFx{
0%{opacity:0;transform:translate(-50%,15px)}
20%{opacity:1;transform:translate(-50%,0) scale(1.1)}
100%{opacity:0;transform:translate(-50%,-45px)}
}

/* MODAL */

#modalBackground{
display:none;
position:fixed;
inset:0;
z-index:8000;
background:#000a;
align-items:center;
justify-content:center
}

#modal{
width:min(760px,92vw);
max-height:88vh;
overflow-y:auto;
background:#181818;
border:2px solid #444;
border-radius:13px;
padding:15px
}

.close{
float:right;
border:0;
border-radius:5px;
padding:6px 9px;
background:#8d3838;
color:#fff;
cursor:pointer
}

/* CONSOLE */

#console{
display:none;
position:fixed;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:min(700px,92vw);
height:430px;
z-index:20000;
background:#080b09f8;
border:2px solid #59e36d;
border-radius:9px;
overflow:hidden;
font-family:Consolas,monospace
}

#consoleHeader{
height:43px;
padding:12px;
background:#142117;
color:#69ef7d
}

#consoleHistory{
height:325px;
overflow:auto;
padding:10px;
font-size:13px;
white-space:pre-wrap
}

#consoleBottom{
height:60px;
display:flex;
align-items:center;
gap:7px;
padding:9px;
border-top:1px solid #315d38
}

#consoleInput{
flex:1;
background:transparent;
border:0;
outline:0
}

@media(max-width:800px){

#sidebar{width:300px}

.hud:nth-child(n+4){
display:none
}

}
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
GAME STATE
========================================================= */

let money=500000;
let day=1;
let reputation=50;
let fuelPrice=6.20;

let buildMode=null;

let maxFranchisees=5;
let maxDrivers=5;

let franchisees=[];
let stores=[];
let centers=[];
let drivers=[];
let trucks=[];
let routes=[];
let companies=[];
let contracts=[];
let competitors=[];

/*
Spółki córki należące bezpośrednio
do Ropucha Group.
*/

let subsidiaries=[];

let nextStoreId=1;
let nextCenterId=1;
let nextDriverId=1;
let nextTruckId=1;
let nextRouteId=1;
let nextCompanyId=1;
let nextContractId=1;
let nextSubsidiaryId=1;
let nextInvestorId=1;

let totalRevenue=0;
let totalExpenses=0;
let totalDividends=0;
let totalCustomers=0;
let lostCustomers=0;

const DAY_TIME=10000;

/* =========================================================
PRODUCTS
========================================================= */

const productCatalog=[

{
id:"hotdog",
name:"Hot-dog",
emoji:"🌭",
baseBuy:3.10,
defaultPrice:7.99
},

{
id:"pizza",
name:"Pizza",
emoji:"🍕",
baseBuy:7,
defaultPrice:15.99
},

{
id:"coffee",
name:"Kawa",
emoji:"☕",
baseBuy:2.20,
defaultPrice:7.49
},

{
id:"drink",
name:"Napój",
emoji:"🥤",
baseBuy:2.80,
defaultPrice:6.49
},

{
id:"sandwich",
name:"Kanapka",
emoji:"🥪",
baseBuy:5,
defaultPrice:11.99
},

{
id:"icecream",
name:"Lody",
emoji:"🍦",
baseBuy:3.20,
defaultPrice:7.99
}

];

function makeStoreProducts(){

let obj={};

productCatalog.forEach(p=>{

obj[p.id]={
stock:0,
price:p.defaultPrice,
promotion:0,
promotionDays:0
};

});

return obj;

}

/* =========================================================
MAP
========================================================= */

const map=L.map("map",{

zoomControl:true,

zoomAnimation:false,
fadeAnimation:false,
markerZoomAnimation:false,

zoomSnap:1,
zoomDelta:1,

wheelPxPerZoomLevel:100,

minZoom:2,
maxZoom:19

}).setView([30,10],3);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{

maxZoom:19,
maxNativeZoom:19,
keepBuffer:4,

attribution:
"&copy; OpenStreetMap contributors"

}
).addTo(map);

function makeIcon(emoji,type){

return L.divIcon({

className:"",

html:
`<div class="gameMarker ${type}">
${emoji}
</div>`,

iconSize:[35,35],
iconAnchor:[17,17]

});

}

const icons={

store:
makeIcon("🏪","storeMarker"),

center:
makeIcon("📦","centerMarker"),

factory:
makeIcon("🏭","factoryMarker"),

competitor:
makeIcon("🏬","competitorMarker")

};

/* =========================================================
COUNTRIES / CITIES
========================================================= */

const locations=[

["Warszawa","Polska",52.23,21.01],
["Kraków","Polska",50.06,19.94],
["Białystok","Polska",53.13,23.16],

["Berlin","Niemcy",52.52,13.40],
["Hamburg","Niemcy",53.55,10.00],

["Praga","Czechy",50.07,14.43],

["Paryż","Francja",48.85,2.35],

["Londyn","Wielka Brytania",51.50,-0.12],

["Rzym","Włochy",41.90,12.49],

["Madryt","Hiszpania",40.41,-3.70],

["Amsterdam","Holandia",52.37,4.89],

["Sztokholm","Szwecja",59.32,18.06],

["Nowy Jork","USA",40.71,-74],

["Los Angeles","USA",34.05,-118.24],

["Toronto","Kanada",43.65,-79.38],

["São Paulo","Brazylia",-23.55,-46.63],

["Tokio","Japonia",35.67,139.65],

["Seul","Korea Południowa",37.56,126.97],

["Pekin","Chiny",39.90,116.40],

["Singapur","Singapur",1.35,103.81],

["Bangkok","Tajlandia",13.75,100.50],

["Delhi","Indie",28.61,77.20],

["Dubaj","ZEA",25.20,55.27],

["Kair","Egipt",30.04,31.23],

["Johannesburg","RPA",-26.20,28.04],

["Sydney","Australia",-33.86,151.20]

];

const countries=[
"Polska",
"Niemcy",
"Czechy",
"Francja",
"Wielka Brytania",
"Włochy",
"Hiszpania",
"Holandia",
"Szwecja",
"USA",
"Kanada",
"Brazylia",
"Japonia",
"Korea Południowa",
"Chiny",
"Singapur",
"Tajlandia",
"Indie",
"ZEA",
"Egipt",
"RPA",
"Australia"
];

/*
Proste wykrywanie kraju.

Nie jest to geokoder granic państw.
W tej wersji wybiera najbliższe
znane miasto z locations[].

Dzięki temu gra działa bez kolejnego API.
*/

function detectCountry(lat,lng){

let closest=null;
let best=Infinity;

locations.forEach(loc=>{

let dx=lat-loc[2];
let dy=lng-loc[3];

let distance=
dx*dx+dy*dy;

if(distance<best){

best=distance;
closest=loc;

}

});

return closest
?closest[1]
:"Nieznany";

}

/* =========================================================
INVESTORS
========================================================= */

const investorNames=[

"North Capital",
"Atlas Investments",
"Global Equity",
"GreenRock Fund",
"Nova Partners",
"Mercury Capital",
"Orion Ventures",
"Europa Holding",
"Prime Asset Management",
"Founders Fund"

];

function generateShareholders(){

/*
Ropucha zaczyna z 0%.

Pozostałe 100% jest dzielone
między 3-5 inwestorów.
*/

let count=random(3,5);

let remaining=100;

let investors=[];

for(let i=0;i<count;i++){

let share;

if(i===count-1){

share=remaining;

}else{

let minRemaining=
(count-i-1)*5;

share=random(
5,
Math.max(
5,
remaining-minRemaining
)
);

}

remaining-=share;

investors.push({

id:nextInvestorId++,

name:
i===0
?"Założyciele"
:choice(investorNames),

shares:share

});

}

return investors;

}

/* =========================================================
COMPANIES
========================================================= */

const companyPrefixes=[
"Fresh","Golden","Green","Prime",
"Happy","Royal","Urban","Global",
"Sun","Blue","North","Mega",
"Best","Smart","Daily","Family",
"Nature","Good","World"
];

const companySuffixes=[
"Foods","Group","Kitchen",
"Foodworks","Industries",
"Products","Taste","Factory"
];

function generateCompany(silent=false){

let loc=choice(locations);

let product=
choice(productCatalog);

let valuation=
random(
300000,
12000000
);

let company={

id:
"company_"+
nextCompanyId++,

name:
product.emoji+
" "+
choice(companyPrefixes)+
choice(companySuffixes),

productId:
product.id,

city:
loc[0],

country:
loc[1],

lat:
loc[2]+
(Math.random()-.5)*.6,

lng:
loc[3]+
(Math.random()-.5)*.6,

valuation,

profit:
Math.floor(
valuation*
random(3,9)/
1000
),

capacity:
random(
5000,
40000
),

shares:0,

shareholders:
generateShareholders(),

controlled:false,

inGroup:false,

acquired:false,

marker:null

};

companies.push(
company
);

company.marker=
L.marker(
[
company.lat,
company.lng
],
{
icon:
icons.factory
}
)
.addTo(map);

updateCompanyPopup(
company
);

if(!silent){

notify(
"🌍 Nowa firma: "+
company.name
);

}

return company;

}

function updateCompanyPopup(c){

let p=
getProduct(
c.productId
);

c.marker.bindPopup(`

<b>
${c.name}
</b>

<br><br>

📍
${c.city},
${c.country}

<br>

${p.emoji}
${p.name}

<br>

💰
${moneyText(
c.valuation
)}

<br>

📈
${moneyText(
c.profit
)}/dzień

<br>

📊 Ropucha Group:
${c.shares}%

<br>

${
c.inGroup
?"🏛️ Firma w Ropucha Group"
:""
}

`);

}

/* =========================================================
START COMPANIES
========================================================= */

for(
let i=0;
i<24;
i++
){

generateCompany(
true
);

}

setInterval(()=>{

if(
companies.length<
150
){

generateCompany();

render();

}

},45000);

/* =========================================================
INVESTOR OFFER
========================================================= */

function openShareholders(
companyId
){

let c=
companies.find(
x=>x.id===companyId
);

if(!c)return;

openModal(`

<button
class="close"
onclick="closeModal()">
X
</button>

<h2>
📊 Akcjonariat
</h2>

<div class="box">

<h3>
${c.name}
</h3>

<div class="row">
<span>Ropucha Group</span>
<b class="green">
${c.shares}%
</b>
</div>

<div class="shareBar">

<div
class="shareFill"
style="width:${c.shares}%">
</div>

</div>

</div>

${c.shareholders.map(inv=>`

<div class="investor">

<div class="row">

<span>
👤 ${inv.name}
</span>

<b>
${inv.shares}%
</b>

</div>

${
inv.shares>0
?`

<div class="grid3">

<button
class="btn"
onclick="
openInvestorOffer(
'${c.id}',
${inv.id},
1
)
">
Kup 1%
</button>

<button
class="btn"
onclick="
openInvestorOffer(
'${c.id}',
${inv.id},
5
)
">
Kup 5%
</button>

<button
class="btn orange"
onclick="
openInvestorOffer(
'${c.id}',
${inv.id},
${inv.shares}
)
">
Cały pakiet
</button>

</div>

`
:""}

</div>

`).join("")}

${
c.controlled &&
!c.inGroup
?`

<button
class="btn purple"
onclick="
addCompanyToGroup(
'${c.id}'
)
">
🏛️ Włącz firmę do Ropucha Group
</button>

`
:""}

${
c.inGroup
?`

<div class="box green">
🏛️ Firma należy do grupy kapitałowej.
</div>

`
:""}

`);

}

/* =========================================================
NEGOTIATIONS
========================================================= */

function openInvestorOffer(
companyId,
investorId,
wanted
){

let c=
companies.find(
x=>x.id===companyId
);

if(!c)return;

let investor=
c.shareholders.find(
x=>x.id===investorId
);

if(!investor)return;

wanted=
Math.min(
wanted,
investor.shares
);

let marketValue=
c.valuation*
wanted/100;

openModal(`

<button
class="close"
onclick="
openShareholders(
'${c.id}'
)
">
←
</button>

<h2>
🤝 Oferta odkupu
</h2>

<div class="box">

<h3>
${investor.name}
</h3>

<div class="row">
<span>Posiada</span>
<b>
${investor.shares}%
</b>
</div>

<div class="row">
<span>Chcesz kupić</span>
<b>
${wanted}%
</b>
</div>

<div class="row">
<span>Wartość rynkowa</span>
<b>
${moneyText(
marketValue
)}
</b>
</div>

</div>

<button
class="btn gray"
onclick="
makeInvestorOffer(
'${c.id}',
${investor.id},
${wanted},
1
)
">
💬 100% wartości
—
${moneyText(
marketValue
)}
</button>

<button
class="btn blue"
onclick="
makeInvestorOffer(
'${c.id}',
${investor.id},
${wanted},
1.15
)
">
💬 115% wartości
—
${moneyText(
marketValue*1.15
)}
</button>

<button
class="btn orange"
onclick="
makeInvestorOffer(
'${c.id}',
${investor.id},
${wanted},
1.35
)
">
💰 135% wartości
—
${moneyText(
marketValue*1.35
)}
</button>

<button
class="btn red"
onclick="
makeInvestorOffer(
'${c.id}',
${investor.id},
${wanted},
1.60
)
">
🔥 160% wartości
—
${moneyText(
marketValue*1.60
)}
</button>

`);

}

function makeInvestorOffer(
companyId,
investorId,
wanted,
multiplier
){

let c=
companies.find(
x=>x.id===companyId
);

if(!c)return;

let investor=
c.shareholders.find(
x=>x.id===investorId
);

if(!investor)return;

wanted=
Math.min(
wanted,
investor.shares
);

if(wanted<=0)return;

let price=
Math.floor(
c.valuation*
wanted/100*
multiplier
);

if(money<price){

notify(
"❌ Brakuje pieniędzy."
);

return;

}

/*
Szansa akceptacji.
*/

let chance;

if(multiplier>=1.6)
chance=.98;

else if(multiplier>=1.35)

chance=.60;

else
chance=.30;

tym trudniej.

if(wanted>=20)
chance-=.12;

Math.random()>
chance
){

investor.name+
" odrzucił ofertę."
);

openShareholders(
companyId
);

return;

}

/*
Transakcja.
*/

changeMoney(
-price
);

investor.shares-=
wanted;

c.shares+=
wanted;

if(c.shares>50){

c.controlled=true;

}

if(c.shares>=100){

c.shares=100;
c.controlled=true;
c.acquired=true;

/* =========================================================

========================================================= */

function productAvailable(
store,
product
){

if(
product.id==="coffee" &&
!store.coffeeMachine
)
return false;

if(
product.id==="pizza" &&
!store.pizzaOven
)
return false;

if(
product.id==="hotdog" &&
!store.hotdogMachine
)
return false;

return true;

}

function processStores(){

let revenue=0;

stores.forEach(store=>{

store.customersToday=0;
store.lostToday=0;
store.revenueToday=0;

let capacity=
40+
store.checkoutLevel*
35;

let potential=
Math.floor(
40+
reputation*.8+
random(
-10,
20
)
);

potential=
Math.max(
5,
potential
);

let served=
Math.min(
potential,
capacity
);

store.lostToday+=
Math.max(
0,
potential-capacity
);

for(
let i=0;
i<served;
i++
){

let available=
productCatalog.filter(
p=>
productAvailable(
store,
p
) &&
store.products[
p.id
].stock>0
);

if(
available.length===0
){

store.lostToday++;

continue;

}

let product=
choice(
available
);

let item=
store.products[
product.id
];

let price=
item.price;

if(
item.promotionDays>0
){

price*=
1-
item.promotion/
100;

}

let ratio=
price/
product.defaultPrice;

let chance=
Math.max(
.15,
Math.min(
.95,
1.15-
ratio*.45
)
);

if(
item.promotionDays>0
){

chance+=.12;

}

if(
Math.random()<
chance
){

item.stock--;

revenue+=
price;

store.revenueToday+=
price;

store.customersToday++;

}else{

store.lostToday++;

}

}

/*
Promocje liczymy raz na dzień,
a nie raz na klienta.
*/

Object.values(
store.products
)
.forEach(item=>{

if(
item.promotionDays>0
){

item.promotionDays--;

if(
item.promotionDays<=0
){

item.promotion=0;

}

}

});

totalCustomers+=
store.customersToday;

lostCustomers+=
store.lostToday;

updateStorePopup(
store
);

});

return Math.floor(
revenue
);

}

/* =========================================================

========================================================= */

function cleanObject(
object
){

let copy={
...object
};

delete copy.marker;
delete copy.line;

return copy;

}

function saveGame(
silent=false
){

let data={

money,
day,
reputation,
fuelPrice,

maxFranchisees,
maxDrivers,

franchisees,

stores:
stores.map(
cleanObject
),

centers:
centers.map(
cleanObject
),

drivers,
trucks,

routes:
routes.map(r=>{

let copy={
...r
};

delete copy.line;

return copy;

}),

companies:
companies.map(
cleanObject
),

contracts,

competitors:
competitors.map(
cleanObject
),

subsidiaries,

nextStoreId,
nextCenterId,
nextDriverId,
nextTruckId,
nextRouteId,
nextCompanyId,
nextContractId,
nextSubsidiaryId,
nextInvestorId,

totalRevenue,
totalExpenses,
totalDividends,
totalCustomers,
lostCustomers

};

localStorage.setItem(
"ropucha_group_save_v3",
JSON.stringify(
data
)
);

if(!silent){

notify(
"💾 Gra zapisana."
);

}

}

========================================================= */

function changeMoney(
amount,
animate=true
){

money+=
amount;

if(animate){

let fx=
document.createElement(
"div"
);

fx.className=
"moneyFx "+
(
amount>=0
?"plus"
:"minus"
);

fx.textContent=
(
amount>=0
?"+"
:""
)+
moneyText(
amount
);

document.body.appendChild(
fx
);

setTimeout(
()=>fx.remove(),
1400
);

}

document.getElementById(
"money"
)
.textContent=
moneyText(
money
);

}

/* =========================================================
CONSOLE
========================================================= */

const devConsole=
document.getElementById(
"console"
);

const consoleInput=
document.getElementById(
"consoleInput"
);

const consoleHistory=
document.getElementById(
"consoleHistory"
);

let consoleOpen=false;

window.addEventListener(
"keydown",
event=>{

if(
event.key==="`" ||
event.key==="~"
){

event.preventDefault();

consoleOpen=
!consoleOpen;

devConsole.style.display=
consoleOpen
?"block"
:"none";

if(consoleOpen){

setTimeout(
()=>consoleInput.focus(),
20
);

}

return;

}

if(
event.key==="Escape"
){

if(consoleOpen){

consoleOpen=false;

devConsole.style.display=
"none";

}else{

buildMode=null;
hideBuild();

}

}

}
);

consoleInput.addEventListener(
"keydown",
event=>{

if(
event.key!=="Enter"
)
return;

let command=
consoleInput.value.trim();

consoleInput.value="";

if(!command)
return;

consolePrint(
"> "+command,
"#fff"
);

executeCommand(
command
);

}
);

function consolePrint(
text,
color="#bacabd"
){

let line=
document.createElement(
"div"
);

line.textContent=
text;

line.style.color=
color;

consoleHistory.appendChild(
line
);

consoleHistory.scrollTop=
consoleHistory.scrollHeight;

}

function executeCommand(
command
){

let args=
command.split(
/\s+/
);

let cmd=
args[0]
.toLowerCase();

let value=
Number(
args[1]
);

if(
cmd==="help"
){

consolePrint(
`KOMENDY:

kasa [kwota]
maxfranczyzobiorcy [liczba]
maxkierowcy [liczba]
reputacja [0-100]
firma
firmy [liczba]
dzien
paliwo [cena]
status
save
clear`
);

return;

}

if(
cmd==="kasa"
){

if(
!Number.isFinite(
value
)
)return;

money=
Math.max(
0,
value
);

render();

return;

}

if(
cmd===
"maxfranczyzobiorcy"
){

if(
!Number.isFinite(
value
)
)return;

maxFranchisees=
Math.max(
0,
Math.floor(
value
)
);

render();

return;

}

if(
cmd===
"maxkierowcy"
){

if(
!Number.isFinite(
value
)
)return;

maxDrivers=
Math.max(
0,
Math.floor(
value
)
);

render();

return;

}

if(
cmd==="reputacja"
){

if(
!Number.isFinite(
value
)
)return;

reputation=
Math.max(
0,
Math.min(
100,
value
)
);

render();

return;

}

if(
cmd==="firma"
){

generateCompany();

render();

return;

}

if(
cmd==="firmy"
){

let count=
Math.max(
1,
Math.min(
100,
Math.floor(
value||1
)
)
);

for(
let i=0;
i<count;
i++
){

generateCompany(
true
);

}

render();

return;

}

if(
cmd==="dzien"
){

processDay();

return;

}

if(
cmd==="paliwo"
){

if(
!Number.isFinite(
value
)
)return;

fuelPrice=
Math.max(
.1,
value
);

render();

return;

}

if(
cmd==="save"
){

saveGame();

return;

}

if(
cmd==="status"
){

consolePrint(
`Dzień: ${day}
Kasa: ${moneyText(money)}
Reputacja: ${reputation.toFixed(1)}
Sklepy: ${stores.length}
Spółki córki: ${subsidiaries.length}
Firmy w grupie: ${companies.filter(c=>c.inGroup).length}
Firmy 100%: ${companies.filter(c=>c.acquired).length}
Franczyzobiorcy: ${franchisees.length}/${maxFranchisees}
Centra: ${centers.length}
Kierowcy: ${drivers.length}/${maxDrivers}
Ciężarówki: ${trucks.length}
Trasy: ${routes.length}
Kontrakty: ${contracts.length}`
);

return;

}

if(
cmd==="clear"
){

consoleHistory.innerHTML="";

return;

}

consolePrint(
"Nieznana komenda. Wpisz help.",
"#ff6969"
);

}

function random(
min,
max
){

return Math.floor(
Math.random()*
(
max-min+1
)
)+min;

}

function randomFloat(
min,
max
){

return (
Math.random()*
(
max-min
)
)+min;

}

function choice(
array
){

return array[
Math.floor(
Math.random()*
array.length
)
];

}

function randomName(){

return (
choice(
firstNames
)+
" "+
choice(
lastNames
)
);

}

function getProduct(
id
){

return productCatalog.find(
x=>x.id===id
);

}

function moneyText(
value
){

return Math.round(
value
)
.toLocaleString(
"pl-PL"
)+
" zł";

}

function number(
value
){

return Math.round(
value
)
.toLocaleString(
"pl-PL"
);

}

function escapeHtmlAttribute(
value
){

return String(
value
)
.replaceAll(
"&",
"&amp;"
)
.replaceAll(
'"',
"&quot;"
)
.replaceAll(
"<",
"&lt;"
)
.replaceAll(
">",
"&gt;"
);

}

function escapeJs(
value
){

return String(
value
)
.replaceAll(
"\\",
"\\\\"
)
.replaceAll(
"'",
"\\'"
);

}
