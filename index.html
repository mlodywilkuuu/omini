<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>NEW YEAR — WORLD COUNTDOWN</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101f32;--line:#29415b;--gold:#ffd477;--muted:#9bb0c8;--white:#f7fbff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--white);background:radial-gradient(ellipse at 50% 42%,#183653 0,#0b1c2e 48%,#050b14 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;background-image:radial-gradient(2px 2px at 12% 18%,#fff 45%,transparent 55%),radial-gradient(1px 1px at 78% 28%,#fff 45%,transparent 55%),radial-gradient(2px 2px at 65% 78%,#fff 45%,transparent 55%),radial-gradient(1px 1px at 32% 70%,#fff 45%,transparent 55%),radial-gradient(1px 1px at 91% 61%,#fff 45%,transparent 55%);background-size:380px 310px}
.app{height:100dvh;width:100vw;padding:clamp(18px,3vw,48px);display:flex;flex-direction:column;position:relative}
header{text-align:center;flex:0 0 auto}
.kicker{font-size:clamp(10px,1vw,14px);letter-spacing:.42em;color:var(--gold);font-weight:800}
h1{margin:.28em 0 0;font-size:clamp(22px,3.3vw,48px);letter-spacing:.08em;font-weight:850}
.subtitle{margin:.55em 0 0;color:var(--muted);font-size:clamp(11px,1.1vw,15px);letter-spacing:.12em}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.75fr) minmax(240px,1fr);grid-template-rows:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,26px);max-width:1500px;width:100%;margin:clamp(18px,3vh,36px) auto 0}
.card{position:relative;min-width:0;min-height:0;border:0;border-radius:0;background:transparent;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(14px,2.4vw,34px);overflow:hidden}
.card:before{display:none}
.card.main{grid-row:1/4;background:transparent;--accent:var(--gold)}
.card.small{--accent:#78bfe8}
.flag{font-size:clamp(26px,3vw,42px);font-weight:850;letter-spacing:.04em;color:var(--accent)}
.place{margin-top:8px;font-size:clamp(17px,2vw,27px);font-weight:800}
.zone{margin-top:5px;color:var(--muted);font-size:clamp(11px,1vw,14px);letter-spacing:.08em}
.timer{display:flex;align-items:baseline;justify-content:center;gap:clamp(5px,1.1vw,16px);margin:clamp(18px,4vh,42px) 0 0;font-variant-numeric:tabular-nums}
.unit{display:flex;flex-direction:column;align-items:center;min-width:0}
.num{font-size:clamp(30px,5.3vw,78px);font-weight:850;line-height:1;letter-spacing:-.055em}
.main .num{font-size:clamp(48px,10.5vw,154px);text-shadow:0 0 36px #ffd47722}
.unit-label{font-size:clamp(8px,.75vw,11px);color:var(--muted);letter-spacing:.16em;margin-top:10px}
.sep{font-size:clamp(22px,3vw,42px);color:#68829e;opacity:.65}
.main .sep{font-size:clamp(32px,6vw,80px)}
.status{margin-top:clamp(15px,3vh,28px);font-size:clamp(9px,.9vw,12px);color:var(--muted);letter-spacing:.18em;text-transform:uppercase}
.main .status{color:var(--gold)}
footer{flex:0 0 auto;text-align:center;color:#7890a9;font-size:clamp(9px,.8vw,11px);letter-spacing:.12em;padding-top:14px}
.celebrate{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.burst{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 16px 5px #ffd47766;animation:burst 1.8s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.2);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@media(max-width:700px){.app{padding:14px}.stage{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1.35fr) minmax(0,1fr);gap:10px;margin-top:16px}.card.main{grid-column:1/4;grid-row:1}.card.small{padding:10px 6px}.main .num{font-size:clamp(45px,12vw,90px)}.num{font-size:clamp(24px,6vw,42px)}.timer{gap:5px;margin-top:18px}.unit-label{font-size:8px}.place{font-size:13px}.zone{font-size:9px}.flag{font-size:11px}}
@media(max-height:520px){.app{padding:10px 20px}header h1{font-size:22px}.subtitle{margin-top:3px}.stage{margin-top:10px}.timer{margin-top:12px}.status{margin-top:10px}.card{padding:10px}}
</style>
</head>
<body>
<div class="app">
<header><div class="kicker">ONE WORLD · ONE MIDNIGHT AT A TIME</div><h1>NEW YEAR WORLD COUNTDOWN</h1><p class="subtitle">WSPÓLNE ODLICZANIE DO NOWEGO ROKU · 2027</p></header>
<main class="stage" id="stage"><section class="card main" id="mainCard"></section><section class="card small" id="small1"></section><section class="card small" id="small2"></section><section class="card small" id="small3"></section></main>
<footer id="testMode">← / → ZMIANA STREFY · HOME POWRÓT DO CZASU NA ŻYWO</footer>
</div>
<script>
(()=>{
 const YEAR=2027;
 const fallback=["Pacific/Kiritimati","Pacific/Chatham","Pacific/Auckland","Australia/Sydney","Asia/Tokyo","Asia/Seoul","Asia/Shanghai","Asia/Singapore","Asia/Bangkok","Asia/Dhaka","Asia/Kathmandu","Asia/Kolkata","Asia/Dubai","Asia/Tehran","Europe/Moscow","Europe/Istanbul","Europe/Berlin","Europe/London","Atlantic/Azores","America/Sao_Paulo","America/St_Johns","America/Halifax","America/New_York","America/Chicago","America/Denver","America/Los_Angeles","America/Anchorage","Pacific/Honolulu","Etc/GMT+10","Etc/GMT+11"];
 const zones=(typeof Intl.supportedValuesOf==="function"?Intl.supportedValuesOf("timeZone"):fallback);
 const fmt=(zone,opts,date)=>new Intl.DateTimeFormat("en-GB",{timeZone:zone,...opts}).format(date);
 const getOffset=(zone,date)=>{const parts=new Intl.DateTimeFormat("en-US",{timeZone:zone,timeZoneName:"longOffset"}).formatToParts(date);return parts.find(p=>p.type==="timeZoneName")?.value||"UTC"};
 const getTarget=(zone)=>{
   const p=new Intl.DateTimeFormat("en-US",{timeZone:zone,year:"numeric",month:"numeric",day:"numeric"}).formatToParts(new Date());
   const now=new Date(), y=now.getUTCFullYear();
   // UTC instant for Jan 1 local midnight, iteratively solve offset at candidate.
   let t=Date.UTC(YEAR,0,1);
   for(let i=0;i<4;i++){const off=getOffset(zone,new Date(t));const m=off.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);let mins=0;if(m)mins=(m[1]==="-"?-1:1)*(Number(m[2])*60+Number(m[3]||0));t=Date.UTC(YEAR,0,1)-mins*60000;}
   return t;
 };
 const names={
 "Pacific/Kiritimati":["Kiritimati","🇰🇮","Kiribati"],"Pacific/Chatham":["Chatham Islands","🇳🇿","Nowa Zelandia"],"Pacific/Auckland":["Auckland","🇳🇿","Nowa Zelandia"],"Australia/Sydney":["Sydney","🇦🇺","Australia"],"Asia/Tokyo":["Tokyo","🇯🇵","Japonia"],"Asia/Seoul":["Seoul","🇰🇷","Korea Południowa"],"Asia/Shanghai":["Beijing / Shanghai","🇨🇳","Chiny"],"Asia/Singapore":["Singapore","🇸🇬","Singapur"],"Asia/Bangkok":["Bangkok","🇹🇭","Tajlandia"],"Asia/Dhaka":["Dhaka","🇧🇩","Bangladesz"],"Asia/Kathmandu":["Kathmandu","🇳🇵","Nepal"],"Asia/Kolkata":["New Delhi","🇮🇳","Indie"],"Asia/Dubai":["Dubai","🇦🇪","Zjednoczone Emiraty Arabskie"],"Asia/Tehran":["Tehran","🇮🇷","Iran"],"Europe/Moscow":["Moscow","🇷🇺","Rosja"],"Europe/Istanbul":["Istanbul","🇹🇷","Turcja"],"Europe/Berlin":["Berlin","🇩🇪","Niemcy"],"Europe/London":["London","🇬🇧","Wielka Brytania"],"Atlantic/Azores":["Azores","🇵🇹","Portugalia"],"America/Sao_Paulo":["São Paulo","🇧🇷","Brazylia"],"America/St_Johns":["St. John's","🇨🇦","Kanada"],"America/Halifax":["Halifax","🇨🇦","Kanada"],"America/New_York":["New York","🇺🇸","Stany Zjednoczone"],"America/Chicago":["Chicago","🇺🇸","Stany Zjednoczone"],"America/Denver":["Denver","🇺🇸","Stany Zjednoczone"],"America/Los_Angeles":["Los Angeles","🇺🇸","Stany Zjednoczone"],"America/Anchorage":["Anchorage","🇺🇸","Stany Zjednoczone"],"Pacific/Honolulu":["Honolulu","🇺🇸","Stany Zjednoczone"],"Etc/GMT+10":["UTC−10","🌐","Strefa oceaniczna"],"Etc/GMT+11":["UTC−11","🌐","Strefa oceaniczna"]
 };
 const pretty=z=>names[z]||[z.split("/").pop().replaceAll("_"," "), "🌍", "Strefa czasowa"];
 // Group every IANA zone by the exact UTC instant when local Jan 1 starts.
 const groups=new Map();
 for(const z of zones){try{const target=getTarget(z);if(target>Date.now()-1000){if(!groups.has(target))groups.set(target,[]);groups.get(target).push(z)}}catch(e){}}
 let events=[...groups.entries()].sort((a,b)=>a[0]-b[0]).map(([target,zs])=>({target,zones:zs.sort((a,b)=>{const aa=pretty(a)[0],bb=pretty(b)[0];return aa.localeCompare(bb)}),zone:zs.find(z=>names[z])||zs[0]}));
 if(!events.length) events=fallback.map(z=>({target:getTarget(z),zones:[z],zone:z})).sort((a,b)=>a.target-b.target);
 let lastIndex=-1, celebrated=new Set(), manualIndex=null;
 const $=id=>document.getElementById(id);
 function timeParts(ms){let s=Math.max(0,Math.floor(ms/1000));return [Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60]}
 function timerHTML(ms,big){const v=timeParts(ms);return '<div class="timer">'+v.map((n,i)=>'<div class="unit"><div class="num">'+String(n).padStart(2,"0")+'</div><div class="unit-label">'+["DNI","GODZ","MIN","SEK"][i]+'</div></div>'+(i<3?'<div class="sep">:</div>':'')).join("")+'</div>'}
 function renderCard(el,event,ms,big,index){const [city,flag,country]=pretty(event.zone);const count=event.zones.length;el.innerHTML='<div class="flag">'+flag+'</div><div class="place">'+city+'</div><div class="zone">'+country+' · '+getOffset(event.zone,new Date(event.target))+' · '+(count>1?count+" STREFY":"LOKALNA STREFA")+'</div><div class="status">'+(big?"NAJBLIŻSZA PÓŁNOC":"NADCHODZI")+'</div>'+timerHTML(ms,big)+'<div class="status">'+(ms<=0?"SZCZĘŚLIWEGO NOWEGO ROKU!":fmt(event.zone,{weekday:"short",day:"2-digit",month:"short"},new Date(event.target)))+'</div>'}
 function fireworks(){const stage=$("stage");for(let j=0;j<5;j++){const x=20+Math.random()*60,y=20+Math.random()*60;for(let i=0;i<22;i++){let p=document.createElement("i");p.className="burst";p.style.left=x+"%";p.style.top=y+"%";let a=Math.PI*2*i/22,r=45+Math.random()*80;p.style.setProperty("--dx",Math.cos(a)*r+"px");p.style.setProperty("--dy",Math.sin(a)*r+"px");stage.appendChild(p);setTimeout(()=>p.remove(),1900)}}}
 function tick(){const now=Date.now();let idx=events.findIndex(e=>e.target>now);if(idx<0)idx=events.length-1;if(manualIndex!==null)idx=manualIndex;
   if(lastIndex!==-1&&idx>lastIndex){for(let i=lastIndex;i<idx;i++){if(!celebrated.has(i)){celebrated.add(i);fireworks()}}}
   lastIndex=idx;
   const slots=[ $("mainCard"),$("small1"),$("small2"),$("small3") ];
   for(let k=0;k<4;k++){const event=events[idx+k];if(!event){slots[k].innerHTML='<div class="flag">WSZYSTKIE STREFY</div><div class="place">Nowy Rok 2027</div><div class="status">ŚWIĘTUJEMY!</div>';continue}renderCard(slots[k],event,event.target-now,k===0,idx+k)}
 }
 document.addEventListener("keydown",e=>{
   if(["ArrowLeft","ArrowRight"].includes(e.key)){
     e.preventDefault();
     const live=events.findIndex(event=>event.target>Date.now());
     const base=manualIndex===null?Math.max(0,live):manualIndex;
     manualIndex=Math.max(0,Math.min(events.length-1,base+(e.key==="ArrowRight"?1:-1)));
     $("testMode").textContent="TRYB TESTOWY · "+(manualIndex+1)+" / "+events.length+" · HOME = CZAS NA ŻYWO";
     tick();
   } else if(e.key==="Home"){
     manualIndex=null;
     $("testMode").textContent="← / → ZMIANA STREFY · HOME POWRÓT DO CZASU NA ŻYWO";
     lastIndex=-1;
     tick();
   }
 });
 tick();setInterval(tick,250);
})();
</script>
</body></html>
