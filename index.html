<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy Empire 2.0 — Rebuild</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#e9f3ff;background:#070c18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#17345b 0%,transparent 42%),radial-gradient(circle at 95% 95%,#15295d 0%,transparent 42%),#070c18;min-height:100vh}button,input,select{font:inherit}button{color:#eff8ff;background:#ffffff13;border:1px solid #ffffff25;padding:10px 13px;border-radius:11px;cursor:pointer;transition:.2s}button:hover{background:#ffffff28;transform:translateY(-1px)}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:linear-gradient(120deg,#13b9b2,#4569f5);border-color:#75e8ff55;font-weight:750}.danger{background:#a43a5155}.glass{background:linear-gradient(140deg,#ffffff18,#ffffff08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid #ffffff22;box-shadow:0 16px 45px #0005}.top{margin:14px;display:flex;align-items:center;gap:16px;justify-content:space-between;padding:14px 20px;border-radius:19px;flex-wrap:wrap}.logo{font-size:19px;font-weight:850;letter-spacing:.5px}.logo b{color:#70f0d8}.topstat{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.topstat strong{display:block;font-size:19px;color:#87f5d4}.small{font-size:12px;color:#b2c5de}.layout{display:grid;grid-template-columns:minmax(310px,1fr) minmax(350px,480px);gap:13px;margin:0 14px 14px;height:calc(100vh - 118px);min-height:650px}.mapwrap{position:relative;overflow:hidden;border-radius:20px}.map{height:100%;width:100%;background:#17263a}.maplabel{position:absolute;top:13px;left:13px;z-index:500;padding:12px 16px;border-radius:14px;pointer-events:none}.panel{border-radius:20px;display:flex;flex-direction:column;min-height:0;overflow:hidden}.panelhead{padding:17px;border-bottom:1px solid #ffffff1a;display:flex;gap:10px;align-items:center}.panelhead select{flex:1;margin:0}.content{padding:18px;overflow:auto;min-height:0}.content h2{margin:0 0 15px;font-size:24px}.content h3{font-size:15px;margin:16px 0 8px}.card{padding:15px;margin:11px 0;border-radius:15px;background:linear-gradient(135deg,#ffffff12,#ffffff07);border:1px solid #ffffff1b}.card b{font-size:14px}.muted{font-size:12px;color:#adbfda;line-height:1.6}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.row>*{flex:1;min-width:0}.row button{flex:0 0 auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:#ffffff0c;padding:14px;border:1px solid #ffffff1b;border-radius:14px}.metric strong{display:block;font-size:21px;color:#9af2e4;margin-top:5px}label{font-size:12px;color:#c1d0e4;display:block;margin:12px 0 5px}input,select{width:100%;background:#08152ac9;color:#eff8ff;border:1px solid #ffffff3b;padding:11px;border-radius:10px}option{background:#12223a}.full{width:100%;margin-top:9px}.tag{display:inline-block;border:1px solid #ffffff26;background:#ffffff10;border-radius:20px;padding:5px 9px;font-size:11px;margin:3px}.positive{color:#89f3b5}.negative{color:#ff9baf}.divider{height:1px;background:#ffffff1b;margin:14px 0}.progress{height:8px;background:#ffffff20;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#19d2b8,#5984ff);transition:width .2s}.notice{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:13px 18px;background:#183a55;border:1px solid #7adad3;border-radius:14px;z-index:2000;box-shadow:0 10px 40px #0008;max-width:90vw}.leaflet-container{font-family:inherit}.marker{font-size:23px;filter:drop-shadow(0 2px 3px #000)}.tools{display:flex;gap:6px;flex-wrap:wrap}.tools button{font-size:12px;padding:7px 10px}@media(max-width:850px){.layout{grid-template-columns:1fr;height:auto}.mapwrap{height:42vh;min-height:280px}.panel{min-height:580px}.topstat{gap:10px}.topstat strong{font-size:15px}}
</style></head><body><header class="top glass"><div class="logo">⚡ ENERGY <b>EMPIRE</b> <span class="small">2.0 · Rebuild</span></div><div class="topstat"><div><span class="small">GOTÓWKA</span><strong id="cashTop">—</strong></div><div><span class="small">DATA GRY</span><strong id="dateTop">—</strong></div><div><span class="small">WYNIK / MIES.</span><strong id="profitTop">—</strong></div></div><div class="tools"><button id="pauseBtn" onclick="togglePause()">⏸ Pauza</button><select id="speed" onchange="setSpeed(this.value)" style="width:135px"><option value="30">30 s / miesiąc</option><option value="12">12 s / miesiąc</option><option value="5">5 s / miesiąc</option><option value="2">2 s / miesiąc</option></select><button onclick="advance()">⏭ Miesiąc</button></div></header><div class="layout"><section class="mapwrap glass"><div class="maplabel glass"><b>🌍 Mapa OpenStreetMap</b><div class="muted" id="mapHint">Kliknij obiekt, aby zobaczyć szczegóły.</div></div><div id="map" class="map"></div></section><aside class="panel glass"><div class="panelhead"><span>☰</span><select id="nav" onchange="showTab(this.value)"></select></div><div class="content" id="content"></div><div style="padding:11px 18px;border-top:1px solid #ffffff20"><div class="row" style="margin:0;justify-content:space-between"><span class="small" id="clockText">Automatyczny czas</span><span class="small" id="clockPct">0%</span></div><div class="progress"><div id="clockBar" style="width:0%"></div></div></div></aside></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
'use strict';const KEY='energy_empire_rebuild_v2';const names=['Polska','Niemcy','Norwegia','USA','Kanada','Francja','Wielka Brytania','Hiszpania','Włochy','Szwecja','Dania','Finlandia','Czechy','Słowacja','Ukraina','Rumunia','Węgry','Austria','Szwajcaria','Holandia','Belgia','Portugalia','Grecja','Turcja','Arabia Saudyjska','Katar','ZEA','Brazylia','Argentyna','Meksyk','Chiny','Indie','Japonia','Australia','RPA','Nigeria','Egipt','Indonezja'];const PRODUCTS={oil:'Ropa',gas:'Gaz',coal:'Węgiel',fuel:'Paliwo',energy:'Energia',steel:'Stal',hydrogen:'Wodór'};const TYPES={oil:{name:'Szyb naftowy',icon:'🛢️',cost:25000000,staff:16,prod:{oil:110},upkeep:85000},gas:{name:'Odwiert gazu',icon:'🔥',cost:21000000,staff:13,prod:{gas:100},upkeep:75000},coal:{name:'Kopalnia węgla',icon:'⛏️',cost:18000000,staff:22,prod:{coal:140},upkeep:65000},refinery:{name:'Rafineria',icon:'🏭',cost:48000000,staff:35,input:{oil:80},prod:{fuel:65},upkeep:150000},coalplant:{name:'Elektrownia węglowa',icon:'⚡',cost:42000000,staff:28,input:{coal:75},prod:{energy:120},upkeep:125000},gasplant:{name:'Elektrownia gazowa',icon:'🔌',cost:35000000,staff:23,input:{gas:70},prod:{energy:125},upkeep:115000},solar:{name:'Farma słoneczna',icon:'☀️',cost:12000000,staff:7,prod:{energy:55},upkeep:25000},wind:{name:'Farma wiatrowa',icon:'🌬️',cost:16000000,staff:9,prod:{energy:75},upkeep:32000},nuclear:{name:'Elektrownia jądrowa',icon:'☢️',cost:150000000,staff:70,prod:{energy:420},upkeep:450000},steel:{name:'Huta stali',icon:'🏗️',cost:65000000,staff:40,input:{coal:45},prod:{steel:60},upkeep:160000},hydrogen:{name:'Zakład wodoru',icon:'🧪',cost:33000000,staff:22,input:{energy:65},prod:{hydrogen:45},upkeep:90000},storage:{name:'Magazyn',icon:'📦',cost:8000000,staff:5,prod:{},upkeep:18000},station:{name:'Stacja paliw',icon:'⛽',cost:3500000,staff:7,input:{fuel:12},prod:{},upkeep:16000}};const TABS=[['overview','🏠 Pulpit'],['industry','🏭 Przemysł i budowa'],['employees','👷 Pracownicy i rekrutacja'],['finance','🏦 Finanse i pożyczki'],['holdings','🏢 Spółki córki'],['market','📈 Giełda i przejęcia'],['contracts','📑 Kontrakty i przetargi'],['research','🔬 Badania i technologie'],['logistics','🚚 Transport i magazyny'],['world','🌍 Kraje i działalność'],['reports','📊 Raporty i historia'],['settings','⚙️ Ustawienia i zapisy']];const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const money=n=>new Intl.NumberFormat('pl-PL',{maximumFractionDigits:0}).format(Math.round(n||0))+' $';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Math.floor(Math.random()*1e9);const productOpts=()=>Object.entries(PRODUCTS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');const countryOpts=(selected='Polska')=>names.map(c=>`<option ${c===selected?'selected':''}>${esc(c)}</option>`).join('');const companyOpts=()=>S.companies.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');function seed(){return {cash:160000000,month:0,paused:false,speed:12,progress:0,tab:'overview',next:100,prices:{oil:30000,gas:22000,coal:14000,fuel:44000,energy:19000,steel:38000,hydrogen:54000},stock:{oil:0,gas:0,coal:0,fuel:0,energy:0,steel:0,hydrogen:0},companies:[{id:1,name:'Energy Empire Holding',parent:null,country:'Polska',countries:['Polska'],cash:0,autonomy:false}],assets:[],workers:[],candidates:[],firms:[],contracts:[],loans:[],technologies:[],researchPoints:0,researchDone:[],routes:[],logs:[],history:[],lastProfit:0,build:null,selected:null,sandbox:false}}let S;try{S=Object.assign(seed(),JSON.parse(localStorage.getItem(KEY)||'null')||{});}catch{S=seed()}for(const k of ['companies','assets','workers','candidates','firms','contracts','loans','technologies','researchDone','routes','logs','history'])if(!Array.isArray(S[k]))S[k]=[];S.stock={...seed().stock,...S.stock};S.prices={...seed().prices,...S.prices};const nextId=()=>++S.next;const company=id=>S.companies.find(c=>c.id===Number(id));const asset=id=>S.assets.find(a=>a.id===Number(id));const toast=t=>{const e=document.createElement('div');e.className='notice';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)};function log(t){S.logs.unshift(`M${S.month}: ${t}`);S.logs=S.logs.slice(0,120)}function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}}function spend(n){if(!S.sandbox&&S.cash<n){toast('Brak środków na koncie');return false}if(!S.sandbox)S.cash-=n;return true}function income(n){S.cash+=n}function hireCandidate(id,co){let i=S.candidates.findIndex(w=>w.id===Number(id));if(i<0)return;const w=S.candidates[i];if(!spend(w.salary))return;S.candidates.splice(i,1);S.workers.push({...w,companyId:Number(co),assetId:null,experience:0});log('Zatrudniono: '+w.name);render()}const FIRST=['Jan','Anna','Piotr','Maria','Tomasz','Julia','Michał','Zofia','Karol','Katarzyna','Adam','Natalia','Filip','Oliwia','Mateusz','Alicja'];const LAST=['Nowak','Kowalski','Wiśniewska','Lewandowski','Zielińska','Wójcik','Kamiński','Dąbrowska','Mazur','Kaczmarek'];const PERKS=['Badacz','Inżynier','Geolog','Finansista','Menedżer','Logistyk','Operator'];function genCandidate(){return{id:nextId(),name:FIRST[rnd(0,FIRST.length-1)]+' '+LAST[rnd(0,LAST.length-1)],perk:PERKS[rnd(0,PERKS.length-1)],skill:rnd(1,5),salary:rnd(28,85)*100}}const CORP=['Nordic','Atlas','Nova','Baltic','Global','Orion','Helios','Vertex','Astra','Pacific','Titan','Aurora'];const SUFFIX=['Energy','Oil','Gas','Power','Resources','Industries','Petroleum'];function genFirm(){let name=CORP[rnd(0,CORP.length-1)]+' '+SUFFIX[rnd(0,SUFFIX.length-1)]+' '+rnd(10,99);return{id:nextId(),name,country:names[rnd(0,names.length-1)],price:rnd(700000,3600000),share:0,workers:rnd(20,180),assets:rnd(1,8),cash:rnd(30,250)*1000000}}const TECH=['Wydajniejsze turbiny','Zaawansowane odwierty','Inteligentne rafinerie','Magazynowanie wodoru','Sieci wysokiego napięcia','Automatyzacja kopalń','Nowe baterie','Wychwytywanie CO₂','Robotyka przemysłowa','Cyfrowe bliźniaki','Efektywny transport LNG','Recykling paliw','Usprawniona geotermia'];function genTech(){return{id:nextId(),name:TECH[rnd(0,TECH.length-1)]+' '+rnd(2,99),cost:rnd(1,12)*1000000,bonus:rnd(2,12),created:S.month}}function genContract(){return{id:nextId(),country:names[rnd(0,names.length-1)],product:Object.keys(PRODUCTS)[rnd(0,6)],qty:rnd(15,90),months:rnd(4,18),premium:rnd(90,130)/100,companyId:1}}function ensureOffers(){while(S.candidates.length<12)S.candidates.push(genCandidate());while(S.firms.length<9)S.firms.push(genFirm());while(S.technologies.length<6)S.technologies.push(genTech());while(S.contracts.filter(c=>!c.active).length<5)S.contracts.push(genContract())}ensureOffers();
let map=null,markers=null,pin=null;try{if(window.L){map=L.map('map',{zoomControl:true}).setView([52.2,19.2],5);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);markers=L.layerGroup().addTo(map);map.on('click',e=>{if(S.build){S.build.lat=e.latlng.lat;S.build.lng=e.latlng.lng;placePin();render()}})}}catch(e){document.getElementById('map').textContent='Mapa niedostępna — wymagane połączenie z internetem.'}function placePin(){if(!map)return;if(pin){map.removeLayer(pin);pin=null}if(S.build&&S.build.lat!=null){pin=L.marker([S.build.lat,S.build.lng],{draggable:true}).addTo(map);pin.on('dragend',()=>{const p=pin.getLatLng();S.build.lat=p.lat;S.build.lng=p.lng;render()})}}function renderMap(){if(!map)return;markers.clearLayers();for(const a of S.assets){const t=TYPES[a.type];if(!t)continue;L.marker([a.lat,a.lng],{icon:L.divIcon({html:`<span class="marker">${t.icon}</span>`,className:'',iconSize:[32,32]})}).addTo(markers).bindTooltip(esc(t.name)).on('click',()=>{S.selected=a.id;showTab('industry')})}placePin()}
function header(title,desc=''){return `<h2>${title}</h2>${desc?`<p class="muted">${desc}</p>`:''}`}function card(t){return `<div class="card">${t}</div>`}function btn(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}function input(id,label,type='number',value=''){return `<label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}">`}function select(id,label,options){return `<label for="${id}">${label}</label><select id="${id}">${options}</select>`}function tabOverview(){let payroll=S.workers.reduce((a,w)=>a+w.salary,0),upkeep=S.assets.reduce((a,b)=>a+(TYPES[b.type]?.upkeep||0),0),debt=S.loans.reduce((a,b)=>a+b.left,0);return header('Centrum dowodzenia','Wszystkie najważniejsze systemy w jednym miejscu.')+`<div class="grid"><div class="metric">Gotówka<strong>${money(S.cash)}</strong></div><div class="metric">Zysk ostatniego miesiąca<strong class="${S.lastProfit<0?'negative':''}">${money(S.lastProfit)}</strong></div><div class="metric">Budynki<strong>${S.assets.length}</strong></div><div class="metric">Pracownicy<strong>${S.workers.length}</strong></div><div class="metric">Spółki<strong>${S.companies.length}</strong></div><div class="metric">Zadłużenie<strong>${money(debt)}</strong></div></div>`+card(`<b>📆 Miesiąc ${S.month+1}</b><p class="muted">Pensje: ${money(payroll)} / mies. · Utrzymanie: ${money(upkeep)} / mies.</p><p class="muted">Czas płynie automatycznie. Prędkość ustawisz na górnym pasku.</p>`)+`<h3>Szybki dostęp</h3><div class="tools">${btn('🏭 Buduj','showTab(\'industry\')','primary')}${btn('👷 Zatrudniaj','showTab(\'employees\')')}${btn('🏦 Pożyczki','showTab(\'finance\')')}${btn('📈 Giełda','showTab(\'market\')')}</div><h3>Ostatnie wydarzenia</h3>`+(S.logs.slice(0,6).map(x=>card(`<span class="muted">${esc(x)}</span>`)).join('')||card('Rozpocznij budowę pierwszego zakładu.'))}
function tabIndustry(){let build=S.build;return header('Przemysł i inwestycje','Wybierz typ budynku, wskaż punkt na mapie i zatwierdź budowę.')+select('buildType','Rodzaj obiektu',Object.entries(TYPES).map(([k,t])=>`<option value="${k}" ${build?.type===k?'selected':''}>${t.icon} ${t.name} — ${money(t.cost)}</option>`).join(''))+select('buildOwner','Spółka właściciel',companyOpts())+select('buildCountry','Kraj działalności',countryOpts(build?.country||'Polska'))+`<div class="tools" style="margin-top:13px">${btn('📍 Wskaż miejsce na mapie','startBuild()','primary')}${build?.lat!=null?btn('✓ Potwierdź budowę','confirmBuild()','primary'):''}${build?btn('Anuluj','cancelBuild()'):''}</div>`+(build?.lat!=null?card(`<b>Wybrana lokalizacja</b><p class="muted">${build.lat.toFixed(5)}, ${build.lng.toFixed(5)} — znacznik można przesuwać.</p>`):'')+`<h3>Twoje obiekty (${S.assets.length})</h3>`+(S.assets.map(a=>{const t=TYPES[a.type];return card(`<b>${t.icon} ${esc(t.name)}</b><p class="muted">${esc(a.country)} · ${esc(company(a.companyId)?.name||'Spółka')} · Obsada ${S.workers.filter(w=>w.assetId===a.id).length}/${t.staff}</p><div class="tools">${btn('Pokaż','focusAsset('+a.id+')')}${btn('Przypisz pracowników','assignWorkers('+a.id+')')}${btn('Sprzedaj','sellAsset('+a.id+')','danger')}</div>`)}).join('')||card('Nie masz jeszcze żadnych obiektów.'))}
function tabEmployees(){return header('Kadry i rekrutacja','Kandydaci pojawiają się automatycznie. Pracownicy co miesiąc pobierają pensje.')+`<div class="grid"><div class="metric">Zatrudnieni<strong>${S.workers.length}</strong></div><div class="metric">Płace miesięczne<strong>${money(S.workers.reduce((n,w)=>n+w.salary,0))}</strong></div></div>`+select('hireCompany','Zatrudnij do spółki',companyOpts())+`<h3>Rynek pracy (${S.candidates.length})</h3>`+S.candidates.map(w=>card(`<b>👤 ${esc(w.name)}</b><p class="muted">Perk: ${esc(w.perk)} · Umiejętności ${w.skill}/5 · Pensja ${money(w.salary)}/mies.</p>${btn('Zatrudnij','hireCandidate('+w.id+',document.getElementById(\'hireCompany\').value)','primary')}`)).join('')+`<h3>Zatrudnieni (${S.workers.length})</h3>`+(S.workers.map(w=>card(`<b>${esc(w.name)}</b><p class="muted">${esc(w.perk)} · ${esc(company(w.companyId)?.name||'Spółka')} · ${money(w.salary)}/mies. · XP ${w.experience||0}</p><div class="tools">${btn('Zwolnij','fireWorker('+w.id+')','danger')}</div>`)).join('')||card('Brak zatrudnionych.'))}
function tabFinance(){let debt=S.loans.reduce((n,l)=>n+l.left,0);return header('Finanse i bank','Kredyty, raty, saldo i własny cennik sprzedaży.')+`<div class="grid"><div class="metric">Saldo<strong>${money(S.cash)}</strong></div><div class="metric">Pozostały dług<strong>${money(debt)}</strong></div></div>`+input('loanAmount','Kwota pożyczki ($)','number',10000000)+select('loanTerm','Okres kredytu','<option value="12">12 miesięcy — 8% rocznie</option><option value="36">36 miesięcy — 10% rocznie</option><option value="60">60 miesięcy — 12% rocznie</option>')+btn('Weź pożyczkę','takeLoan()','primary')+`<h3>Aktywne kredyty</h3>`+(S.loans.map(l=>card(`<b>Pożyczka ${money(l.principal)}</b><p class="muted">Do spłaty: ${money(l.left)} · Rata: ${money(l.payment)} · Pozostało ${l.months} mies.</p>${btn('Spłać całość','repayLoan('+l.id+')')}`)).join('')||card('Brak aktywnych pożyczek.'))+`<h3>Twoje ceny sprzedaży</h3>`+Object.entries(PRODUCTS).map(([k,v])=>input('price_'+k,v+' — $ / jednostkę','number',S.prices[k])).join('')+btn('Zapisz ceny','savePrices()','primary')+`<h3>Tryb testowy</h3><div class="tools">${btn('+ 1 mln $','debugCash(1000000)')}${btn('− 1 mln $','debugCash(-1000000)')}</div>`}
function tabHoldings(){return header('Holding i spółki córki','Spółka córka może mieć kolejne spółki córki i działać w wielu państwach.')+input('companyName','Nazwa nowej spółki','text','Nowa spółka')+select('companyParent','Spółka nadrzędna',companyOpts())+select('companyCountry','Kraj rejestracji',countryOpts())+btn('Utwórz spółkę','addCompany()','primary')+`<h3>Struktura holdingu</h3>`+S.companies.map(c=>card(`<b>🏢 ${esc(c.name)}</b><p class="muted">ID ${c.id} · Nadrzędna: ${esc(company(c.parent)?.name||'brak')} · ${esc(c.country)}</p><p class="muted">Kraje: ${c.countries.map(esc).join(', ')}</p><div class="tools">${btn('Dodaj kraj','addCountry('+c.id+')')}${btn('Przelew','transferTo('+c.id+')')}${btn(c.autonomy?'Wyłącz AI':'Włącz AI','toggleAutonomy('+c.id+')')}</div>`)).join('')}
function tabMarket(){return header('Giełda i przejęcia','Nowe firmy AI powstają z czasem. Przy ponad 50% udziałów masz kontrolę, a przy 100% możesz przejąć majątek.')+S.firms.map(f=>card(`<b>📈 ${esc(f.name)}</b><p class="muted">${esc(f.country)} · Udziały ${f.share}% · Cena 1%: ${money(f.price)} · Pracownicy: ${f.workers} · Budynki: ${f.assets}</p><div class="tools">${btn('Kup 1%','buyShares('+f.id+',1)')}${btn('Kup 10%','buyShares('+f.id+',10)')}${btn('Do 100%','buyShares('+f.id+','+(100-f.share)+')','primary')}${f.share>50?btn('Panel zarządzania','manageFirm('+f.id+')'):''}${f.share===100?btn('Pełne przejęcie','takeover('+f.id+')','primary'):''}</div>`)).join('')}
function tabContracts(){return header('Kontrakty i przetargi','Podpisuj umowy na dostawy. Produkty muszą być dostępne w magazynach spółki.')+`<h3>Oferty</h3>`+S.contracts.filter(c=>!c.active).map(c=>card(`<b>📃 ${esc(c.country)} — ${esc(PRODUCTS[c.product])}</b><p class="muted">${c.qty} jednostek / miesiąc · ${c.months} miesięcy · cena ${money(S.prices[c.product]*c.premium)} / jedn.</p>${btn('Podpisz kontrakt','acceptContract('+c.id+')','primary')}`)).join('')+`<h3>Aktywne umowy</h3>`+(S.contracts.filter(c=>c.active).map(c=>card(`<b>${esc(c.country)} — ${esc(PRODUCTS[c.product])}</b><p class="muted">${c.qty} jedn./mies. · ${c.months} mies. do końca</p>${btn('Rozwiąż','cancelContract('+c.id+')','danger')}`)).join('')||card('Brak aktywnych umów.'))}
function tabResearch(){let researchers=S.workers.filter(w=>w.perk==='Badacz');let rate=2+researchers.reduce((a,w)=>a+w.skill*3,0);return header('Badania i technologie','Nowe projekty powstają automatycznie. Badacze zwiększają tempo zdobywania punktów nauki.')+`<div class="grid"><div class="metric">Punkty badań<strong>${Math.floor(S.researchPoints)}</strong></div><div class="metric">Przyrost / miesiąc<strong>+${rate}</strong></div><div class="metric">Badacze<strong>${researchers.length}</strong></div><div class="metric">Odkryte<strong>${S.researchDone.length}</strong></div></div><h3>Dostępne projekty</h3>`+S.technologies.map(t=>card(`<b>🔬 ${esc(t.name)}</b><p class="muted">Koszt: ${money(t.cost)} i ${t.bonus*7} punktów badań · Premia do wydajności +${t.bonus}%</p>${btn('Opracuj','research('+t.id+')','primary')}`)).join('')+`<h3>Opracowane technologie</h3>`+(S.researchDone.map(t=>`<span class="tag">${esc(t.name)}</span>`).join('')||'<p class="muted">Jeszcze nic nie opracowano.</p>')}
function tabLogistics(){return header('Transport i magazyny','Produkcja trafia do zapasów. Zakłady przetwórcze zużywają surowce, a kontrakty pobierają towary.')+`<h3>Zapasy koncernu</h3><div class="grid">`+Object.entries(PRODUCTS).map(([k,v])=>`<div class="metric">${v}<strong>${Math.floor(S.stock[k]||0)}</strong></div>`).join('')+`</div><h3>Sprzedaż rynkowa</h3>`+select('sellProduct','Produkt',productOpts())+input('sellQty','Liczba jednostek','number',10)+btn('Sprzedaj zapasy','sellStock()','primary')+`<h3>Transport między zakładami</h3><p class="muted">Połączenia logistyczne są planowane między Twoimi obiektami. Transport w obecnej wersji jest uproszczony i rozliczany w ramach wspólnych zapasów koncernu.</p>`+(S.assets.length>1?select('routeFrom','Z obiektu',S.assets.map(a=>`<option value="${a.id}">${esc(TYPES[a.type].name)} (${esc(a.country)})</option>`).join(''))+select('routeTo','Do obiektu',S.assets.map(a=>`<option value="${a.id}">${esc(TYPES[a.type].name)} (${esc(a.country)})</option>`).join(''))+btn('Dodaj trasę','addRoute()'):card('Zbuduj co najmniej dwa obiekty, aby dodać trasę.'))+S.routes.map(r=>card(`<b>🚚 ${esc(TYPES[asset(r.from)?.type]?.name||'Obiekt')} → ${esc(TYPES[asset(r.to)?.type]?.name||'Obiekt')}</b>`)).join('')}
function tabWorld(){return header('Świat i kraje','Spółki mogą prowadzić działalność w wielu krajach. Budynki przypisujesz do kraju przy inwestycji.')+`<div class="grid"><div class="metric">Kraje na liście<strong>${names.length}</strong></div><div class="metric">Kraje działalności<strong>${new Set(S.companies.flatMap(c=>c.countries)).size}</strong></div></div><h3>Państwa działalności</h3>`+S.companies.map(c=>card(`<b>${esc(c.name)}</b><p class="muted">${c.countries.map(esc).join(', ')}</p>`)).join('')+`<p class="muted">Lista krajów jest w tej przebudowanej wersji skrócona. Nie jest to jeszcze komplet 195 państw.</p>`}
function tabReports(){return header('Raporty i historia','Wyniki ekonomiczne naliczane co miesiąc.')+`<h3>Ostatnie miesiące</h3>`+(S.history.slice(-18).reverse().map(h=>card(`<b>Miesiąc ${h.month}</b><p class="muted">Przychód ${money(h.revenue)} · Koszty ${money(h.costs)} · Wynik <span class="${h.profit>=0?'positive':'negative'}">${money(h.profit)}</span> · Gotówka ${money(h.cash)}</p>`)).join('')||card('Historia pojawi się po pierwszym miesiącu.'))+`<h3>Dziennik zdarzeń</h3>`+S.logs.slice(0,45).map(x=>`<div class="muted" style="padding:8px 0;border-bottom:1px solid #ffffff16">${esc(x)}</div>`).join('')}
function tabSettings(){return header('Ustawienia i zapisy','Gra zapisuje się automatycznie w tej przeglądarce.')+`<p class="muted">Zapis lokalny: ${esc(KEY)}. Po zamknięciu strony czas nie nalicza się w tle.</p><div class="tools">${btn('Zapisz teraz','save();toast(\'Zapisano grę\')','primary')}${btn('Eksport JSON','exportGame()')}${btn('Nowa gra','resetGame()','danger')}</div><label>Import zapisu JSON</label><input type="file" accept=".json,application/json" onchange="importGame(this)"><label><input type="checkbox" id="sandbox" style="width:auto" ${S.sandbox?'checked':''} onchange="S.sandbox=this.checked;render()"> Tryb sandbox — nieograniczony budżet budowy</label>`}
const VIEWS={overview:tabOverview,industry:tabIndustry,employees:tabEmployees,finance:tabFinance,holdings:tabHoldings,market:tabMarket,contracts:tabContracts,research:tabResearch,logistics:tabLogistics,world:tabWorld,reports:tabReports,settings:tabSettings};function render(){ensureOffers();document.getElementById('cashTop').textContent=money(S.cash);document.getElementById('dateTop').textContent='Miesiąc '+(S.month+1);document.getElementById('profitTop').textContent=money(S.lastProfit);document.getElementById('profitTop').className=S.lastProfit<0?'negative':'positive';document.getElementById('pauseBtn').textContent=S.paused?'▶ Wznów':'⏸ Pauza';document.getElementById('speed').value=String(S.speed);document.getElementById('nav').value=S.tab;document.getElementById('content').innerHTML=(VIEWS[S.tab]||tabOverview)();document.getElementById('mapHint').textContent=S.build?'Kliknij mapę, aby ustawić dokładną lokalizację.':'Kliknij obiekt, aby nim zarządzać.';renderMap();save()}function showTab(t){S.tab=t;render()}document.getElementById('nav').innerHTML=TABS.map(([id,name])=>`<option value="${id}">${name}</option>`).join('');
function startBuild(){const type=document.getElementById('buildType').value,owner=Number(document.getElementById('buildOwner').value),country=document.getElementById('buildCountry').value;S.build={type,owner,country,lat:null,lng:null};toast('Kliknij dokładne miejsce na mapie');render()}function cancelBuild(){S.build=null;render()}function confirmBuild(){const b=S.build;if(!b||b.lat==null)return toast('Najpierw wskaż punkt na mapie');const t=TYPES[b.type];if(!spend(t.cost))return;const a={id:nextId(),type:b.type,companyId:b.owner,country:b.country,lat:b.lat,lng:b.lng,condition:100};S.assets.push(a);const c=company(b.owner);if(c&&!c.countries.includes(b.country))c.countries.push(b.country);log('Zbudowano: '+t.name+' w '+b.country);S.build=null;render()}function focusAsset(id){const a=asset(id);if(a&&map){map.setView([a.lat,a.lng],11)}}function assignWorkers(id){const a=asset(id);if(!a)return;const free=S.workers.filter(w=>w.companyId===a.companyId&&!w.assetId);if(!free.length)return toast('Brak wolnych pracowników tej spółki — zatrudnij nowych');let count=0;for(const w of free.slice(0,TYPES[a.type].staff-S.workers.filter(w=>w.assetId===id).length)){w.assetId=id;count++}toast('Przypisano '+count+' pracowników');render()}function sellAsset(id){const a=asset(id);if(!a||!confirm('Sprzedać obiekt za 60% kosztu budowy?'))return;income(TYPES[a.type].cost*.6);S.workers.filter(w=>w.assetId===id).forEach(w=>w.assetId=null);S.assets=S.assets.filter(x=>x.id!==id);log('Sprzedano obiekt');render()}function fireWorker(id){const w=S.workers.find(w=>w.id===id);if(!w)return;S.workers=S.workers.filter(x=>x.id!==id);log('Zwolniono '+w.name);render()}function takeLoan(){let amount=Number(document.getElementById('loanAmount').value),term=Number(document.getElementById('loanTerm').value);if(!Number.isFinite(amount)||amount<100000||amount>500000000)return toast('Kwota od 100 tys. do 500 mln $');const rate=term===12?.08:term===36?.10:.12;const total=amount*(1+rate*term/12);S.loans.push({id:nextId(),principal:amount,left:total,payment:total/term,months:term});income(amount);log('Zaciągnięto kredyt '+money(amount));render()}function repayLoan(id){const l=S.loans.find(x=>x.id===id);if(!l||!spend(l.left))return;S.loans=S.loans.filter(x=>x.id!==id);log('Spłacono kredyt');render()}function savePrices(){for(const k of Object.keys(PRODUCTS)){const n=Number(document.getElementById('price_'+k).value);if(!Number.isFinite(n)||n<=0||n>1e8)return toast('Nieprawidłowa cena');S.prices[k]=n}toast('Zapisano cennik');render()}function debugCash(n){income(n);log('Zmiana gotówki w trybie testowym: '+money(n));render()}function addCompany(){const name=document.getElementById('companyName').value.trim(),parent=Number(document.getElementById('companyParent').value),country=document.getElementById('companyCountry').value;if(!name)return toast('Podaj nazwę');S.companies.push({id:nextId(),name,parent,country,countries:[country],cash:0,autonomy:false});log('Założono spółkę '+name);render()}function addCountry(id){const c=company(id);if(!c)return;const k=prompt('Podaj kraj działalności (np. Niemcy):');if(!k)return;if(!c.countries.includes(k.trim()))c.countries.push(k.trim());render()}function transferTo(id){const c=company(id);if(!c)return;const n=Number(prompt('Kwota przelewu do spółki ($):','1000000'));if(!Number.isFinite(n)||n<=0||!spend(n))return;c.cash=(c.cash||0)+n;log('Przelew do '+c.name+': '+money(n));render()}function toggleAutonomy(id){const c=company(id);if(c){c.autonomy=!c.autonomy;render()}}function buyShares(id,n){const f=S.firms.find(f=>f.id===id);if(!f)return;n=Math.min(n,100-f.share);if(n<=0)return;const price=f.price*n;if(!spend(price))return;f.share+=n;log('Kupiono '+n+'% udziałów '+f.name);render()}function manageFirm(id){const f=S.firms.find(f=>f.id===id);if(f&&f.share>50)alert(f.name+'\nUdziały: '+f.share+'%\nPracownicy: '+f.workers+'\nObiekty: '+f.assets+'\nKapitał: '+money(f.cash)+'\nPełne przejęcie majątku po zakupie 100%.')}function takeover(id){const f=S.firms.find(f=>f.id===id);if(!f||f.share<100)return;const co={id:nextId(),name:f.name,parent:1,country:f.country,countries:[f.country],cash:f.cash,autonomy:false};S.companies.push(co);income(f.cash);for(let i=0;i<f.assets;i++){const type=Object.keys(TYPES)[rnd(0,Object.keys(TYPES).length-1)];S.assets.push({id:nextId(),type,companyId:co.id,country:f.country,lat:52+rnd(-900,900)/100,lng:19+rnd(-1600,1600)/100,condition:100})}for(let i=0;i<Math.min(f.workers,50);i++){const w=genCandidate();S.workers.push({...w,companyId:co.id,assetId:null,experience:0})}S.firms=S.firms.filter(x=>x.id!==id);log('Pełne przejęcie '+f.name);render()}function acceptContract(id){const c=S.contracts.find(x=>x.id===id);if(c){c.active=true;log('Podpisano kontrakt z '+c.country);render()}}function cancelContract(id){S.contracts=S.contracts.filter(c=>c.id!==id);render()}function research(id){const t=S.technologies.find(t=>t.id===id);if(!t)return;const pts=t.bonus*7;if(S.researchPoints<pts)return toast('Za mało punktów badań');if(!spend(t.cost))return;S.researchPoints-=pts;S.researchDone.push(t);S.technologies=S.technologies.filter(x=>x.id!==id);log('Opracowano '+t.name);render()}function sellStock(){const k=document.getElementById('sellProduct').value,n=Number(document.getElementById('sellQty').value);if(!Number.isFinite(n)||n<=0||n>S.stock[k])return toast('Brak wystarczających zapasów');S.stock[k]-=n;income(n*S.prices[k]);log('Sprzedano '+n+' jedn. '+PRODUCTS[k]);render()}function addRoute(){const from=Number(document.getElementById('routeFrom').value),to=Number(document.getElementById('routeTo').value);if(from===to)return toast('Wybierz dwa różne obiekty');S.routes.push({id:nextId(),from,to});render()}function togglePause(){S.paused=!S.paused;render()}function setSpeed(v){S.speed=Number(v);S.progress=0;render()}function exportGame(){const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='energy_empire_save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function importGame(input){const file=input.files?.[0];if(!file)return;file.text().then(t=>{try{const data=JSON.parse(t);if(!Array.isArray(data.companies)||!Array.isArray(data.assets))throw Error();S=Object.assign(seed(),data);ensureOffers();render();toast('Wczytano zapis')}catch{toast('Niepoprawny plik zapisu')}})}function resetGame(){if(confirm('Rozpocząć nową grę? Obecny zapis zostanie zastąpiony.')){S=seed();ensureOffers();render()}}
function advance(){S.month++;let revenue=0,costs=0;const bonus=1+S.researchDone.reduce((a,t)=>a+t.bonus,0)/100;for(const a of S.assets){const t=TYPES[a.type];if(!t)continue;const assigned=S.workers.filter(w=>w.assetId===a.id);const efficiency=Math.min(1,.15+assigned.length/Math.max(1,t.staff)*.85)*bonus;let factor=efficiency;for(const [k,v] of Object.entries(t.input||{})){factor=Math.min(factor,(S.stock[k]||0)/v)}factor=Math.max(0,Math.min(1.8,factor));for(const [k,v] of Object.entries(t.input||{}))S.stock[k]=Math.max(0,(S.stock[k]||0)-v*factor);for(const [k,v] of Object.entries(t.prod||{}))S.stock[k]=(S.stock[k]||0)+v*factor;costs+=t.upkeep}for(const w of S.workers){costs+=w.salary;w.experience=(w.experience||0)+1}for(const l of [...S.loans]){const p=Math.min(l.left,l.payment);l.left-=p;l.months--;costs+=p;if(l.left<1||l.months<=0)S.loans=S.loans.filter(x=>x.id!==l.id)}for(const c of [...S.contracts])if(c.active){const qty=Math.min(c.qty,S.stock[c.product]||0);S.stock[c.product]-=qty;revenue+=qty*S.prices[c.product]*c.premium;c.months--;if(c.months<=0){S.contracts=S.contracts.filter(x=>x.id!==c.id);log('Zakończono kontrakt: '+c.country)}}const staff=S.workers.filter(w=>w.perk==='Badacz');S.researchPoints+=2+staff.reduce((a,w)=>a+w.skill*3,0);for(const c of S.companies)if(c.autonomy&&c.id!==1&&c.cash>100000){c.cash-=50000;S.researchPoints+=2}for(const f of S.firms){f.price=Math.max(100000,Math.round(f.price*(.94+Math.random()*.12)));f.cash+=rnd(-3,8)*100000; if(f.cash<0)f.cash=0}if(S.month%2===0){S.candidates.push(genCandidate(),genCandidate());S.technologies.push(genTech());S.contracts.push(genContract())}if(S.month%3===0)S.firms.push(genFirm());S.candidates=S.candidates.slice(-55);S.technologies=S.technologies.slice(-40);S.firms=S.firms.slice(-75);S.contracts=S.contracts.filter(c=>c.active).concat(S.contracts.filter(c=>!c.active).slice(-25));const profit=revenue-costs;income(profit);S.lastProfit=profit;S.history.push({month:S.month,revenue,costs,profit,cash:S.cash});S.history=S.history.slice(-120);log('Wynik miesiąca: '+money(profit));render()}
let last=performance.now();function frame(now){let dt=Math.min(1,(now-last)/1000);last=now;if(!S.paused){S.progress+=dt;const target=S.speed||12;if(S.progress>=target){S.progress-=target;advance()}}const pct=Math.min(100,S.progress/(S.speed||12)*100);document.getElementById('clockBar').style.width=pct+'%';document.getElementById('clockPct').textContent=Math.floor(pct)+'%';document.getElementById('clockText').textContent=S.paused?'⏸ Czas zatrzymany':'▶ Następny miesiąc za '+Math.ceil((S.speed||12)-S.progress)+' s';requestAnimationFrame(frame)}render();requestAnimationFrame(frame);
</script></body></html>
