<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Company Empire</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>🏢 Empire</h2>
    <button onclick="showTab('dashboard')">📊 Dashboard</button>
    <button onclick="showTab('actions')">⚙️ Akcje</button>
    <button onclick="showTab('stats')">📈 Statystyki</button>
    <button onclick="showTab('log')">📜 Log</button>
  </aside>

  <!-- Main -->
  <main class="main">

    <!-- Topbar -->
    <div class="topbar">
      <span>💰 <span id="money">1000</span></span>
      <span>👨‍💻 <span id="employees">1</span></span>
      <span>⭐ <span id="reputation">50</span></span>
    </div>

    <!-- Dashboard -->
    <section id="dashboard" class="tab active">
      <h1>Dashboard</h1>
      <p>Rozwijaj swoją firmę i zostań gigantem rynku 🚀</p>
    </section>

    <!-- Actions -->
    <section id="actions" class="tab">
      <h1>Akcje</h1>
      <button onclick="developProduct()">📦 Stwórz produkt</button>
      <button onclick="hireEmployee()">👨‍💻 Zatrudnij pracownika</button>
      <button onclick="marketing()">📢 Marketing</button>
      <button onclick="nextTurn()">➡️ Następna tura</button>
    </section>

    <!-- Stats -->
    <section id="stats" class="tab">
      <h1>Statystyki</h1>
      <p>Pieniądze: <span id="money2">1000</span></p>
      <p>Pracownicy: <span id="employees2">1</span></p>
      <p>Reputacja: <span id="reputation2">50</span></p>
    </section>

    <!-- Log -->
    <section id="log" class="tab">
      <h1>Log wydarzeń</h1>
      <ul id="logList"></ul>
    </section>

  </main>

</div>

<script src="script.js"></script>
</body>
</html>
