</style></head><body><header><div><h1>♻ WASTE EMPIRE</h1><small>Ekonomiczna strategia odpadowa · wersja 0.6 · światowe rynki</small></div><div class="stats"><span>📅 <b id="date"></b></span><span>💰 <b id="cash"></b></span><span>🚛 <b id="fleet"></b></span><span>🏢 <b id="subs"></b></span><button id="pause">⏸ Pauza</button><select id="speed" style="width:92px;margin:0"><option value="1" selected>×1 (realny)</option><option value="5">×5</option><option value="15">×15</option><option value="60">×60</option><option value="360">×360</option><option value="1440">×1440</option></select></div></header><main><nav id="nav"></nav><div style="position:relative;min-width:0"><div id="map"></div><div class="zone-controls"><div style="display:flex;gap:5px;margin-bottom:7px"><input id="city-query" placeholder="Miasto, kraj…" aria-label="Wyszukaj miasto" style="width:165px;margin:0;padding:7px"><button id="city-search" type="button">🔎</button></div><small id="city-status" style="display:block;max-width:245px;margin-bottom:6px">Białystok · rynek lokalny</small><button id="zones-toggle" type="button">▦ Ukryj strefy</button></div><div class="zone-legend"><b>STREFY ODBIORU</b><br><span style="background:#19c58c"></span>Twoje kontrakty<br><span style="background:#edaa4a"></span>Konkurencja<br><span style="background:#e7f2fa"></span>Wybrana strefa</div></div><aside class="panel" id="panel"></aside></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const money=n=>Math.round(n).toLocaleString('pl-PL')+' zł';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const seed=()=>({month:0,gameMinutes:Math.max(0,(Date.now()-Date.UTC(2026,0,1))/60000),paused:false,speed:1,lastDay:-1,lastWeek:-1,lastMonth:-1,research:0,tech:[],materials:{plastik:0,papier:0,szklo:0,metal:0,bio:0},prices:{plastik:510,papier:240,szklo:135,metal:920,bio:90},reputation:72,complaints:0,energy:100,loans:0,cash:4000000,vehicles:3,workers:8,subs:[],routes:[{street:'Lipowa',waste:'Zmieszane',day:'Poniedziałek',days:['Poniedziałek'],hour:'07:00',frequency:1,zone:0,price:390,vehicle:1,completed:0}],contracts:[0],shares:{},buildings:[],logs:['Witaj w Waste Empire. Wybierz strefę na mapie.'],ai:[{name:'EcoMax',cash:3800000,vehicles:5,subs:0,shares:0},{name:'GreenPol',cash:2600000,vehicles:4,subs:0,shares:0},{name:'Recyklon',cash:2100000,vehicles:3,subs:0,shares:0}]});let s;try{s=JSON.parse(localStorage.getItem('waste-empire-v1'))||seed()}catch{s=seed()};s={...seed(),...s};s.materials={...seed().materials,...s.materials};s.prices={...seed().prices,...s.prices};if(!Array.isArray(s.tech))s.tech=[];let sectors=[{name:'Centrum',xy:[53.133,23.16],radius:1350,tons:420,fee:420,owner:'Gracz'},{name:'Antoniuk',xy:[53.148,23.135],radius:1250,tons:350,fee:405,owner:'EcoMax'},{name:'Piaski',xy:[53.119,23.163],radius:1100,tons:300,fee:430,owner:'GreenPol'},{name:'Białostoczek',xy:[53.148,23.172],radius:1200,tons:370,fee:415,owner:'Recyklon'},{name:'Nowe Miasto',xy:[53.106,23.149],radius:1450,tons:470,fee:400,owner:'EcoMax'},{name:'Wygoda',xy:[53.145,23.204],radius:1250,tons:320,fee:440,owner:'GreenPol'}];let streetsByZone=[['Lipowa','Sienkiewicza','Rynek Kościuszki','Suraska','Warszawska'],['Antoniukowska','Hanki Ordonówny','Świętokrzyska','Wierzbowa'],['Zwierzyniecka','Wiejska','Młynowa','Legionowa'],['Białostoczek','Tysiąclecia Państwa Polskiego','Radzymińska'],['Kawaleryjska','Transportowa','Pogodna','Świerkowa'],['Wygoda','42 Pułku Piechoty','Dolistowska','Wasilkowska']];const tabs=[['mapa','🗺 Mapa i sektory'],['przetargi','📑 Przetargi'],['flota','🚛 Flota i kadry'],['trasy','📅 Harmonogramy'],['ceny','💳 Cennik odpadów'],['spolki','🏢 Spółki córki'],['udzialy','📈 Udziały firm'],['zarzadzanie','🏢 Zarządzanie'],['zaklady','🏭 Zakłady'],['rynek','🤖 Konkurencja AI'],['badania','🔬 Badania'],['handel','📦 Rynek surowców'],['miasto','🏙 Mieszkańcy'],['raport','💹 Finanse i zapis']];let tab='mapa',selected=0;const DAYS=['Poniedziałek','Wtorek','Środa','Czwartek','Piątek','Sobota','Niedziela'];s.tariffs=s.tariffs||{'Zmieszane':390,'Plastik i metale':350,'Papier':270,'Szkło':240,'Bio':300,'Gabaryty':680};s.ai=s.ai||[];s.ai.forEach((v,i)=>{v.id??='legacy-'+i;v.workers??=v.vehicles*2;v.contracts??=[];v.holdings??=[];v.ownerShares??=Math.max(0,100-(s.shares[i]||0));v.takenOver??=false});s.nextCompanyId??=1;s.offers??=[];s.routes=s.routes.map(r=>({...r,days:r.days||[r.day||'Poniedziałek'],hour:r.hour||'07:00',frequency:r.frequency||1,zone:r.zone??0,completed:r.completed||0}));const save=()=>{if(s.markets&&s.currentCity&&typeof marketSnapshot==='function')s.markets[s.currentCity]=marketSnapshot();localStorage.setItem('waste-empire-v1',JSON.stringify(s))};const note=t=>{s.logs.unshift('M'+(s.month+1)+': '+t);s.logs=s.logs.slice(0,35)};const owned=i=>s.contracts.includes(i);const button=(label,action,disabled=false)=>`<button ${disabled?'disabled':''} data-action="${action}">${label}</button>`;const map=L.map('map').setView([53.1325,23.165],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);// Strefy są fikcyjnymi obszarami kontraktowymi, wyliczanymi jako rozłączne komórki Voronoi.
// Nie są urzędowymi granicami dzielnic ani rzeczywistymi obszarami zamówień.
let zoneBounds=[[53.089,23.106],[53.168,23.233]];
let latScale=Math.cos(53.13*Math.PI/180);
const xyPoint=ll=>[ll[1]*latScale,ll[0]];
let seeds=sectors.map(v=>xyPoint(v.xy));
function clipHalfPlane(poly,a,b,c){let out=[];for(let j=0;j<poly.length;j++){let p=poly[j],q=poly[(j+1)%poly.length],dp=a*p[0]+b*p[1]-c,dq=a*q[0]+b*q[1]-c; if(dp<=0)out.push(p);if((dp<0&&dq>0)||(dp>0&&dq<0)){let t=dp/(dp-dq);out.push([p[0]+t*(q[0]-p[0]),p[1]+t*(q[1]-p[1])])}}return out}
function zonePolygon(i){let [[south,west],[north,east]]=zoneBounds;let poly=[[west*latScale,south],[east*latScale,south],[east*latScale,north],[west*latScale,north]];for(let j=0;j<seeds.length;j++){if(i===j)continue;let p=seeds[i],q=seeds[j],a=2*(q[0]-p[0]),b=2*(q[1]-p[1]),c=q[0]*q[0]+q[1]*q[1]-p[0]*p[0]-p[1]*p[1];poly=clipHalfPlane(poly,a,b,c)}return poly.map(p=>[p[1],p[0]/latScale])}
const layers=[],zoneGroup=L.featureGroup().addTo(map);
function rebuildZones(){zoneGroup.clearLayers();layers.length=0;sectors.forEach((x,i)=>{let l=L.polygon(zonePolygon(i),{weight:2,color:'#2bbd88',fillOpacity:.2,bubblingMouseEvents:false}).addTo(zoneGroup);l.on('click',()=>{selected=i;tab='mapa';render()});l.bindTooltip(x.name,{permanent:true,direction:'center',className:'zone-label',opacity:1});layers.push(l)});updateMap()}
rebuildZones();
let zonesVisible=true;document.getElementById('zones-toggle').onclick=()=>{zonesVisible=!zonesVisible;if(zonesVisible)zoneGroup.addTo(map);else map.removeLayer(zoneGroup);document.getElementById('zones-toggle').textContent=zonesVisible?'▦ Ukryj strefy':'▦ Pokaż strefy'};
function updateMap(){sectors.forEach((x,i)=>{let color=owned(i)?'#19c58c':'#edaa4a';layers[i].setStyle({color:selected===i?'#e7f2fa':color,fillColor:color,fillOpacity:selected===i?.38:.18,weight:selected===i?4:2,dashArray:owned(i)?null:'7 4'});layers[i].bringToFront();layers[i].setTooltipContent(x.name+' · '+(owned(i)?'Twoja firma':x.owner))})}
// Rynki świata są generowane na żądanie. Granice i firmy są fikcyjne, a OSM służy jako mapa bazowa.
const homeMarket={sectors:JSON.parse(JSON.stringify(sectors)),streets:JSON.parse(JSON.stringify(streetsByZone)),bounds:zoneBounds,contracts:[...s.contracts],routes:JSON.parse(JSON.stringify(s.routes))};
s.markets??={};s.currentCity??='Białystok, Polska';
function marketSnapshot(){return {sectors:JSON.parse(JSON.stringify(sectors)),streets:JSON.parse(JSON.stringify(streetsByZone)),bounds:zoneBounds,contracts:[...s.contracts],routes:JSON.parse(JSON.stringify(s.routes))}}
function hashCity(v){let h=2166136261;for(let i=0;i<v.length;i++)h=Math.imul(h^v.charCodeAt(i),16777619);return h>>>0}
function makeMarket(name,lat,lon,bbox){let h=hashCity(name),count=8+(h%5),radius=Math.max(.025,Math.min(.12,Math.abs(Number(bbox?.[1])-Number(bbox?.[0]))||.06));let west=lon-radius/Math.max(.25,Math.cos(lat*Math.PI/180)),east=lon+radius/Math.max(.25,Math.cos(lat*Math.PI/180));let bounds=[[lat-radius,west],[lat+radius,east]];let owners=s.ai.filter(v=>!v.takenOver).map(v=>v.name);if(!owners.length)owners=['GlobalEco'];let sectors=[],streets=[];for(let i=0;i<count;i++){let a=2*Math.PI*i/count,r=.28+.34*((hashCity(name+i)%100)/100);let y=lat+Math.sin(a)*radius*r,x=lon+Math.cos(a)*radius*r/Math.max(.25,Math.cos(lat*Math.PI/180));let owner=owners[(h+i)%owners.length];sectors.push({name:'Sektor '+String(i+1).padStart(2,'0'),xy:[y,x],radius:1100,tons:180+((h+i*173)%650),fee:220+((h+i*53)%350),owner});streets.push(Array.from({length:5},(_,j)=>'Odcinek '+(i+1)+'-'+(j+1)+' (symulowany)'))}return {sectors,streets,bounds,contracts:[],routes:[]}}
function switchMarket(name,lat,lon,bbox){s.markets[s.currentCity]=marketSnapshot();let m=s.markets[name]||(name==='Białystok, Polska'?homeMarket:makeMarket(name,lat,lon,bbox));s.currentCity=name;sectors=m.sectors;streetsByZone=m.streets;zoneBounds=m.bounds;latScale=Math.cos(lat*Math.PI/180);seeds=sectors.map(v=>xyPoint(v.xy));s.contracts=[...m.contracts];s.routes=JSON.parse(JSON.stringify(m.routes));selected=0;rebuildZones();map.setView([lat,lon],12);document.getElementById('city-status').textContent=name+' · '+sectors.length+' sektorów';note('Otwarto rynek: '+name);render();save()}
async function findCity(){let input=document.getElementById('city-query'),status=document.getElementById('city-status'),q=input.value.trim();if(q.length<2){status.textContent='Wpisz nazwę miasta i kraju';return}status.textContent='Wyszukiwanie…';try{let url='https://nominatim.openstreetmap.org/search?format=json&limit=5&featuretype=city&q='+encodeURIComponent(q);let res=await fetch(url,{headers:{'Accept-Language':'pl'}});if(!res.ok)throw Error('Serwer wyszukiwania niedostępny');let data=await res.json();if(!data.length){status.textContent='Nie znaleziono miasta. Dopisz kraj.';return}let x=data[0],name=x.display_name.split(',').slice(0,3).join(',').trim();switchMarket(name,Number(x.lat),Number(x.lon),x.boundingbox)}catch(e){status.textContent='Błąd wyszukiwania: '+e.message}}
document.getElementById('city-search').onclick=findCity;document.getElementById('city-query').addEventListener('keydown',e=>{if(e.key==='Enter')findCity()});
if(s.currentCity!=='Białystok, Polska'&&s.markets[s.currentCity]){let m=s.markets[s.currentCity],lat=m.sectors.reduce((a,v)=>a+v.xy[0],0)/m.sectors.length,lon=m.sectors.reduce((a,v)=>a+v.xy[1],0)/m.sectors.length;sectors=m.sectors;streetsByZone=m.streets;zoneBounds=m.bounds;latScale=Math.cos(lat*Math.PI/180);seeds=sectors.map(v=>xyPoint(v.xy));rebuildZones();map.setView([lat,lon],12);document.getElementById('city-status').textContent=s.currentCity+' · '+sectors.length+' sektorów'}
function spend(n){if(s.cash<n){alert('Brak środków: potrzebujesz '+money(n));return false}s.cash-=n;return true}function show(t){tab=t;render()}function render(){document.getElementById('date').textContent=clockLabel();document.getElementById('cash').textContent=money(s.cash);document.getElementById('fleet').textContent=s.vehicles+' poj.';document.getElementById('subs').textContent=s.subs.length+' spółek';document.getElementById('nav').innerHTML=tabs.map(([id,label])=>`<button class="${tab===id?'primary':''}" data-tab="${id}">${label}</button>`).join('')+'<p class="help">Mapa jest prawdziwa (OSM). Granice sektorów, kontrakty i wszystkie ceny są fikcyjną symulacją.</p>';updateMap();let h='';const x=sectors[selected];if(tab==='mapa'){h=`<h2>🗺 ${x.name}</h2><div class="card"><span class="pill">${owned(selected)?'🟢 Twój kontrakt':'🟠 Konkurencja'}</span><p>Operator: <b>${owned(selected)?'Twoja firma':x.owner}</b></p><div class="zone-metric"><div><small>Odpady / mies.</small><b>${x.tons} t</b></div><div><small>Cena / tonę</small><b>${money(x.fee)}</b></div><div><small>Przychód / mies.</small><b>${money(x.tons*x.fee)}</b></div><div><small>Potrzebna flota*</small><b>${Math.max(1,Math.ceil(x.tons/110))} poj.</b></div></div><p>Strefa ${selected+1} z ${sectors.length} · ${owned(selected)?'Kontrakt aktywny':'Możesz wystartować w przetargu'}</p>${button('Pokaż cały obszar','fitzone')} ${button('Centruj','center')} ${!owned(selected)?button('Złóż ofertę','bid'):''}</div><p class="help">Kolorowe wielokąty nie nakładają się na siebie. Kliknij strefę, aby sprawdzić operatora i parametry. *Orientacyjne zapotrzebowanie.</p>`}

function action(a){if(a.startsWith('offer:')){let i=Number(a.split(':')[1]),v=s.ai[i],pct=Number(document.getElementById('pct-'+i)?.value),premium=Number(document.getElementById('premium-'+i)?.value),held=s.shares[i]||0;if(!v||v.takenOver||!pct||pct>100-held)return;let unit=Math.round((v.cash+v.vehicles*240000+v.workers*15000+v.contracts.length*350000)/100),cost=Math.round(unit*pct*premium);if(s.cash<cost){alert('Brak gotówki na ofertę');return}let chance=Math.min(.96,.32+(premium-1)*.65);if(Math.random()<chance){s.cash-=cost;s.shares[i]=held+pct;v.ownerShares=100-s.shares[i];note('Udziałowcy '+v.name+' przyjęli ofertę '+pct+'% za '+money(cost));s.offers.unshift('Przyjęto: '+v.name+' '+pct+'% · '+money(cost))}else{s.offers.unshift('Odrzucono: '+v.name+' '+pct+'% · '+money(cost));note('Udziałowcy '+v.name+' odrzucili ofertę')}}else if(a.startsWith('manage:')){s.managedIndex=Number(a.split(':')[1]);tab='zarzadzanie'}else if(a.startsWith('managed')){let [op,idx]=a.split(':'),v=s.ai[Number(idx)];if(!v||(s.shares[idx]||0)<=50||v.takenOver)return;let cost=op==='managedvehicle'?240000:op==='managedhire'?12000:150000;if(v.cash<cost){alert('Spółka nie ma wystarczających środków');return}v.cash-=cost;if(op==='managedvehicle')v.vehicles++;if(op==='managedhire')v.workers+=2;if(op==='managedsub')v.subs++;note('Decyzja zarządcza w '+v.name)}else if(a.startsWith('takeover:')){let i=Number(a.split(':')[1]),v=s.ai[i];if(!v||v.takenOver||(s.shares[i]||0)!==100)return;if(!confirm('Wchłonąć '+v.name+' i przenieść gotówkę, pojazdy, pracowników oraz kontrakty?'))return;s.cash+=v.cash;s.vehicles+=v.vehicles;s.workers+=v.workers;v.contracts.forEach(z=>{if(!s.contracts.includes(z))s.contracts.push(z)});v.takenOver=true;v.cash=0;v.vehicles=0;v.workers=0;note('Wchłonięto '+v.name+' wraz z majątkiem');tab='udzialy'}else if(a.startsWith('sell:')){let k=a.split(':')[1];if(s.materials[k]>=1){s.materials[k]-=1;s.cash+=s.prices[k];note('Sprzedano tonę surowca: '+k)}}else if(a.startsWith('tech:')){let id=a.split(':')[1],cost={sort:100,fleet:80,bio:120,solar:150}[id];if(!s.tech.includes(id)&&s.research>=cost){s.research-=cost;s.tech.push(id);note('Opracowano technologię '+id)}}else if(a==='campaign'){if(spend(25000)){s.reputation=Math.min(100,s.reputation+5);s.complaints=Math.max(0,s.complaints-2);note('Przeprowadzono kampanię edukacyjną')}}else if(a==='center'){map.flyTo(sectors[selected].xy,14);return}else if(a==='fitzone'){if(!zonesVisible)document.getElementById('zones-toggle').click();map.fitBounds(layers[selected].getBounds(),{padding:[35,35],maxZoom:14});return}if(a.startsWith('bid')){let i=a.includes(':')?Number(a.split(':')[1]):selected;if(owned(i))return;if(!spend(80000))return;const chance=.48+Math.min(.2,s.vehicles*.025);if(Math.random()<chance){s.contracts.push(i);note('Wygrano przetarg: '+sectors[i].name)}else note('Przegrano przetarg: '+sectors[i].name+' (wadium zwrócone)');if(!owned(i))s.cash+=80000;selected=i;tab='przetargi'}else if(a==='vehicle'){if(spend(240000)){s.vehicles++;note('Kupiono nową śmieciarkę')}}else if(a==='hire'){if(spend(12000)){s.workers+=2;note('Zatrudniono dwie osoby')}}else if(a==='tariffs'){let ok=true;document.querySelectorAll('.tariff').forEach(el=>{let v=Number(el.value);if(!Number.isFinite(v)||v<0||v>10000)ok=false});if(!ok){alert('Podaj prawidłowe stawki od 0 do 10000 zł/t');return}document.querySelectorAll('.tariff').forEach(el=>s.tariffs[el.dataset.waste]=Number(el.value));note('Zaktualizowano cennik usług')}else if(a==='route'){let street=document.getElementById('street').value.trim(),zone=Number(document.getElementById('routezone').value),days=[...document.querySelectorAll('.route-day:checked')].map(el=>el.value),hour=document.getElementById('routehour').value,frequency=Number(document.getElementById('frequency').value),waste=document.getElementById('waste').value;if(!street||!days.length||!hour||!owned(zone)){alert('Podaj ulicę, wybierz strefę z kontraktem, dzień i godzinę');return}if(s.routes.length>=s.vehicles||s.routes.length*2+2>s.workers){alert('Brak wolnego pojazdu lub załogi. Kup śmieciarkę i zatrudnij ludzi.');return}let used=new Set(s.routes.map(r=>r.vehicle)),vehicle=Array.from({length:s.vehicles},(_,i)=>i+1).find(n=>!used.has(n));s.routes.push({street,waste,zone,days,day:days[0],hour,frequency,price:s.tariffs[waste],vehicle,completed:0});note('Dodano harmonogram: '+street)}else if(a.startsWith('delroute:')){s.routes.splice(Number(a.split(':')[1]),1);note('Usunięto linię')}else if(a==='subsidiary'){let name=document.getElementById('subname').value.trim();if(!name){alert('Podaj nazwę spółki');return}if(spend(150000)){s.subs.push({name,type:document.getElementById('subtype').value});note('Założono spółkę córkę '+name)}}else if(a.startsWith('build:')){let type=a.split(':')[1],price=type==='sort'?900000:1400000;if(spend(price)){s.buildings.push(type);note('Wybudowano '+(type==='sort'?'sortownię':'fabrykę recyklingu'))}}else if(a==='save'){save();note('Gra zapisana')}else if(a==='reset'){if(confirm('Usunąć cały postęp?')){s=seed();selected=0;tab='mapa'}}render()}
function nextMonth(){s.month++;let income=s.contracts.reduce((a,i)=>a+sectors[i].tons*sectors[i].fee,0)+s.buildings.reduce((a,b)=>a+(b==='sort'?80000:135000),0);let costs=s.vehicles*(s.tech.includes('fleet')?7200:9000)+s.workers*6500+s.routes.length*3500+s.buildings.reduce((a,b)=>a+(b==='sort'?36000:58000),0);let dividend=0;s.ai.filter(v=>!v.takenOver).forEach((v,i)=>{dividend+=Math.round((s.shares[i]||0)/100*18000);v.cash+=100000+Math.floor(Math.random()*120000);let r=Math.random();if(r<.24&&v.cash>300000){v.vehicles++;v.cash-=240000;note(v.name+' kupuje śmieciarkę')}else if(r<.38&&v.cash>200000){v.subs++;v.cash-=150000;note(v.name+' zakłada spółkę córkę')}else if(r<.51&&v.cash>350000){v.shares++;v.cash-=280000;note(v.name+' kupuje udziały innej firmy')}else if(r<.58){note(v.name+' reorganizuje harmonogramy wywozu')}});s.cash+=income-costs+dividend;s.cash-=s.loans*.007;s.reputation=Math.max(0,Math.min(100,s.reputation+(s.routes.length>=s.contracts.length?1:-2)));note('Rozliczenie: '+money(income-costs)+'; dywidendy: '+money(dividend));if(s.cash<0)note('Uwaga: ujemny stan konta!');render()}
document.addEventListener('change',e=>{if(e.target.id==='routezone')updateStreetOptions()});function updateStreetOptions(){let z=Number(document.getElementById('routezone')?.value??0),el=document.getElementById('street');if(el)el.innerHTML=(streetsByZone[z]||[]).map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab)show(b.dataset.tab);if(b.dataset.action)action(b.dataset.action)});function clockLabel(){let d=Math.floor(s.gameMinutes/1440),hour=Math.floor(s.gameMinutes%1440/60),min=Math.floor(s.gameMinutes%60);let date=new Date(Date.UTC(2026,0,1+d));return date.toLocaleDateString('pl-PL',{timeZone:'UTC',day:'2-digit',month:'short',year:'numeric'})+' '+String(hour).padStart(2,'0')+':'+String(min).padStart(2,'0')}
function daily(){s.research+=1+s.subs.length*.25;let ownedTons=s.contracts.reduce((v,i)=>v+sectors[i].tons,0)/30;let capacity=Math.min(1,(s.vehicles*85)/(Math.max(1,ownedTons*30)));let service=Math.min(1,(s.routes.length+1)/Math.max(1,s.contracts.length));if(Math.random()>.93*capacity*service){s.complaints++;s.reputation=Math.max(0,s.reputation-.35)}else{s.reputation=Math.min(100,s.reputation+.04)}let output=ownedTons*.12*(s.tech.includes('sort')?1.25:1);let factors={plastik:.32,papier:.26,szklo:.19,metal:.08,bio:.15};Object.keys(factors).forEach(k=>s.materials[k]+=output*factors[k]);if(s.buildings.includes('plastic')&&s.materials.plastik>2){s.materials.plastik-=2;s.cash+=2400}if(s.buildings.includes('sort'))s.research+=.5;if(s.tech.includes('solar'))s.energy=Math.min(100,s.energy+.2);else s.energy=Math.max(40,s.energy-.01);for(const k of Object.keys(s.prices))s.prices[k]=Math.max(30,Math.round(s.prices[k]*(.97+Math.random()*.06)));if(Math.random()<.04){let e=['Wzrost ruchu drogowego utrudnia odbiór','Przegląd instalacji zakończony','Zwiększone zapotrzebowanie na recyklat','Mieszkańcy zgłaszają przepełniony pojemnik'];note(e[Math.floor(Math.random()*e.length)])}}
function spawnCompany(){if(s.ai.filter(v=>!v.takenOver).length>=45)return;let id=s.nextCompanyId++,names=['EcoNova','ReWaste','BioCity','SortPol','CleanLoop','GreenTruck','RecykTech','UrbanEco'];let name=names[id%names.length]+' '+id;s.ai.push({id:'new-'+id,name,cash:850000+Math.floor(Math.random()*1900000),vehicles:1+Math.floor(Math.random()*5),workers:4+Math.floor(Math.random()*10),subs:0,shares:0,contracts:[],ownerShares:100,takenOver:false});note('Powstała nowa firma AI: '+name)}
function weekly(){if(Math.random()<.20)spawnCompany();s.ai.filter(v=>!v.takenOver).forEach((v,i)=>{v.cash+=25000+Math.round(Math.random()*35000);let r=Math.random();if(r<.3&&v.cash>250000){v.vehicles++;v.cash-=240000;note(v.name+' kupuje pojazd')}else if(r<.45&&v.cash>180000){v.subs++;v.cash-=150000;note(v.name+' tworzy spółkę córkę')}else if(r<.58&&v.cash>350000){v.shares++;v.cash-=280000;note(v.name+' kupuje udziały')}else if(r<.67)note(v.name+' aktualizuje harmonogramy odbioru')})}
function processCollections(dayIndex){let date=new Date(Date.UTC(2026,0,1+dayIndex));let weekday=DAYS[(date.getUTCDay()+6)%7];for(const r of s.routes){if(!owned(r.zone)||!r.days.includes(weekday)||Math.floor(dayIndex/7)%r.frequency!==0)continue;r.completed=(r.completed||0)+1;note('Odbiór: '+r.street+' · '+r.waste+' · pojazd #'+r.vehicle)}}
function advance(minutes){let oldDay=Math.floor(s.gameMinutes/1440),oldWeek=Math.floor(s.gameMinutes/10080),oldMonth=Math.floor(s.gameMinutes/43200);s.gameMinutes+=minutes;let day=Math.floor(s.gameMinutes/1440),week=Math.floor(s.gameMinutes/10080),month=Math.floor(s.gameMinutes/43200);for(let i=oldDay;i<day;i++){daily();processCollections(i+1)}for(let i=oldWeek;i<week;i++)weekly();for(let i=oldMonth;i<month;i++)nextMonth();document.getElementById('date').textContent=clockLabel();}
const pause=document.getElementById('pause'),speed=document.getElementById('speed');speed.value=String(s.speed||1);pause.textContent=s.paused?'▶ Wznów':'⏸ Pauza';pause.onclick=()=>{s.paused=!s.paused;pause.textContent=s.paused?'▶ Wznów':'⏸ Pauza';save()};speed.onchange=()=>{s.speed=Number(speed.value);save()};let last=performance.now(),redraw=0,autosave=0;function loop(now){let delta=Math.min(3,(now-last)/1000);last=now;if(!s.paused){advance(delta*(s.speed||1)/60);redraw+=delta;autosave+=delta;if(redraw>2){redraw=0;render()}if(autosave>15){autosave=0;save()}}requestAnimationFrame(loop)}

const originalRender=render;render=function(){originalRender();if(!['global','dyspozytor','powiadomienia','waluty'].includes(tab))return;let h='';const cities=Object.entries(s.globalOps);if(tab==='global'){h='<h2>🌍 Centrala globalna</h2><p class="help">Rynki zapisane podczas odwiedzania miast. Wyniki zagraniczne są symulacją uproszczoną, nie rzeczywistymi danymi.</p><div class="card"><h3>Holding</h3><p>Rynki: '+(cities.length+1)+' · Spółki córki: '+s.subs.length+' · Gotówka centrali: '+money(s.cash)+'</p></div>'+cities.map(([city,o])=>`<div class="card"><h3>${esc(city)}</h3><p>🚛 ${o.vehicles||0} · 👥 ${o.workers||0} · 📑 ${o.contracts||0} kontraktów</p><p>Saldo operacji zagranicznych: ${money(o.balance||0)}</p><p>Dyrektor AI: ${o.director?'zatrudniony':'brak'}</p>${button(o.director?'Zwolnij dyrektora':'Zatrudnij dyrektora (25 000 zł)','director:'+encodeURIComponent(city))}</div>`).join('')+'<div class="card"><h3>Ekspansja</h3><p>Wyszukaj miasto w polu nad mapą, aby utworzyć nowy rynek. Następnie wróć do centrali.</p></div>'}

if(tab==='waluty'){h='<h2>💱 Waluty i handel międzynarodowy</h2><p class="help">Fikcyjne kursy na potrzeby rozgrywki; zmieniają się co tydzień w symulacji.</p>'+Object.entries(s.exchangeRates).map(([k,v])=>`<div class="card"><b>${k}</b> · ${v.toFixed(3)} PLN</div>`).join('')+'<div class="card"><h3>Eksport surowców</h3><label>Surowiec</label><select id="exportmaterial">'+Object.keys(s.materials).map(k=>`<option value="${esc(k)}">${esc(k)} (${s.materials[k].toFixed(1)} t)</option>`).join('')+'</select><label>Rynek zbytu</label><select id="exportcurrency"><option>EUR</option><option>USD</option><option>GBP</option><option>JPY</option></select><label>Ilość (tony)</label><input id="exporttons" type="number" min="1" step="1" value="1">'+button('Eksportuj po cenie rynkowej','export')+'</div><div class="card"><h3>Ostatnie transakcje</h3>'+s.tradeHistory.slice(0,8).map(x=>`<p>${esc(x)}</p>`).join('')+'</div>'}
document.getElementById('panel').innerHTML=h;};
const originalAction=action;action=function(a){if(a.startsWith('director:')){let city=decodeURIComponent(a.slice(9)),o=s.globalOps[city];if(!o)return;if(o.director){o.director=false;notify('Zwolniono dyrektora: '+city)}else if(spend(25000)){o.director=true;notify('Zatrudniono dyrektora: '+city)}render();return}if(a.startsWith('dispatch:')){let z=Number(a.split(':')[1]);selected=z;tab='mapa';render();if(layers[z])map.fitBounds(layers[z].getBounds());return}if(a==='clearalerts'){s.notifications=[];render();return}if(a==='export'){let k=document.getElementById('exportmaterial')?.value,c=document.getElementById('exportcurrency')?.value,n=Math.floor(Number(document.getElementById('exporttons')?.value));if(!s.materials[k]||!Number.isFinite(n)||n<1||n>s.materials[k]){alert('Niewystarczająca ilość surowca');return}let revenue=Math.round(n*s.prices[k]*1.07);s.materials[k]-=n;s.cash+=revenue;s.tradeHistory.unshift(`${clockLabel()}: ${n} t ${k}, rynek ${c}, +${money(revenue)}`);notify('Wyeksportowano '+n+' t '+k+' za '+money(revenue));render();return}originalAction(a)};
const subtitle=document.querySelector('header small');if(subtitle)subtitle.textContent='Ekonomiczna strategia odpadowa · wersja 0.7 · globalne rynki';

/* v0.8: ulice OSM, dyspozytornia, pojemniki, rynek pojazdów, zarządy */
tabs.push(['uliceosm','🛣 Ulice OSM'],['pojemniki','🗑 Pojemniki'],['pojazdyplus','🚚 Rynek pojazdów'],['zarzady','👔 Zarządy i przetargi']);
s.osmRoads??={};s.bins??={};s.usedTrucks??=[];s.boards??={};s.auctionBids??=[];
let roadOverlay=L.layerGroup().addTo(map),movingVehicles=L.layerGroup().addTo(map),osmBusy=false;
const marketKey=()=>s.currentCity||'Białystok, Polska';
const osmZoneKey=(i)=>marketKey()+'::'+i;
function binKey(i){return osmZoneKey(i)}
function roadList(i){return s.osmRoads[osmZoneKey(i)]||[]}
async function loadOsmStreets(i){if(osmBusy)return;osmBusy=true;const status=document.getElementById('osm-status');if(status)status.textContent='Pobieranie ulic z OpenStreetMap…';try{
const bounds=layers[i]?.getBounds();if(!bounds)throw Error('Nie znaleziono strefy');const sw=bounds.getSouthWest(),ne=bounds.getNorthEast();
const q=`[out:json][timeout:20];way["highway"]["name"](${sw.lat.toFixed(5)},${sw.lng.toFixed(5)},${ne.lat.toFixed(5)},${ne.lng.toFixed(5)});out geom 250;`;
const response=await fetch('https://overpass.kumi.systems/api/interpreter',{method:'POST',body:new URLSearchParams({data:q})});if(!response.ok)throw Error('Serwer OSM jest zajęty');const data=await response.json();
const roads=(data.elements||[]).filter(x=>x.geometry?.length>1).map(x=>({id:x.id,name:x.tags.name,points:x.geometry.map(g=>[g.lat,g.lon])}));
const unique=new Map();roads.forEach(r=>{if(!unique.has(r.name)||unique.get(r.name).points.length<r.points.length)unique.set(r.name,r)});
s.osmRoads[osmZoneKey(i)]=[...unique.values()].slice(0,120);if(!unique.size)throw Error('Brak ulic z nazwami w tym obszarze');
streetsByZone[i]=[...unique.keys()].slice(0,120);note('Pobrano '+streetsByZone[i].length+' ulic OSM w strefie '+sectors[i].name);save();render();showRoads(i);
}catch(err){if(status)status.textContent='Nie udało się pobrać: '+err.message+'; spróbuj później.';note('Błąd pobierania ulic: '+err.message)}finally{osmBusy=false}}
function showRoads(i){roadOverlay.clearLayers();roadList(i).forEach(r=>L.polyline(r.points,{color:'#38bdf8',weight:3,opacity:.7}).bindTooltip(r.name).addTo(roadOverlay));}
function getBins(i){const k=binKey(i);if(!s.bins[k])s.bins[k]=(streetsByZone[i]||[]).slice(0,35).map(street=>({street,fill:Math.floor(15+Math.random()*65),capacity:1100,kind:'Zmieszane',last:'—'}));return s.bins[k]}
function animateFleet(){movingVehicles.clearLayers();let min=s.gameMinutes;for(const [idx,r] of s.routes.entries()){if(!owned(r.zone))continue;let hh=Number((r.hour||'07:00').split(':')[0]),mm=Number((r.hour||'07:00').split(':')[1]),start=hh*60+mm,local=min%1440;let elapsed=local-start;if(elapsed<0||elapsed>150)continue;let road=roadList(r.zone).find(x=>x.name===r.street),points=road?.points;if(!points?.length)continue;let fraction=Math.min(.999,elapsed/150)*(points.length-1),a=Math.floor(fraction),b=Math.min(points.length-1,a+1),mix=fraction-a;let pos=[points[a][0]*(1-mix)+points[b][0]*mix,points[a][1]*(1-mix)+points[b][1]*mix];L.circleMarker(pos,{radius:8,color:'#fff',weight:2,fillColor:'#0ea5e9',fillOpacity:1}).bindTooltip('🚛 #'+r.vehicle+' · '+r.street).addTo(movingVehicles)}}
const prevRenderV8=render;render=function(){prevRenderV8();if(!['uliceosm','pojemniki','pojazdyplus','zarzady','dyspozytor'].includes(tab))return;let h='',i=selected;
if(tab==='uliceosm'){let roads=roadList(i);h=`<h2>🛣 Ulice OpenStreetMap</h2><p class="help">Prawdziwe nazwy i geometrie dróg są pobierane na żądanie z Overpass API. Dane mogą być niekompletne; sektory nadal są fikcyjne.</p><div class="card"><label>Strefa</label><select id="osmzone">${sectors.map((z,j)=>`<option value="${j}" ${j===i?'selected':''}>${esc(z.name)}</option>`).join('')}</select>${button('Pobierz ulice OSM','fetchroads')} ${button('Pokaż drogi','showroads')}<p id="osm-status">Zapisanych ulic: ${roads.length}</p></div>`+roads.slice(0,70).map(r=>`<div class="card" style="padding:8px"><b>${esc(r.name)}</b><small> · ${r.points.length} punktów trasy</small> ${button('Pokaż','road:'+r.id)}</div>`).join('');}
if(tab==='pojemniki'){let bins=getBins(i);h=`<h2>🗑 Pojemniki i zapełnienie</h2><label>Strefa</label><select id="binzone">${sectors.map((z,j)=>`<option value="${j}" ${j===i?'selected':''}>${esc(z.name)}</option>`).join('')}</select><p class="help">Zapełnienie rośnie każdego dnia; po odbiorze z przypisanej ulicy spada.</p>`+bins.map((b,j)=>`<div class="card"><b>${esc(b.street)}</b><p>${b.kind} · ${b.fill}% · ostatni odbiór: ${esc(b.last)}</p><div style="height:9px;border-radius:9px;background:#173044;overflow:hidden"><div style="width:${b.fill}%;height:100%;background:linear-gradient(90deg,#16a34a,#f59e0b,#ef4444)"></div></div>${button('Opróżnij (koszt 120 zł)','emptybin:'+j)}</div>`).join('')}
if(tab==='pojazdyplus'){h=`<h2>🚚 Rynek pojazdów</h2><p>Posiadane: ${s.vehicles} · Pracownicy: ${s.workers}</p>`+[{n:'Używana śmieciarka 16 m³',p:95000},{n:'Używany hakowiec 20 m³',p:145000},{n:'Nowa śmieciarka elektryczna',p:520000},{n:'Pojazd do gabarytów',p:190000}].map((v,j)=>`<div class="card"><h3>${v.n}</h3><p>${money(v.p)} · ${j<2?'rynek wtórny':'nowy pojazd'}</p>${button('Kup pojazd','buytruck:'+j)}</div>`).join('')+`<div class="card"><h3>Leasing</h3><p>Uproszczony leasing: wpłata 20%, pozostała kwota jako zobowiązanie.</p>${button('Leasing śmieciarki (48 000 zł)','leasetruck')}</div>`}
if(tab==='zarzady'){h='<h2>👔 Zarządy i przetargi</h2><p class="help">Spółki córki otrzymują własne budżety i dyrektorów. AI może przygotowywać decyzje.</p>'+s.subs.map((v,j)=>{let b=s.boards[j]||{director:'Nieobsadzony',budget:0,autonomy:false};return `<div class="card"><h3>${esc(v.name)}</h3><p>Dyrektor: ${esc(b.director)} · budżet: ${money(b.budget)}</p><p>Autonomia AI: ${b.autonomy?'włączona':'wyłączona'}</p>${button('Zatrudnij dyrektora (12 000 zł)','boardhire:'+j)} ${button('Przekaż 100 tys. zł','boardfund:'+j)} ${button('Przełącz autonomię','boardauto:'+j)}</div>`}).join('')+'<div class="card"><h3>Przetargi międzynarodowe</h3><p>Każde odwiedzone miasto ma osobne strefy i lokalne kontrakty. Otwórz miasto i zakładkę Przetargi, aby złożyć ofertę.</p></div>'}
if(tab==='dyspozytor'){h=`<h2>📡 Dyspozytornia LIVE</h2><p class="help">Niebieskie znaczniki pokazują przybliżoną pozycję pojazdów na pobranych drogach OSM podczas 150 minut od rozpoczęcia trasy. To symulacja, nie GPS.</p><p>Aktywnych linii: ${s.routes.length}</p>`+s.routes.map((r,j)=>`<div class="card"><b>🚛 #${r.vehicle} — ${esc(r.street)}</b><p>${esc(r.waste)} · ${esc(r.hour)} · ${esc((r.days||[]).join(', '))}</p><p>Odbiory wykonane: ${r.completed||0}</p>${button('Pokaż trasę','showroute:'+j)}</div>`).join('')}
document.getElementById('panel').innerHTML=h;};
const prevActionV8=action;action=function(a){if(a==='fetchroads'){loadOsmStreets(selected);return}if(a==='showroads'){showRoads(selected);return}if(a.startsWith('road:')){let r=roadList(selected).find(x=>String(x.id)===a.slice(5));if(r){roadOverlay.clearLayers();let line=L.polyline(r.points,{color:'#22d3ee',weight:6}).addTo(roadOverlay);map.fitBounds(line.getBounds())}return}if(a.startsWith('showroute:')){let r=s.routes[Number(a.slice(10))];if(r){selected=r.zone;let road=roadList(r.zone).find(x=>x.name===r.street);if(road){roadOverlay.clearLayers();let line=L.polyline(road.points,{color:'#38bdf8',weight:6}).addTo(roadOverlay);map.fitBounds(line.getBounds())}else alert('Najpierw pobierz ulice OSM dla tej strefy.')}return}if(a.startsWith('emptybin:')){let b=getBins(selected)[Number(a.slice(9))];if(b&&spend(120)){b.fill=0;b.last=clockLabel();note('Opróżniono pojemnik: '+b.street)}render();return}if(a.startsWith('buytruck:')){let j=Number(a.slice(9)),prices=[95000,145000,520000,190000];if(spend(prices[j])){s.vehicles++;s.usedTrucks.push({kind:j,price:prices[j],at:clockLabel()});note('Kupiono pojazd z rynku: '+money(prices[j]))}render();return}if(a==='leasetruck'){if(spend(48000)){s.vehicles++;s.loans+=192000;note('Wzięto śmieciarkę w leasing')}render();return}if(a.startsWith('board')){let [cmd,jraw]=a.split(':'),j=Number(jraw);if(!s.subs[j])return;let b=s.boards[j]??={director:'Nieobsadzony',budget:0,autonomy:false};if(cmd==='boardhire'&&spend(12000))b.director='Dyrektor AI #'+(j+1);if(cmd==='boardfund'&&spend(100000))b.budget+=100000;if(cmd==='boardauto')b.autonomy=!b.autonomy;s.boards[j]=b;render();return}prevActionV8(a)};
const prevDailyV8=daily;daily=function(){prevDailyV8();for(const bins of Object.values(s.bins))for(const b of bins)b.fill=Math.min(100,b.fill+1+Math.floor(Math.random()*3));};
const prevCollectionsV8=processCollections;processCollections=function(day){prevCollectionsV8(day);let date=new Date(Date.UTC(2026,0,1+day)),weekday=DAYS[(date.getUTCDay()+6)%7];for(const r of s.routes){if(!owned(r.zone)||!r.days.includes(weekday)||Math.floor(day/7)%r.frequency!==0)continue;for(const b of getBins(r.zone))if(b.street===r.street){b.fill=0;b.last=clockLabel()}}};
