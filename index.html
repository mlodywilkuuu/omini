btn" onclick="campaignAction('debate')"><b>🎙️ Debata</b>Wpływ opinii</button><button class="campaignAction btn" onclick="campaignAction('attack')"><b>⚔️ Atak</b>-$45M</button></div>`)}${C('','Kandydaci',stat('Ty',PARTY.blue.name)+stat('Rywal',PARTY.red.name)+stat('Niezależni',PARTY.purple.name))}${C('full','Dziennik kampanii',newsHTML())}</div>`}
function restartCampaign(){G.president=false;G.oval.unlocked=false;G.election={active:true,type:'presidential',day:1,totalDays:30,phase:'campaign',results:{},called:[],winner:null};G.popularity=0;G.campaign=0;STATES.forEach(s=>G.states[s[1]]={support:0,red:46+Math.random()*10,purple:4+Math.random()*4,called:null,senate:null});saveNews('🔄 Rozpoczęto nową kampanię prezydencką.');save();render()}
function vCongress(){if(!G.congressCampaign?.active&&!G.president)return `<div class="grid">${C('wide','Kampania do Kongresu',`<p class="muted">Po objęciu Białego Domu możesz prowadzić własną kampanię do Kongresu. System rozgrywa osobno Izbę Reprezentantów i Senat.</p><button class="btn primary" onclick="toast('Najpierw wygraj wybory prezydenckie.')">Kampania zablokowana</button>`)}${C('','Kongres',stat('Izba','435 miejsc')+stat('Senat','100 miejsc'))}</div>`;if(G.congressCampaign.phase==='results')return `<div class="grid">${C('wide','🏛️ Wyniki wyborów do Kongresu',`<div class="resultBanner"><div class="metric">Izba: ${G.houseD} D / ${G.houseR} R / ${G.houseI} I</div><p>Senat: ${G.senateD} D / ${G.senateR} R / ${G.senateI} I</p></div>`)}${C('full','Mapa stanów — Senat',mapHTML('senateMap','senate'))}${C('half','Kontrola Kongresu',stat('Izba',houseControl())+stat('Senat',senateControl()))}${C('half','Kadencja',`<p class="muted">Następna kampania kongresowa: ${G.nextCongress}.</p>`)} </div>`;return `<div class="grid">${C('wide','Kampania parlamentarna',`<div class="campaignHero"><div class="campaignDay">Dzień ${G.congressCampaign.day} / ${G.congressCampaign.totalDays}</div><div class="progress"><i style="width:${G.congressCampaign.day/G.congressCampaign.totalDays*100}%"></i></div><p class="muted">Buduj zaplecze dla kandydatów do Izby i Senatu. Kampania kończy się automatycznie.</p></div>`)}${C('','Stan Kongresu',stat('Izba',`${G.houseD} D / ${G.houseR} R / ${G.houseI} I`)+stat('Senat',`${G.senateD} D / ${G.senateR} R / ${G.senateI} I`))}${C('full','Mapa kampanii',mapHTML('congressMap','political'))}${C('wide','Operacje kampanijne',`<div class="campaignGrid"><button class="campaignAction btn" onclick="congressAction('ground')"><b>🤝 Organizacja terenu</b>-$30M</button><button class="campaignAction btn" onclick="congressAction('tv')"><b>📺 Reklama TV</b>-$55M</button><button class="campaignAction btn" onclick="congressAction('fund')"><b>💰 Fundraising</b>+$65M</button><button class="campaignAction btn" onclick="congressAction('endorse')"><b>⭐ Poparcie liderów</b>-$20M</button><button class="campaignAction btn" onclick="congressAction('attack')"><b>⚔️ Kampania negatywna</b>-$40M</button></div>`)}${C('','Start',`<p class="muted">${G.congressCampaign.day===1?'Kampania właśnie się rozpoczęła.':'Kampania trwa.'}</p>`)}</div>`}
function congressAction(a){if(!G.congressCampaign?.active)return;const cost={ground:30,tv:55,fund:0,endorse:20,attack:40}[a];if(G.cash<cost)return toast('Brak środków');G.cash-=cost;if(a==='fund')G.cash+=65;else if(a==='ground'){G.houseD+=Math.random()<.65?2:1;G.senateD+=Math.random()<.5?1:0}else if(a==='tv'){G.houseD+=3;G.senateD+=Math.random()<.55?1:0}else if(a==='endorse'){G.houseD+=2;G.senateD+=1}else G.houseR=Math.max(0,G.houseR-2);normalizeCongress();saveNews('🏛️ Wykonano operację kampanii do Kongresu.');save();render()}
function normalizeCongress(){G.houseD=clamp(Math.round(G.houseD),0,435);G.houseI=clamp(Math.round(G.houseI),0,435-G.houseD);G.houseR=435-G.houseD-G.houseI;G.senateD=clamp(Math.round(G.senateD),0,100);G.senateI=clamp(Math.round(G.senateI),0,100-G.senateD);G.senateR=100-G.senateD-G.senateI}
function finishCongress(){G.congressCampaign.phase='results';G.congressCampaign.active=false;normalizeCongress();G.nextCongress=G.year+2;saveNews(`🏛️ Zakończono wybory do Kongresu. Izba: ${houseControl()}, Senat: ${senateControl()}.`);save();render()}
function houseControl(){return G.houseD>G.houseR&&G.houseD>G.houseI?'Demokraci':G.houseR>G.houseD&&G.houseR>G.houseI?'Republikanie':'Brak większości'}
function senateControl(){return G.senateD>G.senateR&&G.senateD>G.senateI?'Demokraci':G.senateR>G.senateD&&G.senateR>G.senateI?'Republikanie':'Brak większości'}
function signLaw(i){const l=G.laws[i];if(!l||!['Do podpisu','U prezydenta'].includes(l.status))return;if(!G.president)return toast('Nie jesteś prezydentem');if(l.cost>G.cash)return toast('Brak środków na realizację ustawy');G.cash-=l.cost;l.status='Podpisana';G.gdp+=Math.max(0,l.cost||0)*.012;G.popularity=clamp(G.popularity+.4,0,100);saveNews(`✍️ Podpisałeś ustawę „${l.name}”.`);save();render()}
function vetoLaw(i){const l=G.laws[i];if(!l||!['Do podpisu','U prezydenta'].includes(l.status))return;if(!G.president)return toast('Nie jesteś prezydentem');l.status='Zawetowana';saveNews(`🛑 Zawetowałeś ustawę „${l.name}”.`);save();render()}
function vLaws(){return `<div class="grid">${C('wide','Ustawy federalne — nowy proces',`<p class="muted">Projekt → komisja → Izba (218) → Senat (51) → uzgodnienie → podpis lub weto. Głosowania są zapisywane osobno, więc ustawa nie znika i nie zmienia statusu bez powodu.</p><button class="btn primary" onclick="lawModal()">✍️ Napisz projekt ustawy</button>`)}${C('','Wymogi',stat('Izba','218 / 435')+stat('Senat','51 / 100')+stat('Prezydent',G.president?'Podpis / weto':'Nie pełnisz urzędu'))}${C('full','Rejestr ustaw',G.laws.length?`<div class="tablewrap"><table><thead><tr><th>Ustawa</th><th>Komisja</th><th>Izba</th><th>Senat</th><th>Status</th><th>Akcja</th></tr></thead><tbody>${G.laws.slice().reverse().map((l,ri)=>{const i=G.laws.length-1-ri;return `<tr><td><b>${l.name}</b><br><span class="muted">${l.desc}</span></td><td>${l.committee}</td><td>${l.houseVotes}/435</td><td>${l.senateVotes}/100</td><td><span class="badge ${l.status==='Podpisana'?'g':l.status==='Zawetowana'||l.status==='Odrzucona'?'r':'y'}">${l.status}</span></td><td>${l.status==='Do podpisu'&&G.president?`<button class="btn green" onclick="signLaw(${i})">Podpisz</button> <button class="btn danger" onclick="vetoLaw(${i})">Weto</button>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Brak projektów ustaw.</div>')}${C('full','Poprawki do Konstytucji',`${G.amendments.length?G.amendments.slice().reverse().map((a,ri)=>{const i=G.amendments.length-1-ri;return `<div class="list"><b>${a.name}</b><div class="muted">${a.text}</div>${stat('Izba',a.houseVotes+'/435')}${stat('Senat',a.senateVotes+'/100')}${stat('Stany',a.statesYes+'/50')}${stat('Status',a.status)}</div>`}).join(''):'<div class="empty">Brak poprawek.</div>'}<div class="rowActions"><button class="btn primary" onclick="amendmentModal()">⚖️ Zaproponuj poprawkę</button></div>`)}</div>`}
function lawModal(){openModal(`<h2>Nowy projekt ustawy</h2><label>Nazwa</label><input id="lawName" value="Ustawa o modernizacji infrastruktury"><label>Komisja</label><select id="lawCommittee"><option>Finanse i budżet</option><option>Gospodarka</option><option>Zdrowie</option><option>Obrona</option><option>Technologie</option><option>Sprawy zagraniczne</option></select><label>Opis</label><textarea id="lawDesc">Projekt ustawy federalnej.</textarea><label>Koszt budżetowy (mln $)</label><input id="lawCost" type="number" min="0" value="40"><button class="btn primary" onclick="submitLaw()">Przeprowadź ustawę przez Kongres</button>`)}
function submitLaw(){const name=document.getElementById('lawName').value.trim()||'Nowa ustawa';const committee=document.getElementById('lawCommittee').value;const desc=document.getElementById('lawDesc').value.trim();const cost=Math.max(0,+document.getElementById('lawCost').value||0);let house=Math.round(G.houseD+G.houseI+G.houseR*(G.popularity/100)*.65+Math.random()*16-8);let senate=Math.round(G.senateD+G.senateI+G.senateR*(G.popularity/100)*.65+Math.random()*7-3);house=clamp(house,0,435);senate=clamp(senate,0,100);let status=house>=218&&senate>=51?'Do podpisu':'Odrzucona';G.laws.push({name,committee,desc,cost,houseVotes:house,senateVotes:senate,status,created:`${G.day}.${G.month}.${G.year}`});saveNews(status==='Do podpisu'?`📜 Ustawa „${name}” przeszła obie izby.`:`📜 Ustawa „${name}” upadła podczas głosowania.`);closeModal();save();render()}
function signLaw(i){const l=G.laws[i];if(!l||l.status!=='Do podpisu')return;if(!G.president)return toast('Nie jesteś prezydentem');if(l.cost>G.cash)return toast('Brak środków na realizację ustawy');G.cash-=l.cost;l.status='Podpisana';G.gdp+=l.cost*.012;G.popularity=clamp(G.popularity+(l.cost?1:.3),0,100);saveNews(`✍️ Podpisałeś ustawę „${l.name}”.`);save();render()}
function vetoLaw(i){const l=G.laws[i];if(!l||l.status!=='Do podpisu')return;l.status='Zawetowana';G.popularity=clamp(G.popularity-.5,0,100);saveNews(`🛑 Zawetowałeś ustawę „${l.name}”.`);save();render()}
function amendmentModal(){openModal(`<h2>⚖️ Poprawka do Konstytucji</h2><p class="muted">Gra wymaga 2/3 w Izbie, 2/3 w Senacie i ratyfikacji przez 38 z 50 stanów.</p><label>Nazwa</label><input id="amName" value="Poprawka dotycząca praw obywatelskich"><label>Treść</label><textarea id="amText">Kongres proponuje zmianę Konstytucji Stanów Zjednoczonych.</textarea><button class="btn primary" onclick="submitAmendment()">Uruchom procedurę</button>`)}
function submitAmendment(){const name=document.getElementById('amName').value.trim()||'Nowa poprawka';const text=document.getElementById('amText').value.trim()||'Proponowana zmiana';const h=G.houseD+G.houseI+Math.round(G.houseR*(G.popularity/100)*.55);const s=G.senateD+G.senateI+Math.round(G.senateR*(G.popularity/100)*.55);let sy=0;STATES.forEach(st=>{const x=G.states[st[1]];if(x.support>=45+Math.random()*20)sy++});const passed=h>=290&&s>=67;const status=passed?(sy>=38?'Ratyfikowana':'W ratyfikacji'):'Odrzucona przez Kongres';G.amendments.push({name,text,houseVotes:clamp(h,0,435),senateVotes:clamp(s,0,100),statesYes:sy,status});saveNews(`⚖️ Poprawka „${name}”: ${status}.`);closeModal();save();render()}
function vStates(){const selected=STATES.find(x=>x[1]===G.selectedState)||STATES[0],sx=G.states[selected[1]];const lead=sx.support>=sx.red&&sx.support>=sx.purple?'Ty':sx.red>=sx.purple?'Rywal':'Niezależni';return `<div class="grid">${C('wide','Mapa Stanów Zjednoczonych',mapHTML('statesMap','presidential'))}${C('','Wybrany stan',`<div class="eyebrow">${selected[1]}</div><div class="metric">${selected[0]}</div>${stat('Głosy elektorskie',selected[2])}${stat('Twoje poparcie',pct(sx.support))}${stat('Rywal czerwony',pct(sx.red))}${stat('Niezależni',pct(sx.purple))}${stat('Prowadzi',lead)}${bar(sx.support)}<div class="rowActions" style="margin-top:10px"><button class="btn primary" onclick="stateRally('${selected[1]}')">Wiec — $20M</button><button class="btn" onclick="targetAds('${selected[1]}')">Reklama — $25M</button></div>`)}${C('','Federalizm',stat('Stany','50')+stat('Kolegium','538')+stat('Próg','270')+`<p class="muted">Kliknij dowolny stan na mapie. Kafelek obok natychmiast pokazuje jego statystyki.</p>`)}${C('full','Tabela stanów',`<div class="tablewrap"><table><thead><tr><th>Stan</th><th>EV</th><th>Twoje poparcie</th><th>Rywal</th><th>Pozycja</th></tr></thead><tbody>${STATES.map(s=>{const x=G.states[s[1]],lead=x.support>=x.red&&x.support>=x.purple?'Ty':x.red>=x.purple?'Rywal':'Niezależni';return `<tr><td><b>${s[0]}</b> (${s[1]})</td><td>${s[2]}</td><td>${pct(x.support)}</td><td>${pct(x.red)}</td><td><span class="badge ${lead==='Ty'?'b':lead==='Rywal'?'r':'y'}">${lead}</span></td></tr>`}).join('')}</tbody></table></div>`)}</div>`}
function vEconomy(){return `<div class="grid">${C('','PKB',`<div class="metric">${G.gdp.toFixed(1)}</div>`)}${C('','Inflacja',`<div class="metric">${G.inflation.toFixed(1)}%</div>`)}${C('','Bezrobocie',`<div class="metric">${G.unemployment.toFixed(1)}%</div>`)}${C('','Skarb',`<div class="metric">${money(G.cash)}</div>`)}${C('wide','Polityka gospodarcza',`<div class="rowActions"><button class="btn primary" onclick="econ('stimulus')">Infrastruktura — $60M</button><button class="btn" onclick="econ('tax')">Reforma podatkowa</button><button class="btn" onclick="econ('austerity')">Oszczędności</button></div>`)}${C('half','Wskaźniki',stat('PKB',G.gdp.toFixed(1))+stat('Inflacja',G.inflation.toFixed(1)+'%')+stat('Bezrobocie',G.unemployment.toFixed(1)+'%'))}</div>`}
function econ(a){if(a==='stimulus'){if(G.cash<60)return toast('Brak środków');G.cash-=60;G.gdp+=2;G.unemployment=Math.max(2.5,G.unemployment-.3);G.inflation+=.25;G.popularity=clamp(G.popularity+1,0,100)}else if(a==='tax'){G.cash+=80;G.gdp+=.5;G.popularity=clamp(G.popularity-1,0,100)}else{G.cash+=70;G.gdp-=.7;G.inflation=Math.max(1,G.inflation-.3);G.popularity=clamp(G.popularity-2,0,100)}saveNews('💵 Wprowadzono zmianę polityki gospodarczej.');save();render()}
function diplomacyCard(c){ensureDiplomacy();const d=G.diplomacy.countries[c];return C('wide selectedStateCard',`🌐 ${c}`,stat('Relacje',Math.round(d.relation)+'/100')+stat('Zaufanie',Math.round(d.trust)+'/100')+stat('Handel',Math.round(d.trade)+'/100')+stat('Ambasada',d.embassy?'Otwarta':'Brak')+bar(d.relation)+`<div class="actionGrid"><button class="btn primary" onclick="buildEmbassy('${encodeURIComponent(c)}')">🏛️ Zbuduj / ulepsz ambasadę — $25M</button><button class="btn danger" onclick="removeEmbassy('${encodeURIComponent(c)}')">🗑️ Zamknij ambasadę</button><button class="btn" onclick="diplomacyAction('${encodeURIComponent(c)}','summit')">🤝 Szczyt przywódców</button><button class="btn" onclick="diplomacyAction('${encodeURIComponent(c)}','trade')">💱 Umowa handlowa</button><button class="btn" onclick="diplomacyAction('${encodeURIComponent(c)}','aid')">💰 Pomoc gospodarcza — $40M</button><button class="btn" onclick="diplomacyAction('${encodeURIComponent(c)}','security')">🛡️ Współpraca bezpieczeństwa</button><button class="btn" onclick="diplomacyAction('${encodeURIComponent(c)}','visit')">✈️ Wizyta państwowa</button><button class="btn danger" onclick="openEmbargo('${encodeURIComponent(c)}')">🚫 Embargo</button></div>`)}
function vForeign(){ensureDiplomacy();const c=G.diplomacy.selected;let orgHtml=ORGS.map(o=>{const d=G.diplomacy.orgs[o[0]];return `<div class="list"><b>${o[0]} — ${o[1]}</b><div class="muted">${d.membership} • relacje ${Math.round(d.relation)}/100</div><div class="rowActions" style="margin-top:7px"><button class="btn" onclick="orgAction('${encodeURIComponent(o[0])}','summit')">Szczyt</button><button class="btn" onclick="orgAction('${encodeURIComponent(o[0])}','fund')">Finansowanie</button></div></div>`}).join('');let embargoHtml=G.diplomacy.embargoes.length?G.diplomacy.embargoes.map((e,i)=>`<div class="list"><b>🚫 ${e.country}</b><div class="muted">${e.targets.join(', ')}</div><div class="muted">Poziom: ${e.level} • ${e.scope==='full'?'pełne embargo':'sektorowe'}</div><button class="btn" onclick="liftEmbargo(${i})">Znieś embargo</button></div>`).join(''):'<div class="empty">Brak aktywnych embarg.</div>';let countryOptions=COUNTRIES.map(x=>`<option value="${x}" ${x===c?'selected':''}>${x}</option>`).join('');return `<div class="grid">${C('','Siła dyplomatyczna',`<div class="metric">${G.foreign}/100</div>${bar(G.foreign)}`)}${C('','Sieć dyplomatyczna',stat('Państwa',COUNTRIES.length)+stat('Organizacje',ORGS.length)+stat('Ambasady',COUNTRIES.reduce((n,x)=>n+(G.diplomacy.countries[x]?.embassy?1:0),0))+stat('Aktywne embarga',G.diplomacy.embargoes.length))}${C('full','Państwa świata',`<div class="notice">Wybierz państwo z listy. Panel pozostaje otwarty, dopóki sam go nie zamkniesz.</div><select onchange="selectCountry(this.value)">${countryOptions}</select>${diplomacyCard(c)}`)}${C('full','Organizacje międzynarodowe',`<div class="campaignGrid">${orgHtml}</div>`)}${C('full','Aktywne embarga',embargoHtml)}</div>`}
function foreign(a){if(a==='aid'){if(G.cash<35)return toast('Brak środków');G.cash-=35;G.foreign=clamp(G.foreign+8,0,100)}else if(a==='summit')G.foreign=clamp(G.foreign+5,0,100);else{G.foreign=clamp(G.foreign-3,0,100);G.popularity=clamp(G.popularity+1,0,100)}saveNews('🌐 Działanie dyplomatyczne wykonane.');save();render()}
function vMilitary(){return `<div class="grid">${C('','Gotowość obronna',`<div class="metric">${G.defense}/100</div>${bar(G.defense)}`)}${C('','Budżet obronny',`<div class="metric">$180M</div>`)}${C('wide','Naczelny Dowódca',`<div class="rowActions"><button class="btn primary" onclick="military('modernize')">Modernizacja — $70M</button><button class="btn" onclick="military('ready')">Gotowość — $40M</button><button class="btn" onclick="military('diplomacy')">Redukcja napięć</button></div>`)}${C('half','Informacja strategiczna',stat('Gotowość',G.defense+'/100')+stat('Relacje',G.foreign+'/100'))}</div>`}
function military(a){const c=a==='modernize'?70:a==='ready'?40:0;if(c&&G.cash<c)return toast('Brak środków');G.cash-=c;if(a==='modernize')G.defense=clamp(G.defense+9,0,100);else if(a==='ready')G.defense=clamp(G.defense+5,0,100);else{G.defense=clamp(G.defense-2,0,100);G.foreign=clamp(G.foreign+5,0,100)}saveNews('🛡️ Zmieniono politykę obronną.');save();render()}
function vEvents(){return `<div class="grid">${C('wide','Wydarzenia i decyzje',newsHTML())}${C('','Kalendarz',stat('Data',`${G.day}.${G.month}.${G.year}`)+stat('Następne wybory prezydenckie',G.nextPresidential)+stat('Kongres',G.nextCongress))}${C('full','Automatyczny świat',`<p class="muted">Każdy dzień może przynieść zmianę gospodarki, nastrojów społecznych, Kongresu i polityki zagranicznej. Nie ma ręcznego przycisku „przejdź miesiąc” — czas działa sam.</p>`)}</div>`}
function vOval(){if(!G.oval.unlocked)return `<div class="lockedPanel"><div class="big">🔒</div><h2>Gabinet Owalny</h2><p class="muted">Pokój prezydenta zostanie odblokowany po zwycięstwie wyborczym.</p></div>`;return `<div class="grid">${C('full oval','🦅 Gabinet Owalny',`<div class="ovalGrid"><div><div class="eyebrow">The White House</div><div class="metric big">Prezydent USA</div><p class="muted">Najważniejsze decyzje państwa wykonujesz tutaj. To główny panel zarządzania po zwycięstwie.</p>${stat('Aprobata',pct(G.popularity))}${stat('Rozkazy wykonawcze',G.oval.orders)}${stat('Personel Białego Domu',G.oval.staff)}${stat('Program prezydenta',G.oval.agenda.length?'Aktywny':'Brak')}</div><div><h3>Centrum decyzji</h3><div class="rowActions"><button class="btn primary" onclick="ovalAction('order')">✍️ Rozkaz wykonawczy</button><button class="btn" onclick="ovalAction('staff')">👥 Zatrudnij personel — $15M</button><button class="btn" onclick="ovalAction('agenda')">📋 Ustal priorytet</button><button class="btn" onclick="ovalAction('press')">🎙️ Konferencja prasowa</button></div></div></div>`)}${C('half','Gabinet',stat('Szef personelu',G.oval.chief)+stat('Aprobata',G.oval.approvals+'/100'))}${C('half','Kongres',stat('Izba',houseControl())+stat('Senat',senateControl())+`<button class="btn" onclick="setPage('laws')">Przejdź do ustaw</button>`)}${C('wide','Priorytety prezydenta',G.oval.agenda.length?G.oval.agenda.map(x=>`<div class="list">${x}</div>`).join(''):'<div class="empty">Nie ustawiono jeszcze priorytetów.</div>')}${C('','Stan państwa',stat('PKB',G.gdp.toFixed(1))+stat('Inflacja',G.inflation.toFixed(1)+'%')+stat('Obrona',G.defense+'/100')+stat('Dyplomacja',G.foreign+'/100'))}</div>`}

function stateInfo(a){G.selectedState=a;save();render()}
function stateActionButtons(){return `<div class="actionGrid"><button class="btn primary" onclick="campaignAction('rally')">📣 Wiec krajowy — $35M</button><button class="btn" onclick="campaignAction('tv')">📺 TV — $60M</button><button class="btn" onclick="campaignAction('web')">💻 Internet — $30M</button><button class="btn" onclick="campaignAction('radio')">📻 Radio — $25M</button><button class="btn" onclick="campaignAction('grassroots')">🏘️ Organizacja lokalna — $20M</button><button class="btn" onclick="campaignAction('volunteers')">🙋 Wolontariusze — $15M</button><button class="btn" onclick="campaignAction('debate')">🎙️ Debata — bez kosztu</button><button class="btn danger" onclick="campaignAction('attack')">⚔️ Atak — $45M</button></div>`}
function selectedStatePanel(){if(!G.selectedState)return C('wide','🇺🇸 Opcje ogólne',stat('Poparcie krajowe',pct(G.popularity))+stat('Prognoza EV',forecastEV()+'/538')+stat('Gotówka',money(G.cash))+stat('PKB',G.gdp.toFixed(1))+stat('Inflacja',G.inflation.toFixed(1)+'%')+stat('Kurs dolara','$'+G.dollar.toFixed(2))+`<div class="notice">Kliknij stan na mapie, aby zobaczyć jego statystyki. Kliknij czarne tło mapy, aby wrócić do statystyk ogólnych.</div>`+stateActionButtons());const st=STATES.find(x=>x[1]===G.selectedState)||STATES[0],x=G.states[st[1]],lead=x.support>=x.red&&x.support>=x.purple?'Ty':x.red>=x.purple?'Rywal':'Niezależni';return C('wide selectedStateCard',`📍 ${st[0]} (${st[1]})`,stat('Głosy elektorskie',st[2])+stat('Twoje poparcie',pct(x.support))+stat('Rywal czerwony',pct(x.red))+stat('Niezależni',pct(x.purple))+stat('Prowadzi',lead)+bar(x.support)+`<div class="rowActions"><button class="btn primary" onclick="stateRally('${st[1]}')">📣 Wiec w stanie — $20M</button><button class="btn" onclick="targetAds('${st[1]}')">📡 Reklama stanowa — $25M</button></div><div class="notice">Kolor stanu odpowiada aktualnemu liderowi.</div>`) }
function vOverview(){const gov=G.president?'<span class="presidentBadge">Prezydent USA</span>':'<span class="badge y">Kandydat</span>';return `<div class="grid">${C('wide','Centrum dowodzenia',`<div class="metric">${gov}</div><p class="muted">${G.president?'Państwo jest teraz pod Twoim kierownictwem.':'Prowadź kampanię, zarządzaj stanami i buduj większość.'}</p>`)}${C('','Poparcie krajowe',`<div class="metric">${pct(G.popularity)}</div>${bar(G.popularity)}${stat('Tempo','powolne')}`)}${C('','Kolegium Elektorów',`<div class="metric">${G.election.phase==='results'||G.election.phase==='electionNight'?ev():forecastEV()} / 270</div>`)}${C('','Skarb',`<div class="metric">${money(G.cash)}</div>`)}${C('half','Główne statystyki',stat('PKB',G.gdp.toFixed(1))+stat('Inflacja',G.inflation.toFixed(1)+'%')+stat('Bezrobocie',G.unemployment.toFixed(1)+'%')+stat('USD','$'+G.dollar.toFixed(2)))}${selectedStatePanel()}${C('wide','Mapa polityczna USA',mapHTML('overviewMap',G.election.active?'presidential':'political',true)+`<div class="legend"><span><i class="dot dBlue"></i>Ty</span><span><i class="dot dRed"></i>Rywal</span><span><i class="dot dPurple"></i>Niezależni</span></div>`)}${C('full','Akcje ogólne',stateActionButtons())}${C('full','Dziennik',newsHTML())}</div>`}
function vElection(){if(G.election.phase==='results')return `<div class="grid">${C('wide',G.election.winner==='blue'?'🎉 Biały Dom zdobyty':'❌ Wybory przegrane',`<div class="metric">${ev()} / 538 EV</div>`)}${C('full','Mapa wyników',mapHTML('electionResultsMap','presidential'))}</div>`;return `<div class="grid">${C('wide','Kampania prezydencka',`<div class="campaignDay">Dzień ${G.election.day} / ${G.election.totalDays}</div><div class="progress"><i style="width:${G.election.day/G.election.totalDays*100}%"></i></div><p class="muted">Poparcie rośnie wolniej. Kolory stanów są przeliczane po każdej akcji.</p>`)}${C('','Sondaż krajowy',`<div class="metric">${pct(G.popularity)}</div>${bar(G.popularity)}${stat('Prognoza EV',forecastEV())}`)}${selectedStatePanel()}${C('wide','Mapa stanów',mapHTML('electionMap','presidential'))}${C('wide','Wszystkie akcje kampanii',stateActionButtons())}${C('','Kandydaci',stat('Ty',PARTY.blue.name)+stat('Rywal',PARTY.red.name)+stat('Niezależni',PARTY.purple.name))}${C('full','Dziennik kampanii',newsHTML())}</div>`}
function campaignAction(type){if(!G.election.active||G.election.phase!=='campaign')return toast('Kampania zakończona');const costs={rally:35,tv:60,web:30,fund:0,debate:0,attack:45,radio:25,grassroots:20,volunteers:15};const c=costs[type]||0;if(G.cash<c)return toast('Brak środków');G.cash-=c;let national=0;if(type==='rally'){national=1;STATES.forEach(s=>G.states[s[1]].support=clamp(G.states[s[1]].support+.25,0,70))}if(type==='tv'){national=1.2;STATES.forEach(s=>G.states[s[1]].support=clamp(G.states[s[1]].support+.3,0,70))}if(type==='web'){national=.7;STATES.filter(s=>['AZ','GA','MI','NV','NC','PA','WI'].includes(s[1])).forEach(s=>G.states[s[1]].support=clamp(G.states[s[1]].support+.8,0,70))}if(type==='fund'){G.cash+=70;national=-.15}if(type==='debate')national=Math.random()*1.2-.3;if(type==='attack'){national=Math.random()*.8-.25;STATES.filter(s=>Math.random()<.3).forEach(s=>G.states[s[1]].red=clamp(G.states[s[1]].red-.5,30,65))}if(type==='radio'){national=.5}if(type==='grassroots'){national=.45}if(type==='volunteers'){national=.3}G.popularity=clamp(G.popularity+national,0,100);G.campaign=clamp(G.campaign+1,0,100);saveNews(`🗳️ Wykonano akcję kampanii: ${type}.`);save();render()}
function stateRally(a){if(G.cash<20)return toast('Brak środków');G.cash-=20;G.states[a].support=clamp(G.states[a].support+1.8+Math.random()*1.2,0,75);G.popularity=clamp(G.popularity+.1,0,100);saveNews(`📍 Wiec w ${a} lekko zmienił poparcie.`);save();render()}
function targetAds(a){if(G.cash<25)return toast('Brak środków');G.cash-=25;G.states[a].support=clamp(G.states[a].support+1.5,0,75);saveNews(`📡 Reklama celowana w ${a} zmieniła sondaż.`);save();render()}
function economyChart(key,label){const arr=G.economyHistory||[];const vals=arr.slice(-24).map(x=>+x[key]);if(vals.length<2)return '<div class="empty">Wykres zacznie się tworzyć wraz z upływem czasu.</div>';const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1,pts=vals.map((v,i)=>`${i/(vals.length-1)*100},${100-((v-min)/range)*82-9}`).join(' ');return `<div class="chart"><svg viewBox="0 0 100 120" preserveAspectRatio="none"><line class="chartGrid" x1="0" y1="20" x2="100" y2="20"/><line class="chartGrid" x1="0" y1="60" x2="100" y2="60"/><line class="chartGrid" x1="0" y1="100" x2="100" y2="100"/><polyline class="chartLine" points="${pts}"/></svg></div><div class="muted">${label} • ${vals.length} ostatnich okresów</div>`}
function vEconomy(){return `<div class="grid">${C('','PKB',`<div class="metric">${G.gdp.toFixed(1)}</div>`)}${C('','Inflacja',`<div class="metric">${G.inflation.toFixed(1)}%</div>`)}${C('','Bezrobocie',`<div class="metric">${G.unemployment.toFixed(1)}%</div>`)}${C('','Kurs dolara',`<div class="metric">$${G.dollar.toFixed(2)}</div>`)}${C('wide','PKB — wykres',economyChart('gdp','PKB'))}${C('half','Inflacja — wykres',economyChart('inflation','Inflacja'))}${C('half','Bezrobocie — wykres',economyChart('unemployment','Bezrobocie'))}${C('wide','Kurs dolara — wykres',economyChart('dollar','USD'))}${C('','Statystyki',stat('PKB',G.gdp.toFixed(1))+stat('Inflacja',G.inflation.toFixed(1)+'%')+stat('Bezrobocie',G.unemployment.toFixed(1)+'%')+stat('USD','$'+G.dollar.toFixed(2))+stat('Skarb',money(G.cash)))}${C('wide','Decyzje gospodarcze',`<div class="rowActions"><button class="btn primary" onclick="econ('stimulus')">🏗️ Infrastruktura — $60M</button><button class="btn" onclick="econ('tax')">💰 Reforma podatkowa</button><button class="btn" onclick="econ('austerity')">📉 Oszczędności</button></div>`)}</div>`}
function advanceEconomy(){G.cash=Math.max(0,G.cash+Math.round(3+Math.random()*4-G.unemployment*.25));G.gdp=clamp(G.gdp+.04+(Math.random()-.5)*.08,70,180);G.unemployment=clamp(G.unemployment+(Math.random()-.5)*.08,2.5,10);G.inflation=clamp(G.inflation+(Math.random()-.5)*.06,1,9);G.dollar=clamp(G.dollar+(G.inflation<3.5?.002:-.003)+(G.gdp>110?.001:-.001)+(Math.random()-.5)*.008,.65,1.45);G.economyHistory.push({gdp:G.gdp,inflation:G.inflation,unemployment:G.unemployment,dollar:G.dollar});G.economyHistory=G.economyHistory.slice(-60)}
function resolvePendingLaws(){G.laws.forEach(l=>{if((l.status==='Do podpisu'||l.status==='U prezydenta')&&!G.president){l.pendingDays=(l.pendingDays||0)+1;if(l.pendingDays>=1){if(Math.random()<.65){l.status='Podpisana';saveNews(`🏛️ Urzędujący prezydent podpisał ustawę „${l.name}”.`)}else{l.status='Zawetowana';saveNews(`🛑 Urzędujący prezydent zawetował ustawę „${l.name}”.`)}l.pendingDays=0}}})}
function tick(){if(G.paused||G.election?.phase==='electionNight')return;for(let n=0;n<Math.max(1,G.timeSpeed);n++){G.minute+=60;if(G.minute>=60){G.minute=0;G.hour++}if(G.hour>=24){G.hour=0;G.day++;advanceEconomy();resolvePendingLaws();if(G.election?.active&&G.election.phase==='campaign'){G.election.day++;if(G.election.day>G.election.totalDays)startElectionNight()}if(G.congressCampaign?.active&&G.congressCampaign.phase==='campaign'){G.congressCampaign.day++;if(G.congressCampaign.day>G.congressCampaign.totalDays)finishCongress()}if(G.day>daysInMonth(G.year,G.month)){G.day=1;G.month++;if(G.month>12){G.month=1;G.year++}}}}updateClock();save()}
// Make map background restore the general panel.
const oldInitMap=initMap;initMap=async function(id,mode='political'){await oldInitMap(id,mode);const root=document.getElementById(id);const svg=root&&root.querySelector('svg');if(svg)svg.addEventListener('click',e=>{if(e.target===svg)clearSelectedState()})}
// Scope selector for federal bills and automatic incumbent resolution.
const oldLawModal=lawModal;lawModal=function(){openModal(`<h2>Nowy projekt ustawy</h2><label>Nazwa</label><input id="lawName" value="Ustawa o modernizacji infrastruktury"><label>Komisja</label><select id="lawCommittee"><option>Finanse i budżet</option><option>Gospodarka</option><option>Zdrowie</option><option>Obrona</option><option>Technologie</option><option>Sprawy zagraniczne</option></select><label>Opis</label><textarea id="lawDesc">Projekt ustawy federalnej.</textarea><label>Zasięg</label><select id="lawScope"><option value="all">Wszystkie stany</option>${STATES.map(x=>`<option value="${x[1]}">${x[0]}</option>`).join('')}</select><label>Koszt budżetowy (mln $)</label><input id="lawCost" type="number" min="0" value="40"><button class="btn primary" onclick="submitLawV5()">Przeprowadź ustawę przez Kongres</button>`)}
function submitLawV5(){const name=document.getElementById('lawName').value.trim()||'Nowa ustawa',committee=document.getElementById('lawCommittee').value,desc=document.getElementById('lawDesc').value.trim(),cost=Math.max(0,+document.getElementById('lawCost').value||0),scope=document.getElementById('lawScope').value;let house=clamp(Math.round(G.houseD+G.houseI+G.houseR*(G.popularity/100)*.65+Math.random()*16-8),0,435),senate=clamp(Math.round(G.senateD+G.senateI+G.senateR*(G.popularity/100)*.65+Math.random()*7-3),0,100);const status=house>=218&&senate>=51?'U prezydenta':'Odrzucona';G.laws.push({name,committee,desc,cost,scope,houseVotes:house,senateVotes:senate,status,created:`${G.day}.${G.month}.${G.year}`,pendingDays:0});saveNews(status==='U prezydenta'?`📜 Ustawa „${name}” przeszła Kongres i trafiła do urzędującego prezydenta.`:`📜 Ustawa „${name}” upadła podczas głosowania.`);closeModal();save();render()}
function vLaws(){return `<div class="grid">${C('wide','Ustawy federalne',`<p class="muted">Każdy projekt ma zasięg: wszystkie stany albo wybrany stan. Po przejściu Kongresu ustawa trafia do urzędującego prezydenta. Jeśli nim nie jesteś, prezydent urzędujący automatycznie podpisze ją albo zawetuje po upływie czasu.</p><button class="btn primary" onclick="lawModal()">✍️ Napisz projekt ustawy</button>`)}${C('','Wymogi',stat('Izba','218 / 435')+stat('Senat','51 / 100')+stat('Twoja prezydentura',G.president?'Aktywna':'Jeszcze nie'))}${C('full','Rejestr ustaw',G.laws.length?`<div class="tablewrap"><table><thead><tr><th>Ustawa</th><th>Komisja</th><th>Izba</th><th>Senat</th><th>Zasięg</th><th>Status</th><th>Akcja</th></tr></thead><tbody>${G.laws.slice().reverse().map((l,ri)=>{const i=G.laws.length-1-ri;return `<tr><td><b>${l.name}</b><br><span class="muted">${l.desc}</span></td><td>${l.committee}</td><td>${l.houseVotes}/435</td><td>${l.senateVotes}/100</td><td>${l.scope==='all'?'Wszystkie stany':l.scope||'Wszystkie stany'}</td><td><span class="badge ${l.status==='Podpisana'?'g':l.status==='Zawetowana'||l.status==='Odrzucona'?'r':'y'}">${l.status}</span></td><td>${(l.status==='U prezydenta'||l.status==='Do podpisu')&&G.president?`<button class="btn green" onclick="signLaw(${i})">Podpisz</button> <button class="btn danger" onclick="vetoLaw(${i})">Weto</button>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Brak projektów ustaw.</div>')}</div>`}
function selectCountry(c){ensureDiplomacy();if(c)G.diplomacy.selected=c;save();render()}
function buildEmbassy(c){c=decodeURIComponent(c);ensureDiplomacy();const d=G.diplomacy.countries[c];if(G.cash<25)return toast('Brak środków');G.cash-=25;d.embassy=Math.min(3,d.embassy+1);d.relation=clamp(d.relation+4,0,100);d.trust=clamp(d.trust+3,0,100);saveNews(`🏛️ Rozbudowano placówkę USA w ${c}. Poziom ambasady: ${d.embassy}.`);save();render()}
function removeEmbassy(c){c=decodeURIComponent(c);ensureDiplomacy();const d=G.diplomacy.countries[c];if(!d.embassy)return toast('Brak ambasady w tym państwie');d.embassy=0;d.relation=clamp(d.relation-5,0,100);saveNews(`🗑️ Zamknięto ambasadę USA w ${c}.`);save();render()}
function diplomacyAction(c,a){c=decodeURIComponent(c);ensureDiplomacy();const d=G.diplomacy.countries[c];if(a==='summit'){d.relation=clamp(d.relation+4,0,100);d.trust=clamp(d.trust+5,0,100);G.foreign=clamp(G.foreign+2,0,100)}if(a==='trade'){d.trade=clamp(d.trade+8,0,100);d.relation=clamp(d.relation+2,0,100);G.cash+=20}if(a==='aid'){if(G.cash<40)return toast('Brak środków');G.cash-=40;d.relation=clamp(d.relation+7,0,100);d.trust=clamp(d.trust+5,0,100)}if(a==='security'){d.trust=clamp(d.trust+6,0,100);d.relation=clamp(d.relation+3,0,100);G.defense=clamp(G.defense+1,0,100)}if(a==='visit'){d.relation=clamp(d.relation+3,0,100);d.trust=clamp(d.trust+4,0,100)}saveNews(`🌐 Wykonano działanie dyplomatyczne wobec ${c}.`);save();render()}
function orgAction(o,a){o=decodeURIComponent(o);ensureDiplomacy();const d=G.diplomacy.orgs[o];if(a==='summit')d.relation=clamp(d.relation+4,0,100);else {if(G.cash<30)return toast('Brak środków');G.cash-=30;d.relation=clamp(d.relation+3,0,100)}G.foreign=clamp(G.foreign+1,0,100);saveNews(`🏛️ Działanie wobec organizacji ${o}.`);save();render()}
function openEmbargo(c){c=decodeURIComponent(c);ensureDiplomacy();openModal(`<h2>🚫 Embargo — ${c}</h2><p class="muted">To rozbudowane okno pozostanie otwarte, dopóki nie wybierzesz „Nałóż embargo” albo „Zamknij”. Możesz wybrać wiele sektorów.</p><label>Zakres</label><select id="embargoScope"><option value="sector">Embargo sektorowe</option><option value="full">Pełne embargo handlowe</option></select><label>Poziom</label><select id="embargoLevel"><option>Lekkie</option><option>Średnie</option><option>Surowe</option><option>Maksymalne</option></select><label>Na co embargo?</label><div class="embargoList">${EMBARGO_TARGETS.map((x,i)=>`<label class="list"><input type="checkbox" name="embTarget" value="${i}"> ${x}</label>`).join('')}</div><label>Uzasadnienie</label><textarea id="embargoReason" placeholder="Powód decyzji prezydenta..."></textarea><div class="notice">Embargo pogarsza relacje i może ograniczyć handel, ale zwiększa presję polityczną.</div><div class="rowActions"><button class="btn danger" onclick="applyEmbargo('${encodeURIComponent(c)}')">🚫 Nałóż embargo</button><button class="btn" onclick="closeModal()">Zamknij bez zmian</button></div>`)}
function applyEmbargo(c){c=decodeURIComponent(c);ensureDiplomacy();const targets=[...document.querySelectorAll('input[name="embTarget"]:checked')].map(x=>EMBARGO_TARGETS[+x.value]);const scope=document.getElementById('embargoScope').value,level=document.getElementById('embargoLevel').value;if(!targets.length&&scope!=='full')return toast('Wybierz przynajmniej jeden sektor');const d=G.diplomacy.countries[c];const penalty=level==='Maksymalne'?12:level==='Surowe'?8:level==='Średnie'?5:3;d.relation=clamp(d.relation-penalty,0,100);d.trade=clamp(d.trade-penalty*2,0,100);G.foreign=clamp(G.foreign+1,0,100);G.diplomacy.embargoes.push({country:c,targets:scope==='full'?['Cały handel']:targets,scope,level,reason:document.getElementById('embargoReason').value.trim(),date:`${G.day}.${G.month}.${G.year}`});saveNews(`🚫 Nałożono ${level.toLowerCase()} embargo na ${c}.`);closeModal();save();render()}
function liftEmbargo(i){const e=G.diplomacy.embargoes[i];if(!e)return;const d=G.diplomacy.countries[e.country];d.relation=clamp(d.relation+4,0,100);d.trade=clamp(d.trade+8,0,100);G.diplomacy.embargoes.splice(i,1);saveNews(`✅ Zniesiono embargo wobec ${e.country}.`);save();render()}
render();
</script></body></html>
