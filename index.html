```html
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Millionaire City 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#07100d;
    --panel:rgba(10,22,18,.82);
    --panel2:rgba(15,31,25,.9);
    --border:rgba(255,255,255,.09);
    --text:#f4fff9;
    --muted:#91a79d;
    --green:#39e58c;
    --green2:#18b86b;
    --blue:#55b7ff;
    --yellow:#ffd35a;
    --red:#ff5c68;
    --grid:50px;
}

body{
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 10%,rgba(31,120,79,.18),transparent 30%),
        radial-gradient(circle at 80% 90%,rgba(30,105,160,.15),transparent 30%),
        #06100c;
    color:var(--text);
    font-family:Inter,Segoe UI,Arial,sans-serif;
}

/* TOP BAR */

.topbar{
    position:fixed;
    z-index:1000;
    left:18px;
    right:18px;
    top:15px;
    height:76px;
    border:1px solid var(--border);
    border-radius:22px;
    background:rgba(7,17,13,.78);
    backdrop-filter:blur(22px);
    box-shadow:0 15px 50px rgba(0,0,0,.35);
    display:flex;
    align-items:center;
    gap:14px;
    padding:12px 16px;
}

.logo{
    min-width:190px;
}

.logo h1{
    font-size:20px;
    letter-spacing:-.5px;
}

.logo span{
    font-size:11px;
    color:var(--muted);
}

.stats{
    display:flex;
    gap:9px;
    flex:1;
}

.stat{
    min-width:125px;
    padding:9px 13px;
    border-radius:15px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.06);
}

.stat small{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-bottom:3px;
}

.stat strong{
    font-size:16px;
}

.money{
    color:var(--green);
}

.income{
    color:#72d8ff;
}

.top-actions{
    display:flex;
    gap:7px;
}

.iconBtn{
    width:43px;
    height:43px;
    border-radius:13px;
    border:1px solid var(--border);
    color:white;
    background:rgba(255,255,255,.06);
    cursor:pointer;
    font-size:18px;
}

.iconBtn:hover{
    background:rgba(255,255,255,.12);
}

/* LEFT MENU */

.sidebar{
    position:fixed;
    z-index:900;
    top:110px;
    bottom:18px;
    left:18px;
    width:225px;
    padding:14px;
    border-radius:22px;
    background:rgba(7,17,13,.78);
    border:1px solid var(--border);
    backdrop-filter:blur(20px);
    box-shadow:0 15px 50px rgba(0,0,0,.3);
}

.menuTitle{
    color:var(--muted);
    text-transform:uppercase;
    font-size:10px;
    padding:8px 10px;
    letter-spacing:1px;
}

.menuBtn{
    width:100%;
    border:0;
    background:transparent;
    color:#c9d8d1;
    padding:13px;
    text-align:left;
    border-radius:13px;
    cursor:pointer;
    margin-bottom:4px;
    font-size:13px;
}

.menuBtn:hover,
.menuBtn.active{
    background:linear-gradient(100deg,rgba(57,229,140,.17),rgba(57,229,140,.04));
    color:white;
}

.menuBtn b{
    margin-right:8px;
}

/* BUILD PANEL */

.buildPanel{
    position:fixed;
    z-index:910;
    left:263px;
    right:18px;
    bottom:18px;
    min-height:125px;
    border:1px solid var(--border);
    background:rgba(7,17,13,.88);
    backdrop-filter:blur(20px);
    border-radius:22px;
    padding:12px;
    box-shadow:0 15px 50px rgba(0,0,0,.3);
}

.buildTop{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
}

.buildTop h3{
    font-size:13px;
    margin-right:10px;
}

.tool{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.05);
    color:#dce9e3;
    border-radius:11px;
    padding:8px 12px;
    cursor:pointer;
    font-size:11px;
}

.tool:hover,
.tool.active{
    border-color:rgba(57,229,140,.4);
    background:rgba(57,229,140,.12);
    color:white;
}

.buildItems{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:3px;
}

.buildCard{
    min-width:105px;
    height:67px;
    border:1px solid rgba(255,255,255,.07);
    border-radius:13px;
    background:rgba(255,255,255,.045);
    padding:8px;
    cursor:pointer;
    transition:.15s;
}

.buildCard:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.09);
}

.buildCard.active{
    border-color:var(--green);
    box-shadow:0 0 20px rgba(57,229,140,.15);
}

.buildEmoji{
    font-size:20px;
}

.buildName{
    display:block;
    font-size:10px;
    margin-top:2px;
}

.buildCost{
    color:var(--yellow);
    font-size:9px;
}

/* MAP */

.viewport{
    position:fixed;
    left:0;
    right:0;
    top:0;
    bottom:0;
    overflow:hidden;
    cursor:grab;
    background:
        radial-gradient(circle at 50% 40%,rgba(73,170,112,.08),transparent 45%),
        #10251a;
}

.viewport.grabbing{
    cursor:grabbing;
}

.world{
    position:absolute;
    width:3600px;
    height:2600px;
    left:0;
    top:0;
    transform-origin:0 0;
    will-change:transform;
}

/* TERRAIN */

.terrain{
    position:absolute;
    inset:0;
    background-color:#173b27;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
        radial-gradient(circle at 15% 30%,rgba(75,155,87,.22),transparent 18%),
        radial-gradient(circle at 70% 65%,rgba(50,140,90,.18),transparent 22%),
        radial-gradient(circle at 85% 15%,rgba(120,170,75,.12),transparent 18%);
    background-size:50px 50px,50px 50px,auto,auto,auto;
}

/* water */

.water{
    position:absolute;
    background:
        repeating-linear-gradient(
            -20deg,
            rgba(255,255,255,.06) 0,
            rgba(255,255,255,.06) 2px,
            transparent 2px,
            transparent 13px
        ),
        linear-gradient(135deg,#126184,#164b72);
    box-shadow:inset 0 0 80px rgba(0,0,0,.2);
}

.water1{
    width:600px;
    height:500px;
    left:0;
    top:0;
    border-radius:0 0 60% 0;
}

.water2{
    width:500px;
    height:430px;
    right:0;
    bottom:0;
    border-radius:70% 0 0 0;
}

/* plots */

.plot{
    position:absolute;
    width:250px;
    height:200px;
    border:1px dashed rgba(255,255,255,.07);
    background:rgba(100,170,105,.025);
    border-radius:10px;
}

/* ROAD CELLS */

.roadLayer{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.road{
    position:absolute;
    width:50px;
    height:50px;
    background:#303938;
    border:1px solid #454e4c;
    box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.2),
        0 2px 5px rgba(0,0,0,.25);
}

.road::before{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:24px;
    height:2px;
    background:repeating-linear-gradient(
        90deg,
        #f4d86a 0 13px,
        transparent 13px 24px
    );
    opacity:.85;
}

.road.vertical::before{
    top:0;
    bottom:0;
    left:24px;
    right:auto;
    width:2px;
    height:auto;
    background:repeating-linear-gradient(
        180deg,
        #f4d86a 0 13px,
        transparent 13px 24px
    );
}

.road.intersection::before{
    display:none;
}

.road.intersection::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(90deg,transparent 47%,#f4d86a 47%,#f4d86a 53%,transparent 53%),
        linear-gradient(transparent 47%,#f4d86a 47%,#f4d86a 53%,transparent 53%);
    opacity:.5;
}

/* 3D BUILDINGS */

.building{
    position:absolute;
    width:80px;
    height:80px;
    cursor:pointer;
    transform-style:preserve-3d;
    z-index:20;
}

.building .shadow{
    position:absolute;
    left:13px;
    top:18px;
    width:80px;
    height:72px;
    background:rgba(0,0,0,.3);
    filter:blur(7px);
    transform:skewY(-10deg);
}

.building .body{
    position:absolute;
    left:0;
    bottom:0;
    width:72px;
    height:62px;
    border-radius:4px;
    transform:skewY(-4deg);
    transform-origin:bottom;
    box-shadow:
        inset -7px 0 rgba(0,0,0,.12),
        4px 8px 0 rgba(0,0,0,.18);
}

.building .roof{
    position:absolute;
    left:0;
    top:0;
    width:72px;
    height:19px;
    transform:skewY(-4deg);
    border-radius:4px 4px 2px 2px;
    box-shadow:0 -3px 0 rgba(255,255,255,.12) inset;
}

.building .windows{
    position:absolute;
    left:10px;
    top:25px;
    width:48px;
    height:28px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:5px;
}

.building .window{
    background:rgba(155,225,255,.62);
    border:1px solid rgba(255,255,255,.16);
    border-radius:2px;
    box-shadow:0 0 7px rgba(100,200,255,.25);
}

.building .sign{
    position:absolute;
    bottom:5px;
    left:8px;
    font-size:8px;
    color:white;
    text-shadow:0 1px 3px black;
}

.building:hover{
    filter:brightness(1.15);
    z-index:100;
}

.building.selected{
    outline:2px solid var(--green);
    outline-offset:5px;
}

/* different buildings */

.house .body{
    background:linear-gradient(135deg,#d99063,#9d563f);
}

.house .roof{
    background:#6b302b;
    transform:skewY(-4deg) rotate(-4deg);
}

.apartment .body{
    height:105px;
    background:linear-gradient(135deg,#899eaa,#526873);
}

.apartment .roof{
    background:#37484f;
}

.office .body{
    height:115px;
    background:linear-gradient(135deg,#4e7183,#263e4b);
}

.office .roof{
    background:#1d3039;
}

.shop .body{
    background:linear-gradient(135deg,#d8b65a,#987a31);
}

.shop .roof{
    background:#604e22;
}

.restaurant .body{
    background:linear-gradient(135deg,#bb5d5d,#703535);
}

.restaurant .roof{
    background:#4c2323;
}

.school .body{
    background:linear-gradient(135deg,#e1bd72,#9a7638);
}

.school .roof{
    background:#5e4325;
}

.university .body{
    height:95px;
    background:linear-gradient(135deg,#a58cbd,#5b4870);
}

.university .roof{
    background:#3e3150;
}

.police .body{
    background:linear-gradient(135deg,#5f8fc0,#344f70);
}

.police .roof{
    background:#293b52;
}

.fire .body{
    background:linear-gradient(135deg,#d75a4e,#7c2d28);
}

.fire .roof{
    background:#51201d;
}

.hospital .body{
    height:90px;
    background:linear-gradient(135deg,#dce6e8,#879da1);
}

.hospital .roof{
    background:#687c80;
}

.hotel .body{
    height:125px;
    background:linear-gradient(135deg,#b57d58,#68452f);
}

.hotel .roof{
    background:#4b3022;
}

.factory .body{
    background:linear-gradient(135deg,#747d82,#454b4f);
}

.factory .roof{
    background:#343a3d;
}

.mall .body{
    height:95px;
    background:linear-gradient(135deg,#8c6fb8,#503b70);
}

.mall .roof{
    background:#37294e;
}

.stadium .body{
    width:125px;
    height:65px;
    border-radius:50%;
    background:linear-gradient(135deg,#4f8d57,#285334);
}

.stadium .roof{
    width:125px;
    height:30px;
    border-radius:50%;
    background:#65a968;
}

.skyscraper .body{
    width:65px;
    height:190px;
    background:linear-gradient(90deg,#1b4759,#72bdd0,#214454);
}

.skyscraper .roof{
    width:65px;
    height:12px;
    background:#152e39;
}

.airport .body{
    width:145px;
    height:45px;
    border-radius:30px;
    background:linear-gradient(135deg,#d5dce0,#78868b);
}

.airport .roof{
    width:145px;
    height:18px;
    border-radius:30px;
    background:#667277;
}

/* TREES */

.tree{
    position:absolute;
    width:34px;
    height:50px;
    z-index:10;
}

.tree .trunk{
    position:absolute;
    bottom:0;
    left:14px;
    width:6px;
    height:17px;
    background:#65432c;
}

.tree .leaf{
    position:absolute;
    width:31px;
    height:31px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 25%,#76d77e,#1d733d);
    box-shadow:0 5px 8px rgba(0,0,0,.25);
}

/* CAR */

.car{
    position:absolute;
    width:27px;
    height:15px;
    z-index:300;
    pointer-events:none;
    transform-origin:center;
}

.car .carBody{
    position:absolute;
    left:2px;
    top:4px;
    width:23px;
    height:9px;
    border-radius:5px 6px 3px 3px;
    background:#e85b5b;
    box-shadow:0 1px 3px rgba(0,0,0,.5);
}

.car .roof{
    position:absolute;
    left:7px;
    top:1px;
    width:12px;
    height:7px;
    border-radius:6px 6px 0 0;
    background:#b9e6ee;
}

.car .wheel{
    position:absolute;
    width:6px;
    height:6px;
    border-radius:50%;
    background:#111;
    bottom:0;
}

.car .w1{left:4px}
.car .w2{right:3px}

.car .front{
    position:absolute;
    right:0;
    top:6px;
    width:4px;
    height:4px;
    border-radius:50%;
    background:#fff0a0;
}

/* TOOLTIP */

.cursorInfo{
    position:fixed;
    z-index:1200;
    left:50%;
    top:95px;
    transform:translateX(-50%);
    padding:8px 14px;
    border-radius:12px;
    background:rgba(0,0,0,.58);
    backdrop-filter:blur(10px);
    color:#dce9e3;
    font-size:11px;
    pointer-events:none;
    opacity:0;
    transition:.2s;
}

.cursorInfo.show{
    opacity:1;
}

/* ZOOM */

.zoomControls{
    position:fixed;
    right:18px;
    top:110px;
    z-index:900;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.zoomBtn{
    width:43px;
    height:43px;
    border-radius:13px;
    border:1px solid var(--border);
    background:rgba(7,17,13,.82);
    color:white;
    cursor:pointer;
    font-size:20px;
    backdrop-filter:blur(15px);
}

.zoomValue{
    text-align:center;
    font-size:9px;
    color:var(--muted);
}

/* MODAL */

.modal{
    position:fixed;
    z-index:3000;
    inset:0;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(7px);
    display:none;
    align-items:center;
    justify-content:center;
}

.modal.open{
    display:flex;
}

.modalBox{
    width:min(450px,calc(100% - 30px));
    border-radius:24px;
    background:#0c1914;
    border:1px solid var(--border);
    box-shadow:0 30px 100px rgba(0,0,0,.6);
    padding:23px;
}

.modalHead{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.modalHead h2{
    font-size:20px;
}

.close{
    border:0;
    background:rgba(255,255,255,.07);
    color:white;
    width:34px;
    height:34px;
    border-radius:10px;
    cursor:pointer;
}

.modalInfo{
    color:#a7bbb2;
    font-size:12px;
    line-height:1.7;
}

.modalActions{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.action{
    flex:1;
    border:0;
    padding:11px;
    border-radius:12px;
    cursor:pointer;
    background:rgba(255,255,255,.07);
    color:white;
}

.action.green{
    background:var(--green);
    color:#062314;
    font-weight:700;
}

/* SIDE INFO */

.infoPanel{
    position:fixed;
    right:18px;
    bottom:170px;
    width:270px;
    z-index:800;
    background:rgba(7,17,13,.82);
    border:1px solid var(--border);
    backdrop-filter:blur(20px);
    border-radius:20px;
    padding:15px;
    display:none;
}

.infoPanel.show{
    display:block;
}

.infoPanel h3{
    font-size:14px;
    margin-bottom:9px;
}

.infoRow{
    display:flex;
    justify-content:space-between;
    color:#9db1a7;
    font-size:11px;
    padding:7px 0;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.infoRow strong{
    color:white;
}

/* FLOAT MESSAGE */

.toast{
    position:fixed;
    z-index:4000;
    left:50%;
    bottom:155px;
    transform:translate(-50%,20px);
    background:rgba(7,17,13,.94);
    border:1px solid rgba(255,255,255,.1);
    padding:11px 17px;
    border-radius:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    font-size:12px;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* 3D MODE */

.viewport.mode3d .world{
    transform-style:preserve-3d;
}

.viewport.mode3d .terrain{
    box-shadow:
        inset 0 0 150px rgba(0,0,0,.22);
}

.viewport.mode3d .building{
    filter:drop-shadow(7px 13px 7px rgba(0,0,0,.24));
}

.mode3dLabel{
    position:fixed;
    right:75px;
    top:111px;
    z-index:901;
    padding:9px 12px;
    border-radius:12px;
    background:rgba(7,17,13,.8);
    border:1px solid var(--border);
    color:var(--muted);
    font-size:10px;
}

/* MOBILE */

@media(max-width:900px){
    .sidebar{
        width:185px;
    }

    .buildPanel{
        left:210px;
    }

    .stat{
        min-width:95px;
    }

    .logo{
        min-width:130px;
    }
}

@media(max-width:700px){
    .topbar{
        left:8px;
        right:8px;
        top:8px;
        height:62px;
    }

    .logo{
        min-width:120px;
    }

    .logo h1{
        font-size:15px;
    }

    .stats .stat:nth-child(n+3){
        display:none;
    }

    .sidebar{
        left:8px;
        top:80px;
        bottom:auto;
        height:auto;
        width:calc(100% - 16px);
        display:flex;
        overflow-x:auto;
        padding:7px;
    }

    .menuTitle{
        display:none;
    }

    .menuBtn{
        min-width:110px;
        margin:0;
    }

    .buildPanel{
        left:8px;
        right:8px;
        bottom:8px;
    }

    .infoPanel{
        right:8px;
        bottom:180px;
    }
}
</style>
</head>

<body>

<!-- TOP -->

<div class="topbar">
    <div class="logo">
        <h1>🏙️ Millionaire City</h1>
        <span>Urban Empire • 3D Edition</span>
    </div>

    <div class="stats">
        <div class="stat">
            <small>GOTÓWKA</small>
            <strong class="money" id="money">$100,000</strong>
        </div>

        <div class="stat">
            <small>DOCHÓD / MIN</small>
            <strong class="income" id="income">$0</strong>
        </div>

        <div class="stat">
            <small>POPULACJA</small>
            <strong id="population">0</strong>
        </div>

        <div class="stat">
            <small>BUDYNKI</small>
            <strong id="buildingCount">0</strong>
        </div>

        <div class="stat">
            <small>POZIOM</small>
            <strong id="level">1</strong>
        </div>
    </div>

    <div class="top-actions">
        <button class="iconBtn" onclick="saveGame()" title="Zapisz">💾</button>
        <button class="iconBtn" onclick="resetGame()" title="Reset">↻</button>
    </div>
</div>

<!-- MAP -->

<div class="viewport" id="viewport">

    <div class="world" id="world">

        <div class="terrain"></div>

        <div class="water water1"></div>
        <div class="water water2"></div>

        <div id="plots"></div>
        <div id="roadLayer" class="roadLayer"></div>
        <div id="trees"></div>
        <div id="buildings"></div>
        <div id="cars"></div>

    </div>

</div>

<!-- SIDEBAR -->

<div class="sidebar">

    <div class="menuTitle">Miasto</div>

    <button class="menuBtn active" onclick="selectMenu(this,'city')">
        <b>🏙️</b> Miasto
    </button>

    <button class="menuBtn" onclick="selectMenu(this,'economy')">
        <b>💰</b> Ekonomia
    </button>

/* =========================================================

/* =========================================================
   MODE
========================================================= */

function setMode(newMode){

    mode=newMode;

    document.querySelectorAll(".tool")
        .forEach(x=>x.classList.remove("active"));

    if(newMode==="select"){
        document.getElementById("selectTool").classList.add("active");
        selectedBuild=null;
        hideCursorInfo();
    }

    if(newMode==="road"){
        document.getElementById("roadTool").classList.add("active");
        showCursorInfo("Przeciągnij, aby budować ulicę • $100 / pole");
    }

    if(newMode==="bulldoze"){
        document.getElementById("bulldozeTool").classList.add("active");
        showCursorInfo("Kliknij budynek lub ulicę, aby usunąć");
    }

    if(newMode==="building"){
        showCursorInfo(
            buildingTypes[selectedBuild]
            ? `Kliknij na mapę, aby postawić ${buildingTypes[selectedBuild].name}`
            : "Wybierz budynek"
        );
    }
}

/* =========================================================
   POINTER
========================================================= */

function pointerDown(e){

    if(e.button!==0 && e.pointerType==="mouse") return;

    const pos=screenToWorld(e.clientX,e.clientY);

    drag=true;
    dragMoved=false;
    lastMouse={x:e.clientX,y:e.clientY};

    viewport.setPointerCapture?.(e.pointerId);

    if(mode==="road"){
        placeRoadAt(pos);
        lastRoadCell=getCell(pos);
        return;
    }

    if(mode==="building"){
        placeBuildingAt(pos);
        return;
    }

    if(mode==="bulldoze"){
        removeAt(pos);
        return;
    }
}

function pointerMove(e){

    if(!drag) return;

    const dx=e.clientX-lastMouse.x;
    const dy=e.clientY-lastMouse.y;

    if(Math.abs(dx)+Math.abs(dy)>3){
        dragMoved=true;
    }

    if(mode==="select" && dragMoved){

        camera.x-=dx/camera.zoom;
        camera.y-=dy/camera.zoom;

        clampCamera();

        renderCamera();
    }

    if(mode==="road"){

        const pos=screenToWorld(e.clientX,e.clientY);
        const cell=getCell(pos);

        if(
            lastRoadCell &&
            (cell.x!==lastRoadCell.x || cell.y!==lastRoadCell.y)
        ){
            drawRoadLine(lastRoadCell,cell);
            lastRoadCell=cell;
        }
    }

    lastMouse={x:e.clientX,y:e.clientY};
}

function pointerUp(){

    drag=false;
    lastRoadCell=null;
    viewport.classList.remove("grabbing");
}

/* =========================================================
   SCREEN / WORLD
========================================================= */

function screenToWorld(clientX,clientY){

    const rect=viewport.getBoundingClientRect();

    return {
        x:camera.x+(clientX-rect.left)/camera.zoom,
        y:camera.y+(clientY-rect.top)/camera.zoom
    };
}

function getCell(pos){

    return {
        x:Math.floor(pos.x/GRID),
        y:Math.floor(pos.y/GRID)
    };
}

/* =========================================================
   CAMERA
========================================================= */

function renderCamera(){

    world.style.transform=
        `translate3d(${-camera.x*camera.zoom}px,${-camera.y*camera.zoom}px,0) scale(${camera.zoom})`;

    document.getElementById("zoomValue").textContent=
        Math.round(camera.zoom*100)+"%";
}

function clampCamera(){

    const viewW=viewport.clientWidth/camera.zoom;
    const viewH=viewport.clientHeight/camera.zoom;

    camera.x=Math.max(0,Math.min(WORLD_W-viewW,camera.x));
    camera.y=Math.max(0,Math.min(WORLD_H-viewH,camera.y));
}

function centerCamera(){

    camera.x=(WORLD_W-(viewport.clientWidth/camera.zoom))/2;
    camera.y=(WORLD_H-(viewport.clientHeight/camera.zoom))/2;

    clampCamera();
    renderCamera();
}

function zoomMap(mult){

    const centerX=viewport.clientWidth/2;
    const centerY=viewport.clientHeight/2;

    const before=screenToWorld(
        centerX,
        centerY
    );

    camera.zoom=Math.max(
        .45,
        Math.min(2.2,camera.zoom*mult)
    );

    camera.x=before.x-centerX/camera.zoom;
    camera.y=before.y-centerY/camera.zoom;

    clampCamera();
    renderCamera();
}

function wheelZoom(e){

    e.preventDefault();

    const rect=viewport.getBoundingClientRect();

    const mouseX=e.clientX-rect.left;
    const mouseY=e.clientY-rect.top;

    const beforeX=camera.x+mouseX/camera.zoom;
    const beforeY=camera.y+mouseY/camera.zoom;

    const mult=e.deltaY<0?1.12:.89;

    camera.zoom=Math.max(
        .45,
        Math.min(2.2,camera.zoom*mult)
    );

    camera.x=beforeX-mouseX/camera.zoom;
    camera.y=beforeY-mouseY/camera.zoom;

    clampCamera();
    renderCamera();
}

/* =========================================================
   ROADS
========================================================= */

function roadKey(x,y){
    return x+"_"+y;
}

function hasRoad(x,y){
    return game.roads.some(r=>r.x===x && r.y===y);
}

function addRoad(x,y){

    if(x<0 || y<0) return false;

    const maxX=Math.floor(WORLD_W/GRID);
    const maxY=Math.floor(WORLD_H/GRID);

    if(x>=maxX || y>=maxY) return false;

    if(hasRoad(x,y)) return false;

    if(game.money<100){
        showToast("Brak pieniędzy na budowę drogi!");
        return false;
    }

    game.money-=100;

    game.roads.push({x,y});

    addXP(2);

    return true;
}

function placeRoadAt(pos){

    const cell=getCell(pos);

    addRoad(cell.x,cell.y);

    renderRoads();
    updateUI();
    saveGame();
}

function drawRoadLine(a,b){

    const dx=Math.abs(b.x-a.x);
    const dy=Math.abs(b.y-a.y);

    const steps=Math.max(dx,dy);

    for(let i=0;i<=steps;i++){

        const t=steps===0?0:i/steps;

        const x=Math.round(
            a.x+(b.x-a.x)*t
        );

        const y=Math.round(
            a.y+(b.y-a.y)*t
        );

        addRoad(x,y);
    }

    renderRoads();
    updateUI();
}

function renderRoads(){

    const layer=document.getElementById("roadLayer");

    layer.innerHTML="";

    game.roads.forEach(r=>{

        const el=document.createElement("div");

        el.className="road";

        const left=r.x*GRID;
        const top=r.y*GRID;

        el.style.left=left+"px";
        el.style.top=top+"px";

        const horizontal=
            hasRoad(r.x-1,r.y) ||
            hasRoad(r.x+1,r.y);

        const vertical=
            hasRoad(r.x,r.y-1) ||
            hasRoad(r.x,r.y+1);

        if(vertical && !horizontal){
            el.classList.add("vertical");
        }

        if(vertical && horizontal){
            el.classList.add("intersection");
        }

        layer.appendChild(el);
    });
}

/* =========================================================
   BUILDINGS
========================================================= */

function canPlaceBuilding(x,y,type){

    const b=buildingTypes[type];

    if(!b) return false;

    const w=90;
    const h=100;

    if(x<0 || y<0 || x+w>WORLD_W || y+h>WORLD_H){
        return false;
    }

    /* water */

    if(
        x<600 && y<500
    ){
        return false;
    }

    if(
        x>3100 && y>2100
    ){
        return false;
    }

    /* road collision */

    for(const r of game.roads){

        const rx=r.x*GRID;
        const ry=r.y*GRID;

        if(
            x<rx+GRID &&
            x+w>rx &&
            y<ry+GRID &&
            y+h>ry
        ){
            return false;
        }
    }

    /* building collision */

    for(const existing of game.buildings){

        if(
            x<existing.x+90 &&
            x+w>existing.x &&
            y<existing.y+100 &&
            y+h>existing.y
        ){
            return false;
        }
    }

    return true;
}

function nearRoad(x,y){

    const cx=Math.floor(x/GRID);
    const cy=Math.floor(y/GRID);

    for(let dx=-2;dx<=2;dx++){
        for(let dy=-2;dy<=2;dy++){

            if(hasRoad(cx+dx,cy+dy)){
                return true;
            }
        }
    }

    return false;
}

function placeBuildingAt(pos){

    if(!selectedBuild) return;

    const type=selectedBuild;
    const b=buildingTypes[type];

    const x=Math.floor(pos.x/GRID)*GRID+5;
    const y=Math.floor(pos.y/GRID)*GRID+5;

    if(game.money<b.cost){
        showToast("Brak pieniędzy!");
        return;
    }

    if(!nearRoad(x,y)){
        showToast("Najpierw zbuduj ulicę w pobliżu!");
        return;
    }

    if(!canPlaceBuilding(x,y,type)){
        showToast("Nie można budować w tym miejscu.");
        return;
    }

    game.money-=b.cost;

    const building={
        id:Date.now()+Math.random(),
        type:type,
        x:x,
        y:y,
        level:1
    };

    game.buildings.push(building);

    addXP(b.xp);

    game.selected=building.id;

    renderBuildings();
    updateUI();
    saveGame();

    showToast(`${b.emoji} Zbudowano: ${b.name}`);

    /* stay in building mode */
}

function renderBuildings(){

    const container=document.getElementById("buildings");

    container.innerHTML="";

    game.buildings.forEach(b=>{

        const data=buildingTypes[b.type];

        if(!data) return;

        const el=document.createElement("div");

        el.className=
            "building "+b.type+
            (game.selected===b.id?" selected":"");

        el.style.left=b.x+"px";
        el.style.top=b.y+"px";

        el.innerHTML=`

            <div class="shadow"></div>

            <div class="roof"></div>

            <div class="body">

                <div class="windows">

                    <div class="window"></div>
                    <div class="window"></div>
                    <div class="window"></div>
                    <div class="window"></div>
                    <div class="window"></div>
                    <div class="window"></div>

                </div>

                <div class="sign">
                    ${data.name} • Lv.${b.level}
                </div>

            </div>
        `;

        el.addEventListener("pointerdown",e=>{

            e.stopPropagation();

            if(mode==="bulldoze"){
                removeBuilding(b.id);
                return;
            }

            selectBuilding(b.id);
        });

        container.appendChild(el);
    });
}

/* =========================================================
   SELECT
========================================================= */

function selectBuilding(id){

    game.selected=id;

    const b=game.buildings.find(x=>x.id===id);

    if(!b) return;

    const data=buildingTypes[b.type];

    document.getElementById("infoPanel")
        .classList.add("show");

    document.getElementById("infoTitle").textContent=
        `${data.emoji} ${data.name}`;

    document.getElementById("infoLevel").textContent=
        b.level;

    document.getElementById("infoCost").textContent=
        "$"+formatNumber(data.cost*b.level);

    document.getElementById("infoIncome").textContent=
        "$"+formatNumber(data.income*b.level);

    document.getElementById("infoPopulation").textContent=
        formatNumber(data.population*b.level);

    renderBuildings();
}

function upgradeSelected(){

    if(!game.selected) return;

    const b=game.buildings.find(x=>x.id===game.selected);

    if(!b) return;

    const data=buildingTypes[b.type];

    const cost=Math.floor(
        data.cost*(1.2**b.level)
    );

    if(game.money<cost){
        showToast("Brak pieniędzy!");
        return;
    }

    game.money-=cost;
    b.level++;

    addXP(data.xp);

    renderBuildings();
    updateUI();
    selectBuilding(b.id);
    saveGame();

    showToast(`⬆️ ${data.name} ulepszony do poziomu ${b.level}`);
}

function sellSelected(){

    if(!game.selected) return;

    removeBuilding(game.selected);
}

function removeBuilding(id){

    const index=game.buildings.findIndex(
        b=>b.id===id
    );

    if(index===-1) return;

    const b=game.buildings[index];
    const data=buildingTypes[b.type];

    const value=Math.floor(
        data.cost*b.level*.55
    );

    game.money+=value;

    game.buildings.splice(index,1);

    game.selected=null;

    document.getElementById("infoPanel")
        .classList.remove("show");

    renderBuildings();
    updateUI();
    saveGame();

    showToast(`💵 Sprzedano za $${formatNumber(value)}`);
}

/* =========================================================
   REMOVE ANYTHING
========================================================= */

function removeAt(pos){

    const x=pos.x;
    const y=pos.y;

    const building=game.buildings.find(b=>
        x>=b.x &&
        x<=b.x+90 &&
        y>=b.y &&
        y<=b.y+110
    );

    if(building){
        removeBuilding(building.id);
        return;
    }

    const cell=getCell(pos);

    const roadIndex=game.roads.findIndex(
        r=>r.x===cell.x && r.y===cell.y
    );

    if(roadIndex!==-1){

        game.roads.splice(roadIndex,1);

        renderRoads();
        saveGame();

        showToast("🧹 Usunięto ulicę");
    }
}

/* =========================================================
   ECONOMY
========================================================= */

function calculateIncome(){

    return game.buildings.reduce((sum,b)=>{

        const data=buildingTypes[b.type];

        return sum+
            data.income*b.level;

    },0);
}

function calculatePopulation(){

    return game.buildings.reduce((sum,b)=>{

        const data=buildingTypes[b.type];

        return sum+
            data.population*b.level;

    },0);
}

function gameTick(){

    const income=calculateIncome();

    game.money+=income;
    game.totalEarned+=income;

    game.population=calculatePopulation();

    updateUI();

    updateCars();
}

/* =========================================================
   XP
========================================================= */

function addXP(amount){

    game.xp+=amount;

    const required=
        100+(game.level-1)*150;

    if(game.xp>=required){

        game.xp-=required;
        game.level++;

        showToast(`🎉 Nowy poziom miasta: ${game.level}`);
    }
}

/* =========================================================
   CARS
========================================================= */

let cars=[];

function renderCars(){

    const container=document.getElementById("cars");

    container.innerHTML="";
    cars=[];

    for(let i=0;i<8;i++){

        if(game.roads.length===0) break;

        const road=
            game.roads[
                Math.floor(
                    Math.random()*game.roads.length
                )
            ];

        const car={
            id:i,
            cellX:road.x,
            cellY:road.y,
            x:road.x*GRID+12,
            y:road.y*GRID+18,
            dir:{x:1,y:0},
            speed:0.65+Math.random()*.4,
            progress:Math.random(),
            element:null
        };

        const el=document.createElement("div");

        el.className="car";

        el.innerHTML=`
            <div class="carBody"></div>
            <div class="roof"></div>
            <div class="wheel w1"></div>
            <div class="wheel w2"></div>
            <div class="front"></div>
        `;

        container.appendChild(el);

        car.element=el;

        cars.push(car);

        renderCar(car);
    }
}

function getRoadNeighbors(x,y){

    const directions=[
        {x:1,y:0},
        {x:-1,y:0},
        {x:0,y:1},
        {x:0,y:-1}
    ];

    return directions.filter(d=>
        hasRoad(x+d.x,y+d.y)
    );
}

function chooseCarDirection(car){

    let options=getRoadNeighbors(
        car.cellX,
        car.cellY
    );

    if(options.length===0) return;

    /* avoid immediate U-turn if possible */

    const filtered=options.filter(d=>
        !(d.x===-car.dir.x && d.y===-car.dir.y)
    );

    if(filtered.length>0){
        options=filtered;
    }

    const direction=
        options[
            Math.floor(Math.random()*options.length)
        ];

    car.dir=direction;
}

function updateCars(){

    if(game.roads.length===0){

        document.getElementById("cars").innerHTML="";
        cars=[];

        return;
    }

    if(cars.length===0){
        renderCars();
    }

    cars.forEach(car=>{

        car.progress+=car.speed/50;

        if(car.progress>=1){

            car.progress=0;

            car.cellX+=car.dir.x;
            car.cellY+=car.dir.y;

            if(!hasRoad(car.cellX,car.cellY)){

                car.cellX-=car.dir.x;
                car.cellY-=car.dir.y;

                chooseCarDirection(car);

            }else{

                chooseCarDirection(car);
            }
        }

        const targetX=
            car.cellX*GRID+12+
            car.dir.x*car.progress*GRID;

        const targetY=
            car.cellY*GRID+18+
            car.dir.y*car.progress*GRID;

        car.x=targetX;
        car.y=targetY;

        renderCar(car);
    });
}

function renderCar(car){

    if(!car.element) return;

    car.element.style.left=car.x+"px";
    car.element.style.top=car.y+"px";

    let angle=0;

    if(car.dir.x===1) angle=0;
    if(car.dir.x===-1) angle=180;
    if(car.dir.y===1) angle=90;
    if(car.dir.y===-1) angle=-90;

    /*
        Samochód bazowo jedzie w prawo.
        Obracamy go zgodnie z kierunkiem ruchu,
        więc nie jedzie już "tyłem".
    */

    car.element.style.transform=
        `rotate(${angle}deg)`;
}

function updateUI(){

    document.getElementById("money").textContent=
        "$"+formatNumber(Math.floor(game.money));

    document.getElementById("income").textContent=

function formatNumber(n){

    return Math.floor(n).toLocaleString("en-US");
}

/* =========================================================
   MENU
========================================================= */

function selectMenu(button,type){

    document.querySelectorAll(".menuBtn")
        .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    if(type==="economy"){

        showToast(
            `💰 Dochód miasta: $${formatNumber(calculateIncome())} / min`
        );
    }

    if(type==="services"){

        const schools=game.buildings.filter(
            b=>b.type==="school" ||
            b.type==="university" ||
            b.type==="hospital" ||
            b.type==="police" ||
            b.type==="fire"
        ).length;

        showToast(
            `🏫 Miasto posiada ${schools} budynków usługowych`
        );
    }

    if(type==="quests"){

        const target=10;
        const count=game.buildings.length;

        showToast(
            `🎯 Zadanie: zbuduj ${target} budynków (${count}/${target})`
        );
    }
}

/* =========================================================
   3D
========================================================= */

function toggle3D(button){

    viewport.classList.toggle("mode3d");

    button.classList.toggle("active");

    if(viewport.classList.contains("mode3d")){
        showToast("🧊 Tryb 3D miasta włączony");
    }else{
        showToast("2D");
    }

/* =========================================================
   TOAST
========================================================= */

let toastTimer;

function showToast(text){

    const toast=document.getElementById("toast");

    toast.textContent=text;
    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{
        toast.classList.remove("show");
    },2200);
}

function showCursorInfo(text){

    const el=document.getElementById("cursorInfo");

    el.textContent=text;
    el.classList.add("show");
}

function hideCursorInfo(){

    document.getElementById("cursorInfo")
        .classList.remove("show");
}

/* =========================================================
   SAVE / LOAD
========================================================= */

function saveGame(){

    try{

        localStorage.setItem(
            "millionaire_city_3d_save",
            JSON.stringify(game)
        );

    }catch(e){
        console.warn("Save error",e);
    }
}

function loadGame(){

    try{

        const saved=localStorage.getItem(
            "millionaire_city_3d_save"
        );

        if(saved){

            const data=JSON.parse(saved);

            game={
                ...game,
                ...data
            };
        }

    }catch(e){

        console.warn("Load error",e);
    }
}

function resetGame(){

    if(!confirm(
        "Na pewno usunąć całe miasto i rozpocząć od nowa?"
    )){
        return;
    }

    localStorage.removeItem(
        "millionaire_city_3d_save"
    );

    location.reload();
}

/* =========================================================
   INITIAL STARTER ROADS
========================================================= */

function createStarterRoads(){

    if(game.roads.length>0) return;

    /*
        Główna ulica startowa.
    */

    for(let x=12;x<60;x++){
        game.roads.push({
            x:x,
            y:18
        });
    }

    for(let y=12;y<45;y++){
        game.roads.push({
            x:30,
            y:y
        });
    }

    renderRoads();
}

/* =========================================================
   START
========================================================= */

init();

createStarterRoads();

renderRoads();
renderCars();
updateUI();
saveGame();

</script>
