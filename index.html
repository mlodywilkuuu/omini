<!doctype html>

<title>Ropucha Group Tycoon</title>

<style>
:root{
 --bg:#0a0f0c;--panel:#111813;--panel2:#18221b;--card:#1b261f;
 --line:#2c3b31;--green:#43df73;--green2:#218d4b;
 --text:#f3f7f4;--muted:#91a096;--red:#ff626c;--orange:#ffad4d;
 --blue:#55a7ff;--purple:#b07cff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}

#map{
 position:fixed;left:220px;top:0;right:0;bottom:0;z-index:1;
}

/* SIDEBAR */

#sidebar{
 position:fixed;left:0;top:0;bottom:0;width:220px;z-index:5000;
 background:#0c120e;border-right:1px solid var(--line);
 overflow:auto;padding:10px;
}

.logo{
 font-size:18px;font-weight:900;color:#6aee90;padding:12px 8px 16px;
}
.logo small{
 display:block;color:#607066;font-size:9px;letter-spacing:2px;margin-top:3px;
}

.navLabel{
 font-size:9px;color:#5b6b60;font-weight:800;letter-spacing:1.3px;
 margin:15px 9px 5px;
}

.nav{
 display:flex;align-items:center;gap:9px;width:100%;
 border:0;border-radius:7px;background:transparent;color:#9bac9f;
 padding:9px;text-align:left;margin:2px 0;
}

.nav:hover{background:#18221b;color:white}
.nav.active{background:#153d24;color:#7af09a}
.nav span{width:21px;text-align:center}

/* TOP HUD */

#top{
 position:fixed;left:235px;top:12px;right:15px;z-index:4000;
 display:flex;justify-content:space-between;pointer-events:none;
}

.huds{display:flex;gap:6px;flex-wrap:wrap}

.hud{
 background:#0d120feb;border:1px solid var(--line);
 padding:7px 11px;border-radius:8px;min-width:90px;
 box-shadow:0 4px 15px #0005;
}

.hud small{
 display:block;font-size:8px;color:#77867d;font-weight:800;
}

.hud strong{font-size:13px}

.time{
 pointer-events:auto;background:#0d120feb;border:1px solid var(--line);
 border-radius:8px;padding:5px;
}

.time button{
 border:0;background:#202a23;color:#aaa;border-radius:5px;padding:6px 9px;
}

.time button.active{background:var(--green2);color:white}

/* PANEL */

#panel{
 position:fixed;z-index:4500;left:220px;top:0;bottom:0;width:530px;
 background:#101612f8;border-right:1px solid var(--line);
 overflow:auto;padding:18px;box-shadow:15px 0 35px #0007;
}

#panel.hidden{display:none}

.title{font-size:22px;font-weight:900;margin-bottom:4px}
.subtitle{font-size:11px;color:var(--muted);margin-bottom:16px}

.tabs{
 display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;
}

.tab{
 border:1px solid var(--line);background:#18201b;color:#9dac9f;
 border-radius:6px;padding:7px 10px;
}

.tab.active{
 background:#205832;color:white;border-color:#347a49;
}

.card{
 background:var(--card);border:1px solid var(--line);
 border-radius:10px;padding:12px;margin-bottom:8px;
}

.card:hover{border-color:#3d5143}

.kpis{
 display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;
}

.kpi{
 background:#18211b;border:1px solid var(--line);
 border-radius:9px;padding:12px;
}

.kpi small{
 display:block;color:#7c8e82;font-size:9px;font-weight:800;
}

.kpi strong{font-size:18px}

.row{
 display:flex;justify-content:space-between;gap:10px;
 margin:6px 0;font-size:12px;color:#9cac9f;
}

.row b{color:white;text-align:right}

.green{color:#64e889!important}
.red{color:var(--red)!important}
.orange{color:var(--orange)!important}
.blueText{color:var(--blue)!important}

.muted{
 font-size:11px;color:var(--muted);line-height:1.45;
}

.btn{
 width:100%;border:0;border-radius:6px;padding:8px;
 background:#237944;color:white;font-weight:800;margin-top:5px;
}

.btn:hover{filter:brightness(1.12)}
.btn.blue{background:#28649f}
.btn.redBtn{background:#8e3940}
.btn.orangeBtn{background:#a76428}
.btn.gray{background:#3a463e}
.btn.purple{background:#654a8f}

.grid2{
 display:grid;grid-template-columns:1fr 1fr;gap:5px;
}

.grid3{
 display:grid;grid-template-columns:repeat(3,1fr);gap:5px;
}

input,select{
 background:#101612;border:1px solid #35443a;color:white;
 border-radius:6px;padding:8px;
}

.full{width:100%}

.badge{
 display:inline-block;padding:3px 7px;border-radius:12px;
 background:#344139;font-size:9px;margin:2px;
}

.badge.ok{background:#18552c;color:#83f3a1}
.badge.warn{background:#65491c;color:#ffd08b}
.badge.bad{background:#61282c;color:#ff9da4}
.badge.blue{background:#204c71;color:#9ed0ff}
.badge.purple{background:#4f396c;color:#d4b7ff}

.sectionTitle{
 font-size:12px;font-weight:900;color:#d8e3da;margin:16px 0 7px;
}

.empty{
 padding:25px;text-align:center;color:#718078;
 border:1px dashed #354239;border-radius:9px;
}

.table{
 width:100%;border-collapse:collapse;font-size:11px;
}

.table th{
 text-align:left;color:#73847a;padding:7px;
 border-bottom:1px solid var(--line);
}

.table td{
 padding:8px 7px;border-bottom:1px solid #273129;
}

.table tr:hover td{background:#202a23}

/* HOLDING */

.holdingRoot{
 background:linear-gradient(135deg,#183c24,#132219);
 border:1px solid #347c49;
 border-radius:12px;padding:14px;margin-bottom:10px;
}

.companyNode{
 border-left:2px solid #3d5b47;
 padding-left:12px;margin:8px 0 8px 12px;
}

.companyBox{
 background:#18221b;border:1px solid #33443a;
 border-radius:8px;padding:10px;margin-bottom:5px;
}

.companyBox.selected{
 border-color:#55d77b;
 box-shadow:0 0 0 1px #55d77b44;
}

.assetGrid{
 display:grid;grid-template-columns:repeat(2,1fr);gap:5px;
 margin-top:8px;
}

.asset{
 background:#111713;border:1px solid #2d3c32;
 border-radius:6px;padding:7px;font-size:10px;
}

/* MODAL */

#modalBg{
 display:none;position:fixed;inset:0;background:#000c;
 z-index:60000;align-items:center;justify-content:center;
}

#modal{
 background:#121914;border:1px solid #3b4a40;
 border-radius:12px;width:min(1100px,96vw);
 max-height:94vh;overflow:auto;padding:17px;
}

.close{
 float:right;border:0;border-radius:6px;
 background:#7d3238;color:white;padding:7px 11px;
}

.formLabel{
 display:block;font-size:10px;color:#829187;
 font-weight:800;margin:11px 0 4px;
}

/* STORE EDITOR */

.editorWrap{
 display:grid;grid-template-columns:200px 1fr;gap:12px;
}

.palette{
 background:#18201b;border-radius:8px;padding:8px;
 max-height:75vh;overflow:auto;
}

.palette button{
 width:100%;background:#253029;color:#ddd;
 border:1px solid #39473e;padding:7px;text-align:left;
 border-radius:5px;margin:2px 0;
}

.storeGrid{
 display:grid;gap:2px;background:#080b09;padding:4px;
 border:2px solid #48554c;width:min(690px,68vw);
 aspect-ratio:1;
}

.cell{
 border:1px solid #354139;display:flex;
 align-items:center;justify-content:center;
 cursor:pointer;user-select:none;
}

.cell.sales{background:#243126}
.cell.backroom{background:#3c3325}
.cell:hover{outline:2px solid #5ce782}

/* MAP */

.mapMarker{
 width:30px;height:30px;border-radius:9px;border:2px solid white;
 display:flex;align-items:center;justify-content:center;
 font-size:15px;box-shadow:0 4px 10px #0008;
}

.storeM{background:#18733b}
.centerM{background:#2868a3}
.factoryM{background:#9b622d}

#mapFilters{
 position:fixed;right:15px;bottom:15px;z-index:4000;
 background:#0d120fe8;border:1px solid var(--line);
 padding:7px;border-radius:8px;
}

#mapFilters label{
 font-size:10px;margin-right:8px;
}

#buildInfo{
 display:none;position:fixed;z-index:50000;
 bottom:20px;left:50%;transform:translateX(-50%);
 background:#111;border:1px solid #4a5c50;
 padding:10px 18px;border-radius:7px;
}

/* TOAST */

#notes{
 position:fixed;right:12px;bottom:60px;
 width:300px;z-index:70000;
}

.note{
 background:#121914;border:1px solid #35463b;
 border-left:4px solid #49db73;
 padding:9px;border-radius:7px;margin-top:5px;font-size:11px;
}

/* CONSOLE */

#console{
 display:none;position:fixed;z-index:90000;
 width:min(700px,94vw);height:420px;
 left:50%;top:50%;transform:translate(-50%,-50%);
 background:#060907f8;border:1px solid #42ce69;border-radius:8px;
}

#consoleHistory{
 height:360px;overflow:auto;padding:10px;
 white-space:pre-wrap;font-family:monospace;font-size:12px;
}

#consoleInput{
 width:100%;height:58px;border:0;
 border-top:1px solid #294b33;
 background:#0b100d;color:white;font-family:monospace;
}

.progress{
 height:7px;background:#303b33;border-radius:10px;overflow:hidden;
}

.progress div{
 height:100%;background:#49db73;
}

@media(max-width:900px){
 #sidebar{width:70px}
 .logo{font-size:0}
 .logo:before{content:"🐸";font-size:25px}
 .navLabel{display:none}
 .nav{justify-content:center;font-size:0}
 .nav span{font-size:20px}
 #map{left:70px}
 #panel{left:70px;width:360px}
 #top{left:82px}
}
</style>
</head>

/* =========================================================

========================================================= */

const map=L.map("map",{
 zoomControl:true,
 scrollWheelZoom:false,
 zoomAnimation:false,
 fadeAnimation:false,
 markerZoomAnimation:false,
 minZoom:2,
 maxZoom:18
}).setView([52,19],5);

L.tileLayer(
 "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  maxZoom:18,
  attribution:"&copy; OpenStreetMap contributors"
 }
).addTo(map);

/*
 Scroll zmienia zoom względem środka.
 Dzięki temu mapa nie skacze pod kursorem.
*/

document.getElementById("map").addEventListener(
"wheel",
e=>{

 e.preventDefault();
 e.stopPropagation();

 const center=map.getCenter();

 const newZoom=clamp(
  map.getZoom()+(e.deltaY<0?1:-1),
  2,
  18
 );

 map.setView(
  center,
  newZoom,
  {animate:false}
 );

},
{passive:false,capture:true}
);

const layers={
 stores:L.layerGroup().addTo(map),
 centers:L.layerGroup().addTo(map),
 factories:L.layerGroup().addTo(map),
 routes:L.layerGroup().addTo(map)
};

function toggleLayer(type,on){

 if(on){
  layers[type].addTo(map);
 }else{
  map.removeLayer(layers[type]);
 }

}

function mapIcon(emoji,cls){

 return L.divIcon({
  className:"",
  html:`<div class="mapMarker ${cls}">${emoji}</div>`,
  iconSize:[30,30],
  iconAnchor:[15,15]
 });

}

const icons={
 store:mapIcon("🏪","storeM"),
 center:mapIcon("📦","centerM"),
 factory:mapIcon("🏭","factoryM")
};

function nearestPlace(lat,lng){

 let best=PLACES[0];
 let dist=Infinity;

 PLACES.forEach(p=>{

  const d=
   (lat-p[2])**2+
   (lng-p[3])**2;

  if(d<dist){
   dist=d;
   best=p;
  }

 });

 return best;
}

/* =========================================================
   BASIC FUNCTIONS
========================================================= */

/* =========================================================
   SUBSIDIARY HELPERS
========================================================= */

function getSub(id){

 return subsidiaries.find(
  s=>s.id===Number(id)
 );

}

function subName(id){

 if(!id)return "Ropucha Group";

 const s=getSub(id);

 return s?s.name:"Ropucha Group";

}

function getSubChildren(id){

 return subsidiaries.filter(
  s=>s.parentId===id
 );

}

function getDescendantIds(id){

 const result=[];

 function walk(parent){

  subsidiaries
   .filter(s=>s.parentId===parent)
   .forEach(s=>{

    result.push(s.id);
    walk(s.id);

   });

 }

 walk(id);

 return result;

}

function subAssets(id){

 const ownStores=
  stores.filter(s=>s.subsidiaryId===id);

 const ownCenters=
  centers.filter(c=>c.subsidiaryId===id);

 const ownFactories=[];

 companies.forEach(c=>{

  c.factories.forEach(f=>{

   if(f.subsidiaryId===id){

    ownFactories.push({
     company:c,
     factory:f
    });

   }

  });

 });

 const ownedCompanies=
  companies.filter(c=>
   c.owned&&
   c.subsidiaryId===id
  );

 return {
  stores:ownStores,
  centers:ownCenters,
  factories:ownFactories,
  companies:ownedCompanies
 };

}

function calculateSubFinances(id){

 const a=subAssets(id);

 let revenue=0;

 a.stores.forEach(s=>{
  revenue+=s.sales||0;
 });

 a.companies.forEach(c=>{
  revenue+=c.profit||0;
 });

 let costs=0;

 employees.forEach(e=>{

  if(e.status!=="employed")return;

  if(e.storeId){

   const store=
    stores.find(s=>s.id===e.storeId);

   if(store?.subsidiaryId===id){
    costs+=e.salary/30;
   }

  }

 });

 drivers.forEach(d=>{

  if(d.centerId){

   const center=
    centers.find(c=>c.id===d.centerId);

   if(center?.subsidiaryId===id){
    costs+=d.salary/30;
   }

  }

 });

 return {
  revenue,
  costs,
  profit:revenue-costs
 };

}

function subAssetValue(id){

 const a=subAssets(id);

 let value=0;

 a.stores.forEach(s=>{
  value+=STORE_SIZES[s.size]?.cost||0;
 });

 a.centers.forEach(c=>{
  value+=200000+(c.level-1)*150000;
 });

 a.factories.forEach(x=>{
  value+=x.company.valuation/
   Math.max(1,x.company.factories.length);
 });

 a.companies.forEach(c=>{
  value+=c.valuation;
 });

 return value;

}

  id:ids.sub++,

  country,
  type,
  parentId,

  cash:capital,
  created:{

   month,

function renameSubsidiary(id){

 const s=getSub(id);

 if(!s)return;

 const name=
  prompt(
   "Nowa nazwa spółki:",
   s.name
  );

 if(!name)return;

 const clean=name.trim();

 if(clean.length<2)return;

 if(
  subsidiaries.some(
   x=>
    x.id!==id&&
    x.name.toLowerCase()===
    clean.toLowerCase()
  )
 ){

  return notify(
   "Taka nazwa jest już używana."
  );

 }

 const old=s.name;

 s.name=clean;

 addNews(
  `🏛️ ${old} zmienia nazwę na ${clean}.`
 );

 openSubsidiary(id);

 render();

}

function moveSubsidiary(id,parentValue){

 const s=getSub(id);

 if(!s)return;

 const parentId=
  parentValue
   ?Number(parentValue)
   :null;

 if(parentId===id){

  notify(
   "Spółka nie może posiadać samej siebie."
  );

  return openSubsidiary(id);

 }

 const descendants=
  getDescendantIds(id);

 if(
  parentId&&
  descendants.includes(parentId)
 ){

  notify(
   "Nie można przenieść spółki pod jej własną spółkę córkę."
  );

  return openSubsidiary(id);

 }

 s.parentId=parentId;

 addNews(
  `🏛️ ${s.name} została przeniesiona pod ${subName(parentId)}.`
 );

 openSubsidiary(id);

 render();

}

function addCapital(id){

 const s=getSub(id);

 if(!s)return;

 const amount=
  Math.max(
   0,
   Number(
    document
     .getElementById("capitalAmount")
     .value
   )||0
  );

 if(amount<=0)return;

 if(amount>money){

  return notify(
   "Za mało gotówki w Ropucha Group."
  );

 }

 changeMoney(-amount);

 s.cash+=amount;
 s.capital+=amount;

 addNews(
  `💰 Ropucha Group dokapitalizowała ${s.name}: ${cash(amount)}.`
 );

 openSubsidiary(id);

 render();

}

       ?"backroom"

function startBuildStore(){

 pendingStoreSize=
  document
   .getElementById("storeSize")
   .value;

 if(
  money<
  STORE_SIZES[pendingStoreSize].cost
 ){

  return notify(
   "Za mało pieniędzy."
  );

 }

 buildMode="store";

 closeModal();

 const b=
  document.getElementById(
   "buildInfo"
  );

 b.style.display="block";

 b.textContent=
  "🏪 Kliknij miejsce sklepu na mapie";

}

function createStore(lat,lng){

 const size=
  STORE_SIZES[pendingStoreSize];

 changeMoney(-size.cost);

 const p=
  nearestPlace(lat,lng);

 const f=
  franchisees
   .slice()
   .sort(
    (a,b)=>
     a.stores.length-
     b.stores.length
   )[0];

 const id=ids.store++;

 const s={
  id,
  name:"Ropucha #"+id,
  lat,
  lng,
  city:p[0],
  country:p[1],
  size:pendingStoreSize,
  layout:emptyLayout(size.grid),
  franchiseId:f?.id||null,
  employees:[],
  stock:{},
  sales:0,
  customers:0,
  ideas:[],
  subsidiaryId:null,
  marker:null
 };

 PRODUCTS.forEach(x=>{
  s.stock[x.id]=rnd(20,60);
 });

 stores.push(s);

 if(f){
  f.stores.push(s.id);
 }

 s.marker=
  L.marker(
   [lat,lng],
   {icon:icons.store}
  ).addTo(
   layers.stores
  );

 updateStorePopup(s);

 addNews(
  `🏪 Otwarto ${s.name} w pobliżu ${s.city}.`
 );

 render();

}

function updateStorePopup(s){

 if(!s.marker)return;

 s.marker.bindPopup(`

 <b>${esc(s.name)}</b><br>

 📍 ${esc(s.city)},
 ${esc(s.country)}<br>

 🏛️ ${esc(subName(s.subsidiaryId))}<br>

 💰 ${cash(s.sales)}<br>

 📦 ${
  Object.values(s.stock)
   .reduce((a,b)=>a+b,0)
 } szt.

 `);

 s.marker.off("click");

 s.marker.on("click",()=>{

  current="stores";

  document
   .getElementById("panel")
   .classList.remove("hidden");

  renderSection();

 });

function editorCell(x,y){

 const s=
  stores.find(
   a=>a.id===editorStore
  );

 const c=
  s.layout[y][x];

 if(editorZone){

  if(c.eq){

   return notify(
    "Usuń najpierw sprzęt."
   );

  }

  c.zone=editorZone;

  return drawEditor();

 }

 if(editorTool==="erase"){

  c.eq=null;
  c.plan=[];

  return drawEditor();

 }

 if(c.eq===editorTool){

  return openPlanogram(
   x,
   y
  );

 }

 const e=
  EQUIPMENT[editorTool];

 if(!e)return;

 if(
  e.back&&
  c.zone!=="backroom"
 ){

  return notify(
   "Ten sprzęt musi być na zapleczu."
  );

 }

 if(
  !e.back&&
  c.zone==="backroom"&&
  editorTool!=="door"
 ){

  return notify(
   "Ten sprzęt musi być na sali."
  );

 }

 if(c.eq){

  return notify(
   "Pole jest zajęte."
  );

 }

 if(money<e.cost){

  return notify(
   "Za mało pieniędzy."
  );

 }

 changeMoney(-e.cost);

 c.eq=editorTool;
 c.plan=[];

 drawEditor();

}

function togglePlan(
 x,
 y,
 p,
 on
){

 const s=
  stores.find(
   a=>a.id===editorStore

 const c=

function createRoute(){

 const centerId=
  Number(
   document
    .getElementById("routeCenter")
    .value
  );

 const driverId=
  Number(
   document
    .getElementById("routeDriver")
    .value
  );

 const truckId=
  Number(
   document
    .getElementById("routeTruck")
    .value
  );

 const storeIds=
  [
   ...document.querySelectorAll(
    ".routeStore:checked"
   )
  ].map(
   x=>Number(x.value)
  );

 const frequency=
  Number(
   document
    .getElementById("routeFrequency")
    .value
  );

 if(!storeIds.length){

  return notify(
   "Wybierz przynajmniej jeden sklep."
  );

 }

 const r={
  id:ids.route++,
  centerId,
  driverId,
  truckId,
  storeIds,
  frequency,
  active:true,
  lastDelivery:0,
  distance:0,
  line:null
 };

 const c=
  centers.find(
   x=>x.id===centerId
  );

 let prev=[
  c.lat,
  c.lng
 ];

 let distance=0;

 storeIds.forEach(id=>{

  const s=
   stores.find(
    x=>x.id===id
   );

  if(!s)return;

  distance+=
   map.distance(
    prev,
    [s.lat,s.lng]
   )/1000;

  prev=[
   s.lat,
   s.lng
  ];

 });

 r.distance=
  Math.round(distance);

 routes.push(r);

 const d=
  drivers.find(
   x=>x.id===driverId
  );

 const t=
  trucks.find(
   x=>x.id===truckId
  );

 d.routeId=r.id;
 d.centerId=centerId;

 t.routeId=r.id;
 t.centerId=centerId;
 t.driverId=driverId;

 drawRoute(r);

 closeModal();

 logisticsTab="routes";

 addNews(
  `🚛 Utworzono trasę #${r.id}.`
 );

 render();

}

function drawRoute(r){

 if(r.line){

  layers.routes.removeLayer(
   r.line
  );

 }

 const c=
  centers.find(
   x=>x.id===r.centerId
  );

 if(!c)return;

 const points=[
  [c.lat,c.lng]
 ];

 r.storeIds.forEach(id=>{

  const s=
   stores.find(
    x=>x.id===id
   );

  if(s){

   points.push([
    s.lat,
    s.lng
   ]);

  }

 });

 r.line=
  L.polyline(
   points,
   {
    weight:3,
    opacity:.65,
    dashArray:"8 6"
   }
  ).addTo(
   layers.routes
  );

 r.line.bindPopup(`

 🚛 Trasa #${r.id}<br>

 ${r.distance} km<br>

 ${r.storeIds.length}
 sklepów

 `);

}

function toggleRoute(id){

 const r=
  routes.find(
   x=>x.id===id
  );

 if(!r)return;

 r.active=!r.active;

 if(r.active){

  drawRoute(r);

 }else if(r.line){

  layers.routes.removeLayer(
   r.line
  );

  r.line=null;

 }

 render();

}

function deleteRoute(id){

 const i=
  routes.findIndex(
   x=>x.id===id
  );

 if(i<0)return;

 const r=
  routes[i];

 if(r.line){

  layers.routes.removeLayer(
   r.line
  );

 }

 const d=
  drivers.find(
   x=>x.id===r.driverId
  );

 const t=
  trucks.find(
   x=>x.id===r.truckId
  );

 if(d){

  d.routeId=null;
  d.status="free";

 }

 if(t){

  t.routeId=null;
  t.driverId=null;

 }

 routes.splice(
  i,
  1
 );

 render();

}

function processRoutes(){

 routes
  .filter(r=>r.active)
  .forEach(r=>{

   if(
    (day+r.id)%
    r.frequency!==0
   )return;

   const c=
    centers.find(
     x=>x.id===r.centerId
    );

   const t=
    trucks.find(
     x=>x.id===r.truckId
    );

   const d=
    drivers.find(
     x=>x.id===r.driverId
    );

   if(
    !c||
    !t||
    !d
   )return;

   d.status="route";

   let capacity=
    t.capacity;

   r.storeIds.forEach(
    sid=>{

     const s=
      stores.find(
       x=>x.id===sid
      );

     if(!s)return;

     PRODUCTS.forEach(
      p=>{

       if(capacity<=0)return;

       const wanted=
        Math.max(
         0,
         120-
         (s.stock[p.id]||0)
        );

       const available=
        c.stock[p.id]||0;

       const qty=
        Math.min(
         wanted,
         available,
         capacity
        );

       if(qty>0){

        c.stock[p.id]-=qty;

        s.stock[p.id]=
         (s.stock[p.id]||0)+
         qty;

        capacity-=qty;

       }

      }
     );

    }
   );

   const fuel=
    Math.round(
     r.distance*2.4
    );

   changeMoney(-fuel);

   totals.fuel+=fuel;

   t.mileage+=r.distance;

   t.condition=
    clamp(
     t.condition-
     r.distance*.001,
     0,
     100
    );

   r.lastDelivery=day;

   d.status="free";

  });

}

const IDEA_TYPES=[

["Nowa kawa","☕",45000,.06],
["Nowy hot-dog","🌭",50000,.07],
["Punkt paczek","📦",60000,.08],

function newIdea(){

  pick(IDEA_TYPES);

 ideas.push({

function developIdea(id){

 const i=
  ideas.find(
   x=>x.id===id
  );

 const cost=
  Math.round(
   i.cost*.2
  );

 if(money<cost){

  return notify(
   "Za mało pieniędzy."
  );

 }

 changeMoney(-cost);

 const testers=
  employees
   .filter(
    e=>
     e.status==="employed"&&
     e.department==="R&D"
   )
   .reduce(
    (a,e)=>a+e.skill,
    0
   );

 i.progress=
  clamp(
   i.progress+
   rnd(15,30)+
   Math.floor(
    testers*.2
   ),
   0,
   100
  );

 if(i.progress>=100){

  i.status="ready";

 }

 render();

}

function deployIdea(id){

 const i=
  ideas.find(
   x=>x.id===id
  );

 const cost=
  stores.length*5000;

 if(money<cost){

  return notify(
   "Za mało pieniędzy."
  );

 }

 changeMoney(-cost);

 stores.forEach(s=>{

  if(
   !s.ideas.includes(id)
  ){

   s.ideas.push(id);

  }

 });

 i.status="deployed";

 render();

}

/* =========================================================
   ECONOMY
========================================================= */

function processStores(){

 let groupIncome=0;

 stores.forEach(s=>{

  let customers=
   20+rnd(5,40);

  const staff=
   employees.filter(
    e=>
     e.status==="employed"&&
     e.storeId===s.id
   );

  customers+=
   Math.floor(
    staff.reduce(
     (a,e)=>a+e.skill,
     0
    )*.5
   );

  s.sales=0;
  s.customers=0;

  for(
   let i=0;
   i<customers;
   i++
  ){

   const available=
    PRODUCTS.filter(
     p=>
      (s.stock[p.id]||0)>0
    );

   if(!available.length)break;

   const p=
    pick(available);

   const price=
    productPrice(p.id);

   if(Math.random()<.75){

    s.stock[p.id]--;

    s.sales+=price;

    s.customers++;

   }

  }

  s.ideas.forEach(id=>{

   const idea=
    ideas.find(
     x=>x.id===id
    );

   if(idea){

    s.sales*=
     1+idea.bonus;

   }

  });

  groupIncome+=
   s.sales*.15;

  totals.sales+=
   s.sales;

  updateStorePopup(s);

 });

 changeMoney(
  Math.round(groupIncome)
 );

}

function processFranchise(){

 let income=0;

 franchisees.forEach(f=>{

  let x=0;

  f.stores.forEach(id=>{

   const s=
    stores.find(
     a=>a.id===id
    );

   if(s){

    x+=
     s.sales*
     (.08+
      f.skill*.004);

   }

  });

  x=Math.round(x);

  f.paid+=x;
  income+=x;

 });

 totals.franchise+=income;

 changeMoney(income);

}

function processCompanies(){

 companies.forEach(c=>{

  c.valuation=
   Math.max(
    100000,
    Math.round(
     c.valuation*
     (
      1+
      rndf(-.003,.009)
     )
    )
   );

  if(c.shares>0){

   const dividend=
    Math.round(
     c.profit*
     .04*
     c.shares/100
    );

   totals.dividends+=
    dividend;

   changeMoney(
    dividend
   );

  }

  if(
   Math.random()<.012&&
   c.factories.length<8
  ){

   createFactory(
    c,
    false
   );

  }

 });

}

function processSubsidiaries(){

 subsidiaries.forEach(s=>{

  const f=
   calculateSubFinances(
    s.id
   );

  /*
   W tej wersji spółka ma własną kasę.
   Wynik operacyjny trafia do jej kasy.
  */

  s.cash+=
   Math.round(
    f.profit*.1
   );

 });

}

function processPayroll(){

 const staff=
  employees
   .filter(
    e=>e.status==="employed"
   )
   .reduce(
    (a,e)=>a+e.salary,
    0
   );

 const driverPay=
  drivers.reduce(
   (a,d)=>a+d.salary,
   0
  );

 const total=
  staff+
  driverPay+
  25000;

 changeMoney(-total);

 totals.wages+=
  staff+
  driverPay;

 addNews(
  `💸 Koszty pracownicze: ${cash(total)}.`
 );

}

function gameDay(){

 if(speed===0)return;

 day++;

 processRoutes();
 processStores();
 processFranchise();
 processCompanies();
 processSubsidiaries();

 Object.values(
  prices
 ).forEach(x=>{

  if(x.days>0){

   x.days--;

   if(!x.days){

    x.discount=0;

   }

  }

 });

 if(day>30){

  day=1;
  month++;

  if(month>12){

   month=1;
   year++;

  }

  processPayroll();

 }

 if(
  Math.random()<.08&&
  employees.filter(
   x=>x.status==="candidate"
  ).length<30
 ){

  newCandidate();

 }

 render();

}

========================================================= */

let consoleOpen=false;

window.addEventListener(
"keydown",
e=>{

 if(
  e.key==="`"||
  e.key==="~"
 ){

  e.preventDefault();

  consoleOpen=
   !consoleOpen;

  document
   .getElementById(
    "console"
   )
   .style.display=
   consoleOpen
    ?"block"
    :"none";

  if(consoleOpen){

   document
    .getElementById(
     "consoleInput"
    )
    .focus();

  }

 }

 if(e.key==="Escape"){

  buildMode=null;

  document
   .getElementById(
    "buildInfo"
   )
   .style.display="none";

 }

}
);

document
.getElementById(
 "consoleInput"
)
.addEventListener(
"keydown",
e=>{

 if(e.key!=="Enter")return;

 const input=
  e.target.value.trim();

 e.target.value="";

 const h=
  document.getElementById(
   "consoleHistory"
  );

 h.textContent+=
  "\n> "+input;

 const a=
  input.split(/\s+/);

 const cmd=
  (a[0]||"")
   .toLowerCase();

 const value=
  Number(a[1]);

 if(cmd==="help"){

  h.textContent+=`

help
kasa [kwota]
maxstaff [liczba]
maxfranczyzobiorcy [liczba]
maxkierowcy [liczba]
kandydat
dzien
save
status

`;

 }

 else if(
  cmd==="kasa"&&
  Number.isFinite(value)
 ){

  money=value;

 }

 else if(
  cmd==="maxstaff"&&
  Number.isFinite(value)
 ){

  maxStaff=
   Math.max(
    0,
    Math.floor(value)
   );

 }

 else if(
  cmd==="maxfranczyzobiorcy"&&
  Number.isFinite(value)
 ){

  maxFranchisees=
   Math.max(
    0,
    Math.floor(value)
   );

 }

 else if(
  cmd==="maxkierowcy"&&
  Number.isFinite(value)
 ){

  maxDrivers=
   Math.max(
    0,
    Math.floor(value)
   );

 }

 else if(cmd==="kandydat"){

  newCandidate();

 }

 else if(cmd==="dzien"){

  gameDay();

 }

 else if(cmd==="save"){

  saveGame();

 }

 else if(cmd==="status"){

  h.textContent+=`

Kasa: ${cash(money)}
Sklepy: ${stores.length}
Centra: ${centers.length}
Trasy: ${routes.length}
Kierowcy: ${drivers.length}
Ciężarówki: ${trucks.length}
Firmy: ${companies.length}
Spółki córki: ${subsidiaries.length}

`;

 }

 else{

  h.textContent+=
   "\nNieznana komenda.";

 }

 render();

 h.scrollTop=
  h.scrollHeight;

}
);

========================================================= */

for(
 let i=0;
 i<15;
 i++
){

 newCandidate();

}

 let i=0;
 i<35;
 i++
){

 generateCompany(true);

}

);

);

);

);

 companies.forEach(c=>{

  c.valuation=

    rndf(

     1.02
    )
   );

   createFactory(

 render();

45000
);

setInterval(
()=>{

 if(
  employees.filter(
   e=>e.status==="candidate"
  ).length<35
 ){

40000
