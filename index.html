<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bug Tracker Trello Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #02233b, #090d16);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .glass-column {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body class="animated-bg text-slate-100 h-screen flex flex-col overflow-hidden font-sans">

    <!-- Górny pasek -->
    <header class="glass-panel border-b border-slate-750 px-6 py-4 flex justify-between items-center shadow-xl z-30">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse shadow-lg shadow-emerald-500/50"></div>
            <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-indigo-400 to-emerald-400 bg-clip-text text-transparent">Bug Tracker <span class="text-xs bg-indigo-500/20 border border-indigo-500/40 text-indigo-300 px-2.5 py-0.5 rounded-full ml-2">Trello Style</span></h1>
        </div>
        <div>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-medium text-sm transition shadow-lg shadow-indigo-600/30 flex items-center gap-2">
                <span class="font-bold text-lg">+</span> Dodaj błąd
            </button>
        </div>
    </header>

    <!-- Główna tablica Kanban -->
    <main class="flex-1 flex overflow-x-auto p-6 gap-6">

        <!-- Kolumna 1: Do zrobienia -->
        <div class="glass-column w-80 rounded-2xl flex flex-col max-h-full shrink-0 shadow-2xl">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center font-semibold text-slate-300">
                <span class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500"></span> Do zrobienia
                </span>
                <span id="count-todo" class="text-xs bg-slate-800 px-2.5 py-1 rounded-full text-slate-400">0</span>
            </div>
            <div id="column-todo" class="flex-1 p-4 overflow-y-auto space-y-3">
                <!-- Karty -->
            </div>
        </div>

        <!-- Kolumna 2: W trakcie -->
        <div class="glass-column w-80 rounded-2xl flex flex-col max-h-full shrink-0 shadow-2xl">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center font-semibold text-slate-300">
                <span class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span> W trakcie
                </span>
                <span id="count-progress" class="text-xs bg-slate-800 px-2.5 py-1 rounded-full text-slate-400">0</span>
            </div>
            <div id="column-progress" class="flex-1 p-4 overflow-y-auto space-y-3">
                <!-- Karty -->
            </div>
        </div>

        <!-- Kolumna 3: Zakończone -->
        <div class="glass-column w-80 rounded-2xl flex flex-col max-h-full shrink-0 shadow-2xl">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center font-semibold text-slate-300">
                <span class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span> Zakończone
                </span>
                <span id="count-done" class="text-xs bg-slate-800 px-2.5 py-1 rounded-full text-slate-400">0</span>
            </div>
            <div id="column-done" class="flex-1 p-4 overflow-y-auto space-y-3">
                <!-- Karty -->
            </div>
        </div>

    </main>

    <!-- MODAL DODAWANIA BŁĘDU -->
    <div id="bug-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4 z-50">
        <div class="glass-panel text-slate-100 w-full max-w-md rounded-2xl shadow-2xl overflow-hidden p-6 border border-slate-700/60">
            <h3 class="text-xl font-bold mb-4 text-indigo-300">Zgłoś nowy błąd</h3>
            <form onsubmit="saveBug(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Tytuł błędu</label>
                    <input type="text" id="bug-title" required placeholder="np. Przycisk logowania nie działa" class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-700/60 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-100 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Opis</label>
                    <textarea id="bug-desc" rows="3" required placeholder="Kroki do odtworzenia..." class="w-full px-4 py-2.5 bg-slate-950/60 border border-slate-700/60 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-100 text-sm resize-none"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Kategoria</label>
                        <select id="bug-category" class="w-full px-3 py-2.5 bg-slate-950/60 border border-slate-700/60 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-100 text-sm">
                            <option value="Bug">Bug (Błąd)</option>
                            <option value="UI/UX">UI / Wygląd</option>
                            <option value="Funkcjonalność">Funkcjonalność</option>
                            <option value="Optymalizacja">Optymalizacja</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Priorytet</label>
                        <select id="bug-priority" class="w-full px-3 py-2.5 bg-slate-950/60 border border-slate-700/60 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-slate-100 text-sm">
                            <option value="Niski">Niski</option>
                            <option value="Średni" selected>Średni</option>
                            <option value="Wysoki">Wysoki</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm font-medium transition border border-slate-700">Anuluj</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/30">Dodaj zgłoszenie</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Dane początkowe
        let bugs = JSON.parse(localStorage.getItem('trello_bugs')) || [
            { id: 1, title: 'Błąd stylów CSS na mobile', desc: 'Nagłówek nachodzi na menu na małych ekranach.', category: 'UI/UX', priority: 'Wysoki', status: 'todo' },
            { id: 2, title: 'Optymalizacja localStorage', desc: 'Sprawdzić limit zapisywanych danych w pamięci przeglądarki.', category: 'Optymalizacja', priority: 'Średni', status: 'progress' },
            { id: 3, title: 'Naprawa przycisku usuwania', desc: 'Usuwanie elementów z listy nie odświeżało widoku natychmiast.', category: 'Bug', priority: 'Niski', status: 'done' }
        ];

        function saveStorage() {
            localStorage.setItem('trello_bugs', JSON.stringify(bugs));
        }

        function renderBugs() {
            const todoContainer = document.getElementById('column-todo');
            const progressContainer = document.getElementById('column-progress');
            const doneContainer = document.getElementById('column-done');

            todoContainer.innerHTML = '';
            progressContainer.innerHTML = '';
            doneContainer.innerHTML = '';

            let counts = { todo: 0, progress: 0, done: 0 };

            bugs.forEach(bug => {
                counts[bug.status]++;

                // Kolory priorytetów i kategorii
                let priorityColor = 'bg-slate-700 text-slate-300';
                if(bug.priority === 'Wysoki') priorityColor = 'bg-rose-500/20 text-rose-300 border border-rose-500/30';
                if(bug.priority === 'Średni') priorityColor = 'bg-amber-500/20 text-amber-300 border border-amber-500/30';
                if(bug.priority === 'Niski') priorityColor = 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';

                const cardHtml = `
                    <div class="glass-card p-4 rounded-xl flex flex-col gap-2 transition hover:border-indigo-500/40">
                        <div class="flex justify-between items-start gap-2">
                            <span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">${bug.category}</span>
                            <span class="text-xs px-2 py-0.5 rounded-md ${priorityColor}">${bug.priority}</span>
                        </div>
                        <h4 class="font-bold text-slate-200 text-sm mt-1">${bug.title}</h4>
                        <p class="text-xs text-slate-400 leading-relaxed">${bug.desc}</p>
                        
                        <div class="flex justify-between items-center mt-3 pt-2 border-t border-slate-800 text-xs">
                            <div class="flex gap-1">
                                ${bug.status !== 'todo' ? `<button onclick="changeStatus(${bug.id}, 'todo')" class="text-slate-400 hover:text-white px-1.5 py-0.5 bg-slate-800 rounded">←</button>` : ''}
                                ${bug.status !== 'progress' ? `<button onclick="changeStatus(${bug.id}, 'progress')" class="text-slate-400 hover:text-white px-1.5 py-0.5 bg-slate-800 rounded">W trakcie</button>` : ''}
                                ${bug.status !== 'done' ? `<button onclick="changeStatus(${bug.id}, 'done')" class="text-slate-400 hover:text-white px-1.5 py-0.5 bg-slate-800 rounded">→</button>` : ''}
                            </div>
                            <button onclick="deleteBug(${bug.id})" class="text-red-400 hover:text-red-300 font-medium">Usuń</button>
                        </div>
                    </div>
                `;

                if(bug.status === 'todo') todoContainer.innerHTML += cardHtml;
                if(bug.status === 'progress') progressContainer.innerHTML += cardHtml;
                if(bug.status === 'done') doneContainer.innerHTML += cardHtml;
            });

            document.getElementById('count-todo').textContent = counts.todo;
            document.getElementById('count-progress').textContent = counts.progress;
            document.getElementById('count-done').textContent = counts.done;
        }

        function openModal() {
            document.getElementById('bug-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('bug-modal').classList.add('hidden');
            document.getElementById('bug-title').value = '';
            document.getElementById('bug-desc').value = '';
        }

        function saveBug(e) {
            e.preventDefault();
            const title = document.getElementById('bug-title').value;
            const desc = document.getElementById('bug-desc').value;
            const category = document.getElementById('bug-category').value;
            const priority = document.getElementById('bug-priority').value;

            bugs.push({
                id: Date.now(),
                title,
                desc,
                category,
                priority,
                status: 'todo'
            });

            saveStorage();
            closeModal();
            renderBugs();
        }

        function changeStatus(id, newStatus) {
            const b = bugs.find(item => item.id === id);
            if(b) {
                b.status = newStatus;
                saveStorage();
                renderBugs();
            }
        }

        function deleteBug(id) {
            bugs = bugs.filter(item => item.id !== id);
            saveStorage();
            renderBugs();
        }

        renderBugs();
    </script>
</body>
</html>
