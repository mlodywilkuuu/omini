<label>Rodzaj</label>
<select id="offerType" class="select">
  <option>Abonament</option>
  <option>Na kartę</option>
  <option>MIX</option>
  <option>Internet mobilny</option>
  <option>Internet domowy</option>
</select>

<div class="grid2">
  <div>
    <label>Cena</label>
    <input id="offerPrice" class="input" type="number" value="49">
  </div>

  <div id="offerDataBox">
    <label>Internet GB</label>
    <input id="offerData" class="input" type="number" value="100">
  </div>
</div>

<div id="offerNetworkBox">
  <label>Standard</label>
  <select id="offerNetwork" class="select">
    <option>2G / 3G</option>
    <option>LTE</option>
    <option>LTE / 5G</option>
    <option>5G Premium</option>
  </select>
</div>

<div id="offerSpeedBox" class="hidden">
  <label>Prędkość internetu</label>
  <select id="offerSpeed" class="select">
    <option value="50">50 Mb/s</option>
    <option value="100">100 Mb/s</option>
    <option value="300">300 Mb/s</option>
    <option value="600">600 Mb/s</option>
    <option value="1000">1 Gb/s</option>
    <option value="2000">2 Gb/s</option>
    <option value="5000">5 Gb/s</option>
    <option value="10000">10 Gb/s</option>
  </select>
</div>

<label>Streaming</label>
<select id="offerStreaming" class="select"></select>

<button id="createOffer" class="btn green"
style="width:100%;margin-top:10px">
  Utwórz ofertę
</button>
