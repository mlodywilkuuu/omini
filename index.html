```html
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medieval Lords — Village Builder</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

:root{
    --bg:#11130f;
    --panel:rgba(28,31,24,.88);
    --panel2:rgba(42,45,34,.92);
    --border:rgba(255,255,255,.10);
    --gold:#d9ae58;
    --gold2:#f1d18a;
    --text:#eee9dc;
    --muted:#aaa895;
    --green:#78945b;
    --green2:#9ebd72;
    --red:#b95c4e;
    --blue:#6287a2;
    --wood:#8b6846;
    --stone:#85847b;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#11130f;
    color:var(--text);
    font-family:Georgia, "Times New Roman", serif;
}

body{
    background:
        radial-gradient(circle at 50% 20%,rgba(180,160,100,.08),transparent 35%),
        #11130f;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:74px;
    z-index:100;
    display:flex;
    align-items:center;
    gap:20px;
    padding:10px 18px;
    background:
        linear-gradient(180deg,rgba(24,25,19,.97),rgba(18,19,15,.92));
    border-bottom:1px solid rgba(255,255,255,.08);
    box-shadow:0 8px 30px rgba(0,0,0,.35);
}

.logo{
    width:230px;
    display:flex;
    align-items:center;
    gap:12px;
}

.logoMark{
    width:44px;
    height:44px;
    border-radius:10px;
    display:grid;
    place-items:center;
    font-size:25px;
    background:
        linear-gradient(145deg,#b58b4a,#684b2e);
    border:1px solid rgba(255,220,150,.25);
    box-shadow:
        inset 0 1px rgba(255,255,255,.18),
        0 5px 20px rgba(0,0,0,.3);
}

.logoTitle{
    font-size:20px;
    letter-spacing:.5px;
    color:#f1e4c4;
}

.logoSub{
    color:#8e8d7e;
    font-size:11px;
    margin-top:2px;
}

.resources{
    flex:1;
    display:flex;
    gap:9px;
    overflow:hidden;
}

.res{
    min-width:110px;
    height:50px;
    padding:7px 11px;
    border:1px solid var(--border);
    background:rgba(255,255,255,.035);
    border-radius:9px;
}

.res .label{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#8e9184;
}

.res .value{
    font-size:16px;
    margin-top:3px;
    color:#eee8d8;
}

.speedBox{
    display:flex;
    gap:5px;
}

.speed{
    width:32px;
    height:30px;
    border-radius:6px;
    border:1px solid var(--border);
    background:#24271f;
    color:#aaa;
    cursor:pointer;
}

.speed.active{
    color:#fff;
    border-color:rgba(217,174,88,.55);
    background:#4c3c24;
}

.dateBox{
    min-width:145px;
    text-align:right;
}

.dateBox .season{
    color:var(--gold2);
    font-size:14px;
}

.dateBox .date{
    font-size:11px;
    color:#aaa;
    margin-top:3px;
}

/* =========================
   GAME
========================= */

#game{
    position:fixed;
    top:74px;
    left:0;
    right:0;
    bottom:0;
    overflow:hidden;
    cursor:default;
    background:#66784e;
}
```
