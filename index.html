<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>NEW YEAR — WORLD COUNTDOWN</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101f32;--line:#29415b;--gold:#ffd477;--muted:#9bb0c8;--white:#f7fbff}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden;overflow-y:auto}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--white);background:radial-gradient(ellipse at 50% 42%,#244d70 0,#0b1c2e 48%,#050b14 100%);background-size:140% 140%;animation:sky-breathe 12s ease-in-out infinite alternate}
@keyframes sky-breathe{from{background-position:0% 20%}to{background-position:100% 80%}}
body:after{content:"";position:fixed;inset:-30%;pointer-events:none;background:radial-gradient(circle,#ffd47712 0 1px,transparent 2px);background-size:90px 90px;animation:star-drift 45s linear infinite;opacity:.5}
@keyframes star-drift{to{transform:translate3d(90px,90px,0)}}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;background-image:radial-gradient(2px 2px at 12% 18%,#fff 45%,transparent 55%),radial-gradient(1px 1px at 78% 28%,#fff 45%,transparent 55%),radial-gradient(2px 2px at 65% 78%,#fff 45%,transparent 55%),radial-gradient(1px 1px at 32% 70%,#fff 45%,transparent 55%),radial-gradient(1px 1px at 91% 61%,#fff 45%,transparent 55%);background-size:380px 310px}
.app{min-height:100svh;width:100%;padding:clamp(8px,1.5vw,20px);display:flex;flex-direction:column;position:relative;isolation:isolate}
header{text-align:center;flex:0 0 auto}
.kicker{font-size:clamp(10px,1vw,14px);letter-spacing:.42em;color:var(--gold);font-weight:800}
h1{margin:.12em 0 0;font-size:clamp(18px,2.4vw,34px);letter-spacing:.06em;font-weight:850;text-shadow:0 0 28px #ffd47744}
.subtitle{margin:.55em 0 0;color:var(--muted);font-size:clamp(11px,1.1vw,15px);letter-spacing:.12em}
.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.65fr) minmax(220px,1fr);grid-template-rows:repeat(3,minmax(0,1fr));gap:clamp(4px,1vw,14px);max-width:1500px;width:100%;margin:4px auto 0}
.card{position:relative;min-width:0;min-height:0;border:0;border-radius:0;background:transparent;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(5px,1vw,14px);overflow:visible;animation:card-arrive .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes card-arrive{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.card.main:after{content:"";position:absolute;width:min(70vw,620px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#ffd47712,transparent 68%);z-index:-1;animation:halo 4s ease-in-out infinite alternate}
@keyframes halo{from{transform:scale(.88);opacity:.5}to{transform:scale(1.12);opacity:1}}
.card:before{display:none}
.card.main{grid-row:1/4;background:transparent;--accent:var(--gold)}
.card.small{--accent:#78bfe8}
.flag{display:block;width:clamp(36px,4vw,56px);height:auto;max-height:38px;object-fit:contain;font-size:clamp(26px,3vw,42px);font-weight:850;letter-spacing:.04em;color:var(--accent);filter:drop-shadow(0 3px 10px #0009);animation:flag-float 3.5s ease-in-out infinite}
@keyframes flag-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.place{margin-top:8px;font-size:clamp(17px,2vw,27px);font-weight:800}
.zone{display:none}
.timer{display:flex;align-items:baseline;justify-content:center;gap:clamp(1px,.45vw,8px);margin:clamp(7px,1.5vh,16px) 0 0;font-variant-numeric:tabular-nums;width:100%;max-width:100%;white-space:nowrap;overflow:visible}
.unit{display:flex;flex:1 1 0;flex-direction:column;align-items:center;min-width:0}
.num{font-size:clamp(20px,3.8vw,58px);font-weight:850;line-height:1.08;letter-spacing:-.065em;white-space:nowrap;text-shadow:0 4px 24px #8acbff22;animation:number-arrive .48s cubic-bezier(.2,.8,.2,1) both}
@keyframes number-arrive{from{opacity:.35;transform:translateY(9px) scale(.94);filter:blur(2px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
.main .num{font-size:clamp(26px,6.1vw,88px);text-shadow:0 0 36px #ffd47733}
.unit-label{font-size:clamp(8px,.7vw,10px);color:var(--muted);letter-spacing:.12em;margin-top:6px}
.sep{font-size:clamp(13px,2vw,28px);color:#9bb9d5;opacity:.75;flex:0 0 auto}
.main .sep{font-size:clamp(17px,3.2vw,42px)}
.status{margin-top:clamp(5px,.9vh,10px);font-size:clamp(8px,.75vw,10px);color:var(--muted);letter-spacing:.13em;text-transform:uppercase}
.main .status{color:var(--gold)}
footer{flex:0 0 auto;text-align:center;color:#7890a9;font-size:clamp(9px,.8vw,11px);letter-spacing:.12em;padding-top:14px}
.celebrate{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.burst{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 16px 5px #ffd47766;animation:burst 1.8s ease-out forwards}
@keyframes burst{0%{transform:translate(0,0) scale(.2);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
@media(max-width:700px){.app{padding:8px;min-height:100svh}.stage{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(185px,auto) minmax(112px,auto);gap:2px;margin-top:6px}.card.main{grid-column:1/4;grid-row:1}.card.small{padding:5px 1px;min-height:112px}.main .num{font-size:clamp(24px,7.2vw,42px)}.num{font-size:clamp(15px,4vw,25px)}.timer{gap:1px;margin-top:7px}.unit-label{font-size:6px;margin-top:3px;letter-spacing:.06em}.place{font-size:11px;margin-top:5px}.zone{display:none}.flag{width:30px;max-height:22px}.status{font-size:7px;margin-top:4px;letter-spacing:.08em}.sep{font-size:13px}}
@media(max-height:520px) and (min-width:701px){.app{padding:5px 14px}.stage{grid-template-rows:repeat(3,minmax(100px,1fr));margin-top:3px}.main .num{font-size:clamp(24px,5vw,58px)}.timer{margin-top:4px}.status{margin-top:3px}.card{padding:3px}footer{padding-top:4px}}
</style>
</head>
<body>
<div class="app">
<header><h1>NEW YEAR WORLD COUNTDOWN</h1></header>
<main class="stage" id="stage"><section class="card main" id="mainCard"></section><section class="card small" id="small1"></section><section class="card small" id="small2"></section><section class="card small" id="small3"></section></main>
<footer id="testMode">← / → ZMIANA STREFY · HOME POWRÓT DO CZASU NA ŻYWO</footer>
</div>
<script>
(()=>{
 const YEAR=2027;
 const fallback=["Pacific/Kiritimati","Pacific/Chatham","Pacific/Auckland","Australia/Sydney","Asia/Tokyo","Asia/Seoul","Asia/Shanghai","Asia/Singapore","Asia/Bangkok","Asia/Dhaka","Asia/Kathmandu","Asia/Kolkata","Asia/Dubai","Asia/Tehran","Europe/Moscow","Europe/Istanbul","Europe/Warsaw","Europe/London","Atlantic/Azores","America/Sao_Paulo","America/St_Johns","America/Halifax","America/New_York","America/Chicago","America/Denver","America/Los_Angeles","America/Anchorage","Pacific/Honolulu","Etc/GMT+10","Etc/GMT+11"];
 const zones=(typeof Intl.supportedValuesOf==="function"?Intl.supportedValuesOf("timeZone"):fallback);
 const fmt=(zone,opts,date)=>new Intl.DateTimeFormat("en-GB",{timeZone:zone,...opts}).format(date);
 const getOffset=(zone,date)=>{const parts=new Intl.DateTimeFormat("en-US",{timeZone:zone,timeZoneName:"longOffset"}).formatToParts(date);return parts.find(p=>p.type==="timeZoneName")?.value||"UTC"};
 const getTarget=(zone)=>{
   const p=new Intl.DateTimeFormat("en-US",{timeZone:zone,year:"numeric",month:"numeric",day:"numeric"}).formatToParts(new Date());
   const now=new Date(), y=now.getUTCFullYear();
   // UTC instant for Jan 1 local midnight, iteratively solve offset at candidate.
   let t=Date.UTC(YEAR,0,1);
   for(let i=0;i<4;i++){const off=getOffset(zone,new Date(t));const m=off.match(/GMT([+-])(\d{1,2})(?::(\d{2}))?/);let mins=0;if(m)mins=(m[1]==="-"?-1:1)*(Number(m[2])*60+Number(m[3]||0));t=Date.UTC(YEAR,0,1)-mins*60000;}
   return t;
 };
 const names={
 "Pacific/Kiritimati":["Kiritimati","🇰🇮","Kiribati"],"Pacific/Chatham":["Chatham Islands","🇳🇿","Nowa Zelandia"],"Pacific/Auckland":["Auckland","🇳🇿","Nowa Zelandia"],"Australia/Sydney":["Sydney","🇦🇺","Australia"],"Asia/Tokyo":["Tokyo","🇯🇵","Japonia"],"Asia/Seoul":["Seoul","🇰🇷","Korea Południowa"],"Asia/Shanghai":["Beijing / Shanghai","🇨🇳","Chiny"],"Asia/Singapore":["Singapore","🇸🇬","Singapur"],"Asia/Bangkok":["Bangkok","🇹🇭","Tajlandia"],"Asia/Dhaka":["Dhaka","🇧🇩","Bangladesz"],"Asia/Kathmandu":["Kathmandu","🇳🇵","Nepal"],"Asia/Kolkata":["New Delhi","🇮🇳","Indie"],"Asia/Dubai":["Dubai","🇦🇪","Zjednoczone Emiraty Arabskie"],"Asia/Tehran":["Tehran","🇮🇷","Iran"],"Europe/Moscow":["Moscow","🇷🇺","Rosja"],"Europe/Istanbul":["Istanbul","🇹🇷","Turcja"],"Europe/Warsaw":["Warszawa","🇵🇱","Polska"],"Europe/London":["London","🇬🇧","Wielka Brytania"],"Atlantic/Azores":["Azores","🇵🇹","Portugalia"],"America/Sao_Paulo":["São Paulo","🇧🇷","Brazylia"],"America/St_Johns":["St. John's","🇨🇦","Kanada"],"America/Halifax":["Halifax","🇨🇦","Kanada"],"America/New_York":["New York","🇺🇸","Stany Zjednoczone"],"America/Chicago":["Chicago","🇺🇸","Stany Zjednoczone"],"America/Denver":["Denver","🇺🇸","Stany Zjednoczone"],"America/Los_Angeles":["Los Angeles","🇺🇸","Stany Zjednoczone"],"America/Anchorage":["Anchorage","🇺🇸","Stany Zjednoczone"],"Pacific/Honolulu":["Honolulu","🇺🇸","Stany Zjednoczone"],"Etc/GMT+10":["UTC−10","🌐","Strefa oceaniczna"],"Etc/GMT+11":["UTC−11","🌐","Strefa oceaniczna"]
 };
 const pretty=z=>names[z]||[z.split("/").pop().replaceAll("_"," "), "🌍", "Strefa czasowa"];
 // Group every IANA zone by the exact UTC instant when local Jan 1 starts.
 const groups=new Map();
 for(const z of zones){try{const target=getTarget(z);if(target>Date.now()-1000){if(!groups.has(target))groups.set(target,[]);groups.get(target).push(z)}}catch(e){}}
 let events=[...groups.entries()].sort((a,b)=>a[0]-b[0]).map(([target,zs])=>({target,zones:zs.sort((a,b)=>{const aa=pretty(a)[0],bb=pretty(b)[0];return aa.localeCompare(bb)}),zone:zs.find(z=>names[z])||zs[0]}));
 if(!events.length) events=fallback.map(z=>({target:getTarget(z),zones:[z],zone:z})).sort((a,b)=>a.target-b.target);
 let lastIndex=-1, celebrated=new Set(), manualIndex=null;
 const $=id=>document.getElementById(id);
 function timeParts(ms){let s=Math.max(0,Math.floor(ms/1000));return [Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60]}
 function timerHTML(ms,big){const v=timeParts(ms);return '<div class="timer">'+v.map((n,i)=>'<div class="unit"><div class="num">'+String(n).padStart(2,"0")+'</div><div class="unit-label">'+["DNI","GODZ","MIN","SEK"][i]+'</div></div>'+(i<3?'<div class="sep">:</div>':'')).join("")+'</div>'}
 function renderCard(el,event,ms,big,index){const [city,emoji,country]=pretty(event.zone);const codes={"Pacific/Kiritimati":"ki","Pacific/Chatham":"nz","Pacific/Auckland":"nz","Australia/Sydney":"au","Asia/Tokyo":"jp","Asia/Seoul":"kr","Asia/Shanghai":"cn","Asia/Singapore":"sg","Asia/Bangkok":"th","Asia/Dhaka":"bd","Asia/Kathmandu":"np","Asia/Kolkata":"in","Asia/Dubai":"ae","Asia/Tehran":"ir","Europe/Moscow":"ru","Europe/Istanbul":"tr","Europe/Warsaw":"pl","Europe/London":"gb","Atlantic/Azores":"pt","America/Sao_Paulo":"br","America/St_Johns":"ca","America/Halifax":"ca","America/New_York":"us","America/Chicago":"us","America/Denver":"us","America/Los_Angeles":"us","America/Anchorage":"us","Pacific/Honolulu":"us"};const code=codes[event.zone];const flag=code?'<img class="flag" src="https://flagcdn.com/w80/'+code+'.png" alt="'+country+'">':'<span class="flag">'+emoji+'</span>';el.innerHTML=flag+'<div class="place">'+city+'</div><div class="status">'+(big?"NAJBLIŻSZA PÓŁNOC":"NADCHODZI")+'</div>'+timerHTML(ms,big)+'<div class="status">'+(ms<=0?"SZCZĘŚLIWEGO NOWEGO ROKU!":fmt(event.zone,{weekday:"short",day:"2-digit",month:"short"},new Date(event.target)))+'</div>'}
 function fireworks(){const stage=$("stage");for(let j=0;j<5;j++){const x=20+Math.random()*60,y=20+Math.random()*60;for(let i=0;i<22;i++){let p=document.createElement("i");p.className="burst";p.style.left=x+"%";p.style.top=y+"%";let a=Math.PI*2*i/22,r=45+Math.random()*80;p.style.setProperty("--dx",Math.cos(a)*r+"px");p.style.setProperty("--dy",Math.sin(a)*r+"px");stage.appendChild(p);setTimeout(()=>p.remove(),1900)}}}
 function tick(){const now=Date.now();let idx=events.findIndex(e=>e.target>now);if(idx<0)idx=events.length-1;if(manualIndex!==null)idx=manualIndex;
   if(lastIndex!==-1&&idx>lastIndex){for(let i=lastIndex;i<idx;i++){if(!celebrated.has(i)){celebrated.add(i);fireworks()}}}
   lastIndex=idx;
   const slots=[ $("mainCard"),$("small1"),$("small2"),$("small3") ];
   const remaining=events.length-idx;const visible=Math.min(4,remaining);for(let k=0;k<4;k++){if(k>=visible){slots[k].style.display="none";continue}slots[k].style.display="flex";const event=events[idx+k];renderCard(slots[k],event,event.target-now,k===0,idx+k)}
 }
 document.addEventListener("keydown",e=>{
   if(["ArrowLeft","ArrowRight"].includes(e.key)){
     e.preventDefault();
     const live=events.findIndex(event=>event.target>Date.now());
     const base=manualIndex===null?Math.max(0,live):manualIndex;
     manualIndex=Math.max(0,Math.min(events.length-1,base+(e.key==="ArrowRight"?1:-1)));
     $("testMode").textContent="TRYB TESTOWY · "+(manualIndex+1)+" / "+events.length+" · HOME = CZAS NA ŻYWO";
     tick();
   } else if(e.key==="Home"){
     manualIndex=null;
     $("testMode").textContent="← / → ZMIANA STREFY · HOME POWRÓT DO CZASU NA ŻYWO";
     lastIndex=-1;
     tick();
   }
 });
 tick();setInterval(tick,1000);
})();
</script>
</body></html>
