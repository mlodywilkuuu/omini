<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Live Game - Ranking Krajów</title>
    <!-- Socket.io klienta -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: transparent; /* Przezroczyste tło idealne pod OBS */
            color: #fff;
            padding: 20px;
        }

        #scoreboard {
            width: 350px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h2 {
            text-align: center;
            font-size: 20px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ff0050; /* TikTokowy różowy akcent */
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        #team-list {
            list-style: none;
            max-height: 500px;
            overflow-y: auto;
        }

        .team-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 8px;
            padding: 10px 12px;
            border-radius: 8px;
            transition: all 0.3s ease;
            border-left: 4px solid #fe2c55;
        }

        .team-info {
            display: flex;
            flex-direction: column;
        }

        .team-name {
            font-weight: bold;
            font-size: 16px;
        }

        .team-players {
            font-size: 11px;
            color: #aaa;
        }

        .team-points {
            font-size: 18px;
            font-weight: bold;
            color: #00f2fe; /* Niebieski akcent TikTok Live */
        }

        .empty-notice {
            text-align: center;
            color: #777;
            font-style: italic;
            padding: 20px 0;
        }
    </style>
</head>
<body>

    <div id="scoreboard">
        <h2>Ranking Drużyn</h2>
        <ul id="team-list">
            <li class="empty-notice">Czekam na wpisy z czatu...</li>
        </ul>
    </div>

    <script>
        const socket = io();
        const list = document.getElementById('team-list');

        socket.on('updateData', (teams) => {
            list.innerHTML = '';

            // Konwersja obiektu na tablicę i sortowanie malejąco po punktach
            const sortedTeams = Object.entries(teams).sort((a, b) => b[1].points - a[1].points);

            if (sortedTeams.length === 0) {
                list.innerHTML = '<li class="empty-notice">Czekam na wpisy z czatu...</li>';
                return;
            }

            sortedTeams.forEach(([teamName, data], index) => {
                const li = document.createElement('li');
                li.className = 'team-item';
                
                li.innerHTML = `
                    <div class="team-info">
                        <span class="team-name">${index + 1}. ${teamName}</span>
                        <span class="team-players">Graczy: ${data.players.length}</span>
                    </div>
                    <span class="team-points">${data.points} pkt</span>
                `;
                list.appendChild(li);
            });
        });
    </script>
</body>
</html>
