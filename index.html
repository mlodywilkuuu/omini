<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js">
/* ===== V13 MAP ZOOM STABILITY FIX ===== */
(function(){
  window.initMap=function(id,mode='political'){
    const root=document.getElementById(id);
    if(!root||!window.d3||!window.topojson)return;

    // Keep the current camera when render() rebuilds the page. The old version
    // reset scale/x/y to defaults, which made zoom visibly blink and snap back.
    const old=mapStates[id]||{};
    const scale=typeof old.scale==='number'?old.scale:1;
    const x=typeof old.x==='number'?old.x:0;
    const y=typeof old.y==='number'?old.y:0;
    const token=(old.token||0)+1;

    const svg=d3.select(root).select('svg');
    svg.selectAll('*').remove();
    mapStates[id]={svg,g:null,scale,x,y,drag:false,moved:false,sx:0,sy:0,ox:x,oy:y,token};
    const myToken=token;

    d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then(us=>{
      const st=mapStates[id];
      if(!st||st.token!==myToken)return;
      const features=topojson.feature(us,us.objects.states).features;
      const projection=d3.geoAlbersUsa().fitSize([root.clientWidth,root.clientHeight],{type:'FeatureCollection',features});
      const path=d3.geoPath(projection);
      const g=svg.append('g');

      g.selectAll('path').data(features).join('path')
        .attr('class','statePath').attr('d',path)
        .attr('fill',d=>{
          const m=STATES.find(x=>x[3]===String(d.id).padStart(2,'0'));
          return m?colorFor(m[1],mode):'#273b54';
        })
        .on('pointerdown',e=>e.stopPropagation())
        .on('click',(e,d)=>{
          e.stopPropagation();
          const m=STATES.find(x=>x[3]===String(d.id).padStart(2,'0'));
          const cur=mapStates[id];
          if(m&&cur&&!cur.moved)stateInfo(m[1]);
          if(cur)cur.moved=false;
        });

      g.selectAll('text').data(features).join('text')
        .attr('class','stateLabel')
        .attr('transform',d=>{
          const c=path.centroid(d);
          return `translate(${c[0]},${c[1]})`;
        })
        .text(d=>{
          const m=STATES.find(x=>x[3]===String(d.id).padStart(2,'0'));
          return m?m[1]:'';
        });

      st.g=g;
      let drag=null;
      root.onpointerdown=e=>{
        if(e.target.closest('.mapTools')||e.target.closest('.statePath'))return;
        drag={x:e.clientX,y:e.clientY,ox:st.x,oy:st.y,moved:false};
      };
      root.onpointermove=e=>{
        if(!drag)return;
        const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
        if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;
        if(drag.moved){
          st.x=drag.ox+dx;st.y=drag.oy+dy;st.moved=true;applyMap(id);
        }
      };
      root.onpointerup=()=>{
        if(drag){st.moved=drag.moved;drag=null;}
      };
      root.onpointercancel=()=>{drag=null;st.moved=false;};
      root.onwheel=e=>{
        e.preventDefault();
        // Do not call render(), save(), or recreate the map during zoom.
        mapZoom(id,e.deltaY<0?1.1:.9);
      };
      applyMap(id);
    }).catch(()=>{
      if(mapStates[id]?.token!==myToken)return;
      svg.append('text').attr('x','50%').attr('y','50%').attr('text-anchor','middle')
        .attr('fill','#71839a').text('Nie udało się wczytać mapy USA');
    });
  };

  window.mapZoom=function(id,f){
    const st=mapStates[id];
    if(!st)return;
    const oldScale=st.scale||1;
    const next=clamp(oldScale*f,.7,3.2);
    if(next===oldScale)return;
    st.scale=next;
    applyMap(id);
  };

  window.mapReset=function(id){
    const st=mapStates[id];
    if(!st)return;
    st.scale=1;st.x=0;st.y=0;st.moved=false;
    applyMap(id);
  };
})();
</script>

async function initMap(id,mode='political'){
 const root=document.getElementById(id);if(!root||!window.d3||!window.topojson)return;const svg=d3.select(root).select('svg');svg.selectAll('*').remove();
 try{const us=await d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json');const features=topojson.feature(us,us.objects.states).features;const projection=d3.geoAlbersUsa().fitSize([root.clientWidth,root.clientHeight],{type:'FeatureCollection',features});const path=d3.geoPath(projection);const g=svg.append('g');g.selectAll('path').data(features).join('path').attr('class','statePath').attr('d',path).attr('fill',d=>{const m=STATES.find(x=>x[3]===String(d.id).padStart(2,'0'));return m?colorFor(m[1],mode):'#273b54'}).on('click',(e,d)=>{const m=STATES.find(x=>x[3]===String(d.id).padStart(2,'0'));if(m)stateInfo(m[1])});g.selectAll('text').data(features).join('text').attr('class','stateLabel').attr('transform',d=>{const c=path.centroid(d);return `translate(${c[0]},${c[1]})`}).text(d=>{const m=STATES.find(x=>x[3]===String(d.id).padStart(2,'0'));return m?m[1]:''});mapStates[id]={svg,g,scale:1,x:0,y:0};root.onpointerdown=e=>{mapStates[id].drag=true;mapStates[id].sx=e.clientX;mapStates[id].sy=e.clientY;mapStates[id].ox=mapStates[id].x;mapStates[id].oy=mapStates[id].y;root.setPointerCapture(e.pointerId)};root.onpointermove=e=>{const m=mapStates[id];if(!m?.drag)return;m.x=m.ox+e.clientX-m.sx;m.y=m.oy+e.clientY-m.sy;applyMap(id)};root.onpointerup=()=>mapStates[id]&&(mapStates[id].drag=false);root.onpointercancel=()=>mapStates[id]&&(mapStates[id].drag=false);root.onwheel=e=>{e.preventDefault();mapZoom(id,e.deltaY<0?1.1:.9)}}catch(e){svg.append('text').attr('x','50%').attr('y','50%').attr('text-anchor','middle').attr('fill','#71839a').text('Nie udało się wczytać mapy USA')}}
function applyMap(id){const m=mapStates[id];if(m)m.g.attr('transform',`translate(${m.x},${m.y}) scale(${m.scale})`)}
function mapZoom(id,f){const m=mapStates[id];if(!m)return;m.scale=clamp(m.scale*f,.7,3.2);applyMap(id)}
function mapReset(id){const m=mapStates[id];if(!m)return;m.scale=1;m.x=0;m.y=0;applyMap(id)}
function initVisibleMaps(){document.querySelectorAll('.mapViewport').forEach(x=>initMap(x.id,x.dataset.mode||'political'))}
function ev(){return STATES.reduce((n,s)=>n+(G.states[s[1]].called==='blue'?s[2]:0),0)}
function forecastEV(){return STATES.reduce((n,s)=>{const x=G.states[s[1]],u=x.support||0,r=x.red||50,p=x.purple||5;return n+(u>=r&&u>=p?s[2]:0)},0)}
function stateInfo(a){G.selectedState=a;save();render();const s=STATES.find(x=>x[1]===a),x=G.states[a];openModal(`<h2>${s[0]} (${a})</h2>${stat('Głosy elektorskie',s[2])}${stat('Twoje poparcie',pct(x.support))}${stat('Rywal czerwony',pct(x.red))}${stat('Niezależni',pct(x.purple))}${stat('Wynik',x.called?`Partia ${x.called==='blue'?'Niebieska':x.called==='red'?'Czerwona':'Niezależna'}`:'Jeszcze nie rozstrzygnięty')}${G.election?.active&&G.election.phase==='campaign'?`<div class="rowActions" style="margin-top:12px"><button class="btn primary" onclick="stateRally('${a}')">Wiec w ${s[0]} — $20M</button><button class="btn" onclick="targetAds('${a}')">Reklama stanowa — $25M</button></div>`:''}`)}
function startCongressCampaign(){if(G.congressCampaign?.active)return;G.congressCampaign={active:true,day:1,totalDays:20,phase:'campaign',results:null};saveNews('🏛️ Rozpoczęła się 20-dniowa kampania do Kongresu.');save();render()}
function campaignAction(type){if(!G.election.active||G.election.phase!=='campaign')return toast('Kampania prezydencka jest zakończona.');const costs={rally:35,tv:60,web:30,fund:0,debate:0,attack:45};const c=costs[type];if(G.funds<c)return toast('Brak środków kampanii');G.funds-=c;switch(type){case'rally':G.popularity=clamp(G.popularity+3,0,100);STATES.forEach(s=>G.states[s[1]].support=clamp(G.states[s[1]].support+(.5+Math.random()*1.5),0,70));saveNews('📣 Wielki wiec krajowy podniósł poparcie.');break;case'tv':G.popularity=clamp(G.popularity+4,0,100);STATES.forEach(s=>G.states[s[1]].support=clamp(G.states[s[1]].support+.8,0,70));saveNews('📺 Ogólnokrajowa kampania TV zwiększyła rozpoznawalność.');break;case'web':G.popularity=clamp(G.popularity+2.2,0,100);STATES.filter(s=>['AZ','GA','MI','NV','NC','PA','WI'].includes(s[1])).forEach(s=>G.states[s[1]].support=clamp(G.states[s[1]].support+2,0,70));saveNews('💻 Kampania cyfrowa trafiła do młodszych wyborców.');break;case'fund':G.funds+=70;G.popularity=clamp(G.popularity-.4,0,100);saveNews('💰 Zorganizowano zbiórkę pieniędzy.');break;case'debate':G.popularity=clamp(G.popularity+(Math.random()*8-1),0,100);saveNews('🎙️ Debata prezydencka zmieniła układ sił.');break;case'attack':G.popularity=clamp(G.popularity+(Math.random()*5-1),0,100);STATES.filter(s=>Math.random()<.3).forEach(s=>G.states[s[1]].red=clamp(G.states[s[1]].red-2,30,65));saveNews('⚔️ Kampania negatywna osłabiła część rywala, ale zwiększyła polaryzację.');break}G.campaign=clamp(G.campaign+4,0,100);save();render()}
function stateRally(a){if(G.funds<20)return toast('Brak środków');G.funds-=20;G.states[a].support=clamp(G.states[a].support+5+Math.random()*2,0,75);G.popularity=clamp(G.popularity+.5,0,100);closeModal();saveNews(`📍 Bezpośredni wiec zwiększył poparcie w ${a}.`);save();render()}
function targetAds(a){if(G.funds<25)return toast('Brak środków');G.funds-=25;G.states[a].support=clamp(G.states[a].support+4,0,75);closeModal();saveNews(`📡 Uruchomiono reklamy celowane w ${a}.`);save();render()}
function startElectionNight(){G.election.phase='electionNight';G.election.called=[];G.states && Object.values(G.states).forEach(s=>s.called=null);saveNews('🗳️ Kampania zakończona. Rozpoczyna się Noc Wyborcza.');save();render()}
function callNextState(){if(G.election.phase!=='electionNight')return;const remaining=STATES.filter(s=>!G.election.called.includes(s[1]));if(!remaining.length){finishPresidentialElection();return}remaining.sort((a,b)=>{const aa=Math.abs((G.states[a[1]].support||0)-(G.states[a[1]].red||50));const bb=Math.abs((G.states[b[1]].support||0)-(G.states[b[1]].red||50));return aa-bb});const pick=Math.random()<.7?remaining[0]:remaining[Math.floor(Math.random()*Math.min(remaining.length,10))];const x=G.states[pick[1]],u=x.support||0,r=x.red||50,p=x.purple||5;let winner=u>=r&&u>=p?'blue':r>=p?'red':'purple';x.called=winner;G.election.called.push(pick[1]);saveNews(`📡 ${pick[0]}: ${winner==='blue'?'Partia Niebieska':winner==='red'?'Partia Czerwona':'Niezależni'} zdobywa ${pick[2]} głosów elektorskich.`);save();render();if(G.election.called.length<STATES.length)setTimeout(callNextState,550);else setTimeout(finishPresidentialElection,900)}
function finishPresidentialElection(){const won=ev()>=270;G.election.phase='results';G.election.winner=won?'blue':Object.values(G.states).filter(s=>s.called==='red').reduce((a,s)=>a,0)?'red':'purple';if(won){G.president=true;G.oval.unlocked=true;G.nextCongress=G.year+2;G.nextPresidential=G.year+5;G.popularity=clamp(G.popularity+8,0,100);saveNews(`🎉 ZWYCIĘSTWO! Zdobyłeś ${ev()} głosów elektorskich i obejmujesz urząd Prezydenta USA.`)}else{G.president=false;saveNews(`❌ Przegrałeś wybory. Zdobyłeś ${ev()} głosów elektorskich.`)}save();render()}
function vOverview(){const gov=G.president?'<span class="presidentBadge">Prezydent USA</span>':'<span class="badge y">Kandydat</span>';return `<div class="grid">${C('wide','Centrum dowodzenia',`<div class="metric">${gov}</div><p class="muted">${G.president?'Państwo jest teraz pod Twoim kierownictwem. Gabinet Owalny jest odblokowany.':'Zbuduj kampanię, zdobądź 270 głosów elektorskich i przejmij Biały Dom.'}</p>${G.election.active?`<div class="notice"><b>Kampania:</b> dzień ${G.election.day}/${G.election.totalDays} • ${G.election.phase==='campaign'?'aktywny etap kampanii':'Noc Wyborcza'}</div>`:''}`)}${C('','Poparcie',`<div class="metric">${pct(G.popularity)}</div>${bar(G.popularity)}`)}${C('','Kolegium Elektorów',`<div class="metric">${G.election.phase==='results'||G.election.phase==='electionNight'?ev():forecastEV()} / 270</div><span class="muted">538 łącznie</span>`)}${C('','Skarb',`<div class="metric">${money(G.funds)}</div><span class="muted">Fundusze państwowe / kampanijne</span>`)}${C('half','Kongres',stat('Izba',houseControl())+stat('Senat',senateControl())+stat('Mandaty Izby',`${G.houseD} D / ${G.houseR} R / ${G.houseI} I`)+stat('Senat',`${G.senateD} D / ${G.senateR} R / ${G.senateI} I`))}${C('half','Najważniejsze wskaźniki',stat('PKB',G.gdp.toFixed(1))+stat('Inflacja',G.inflation.toFixed(1)+'%')+stat('Bezrobocie',G.unemployment.toFixed(1)+'%')+stat('Relacje zagraniczne',G.foreign+'/100'))}${C('wide','Mapa polityczna USA',mapHTML('overviewMap',G.election.active?'presidential':'political',true)+`<div class="legend"><span><i class="dot dBlue"></i>Ty</span><span><i class="dot dRed"></i>Rywal</span><span><i class="dot dPurple"></i>Niezależni</span></div>`)}${C('','Alerty',newsHTML())}${C('','Szybkie działania',`<div class="rowActions">${!G.president?`<button class="btn primary" onclick="setPage('election')">Otwórz kampanię</button>`:`<button class="btn primary" onclick="setPage('oval')">Wejdź do Gabinetu Owalnego</button>`}<button class="btn" onclick="setPage('laws')">Nowa ustawa</button></div>`)}</div>`}
function newsHTML(){return G.news.length?G.news.slice(-7).reverse().map(x=>`<div class="list">${x}</div>`).join(''):'<div class="empty">Brak wydarzeń.</div>'}
function vElection(){if(G.election.phase==='results'){return `<div class="grid">${C('wide',G.election.winner==='blue'?'🎉 Biały Dom zdobyty':'❌ Wybory przegrane',`<div class="resultBanner ${G.election.winner==='blue'?'':'lose'}"><div class="metric">${ev()} / 538 EV</div><p>${G.election.winner==='blue'?'Wygrałeś. Gabinet Owalny został odblokowany.':'Tym razem nie udało się przekroczyć progu 270.'}</p><div class="rowActions">${G.election.winner==='blue'?`<button class="btn primary" onclick="setPage('oval')">Otwórz Gabinet Owalny</button>`:`<button class="btn primary" onclick="restartCampaign()">Nowa kampania</button>`}</div></div>`)}${C('','Wynik',stat('Głosy elektorskie',ev())+stat('Próg zwycięstwa','270')+stat('Stany zdobyte',G.election.called.filter(a=>G.states[a].called==='blue').length))}${C('full','Mapa wyników',mapHTML('electionResultsMap','presidential'))}</div>`}return `<div class="grid">${C('wide','Kampania prezydencka',`<div class="campaignHero"><div class="eyebrow">Następne 30 dni decyduje o Białym Domu</div><div class="campaignDay">Dzień ${G.election.day} / ${G.election.totalDays}</div><div class="progress"><i style="width:${G.election.day/G.election.totalDays*100}%"></i></div><p class="muted">Czas płynie automatycznie. Wykorzystuj działania kampanijne, a po 30. dniu rozpocznie się Noc Wyborcza.</p></div>`)}${C('','Sondaż krajowy',`<div class="metric">${pct(G.popularity)}</div>${bar(G.popularity)}${stat('Prognoza EV',forecastEV())}`)}${C('wide','Mapa stanów',mapHTML('electionMap','presidential'))}${C('','Działania kampanii',`<div class="campaignGrid"><button class="campaignAction btn" onclick="campaignAction('rally')"><b>📣 Wiec</b>-$35M</button><button class="campaignAction btn" onclick="campaignAction('tv')"><b>📺 TV</b>-$60M</button><button class="campaignAction btn" onclick="campaignAction('web')"><b>💻 Internet</b>-$30M</button><button class="campaignAction btn" onclick="campaignAction('fund')"><b>💰 Zbiórka</b>+$70M</button><button class="campaignAction btn" onclick="campaignAction('debate')"><b>🎙️ Debata</b>Wpływ opinii</button><button class="campaignAction btn" onclick="campaignAction('attack')"><b>⚔️ Atak</b>-$45M</button></div>`)}${C('','Kandydaci',stat('Ty',PARTY.blue.name)+stat('Rywal',PARTY.red.name)+stat('Niezależni',PARTY.purple.name))}${C('full','Dziennik kampanii',newsHTML())}</div>`}
function restartCampaign(){G.president=false;G.oval.unlocked=false;G.election={active:true,type:'presidential',day:1,totalDays:30,phase:'campaign',results:{},called:[],winner:null};G.popularity=0;G.campaign=0;STATES.forEach(s=>G.states[s[1]]={support:0,red:46+Math.random()*10,purple:4+Math.random()*4,called:null,senate:null});saveNews('🔄 Rozpoczęto nową kampanię prezydencką.');save();render()}
function vCongress(){if(!G.congressCampaign?.active&&!G.president)return `<div class="grid">${C('wide','Kampania do Kongresu',`<p class="muted">Po objęciu Białego Domu możesz prowadzić własną kampanię do Kongresu. System rozgrywa osobno Izbę Reprezentantów i Senat.</p><button class="btn primary" onclick="toast('Najpierw wygraj wybory prezydenckie.')">Kampania zablokowana</button>`)}${C('','Kongres',stat('Izba','435 miejsc')+stat('Senat','100 miejsc'))}</div>`;if(G.congressCampaign.phase==='results')return `<div class="grid">${C('wide','🏛️ Wyniki wyborów do Kongresu',`<div class="resultBanner"><div class="metric">Izba: ${G.houseD} D / ${G.houseR} R / ${G.houseI} I</div><p>Senat: ${G.senateD} D / ${G.senateR} R / ${G.senateI} I</p></div>`)}${C('full','Mapa stanów — Senat',mapHTML('senateMap','senate'))}${C('half','Kontrola Kongresu',stat('Izba',houseControl())+stat('Senat',senateControl()))}${C('half','Kadencja',`<p class="muted">Następna kampania kongresowa: ${G.nextCongress}.</p>`)} </div>`;return `<div class="grid">${C('wide','Kampania parlamentarna',`<div class="campaignHero"><div class="campaignDay">Dzień ${G.congressCampaign.day} / ${G.congressCampaign.totalDays}</div><div class="progress"><i style="width:${G.congressCampaign.day/G.congressCampaign.totalDays*100}%"></i></div><p class="muted">Buduj zaplecze dla kandydatów do Izby i Senatu. Kampania kończy się automatycznie.</p></div>`)}${C('','Stan Kongresu',stat('Izba',`${G.houseD} D / ${G.houseR} R / ${G.houseI} I`)+stat('Senat',`${G.senateD} D / ${G.senateR} R / ${G.senateI} I`))}${C('full','Mapa kampanii',mapHTML('congressMap','political'))}${C('wide','Operacje kampanijne',`<div class="campaignGrid"><button class="campaignAction btn" onclick="congressAction('ground')"><b>🤝 Organizacja terenu</b>-$30M</button><button class="campaignAction btn" onclick="congressAction('tv')"><b>📺 Reklama TV</b>-$55M</button><button class="campaignAction btn" onclick="congressAction('fund')"><b>💰 Fundraising</b>+$65M</button><button class="campaignAction btn" onclick="congressAction('endorse')"><b>⭐ Poparcie liderów</b>-$20M</button><button class="campaignAction btn" onclick="congressAction('attack')"><b>⚔️ Kampania negatywna</b>-$40M</button></div>`)}${C('','Start',`<p class="muted">${G.congressCampaign.day===1?'Kampania właśnie się rozpoczęła.':'Kampania trwa.'}</p>`)}</div>`}
function congressAction(a){if(!G.congressCampaign?.active)return;const cost={ground:30,tv:55,fund:0,endorse:20,attack:40}[a];if(G.funds<cost)return toast('Brak środków');G.funds-=cost;if(a==='fund')G.funds+=65;else if(a==='ground'){G.houseD+=Math.random()<.65?2:1;G.senateD+=Math.random()<.5?1:0}else if(a==='tv'){G.houseD+=3;G.senateD+=Math.random()<.55?1:0}else if(a==='endorse'){G.houseD+=2;G.senateD+=1}else G.houseR=Math.max(0,G.houseR-2);normalizeCongress();saveNews('🏛️ Wykonano operację kampanii do Kongresu.');save();render()}
function normalizeCongress(){G.houseD=clamp(Math.round(G.houseD),0,435);G.houseI=clamp(Math.round(G.houseI),0,435-G.houseD);G.houseR=435-G.houseD-G.houseI;G.senateD=clamp(Math.round(G.senateD),0,100);G.senateI=clamp(Math.round(G.senateI),0,100-G.senateD);G.senateR=100-G.senateD-G.senateI}
function finishCongress(){G.congressCampaign.phase='results';G.congressCampaign.active=false;normalizeCongress();G.nextCongress=G.year+2;saveNews(`🏛️ Zakończono wybory do Kongresu. Izba: ${houseControl()}, Senat: ${senateControl()}.`);save();render()}
function houseControl(){return G.houseD>G.houseR&&G.houseD>G.houseI?'Demokraci':G.houseR>G.houseD&&G.houseR>G.houseI?'Republikanie':'Brak większości'}
function senateControl(){return G.senateD>G.senateR&&G.senateD>G.senateI?'Demokraci':G.senateR>G.senateD&&G.senateR>G.senateI?'Republikanie':'Brak większości'}
function vLaws(){return `<div class="grid">${C('wide','Ustawy federalne — nowy proces',`<p class="muted">Projekt → komisja → Izba (218) → Senat (51) → uzgodnienie → podpis lub weto. Głosowania są zapisywane osobno, więc ustawa nie znika i nie zmienia statusu bez powodu.</p><button class="btn primary" onclick="lawModal()">✍️ Napisz projekt ustawy</button>`)}${C('','Wymogi',stat('Izba','218 / 435')+stat('Senat','51 / 100')+stat('Prezydent',G.president?'Podpis / weto':'Nie pełnisz urzędu'))}${C('full','Rejestr ustaw',G.laws.length?`<div class="tablewrap"><table><thead><tr><th>Ustawa</th><th>Komisja</th><th>Izba</th><th>Senat</th><th>Status</th><th>Akcja</th></tr></thead><tbody>${G.laws.slice().reverse().map((l,ri)=>{const i=G.laws.length-1-ri;return `<tr><td><b>${l.name}</b><br><span class="muted">${l.desc}</span></td><td>${l.committee}</td><td>${l.houseVotes}/435</td><td>${l.senateVotes}/100</td><td><span class="badge ${l.status==='Podpisana'?'g':l.status==='Zawetowana'||l.status==='Odrzucona'?'r':'y'}">${l.status}</span></td><td>${l.status==='Do podpisu'&&G.president?`<button class="btn green" onclick="signLaw(${i})">Podpisz</button> <button class="btn danger" onclick="vetoLaw(${i})">Weto</button>`:'—'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Brak projektów ustaw.</div>')}${C('full','Poprawki do Konstytucji',`${G.amendments.length?G.amendments.slice().reverse().map((a,ri)=>{const i=G.amendments.length-1-ri;return `<div class="list"><b>${a.name}</b><div class="muted">${a.text}</div>${stat('Izba',a.houseVotes+'/435')}${stat('Senat',a.senateVotes+'/100')}${stat('Stany',a.statesYes+'/50')}${stat('Status',a.status)}</div>`}).join(''):'<div class="empty">Brak poprawek.</div>'}<div class="rowActions"><button class="btn primary" onclick="amendmentModal()">⚖️ Zaproponuj poprawkę</button></div>`)}</div>`}
function lawModal(){openModal(`<h2>Nowy projekt ustawy</h2><label>Nazwa</label><input id="lawName" value="Ustawa o modernizacji infrastruktury"><label>Komisja</label><select id="lawCommittee"><option>Finanse i budżet</option><option>Gospodarka</option><option>Zdrowie</option><option>Obrona</option><option>Technologie</option><option>Sprawy zagraniczne</option></select><label>Opis</label><textarea id="lawDesc">Projekt ustawy federalnej.</textarea><label>Koszt budżetowy (mln $)</label><input id="lawCost" type="number" min="0" value="40"><button class="btn primary" onclick="submitLaw()">Przeprowadź ustawę przez Kongres</button>`)}
function submitLaw(){const name=document.getElementById('lawName').value.trim()||'Nowa ustawa';const committee=document.getElementById('lawCommittee').value;const desc=document.getElementById('lawDesc').value.trim();const cost=Math.max(0,+document.getElementById('lawCost').value||0);let house=Math.round(G.houseD+G.houseI+G.houseR*(G.popularity/100)*.65+Math.random()*16-8);let senate=Math.round(G.senateD+G.senateI+G.senateR*(G.popularity/100)*.65+Math.random()*7-3);house=clamp(house,0,435);senate=clamp(senate,0,100);let status=house>=218&&senate>=51?'Do podpisu':'Odrzucona';G.laws.push({name,committee,desc,cost,houseVotes:house,senateVotes:senate,status,created:`${G.day}.${G.month}.${G.year}`});saveNews(status==='Do podpisu'?`📜 Ustawa „${name}” przeszła obie izby.`:`📜 Ustawa „${name}” upadła podczas głosowania.`);closeModal();save();render()}
function signLaw(i){const l=G.laws[i];if(!l||l.status!=='Do podpisu')return;if(!G.president)return toast('Nie jesteś prezydentem');if(l.cost>G.funds)return toast('Brak środków na realizację ustawy');G.funds-=l.cost;l.status='Podpisana';G.gdp+=l.cost*.012;G.popularity=clamp(G.popularity+(l.cost?1:.3),0,100);saveNews(`✍️ Podpisałeś ustawę „${l.name}”.`);save();render()}
function vetoLaw(i){const l=G.laws[i];if(!l||l.status!=='Do podpisu')return;l.status='Zawetowana';G.popularity=clamp(G.popularity-.5,0,100);saveNews(`🛑 Zawetowałeś ustawę „${l.name}”.`);save();render()}
function amendmentModal(){openModal(`<h2>⚖️ Poprawka do Konstytucji</h2><p class="muted">Gra wymaga 2/3 w Izbie, 2/3 w Senacie i ratyfikacji przez 38 z 50 stanów.</p><label>Nazwa</label><input id="amName" value="Poprawka dotycząca praw obywatelskich"><label>Treść</label><textarea id="amText">Kongres proponuje zmianę Konstytucji Stanów Zjednoczonych.</textarea><button class="btn primary" onclick="submitAmendment()">Uruchom procedurę</button>`)}
function submitAmendment(){const name=document.getElementById('amName').value.trim()||'Nowa poprawka';const text=document.getElementById('amText').value.trim()||'Proponowana zmiana';const h=G.houseD+G.houseI+Math.round(G.houseR*(G.popularity/100)*.55);const s=G.senateD+G.senateI+Math.round(G.senateR*(G.popularity/100)*.55);let sy=0;STATES.forEach(st=>{const x=G.states[st[1]];if(x.support>=45+Math.random()*20)sy++});const passed=h>=290&&s>=67;const status=passed?(sy>=38?'Ratyfikowana':'W ratyfikacji'):'Odrzucona przez Kongres';G.amendments.push({name,text,houseVotes:clamp(h,0,435),senateVotes:clamp(s,0,100),statesYes:sy,status});saveNews(`⚖️ Poprawka „${name}”: ${status}.`);closeModal();save();render()}
function vStates(){const selected=STATES.find(x=>x[1]===G.selectedState)||STATES[0],sx=G.states[selected[1]];const lead=sx.support>=sx.red&&sx.support>=sx.purple?'Ty':sx.red>=sx.purple?'Rywal':'Niezależni';return `<div class="grid">${C('wide','Mapa Stanów Zjednoczonych',mapHTML('statesMap','presidential'))}${C('','Wybrany stan',`<div class="eyebrow">${selected[1]}</div><div class="metric">${selected[0]}</div>${stat('Głosy elektorskie',selected[2])}${stat('Twoje poparcie',pct(sx.support))}${stat('Rywal czerwony',pct(sx.red))}${stat('Niezależni',pct(sx.purple))}${stat('Prowadzi',lead)}${bar(sx.support)}<div class="rowActions" style="margin-top:10px"><button class="btn primary" onclick="stateRally('${selected[1]}')">Wiec — $20M</button><button class="btn" onclick="targetAds('${selected[1]}')">Reklama — $25M</button></div>`)}${C('','Federalizm',stat('Stany','50')+stat('Kolegium','538')+stat('Próg','270')+`<p class="muted">Kliknij dowolny stan na mapie. Kafelek obok natychmiast pokazuje jego statystyki.</p>`)}${C('full','Tabela stanów',`<div class="tablewrap"><table><thead><tr><th>Stan</th><th>EV</th><th>Twoje poparcie</th><th>Rywal</th><th>Pozycja</th></tr></thead><tbody>${STATES.map(s=>{const x=G.states[s[1]],lead=x.support>=x.red&&x.support>=x.purple?'Ty':x.red>=x.purple?'Rywal':'Niezależni';return `<tr><td><b>${s[0]}</b> (${s[1]})</td><td>${s[2]}</td><td>${pct(x.support)}</td><td>${pct(x.red)}</td><td><span class="badge ${lead==='Ty'?'b':lead==='Rywal'?'r':'y'}">${lead}</span></td></tr>`}).join('')}</tbody></table></div>`)}</div>`}
function vEconomy(){return `<div class="grid">${C('','PKB',`<div class="metric">${G.gdp.toFixed(1)}</div>`)}${C('','Inflacja',`<div class="metric">${G.inflation.toFixed(1)}%</div>`)}${C('','Bezrobocie',`<div class="metric">${G.unemployment.toFixed(1)}%</div>`)}${C('wide','Polityka gospodarcza',`<div class="rowActions"><button class="btn primary" onclick="econ('stimulus')">Infrastruktura — $60M</button><button class="btn" onclick="econ('tax')">Reforma podatkowa</button><button class="btn" onclick="econ('austerity')">Oszczędności</button></div>`)}${C('half','Wskaźniki',stat('PKB',G.gdp.toFixed(1))+stat('Inflacja',G.inflation.toFixed(1)+'%')+stat('Bezrobocie',G.unemployment.toFixed(1)+'%'))}</div>`}
function econ(a){if(a==='stimulus'){if(G.funds<60)return toast('Brak środków');G.funds-=60;G.gdp+=2;G.unemployment=Math.max(2.5,G.unemployment-.3);G.inflation+=.25;G.popularity=clamp(G.popularity+1,0,100)}else if(a==='tax'){G.funds+=80;G.gdp+=.5;G.popularity=clamp(G.popularity-1,0,100)}else{G.funds+=70;G.gdp-=.7;G.inflation=Math.max(1,G.inflation-.3);G.popularity=clamp(G.popularity-2,0,100)}saveNews('💵 Wprowadzono zmianę polityki gospodarczej.');save();render()}
function vForeign(){return `<div class="grid">${C('','Relacje zagraniczne',`<div class="metric">${G.foreign}/100</div>${bar(G.foreign)}`)}${C('wide','Dyplomacja',`<div class="rowActions"><button class="btn primary" onclick="foreign('summit')">Szczyt</button><button class="btn" onclick="foreign('aid')">Pomoc — $35M</button><button class="btn danger" onclick="foreign('sanctions')">Sankcje</button></div>`)}${C('full','Panel strategiczny',stat('Sojusznicy',G.foreign+'/100')+stat('Wiarygodność',Math.round((G.foreign+G.popularity)/2)+'/100')+stat('Presja',Math.max(5,100-G.foreign)+'/100'))}</div>`}
function foreign(a){if(a==='aid'){if(G.funds<35)return toast('Brak środków');G.funds-=35;G.foreign=clamp(G.foreign+8,0,100)}else if(a==='summit')G.foreign=clamp(G.foreign+5,0,100);else{G.foreign=clamp(G.foreign-3,0,100);G.popularity=clamp(G.popularity+1,0,100)}saveNews('🌐 Działanie dyplomatyczne wykonane.');save();render()}
function vMilitary(){return `<div class="grid">${C('','Gotowość obronna',`<div class="metric">${G.defense}/100</div>${bar(G.defense)}`)}${C('','Budżet obronny',`<div class="metric">$180M</div>`)}${C('wide','Naczelny Dowódca',`<div class="rowActions"><button class="btn primary" onclick="military('modernize')">Modernizacja — $70M</button><button class="btn" onclick="military('ready')">Gotowość — $40M</button><button class="btn" onclick="military('diplomacy')">Redukcja napięć</button></div>`)}${C('half','Informacja strategiczna',stat('Gotowość',G.defense+'/100')+stat('Relacje',G.foreign+'/100'))}</div>`}
function military(a){const c=a==='modernize'?70:a==='ready'?40:0;if(c&&G.funds<c)return toast('Brak środków');G.funds-=c;if(a==='modernize')G.defense=clamp(G.defense+9,0,100);else if(a==='ready')G.defense=clamp(G.defense+5,0,100);else{G.defense=clamp(G.defense-2,0,100);G.foreign=clamp(G.foreign+5,0,100)}saveNews('🛡️ Zmieniono politykę obronną.');save();render()}
function vEvents(){return `<div class="grid">${C('wide','Wydarzenia i decyzje',newsHTML())}${C('','Kalendarz',stat('Data',`${G.day}.${G.month}.${G.year}`)+stat('Następne wybory prezydenckie',G.nextPresidential)+stat('Kongres',G.nextCongress))}${C('full','Automatyczny świat',`<p class="muted">Każdy dzień może przynieść zmianę gospodarki, nastrojów społecznych, Kongresu i polityki zagranicznej. Nie ma ręcznego przycisku „przejdź miesiąc” — czas działa sam.</p>`)}</div>`}
function vOval(){if(!G.oval.unlocked)return `<div class="lockedPanel"><div class="big">🔒</div><h2>Gabinet Owalny</h2><p class="muted">Pokój prezydenta zostanie odblokowany po zwycięstwie wyborczym.</p></div>`;return `<div class="grid">${C('full oval','🦅 Gabinet Owalny',`<div class="ovalGrid"><div><div class="eyebrow">The White House</div><div class="metric big">Prezydent USA</div><p class="muted">Najważniejsze decyzje państwa wykonujesz tutaj. To główny panel zarządzania po zwycięstwie.</p>${stat('Aprobata',pct(G.popularity))}${stat('Rozkazy wykonawcze',G.oval.orders)}${stat('Personel Białego Domu',G.oval.staff)}${stat('Program prezydenta',G.oval.agenda.length?'Aktywny':'Brak')}</div><div><h3>Centrum decyzji</h3><div class="rowActions"><button class="btn primary" onclick="ovalAction('order')">✍️ Rozkaz wykonawczy</button><button class="btn" onclick="ovalAction('staff')">👥 Zatrudnij personel — $15M</button><button class="btn" onclick="ovalAction('agenda')">📋 Ustal priorytet</button><button class="btn" onclick="ovalAction('press')">🎙️ Konferencja prasowa</button></div></div></div>`)}${C('half','Gabinet',stat('Szef personelu',G.oval.chief)+stat('Aprobata',G.oval.approvals+'/100'))}${C('half','Kongres',stat('Izba',houseControl())+stat('Senat',senateControl())+`<button class="btn" onclick="setPage('laws')">Przejdź do ustaw</button>`)}${C('wide','Priorytety prezydenta',G.oval.agenda.length?G.oval.agenda.map(x=>`<div class="list">${x}</div>`).join(''):'<div class="empty">Nie ustawiono jeszcze priorytetów.</div>')}${C('','Stan państwa',stat('PKB',G.gdp.toFixed(1))+stat('Inflacja',G.inflation.toFixed(1)+'%')+stat('Obrona',G.defense+'/100')+stat('Dyplomacja',G.foreign+'/100'))}</div>`}
function ovalAction(a){if(a==='order'){G.oval.orders++;G.popularity=clamp(G.popularity+1,0,100);saveNews('🦅 Podpisano nowy rozkaz wykonawczy.')}else if(a==='staff'){if(G.funds<15)return toast('Brak środków');G.funds-=15;G.oval.staff++;G.oval.chief=G.oval.staff>2?'Maya Thompson':'Szef personelu tymczasowy';saveNews('👥 Rozbudowano personel Białego Domu.')}else if(a==='agenda'){const arr=['Infrastruktura i miejsca pracy','Bezpieczeństwo granic','Technologie i AI','Reforma ochrony zdrowia','Energia i niezależność'];G.oval.agenda.unshift(arr[Math.floor(Math.random()*arr.length)]);G.oval.agenda=G.oval.agenda.slice(0,5);saveNews('📋 Ustalono nowy priorytet prezydenta.')}else{G.popularity=clamp(G.popularity+2,0,100);saveNews('🎙️ Konferencja prasowa poprawiła nastroje.')}G.oval.approvals=clamp(Math.round(G.popularity),0,100);save();render()}
function render(){renderNav();document.getElementById('pageTitle').textContent=PAGE_TITLES[G.page]||PAGE_TITLES.overview;const f={overview:vOverview,election:vElection,congress:vCongress,laws:vLaws,states:vStates,economy:vEconomy,foreign:vForeign,military:vMilitary,events:vEvents,markets:vMarkets,oval:vOval};document.getElementById('content').innerHTML=(f[G.page]||vOverview)();updateClock();setTimeout(initVisibleMaps,30)}

function advanceEconomy(){G.gdp+=.04-(G.inflation>5?.05:0);G.unemployment=clamp(G.unemployment+(Math.random()-.5)*.05,2.5,10);G.inflation=clamp(G.inflation+(Math.random()-.5)*.04,1,9);if(Math.random()<.08)saveNews('📰 Nowe wydarzenie wpłynęło na nastroje w kraju.')}
function tick(){G.minute+=60;if(G.minute>=60){G.minute=0;G.hour++}if(G.hour>=24){G.hour=0;G.day++;dailyTick()}if(G.day>daysInMonth(G.year,G.month)){G.day=1;G.month++;if(G.month>12){G.month=1;G.year++}}updateClock();save();}
function daysInMonth(y,m){return new Date(y,m,0).getDate()}
function dailyTick(){advanceEconomy();if(G.election?.active&&G.election.phase==='campaign'){G.election.day++;if(G.election.day>G.election.totalDays){startElectionNight()}render();return}if(G.election?.phase==='electionNight')return;if(G.congressCampaign?.active&&G.congressCampaign.phase==='campaign'){G.congressCampaign.day++;if(G.congressCampaign.day>G.congressCampaign.totalDays)finishCongress();render();return}if(G.president&&G.year>=G.nextCongress&&G.month===1&&!G.congressCampaign){startCongressCampaign();return}if(G.president&&G.year>=G.nextPresidential&&G.month===1&&!G.election.active){G.election={active:true,type:'presidential',day:1,totalDays:30,phase:'campaign',results:{},called:[],winner:null};G.election.active=true;saveNews('🗳️ Rozpoczęła się kolejna kampania prezydencka.');render();return}if(Math.random()<.03)G.popularity=clamp(G.popularity+(Math.random()-.45)*2,0,100)}
setInterval(()=>{if(G.election?.phase==='electionNight')return;tick()},1000);
setInterval(()=>{if(G.election?.phase==='electionNight'&&G.election.called.length<STATES.length)callNextState()},1800);
setInterval(()=>{if(G.election?.phase==='electionNight'&&G.election.called.length>=STATES.length)finishPresidentialElection()},4000);

render();

function ensureDiplomacy(){
 if(!G.diplomacy)G.diplomacy={selected:COUNTRIES[0],countries:{},orgs:{},embargoes:[]};
 G.diplomacy.selected=COUNTRIES.includes(G.diplomacy.selected)?G.diplomacy.selected:COUNTRIES[0];
 if(!G.diplomacy.countries)G.diplomacy.countries={};
 COUNTRIES.forEach(c=>{if(!G.diplomacy.countries[c])G.diplomacy.countries[c]={relation:40+Math.random()*25,embassy:0,trade:45+Math.random()*25,trust:40+Math.random()*30};});
 if(!G.diplomacy.orgs)G.diplomacy.orgs={};
 ORGS.forEach(o=>{if(!G.diplomacy.orgs[o[0]])G.diplomacy.orgs[o[0]]={relation:50+Math.random()*20,membership:['NATO','G7','G20','WTO','MFW','Bank Światowy','WHO','OECD'].includes(o[0])?'Członek':'Partner'};});
 if(!Array.isArray(G.diplomacy.embargoes))G.diplomacy.embargoes=[];
}
function selectCountry(c){ensureDiplomacy();G.diplomacy.selected=c;save();render()}
function buildEmbassy(c){c=decodeURIComponent(c);ensureDiplomacy();const d=G.diplomacy.countries[c];if(!d)return;if(G.funds<25)return toast('Brak środków na ambasadę');if(d.embassy>=3)return toast('Ambasada ma już maksymalny poziom 3');G.funds-=25;d.embassy++;d.relation=clamp(d.relation+4,0,100);d.trust=clamp(d.trust+3,0,100);saveNews(`🏛️ Rozbudowano ambasadę USA w ${c} do poziomu ${d.embassy}.`);save();render()}
function removeEmbassy(c){c=decodeURIComponent(c);ensureDiplomacy();const d=G.diplomacy.countries[c];if(!d||!d.embassy)return toast('W tym państwie nie ma ambasady USA');d.embassy=0;d.relation=clamp(d.relation-5,0,100);d.trust=clamp(d.trust-3,0,100);saveNews(`🗑️ Zamknięto ambasadę USA w ${c}.`);save();render()}
function diplomacyAction(c,a){c=decodeURIComponent(c);ensureDiplomacy();const d=G.diplomacy.countries[c];if(!d)return;if(a==='summit'){d.relation=clamp(d.relation+4,0,100);d.trust=clamp(d.trust+5,0,100);G.foreign=clamp(G.foreign+2,0,100)}else if(a==='trade'){d.trade=clamp(d.trade+8,0,100);d.relation=clamp(d.relation+2,0,100);G.funds+=20}else if(a==='aid'){if(G.funds<40)return toast('Brak środków');G.funds-=40;d.relation=clamp(d.relation+7,0,100);d.trust=clamp(d.trust+5,0,100)}else if(a==='security'){d.trust=clamp(d.trust+6,0,100);d.relation=clamp(d.relation+3,0,100);G.defense=clamp(G.defense+1,0,100)}else if(a==='visit'){d.relation=clamp(d.relation+3,0,100);d.trust=clamp(d.trust+4,0,100)}saveNews(`🌐 Wykonano działanie dyplomatyczne wobec ${c}.`);save();render()}

function applyEmbargo(c){c=decodeURIComponent(c);ensureDiplomacy();const scope=document.getElementById('embargoScope')?.value,level=document.getElementById('embargoLevel')?.value;const targets=[...document.querySelectorAll('input[name="embTarget"]:checked')].map(x=>EMBARGO_TARGETS[+x.value]);if(scope!=='full'&&!targets.length)return toast('Wybierz przynajmniej jeden sektor');const d=G.diplomacy.countries[c];if(!d)return;const penalty=level==='Maksymalne'?12:level==='Surowe'?8:level==='Średnie'?5:3;d.relation=clamp(d.relation-penalty,0,100);d.trade=clamp(d.trade-(scope==='full'?40:penalty*2),0,100);G.foreign=clamp(G.foreign+1,0,100);G.diplomacy.embargoes.push({country:c,targets:scope==='full'?['Cały handel']:targets,scope,level,reason:(document.getElementById('embargoReason')?.value||'').trim(),date:`${G.day}.${G.month}.${G.year}`});saveNews(`🚫 Nałożono ${level.toLowerCase()} embargo na ${c}.`);closeModal();save();render()}

      ${C('full','Rejestr ustaw',G.laws.length?`<div class="tablewrap"><table><thead><tr><th>Ustawa</th><th>Zakres</th><th>Komisja</th><th>Izba</th><th>Senat</th><th>Status</th><th>Decyzja</th></tr></thead><tbody>${G.laws.slice().reverse().map((l,ri)=>{const i=G.laws.length-1-ri;const pending=l.status==='Do decyzji prezydenta';const signed=l.status.startsWith('Podpisana');const rejected=l.status.includes('Odrzucona')||l.status==='Zawetowana';return `<tr><td><b>${escLaw(l.name)}</b><br><span class="muted">${escLaw(l.desc)}</span>${signed&&l.signedBy?`<br><span class="muted">Podpis: ${escLaw(l.signedBy)}</span>`:''}</td><td>${lawScopeLabel(l)}</td><td>${escLaw(l.committee)}</td><td>${l.houseVotes}/435</td><td>${l.senateVotes}/100</td><td><span class="badge ${signed?'g':rejected?'r':'y'}">${escLaw(l.status)}</span></td><td>${pending&&G.president?`<button class="btn green" onclick="signLaw(${i})">✍️ Podpisz</button> <button class="btn danger" onclick="vetoLaw(${i})">🛑 Weto</button>`:pending?'⏳ Czeka na prezydenta':signed?'✅ Obowiązuje':'—'}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Brak projektów ustaw.</div>')}
      ${C('full','Jak działa ustawa',`<div class="notice">1️⃣ Tworzysz projekt i wybierasz <b>stan</b> albo <b>wszystkie stany</b>.<br>2️⃣ Projekt jest głosowany w Izbie i Senacie.<br>3️⃣ Jeśli przejdzie obie izby, status zmienia się na <b>Do decyzji prezydenta</b>.<br>4️⃣ Jeśli jesteś prezydentem, pojawiają się przyciski <b>Podpisz</b> i <b>Weto</b>.<br>5️⃣ Po podpisie ustawa zostaje oznaczona jako obowiązująca i przypisana do wybranego stanu albo wszystkich 50 stanów.</div>`)}
      ${C('full','Poprawki do Konstytucji',`${G.amendments.length?G.amendments.slice().reverse().map((a,ri)=>{const i=G.amendments.length-1-ri;return `<div class="list"><b>${escLaw(a.name)}</b><div class="muted">${escLaw(a.text)}</div>${stat('Izba',a.houseVotes+'/435')}${stat('Senat',a.senateVotes+'/100')}${stat('Stany',a.statesYes+'/50')}${stat('Status',a.status)}</div>`}).join(''):'<div class="empty">Brak poprawek.</div>'}<div class="rowActions"><button class="btn primary" onclick="amendmentModal()">⚖️ Zaproponuj poprawkę</button></div>`)}
    </div>`;
  };

  // Stare zapisane ustawy dostają bezpieczne wartości domyślne.
  (G.laws||[]).forEach(l=>{
    if(!l.scope)l.scope='all';
    if(l.scope==='state'&&!l.scopeState)l.scopeState='AL';
    if(typeof l.effectSupport!=='number')l.effectSupport=0;
    if(l.status==='Do podpisu')l.status='Do decyzji prezydenta';
  });
})();

/* ===== V10: LOCKS + FEDERAL LAW SCOPE / PRESIDENTIAL SIGNATURE ===== */
const LOCKED_AFTER_WIN=['economy','foreign','military'];
function isLockedPage(p){return LOCKED_AFTER_WIN.includes(p)&&!G.president}
function setPage(p){
  if(p==='oval'&&!G.oval.unlocked){toast('Gabinet Owalny odblokuje się po wygraniu wyborów.');return}
  if(isLockedPage(p)){toast('Ta sekcja odblokuje się po wygraniu wyborów prezydenckich.');return}
  G.page=p;save();render()
}
function renderNav(){
  document.getElementById('nav').innerHTML=NAV.map(([id,label,icon])=>{
    const lock=(id==='oval'&&!G.oval.unlocked)||isLockedPage(id);
    return `<button class="${G.page===id?'active':''} ${lock?'locked':''}" onclick="setPage('${id}')">${icon} ${label}${lock?' 🔒':''}</button>`
  }).join('')
}

function lawScopeLabel(l){
  if(!l.scopeType||l.scopeType==='all')return 'Wszystkie stany';
  const st=STATES.find(x=>x[1]===l.scopeState);
  return st?`Tylko ${st[0]} (${st[1]})`:'Wybrany stan';
}
function lawStatusClass(status){
  if(status==='Podpisana'||status==='Obowiązuje')return 'g';
  if(status.includes('Odrzucona')||status==='Zawetowana')return 'r';
  if(status==='Do podpisu')return 'y';
  return 'b';
}
function vLaws(){
  return `<div class="grid">
    ${C('wide','Ustawy federalne — proces legislacyjny',`<p class="muted">Projekt ustawy przechodzi przez Kongres. Po przyjęciu przez Izbę i Senat trafia do prezydenta. Gdy jesteś prezydentem, to Ty decydujesz: <b>podpisujesz</b> albo <b>wetujesz</b>.</p><button class="btn primary" onclick="lawModal()">✍️ Napisz projekt ustawy</button>`)}
    ${C('','Wymogi',stat('Izba','218 / 435')+stat('Senat','51 / 100')+stat('Prezydent',G.president?'Ty — podpis / weto':'Obecny prezydent'))}
    ${C('full','Rejestr ustaw',G.laws.length?`<div class="tablewrap"><table><thead><tr><th>Ustawa</th><th>Zakres</th><th>Komisja</th><th>Izba</th><th>Senat</th><th>Status</th><th>Decyzja</th></tr></thead><tbody>${G.laws.slice().reverse().map((l,ri)=>{
      const i=G.laws.length-1-ri;
      const canDecide=l.status==='Do podpisu'&&G.president;
      return `<tr><td><b>${l.name}</b><br><span class="muted">${l.desc||''}</span></td><td><span class="badge b">${lawScopeLabel(l)}</span></td><td>${l.committee}</td><td>${l.houseVotes}/435</td><td>${l.senateVotes}/100</td><td><span class="badge ${lawStatusClass(l.status)}">${l.status}</span></td><td>${canDecide?`<div class="rowActions"><button class="btn green" onclick="signLaw(${i})">✍️ Podpisz</button><button class="btn danger" onclick="vetoLaw(${i})">🛑 Weto</button></div>`:(l.status==='Do podpisu'?'⏳ Oczekuje na decyzję prezydenta':'—')}</td></tr>`
    }).join('')}</tbody></table></div>`:'<div class="empty">Brak projektów ustaw.</div>')}
    ${C('full','Poprawki do Konstytucji',`${G.amendments.length?G.amendments.slice().reverse().map((a,ri)=>{const i=G.amendments.length-1-ri;return `<div class="list"><b>${a.name}</b><div class="muted">${a.text}</div>${stat('Izba',a.houseVotes+'/435')}${stat('Senat',a.senateVotes+'/100')}${stat('Stany',a.statesYes+'/50')}${stat('Status',a.status)}</div>`}).join(''):'<div class="empty">Brak poprawek.</div>'}<div class="rowActions"><button class="btn primary" onclick="amendmentModal()">⚖️ Zaproponuj poprawkę</button></div>`)}
  </div>`
}

function lawModal(){
  const stateOptions=STATES.map(s=>`<option value="${s[1]}">${s[0]} (${s[1]})</option>`).join('');
  openModal(`<h2>📜 Nowy projekt ustawy</h2>
    <label>Nazwa</label><input id="lawName" value="Ustawa o modernizacji infrastruktury">
    <label>Komisja</label><select id="lawCommittee"><option>Finanse i budżet</option><option>Gospodarka</option><option>Zdrowie</option><option>Obrona</option><option>Technologie</option><option>Sprawy zagraniczne</option><option>Rolnictwo</option><option>Edukacja</option></select>
    <label>Opis</label><textarea id="lawDesc">Projekt ustawy federalnej.</textarea>
    <label>Gdzie ustawa ma obowiązywać?</label>
    <select id="lawScope" onchange="toggleLawState()"><option value="all">🇺🇸 Wszystkie stany</option><option value="state">📍 Tylko wybrany stan</option></select>
    <div id="lawStateWrap" style="display:none"><label>Wybierz stan</label><select id="lawState">${stateOptions}</select></div>
    <label>Koszt budżetowy (mln $)</label><input id="lawCost" type="number" min="0" value="40">
    <button class="btn primary" onclick="submitLaw()">Przeprowadź przez Kongres</button>`)
}
function toggleLawState(){
  const el=document.getElementById('lawStateWrap');
  const scope=document.getElementById('lawScope');
  if(el&&scope)el.style.display=scope.value==='state'?'block':'none';
}
function submitLaw(){
  const name=document.getElementById('lawName').value.trim()||'Nowa ustawa';
  const committee=document.getElementById('lawCommittee').value;
  const desc=document.getElementById('lawDesc').value.trim()||'Projekt ustawy federalnej.';
  const cost=Math.max(0,+document.getElementById('lawCost').value||0);
  const scopeType=document.getElementById('lawScope').value;
  const scopeState=scopeType==='state'?document.getElementById('lawState').value:null;
  let house=Math.round(G.houseD+G.houseI+G.houseR*(G.popularity/100)*.65+Math.random()*16-8);
  let senate=Math.round(G.senateD+G.senateI+G.senateR*(G.popularity/100)*.65+Math.random()*7-3);
  house=clamp(house,0,435); senate=clamp(senate,0,100);
  let status;
  if(house<218)status='Odrzucona przez Izbę';
  else if(senate<51)status='Odrzucona przez Senat';
  else status='Do podpisu';
  G.laws.push({name,committee,desc,cost,scopeType,scopeState,houseVotes:house,senateVotes:senate,status,created:`${G.day}.${G.month}.${G.year}`});
  saveNews(status==='Do podpisu'?`📜 Ustawa „${name}” przeszła Kongres i trafiła do prezydenta.`:`📜 Ustawa „${name}” została odrzucona: ${status}.`);
  closeModal();save();render()
}
function signLaw(i){
  const l=G.laws[i];
  if(!l||l.status!=='Do podpisu')return;
  if(!G.president)return toast('Nie jesteś prezydentem — ustawa czeka na decyzję urzędującego prezydenta.');
  if(l.cost>G.funds)return toast('Brak środków na realizację ustawy');
  G.funds-=l.cost;
  l.status='Podpisana';
  l.enactedAt=`${G.day}.${G.month}.${G.year}`;
  G.gdp+=l.cost*.012;
  G.popularity=clamp(G.popularity+(l.cost?1:.3),0,100);
  saveNews(`✍️ Jako Prezydent podpisałeś ustawę „${l.name}”. Obowiązuje: ${lawScopeLabel(l)}.`);
  save();render()
}
function vetoLaw(i){
  const l=G.laws[i];
  if(!l||l.status!=='Do podpisu')return;
  if(!G.president)return toast('Nie jesteś prezydentem.');
  l.status='Zawetowana';
  l.vetoedAt=`${G.day}.${G.month}.${G.year}`;
  G.popularity=clamp(G.popularity-.5,0,100);
  saveNews(`🛑 Jako Prezydent zawetowałeś ustawę „${l.name}”.`);
  save();render()
}

function vEconomy(){
  if(!G.president)return `<div class="grid">${C('full','🔒 Gospodarka zablokowana',`<div class="lockedPanel"><div class="big">🔒</div><h2>Gospodarka federalna</h2><p class="muted">Gospodarka odblokuje się po wygraniu wyborów prezydenckich.</p><button class="btn primary" onclick="setPage('election')">Przejdź do wyborów</button></div>`)}</div>`;
  return `<div class="grid">${C('','PKB',`<div class="metric">${G.gdp.toFixed(1)}</div>`)}${C('','Inflacja',`<div class="metric">${G.inflation.toFixed(1)}%</div>`)}${C('','Bezrobocie',`<div class="metric">${G.unemployment.toFixed(1)}%</div>`)}${C('wide','Polityka gospodarcza',`<div class="rowActions"><button class="btn primary" onclick="econ('stimulus')">Infrastruktura — $60M</button><button class="btn" onclick="econ('tax')">Reforma podatkowa</button><button class="btn" onclick="econ('austerity')">Oszczędności</button></div>`)}${C('half','Wskaźniki',stat('PKB',G.gdp.toFixed(1))+stat('Inflacja',G.inflation.toFixed(1)+'%')+stat('Bezrobocie',G.unemployment.toFixed(1)+'%'))}</div>`
}
function vForeign(){
  if(!G.president)return `<div class="grid">${C('full','🔒 Dyplomacja zablokowana',`<div class="lockedPanel"><div class="big">🔒</div><h2>Polityka zagraniczna</h2><p class="muted">Dyplomacja odblokuje się po wygraniu wyborów prezydenckich.</p><button class="btn primary" onclick="setPage('election')">Przejdź do wyborów</button></div>`)}</div>`;
  return typeof renderDiplomacyPage==='function'?renderDiplomacyPage():`<div class="grid">${C('','Relacje zagraniczne',`<div class="metric">${G.foreign}/100</div>${bar(G.foreign)}`)}${C('wide','Dyplomacja',`<div class="rowActions"><button class="btn primary" onclick="foreign('summit')">Szczyt</button><button class="btn" onclick="foreign('aid')">Pomoc — $35M</button><button class="btn danger" onclick="foreign('sanctions')">Sankcje</button></div>`)}</div>`
}
function vMilitary(){
  if(!G.president)return `<div class="grid">${C('full','🔒 Obrona zablokowana',`<div class="lockedPanel"><div class="big">🔒</div><h2>Departament Obrony</h2><p class="muted">System obronny odblokuje się po wygraniu wyborów prezydenckich.</p><button class="btn primary" onclick="setPage('election')">Przejdź do wyborów</button></div>`)}</div>`;
  return `<div class="grid">${C('','Gotowość obronna',`<div class="metric">${G.defense}/100</div>${bar(G.defense)}`)}${C('','Budżet obronny',`<div class="metric">$180M</div>`)}${C('wide','Naczelny Dowódca',`<div class="rowActions"><button class="btn primary" onclick="military('modernize')">Modernizacja — $70M</button><button class="btn" onclick="military('ready')">Gotowość — $40M</button><button class="btn" onclick="military('diplomacy')">Redukcja napięć</button></div>`)}${C('half','Informacja strategiczna',stat('Gotowość',G.defense+'/100')+stat('Relacje',G.foreign+'/100'))}</div>`
}

/* Fix old saves: preserve funds and add lock state safely. */
if(typeof G.funds!=='number')G.funds=typeof G.cash==='number'?G.cash:850;
if(typeof G.cash!=='number')G.cash=G.funds;
if(!G.president){G.oval.unlocked=false}
save();
render();

</script></body></html>

<!-- ===== v11: dynamic electoral college, AI state swings, 5-year election cycles, rotating candidates ===== -->
<script>
(function(){
  const CANDIDATE_POOL={
    red:[
      ['James Walker','Laura Bennett'],['Michael Carter','Emily Brooks'],['Daniel Mitchell','Sarah Collins'],
      ['Robert Hayes','Amanda Reed'],['Thomas Parker','Olivia Morgan'],['William Foster','Rachel Cooper'],
      ['Andrew Sullivan','Jessica Turner'],['Christopher Bennett','Megan Ross']
    ],
    purple:[
      ['Ethan Morgan','Sofia Hayes'],['Alexander Reed','Maya Brooks'],['Nathan Cooper','Emma Parker'],
      ['Samuel Turner','Chloe Bennett'],['Benjamin Ross','Ava Mitchell'],['Lucas Collins','Grace Foster']
    ]
  };

  function ensureElectionData(){
    if(!G.candidates)G.candidates={blue:{name:G.candidate||'Twój kandydat',vice:G.vice||'Nie wybrano'},red:{name:'James Walker',vice:'Laura Bennett'},purple:{name:'Ethan Morgan',vice:'Sofia Hayes'}};
    if(!G.candidates.red)G.candidates.red={name:'James Walker',vice:'Laura Bennett'};
    if(!G.candidates.purple)G.candidates.purple={name:'Ethan Morgan',vice:'Sofia Hayes'};
    if(typeof G.nextPresidential!=='number')G.nextPresidential=G.year+5;
    if(typeof G.nextCongress!=='number')G.nextCongress=G.year+5;
    if(!G.election)G.election={active:false,type:'presidential',day:0,totalDays:30,phase:'results',results:{},called:[],winner:null};
  }
  ensureElectionData();

  function newCandidates(){
    const r=CANDIDATE_POOL.red[Math.floor(Math.random()*CANDIDATE_POOL.red.length)];
    const p=CANDIDATE_POOL.purple[Math.floor(Math.random()*CANDIDATE_POOL.purple.length)];
    G.candidates.red={name:r[0],vice:r[1]};
    G.candidates.purple={name:p[0],vice:p[1]};
    G.candidates.blue={name:G.candidate||'Twój kandydat',vice:G.vice&&G.vice!=='Nie wybrano'?G.vice:'Kandydat na wiceprezydenta'};
  }

  function electoralTotals(){
    let blue=0,red=0,purple=0,called=0;
    STATES.forEach(s=>{
      const x=G.states[s[1]];
      if(x?.called==='blue')blue+=s[2],called+=s[2];
      else if(x?.called==='red')red+=s[2],called+=s[2];
      else if(x?.called==='purple')purple+=s[2],called+=s[2];
    });
    return {blue,red,purple,called,remaining:538-called};
  }

  function projectedTotals(){
    let blue=0,red=0,purple=0;
    STATES.forEach(s=>{
      const x=G.states[s[1]];
      if(x?.called==='blue')blue+=s[2];
      else if(x?.called==='red')red+=s[2];
      else if(x?.called==='purple')purple+=s[2];
      else {
        const u=x?.support||0,r=x?.red||50,p=x?.purple||5;
        if(u>=r&&u>=p)blue+=s[2]; else if(r>=p)red+=s[2]; else purple+=s[2];
      }
    });
    return {blue,red,purple};
  }

  function electoralBar(title='Kolegium Elektorskie'){
    const actual=electoralTotals();
    const projected=(G.election?.phase==='campaign')?projectedTotals():actual;
    const b=projected.blue/538*100,r=projected.red/538*100,p=projected.purple/538*100;
    const projectedLabel=G.election?.phase==='campaign'?'prognoza na podstawie aktualnego poparcia':`${actual.called} / 538 rozstrzygniętych`;
    return `<div class="electoralBox"><div class="electoralHead"><b>${title}</b><span>${projectedLabel} • 270 do zwycięstwa</span></div><div class="evTrack"><i class="evBlue" style="width:${b}%"></i><i class="evRed" style="width:${r}%"></i><i class="evPurple" style="width:${p}%"></i></div><div class="evLegend"><span>🔵 ${G.candidates?.blue?.name||'Ty'} <b>${projected.blue}</b></span><span>🔴 ${G.candidates?.red?.name||'Rywal'} <b>${projected.red}</b></span><span>🟣 ${G.candidates?.purple?.name||'Niezależni'} <b>${projected.purple}</b></span><span>⚪ Nierozstrzygnięte <b>${actual.remaining}</b></span></div></div>`;
  }

  function stateLead(s){
    const x=G.states[s[1]],u=x?.support||0,r=x?.red||50,p=x?.purple||5;
    return u>=r&&u>=p?'blue':r>=p?'red':'purple';
  }

  function aiCampaignDay(){
    if(!G.election?.active||G.election.phase!=='campaign')return;
    const swings=STATES.filter(s=>!G.states[s[1]].called).sort((a,b)=>{
      const aa=Math.abs((G.states[a[1]].support||0)-(G.states[a[1]].red||50));
      const bb=Math.abs((G.states[b[1]].support||0)-(G.states[b[1]].red||50));
      return aa-bb;
    });
    const count=Math.random()<.45?1:2;
    for(let i=0;i<count;i++){
      const s=swings[Math.floor(Math.random()*Math.min(swings.length,14))]; if(!s)continue;
      const x=G.states[s[1]];
      const intensity=.45+Math.random()*1.15;
      x.red=clamp((x.red||50)+intensity,0,85);
      x.support=clamp((x.support||0)-intensity*.72,0,85);
      if(Math.random()<.28)x.purple=clamp((x.purple||5)+.2,0,40);
      if(Math.random()<.18)saveNews(`🔴 Rywal prowadzi intensywną kampanię w ${s[0]} i próbuje odebrać Ci stan.`);
    }
  }

  function startPresidentialCycle(){
    newCandidates();
    G.election={active:true,type:'presidential',day:1,totalDays:30,phase:'campaign',results:{},called:[],winner:null};
    G.presidentialCycle=G.year;
    G.popularity=clamp(G.popularity+(.5-Math.random()),0,100);
    STATES.forEach(s=>{
      const x=G.states[s[1]];
      x.called=null;
      x.support=clamp((x.support||0)+Math.random()*3,0,80);
      x.red=clamp((x.red||50)+(Math.random()*3-1.2),25,80);
      x.purple=clamp((x.purple||5)+(Math.random()*1.5-.4),2,30);
    });
    saveNews(`🗳️ Nowe wybory prezydenckie! Kandydaci: ${G.candidates.blue.name}, ${G.candidates.red.name}, ${G.candidates.purple.name}.`);
    save();render();
  }

  function startCongressCycle(){
    G.congressCampaign={active:true,day:1,totalDays:20,phase:'campaign',results:null};
    G.congressCycle=G.year;
    saveNews('🏛️ Rozpoczęły się nowe wybory do Kongresu. Ten cykl działa niezależnie od wyborów prezydenckich.');
    save();render();
  }

  window.vElection=function(){
    ensureElectionData();
    if(G.election.phase==='results'){
      const t=electoralTotals();
      return `<div class="grid">${C('wide',G.election.winner==='blue'?'🎉 Biały Dom zdobyty':'🗳️ Wyniki wyborów',`${electoralBar('Ostateczny wynik Kolegium Elektorskiego')}<div class="resultBanner ${G.election.winner==='blue'?'':'lose'}"><div class="metric">${t.blue} / 538 EV</div><p>${G.election.winner==='blue'?'Wygrałeś wybory.':'Wybory wygrał inny kandydat.'}</p><p class="muted">Następne wybory prezydenckie: <b>${G.nextPresidential}</b> — 5 lat po zakończeniu poprzednich.</p></div>`)}${C('','Kandydaci',stat('🔵 Twój kandydat',G.candidates.blue.name)+stat('🔴 Rywal',G.candidates.red.name)+stat('🟣 Niezależni',G.candidates.purple.name))}${C('','Kadencja wyborcza',stat('Zakończone wybory',G.presidentialCycle||G.year)+stat('Następne wybory',G.nextPresidential)+stat('Próg','270 EV'))}${C('full','Mapa wyników',mapHTML('electionResultsMap','presidential'))}</div>`;
    }
    const p=projectedTotals();

/* ===== V14: stronger opponent state campaign ===== */
(function(){
  window.aiCampaignDay=function(){
    if(!G.election?.active || G.election.phase!=='campaign') return;
    const candidates=STATES.filter(st=>!G.states[st[1]].called).map(st=>{
      const x=G.states[st[1]];
      const gap=(x.support||0)-(x.red||50);
      return {st,x,score:Math.abs(gap)+(st[2]/20)};
    }).sort((a,b)=>b.score-a.score);
    const count=Math.random()<.75?2:3;
    for(let i=0;i<count;i++){
      const pick=candidates[Math.floor(Math.random()*Math.min(candidates.length,18))];
      if(!pick) continue;
      const {st,x}=pick;
      const swing=.8+Math.random()*1.8;
      x.red=clamp((x.red||0)+swing,0,85);
      x.support=clamp((x.support||0)-swing*.62,0,85);
      if(Math.random()<.22){
        const bonus=.8+Math.random()*1.4;
        x.red=clamp(x.red+bonus,0,90);
        x.support=clamp(x.support-bonus*.55,0,90);
      }
      if(Math.random()<.12) saveNews(`🔴 ${G.candidates.red.name} zwiększył poparcie w ${st[0]} o ok. ${swing.toFixed(1)} pkt.`);
    }
  };

  window.dailyTick=function(){
    advanceEconomy();
    if(G.election?.active&&G.election.phase==='campaign'){
      window.aiCampaignDay();
      G.election.day++;
      if(G.election.day>G.election.totalDays) startElectionNight();
    }
    if(G.congressCampaign?.active&&G.congressCampaign.phase==='campaign'){
      G.congressCampaign.day++;
      if(G.congressCampaign.day>G.congressCampaign.totalDays) finishCongress();
    }
    if(!G.congressCampaign?.active&&G.year>=G.nextCongress&&G.month===1&&!G.election?.active) startCongressCycle();
    if(!G.election?.active&&G.year>=G.nextPresidential&&G.month===1) startPresidentialCycle();
    if(Math.random()<.03) G.popularity=clamp(G.popularity+(Math.random()-.45)*2,0,100);
    save(); render();
  };
})();

function generateAutomaticLaw(){
  if(!G.laws)G.laws=[];
  const d=AUTO_LAW_NAMES[Math.floor(Math.random()*AUTO_LAW_NAMES.length)];
  const all=Math.random()<.72;
  const scopeState=all?null:STATES[Math.floor(Math.random()*STATES.length)][1];
  const cost=[20,30,40,50,70,90,120][Math.floor(Math.random()*7)];
  const house=Math.round(clamp(G.houseD+G.houseI+G.houseR*(.35+G.popularity/250)+Math.random()*18-9,0,435));
  const senate=Math.round(clamp(G.senateD+G.senateI+G.senateR*(.35+G.popularity/250)+Math.random()*8-4,0,100));
  let status='Projekt w Kongresie';
  if(house>=218 && senate>=51) status=G.president?'Do podpisu':'Oczekuje na decyzję prezydenta';
  else if(house<218) status='Odrzucona przez Izbę';
  else status='Odrzucona przez Senat';
  const law={name:d[0],committee:d[1],desc:d[2],cost,scopeType:all?'all':'state',scopeState,houseVotes:house,senateVotes:senate,status,created:`${G.day}.${G.month}.${G.year}`,automatic:true};
  G.laws.push(law);
  if(G.laws.length>60)G.laws.splice(0,G.laws.length-60);
  saveNews(`📜 Nowy projekt ustawy trafił do Kongresu: „${law.name}” (${lawScopeLabel(law)}).`);
}

  window.generateWorldEvent=function(){ensureV17();const e={...WORLD_EVENTS[Math.floor(Math.random()*WORLD_EVENTS.length)]};e.id=Date.now()+Math.random();e.date=`${G.day}.${G.month}.${G.year}`;e.resolved=false;e.impact=e.delta;G.worldEvents.unshift(e);if(G.worldEvents.length>30)G.worldEvents.pop();
    if(e.type==='oil'){G.markets.oil=clamp(G.markets.oil+e.delta,35,180);G.inflation=clamp(G.inflation+.45,0.5,15)}
    if(e.type==='energy'){G.markets.electricity=clamp(G.markets.electricity+e.delta,50,300);G.inflation=clamp(G.inflation+.6,0.5,15)}
    if(e.type==='food'){G.markets.food=clamp(G.markets.food+e.delta,60,220);G.inflation=clamp(G.inflation+.5,0.5,15)}
    if(e.type==='tech')G.gdp+=.8;
    if(e.type==='war'){G.defense=clamp(G.defense+1,0,100);G.foreign=clamp(G.foreign-2,0,100)}
    saveNews(`🌍 ${e.title}: ${e.desc}`);save();
  };
  window.resolveWorldEvent=function(i,choice){ensureV17();const e=G.worldEvents[i];if(!e||e.resolved)return;let msg='';if(choice==='aid'){if(G.funds<50)return toast('Brak $50M');G.funds-=50;G.foreign=clamp(G.foreign+4,0,100);G.popularity=clamp(G.popularity+1,0,100);msg='Pomoc humanitarna';}else if(choice==='diplomacy'){G.foreign=clamp(G.foreign+5,0,100);G.inflation=clamp(G.inflation-.12,0.5,15);msg='Inicjatywa dyplomatyczna';}else if(choice==='market'){G.funds-=30;G.inflation=clamp(G.inflation-.25,0.5,15);msg='Stabilizacja rynku';}else{G.defense=clamp(G.defense+3,0,100);G.foreign=clamp(G.foreign-1,0,100);msg='Wzmocnienie bezpieczeństwa';}e.resolved=true;e.response=msg;saveNews(`🇺🇸 Reakcja USA na „${e.title}”: ${msg}.`);save();render()};
  window.vEvents=function(){ensureV17();return `<div class="grid">${C('wide','🌍 Wydarzenia na świecie',`<p class="muted">Świat żyje własnym rytmem. Wydarzenia losowo zmieniają ceny, inflację, PKB i relacje. Możesz na nie reagować.</p>`)}${C('full','Bieżące kryzysy i okazje',G.worldEvents.length?G.worldEvents.map((e,i)=>`<div class="list"><div class="sectionTitle"><b>${e.title}</b><small>${e.date}</small></div><div class="muted">${e.desc}</div>${e.resolved?`<span class="badge g">Reakcja: ${e.response}</span>`:`<div class="rowActions"><button class="btn" onclick="resolveWorldEvent(${i},'aid')">💰 Pomoc — $50M</button><button class="btn" onclick="resolveWorldEvent(${i},'diplomacy')">🤝 Dyplomacja</button><button class="btn" onclick="resolveWorldEvent(${i},'market')">📈 Stabilizuj rynek</button><button class="btn danger" onclick="resolveWorldEvent(${i},'security')">🛡️ Bezpieczeństwo</button></div>`}</div>`).join(''):'<div class="empty">Brak nowych wydarzeń.</div>')}</div>`}

  /* ---------- GABINET OWALNY ---------- */
  window.ovalAction=function(type){ensureV17();
    if(type==='order'){if(!G.president)return toast('Gabinet jest dostępny tylko dla prezydenta');G.oval.orders++;G.oval.approvals=clamp(G.oval.approvals+1,0,100);G.popularity=clamp(G.popularity+.4,0,100);saveNews('🦅 Wydano rozkaz wykonawczy z Gabinetu Owalnego.');}
    else if(type==='staff'){if(G.funds<15)return toast('Brak środków');G.funds-=15;G.oval.staff++;G.oval.approvals=clamp(G.oval.approvals+1,0,100);saveNews('👥 Rozbudowano personel Białego Domu.');}
    else if(type==='agenda'){openModal(`<h2>📋 Strategia prezydenta</h2><label>Priorytet</label><select id="agendaSel"><option>Gospodarka i miejsca pracy</option><option>Walka z inflacją</option><option>Bezpieczeństwo narodowe</option><option>Dyplomacja</option><option>Energia</option><option>Technologie i AI</option><option>Zdrowie publiczne</option><option>Infrastruktura</option></select><label>Cel na najbliższe 12 miesięcy</label><textarea id="agendaText">Realizacja najważniejszego priorytetu administracji.</textarea><button class="btn primary" onclick="setOvalAgenda()">Ustal strategię</button>`);return}
    else if(type==='press'){G.oval.press++;G.popularity=clamp(G.popularity+1,0,100);saveNews('🎙️ Prezydent wygłosił konferencję prasową.');}
    save();render();
  };
  window.setOvalAgenda=function(){ensureV17();const a=document.getElementById('agendaSel').value+' — '+(document.getElementById('agendaText').value.trim()||'cel administracji');G.oval.agenda.unshift(a);if(G.oval.agenda.length>8)G.oval.agenda.pop();G.oval.approvals=clamp(G.oval.approvals+.8,0,100);saveNews('📋 Gabinet Owalny przyjął nowy priorytet.');closeModal();save();render()};
  window.vOval=function(){ensureV17();if(!G.oval.unlocked)return `<div class="lockedPanel"><div class="big">🔒</div><h2>Gabinet Owalny</h2><p class="muted">Pokój prezydenta zostanie odblokowany po zwycięstwie wyborczym.</p></div>`;return `<div class="grid">${C('full oval','🦅 Gabinet Owalny — centrum administracji',`<div class="ovalGrid"><div><div class="eyebrow">THE WHITE HOUSE • WEST WING</div><div class="metric big">Prezydent USA</div><p class="muted">Centrum decyzji wykonawczych, spotkań, strategii i zarządzania administracją.</p>${stat('Aprobata',pct(G.popularity))}${stat('Rozkazy',G.oval.orders)}${stat('Personel',G.oval.staff)}${stat('Szczyty',G.oval.meetings)}${stat('Konferencje',G.oval.press)}</div><div><h3>🗂️ Centrum decyzji</h3><div class="actionGrid"><button class="btn primary" onclick="ovalAction('order')">✍️ Rozkaz wykonawczy</button><button class="btn" onclick="ovalAction('staff')">👥 Personel — $15M</button><button class="btn" onclick="ovalAction('agenda')">📋 Strategia</button><button class="btn" onclick="ovalAction('press')">🎙️ Konferencja</button><button class="btn" onclick="setPage('foreign')">🌐 Rada ds. zagranicznych</button><button class="btn" onclick="setPage('economy')">🏦 Rada gospodarcza</button></div></div></div>`)}${C('half','👥 Zespół prezydenta',stat('Szef personelu',G.oval.chief)+stat('Personel',G.oval.staff)+stat('Aprobata gabinetu',G.oval.approvals+'/100'))}${C('half','🏛️ Relacje z Kongresem',stat('Izba',houseControl())+stat('Senat',senateControl())+stat('Ustawy do podpisu',G.laws.filter(l=>l.status==='Do podpisu').length))}${C('wide','📋 Strategia administracji',G.oval.agenda.length?G.oval.agenda.map((x,i)=>`<div class="list"><b>Priorytet ${i+1}</b><div>${x}</div></div>`).join(''):'<div class="empty">Brak ustalonej strategii.</div>')}${C('full','📊 Situation Room',stat('PKB',G.gdp.toFixed(1))+stat('Inflacja',G.inflation.toFixed(2)+'%')+stat('Bezrobocie',G.unemployment.toFixed(1)+'%')+stat('Dyplomacja',G.foreign+'/100')+stat('Obrona',G.defense+'/100')+stat('Ropa','$'+G.markets.oil.toFixed(1)))}</div>`};

  /* ---------- DYPLOMACJA: przewijanie nie resetuje listy ---------- */
  const oldVForeign=window.vForeign;
  window.vForeign=function(){
    ensureDiplomacy(); const html=oldVForeign();
    return html.replace('class="diplomacyCol"><div class="sectionTitle"><span>🌍 Państwa świata</span>', 'class="diplomacyCol countryScroll"><div class="sectionTitle"><span>🌍 Państwa świata</span>');
  };

  /* ---------- STANY: poza wyborami tylko podgląd/statystyki ---------- */
  const stateOriginal=window.vStates;
  window.vStates=function(){
    const html=stateOriginal();
    if(G.election?.active&&G.election.phase==='campaign')return html;
    return html.replace(/<div class="rowActions" style="margin-top:10px"><button class="btn primary" onclick="stateRally\([\s\S]*?<\/div>/,'<div class="notice">Poza kampanią: tylko podgląd i statystyki stanu. Działania kampanijne wrócą przy kolejnych wyborach.</div>');
  };

  /* ---------- AUTO: ustawy, wydarzenia, ceny, poprawki bez cofania postępu ---------- */
  window.dailyTick=function(){
    ensureV17();
    if(typeof advanceEconomy==='function')advanceEconomy();
    marketStep(); updateLawStatuses();
    if(Math.random()<0.16)generateAutomaticLaw();
    if(Math.random()<0.09)generateWorldEvent();
    if(G.election?.active&&G.election.phase==='campaign')window.aiCampaignDay&&window.aiCampaignDay(),G.election.day++,G.election.day>G.election.totalDays&&startElectionNight();
    if(G.congressCampaign?.active&&G.congressCampaign.phase==='campaign')G.congressCampaign.day++,G.congressCampaign.day>G.congressCampaign.totalDays&&finishCongress();
    if(!G.congressCampaign?.active&&G.year>=G.nextCongress&&G.month===1&&!G.election?.active&&G.president)startCongressCycle();
    if(!G.election?.active&&G.year>=G.nextPresidential&&G.month===1)startPresidentialCycle();
    if(Math.random()<.03)G.popularity=clamp(G.popularity+(Math.random()-.45)*2,0,100);
    save();render();
  };

  /* wybory: po zakończeniu panel wyborczy jest tylko podglądem; działania wracają w nowej kampanii */
  const oldCampaignAction=window.campaignAction;
  window.campaignAction=function(a){if(!G.election?.active||G.election.phase!=='campaign')return toast('Kampania jest zakończona. Działania wrócą przy kolejnych wyborach.');return oldCampaignAction(a)};
  const oldStateRally=window.stateRally, oldTargetAds=window.targetAds;
  window.stateRally=function(s){if(!G.election?.active||G.election.phase!=='campaign')return toast('Wiec jest dostępny tylko podczas kampanii.');return oldStateRally(s)};
  window.targetAds=function(s){if(!G.election?.active||G.election.phase!=='campaign')return toast('Reklama jest dostępna tylko podczas kampanii.');return oldTargetAds(s)};

  /* CSS naprawiający scroll państw: lista ma własny viewport i render nie przesuwa jej */
  const st=document.createElement('style');st.textContent=`
    .countryScroll{max-height:680px;overflow-y:auto;overflow-x:hidden;scroll-behavior:auto}
    .countryScroll .tileGrid{align-content:start}
    .marketGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .lawTopics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:8px 0 14px}.check{display:block;padding:9px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.03)}
    .check input{margin-right:6px}.ovalGrid{display:grid;grid-template-columns:1.1fr 1fr;gap:24px}.ovalGrid .big{font-size:34px}
    @media(max-width:900px){.marketGrid,.lawTopics,.ovalGrid{grid-template-columns:1fr}}
  `;document.head.appendChild(st);

  window.setPage=(function(orig){return function(id){ensureV17();return orig(id)}})(window.setPage);

  /* v18 — globalne handlery przycisków + bezpieczne odświeżanie */
  const expose=['setPage','campaignAction','stateRally','targetAds','econ','foreign','military','lawModal','amendmentModal','signLaw','vetoLaw','diplomacyAction','buildEmbassy','removeEmbassy','openEmbargo','ovalAction','closeModal','openModal','selectCountry','stateInfo','cheat','setSpeed','inflationAction','openSummit','executeSummit','openTradeDeal','executeTradeDeal','resolveWorldEvent','lawSubmit','submitLaw','createLaw','amendmentSubmit','submitAmendment'];
  expose.forEach(n=>{try{if(typeof window[n]!=='function' && typeof globalThis[n]==='function')window[n]=globalThis[n]}catch(e){}});
  /* Funkcje z wcześniejszych wersji mogą być deklaracjami lokalnymi — wystawiamy je jawnie do onclick="...". */
  try{window.render=render}catch(e){}
  try{window.renderNav=renderNav}catch(e){}
  try{window.tick=tick}catch(e){}
  try{window.dailyTick=dailyTick}catch(e){}
  window.addEventListener('error',function(e){console.error('USA PRESIDENT:',e.error||e.message)});
  renderNav(); render();
})();


/* ===== V19 — STABILNA NAWIGACJA I RENDERER ===== */
(function(){
  ensureV17();
  if(!Array.isArray(NAV)) return;
  if(!NAV.some(x=>x[0]==='markets')) NAV.push(['markets','Rynki i ceny','📈']);

  // Jeden, prosty mechanizm nawigacji. Przyciski nie polegają już na zagnieżdżonych
  // wersjach setPage/renderNav z poprzednich aktualizacji.
  window.setPage=function(id){
    ensureV17();
    const allowed=['overview','election','congress','laws','states','economy','foreign','military','events','oval','markets'];
    if(!allowed.includes(id)) id='overview';
    if(id==='oval' && !G.oval.unlocked){ toast('Gabinet Owalny odblokuje się po wygraniu wyborów.'); return; }
    if(id==='economy' && G.economyUnlocked===false){ toast('Gospodarka odblokuje się po wygraniu wyborów prezydenckich.'); return; }
    G.page=id;
    save();
    render();
  };

  window.renderNav=function(){
    const nav=document.getElementById('nav');
    if(!nav)return;
    nav.innerHTML=NAV.map(([id,label,icon])=>{
      const locked=(id==='oval'&&!G.oval.unlocked)||(id==='economy'&&G.economyUnlocked===false);
      return `<button type="button" class="navBtn ${G.page===id?'active':''} ${locked?'locked':''}" data-page="${id}">${icon} ${label}${locked?' 🔒':''}</button>`;
    }).join('');
  };

  // Event delegation — działa nawet po każdym przebudowaniu HTML.
  document.addEventListener('click',function(e){
    const b=e.target.closest('#nav [data-page]');
    if(!b)return;
    e.preventDefault();
    e.stopPropagation();
    window.setPage(b.dataset.page);
  },true);

  window.render=function(){
    ensureV17();
    renderNav();
    const title=document.getElementById('pageTitle');
    const content=document.getElementById('content');
    if(!content)return;
    const titles={overview:'Centrum dowodzenia',election:'Wybory prezydenckie',congress:'Kongres',laws:'Ustawy federalne',states:'Stany USA',economy:'Gospodarka',foreign:'Polityka zagraniczna',military:'Obrona',events:'Wydarzenia na świecie',oval:'Gabinet Owalny',markets:'Rynki i ceny'};
    if(title)title.textContent=titles[G.page]||titles.overview;
    const pages={overview:vOverview,election:vElection,congress:vCongress,laws:vLaws,states:vStates,economy:vEconomy,foreign:vForeign,military:vMilitary,events:vEvents,oval:vOval,markets:vMarkets};
    let fn=pages[G.page]||vOverview;
    try{ content.innerHTML=fn(); }
    catch(err){
      console.error('Render error:',err);
      content.innerHTML=`<div class="card full"><h2>⚠️ Błąd panelu</h2><p class="muted">Panel został zabezpieczony przed zatrzymaniem całej gry.</p><button class="btn primary" type="button" onclick="setPage('overview')">Wróć do przeglądu</button></div>`;
    }
    updateClock();
    setTimeout(()=>{try{initVisibleMaps()}catch(err){console.error(err)}},30);
  };

  // Po zmianie renderera ponownie uruchamiamy ekran bez kasowania zapisu.
  render();
})();
</script>
