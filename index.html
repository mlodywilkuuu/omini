(()=>{'use strict';
const COST={bus:35000,tram:150000,metro:650000},LINE_COST={bus:70000,tram:260000,metro:1200000},UPKEEP={bus:4500,tram:12500,metro:39000},COLOR={bus:'#ffbb57',tram:'#50d6c0',metro:'#bb8cff'},LABEL={bus:'Autobus',tram:'Tramwaj',metro:'Metro'},ICON={bus:'🚌',tram:'🚋',metro:'🚇'};
const $=id=>document.getElementById(id),fmt=n=>Math.round(n).toLocaleString('pl-PL'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={money:4500000,month:1,stops:[],lines:[],log:[],nextId:1,fares:{bus:3.5,tram:3.5,metro:3.5},ticketPass:85,discount:.5,subsidy:0,depots:{bus:0,tram:0,metro:0},tracks:[],tunnels:[],rivals:[],history:[],routeMode:true},tab='build',mode='bus',draft=[],editing=null,markers=new Map(),paths=new Map(),vehicles=[],toastTimer;
try{const saved=JSON.parse(localStorage.getItem('transport-city-v1'));if(saved&&Array.isArray(saved.stops)&&Array.isArray(saved.lines)){state={...state,...saved};state.nextId=Math.max(state.nextId||1,...state.stops.map(s=>s.id+1),...state.lines.map(l=>l.id+1));}}catch(e){console.warn('Save unavailable',e)}
state.fares={bus:3.5,tram:3.5,metro:3.5,...(state.fares||{})};normalize();
function normalize(){state.ticketPass??=85;state.discount??=.5;state.subsidy??=0;state.depots??={bus:0,tram:0,metro:0};state.tracks??=[];state.tunnels??=[];state.rivals??=[];state.history??=[];state.routeMode??=true;state.city??={population:285000,growth:0,marketing:0,loans:0,events:[],upgrades:[],reputation:55};state.career??={claimed:[]};state.scenario??='standard';state.dayType??='weekday';state.weather??='clear';for(const l of state.lines){l.interval??=15;l.vehicleModel??='standard';l.reliability??=95;l.routeCoords??=null;l.routeKm??=null;l.breakdowns??=0}}
const MODELS={bus:[['standard','Autobus standardowy',1,1,0],['articulated','Przegubowy',1.55,1.3,95000],['electric','Elektryczny',1.2,.7,140000]],tram:[['standard','Tramwaj standardowy',1,1,0],['lowfloor','Niskopodłogowy',1.35,1.15,190000]],metro:[['standard','Metro standardowe',1,1,0],['long','Długi skład',1.65,1.4,620000]]};
const DEPOT_COST={bus:300000,tram:950000,metro:2800000};
let metroView=false,showRivals=true,selectedLineType='bus',routeBusy=new Set(),routingQueue=Promise.resolve(),infraLayer;
function lineCoords(l){return Array.isArray(l.routeCoords)&&l.routeCoords.length>1?l.routeCoords:l.stops.map(stopById).filter(Boolean).map(s=>[s.lat,s.lng])}

function modelInfo(l){return MODELS[l.type]?.find(m=>m[0]===l.vehicleModel)||MODELS[l.type][0]}
function satisfaction(){if(!state.lines.length)return 0;let total=0;for(const l of state.lines){const f=state.fares[l.type],waiting=Math.max(4,(l.interval||15)/2),quality=(l.reliability??95);total+=Math.max(5,Math.min(100,95-(f-3.5)*3-waiting*.8-(100-quality)*.65+(modelInfo(l)[0]==='lowfloor'?6:0)))}return Math.round(total/state.lines.length)}
function transitDemand(l){const base=lineDemand(l),hourFactor=1.17,waitFactor=Math.max(.45,Math.min(1.4,15/(l.interval||15))),reliability=(l.reliability??95)/100,competition=1/(1+state.rivals.filter(r=>r.type===l.type).length*.055);return Math.round(base*hourFactor*waitFactor*reliability*competition*modelInfo(l)[2])}
function updateRouteStatus(t){const el=$('routeStatus');if(el)el.textContent=t}
async function fetchRoadRoute(l){if(l.type!=='bus'||!state.routeMode)return;const pts=l.stops.map(stopById).filter(Boolean);if(pts.length<2||pts.length>20)return;const key=l.id; if(routeBusy.has(key))return;routeBusy.add(key);updateRouteStatus('⏳ Wyznaczanie trasy po ulicach…');try{const coords=pts.map(p=>`${p.lng.toFixed(6)},${p.lat.toFixed(6)}`).join(';');const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),10000);let data;try{const response=await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=full&geometries=geojson&steps=false`,{signal:controller.signal});if(!response.ok)throw Error('Routing HTTP '+response.status);data=await response.json()}finally{clearTimeout(timer)}if(data.code!=='Ok'||!data.routes?.[0]?.geometry?.coordinates)throw Error('Brak drogi');const route=data.routes[0];l.routeCoords=route.geometry.coordinates.map(c=>[c[1],c[0]]);l.routeKm=route.distance/1000;updateRouteStatus('✓ Autobus jedzie po ulicach OpenStreetMap');save();draw()}catch(e){l.routeCoords=null;l.routeKm=null;updateRouteStatus('ℹ Trasa zastępcza: odcinki między przystankami')}finally{routeBusy.delete(key)}}

function syncRouting(){for(const l of state.lines)if(l.type==='bus'&&!l.routeCoords&&state.routeMode)scheduleRouting(l)}
function lineOptions(l){return `<div class="actions"><label>Co <select data-interval="${l.id}">${[5,10,15,20,30,60].map(n=>`<option value="${n}" ${l.interval===n?'selected':''}>${n} min</option>`).join('')}</select></label><label>Model <select data-model="${l.id}">${MODELS[l.type].map(m=>`<option value="${m[0]}" ${l.vehicleModel===m[0]?'selected':''}>${m[1]}</option>`).join('')}</select></label></div>`}

if(typeof L==='undefined'){$('content').textContent='Nie udało się wczytać biblioteki mapy. Sprawdź połączenie internetowe.';return}
const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([53.1325,23.1688],13);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',maxZoom:19}).addTo(map);
const overlay=L.layerGroup().addTo(map),vehicleLayer=L.layerGroup().addTo(map),draftLayer=L.layerGroup().addTo(map);infraLayer=L.layerGroup().addTo(map);
function save(){try{localStorage.setItem('transport-city-v1',JSON.stringify(state))}catch(e){toast('Nie udało się zapisać danych w przeglądarce')}}

function lineDemand(line){const stops=line.stops.map(stopById).filter(Boolean);if(stops.length<2)return 0;const length=lineLength(line),coverage=stops.reduce((n,s)=>n+(s.type==='metro'?380:s.type==='tram'?230:135),0),otherLines=state.lines.filter(l=>l.id!==line.id&&l.stops.some(id=>line.stops.includes(id))).length;return Math.round(Math.max(20,(coverage+otherLines*90)*Math.min(1.45,Math.sqrt(length+1)/2.1)*Math.min(1.6,.55+line.vehicles*.18)))}
function monthly(){let income=0,cost=0,passengers=0;const city=state.city||{population:285000,reputation:55,loans:0};for(const line of state.lines){const d=Math.round(transitDemand(line)*Math.max(.65,Math.min(1.8,city.population/285000))*(state.dayType==='weekend'?.78:1)*(state.weather==='rain'?1.12:1)*(1+(city.marketing||0)*.025));passengers+=d;const fare=Number(state.fares[line.type]??3.5);const affordability=Math.max(.25,Math.min(1.65,Math.pow(3.5/Math.max(.5,fare),.65)));const actual=Math.round(d*affordability);passengers+=actual-d;income+=actual*30*(fare*.84+state.ticketPass/30*.11+fare*state.discount*.05);cost+=line.vehicles*UPKEEP[line.type]*modelInfo(line)[3]*(1+(30/(line.interval||15))*.06);cost+=line.breakdowns*2200;}cost+=state.stops.length*450+Object.values(state.depots).reduce((a,b)=>a+b*3100,0);income+=state.subsidy;cost+=(city.loans||0)*.008;cost+=(city.marketing||0)*1500;return{income:Math.round(income),cost:Math.round(cost),passengers,profit:Math.round(income-cost)}}
function moneyEffect(amount){if(!Number.isFinite(amount)||amount===0)return;const el=document.createElement('div');el.className='money-float '+(amount>0?'plus':'minus');el.textContent=(amount>0?'+':'−')+fmt(Math.abs(amount))+' zł';const rect=$('money').getBoundingClientRect();el.style.left=Math.min(innerWidth-145,Math.max(12,rect.left))+'px';el.style.top=Math.max(35,rect.top)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1550);const badge=$('money');badge.classList.remove('money-bump');void badge.offsetWidth;badge.classList.add('money-bump');setTimeout(()=>badge.classList.remove('money-bump'),350)}

function extraRender(){const c=state.city,m=monthly();if(tab==='city')return `<div class="section-title">🏙 Żyjące miasto</div><div class="item"><b>Populacja: ${fmt(c.population)} mieszkańców</b><p>Zmiana miesięczna: ${c.growth>=0?'+':''}${fmt(c.growth)} · Reputacja: ${c.reputation}/100</p><p>Pogoda: ${state.weather==='rain'?'🌧 Deszcz':state.weather==='snow'?'❄ Śnieg':'☀ Pogodnie'} · Pasażerowie: ${fmt(m.passengers)}/dzień</p></div><div class="section-title">Promocja komunikacji</div><div class="item"><p>Kampanie marketingowe: ${c.marketing||0} · Utrzymanie: ${fmt((c.marketing||0)*1500)} zł/mies.</p><div class="actions"><button data-extra="marketing">📣 Kampania (25 000 zł)</button><button data-extra="stopmarketing">Zakończ kampanię</button></div></div><div class="section-title">Finansowanie inwestycji</div><div class="item"><p>Dług: ${fmt(c.loans||0)} zł · Odsetki: ${fmt((c.loans||0)*.008)} zł/mies.</p><div class="actions"><button data-extra="loan">🏦 Pożycz 250 000 zł</button><button data-extra="repay">Spłać 100 000 zł</button></div></div><div class="section-title">Wydarzenia miejskie</div>${(c.events||[]).map(e=>`<div class="item">${esc(e)}</div>`).join('')||'<div class="hint">Wydarzenia pojawiają się co cztery miesiące.</div>'}<div class="section-title">Rodzaj dnia</div><div class="actions"><button data-extra="weekday">Dzień roboczy</button><button data-extra="weekend">Weekend</button></div>`;

if(tab==='lines'){const chosenType=editing?.type||selectedLineType;html=`<div class="section-title">${editing?'Edytowanie linii':'Utwórz nową linię'}</div><div class="row"><input id="lineName" placeholder="Nazwa, np. Autobus 1" value="${esc(editing?.name||'')}"></div><div class="row"><select id="lineType">${['bus','tram','metro'].map(t=>`<option value="${t}" ${chosenType===t?'selected':''}>${ICON[t]} ${LABEL[t]}</option>`).join('')}</select><input id="lineColor" type="color" value="${editing?.color||COLOR[chosenType]}" style="max-width:55px;padding:3px;height:40px"></div><div class="hint">Klikaj na mapie znaczniki przystanków w kolejności przejazdu. Autobus spróbuje wyznaczyć trasę po prawdziwych ulicach (OSRM). Typ przystanków musi odpowiadać rodzajowi linii. Możesz dodać przystanek ponownie, żeby utworzyć trasę powrotną.</div><div class="item"><b>Trasa: ${draft.length} przystanków</b><div style="font-size:12px;color:#b8cce0;margin-top:5px">${draft.map((id,i)=>`${i+1}. ${esc(stopById(id)?.name||'?')}`).join(' → ')||'Wybierz przystanki na mapie'}</div><div class="actions"><button id="undo">↶ Cofnij</button><button id="clearDraft">Wyczyść</button></div></div><button id="commit" class="primary full">${editing?'💾 Zapisz zmiany':'➕ Utwórz linię'}</button>${editing?'<button id="cancelEdit" class="full" style="margin-top:7px">Anuluj edycję</button>':''}<div class="section-title" style="margin-top:17px">Istniejące linie (${state.lines.length})</div>${state.lines.length?state.lines.map(l=>`<div class="item"><div class="itemhead"><b><span style="color:${l.color||COLOR[l.type]}">●</span> ${esc(l.name)}</b><span class="badge">${ICON[l.type]}</span></div><small>${l.stops.length} przystanków · ${routeKm(l.stops).toFixed(1)} km · ${l.vehicles} pojazdów · ${fmt(lineDemand(l))} pasażerów/dzień</small><div class="actions"><button data-addvehicle="${l.id}">+ Pojazd</button><button data-subvehicle="${l.id}">− Pojazd</button><button data-edit="${l.id}">Edytuj</button><button class="danger" data-delline="${l.id}">Usuń</button></div></div>`).join(''):'<div class="hint">Najpierw zbuduj przystanki, a potem połącz je w linię.</div>'}`}
if(tab==='fleet'){html=`<div class="section-title">🚍 Flota i rozkłady</div><div class="mini-grid"><div class="metric"><small>Punktualność</small><strong>${state.lines.length?Math.round(state.lines.reduce((a,l)=>a+(l.reliability||95),0)/state.lines.length):'—'}%</strong></div><div class="metric"><small>Satysfakcja</small><strong>${satisfaction()}%</strong></div><div class="metric"><small>Wszystkie pojazdy</small><strong>${state.lines.reduce((a,l)=>a+l.vehicles,0)}</strong></div><div class="metric"><small>Linie</small><strong>${state.lines.length}</strong></div></div><div class="hint">Godziny szczytu zwiększają popyt. Częstsze kursy przyciągają pasażerów, ale kosztują więcej. Awarie obniżają punktualność.</div>${state.lines.map(l=>`<div class="item"><div class="itemhead"><b>${ICON[l.type]} ${esc(l.name)}</b><span class="badge">${l.vehicles} poj.</span></div><small>${lineLength(l).toFixed(1)} km · Punktualność ${l.reliability||95}% · ${fmt(transitDemand(l))} pas./dzień</small>${lineOptions(l)}<div class="actions"><button data-addvehicle="${l.id}">+ Kup pojazd</button><button data-subvehicle="${l.id}">− Sprzedaj</button><button data-repair="${l.id}">🔧 Serwis · 12 000 zł</button></div></div>`).join('')||'<div class="hint">Najpierw utwórz linię w zakładce Linie.</div>'}<div class="section-title">🏭 Zajezdnie</div>${['bus','tram','metro'].map(t=>`<div class="item"><div class="itemhead"><b>${ICON[t]} ${LABEL[t]} — ${state.depots[t]} zajezdni</b><button data-depot="${t}">Buduj · ${fmt(DEPOT_COST[t])} zł</button></div></div>`).join('')}`}
if(tab==='network'){html=`<div class="section-title">🚇 Sieć infrastruktury</div><div class="item"><div class="itemhead"><b>Widok podziemny</b><button id="metroToggle">${metroView?'🌍 Powierzchnia':'🚇 Pod ziemię'}</button></div><p class="network-note">W widoku podziemnym stacje metra są wyraźniejsze, a pozostałe przystanki przygaszone.</p></div><div class="item"><div class="itemhead"><b>Trasy autobusowe po ulicach</b><button id="routingToggle">${state.routeMode?'✓ Włączone':'○ Wyłączone'}</button></div><p class="network-note">Wykorzystuje publiczny serwer OSRM i dane OpenStreetMap. Jeśli serwer jest niedostępny, używane są odcinki proste. Tramwaje i metro korzystają z zaprojektowanych korytarzy, a nie rzeczywistej sieci torowej.</p><button id="refreshRoutes">↻ Przelicz trasy drogowe</button></div><div class="section-title">Budowa torów i tuneli</div><div class="hint">Wybierz dwa przystanki tego samego typu. Tory i tunele są wizualizowanymi korytarzami między stacjami (nie edytorem zakrzywionych torów).</div><div class="row"><select id="infraType"><option value="tram">🚋 Torowisko · 240 000 zł/km</option><option value="metro">🚇 Tunel · 3 800 000 zł/km</option></select></div><div class="row"><select id="infraA"></select><select id="infraB"></select></div><button class="primary full" id="buildInfra">🔨 Zbuduj połączenie</button><div class="section-title">Zbudowana infrastruktura</div><div class="mini-grid"><div class="metric"><small>Odcinki torów</small><strong>${state.tracks.length}</strong></div><div class="metric"><small>Odcinki tuneli</small><strong>${state.tunnels.length}</strong></div></div><div class="section-title">Konkurencja</div><button id="rivalsToggle">${showRivals?'Ukryj':'Pokaż'} przewoźników AI</button>${state.rivals.map(r=>`<div class="item"><b>${esc(r.name)}</b><small> · ${LABEL[r.type]} · ${r.stops} przystanków</small></div>`).join('')||'<div class="hint">Przewoźnicy AI mogą pojawić się wraz z upływem miesięcy.</div>'}`}
if(tab==='manage'){const m=monthly();html=`<div class="section-title">🎟 Ceny biletów</div><div class="item"><div class="fare-grid">${['bus','tram','metro'].map(t=>`<div><label for="fare-${t}">${ICON[t]} ${LABEL[t]}</label><input type="number" id="fare-${t}" data-fare="${t}" min="0.5" max="50" step="0.5" value="${state.fares[t]}"></div>`).join('')}</div><div class="fare-note">Cena za przejazd w zł. Wyższe ceny zwiększają wpływ z biletu, ale mogą zmniejszyć liczbę pasażerów. Zmiany zapisują się automatycznie.</div></div><div class="section-title">Bilety okresowe i ulgi</div><div class="item"><div class="row"><label>Bilet miesięczny (zł)<input type="number" id="passPrice" min="20" max="500" value="${state.ticketPass}"></label><label>Ulga (0–100%)<input type="number" id="discountPrice" min="0" max="100" value="${Math.round(state.discount*100)}"></label></div><button id="saveTickets">Zapisz taryfę</button></div><div class="section-title">Finanse miesięczne</div><div class="item"><div class="itemhead"><b>Przychód z biletów</b><b style="color:#78edb7">+${fmt(m.income)} zł</b></div></div><div class="item"><div class="itemhead"><b>Utrzymanie sieci</b><b style="color:#ff9e9e">−${fmt(m.cost)} zł</b></div></div><div class="item"><div class="itemhead"><b>Dotacja miasta</b><b>+${fmt(state.subsidy)} zł</b></div></div><div class="item"><div class="itemhead"><b>Bilans</b><b style="color:${m.profit>=0?'#78edb7':'#ff9e9e'}">${m.profit>=0?'+':''}${fmt(m.profit)} zł</b></div></div><button id="grant" class="full">🏛 Wniosek o dotację (zależna od jakości sieci)</button><button id="advance" class="primary full">⏭ Następny miesiąc</button><div class="section-title" style="margin-top:16px">Zapis i zarządzanie</div><div class="toolgrid"><button id="save">💾 Zapisz</button><button id="export">📤 Eksport JSON</button><button id="import">📥 Import JSON</button><button id="reset" class="danger">🗑 Nowa gra</button></div><input type="file" id="importFile" accept=".json,application/json" style="display:none"><div class="section-title" style="margin-top:16px">Historia finansów</div><div class="mini-grid">${state.history.slice(-4).map(h=>`<div class="metric"><small>Miesiąc ${h.month}</small><strong style="color:${h.profit>=0?'#78edb7':'#ff9e9e'}">${h.profit>=0?'+':''}${fmt(h.profit)} zł</strong></div>`).join('')}</div><div class="section-title" style="margin-top:16px">Kronika</div>${state.log.length?state.log.map(s=>`<div class="item"><small>${esc(s)}</small></div>`).join(''):'<div class="hint">Zdarzenia z rozgrywki pojawią się tutaj.</div>'}<div class="hint">Zasięg i liczba pasażerów są uproszczoną symulacją. Autobusy mogą korzystać z routingu OSRM; tramwaje i metro poruszają się po korytarzach pomiędzy stacjami. Popyt, korki i konkurencja są symulowane w uproszczeniu.</div>`}
$('content').innerHTML=html;bindControls();draw()}
function bindControls(){bindExtras();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{const s=stopById(+b.dataset.focus);map.setView([s.lat,s.lng],16);markers.get(s.id)?.openPopup()});document.querySelectorAll('[data-rename]').forEach(b=>b.onclick=()=>{const s=stopById(+b.dataset.rename),name=prompt('Nowa nazwa przystanku:',s.name);if(name?.trim()){s.name=name.trim().slice(0,70);save();render()}});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const id=+b.dataset.remove;if(state.lines.some(l=>l.stops.includes(id))){toast('Najpierw usuń przystanek z linii.');return}if(confirm('Usunąć ten przystanek?')){state.stops=state.stops.filter(s=>s.id!==id);state.tracks=state.tracks.filter(t=>!t.includes(id));state.tunnels=state.tunnels.filter(t=>!t.includes(id));draft=draft.filter(x=>x!==id);save();render()}});
if(tab==='lines'){$('undo').onclick=()=>{draft.pop();render()};$('clearDraft').onclick=()=>{draft=[];render()};$('lineType').onchange=()=>{const type=$('lineType').value;selectedLineType=type;draft=draft.filter(id=>stopById(id)?.type===type);$('lineColor').value=COLOR[type];draw()};$('commit').onclick=commitLine;$('cancelEdit')&&($('cancelEdit').onclick=()=>{editing=null;draft=[];render()});document.querySelectorAll('[data-addvehicle]').forEach(b=>b.onclick=()=>{const l=state.lines.find(l=>l.id===+b.dataset.addvehicle),cost=Math.round(LINE_COST[l.type]*.45);if(charge(cost)){l.vehicles++;addLog('Zakupiono pojazd dla '+l.name);save();render()}});document.querySelectorAll('[data-subvehicle]').forEach(b=>b.onclick=()=>{const l=state.lines.find(l=>l.id===+b.dataset.subvehicle);if(l.vehicles>1){l.vehicles--;changeMoney(Math.round(LINE_COST[l.type]*.12));save();render()}else toast('Linia musi mieć przynajmniej jeden pojazd')});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=state.lines.find(l=>l.id===+b.dataset.edit);draft=[...editing.stops];render()});document.querySelectorAll('[data-delline]').forEach(b=>b.onclick=()=>{const id=+b.dataset.delline;if(confirm('Usunąć linię?')){state.lines=state.lines.filter(l=>l.id!==id);if(editing?.id===id){editing=null;draft=[]}save();render()}})}
if(tab==='fleet'){document.querySelectorAll('[data-interval]').forEach(e=>e.onchange=()=>{const l=state.lines.find(l=>l.id===+e.dataset.interval);l.interval=+e.value;save();render()});document.querySelectorAll('[data-model]').forEach(e=>e.onchange=()=>{const l=state.lines.find(l=>l.id===+e.dataset.model),m=MODELS[l.type].find(m=>m[0]===e.value);if(l.vehicleModel!==e.value){if(!charge(m[4])){render();return}l.vehicleModel=e.value;addLog('Zmodernizowano flotę: '+l.name);save();render()}});document.querySelectorAll('[data-depot]').forEach(e=>e.onclick=()=>{const t=e.dataset.depot;if(charge(DEPOT_COST[t])){state.depots[t]++;addLog('Zbudowano zajezdnię '+LABEL[t]);save();render()}});document.querySelectorAll('[data-repair]').forEach(e=>e.onclick=()=>{const l=state.lines.find(l=>l.id===+e.dataset.repair);if(charge(12000)){l.reliability=Math.min(100,(l.reliability||85)+15);l.breakdowns=0;save();render();toast('Naprawiono pojazdy')}});document.querySelectorAll('[data-addvehicle]').forEach(b=>b.onclick=()=>{const l=state.lines.find(l=>l.id===+b.dataset.addvehicle),cost=Math.round(LINE_COST[l.type]*.45);if(charge(cost)){l.vehicles++;save();render()}});document.querySelectorAll('[data-subvehicle]').forEach(b=>b.onclick=()=>{const l=state.lines.find(l=>l.id===+b.dataset.subvehicle);if(l.vehicles>1){l.vehicles--;changeMoney(Math.round(LINE_COST[l.type]*.12));save();render()}})}
if(tab==='network'){$('metroToggle').onclick=()=>{metroView=!metroView;render()};$('routingToggle').onclick=()=>{state.routeMode=!state.routeMode;for(const l of state.lines)if(l.type==='bus'){l.routeCoords=null;l.routeKm=null}save();render();if(state.routeMode)syncRouting()};$('refreshRoutes').onclick=()=>{for(const l of state.lines)if(l.type==='bus'){l.routeCoords=null;l.routeKm=null;scheduleRouting(l)}toast('Trasy są przeliczane')};$('rivalsToggle').onclick=()=>{showRivals=!showRivals;render()};const sel=$('infraType'),a=$('infraA'),b=$('infraB');function fill(){const ss=state.stops.filter(s=>s.type===sel.value);a.innerHTML=b.innerHTML=ss.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');if(ss[1])b.value=ss[1].id}sel.onchange=fill;fill();$('buildInfra').onclick=()=>{const x=stopById(+a.value),y=stopById(+b.value);if(!x||!y||x.id===y.id){toast('Wybierz dwie różne stacje');return}const target=sel.value==='metro'?state.tunnels:state.tracks;if(target.some(z=>z.includes(x.id)&&z.includes(y.id))){toast('To połączenie już istnieje');return}const cost=Math.round(km(x,y)*(sel.value==='metro'?3800000:240000));if(charge(cost)){target.push([x.id,y.id]);addLog('Zbudowano '+(sel.value==='metro'?'tunel':'torowisko')+' '+km(x,y).toFixed(1)+' km');save();render()}}}
if(tab==='manage'){document.querySelectorAll('[data-fare]').forEach(input=>input.onchange=()=>{const t=input.dataset.fare;const value=Number(input.value);if(!Number.isFinite(value)||value<.5||value>50){toast('Cena biletu musi wynosić od 0,50 do 50 zł');input.value=state.fares[t];return}state.fares[t]=Math.round(value*100)/100;addLog('Cena biletu '+LABEL[t]+': '+state.fares[t].toFixed(2)+' zł');save();render();toast('Zmieniono cenę biletu')});$('saveTickets').onclick=()=>{state.ticketPass=Math.max(20,Math.min(500,Number($('passPrice').value)||85));state.discount=Math.max(0,Math.min(1,(Number($('discountPrice').value)||0)/100));save();render();toast('Zapisano taryfę')};$('grant').onclick=()=>{const n=Math.max(0,Math.round(satisfaction()*1200+state.stops.length*120));state.subsidy=n;addLog('Miasto przyznało miesięczną dotację '+fmt(n)+' zł');save();render();toast('Dotacja: '+fmt(n)+' zł/mies.')};$('advance').onclick=advance;$('save').onclick=()=>{save();toast('Gra zapisana')};$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='transport-city-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.stops)||!Array.isArray(d.lines)||!Number.isFinite(d.money))throw Error('Zły format');if(!confirm('Zastąpić obecną grę zapisem z pliku?'))return;state=d;state.fares={bus:3.5,tram:3.5,metro:3.5,...(state.fares||{})};normalize();state.nextId=Math.max(state.nextId||1,...state.stops.map(s=>s.id+1),...state.lines.map(l=>l.id+1));state.log=Array.isArray(state.log)?state.log:[];editing=null;draft=[];save();render();toast('Zaimportowano zapis')}catch(e){toast('Niepoprawny plik zapisu')}};$('reset').onclick=()=>{if(confirm('Rozpocząć od nowa? Obecny zapis zostanie zastąpiony.')){state={money:4500000,month:1,stops:[],lines:[],log:[],nextId:1,fares:{bus:3.5,tram:3.5,metro:3.5}};normalize();draft=[];editing=null;save();render()}}}}
function commitLine(){const name=$('lineName').value.trim().slice(0,70),type=$('lineType').value,color=$('lineColor').value;if(!name){toast('Wpisz nazwę linii');return}if(draft.length<2||new Set(draft).size<2){toast('Linia wymaga co najmniej dwóch różnych przystanków');return}if(draft.some(id=>stopById(id)?.type!==type)){toast('Wybierz przystanki właściwego typu');return}if(editing){editing.name=name;editing.type=type;editing.color=color;editing.stops=[...draft];upgradeLine(editing);addLog('Zmieniono trasę '+name);editing=null}else{if(!charge(LINE_COST[type]))return;const l={id:state.nextId++,name,type,color,stops:[...draft],vehicles:1,interval:15,vehicleModel:'standard',reliability:95};state.lines.push(l);upgradeLine(l);addLog('Uruchomiono linię '+name)}draft=[];save();render();toast('Linia gotowa!')}
function advance(){if(!state.city)state.city={population:285000,growth:0,marketing:0,loans:0,events:[],upgrades:[],reputation:55};const c=state.city;const served=state.lines.length*3+state.stops.length;const delta=Math.round((Math.random()*2-0.65)*220+served*9);c.population=Math.max(25000,c.population+delta);c.growth=delta;c.reputation=Math.max(0,Math.min(100,c.reputation+(satisfaction()>65?1:-1)));if(state.month%4===0){const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];c.events.unshift('M'+state.month+': '+ev[0]);c.events=c.events.slice(0,8);changeMoney(ev[1]);addLog(ev[0]+' ('+(ev[1]>0?'+':'')+fmt(ev[1])+' zł)')}state.weather=['clear','clear','rain','snow'][Math.floor(Math.random()*4)];for(const l of state.lines){const breakdown=Math.random()<Math.max(.02,(105-(l.reliability||95))/160);if(breakdown){l.reliability=Math.max(45,(l.reliability||95)-Math.round(3+Math.random()*9));l.breakdowns=(l.breakdowns||0)+1;addLog('Awaria na linii '+l.name)}else l.reliability=Math.min(100,(l.reliability||95)+1)}if(state.month%3===0&&state.rivals.length<9){const types=['bus','tram','metro'],t=types[Math.floor(Math.random()*3)];state.rivals.push({name:['Mobilis','CityLink','MetroExpress','UrbanGo','TransPol','NovaBus'][state.rivals.length%6]+' '+(state.rivals.length+1),type:t,stops:3+Math.floor(Math.random()*9)});addLog('Konkurencja uruchomiła linię '+LABEL[t])}for(const r of state.rivals)if(Math.random()<.2)r.stops++;const m=monthly();state.history.push({month:state.month,profit:m.profit,riders:m.passengers});state.history=state.history.slice(-36);changeMoney(m.profit);state.month++;addLog(`Bilans: ${m.profit>=0?'+':''}${fmt(m.profit)} zł, ${fmt(m.passengers)} pasażerów dziennie`);save();render();toast(`Miesiąc ${state.month}: ${m.profit>=0?'+':''}${fmt(m.profit)} zł`)}
map.on('click',e=>{if(tab==='build'&&mode!=='inspect'){if(!charge(COST[mode]))return;const near=state.stops.some(s=>km(s,e.latlng)<.075);if(near){changeMoney(COST[mode]);toast('Przystanki muszą być oddalone od siebie o co najmniej 75 m');return}const s={id:state.nextId++,type:mode,name:`${LABEL[mode]} ${state.stops.filter(x=>x.type===mode).length+1}`,lat:e.latlng.lat,lng:e.latlng.lng};state.stops.push(s);addLog('Zbudowano '+s.name);save();render();toast('Zbudowano '+s.name)}else if(tab==='lines'){const type=$('lineType').value;let nearest=null,dist=Infinity;for(const s of state.stops){if(s.type!==type)continue;const d=map.latLngToContainerPoint([s.lat,s.lng]).distanceTo(map.latLngToContainerPoint(e.latlng));if(d<dist){dist=d;nearest=s}}if(nearest&&dist<27){draft.push(nearest.id);render();toast('Dodano: '+nearest.name)}else toast('Kliknij bliżej znacznika przystanku odpowiedniego typu')}});
function moveVehicles(t){vehicleLayer.clearLayers();for(const line of state.lines){const points=lineCoords(line);if(points.length<2)continue;const segments=[],total=points.reduce((n,p,i)=>{if(i){const d=km({lat:points[i-1][0],lng:points[i-1][1]},{lat:p[0],lng:p[1]});segments.push(d);return n+d}return n},0);if(!total)continue;for(let i=0;i<Math.min(line.vehicles,12);i++){let d=((t/(line.type==='metro'?9000:line.type==='tram'?14000:17000)+i/line.vehicles)%1)*total;let j=0;while(j<segments.length-1&&d>segments[j]){d-=segments[j];j++}const a=points[j],b=points[j+1],f=Math.min(1,d/Math.max(.001,segments[j]));L.marker([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f],{interactive:false,icon:L.divIcon({className:'',html:`<div class="vehicle">${ICON[line.type]}</div>`,iconSize:[25,25],iconAnchor:[12,12]})}).addTo(vehicleLayer)}}}
let last=0;function animate(t){if(t-last>350){moveVehicles(t);last=t}requestAnimationFrame(animate)}requestAnimationFrame(animate);
$('next').onclick=advance;$('toggle').onclick=()=>{$('app').classList.toggle('collapsed');$('toggle').textContent=$('app').classList.contains('collapsed')?'☰ Otwórz':'☰ Panel'};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draft=[];editing=null;render()});render();syncRouting();setTimeout(()=>map.invalidateSize(),300);
})();
