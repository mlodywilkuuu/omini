<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ropucha Group Tycoon</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root{
 --bg:#0b0f0d;--panel:#111713;--panel2:#18201b;--card:#1d2721;
 --line:#2b3830;--green:#38d66b;--green2:#1d9e4b;
 --text:#f3f7f4;--muted:#8fa096;--red:#ff5d67;--orange:#ffad4d;
 --blue:#55a7ff;--purple:#ae7aff;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
#map{position:fixed;left:220px;top:0;right:0;bottom:0;z-index:1;background:#121712}

/* SIDEBAR */
#sidebar{
 position:fixed;left:0;top:0;bottom:0;width:220px;z-index:5000;
 background:#0d120f;border-right:1px solid var(--line);overflow:auto;padding:10px
}
.logo{font-size:18px;font-weight:900;color:#67ed8c;padding:12px 8px 16px}
.logo small{display:block;color:#65756b;font-size:9px;letter-spacing:2px;margin-top:3px}
.navLabel{font-size:9px;color:#56665c;font-weight:800;letter-spacing:1.3px;margin:15px 9px 5px}
.nav{
 display:flex;align-items:center;gap:9px;width:100%;border:0;border-radius:7px;
 background:transparent;color:#9bac9f;padding:9px;text-align:left;margin:2px 0
}
.nav:hover{background:#18221b;color:white}
.nav.active{background:#153d24;color:#7af09a}
.nav span{width:21px;text-align:center}

/* TOP */
#top{
 position:fixed;left:235px;top:12px;right:15px;z-index:4000;
 display:flex;justify-content:space-between;pointer-events:none
}
.huds{display:flex;gap:6px}
.hud{
 background:#0d120feb;border:1px solid var(--line);padding:7px 11px;border-radius:8px;
 min-width:90px;box-shadow:0 4px 15px #0005
}
.hud small{display:block;font-size:8px;color:#77867d;font-weight:800}
.hud strong{font-size:13px}
.time{pointer-events:auto;background:#0d120feb;border:1px solid var(--line);border-radius:8px;padding:5px}
.time button{border:0;background:#202a23;color:#aaa;border-radius:5px;padding:6px 9px}
.time button.active{background:var(--green2);color:white}

/* PANEL */
#panel{
 position:fixed;z-index:4500;left:220px;top:0;bottom:0;width:510px;
 background:#101612f7;border-right:1px solid var(--line);overflow:auto;padding:18px;
 box-shadow:15px 0 35px #0007
}
#panel.hidden{display:none}
.title{font-size:22px;font-weight:900;margin-bottom:4px}
.subtitle{font-size:11px;color:var(--muted);margin-bottom:16px}
.tabs{display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#18201b;color:#9dac9f;border-radius:6px;padding:7px 10px}
.tab.active{background:#205832;color:white;border-color:#347a49}
.card{
 background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px
}
.card:hover{border-color:#3b4c40}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px}
.kpi{background:#18211b;border:1px solid var(--line);border-radius:9px;padding:12px}
.kpi small{display:block;color:#7c8e82;font-size:9px;font-weight:800}
.kpi strong{font-size:18px}
.row{display:flex;justify-content:space-between;gap:10px;margin:6px 0;font-size:12px;color:#9cac9f}
.row b{color:white;text-align:right}
.green{color:#64e889!important}.red{color:var(--red)!important}.orange{color:var(--orange)!important}.blueText{color:var(--blue)!important}
.muted{font-size:11px;color:var(--muted);line-height:1.45}
.btn{
 width:100%;border:0;border-radius:6px;padding:8px;background:#237944;color:white;
 font-weight:800;margin-top:5px
}
.btn:hover{filter:brightness(1.12)}
.btn.blue{background:#28649f}.btn.redBtn{background:#8e3940}.btn.orangeBtn{background:#a76428}
.btn.gray{background:#3a463e}.btn.purple{background:#654a8f}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
input,select{
 background:#101612;border:1px solid #35443a;color:white;border-radius:6px;padding:8px
}
.full{width:100%}
.badge{display:inline-block;padding:3px 7px;border-radius:12px;background:#344139;font-size:9px;margin:2px}
.badge.ok{background:#18552c;color:#83f3a1}
.badge.warn{background:#65491c;color:#ffd08b}
.badge.bad{background:#61282c;color:#ff9da4}
.sectionTitle{font-size:12px;font-weight:900;color:#d8e3da;margin:16px 0 7px}
.empty{padding:25px;text-align:center;color:#718078;border:1px dashed #354239;border-radius:9px}

/* TABLE */
.table{width:100%;border-collapse:collapse;font-size:11px}
.table th{text-align:left;color:#73847a;padding:7px;border-bottom:1px solid var(--line)}
.table td{padding:8px 7px;border-bottom:1px solid #273129}
.table tr:hover td{background:#202a23}

/* MODAL */
#modalBg{display:none;position:fixed;inset:0;background:#000c;z-index:60000;align-items:center;justify-content:center}
#modal{background:#121914;border:1px solid #3b4a40;border-radius:12px;width:min(1100px,96vw);max-height:94vh;overflow:auto;padding:17px}
.close{float:right;border:0;border-radius:6px;background:#7d3238;color:white;padding:7px 11px}

/* STORE EDITOR */
.editorWrap{display:grid;grid-template-columns:200px 1fr;gap:12px}
.palette{background:#18201b;border-radius:8px;padding:8px;max-height:75vh;overflow:auto}
.palette button{width:100%;background:#253029;color:#ddd;border:1px solid #39473e;padding:7px;text-align:left;border-radius:5px;margin:2px 0}
.storeGrid{display:grid;gap:2px;background:#080b09;padding:4px;border:2px solid #48554c;width:min(690px,68vw);aspect-ratio:1}
.cell{border:1px solid #354139;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}
.cell.sales{background:#243126}.cell.backroom{background:#3c3325}
.cell:hover{outline:2px solid #5ce782}

/* MAP */
.mapMarker{width:30px;height:30px;border-radius:9px;border:2px solid white;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 4px 10px #0008}
.storeM{background:#18733b}.centerM{background:#2868a3}.factoryM{background:#9b622d}
#mapFilters{
 position:fixed;right:15px;bottom:15px;z-index:4000;background:#0d120fe8;border:1px solid var(--line);
 padding:7px;border-radius:8px
}
#mapFilters label{font-size:10px;margin-right:8px}
#buildInfo{display:none;position:fixed;z-index:50000;bottom:20px;left:50%;transform:translateX(-50%);background:#111;border:1px solid #4a5c50;padding:10px 18px;border-radius:7px}

/* TOAST */
#notes{position:fixed;right:12px;bottom:60px;width:300px;z-index:70000}
.note{background:#121914;border:1px solid #35463b;border-left:4px solid #49db73;padding:9px;border-radius:7px;margin-top:5px;font-size:11px}

/* CONSOLE */
#console{display:none;position:fixed;z-index:90000;width:min(700px,94vw);height:420px;left:50%;top:50%;transform:translate(-50%,-50%);background:#060907f8;border:1px solid #42ce69;border-radius:8px}
#consoleHistory{height:360px;overflow:auto;padding:10px;white-space:pre-wrap;font-family:monospace;font-size:12px}
#consoleInput{width:100%;height:58px;border:0;border-top:1px solid #294b33;background:#0b100d;color:white;font-family:monospace}
.progress{height:7px;background:#303b33;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#49db73}
.tree{border-left:1px solid #3b493f;margin:8px 0 8px 12px;padding-left:10px}

@media(max-width:900px){
 #sidebar{width:70px}.logo{font-size:0}.logo:before{content:"🐸";font-size:25px}
 .navLabel{display:none}.nav{justify-content:center;font-size:0}.nav span{font-size:20px}
 #map{left:70px}#panel{left:70px;width:360px}#top{left:82px}
}
</style>
</head>

<body>

<div id="map"></div>

<div id="sidebar">
 <div class="logo">🐸 ROPUCHA GROUP<small>RETAIL EMPIRE</small></div>

 <div class="navLabel">GŁÓWNE</div>
 <button class="nav active" data-sec="map" onclick="openSection('map',this)"><span>🗺️</span>Mapa</button>
 <button class="nav" data-sec="dashboard" onclick="openSection('dashboard',this)"><span>📊</span>Dashboard</button>

 <div class="navLabel">SIEĆ</div>
 <button class="nav" data-sec="stores" onclick="openSection('stores',this)"><span>🏪</span>Sklepy</button>
 <button class="nav" data-sec="employees" onclick="openSection('employees',this)"><span>👥</span>Pracownicy</button>
 <button class="nav" data-sec="design" onclick="openSection('design',this)"><span>📐</span>Projekt sklepu</button>
 <button class="nav" data-sec="prices" onclick="openSection('prices',this)"><span>🏷️</span>Ceny i promocje</button>
 <button class="nav" data-sec="franchise" onclick="openSection('franchise',this)"><span>🤝</span>Franczyza</button>

 <div class="navLabel">OPERACJE</div>
 <button class="nav" data-sec="logistics" onclick="openSection('logistics',this)"><span>🚛</span>Logistyka</button>
 <button class="nav" data-sec="companies" onclick="openSection('companies',this)"><span>🏭</span>Producenci</button>
 <button class="nav" data-sec="ideas" onclick="openSection('ideas',this)"><span>💡</span>R&D</button>

 <div class="navLabel">GRUPA</div>
 <button class="nav" data-sec="holding" onclick="openSection('holding',this)"><span>🏛️</span>Holding</button>
 <button class="nav" data-sec="finance" onclick="openSection('finance',this)"><span>💰</span>Finanse</button>
 <button class="nav" data-sec="news" onclick="openSection('news',this)"><span>📰</span>Wiadomości</button>
</div>

<div id="panel" class="hidden"></div>

<div id="top">
 <div class="huds">
  <div class="hud"><small>GOTÓWKA</small><strong id="hudMoney" class="green"></strong></div>
  <div class="hud"><small>SKLEPY</small><strong id="hudStores"></strong></div>
  <div class="hud"><small>CENTRA</small><strong id="hudCenters"></strong></div>
  <div class="hud"><small>DZIEŃ</small><strong id="hudDate"></strong></div>
 </div>
 <div class="time">
  <button id="sp0" onclick="setSpeed(0)">⏸</button>
  <button id="sp1" class="active" onclick="setSpeed(1)">1×</button>
  <button id="sp2" onclick="setSpeed(2)">2×</button>
  <button id="sp5" onclick="setSpeed(5)">5×</button>
  <button id="sp10" onclick="setSpeed(10)">10×</button>
 </div>
</div>

<div id="mapFilters">
 <label><input type="checkbox" checked onchange="toggleLayer('stores',this.checked)"> 🏪 Sklepy</label>
 <label><input type="checkbox" checked onchange="toggleLayer('centers',this.checked)"> 📦 Centra</label>
 <label><input type="checkbox" checked onchange="toggleLayer('factories',this.checked)"> 🏭 Fabryki</label>
 <label><input type="checkbox" checked onchange="toggleLayer('routes',this.checked)"> 🚛 Trasy</label>
</div>

<div id="buildInfo"></div>
<div id="notes"></div>

<div id="modalBg"><div id="modal"></div></div>

<div id="console">
 <div id="consoleHistory">ROPUCHA DEV CONSOLE
Wpisz: help</div>
 <input id="consoleInput" placeholder="komenda...">
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================================
   ROPUCHA GROUP TYCOON
   ========================================================= */

const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const rndf=(a,b)=>Math.random()*(b-a)+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cash=n=>Math.round(n).toLocaleString("pl-PL")+" zł";
const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");

let money=500000,day=1,month=1,year=2026,speed=1,current="map";
let maxStaff=200,maxFranchisees=50,maxDrivers=100;

let stores=[],employees=[],franchisees=[],companies=[],subsidiaries=[];
let centers=[],drivers=[],trucks=[],routes=[],ideas=[],news=[];

let ids={store:1,employee:1,franchise:1,company:1,factory:1,sub:1,center:1,driver:1,truck:1,route:1,idea:1};

let buildMode=null,pendingStoreSize="standard";
let editorStore=null,editorTool="shelf",editorZone=null;
let logisticsTab="centers",employeeTab="staff",companyTab="market";

let totals={sales:0,franchise:0,dividends:0,wages:0,fuel:0};

const PLACES=[
["Warszawa","Polska",52.2297,21.0122],["Białystok","Polska",53.1325,23.1688],
["Gdańsk","Polska",54.352,18.6466],["Kraków","Polska",50.0647,19.945],
["Poznań","Polska",52.4064,16.9252],["Wrocław","Polska",51.1079,17.0385],
["Łódź","Polska",51.7592,19.456],["Lublin","Polska",51.2465,22.5684],
["Berlin","Niemcy",52.52,13.405],["Hamburg","Niemcy",53.5511,9.9937],
["Praga","Czechy",50.0755,14.4378],["Brno","Czechy",49.1951,16.6068],
["Paryż","Francja",48.8566,2.3522],["Londyn","Wielka Brytania",51.5074,-.1278],
["Madryt","Hiszpania",40.4168,-3.7038],["Rzym","Włochy",41.9028,12.4964],
["Amsterdam","Holandia",52.3676,4.9041],["Wiedeń","Austria",48.2082,16.3738],
["Nowy Jork","USA",40.7128,-74.006],["Chicago","USA",41.8781,-87.6298],
["Los Angeles","USA",34.0522,-118.2437],["Toronto","Kanada",43.6532,-79.3832],
["Tokio","Japonia",35.6762,139.6503],["Seul","Korea Południowa",37.5665,126.978],
["Sydney","Australia",-33.8688,151.2093],["São Paulo","Brazylia",-23.5505,-46.6333],
["Dubaj","ZEA",25.2048,55.2708]
];

const PRODUCTS=[
{id:"coffee",n:"Kawa",e:"☕",cost:2.1,price:7.49},
{id:"hotdog",n:"Hot-dog",e:"🌭",cost:3.2,price:7.99},
{id:"pizza",n:"Pizza",e:"🍕",cost:7,price:15.99},
{id:"drink",n:"Napój",e:"🥤",cost:2.8,price:6.49},
{id:"sandwich",n:"Kanapka",e:"🥪",cost:5,price:11.99},
{id:"bun",n:"Bułka",e:"🥖",cost:1.1,price:3.49},
{id:"ice",n:"Lody",e:"🍦",cost:3.3,price:7.99},
{id:"scratch",n:"Zdrapka",e:"🎟️",cost:4.2,price:5},
{id:"game",n:"Gra promocyjna",e:"🎮",cost:3.3,price:4}
];

let prices={};
PRODUCTS.forEach(p=>prices[p.id]={price:p.price,discount:0,days:0});

const STORE_SIZES={
mini:{name:"Mini",grid:8,cost:70000},
standard:{name:"Standard",grid:12,cost:130000},
large:{name:"Duży",grid:16,cost:230000},
mega:{name:"Mega",grid:20,cost:400000}
};

const EQUIPMENT={
shelf:{n:"Regał",e:"🗄️",cost:6000},
fridge:{n:"Lodówka",e:"🧊",cost:18000},
checkout:{n:"Kasa",e:"💳",cost:15000},
self:{n:"Kasa samoobsługowa",e:"🤖",cost:45000},
coffee:{n:"Ekspres",e:"☕",cost:28000},
hotdog:{n:"Hot-dog",e:"🌭",cost:24000},
pizza:{n:"Piec",e:"🍕",cost:45000},
printer:{n:"Drukarka",e:"🖨️",cost:12000},
parcel:{n:"Paczki",e:"📦",cost:15000},
games:{n:"Terminal gier",e:"🎟️",cost:18000},
warehouse:{n:"Regał magazynowy",e:"📦",cost:8000,back:true},
cold:{n:"Chłodnia",e:"🧊",cost:35000,back:true},
delivery:{n:"Strefa dostaw",e:"🚚",cost:20000,back:true},
staff:{n:"Pokój pracowników",e:"👥",cost:18000,back:true},
door:{n:"Drzwi",e:"🚪",cost:1500}
};

/* =========================================================
   MAP
========================================================= */

const map=L.map("map",{
 zoomControl:true,
 scrollWheelZoom:false,
 zoomAnimation:false,
 fadeAnimation:false,
 markerZoomAnimation:false,
 minZoom:2,maxZoom:18
}).setView([52,19],5);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
 maxZoom:18,
 attribution:"&copy; OpenStreetMap contributors"
}).addTo(map);

/* scroll zmienia zoom wokół środka i nie przesuwa mapy */
document.getElementById("map").addEventListener("wheel",e=>{
 e.preventDefault();
 e.stopPropagation();

 const center=map.getCenter();
 const newZoom=clamp(map.getZoom()+(e.deltaY<0?1:-1),2,18);

 map.setView(center,newZoom,{animate:false});
},{passive:false,capture:true});

const layers={
 stores:L.layerGroup().addTo(map),
 centers:L.layerGroup().addTo(map),
 factories:L.layerGroup().addTo(map),
 routes:L.layerGroup().addTo(map)
};

function toggleLayer(type,on){
 if(on)layers[type].addTo(map);
 else map.removeLayer(layers[type]);
}

function mapIcon(emoji,cls){
 return L.divIcon({
  className:"",
  html:`<div class="mapMarker ${cls}">${emoji}</div>`,
  iconSize:[30,30],
  iconAnchor:[15,15]
 });
}

const icons={
 store:mapIcon("🏪","storeM"),
 center:mapIcon("📦","centerM"),
 factory:mapIcon("🏭","factoryM")
};

function nearestPlace(lat,lng){
 let best=PLACES[0],dist=Infinity;
 PLACES.forEach(p=>{
  const d=(lat-p[2])**2+(lng-p[3])**2;
  if(d<dist){dist=d;best=p}
 });
 return best;
}

/* =========================================================
   HELPERS
========================================================= */

function person(){
 return pick(["Jan","Adam","Marek","Kamil","Jakub","Michał","Anna","Julia","Zofia","Natalia","Oliwia"])+" "+
 pick(["Nowak","Kowalski","Wójcik","Mazur","Lis","Król","Zieliński","Lewandowski"]);
}

function notify(text){
 const n=document.createElement("div");
 n.className="note";
 n.textContent=text;
 document.getElementById("notes").appendChild(n);
 setTimeout(()=>n.remove(),4000);
}

function addNews(text){
 news.unshift({day,month,year,text});
 news=news.slice(0,150);
}

function changeMoney(amount){
 money+=amount;
 hud();
}

function modal(html){
 document.getElementById("modal").innerHTML=html;
 document.getElementById("modalBg").style.display="flex";
}

function closeModal(){
 document.getElementById("modalBg").style.display="none";
}

function productPrice(id){
 const x=prices[id];
 return x.price*(x.days>0?(1-x.discount/100):1);
}

/* =========================================================
   FRANCHISE
========================================================= */

function recruitFranchise(){
 if(franchisees.length>=maxFranchisees)return notify("Osiągnięto limit franczyzobiorców.");
 if(money<10000)return notify("Potrzeba 10 000 zł.");
 changeMoney(-10000);

 franchisees.push({
  id:ids.franchise++,
  name:person(),
  skill:rnd(1,10),
  stores:[],
  paid:0
 });

 render();
}

/* =========================================================
   STORES
========================================================= */

function emptyLayout(n){
 return Array.from({length:n},(_,y)=>
  Array.from({length:n},()=>({
   zone:y>=Math.floor(n*.72)?"backroom":"sales",
   eq:null,
   plan:[]
  }))
 );
}

function openBuildStore(){
 if(!franchisees.length)return notify("Najpierw zrekrutuj franczyzobiorcę.");

 modal(`
 <button class="close" onclick="closeModal()">X</button>
 <h2>🏪 Nowy sklep</h2>

 <select id="storeSize" class="full">
 ${Object.entries(STORE_SIZES).map(([k,v])=>
 `<option value="${k}">${v.name} — ${v.grid}×${v.grid} — ${cash(v.cost)}</option>`
 ).join("")}
 </select>

 <button class="btn" onclick="startBuildStore()">🗺️ Wybierz miejsce na mapie</button>
 `);
}

function startBuildStore(){
 pendingStoreSize=document.getElementById("storeSize").value;

 if(money<STORE_SIZES[pendingStoreSize].cost)
  return notify("Za mało pieniędzy.");

 buildMode="store";
 closeModal();

 const b=document.getElementById("buildInfo");
 b.style.display="block";
 b.textContent="🏪 Kliknij miejsce sklepu na mapie";
}

function createStore(lat,lng){
 const size=STORE_SIZES[pendingStoreSize];

 changeMoney(-size.cost);

 const p=nearestPlace(lat,lng);

 const f=franchisees
  .slice()
  .sort((a,b)=>a.stores.length-b.stores.length)[0];

 const s={
  id:ids.store++,
  name:"Ropucha #"+ids.store,
  lat,lng,
  city:p[0],
  country:p[1],
  size:pendingStoreSize,
  layout:emptyLayout(size.grid),
  franchiseId:f?.id||null,
  employees:[],
  stock:{},
  sales:0,
  customers:0,
  ideas:[],
  subsidiaryId:null,
  marker:null
 };

 PRODUCTS.forEach(x=>s.stock[x.id]=rnd(20,60));

 stores.push(s);

 if(f)f.stores.push(s.id);

 s.marker=L.marker([lat,lng],{icon:icons.store})
  .addTo(layers.stores);

 updateStorePopup(s);

 addNews(`🏪 Otwarto ${s.name} w pobliżu ${s.city}.`);
 render();
}

function updateStorePopup(s){
 if(!s.marker)return;

 s.marker.bindPopup(`
 <b>${esc(s.name)}</b><br>
 📍 ${esc(s.city)}, ${esc(s.country)}<br>
 💰 ${cash(s.sales)}<br>
 📦 ${Object.values(s.stock).reduce((a,b)=>a+b,0)} szt.
 `);

 s.marker.off("click");
 s.marker.on("click",()=>{
  current="stores";
  document.getElementById("panel").classList.remove("hidden");
  renderSection();
 });

function drawEditor(){
 const s=stores.find(x=>x.id===editorStore);
 if(!s)return;

 const n=STORE_SIZES[s.size].grid;

 modal(`
 <button class="close" onclick="closeModal()">X</button>
 <h2>📐 ${esc(s.name)}</h2>

 <div class="editorWrap">
  <div class="palette">

   <button onclick="editorZone='sales';editorTool=null;drawEditor()">🟩 Sala sprzedaży</button>
   <button onclick="editorZone='backroom';editorTool=null;drawEditor()">🟫 Zaplecze</button>

   ${Object.entries(EQUIPMENT).map(([k,e])=>`
   <button onclick="editorTool='${k}';editorZone=null;drawEditor()">
    ${e.e} ${e.n}<br>
    <small>${cash(e.cost)}</small>
   </button>`).join("")}

   <button onclick="editorTool='erase';editorZone=null;drawEditor()">🗑️ Usuń</button>
  </div>

  <div class="storeGrid" style="grid-template-columns:repeat(${n},1fr)">
   ${s.layout.flatMap((row,y)=>row.map((c,x)=>`
   <div class="cell ${c.zone}" onclick="editorCell(${x},${y})">
    ${c.eq?EQUIPMENT[c.eq].e:""}
   </div>`)).join("")}
  </div>
 </div>
 `);
}

function editorCell(x,y){
 const s=stores.find(a=>a.id===editorStore);
 const c=s.layout[y][x];

 if(editorZone){
  if(c.eq)return notify("Usuń najpierw sprzęt.");
  c.zone=editorZone;
  return drawEditor();
 }

 if(editorTool==="erase"){
  c.eq=null;
  c.plan=[];
  return drawEditor();
 }

 if(c.eq===editorTool)
  return openPlanogram(x,y);

 const e=EQUIPMENT[editorTool];
 if(!e)return;

 if(e.back&&c.zone!=="backroom")
  return notify("Ten sprzęt musi być na zapleczu.");

 if(!e.back&&c.zone==="backroom"&&editorTool!=="door")
  return notify("Ten sprzęt musi być na sali.");

 if(c.eq)return notify("Pole jest zajęte.");
 if(money<e.cost)return notify("Za mało pieniędzy.");

 changeMoney(-e.cost);

 c.eq=editorTool;
 c.plan=[];

 drawEditor();
}

function openPlanogram(x,y){
 const s=stores.find(a=>a.id===editorStore);
 const c=s.layout[y][x];

 modal(`
 <button class="close" onclick="drawEditor()">←</button>
 <h2>📦 Planogram</h2>

 ${PRODUCTS.map(p=>`
 <label class="card" style="display:block">
 <input type="checkbox"
 ${c.plan.includes(p.id)?"checked":""}
 onchange="togglePlan(${x},${y},'${p.id}',this.checked)">
 ${p.e} ${p.n}
 </label>`).join("")}

 <button class="btn" onclick="drawEditor()">Gotowe</button>
 `);
}

function togglePlan(x,y,p,on){
 const s=stores.find(a=>a.id===editorStore);
 const c=s.layout[y][x];

 if(on&&!c.plan.includes(p))c.plan.push(p);
 if(!on)c.plan=c.plan.filter(x=>x!==p);
}

function createRoute(){
 const centerId=Number(document.getElementById("routeCenter").value);
 const driverId=Number(document.getElementById("routeDriver").value);
 const truckId=Number(document.getElementById("routeTruck").value);

 const storeIds=[...document.querySelectorAll(".routeStore:checked")]
  .map(x=>Number(x.value));

 const frequency=Number(document.getElementById("routeFrequency").value);

 if(!driverId||!truckId)
  return notify("Potrzebujesz wolnego kierowcy i ciężarówki.");

 if(!storeIds.length)
  return notify("Wybierz przynajmniej jeden sklep.");

 const r={
  id:ids.route++,
  centerId,
  driverId,
  truckId,
  storeIds,
  frequency,
  active:true,
  lastDelivery:0,
  distance:0,
  line:null
 };

 const c=centers.find(x=>x.id===centerId);

 let prev=[c.lat,c.lng];
 let distance=0;

 storeIds.forEach(id=>{
  const s=stores.find(x=>x.id===id);
  distance+=map.distance(prev,[s.lat,s.lng])/1000;
  prev=[s.lat,s.lng];
 });

 r.distance=Math.round(distance);

 routes.push(r);

 const d=drivers.find(x=>x.id===driverId);
 const t=trucks.find(x=>x.id===truckId);

 d.routeId=r.id;
 d.centerId=centerId;

 t.routeId=r.id;
 t.centerId=centerId;
 t.driverId=driverId;

 drawRoute(r);

 closeModal();

 logisticsTab="routes";

 addNews(`🚛 Utworzono trasę #${r.id}.`);

 render();
}

function drawRoute(r){
 if(r.line){
  layers.routes.removeLayer(r.line);
 }

 const c=centers.find(x=>x.id===r.centerId);
 if(!c)return;

 const points=[[c.lat,c.lng]];

 r.storeIds.forEach(id=>{
  const s=stores.find(x=>x.id===id);
  if(s)points.push([s.lat,s.lng]);
 });

 r.line=L.polyline(points,{
  weight:3,
  opacity:.65,
  dashArray:"8 6"
 }).addTo(layers.routes);

 r.line.bindPopup(`
 🚛 Trasa #${r.id}<br>
 ${r.distance} km<br>
 ${r.storeIds.length} sklepów
 `);
}

function toggleRoute(id){
 const r=routes.find(x=>x.id===id);
 r.active=!r.active;

 if(r.active)drawRoute(r);
 else if(r.line){
  layers.routes.removeLayer(r.line);
  r.line=null;
 }

 render();
}

function deleteRoute(id){
 const i=routes.findIndex(x=>x.id===id);
 if(i<0)return;

 const r=routes[i];

 if(r.line)layers.routes.removeLayer(r.line);

 const d=drivers.find(x=>x.id===r.driverId);
 const t=trucks.find(x=>x.id===r.truckId);

 if(d){
  d.routeId=null;
  d.status="free";
 }

 if(t){
  t.routeId=null;
  t.driverId=null;
 }

 routes.splice(i,1);

 render();
}

function processRoutes(){
 routes.filter(r=>r.active).forEach(r=>{
  if((day+r.id)%r.frequency!==0)return;

  const c=centers.find(x=>x.id===r.centerId);
  const t=trucks.find(x=>x.id===r.truckId);
  const d=drivers.find(x=>x.id===r.driverId);

  if(!c||!t||!d)return;

  d.status="route";

  let capacity=t.capacity;

  r.storeIds.forEach(sid=>{
   const s=stores.find(x=>x.id===sid);
   if(!s)return;

   PRODUCTS.forEach(p=>{
    if(capacity<=0)return;

    const wanted=Math.max(0,120-(s.stock[p.id]||0));
    const available=c.stock[p.id]||0;

    const qty=Math.min(wanted,available,capacity);

    if(qty>0){
     c.stock[p.id]-=qty;
     s.stock[p.id]=(s.stock[p.id]||0)+qty;
     capacity-=qty;
    }
   });
  });

  const fuel=Math.round(r.distance*2.4);

  changeMoney(-fuel);
  totals.fuel+=fuel;

  t.mileage+=r.distance;
  t.condition=clamp(t.condition-r.distance*.001,0,100);

  r.lastDelivery=day;

  d.status="free";
 });
}

function processStores(){
 let groupIncome=0;

 stores.forEach(s=>{
  let customers=20+rnd(5,40);

  const staff=employees.filter(e=>
   e.status==="employed"&&e.storeId===s.id
  );

  customers+=Math.floor(
   staff.reduce((a,e)=>a+e.skill,0)*.5
  );

  s.sales=0;
  s.customers=0;

  for(let i=0;i<customers;i++){
   const available=PRODUCTS.filter(p=>
    (s.stock[p.id]||0)>0
   );

   if(!available.length)break;

   const p=pick(available);
   const price=productPrice(p.id);

   if(Math.random()<.75){
    s.stock[p.id]--;
    s.sales+=price;
    s.customers++;
   }
  }

  s.ideas.forEach(id=>{
   const idea=ideas.find(x=>x.id===id);
   if(idea)s.sales*=1+idea.bonus;
  });

  groupIncome+=s.sales*.15;
  totals.sales+=s.sales;

  updateStorePopup(s);
 });

 changeMoney(Math.round(groupIncome));
}

function processFranchise(){
 let income=0;

 franchisees.forEach(f=>{
  let x=0;

  f.stores.forEach(id=>{
   const s=stores.find(a=>a.id===id);
   if(s)x+=s.sales*(.08+f.skill*.004);
  });

  x=Math.round(x);
  f.paid+=x;
  income+=x;
 });

 totals.franchise+=income;
 changeMoney(income);
}

function processCompanies(){
 companies.forEach(c=>{
  c.valuation=Math.max(
   100000,
   Math.round(c.valuation*(1+rndf(-.003,.009)))
  );

  if(c.shares>0){
   const dividend=Math.round(
    c.profit*.04*c.shares/100
   );

   totals.dividends+=dividend;
   changeMoney(dividend);
  }

  if(Math.random()<.012&&c.factories.length<8)
   createFactory(c,false);
 });
}

function processPayroll(){
 const staff=employees
  .filter(e=>e.status==="employed")
  .reduce((a,e)=>a+e.salary,0);

 const driverPay=drivers.reduce((a,d)=>a+d.salary,0);

 const total=staff+driverPay+25000;

 changeMoney(-total);
 totals.wages+=staff+driverPay;

 processFranchise();
 processCompanies();

 Object.values(prices).forEach(x=>{
  if(x.days>0){
   x.days--;
   if(!x.days)x.discount=0;
  }
 });

 if(day>30){
  day=1;
  month++;

  if(month>12){
   month=1;
   year++;
  }

  processPayroll();
 }

 if(Math.random()<.08&&employees.filter(x=>x.status==="candidate").length<30)
  newCandidate();

 render();
}

 render();
}

function openSection(sec,button){
 current=sec;

 document.querySelectorAll(".nav").forEach(x=>
  x.classList.remove("active")
 );

 if(button)button.classList.add("active");

 const p=document.getElementById("panel");

 if(sec==="map"){
  p.classList.add("hidden");
 }else{
  p.classList.remove("hidden");
  renderSection();
 }

 setTimeout(()=>map.invalidateSize({pan:false}),0);
}

function saveGame(){
 const data={
  money,day,month,year,
  maxStaff,maxFranchisees,maxDrivers,
  stores:stores.map(({marker,...x})=>x),
  employees,
  franchisees,
  companies:companies.map(c=>({
   ...c,
   factories:c.factories.map(({marker,...f})=>f)
  })),
  subsidiaries,
  centers:centers.map(({marker,...x})=>x),
  drivers,
  trucks,
  routes:routes.map(({line,...x})=>x),
  ideas,
  news,
  prices,
  ids,
  totals
 };

 localStorage.setItem(
  "ropucha_logistics_v2",
  JSON.stringify(data)
 );

 notify("💾 Gra zapisana.");
}

function resetGame(){
 if(confirm("Na pewno rozpocząć nową grę?")){
  localStorage.removeItem("ropucha_logistics_v2");
  location.reload();
 }
}

/* =========================================================
   DEV CONSOLE
========================================================= */

let consoleOpen=false;

window.addEventListener("keydown",e=>{
 if(e.key==="`"||e.key==="~"){
  e.preventDefault();

  consoleOpen=!consoleOpen;

  document.getElementById("console").style.display=
   consoleOpen?"block":"none";

  if(consoleOpen)
   document.getElementById("consoleInput").focus();
 }

 if(e.key==="Escape"){
  buildMode=null;
  document.getElementById("buildInfo").style.display="none";
 }
});

document.getElementById("consoleInput")
.addEventListener("keydown",e=>{
 if(e.key!=="Enter")return;

 const input=e.target.value.trim();
 e.target.value="";

 const h=document.getElementById("consoleHistory");
 h.textContent+="\n> "+input;

 const a=input.split(/\s+/);
 const cmd=(a[0]||"").toLowerCase();
 const value=Number(a[1]);

 if(cmd==="help"){
  h.textContent+=`
help
kasa [kwota]
maxstaff [liczba]
maxfranczyzobiorcy [liczba]
maxkierowcy [liczba]
kandydat
dzien
save
status`;
 }

 else if(cmd==="kasa"&&Number.isFinite(value))
  money=value;

 else if(cmd==="maxstaff"&&Number.isFinite(value))
  maxStaff=Math.max(0,Math.floor(value));

 else if(cmd==="maxfranczyzobiorcy"&&Number.isFinite(value))
  maxFranchisees=Math.max(0,Math.floor(value));

 else if(cmd==="maxkierowcy"&&Number.isFinite(value))
  maxDrivers=Math.max(0,Math.floor(value));

 else if(cmd==="kandydat")
  newCandidate();

 else if(cmd==="dzien")
  gameDay();

 else if(cmd==="save")
  saveGame();

 else if(cmd==="status"){
  h.textContent+=`
Kasa: ${cash(money)}
Sklepy: ${stores.length}
Centra: ${centers.length}
Trasy: ${routes.length}
Kierowcy: ${drivers.length}
Ciężarówki: ${trucks.length}
Firmy: ${companies.length}`;
 }

 else
  h.textContent+="\nNieznana komenda.";

 render();

 h.scrollTop=h.scrollHeight;
});

/* =========================================================
   START
========================================================= */

/* startowi kandydaci */
for(let i=0;i<15;i++)
 newCandidate();

/* firmy na świecie */
for(let i=0;i<35;i++)
 generateCompany(true);

addNews("🐸 Ropucha Group rozpoczyna działalność z kapitałem 500 000 zł.");
addNews("🚛 Uruchomiono system centrów logistycznych, kierowców, ciężarówek i tras.");
addNews("🏭 Producenci rozwijają się automatycznie.");

render();
setSpeed(1);

/* automatyczne nowe firmy */
setInterval(()=>{
 if(companies.length<300){
  generateCompany(false);
  render();
 }
},25000);

/* rozwój istniejących firm */
setInterval(()=>{
 companies.forEach(c=>{
  c.valuation=Math.round(c.valuation*rndf(1.001,1.02));

  if(Math.random()<.08&&c.factories.length<10)
   createFactory(c,false);
 });

 render();
},45000);

/* kandydaci */
setInterval(()=>{
 if(employees.filter(e=>e.status==="candidate").length<35)
  newCandidate();
},40000);

</script>
