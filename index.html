<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ropucha Group Tycoon</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111;color:#fff}
button,input,select{font:inherit}
button{cursor:pointer}
#map{position:fixed;inset:0;background:#171717;z-index:1}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:230px;background:#101510f5;z-index:5000;border-right:1px solid #333;overflow:auto;padding:8px}
.logo{padding:14px;color:#70ef82;font-weight:900;font-size:18px}
.nav{width:100%;padding:10px;border:0;border-radius:7px;background:transparent;color:#bbb;text-align:left;margin:2px 0}
.nav:hover,.nav.active{background:#176d38;color:#fff}
#panel{position:fixed;left:230px;top:0;bottom:0;width:440px;background:#171a17f5;z-index:4500;border-right:1px solid #333;padding:14px;overflow:auto}
#panel.hidden{display:none}
#hud{position:fixed;top:10px;left:690px;right:10px;z-index:4000;display:flex;justify-content:center;gap:5px;pointer-events:none}
.hudBox{background:#101510e8;border:1px solid #333;border-radius:8px;padding:7px 10px;text-align:center;min-width:90px}
.hudBox small{display:block;color:#999;font-size:9px}
.hudBox strong{font-size:13px}
.title{font-size:21px;font-weight:900;margin-bottom:12px}
.box,.card{background:#252925;border:1px solid #393e39;border-radius:9px;padding:11px;margin-bottom:9px}
.row{display:flex;justify-content:space-between;gap:8px;margin:6px 0;color:#bbb;font-size:12px}
.row b{color:#fff;text-align:right}
.green{color:#72ef83!important}
.redText{color:#ff7474!important}
.orangeText{color:#ffb45f!important}
.muted{color:#969d96;font-size:11px;line-height:1.45}
.btn{width:100%;padding:8px;border:0;border-radius:6px;background:#176d38;color:#fff;font-weight:bold;margin-top:5px}
.blue{background:#28609e}.red{background:#963f3f}.orange{background:#a86627}.purple{background:#704c9a}.gray{background:#4d554d}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
input,select{background:#333;color:#fff;border:1px solid #555;border-radius:5px;padding:7px}
.full{width:100%}
.badge{display:inline-block;background:#444;border-radius:12px;padding:3px 7px;margin:2px;font-size:10px}
.progress{height:7px;background:#444;border-radius:8px;overflow:hidden;margin:6px 0}
.progress div{height:100%;background:#70e780}
.marker{width:32px;height:32px;border-radius:50%;border:3px solid white;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 3px 10px #0008}
.storeMarker{background:#17743b}
.factoryMarker{background:#9b612d}
.centerMarker{background:#28609e}
.competitorMarker{background:#963f3f}
#notifications{position:fixed;right:12px;bottom:12px;width:320px;z-index:50000}
.note{background:#101510f5;border-left:4px solid #70e780;border-radius:6px;padding:9px;margin-top:5px;font-size:12px}
.moneyFx{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:60000;font-size:25px;font-weight:900;animation:money 1.3s forwards;pointer-events:none}
@keyframes money{0%{opacity:0;transform:translate(-50%,20px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px)}}
#modalBg{display:none;position:fixed;inset:0;background:#000c;z-index:40000;align-items:center;justify-content:center}
#modal{width:min(1100px,96vw);max-height:94vh;overflow:auto;background:#191d19;border:1px solid #555;border-radius:12px;padding:15px}
.close{float:right;border:0;background:#963f3f;color:#fff;border-radius:5px;padding:7px 12px}
.editorWrap{display:grid;grid-template-columns:190px 1fr;gap:12px}
.palette{background:#202420;padding:10px;border-radius:8px;max-height:75vh;overflow:auto}
.palette button{width:100%;text-align:left;padding:8px;margin:3px 0;border:1px solid #444;background:#303630;color:#fff;border-radius:5px}
.palette button.selected{background:#176d38;border-color:#70ef82}
.storeGrid{display:grid;gap:2px;background:#111;padding:5px;border:2px solid #666;width:min(680px,70vw);aspect-ratio:1/1}
.cell{border:1px solid #3b413b;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;user-select:none}
.cell.sales{background:#263126}.cell.backroom{background:#3b3326}
.cell:hover{outline:2px solid #72ef83}
#buildInfo{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:20000;background:#111e;border:1px solid #555;padding:10px 20px;border-radius:8px}
#console{display:none;position:fixed;z-index:70000;left:50%;top:50%;transform:translate(-50%,-50%);width:min(700px,94vw);height:430px;background:#080b09f8;border:2px solid #64df74;border-radius:9px;overflow:hidden;font-family:Consolas,monospace}
#consoleHistory{height:360px;overflow:auto;padding:10px;white-space:pre-wrap}
#consoleInput{width:100%;height:50px;background:#101510;color:white;border:0;border-top:1px solid #315d38;padding:10px;outline:0}
.timebar{position:fixed;right:15px;top:60px;z-index:4000;background:#101510e8;padding:6px;border-radius:7px}
.timebar button{background:#333;color:white;border:0;padding:6px 9px;border-radius:4px}
.timebar button.active{background:#176d38}
.tree{margin-left:12px;border-left:1px solid #555;padding-left:10px}
@media(max-width:900px){#sidebar{width:72px}.logo{font-size:0}.logo:after{content:"🐸";font-size:24px}.nav{font-size:0;text-align:center}.nav span{font-size:20px}#panel{left:72px;width:340px}#hud{left:420px}}
</style>
</head>

<body>

<div id="map"></div>

<div id="sidebar">
<div class="logo">🐸 ROPUCHA GROUP</div>

<button class="nav active" onclick="section('map',this)"><span>🗺️</span> Mapa</button>
<button class="nav" onclick="section('dashboard',this)"><span>📊</span> Dashboard</button>
<button class="nav" onclick="section('stores',this)"><span>🏪</span> Sklepy</button>
<button class="nav" onclick="section('employees',this)"><span>👥</span> Pracownicy</button>
<button class="nav" onclick="section('design',this)"><span>📐</span> Projekt sklepu</button>
<button class="nav" onclick="section('prices',this)"><span>🏷️</span> Ceny</button>
<button class="nav" onclick="section('ideas',this)"><span>💡</span> Pomysły</button>
<button class="nav" onclick="section('franchise',this)"><span>🤝</span> Franczyza</button>
<button class="nav" onclick="section('companies',this)"><span>🏭</span> Producenci</button>
<button class="nav" onclick="section('holding',this)"><span>🏛️</span> Holding</button>
<button class="nav" onclick="section('logistics',this)"><span>🚛</span> Logistyka</button>
<button class="nav" onclick="section('finance',this)"><span>💰</span> Finanse</button>
<button class="nav" onclick="section('news',this)"><span>📰</span> Wiadomości</button>
</div>

<div id="panel" class="hidden"></div>

<div id="hud">
<div class="hudBox"><small>KASA</small><strong id="hMoney" class="green"></strong></div>
<div class="hudBox"><small>SKLEPY</small><strong id="hStores"></strong></div>
<div class="hudBox"><small>PRACOWNICY</small><strong id="hEmployees"></strong></div>
<div class="hudBox"><small>DZIEŃ</small><strong id="hDay"></strong></div>
<div class="hudBox"><small>MIESIĄC</small><strong id="hMonth"></strong></div>
</div>

<div class="timebar">
<button onclick="setSpeed(0)" id="sp0">⏸</button>
<button onclick="setSpeed(1)" id="sp1" class="active">1×</button>
<button onclick="setSpeed(2)" id="sp2">2×</button>
<button onclick="setSpeed(5)" id="sp5">5×</button>
<button onclick="setSpeed(10)" id="sp10">10×</button>
</div>

<div id="notifications"></div>
<div id="buildInfo"></div>

<div id="modalBg">
<div id="modal"></div>
</div>

<div id="console">
<div id="consoleHistory">DEV CONSOLE — wpisz help</div>
<input id="consoleInput" placeholder="komenda...">
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* ============================================================
   ROPUCHA GROUP TYCOON
============================================================ */

let money=500000,day=1,month=1,speed=1,current="map";
let maxEmployees=200,maxFranchisees=50,maxDrivers=100;

let stores=[],employees=[],franchisees=[],companies=[],subsidiaries=[];
let centers=[],drivers=[],trucks=[],ideas=[],news=[];
let nextStore=1,nextEmployee=1,nextFranchise=1,nextCompany=1;
let nextFactory=1,nextSubsidiary=1,nextCenter=1,nextIdea=1;

let totalSales=0,totalFranchise=0,totalDividends=0,totalWages=0;
let buildMode=null,pendingSize="standard",editorStore=null,editorTool="shelf",editorZone=null;

const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const rndf=(a,b)=>Math.random()*(b-a)+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const cash=v=>Math.round(v).toLocaleString("pl-PL")+" zł";
const esc=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");

function person(){
 return pick(["Jan","Adam","Kamil","Marek","Anna","Julia","Natalia","Zofia","Michał","Karol","Jakub"])+" "+
 pick(["Nowak","Kowalski","Mazur","Lis","Król","Wójcik","Zieliński","Lewandowski"]);
}

function notify(t){
 const e=document.createElement("div");
 e.className="note";e.textContent=t;
 document.getElementById("notifications").appendChild(e);
 setTimeout(()=>e.remove(),4000);
}

function addNews(t){news.unshift({day,month,text:t});news=news.slice(0,200)}

function changeMoney(v,fx=true){
 money+=v;
 if(fx){
  const e=document.createElement("div");
  e.className="moneyFx "+(v>=0?"green":"redText");
  e.textContent=(v>=0?"+":"")+cash(v);
  document.body.appendChild(e);setTimeout(()=>e.remove(),1300);
 }
 hud();
}

function modal(h){document.getElementById("modal").innerHTML=h;document.getElementById("modalBg").style.display="flex"}
function closeModal(){document.getElementById("modalBg").style.display="none"}

/* ================= MAPA ================= */

const map=L.map("map",{zoomControl:true,scrollWheelZoom:false,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false,minZoom:2,maxZoom:18}).setView([50,15],4);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
 maxZoom:18,
 attribution:"&copy; OpenStreetMap contributors"
}).addTo(map);

/* zoom zawsze wokół środka mapy */
document.getElementById("map").addEventListener("wheel",e=>{
 e.preventDefault();e.stopPropagation();
 const c=map.getCenter();
 const z=clamp(map.getZoom()+(e.deltaY<0?1:-1),2,18);
 map.setView(c,z,{animate:false});
},{passive:false,capture:true});

function icon(emoji,cls){
 return L.divIcon({className:"",html:`<div class="marker ${cls}">${emoji}</div>`,iconSize:[32,32],iconAnchor:[16,16]});
}
const storeIcon=icon("🏪","storeMarker"),factoryIcon=icon("🏭","factoryMarker"),centerIcon=icon("📦","centerMarker");

/* konkretne punkty - nazwa odpowiada markerowi */
const PLACES=[
 ["Warszawa","Polska",52.2297,21.0122],["Białystok","Polska",53.1325,23.1688],
 ["Kraków","Polska",50.0647,19.945],["Gdańsk","Polska",54.352,18.6466],
 ["Poznań","Polska",52.4064,16.9252],["Wrocław","Polska",51.1079,17.0385],
 ["Łódź","Polska",51.7592,19.456],["Lublin","Polska",51.2465,22.5684],
 ["Berlin","Niemcy",52.52,13.405],["Hamburg","Niemcy",53.5511,9.9937],
 ["Praga","Czechy",50.0755,14.4378],["Brno","Czechy",49.1951,16.6068],
 ["Paryż","Francja",48.8566,2.3522],["Lyon","Francja",45.764,4.8357],
 ["Londyn","Wielka Brytania",51.5074,-.1278],["Manchester","Wielka Brytania",53.4808,-2.2426],
 ["Madryt","Hiszpania",40.4168,-3.7038],["Rzym","Włochy",41.9028,12.4964],
 ["Mediolan","Włochy",45.4642,9.19],["Amsterdam","Holandia",52.3676,4.9041],
 ["Bruksela","Belgia",50.8503,4.3517],["Wiedeń","Austria",48.2082,16.3738],
 ["Nowy Jork","USA",40.7128,-74.006],["Chicago","USA",41.8781,-87.6298],
 ["Los Angeles","USA",34.0522,-118.2437],["Toronto","Kanada",43.6532,-79.3832],
 ["Tokio","Japonia",35.6762,139.6503],["Osaka","Japonia",34.6937,135.5023],
 ["Seul","Korea Południowa",37.5665,126.978],["Sydney","Australia",-33.8688,151.2093],
 ["São Paulo","Brazylia",-23.5505,-46.6333],["Dubaj","ZEA",25.2048,55.2708]
];

function nearest(lat,lng){
 let best=PLACES[0],bd=Infinity;
 for(const p of PLACES){
  const d=(lat-p[2])**2+(lng-p[3])**2;
  if(d<bd){bd=d;best=p}
 }
 return best;
}

/* ================= PRODUKTY ================= */

const PRODUCTS=[
 {id:"hotdog",n:"Hot-dog",e:"🌭",cost:3.2,price:7.99},
 {id:"coffee",n:"Kawa",e:"☕",cost:2.1,price:7.49},
 {id:"pizza",n:"Pizza",e:"🍕",cost:7,price:15.99},
 {id:"drink",n:"Napój",e:"🥤",cost:2.8,price:6.49},
 {id:"sandwich",n:"Kanapka",e:"🥪",cost:5,price:11.99},
 {id:"bun",n:"Bułka",e:"🥖",cost:1.1,price:3.49},
 {id:"ice",n:"Lody",e:"🍦",cost:3.3,price:7.99},
 {id:"scratch",n:"Fikcyjna zdrapka",e:"🎟️",cost:4.2,price:5},
 {id:"game",n:"Fikcyjna gra promocyjna",e:"🎮",cost:3.3,price:4}
];

let prices={};
PRODUCTS.forEach(p=>prices[p.id]={price:p.price,discount:0,days:0});

function sellPrice(id){
 const x=prices[id];
 return x.price*(x.days>0?(1-x.discount/100):1);
}

/* ================= SKLEP / WYPOSAŻENIE ================= */

const SIZES={
 mini:{n:"Mini",g:8,cost:70000},
 standard:{n:"Standard",g:12,cost:130000},
 large:{n:"Duży",g:16,cost:230000},
 mega:{n:"Mega",g:20,cost:400000}
};

const EQ={
 shelf:{n:"Regał",e:"🗄️",cost:6000},
 fridge:{n:"Lodówka",e:"🧊",cost:18000},
 freezer:{n:"Zamrażarka",e:"❄️",cost:22000},
 checkout:{n:"Kasa",e:"💳",cost:15000},
 self:{n:"Kasa samoobsługowa",e:"🤖",cost:45000},
 coffee:{n:"Ekspres",e:"☕",cost:28000},
 hotdog:{n:"Hot-dog",e:"🌭",cost:24000},
 pizza:{n:"Piec",e:"🍕",cost:45000},
 printer:{n:"Drukarka/ksero",e:"🖨️",cost:12000},
 parcel:{n:"Paczki",e:"📦",cost:15000},
 games:{n:"Terminal gier",e:"🎟️",cost:18000},
 wh:{n:"Regał magazynowy",e:"📦",cost:8000,back:true},
 cold:{n:"Chłodnia",e:"🧊",cost:35000,back:true},
 frozen:{n:"Mroźnia",e:"❄️",cost:45000,back:true},
 delivery:{n:"Strefa dostaw",e:"🚚",cost:20000,back:true},
 staff:{n:"Pokój pracowników",e:"👥",cost:18000,back:true},
 manager:{n:"Pokój kierownika",e:"👔",cost:22000,back:true},
 door:{n:"Drzwi",e:"🚪",cost:1500}
};

function emptyLayout(n){
 return Array.from({length:n},(_,y)=>Array.from({length:n},()=>({
  zone:y>=Math.floor(n*.72)?"backroom":"sales",eq:null,plan:[]
 })));
}

function recruitFranchise(){
 if(franchisees.length>=maxFranchisees)return notify("Limit franczyzobiorców.");
 if(money<10000)return notify("Brakuje pieniędzy.");
 changeMoney(-10000);
 franchisees.push({id:nextFranchise++,name:person(),skill:rnd(1,10),stores:[],paid:0});
 render();
}

function buildStore(){
 if(!franchisees.length)return notify("Najpierw zatrudnij franczyzobiorcę.");
 modal(`<button class="close" onclick="closeModal()">X</button><h2>🏪 Nowy sklep</h2>
 <select id="sz" class="full">${Object.entries(SIZES).map(([k,s])=>`<option value="${k}">${s.n} ${s.g}×${s.g} — ${cash(s.cost)}</option>`).join("")}</select>
 <button class="btn" onclick="startStore()">🗺️ Wybierz miejsce na mapie</button>`);
}

function startStore(){
 pendingSize=document.getElementById("sz").value;
 if(money<SIZES[pendingSize].cost)return notify("Brakuje pieniędzy.");
 buildMode="store";closeModal();
 document.getElementById("buildInfo").style.display="block";
 document.getElementById("buildInfo").textContent="🏪 Kliknij dokładne miejsce sklepu na mapie";
}

function createStore(lat,lng,size="standard",free=false){
 const s=SIZES[size];if(!free)changeMoney(-s.cost);
 const p=nearest(lat,lng);
 const f=franchisees.slice().sort((a,b)=>a.stores.length-b.stores.length)[0];
 const o={id:nextStore++,name:"Ropucha #"+nextStore,lat,lng,city:p[0],country:p[1],size,layout:emptyLayout(s.g),franchiseId:f?.id||null,employees:[],ideas:[],stock:{},sales:0,customers:0,subsidiaryId:null,marker:null};
 PRODUCTS.forEach(x=>o.stock[x.id]=rnd(60,160));
 stores.push(o);if(f)f.stores.push(o.id);
 o.marker=L.marker([lat,lng],{icon:storeIcon}).addTo(map);
 storePopup(o);addNews(`🏪 Otwarto ${o.name}.`);render();
}

function storePopup(s){
 s.marker?.bindPopup(`<b>🏪 ${esc(s.name)}</b><br>📍 ${esc(s.city)}, ${esc(s.country)}<br>💰 ${cash(s.sales)}`);
}

map.on("click",e=>{
 if(buildMode==="store")createStore(e.latlng.lat,e.latlng.lng,pendingSize);
 if(buildMode==="center")createCenter(e.latlng.lat,e.latlng.lng);
 buildMode=null;document.getElementById("buildInfo").style.display="none";
});

/* ================= PRACOWNICY ================= */

const ROLES=[
 ["Kasjer","Sklep"],["Sprzedawca","Sklep"],["Magazynier","Sklep"],["Kierownik","Sklep"],
 ["Marketing","Marketing"],["Rekruter","HR"],["Analityk","Finanse"],["Prawnik","Prawo"],
 ["Logistyk","Logistyka"],["Tester","R&D"],["Specjalista nowych usług","R&D"]
];
const PERKS=["⚡ Szybki","💰 Oszczędny","⭐ Obsługa klienta","📦 Organizacja","🧠 Szybka nauka","📈 Sprzedaż","🧪 Tester","🤝 Negocjator"];

function candidate(silent=false){
 const r=pick(ROLES),skill=rnd(1,10);
 const e={id:nextEmployee++,name:person(),role:r[0],department:r[1],skill,salary:2500+skill*450+rnd(0,1500),perk:pick(PERKS),status:"candidate",storeId:null};
 employees.push(e);if(!silent)notify("Nowy kandydat: "+e.name);render();
}

function hire(id){
 const e=employees.find(x=>x.id===id);if(!e)return;
 if(employees.filter(x=>x.status==="employed").length>=maxEmployees)return notify("Limit pracowników.");
 e.status="employed";render();
}

function fire(id){
 const e=employees.find(x=>x.id===id);if(!e)return;
 if(e.storeId){const s=stores.find(x=>x.id===e.storeId);if(s)s.employees=s.employees.filter(x=>x!==id)}
 e.status="candidate";e.storeId=null;render();
}

function assignEmployee(id,sid){
 const e=employees.find(x=>x.id===id);if(!e)return;
 stores.forEach(s=>s.employees=s.employees.filter(x=>x!==id));
 e.storeId=sid?Number(sid):null;
 const s=stores.find(x=>x.id===e.storeId);if(s)s.employees.push(id);
 render();
}

/* ================= EDYTOR ================= */

function openEditor(id){editorStore=id;editorTool="shelf";editorZone=null;drawEditor()}

function drawEditor(){
 const s=stores.find(x=>x.id===editorStore);if(!s)return;
 modal(`<button class="close" onclick="closeModal()">X</button><h2>📐 ${esc(s.name)}</h2>
 <div class="editorWrap"><div class="palette">
 <button onclick="editorZone='sales';editorTool=null;drawEditor()">🟩 Sala sprzedaży</button>
 <button onclick="editorZone='backroom';editorTool=null;drawEditor()">🟫 Buduj zaplecze</button>
 ${Object.entries(EQ).map(([k,e])=>`<button onclick="editorTool='${k}';editorZone=null;drawEditor()">${e.e} ${e.n}<br><small>${cash(e.cost)}</small></button>`).join("")}
 <button onclick="editorTool='erase';editorZone=null;drawEditor()">🗑️ Usuń</button>
 </div><div class="storeGrid" style="grid-template-columns:repeat(${SIZES[s.size].g},1fr)">
 ${s.layout.flatMap((row,y)=>row.map((c,x)=>`<div class="cell ${c.zone}" onclick="cellClick(${x},${y})">${c.eq?EQ[c.eq].e:""}</div>`)).join("")}
 </div></div>`);
}

function cellClick(x,y){
 const s=stores.find(a=>a.id===editorStore),c=s.layout[y][x];
 if(editorZone){if(c.eq)return notify("Usuń najpierw sprzęt.");c.zone=editorZone;return drawEditor()}
 if(editorTool==="erase"){c.eq=null;c.plan=[];return drawEditor()}
 if(c.eq===editorTool)return planogram(x,y);
 const e=EQ[editorTool];if(!e)return;
 if(e.back&&c.zone!=="backroom")return notify("Ten sprzęt jest na zaplecze.");
 if(!e.back&&c.zone==="backroom"&&editorTool!=="door")return notify("Ten sprzęt jest na salę.");
 if(c.eq)return notify("Pole zajęte.");
 if(money<e.cost)return notify("Brakuje pieniędzy.");
 changeMoney(-e.cost);c.eq=editorTool;c.plan=[];drawEditor();
}

function planogram(x,y){

function hasEq(s,id){return s.layout.some(r=>r.some(c=>c.eq===id))}

function processStores(){
 let direct=0;
 stores.forEach(s=>{
  let customers=25+rnd(0,35);
  const workers=employees.filter(e=>e.status==="employed"&&e.storeId===s.id);
  customers+=Math.floor(workers.reduce((a,e)=>a+e.skill,0)*.6);
  if(hasEq(s,"self"))customers=Math.floor(customers*1.08);
  if(hasEq(s,"printer"))customers+=3;if(hasEq(s,"parcel"))customers+=4;
  s.ideas.forEach(id=>{const i=ideas.find(x=>x.id===id);if(i)customers=Math.floor(customers*(1+i.bonus))});
  s.sales=0;s.customers=0;
  for(let i=0;i<customers;i++){
   const av=PRODUCTS.filter(p=>(s.stock[p.id]||0)>0);if(!av.length)break;
   const p=pick(av),price=sellPrice(p.id);
   if(Math.random()<clamp(1.1-(price/p.price)*.35,.2,.95)){s.stock[p.id]--;s.sales+=price;s.customers++}
  }
  if(hasEq(s,"printer"))s.sales+=rnd(20,100);
  if(hasEq(s,"parcel"))s.sales+=rnd(30,120);
  if(hasEq(s,"games"))s.sales+=rnd(10,60);
  totalSales+=s.sales;direct+=s.sales*.15;storePopup(s);
 });
 changeMoney(Math.floor(direct),false);
 return direct;
}

function processFranchise(){
 let total=0;
 franchisees.forEach(f=>{
  let x=0;f.stores.forEach(id=>{const s=stores.find(a=>a.id===id);if(s)x+=s.sales*(.08+f.skill*.004)});
  x=Math.floor(x);f.paid+=x;total+=x;
 });
 totalFranchise+=total;changeMoney(total,false);return total;
}

function processCompanies(){
 companies.forEach(c=>{
  c.valuation=Math.max(100000,Math.floor(c.valuation*(1+rndf(-.003,.01))));
  c.profit=Math.max(100,Math.floor(c.profit*(1+rndf(-.01,.02))));
  c.factories.forEach(f=>{
   f.production=Math.min(f.capacity,Math.max(0,Math.floor(f.production*(1+rndf(-.02,.04)))));
   factoryPopup(c,f);
  });
  if(Math.random()<.015&&c.factories.length<8)makeFactory(c,false);
  if(c.shares>0&&c.profit>0){
   const d=Math.floor(c.profit*.05*c.shares/100);
   totalDividends+=d;changeMoney(d,false);
  }
 });
}

function hud(){
 document.getElementById("hMoney").textContent=cash(money);
 document.getElementById("hStores").textContent=stores.length;
 document.getElementById("hEmployees").textContent=employees.filter(e=>e.status==="employed").length;
 document.getElementById("hDay").textContent=day;
 document.getElementById("hMonth").textContent=month;
}
function render(){hud();if(current!=="map")renderSection()}

/* ================= SAVE ================= */

function save(){
 const cleanStores=stores.map(({marker,...s})=>s);
 const cleanCompanies=companies.map(c=>({...c,factories:c.factories.map(({marker,...f})=>f)}));
 const cleanCenters=centers.map(({marker,...c})=>c);
 localStorage.setItem("ropuchaFull",JSON.stringify({
  money,day,month,maxEmployees,maxFranchisees,maxDrivers,stores:cleanStores,employees,franchisees,
  companies:cleanCompanies,subsidiaries,centers:cleanCenters,drivers,trucks,ideas,news,prices,
  totalSales,totalFranchise,totalDividends,totalWages,nextStore,nextEmployee,nextFranchise,nextCompany,nextFactory,nextSubsidiary,nextCenter,nextIdea
 }));
 notify("💾 Zapisano.");
}

/* ================= KONSOLA ================= */

let consoleOpen=false;
window.addEventListener("keydown",e=>{
 if(e.key==="~"||e.key==="`"){e.preventDefault();consoleOpen=!consoleOpen;document.getElementById("console").style.display=consoleOpen?"block":"none";if(consoleOpen)document.getElementById("consoleInput").focus()}
 if(e.key==="Escape"){buildMode=null;document.getElementById("buildInfo").style.display="none"}
});
document.getElementById("consoleInput").addEventListener("keydown",e=>{
 if(e.key!=="Enter")return;
 const str=e.target.value.trim();e.target.value="";
 const h=document.getElementById("consoleHistory");h.textContent+="\n> "+str;
 const a=str.split(/\s+/),cmd=a[0]?.toLowerCase(),v=Number(a[1]);
 if(cmd==="help")h.textContent+="\nhelp | kasa [x] | maxstaff [x] | maxfranczyzobiorcy [x] | maxkierowcy [x] | kandydat | dzien | status | save";
 else if(cmd==="kasa"&&Number.isFinite(v))money=v;
 else if(cmd==="maxstaff"&&Number.isFinite(v))maxEmployees=Math.floor(v);
 else if(cmd==="maxfranczyzobiorcy"&&Number.isFinite(v))maxFranchisees=Math.floor(v);
 else if(cmd==="maxkierowcy"&&Number.isFinite(v))maxDrivers=Math.floor(v);
 else if(cmd==="kandydat")candidate();
 else if(cmd==="dzien")gameDay();
 else if(cmd==="status")h.textContent+=`\nKasa ${cash(money)} | sklepy ${stores.length} | pracownicy ${employees.filter(e=>e.status==="employed").length} | firmy ${companies.length}`;
 else if(cmd==="save")save();
 else h.textContent+="\nNieznana komenda.";
 render();h.scrollTop=h.scrollHeight;
});

/* ================= START ================= */

for(let i=0;i<18;i++)candidate(true);
for(let i=0;i<35;i++)generateCompany(true);

addNews("🐸 Ropucha Group rozpoczyna działalność z kapitałem 500 000 zł.");
addNews("🏭 Producenci będą pojawiać się i rozwijać automatycznie.");
addNews("🏢 51% udziałów odblokowuje zarządzanie, a 100% możliwość przejęcia.");

render();
setSpeed(1);

/* firmy pojawiają się same */
setInterval(()=>{
 if(companies.length<250){
  generateCompany(false);
  render();
 }
},30000);

/* kandydaci pojawiają się sami */
setInterval(()=>{
 if(employees.filter(e=>e.status==="candidate").length<40)candidate(true);
},35000);

</script>
