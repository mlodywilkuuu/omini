<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Omini — odliczanie</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      overflow: hidden;
      background: #dce8e7;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
    }
    .village-scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background: linear-gradient(#9dbac0 0%, #dce8e7 62%, #f5f3e9 100%);
    }
    .village-scene svg { width: 100%; height: 100%; display: block; }
    .village-snow {
      position: absolute;
      inset: -20% 0 0;
      pointer-events: none;
      opacity: .8;
      background-image:
        radial-gradient(3px 3px at 8% 15%, #fff 98%, transparent),
        radial-gradient(2px 2px at 24% 62%, #fff 98%, transparent),
        radial-gradient(3px 3px at 43% 32%, #fff 98%, transparent),
        radial-gradient(2px 2px at 61% 78%, #fff 98%, transparent),
        radial-gradient(3px 3px at 79% 24%, #fff 98%, transparent),
        radial-gradient(2px 2px at 92% 54%, #fff 98%, transparent);
      background-size: 230px 230px;
      animation: village-snowfall 13s linear infinite;
    }
    .smoke { animation: smoke-rise 4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .smoke.delay { animation-delay: 2s; }
    .window-glow { animation: window-glow 3s ease-in-out infinite alternate; }
    @keyframes village-snowfall { to { transform: translateY(28%); } }
    @keyframes smoke-rise {
      0% { opacity: 0; transform: translate(0, 0) scale(.65); }
      35% { opacity: .35; }
      100% { opacity: 0; transform: translate(-13px, -38px) scale(1.5); }
    }
    @keyframes window-glow { from { opacity: .65; } to { opacity: 1; } }

    .floating-house { animation: house-float 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; animation-delay: var(--float-delay, 0s); }
    @keyframes house-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-17px); } }
    .fountain-water { animation: fountain-sparkle 1.8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .elf-bob { animation: elf-bob 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
    .elf-wave { animation: elf-wave 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 90%; }
    .elf-two { animation-delay: -.8s; }
    @keyframes fountain-sparkle { from { opacity: .55; } to { opacity: 1; } }
    @keyframes elf-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes elf-wave { from { transform: rotate(-15deg); } to { transform: rotate(28deg); } }
    .countdown {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 2;
      width: min(224px, calc(100vw - 24px));
      padding: 12px 14px;
      overflow: hidden;
      border: 1px solid rgba(232, 199, 125, .55);
      border-radius: 12px;
      background-color: #0d3029 !important;
      background-image:
        radial-gradient(ellipse at 50% -25%, rgba(255,255,255,.15), transparent 58%),
        linear-gradient(145deg, #173f34 0%, #0d3029 58%, #092720 100%) !important;
      box-shadow: 0 12px 32px rgba(13, 48, 41, .18), inset 0 0 0 3px rgba(230, 197, 126, .06);
    }
    .countdown::before, .countdown::after { content: none; }
    .topline {
      margin: 0 0 9px;
      color: #e8c77d;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .27em;
      text-align: center;
      text-transform: uppercase;
    }
    .heading {
      margin: 0 0 18px;
      color: #fffaf0;
      font-size: 25px;
      font-weight: 400;
      letter-spacing: .015em;
      text-align: center;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 17px;
      color: #d7b66e;
      font-size: 11px;
    }
    .divider::before, .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, rgba(215,182,110,.65));
    }
    .divider::after { transform: rotate(180deg); }
    .units { display: flex; align-items: flex-start; justify-content: center; gap: 7px; }
    .unit { min-width: 0; text-align: center; }
    .separator { color: #8b7447; font: 18px/1 ui-sans-serif, system-ui, sans-serif; padding-top: 1px; }
    .unit[hidden], .separator[hidden] { display: none; }
    .number {
      display: block;
      color: #f2d89b;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(17px, 4vw, 21px);
      line-height: 1.05;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.06em;
      text-shadow: 0 0 18px rgba(242,216,155,.17);
    }
    .unit-label {
      display: block;
      margin-top: 6px;
      color: #c4d2c8;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 8px;
      font-weight: 650;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .date {
      margin: 15px 0 0;
      color: #d6c49c;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 10px;
      letter-spacing: .1em;
      text-align: center;
    }
    .launch {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle, #285c49, #0b2b25 72%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    .launch.active { opacity: 1; pointer-events: auto; }
    .glow {
      position: absolute;
      width: min(72vw, 620px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239,211,148,.38), rgba(220,238,222,.12) 38%, transparent 70%);
      transform: scale(.2);
      transition: transform 2.4s cubic-bezier(.16,1,.3,1);
    }
    .launch.active .glow { transform: scale(2.2); }
    .launch-title {
      position: relative;
      margin: 0;
      color: #f4dfae;
      font-size: clamp(38px, 8vw, 78px);
      font-weight: 400;
      letter-spacing: -.04em;
      opacity: 0;
      transform: translateY(18px);
    }
    .launch.active .launch-title { animation: reveal 1.2s .55s forwards; }
    .snow {
      position: absolute;
      inset: -10vh 0;
      background-image:
        radial-gradient(3px 3px at 12% 18%, #fff 98%, transparent),
        radial-gradient(2px 2px at 72% 32%, #f2d89b 98%, transparent),
        radial-gradient(4px 4px at 42% 72%, #fff 98%, transparent),
        radial-gradient(2px 2px at 88% 84%, #e8c77d 98%, transparent),
        radial-gradient(3px 3px at 25% 52%, #fff 98%, transparent);
      background-size: 190px 190px;
      opacity: 0;
    }
    .launch.active .snow { opacity: .9; animation: snowfall 5s linear infinite; }
    @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
    @keyframes snowfall { from { transform: translateY(-4%); } to { transform: translateY(8%); } }
    @media (max-width: 480px) {
      .countdown { top: 12px; right: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

  <main class="countdown" aria-live="polite">
    <div class="units">
      <div class="unit" id="days-unit"><span class="number" id="days">0</span><span class="unit-label">dni</span></div>
      <span class="separator" id="days-separator">|</span>
      <div class="unit" id="hours-unit"><span class="number" id="hours">00</span><span class="unit-label">godz.</span></div>
      <span class="separator" id="hours-separator">|</span>
      <div class="unit"><span class="number" id="minutes">00</span><span class="unit-label">min</span></div>
      <span class="separator">|</span>
      <div class="unit"><span class="number" id="seconds">00</span><span class="unit-label">sek</span></div>
    </div>
  </main>

  <section class="launch" id="launch" aria-hidden="true">
    <div class="glow"></div>
    <div class="snow"></div>
  </section>

  <script>
    (() => {
      const target = new Date("2026-12-23T11:00:00+01:00").getTime();
      const fields = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds")
      };
      const launch = document.getElementById("launch");
      const daysUnit = document.getElementById("days-unit");
      const daysSeparator = document.getElementById("days-separator");
      const hoursUnit = document.getElementById("hours-unit");
      const hoursSeparator = document.getElementById("hours-separator");
      let redirected = false;

      function tick() {
        const remaining = target - Date.now();
        if (remaining <= 0) {
          Object.values(fields).forEach((field) => field.textContent = "00");
          if (!redirected) {
            redirected = true;
            launch.classList.add("active");
            launch.setAttribute("aria-hidden", "false");
            window.setTimeout(() => {
              window.location.href = "./tracker/";
            }, 4200);
          }
          return;
        }
        const days = Math.floor(remaining / 86400000);
        const hours = Math.floor((remaining % 86400000) / 3600000);
        const minutes = Math.floor((remaining % 3600000) / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);
        fields.days.textContent = String(days);
        daysUnit.hidden = days === 0;
        daysSeparator.hidden = days === 0;
        hoursUnit.hidden = days === 0;
        hoursSeparator.hidden = days === 0;
        fields.hours.textContent = String(hours).padStart(2, "0");
        fields.minutes.textContent = String(minutes).padStart(2, "0");
        fields.seconds.textContent = String(seconds).padStart(2, "0");
      }
      tick();
      window.setInterval(tick, 1000);
    })();
  </script>
