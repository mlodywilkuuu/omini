</head><body><header><strong>🍔 FAST FOOD EMPIRE</strong><span>💰 <b id="cash"></b></span><span>📈 <b id="rate"></b>/s</span><span>📅 Dzień <b id="day"></b></span><button onclick="save()">💾 Zapisz</button><button onclick="if(confirm('Usunąć postęp?')){localStorage.removeItem(KEY);location.reload()}">Nowa gra</button></header><main><section class="panel"><div class="row"><label>Kraj mapy <select id="country" onchange="S.country=this.value;S.selected=null;render()"></select></label><button onclick="build()">🏗️ Buduj lokal</button><button onclick="generate()">🔎 Odkryj firmę</button></div><div id="map"></div><div id="map-status" class="muted" aria-live="polite"></div><p class="muted">Kliknij budynek, aby zobaczyć udziały, zarządzanie i przejęcie. Mapa OpenStreetMap: przeciągaj, przybliżaj kółkiem myszy lub przyciskami +/−. Restauracje są fikcyjnymi punktami gry, nie rzeczywistymi lokalizacjami sieci.</p><h3>📰 Wiadomości gospodarcze</h3><div id="news"></div></section><section class="panel"><nav id="tabs"></nav><div id="content"></div></section></main><div id="toast"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>
'use strict';const KEY='ffe-world-v3',COUNTRIES=['Polska','USA','Niemcy','Francja','Włochy','Japonia','Hiszpania','Wielka Brytania','Kanada','Brazylia','Indie','Australia'],BRANDS=['McDonald’s','KFC','Pizza Hut','Domino’s','Taco Bell','Burger King','Popeyes','Subway','Wendy’s','QuickBite','Golden Chicken','Pizza Planet','Burger Point'],FIRST=['Anna Nowak','Jan Kowalski','Marta Wiśniewska','Olivia Smith','Liam Brown','Sophia Garcia','Noah Wilson'],SPORTS=['Liga piłkarska','Turniej koszykówki','Grand Prix wyścigów','Turniej tenisowy','Liga siatkówki','Mistrzostwa hokejowe'],DRINKS=['Pepsi','Coca-Cola','Sprite','7UP','Fanta'];const pick=a=>a[Math.floor(Math.random()*a.length)],rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,fmt=n=>Math.round(n).toLocaleString('pl-PL')+' $',esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GEO={'Polska':[52.23,21.01],'USA':[39.1,-98.5],'Niemcy':[51.2,10.4],'Francja':[46.6,2.2],'Włochy':[42.5,12.5],'Japonia':[36.2,138.2],'Hiszpania':[40.4,-3.7],'Wielka Brytania':[54,-2.5],'Kanada':[56,-106],'Brazylia':[-14.2,-51.9],'Indie':[22.6,78.9],'Australia':[-25.3,133.8]};
let map,markers,shownCountry=null;
function point(c){if(Number.isFinite(c.lat)&&Number.isFinite(c.lng))return [c.lat,c.lng];let a=GEO[c.country]||GEO.Polska;return [a[0]+(c.y-50)*.018,a[1]+(c.x-50)*.028]}
function initMap(){if(typeof L==='undefined'){document.getElementById('map').textContent='Nie można załadować mapy. Sprawdź internet i odśwież stronę.';return}map=L.map('map',{zoomControl:true,worldCopyJump:false,zoomSnap:1,zoomDelta:1,zoomAnimation:true,fadeAnimation:true}).setView(GEO[S.country]||GEO.Polska,6);const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,minZoom:2,keepBuffer:6,updateWhenIdle:true,updateWhenZooming:false,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);let tileErrors=0;tiles.on('tileerror',()=>{tileErrors++;if(tileErrors>4)document.getElementById('map-status').textContent='Niektóre fragmenty mapy nie są dostępne. Sprawdź połączenie i odśwież stronę.'});tiles.on('load',()=>{if(tileErrors===0)document.getElementById('map-status').textContent='';tileErrors=0});markers=L.layerGroup().addTo(map);if(S.mapView&&S.mapView.center&&Number.isFinite(Number(S.mapView.center.lat))&&Number.isFinite(Number(S.mapView.center.lng)))map.setView([S.mapView.center.lat,S.mapView.center.lng],Number(S.mapView.zoom)||6,{animate:false});map.on('moveend',()=>{const center=map.getCenter();S.mapView={center:{lat:center.lat,lng:center.lng},zoom:map.getZoom()}});setTimeout(()=>map.invalidateSize({pan:false}),200);setTimeout(()=>map.invalidateSize({pan:false}),900);if(typeof ResizeObserver!=='undefined'){new ResizeObserver(()=>{if(map)map.invalidateSize({pan:false,debounceMoveend:true})}).observe(document.getElementById('map'))}window.addEventListener('resize',()=>map.invalidateSize({pan:false}))}
function drawMap(){if(!map)return;if(shownCountry!==S.country){shownCountry=S.country}markers.clearLayers();S.companies.filter(c=>c.country===S.country).forEach(c=>{let icon=L.divIcon({className:'',html:'<div class="map-pin '+(c.owned===100?'mine ':'')+(S.selected===c.id?'active':'')+'"></div>',iconSize:[21,21],iconAnchor:[10,10]});L.marker(point(c),{icon,title:c.name}).addTo(markers).bindTooltip(esc(c.name)+' · '+c.owned+'%').on('click',()=>{S.selected=c.id;S.tab='Firma';render()})})}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch{}if(!S)S={cash:200000,debt:0,day:1,country:'Polska',tab:'Firma',selected:null,next:1,companies:[],subs:[],contracts:[],factories:[],warehouses:[],events:[],bankDeposit:0};S.companies??=[];S.subs??=[];S.contracts??=[];S.factories??=[];S.warehouses??=[];S.events??=[];S.bankDeposit??=0;S.next??=1;S.tab??='Firma';S.country??='Polska';
function company(name=pick(BRANDS),country=pick(COUNTRIES),owned=0){let id=S.next++;return{id,name,country,x:rnd(12,87),y:rnd(12,87),owned,holders:owned===100?[]:Array.from({length:4},(_,i)=>({name:pick(FIRST)+' '+rnd(1,999),shares:i===0?100-owned-3*Math.floor((100-owned)/4):Math.floor((100-owned)/4)})),price:rnd(350,1100),base:rnd(15,55),cost:rnd(5,14),staff:3,level:1,quality:70,priceFactor:1,sub:null,ai:owned===0};}
function normalize(c){let left=100-c.owned;let sum=c.holders.reduce((a,h)=>a+h.shares,0);if(sum!==left&&c.holders.length)c.holders[0].shares+=left-sum;}
if(!S.companies.length){for(let i=0;i<25;i++){let c=company(BRANDS[i%BRANDS.length],COUNTRIES[i%COUNTRIES.length]);normalize(c);S.companies.push(c)}}S.companies.forEach(normalize);
function toast(message,amount){let e=document.createElement('div');e.className='pop '+(amount>0?'plus':amount<0?'minus':'');e.textContent=(amount>0?'+':'')+(amount!==undefined?fmt(amount)+' • ':'')+message;document.getElementById('toast').append(e);setTimeout(()=>e.remove(),2100)}function spend(n,reason){n=Math.round(n);if(S.cash<n){toast('Za mało gotówki');return false}S.cash-=n;toast(reason,-n);return true}function earn(n,reason){S.cash+=n;toast(reason,n)}function save(){localStorage.setItem(KEY,JSON.stringify(S));toast('Zapisano grę')}function selected(){return S.companies.find(c=>c.id===S.selected)}function controlled(c){return c.owned>50}function factoryBonus(c){return S.factories.some(f=>f.country===c.country)?1.15:1}function logisticsBonus(c){return S.warehouses.some(f=>f.country===c.country)?1.1:1}function contractBonus(c){return 1+Math.min(.6,S.contracts.filter(k=>k.company===c.id).reduce((s,k)=>s+k.bonus,0))}function profit(c){return Math.max(-40,(c.base*c.level*c.priceFactor*(.5+c.quality/140)*factoryBonus(c)*logisticsBonus(c)*contractBonus(c)-c.cost-c.staff*2)*c.owned/100)}function rate(){return S.companies.reduce((a,c)=>a+profit(c),0)-S.debt*.000004+S.bankDeposit*.000001}
function generate(){if(S.companies.length>=400){toast('Limit 400 firm');return}let c=company();normalize(c);S.companies.push(c);S.events.unshift('Nowa firma: '+c.name+' ('+c.country+')');render()}function build(){let name=prompt('Nazwa nowej restauracji:','Moja Restauracja');if(!name?.trim())return;if(!spend(25000,'Budowa restauracji'))return;let c=company(name.trim().slice(0,40),S.country,100);if(map){let center=map.getCenter();c.lat=center.lat;c.lng=center.lng}c.holders=[];c.ai=false;S.companies.push(c);S.selected=c.id;render()}
function buy(id,i,n){let c=S.companies.find(c=>c.id===id),h=c?.holders[i];if(!h||h.shares<=0)return;let qty=Math.min(n,h.shares),price=Math.round(qty*c.price*(c.owned>=50?1.12:1));if(!spend(price,'Zakup '+qty+'% udziałów'))return;h.shares-=qty;c.owned+=qty;if(c.owned===100){c.ai=false;toast('👑 Pełne przejęcie!')}else if(c.owned>50)toast('🔓 Większość udziałów!');render()}
function manage(action){let c=selected();if(!c||!controlled(c))return;let cost=action==='level'?12000:action==='staff'?2500:4000;if(!spend(cost,'Rozwój restauracji'))return;if(action==='level')c.level++;if(action==='staff')c.staff++;if(action==='quality')c.quality=Math.min(100,c.quality+10);render()}
function priceChange(v){let c=selected();if(c&&controlled(c)){c.priceFactor=Number(v);render()}}function createSub(){let name=prompt('Nazwa spółki córki:');if(!name?.trim())return;let input=prompt('Kraje działalności (oddziel przecinkami):','Polska, Niemcy');if(input===null)return;let countries=parseCountries(input);if(!countries.length)return toast('Podaj kraj');S.subs.push({id:S.next++,name:name.trim().slice(0,45),countries,budget:0});render()}function parseCountries(s){return [...new Set(s.split(',').map(x=>x.trim()).filter(Boolean))].slice(0,20)}function editCountries(id){let sub=S.subs.find(x=>x.id===id),s=prompt('Kraje po przecinku:',sub.countries.join(', '));if(s===null)return;let arr=parseCountries(s);if(!arr.length)return toast('Zostaw przynajmniej jeden kraj');sub.countries=arr;render()}function assign(v){let c=selected();if(c&&c.owned===100){c.sub=v?Number(v):null;render()}}function transfer(id){let sub=S.subs.find(x=>x.id===id),n=Number(prompt('Wpłać środki do spółki córki:','10000'));if(!sub||!Number.isFinite(n)||n<=0)return;if(spend(n,'Kapitał spółki'))sub.budget+=n;render()}
function contract(type){let c=selected();if(!c||!controlled(c))return;let label=type==='sport'?pick(SPORTS):pick(DRINKS),cost=type==='sport'?18000:9000;if(!spend(cost,'Kontrakt: '+label))return;S.contracts.push({id:S.next++,company:c.id,type,label,bonus:type==='sport'?.13:.09,expires:S.day+45});render()}
function bank(type){let n=Number(prompt('Kwota w $:','10000'));if(!Number.isFinite(n)||n<=0)return;n=Math.round(n);if(type==='loan'){S.cash+=n;S.debt+=n;toast('Kredyt',n)}if(type==='repay'&&n<=S.debt&&spend(n,'Spłata kredytu'))S.debt-=n;if(type==='deposit'&&spend(n,'Lokata'))S.bankDeposit+=n;if(type==='withdraw'&&n<=S.bankDeposit){S.bankDeposit-=n;earn(n,'Wypłata lokaty')}render()}
function infrastructure(type){let cost=type==='factory'?60000:25000;if(!spend(cost,type==='factory'?'Fabryka':'Magazyn'))return;(type==='factory'?S.factories:S.warehouses).push({id:S.next++,country:S.country});render()}
function franchise(){let c=selected();if(!c||c.owned!==100)return;earn(9000,'Opłata franczyzowa');c.quality=Math.max(30,c.quality-3);render()}
function dividend(){let total=0;for(let c of S.companies)if(c.owned>0)total+=Math.max(0,profit(c))*15;earn(total,'Dywidenda symulacyjna');render()}
function aiTurn(){for(let c of S.companies){if(c.ai&&c.owned<100){c.base=Math.max(8,c.base+rnd(-3,4));c.price=Math.max(150,Math.round(c.price*(1+rnd(-5,6)/100)));if(Math.random()<.12)c.level++}}let story=pick(['Rosną ceny żywności','Nowe trendy w dostawach','Większy ruch w restauracjach','Konkurencja inwestuje w marketing']);S.events.unshift('Dzień '+S.day+': '+story);S.events=S.events.slice(0,8);if(S.companies.length<400&&Math.random()<.4){let c=company();normalize(c);S.companies.push(c)}}
function tick(){S.day++;let amount=rate()*5;S.cash+=amount;if(Math.abs(amount)>1)toast('Wynik działalności',amount);S.contracts=S.contracts.filter(k=>k.expires>S.day);if(S.day%6===0)aiTurn();localStorage.setItem(KEY,JSON.stringify(S));render()}
const tabs=['Firma','Holding','Giełda','Kontrakty','Bank','Logistyka','Raport'];function setTab(t){S.tab=t;render()}function viewCompany(){let c=selected();if(!c)return '<h2>🏪 Wybierz restaurację</h2><p>Kliknij budynek na mapie. Możesz kupować udziały od udziałowców albo budować własne lokale.</p>';let out='<h2>'+esc(c.name)+'</h2><p>🌍 '+esc(c.country)+' · Udziały: <b>'+c.owned+'%</b> · Cena 1%: '+fmt(c.price)+'</p><p>📈 Twój wynik: <span class="stat">'+fmt(profit(c))+'/s</span></p><h3>Udziałowcy</h3>';c.holders.forEach((h,i)=>{if(h.shares>0)out+='<div class="tile">'+esc(h.name)+' — '+h.shares+'%<div class="row"><button onclick="buy('+c.id+','+i+',1)">Kup 1%</button><button onclick="buy('+c.id+','+i+',10)">Kup do 10%</button><button onclick="buy('+c.id+','+i+','+h.shares+')">Kup pakiet</button></div></div>'});if(controlled(c))out+='<h3>🔓 Zarząd</h3><p>Poziom '+c.level+' · Pracownicy '+c.staff+' · Jakość '+c.quality+'%</p><div class="row"><button onclick="manage(\'level\')">Rozbuduj 12 000 $</button><button onclick="manage(\'staff\')">Zatrudnij 2 500 $</button><button onclick="manage(\'quality\')">Popraw jakość 4 000 $</button></div><label>Ceny menu <select onchange="priceChange(this.value)">'+[.8,1,1.2,1.5].map(v=>'<option value="'+v+'" '+(c.priceFactor===v?'selected':'')+'>'+Math.round(v*100)+'%</option>').join('')+'</select></label><div class="row"><button onclick="contract(\'sport\')">⚽ Sponsoring</button><button onclick="contract(\'drink\')">🥤 Napoje</button></div>';if(c.owned===100)out+='<h3>👑 Pełne przejęcie</h3><label>Spółka córka <select onchange="assign(this.value)"><option value="">Centrala</option>'+S.subs.map(s=>'<option value="'+s.id+'" '+(c.sub===s.id?'selected':'')+'>'+esc(s.name)+'</option>').join('')+'</select></label><div class="row"><button onclick="franchise()">Sprzedaj franczyzę (+9 000 $)</button></div>';return out}
function viewHolding(){return '<h2>🏢 Holding i spółki córki</h2><button onclick="createSub()">+ Nowa spółka córka</button>'+S.subs.map(s=>'<div class="tile"><b>'+esc(s.name)+'</b><p>🌍 '+s.countries.map(esc).join(', ')+'</p><p>Budżet: '+fmt(s.budget)+' · Restauracje: '+S.companies.filter(c=>c.sub===s.id).length+'</p><div class="row"><button onclick="editCountries('+s.id+')">Zmień kraje</button><button onclick="transfer('+s.id+')">Zasil kapitał</button></div></div>').join('')+'<p class="muted">Przypisywanie restauracji do spółki córki jest dostępne po wykupieniu 100% udziałów.</p>'}

 if(kind==='vote'){if(!c||!own(c))return toast('Wybierz kontrolowaną restaurację');let approval=Math.min(95,Math.round(c.owned+Math.random()*20));W.votes.unshift({name:c.name,day:S.day,approval,passed:approval>50});toast(approval>50?'Uchwała przyjęta':'Uchwała odrzucona')}
 if(kind==='offer'){if(!c||c.owned===100)return toast('Wybierz firmę do przejęcia');let qty=Math.min(100-c.owned,25),cost=Math.round(qty*c.price*1.15);if(!confirm('Oferta za '+qty+'% udziałów: '+fmt(cost)+'?'))return;if(Math.random()<.65){if(!spend(cost,'Oferta przejęcia'))return;let left=qty;for(const h of c.holders){let n=Math.min(left,Math.max(0,h.shares));h.shares-=n;left-=n;if(!left)break}c.owned+=qty;normalize(c);if(c.owned===100)c.ai=false;toast('Oferta zaakceptowana')}else toast('Akcjonariusze odrzucili ofertę')}
 if(kind==='city'){if(!map)return;let p=map.getCenter(),near=S.companies.filter(x=>{let a=point(x);return Math.abs(a[0]-p.lat)<.15&&Math.abs(a[1]-p.lng)<.2});alert('Analiza okolicy\nRestauracje: '+near.length+'\nSzacowany popyt: '+Math.max(15,100-near.length*6)+'/100\nZoom: '+map.getZoom())}
 if(kind==='location'){if(!c)return toast('Wybierz restaurację');let p=point(c),near=S.companies.filter(x=>x.id!==c.id&&Math.abs(point(x)[0]-p[0])<.08&&Math.abs(point(x)[1]-p[1])<.1).length;alert('Konkurencja w pobliżu: '+near+'\nWskaźnik lokalizacji: '+Math.max(15,100-near*8)+'/100')}
 if(kind==='menu'){if(!c||!own(c))return toast('Wybierz kontrolowaną restaurację');let price=safeNum(prompt('Średnia cena zestawu ($)','12'));if(price<3||price>100)return toast('Cena od 3 do 100 $');W.menus[c.id]=price;c.priceFactor=Math.max(.65,Math.min(1.6,price/12));toast('Zapisano menu')}
 if(kind==='stock'){if(!c||!own(c))return toast('Wybierz kontrolowaną restaurację');if(spend(2000,'Zakup produktów')){W.stocks[c.id]=(W.stocks[c.id]??40)+100;toast('Dostarczono zapasy')}}
 if(kind==='inspection'){if(!c||!own(c))return toast('Wybierz restaurację');let score=Math.round((c.quality+Math.min(100,W.stocks[c.id]??50))/2);W.inspections[c.id]=score;toast(score>=55?'Kontrola zaliczona':'Kontrola: potrzebne poprawki')}
 if(kind==='manager'){if(!c||!own(c))return toast('Wybierz restaurację');if(!W.localManagers[c.id]&&!spend(4500,'Menedżer lokalu'))return;W.localManagers[c.id]=!W.localManagers[c.id];toast(W.localManagers[c.id]?'Menedżer zatrudniony':'Menedżer zwolniony')}
 if(kind==='hours'){if(!c||!own(c))return toast('Wybierz restaurację');W.hours[c.id]=W.hours[c.id]==='24h'?'8–22':'24h';toast('Godziny: '+W.hours[c.id])}
 if(kind==='payments'){if(!c||!own(c))return toast('Wybierz restaurację');W.payments[c.id]=!W.payments[c.id];toast('Płatności mobilne: '+(W.payments[c.id]?'tak':'nie'))}
 if(kind==='premium'){if(!c||!own(c))return toast('Wybierz restaurację');if(!W.premium[c.id]&&!spend(30000,'Lokal premium'))return;W.premium[c.id]=!W.premium[c.id];toast('Tryb premium zmieniony')}
 if(kind==='online'){if(!c||!own(c))return toast('Wybierz restaurację');if(!W.online[c.id]&&!spend(5000,'Zamówienia online'))return;W.online[c.id]=!W.online[c.id];toast('Zamówienia online zmienione')}
 if(kind==='award'){let best=S.companies.filter(x=>x.owned>50).sort((a,b)=>b.quality-a.quality)[0];if(!best)return toast('Brak kontrolowanych restauracji');if(best.quality>=85){W.awards.push({name:best.name,day:S.day});toast('Nagroda dla '+best.name)}else toast('Potrzebujesz jakości min. 85%')}
 if(kind==='media'){if(!spend(6000,'PR i media'))return;W.media=Math.min(100,W.media+12);toast('Poprawiono reputację medialną')}
 if(kind==='rivals'){if(S.companies.length>=400)return toast('Limit firm');let b=company();normalize(b);S.companies.push(b);W.globalRivals++;toast('Konkurencja otworzyła nową firmę')}
 render()
}
const baseProfitV8=profit;
profit=function(c){let p=baseProfitV8(c);if(c.owned<=0)return p;let stock=W.stocks[c.id]??50;let factor=stock<=0?.35:1;factor*=W.localManagers[c.id]?1.08:1;factor*=W.premium[c.id]?1.16:1;factor*=W.online[c.id]?1.10:1;factor*=W.payments[c.id]?1.03:1;factor*=W.hours[c.id]==='24h'?1.06:1;factor*=W.weather==='Deszczowo'?.96:1;factor*=W.holiday?1.14:1;factor*=.85+W.media/350;return p*factor};
function advanceV8(){
 if(S.day%5===0){W.weather=pick(['Słonecznie','Deszczowo','Pochmurno','Śnieg']);W.holiday=Math.random()<.18;W.events.unshift('Dzień '+S.day+': '+W.weather+(W.holiday?' · wydarzenie sezonowe':''));W.events=W.events.slice(0,12)}
 for(const c of S.companies){if(c.owned<=50)continue;W.stocks[c.id]=Math.max(0,(W.stocks[c.id]??50)-1);if(W.localManagers[c.id]&&W.stocks[c.id]<20&&S.cash>=1100){S.cash-=1100;W.stocks[c.id]+=70}}
 if(S.day%8===0){for(const sub of S.subs){let cfg=W.managers[sub.id];if(!cfg?.enabled||sub.budget<26000||S.companies.length>=400)continue;let country=pick(sub.countries.filter(x=>COUNTRIES.includes(x)));if(!country)continue;let cost=25000;if(cfg.strategy==='stable'&&Math.random()<.6)continue;sub.budget-=cost;let g=GEO[country];let b=newOwned(sub.name+' #'+S.next,country,g?.[0]+rnd(-20,20)/100,g?.[1]+rnd(-20,20)/100);if(b){b.sub=sub.id;W.events.unshift('Prezes '+sub.name+' otworzył lokal w '+country)}}}
 if(S.day%15===0&&S.companies.length<400){let b=company();normalize(b);S.companies.push(b);W.globalRivals++}
}
const prevTickV8=tick;tick=function(){prevTickV8();advanceV8();localStorage.setItem(KEY,JSON.stringify(S))};
function viewV8(){
 const c=v8Company();
 const subs=S.subs.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');
 const btn=(id,label)=>'<button onclick="v8Do(\''+id+'\')">'+label+'</button>';
 return '<div id="v8"><h2>🌐 Zarządzanie V8</h2><div class="tile"><b>⏱️ Czas symulacji</b><p>Dzień '+S.day+' · '+(W.paused?'Pauza':'Gra działa')+'</p>'+btn('pause',W.paused?'▶️ Wznów':'⏸️ Pauza')+' <select id="v8speed" onchange="v8Do(\'speed\')">'+[1,2,5,10].map(x=>'<option value="'+x+'" '+(W.speed===x?'selected':'')+'>×'+x+'</option>').join('')+'</select></div>'+
 '<div class="tile"><b>🏢 Automatyczny prezes i budżety</b><p>Utwórz spółkę córkę w zakładce Holding. Prezes wydaje jej budżet na restauracje w przypisanych krajach.</p><select id="v8sub">'+subs+'</select><select id="v8strategy"><option value="stable">Stabilny rozwój</option><option value="growth">Agresywna ekspansja</option></select><div>'+btn('ceo','Włącz/wyłącz prezesa')+btn('strategy','Ustaw strategię')+btn('budget','Przekaż budżet')+'</div></div>'+
 '<div class="tile"><b>📊 Udziały i przejęcia</b><p>Wybrana firma: '+esc(c?.name||'brak')+'</p>'+btn('vote','🗳️ Głosowanie udziałowców')+btn('offer','🤝 Oferta przejęcia')+'</div>'+
 '<div class="tile"><b>🏙️ Mapa i lokalizacje</b>'+btn('city','Analiza okolicy na mapie')+btn('location','Rentowność lokalizacji')+'</div>'+
 '<div class="tile"><b>🍟 Restauracja i personel</b>'+btn('menu','Ustaw cenę menu')+btn('stock','Zamów zapasy')+btn('inspection','Kontrola sanitarna')+btn('manager','Menedżer lokalu')+btn('hours','Godziny 24h / 8–22')+btn('payments','Płatności mobilne')+btn('premium','Restauracja premium')+btn('online','Zamówienia online')+'<p>Zapasy: '+(c?(W.stocks[c.id]??50):'—')+' · Cena zestawu: '+(c?(W.menus[c.id]??12):'—')+' $</p></div>'+
 '<div class="tile"><b>🌦️ Pogoda, wydarzenia i media</b><p>'+esc(W.weather)+(W.holiday?' · Święto / wydarzenie':'')+' · Reputacja medialna: '+Math.round(W.media)+'/100</p>'+btn('award','🏆 Nagrody branżowe')+btn('media','📰 Kampania PR')+btn('rivals','🤖 Ekspansja rywali')+'</div>'+
 '<div class="tile"><b>📰 Aktualności</b>'+W.events.slice(0,6).map(x=>'<p>'+esc(x)+'</p>').join('')+'</div></div>'
}
const prevRenderV8=render;render=function(){prevRenderV8();if(S.tab==='Zarządzanie V8')document.getElementById('content').innerHTML=viewV8()};
render();
</script>

<style>

</style>
<div id="ffe-modal" role="dialog" aria-modal="true" aria-label="Tworzenie spółki córki"></div>
<script>
/* UI extension. Preserve existing save schema and old tabs. */
const nav=document.getElementById('tabs');
document.querySelector('main').before(nav);
if(!tabs.includes('Mapa'))tabs.unshift('Mapa');
S.tab=S.tab||'Mapa';
S.marketOffers??=[];
S.marketSerial??=0;
function renderFullLayout(){
 document.body.classList.toggle('view-map',S.tab==='Mapa');
 const nav=document.getElementById('tabs');
 nav.innerHTML=tabs.map(t=>'<button class="'+(S.tab===t?'active':'')+'" onclick="setTab(\''+t+'\')">'+(t==='Mapa'?'🗺️ ':'')+esc(t)+'</button>').join('');
 if(S.tab==='Mapa'){
   // Only update dimensions when switching to map, never re-center.
   requestAnimationFrame(()=>{if(map)map.invalidateSize({pan:false})});
 }
}
const renderBeforeFull=render;
render=function(){renderBeforeFull();renderFullLayout();if(S.tab==='Holding')document.getElementById('content').innerHTML=viewHoldingModern();if(S.tab==='Kontrakty')document.getElementById('content').innerHTML=viewMarketOffers()};
const setTabBeforeFull=setTab;
setTab=function(t){const prev=S.tab;S.tab=t;render();if(t==='Mapa'&&prev!=='Mapa'&&map){setTimeout(()=>map.invalidateSize({pan:false}),70)}};
function openSubWizard(id){
 const old=id?S.subs.find(x=>x.id===id):null;
 const modal=document.getElementById('ffe-modal');
 modal.innerHTML='<form class="wizard" id="sub-form"><h2>🏢 '+(old?'Edytuj spółkę córkę':'Utwórz spółkę córkę')+'</h2><p class="muted">Wybierz nazwę i wszystkie kraje, w których spółka może prowadzić działalność.</p><label for="sub-name">Nazwa spółki</label><input id="sub-name" required maxlength="45" placeholder="np. Empire Europe" value="'+esc(old?.name||'')+'"><label>Kraje działalności</label><div class="country-choices">'+COUNTRIES.map(c=>'<label><input type="checkbox" name="countries" value="'+esc(c)+'" '+(old?.countries?.includes(c)?'checked':'')+'>'+esc(c)+'</label>').join('')+'</div><div class="wizard-actions"><button type="button" onclick="closeSubWizard()">Anuluj</button><button type="submit">'+(old?'Zapisz zmiany':'Utwórz spółkę')+'</button></div></form>';
 modal.classList.add('show');
 document.getElementById('sub-form').onsubmit=e=>{
  e.preventDefault();const name=document.getElementById('sub-name').value.trim();
  const countries=[...modal.querySelectorAll('input[name="countries"]:checked')].map(x=>x.value);
  if(!name||!countries.length){toast('Wybierz nazwę i przynajmniej jeden kraj');return}
  if(old){old.name=name;old.countries=countries}
  else S.subs.push({id:S.next++,name,countries,budget:0});
  closeSubWizard();render();localStorage.setItem(KEY,JSON.stringify(S));toast('Spółka zapisana');
 };
 document.getElementById('sub-name').focus();
}
function closeSubWizard(){document.getElementById('ffe-modal').classList.remove('show')}
document.getElementById('ffe-modal').addEventListener('click',e=>{if(e.target.id==='ffe-modal')closeSubWizard()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSubWizard()});
createSub=function(){openSubWizard()};
editCountries=function(id){openSubWizard(id)};
function viewHoldingModern(){
 return '<h2>🏢 Twoje spółki córki</h2><p class="muted">Twórz regionalne spółki, przypisuj kilka krajów, przekazuj budżety i zarządzaj restauracjami.</p><div class="row"><button onclick="openSubWizard()">✨ + Utwórz nową spółkę</button></div><div class="subcards">'+S.subs.map(x=>'<article class="subcard"><h3>🏢 '+esc(x.name)+'</h3><p>'+x.countries.map(c=>'<span class="pill">🌍 '+esc(c)+'</span>').join('')+'</p><p>💰 Kapitał: <strong>'+fmt(x.budget)+'</strong></p><p>🍔 Restauracje: '+S.companies.filter(c=>c.sub===x.id).length+'</p><div class="actions"><button onclick="openSubWizard('+x.id+')">✏️ Edytuj</button><button onclick="transfer('+x.id+')">💸 Przekaż środki</button></div></article>').join('')+'</div>'+(S.subs.length?'':'<p>Nie masz jeszcze spółek córek. Utwórz pierwszą!</p>')+'<p class="muted">Restaurację możesz przypisać do spółki po przejęciu 100% udziałów.</p>';
}
const SPORT_LABELS=['Liga piłkarska','Turniej tenisowy','Liga koszykówki','Wyścigi samochodowe','Turniej siatkówki','Liga hokejowa','Maraton miejski','Mistrzostwa e-sportowe'];
const DRINK_LABELS=['Pepsi','Coca-Cola','7UP','Sprite','Fanta','Mountain Dew','Dr Pepper','Mirinda'];
function makeMarketOffer(){
 const type=Math.random()<.55?'sport':'drink';
 const label=pick(type==='sport'?SPORT_LABELS:DRINK_LABELS);
 return {id:++S.marketSerial,type,label,cost:type==='sport'?rnd(11000,32000):rnd(5500,16000),bonus:type==='sport'?.10+.01*rnd(0,7):.06+.01*rnd(0,7),duration:rnd(20,70),expires:S.day+rnd(9,22)};
}
function refillMarket(){S.marketOffers=S.marketOffers.filter(x=>x.expires>S.day);while(S.marketOffers.length<8)S.marketOffers.push(makeMarketOffer())}
function acceptMarketOffer(id){
 const o=S.marketOffers.find(x=>x.id===id),c=selected();
 if(!o)return toast('Oferta już wygasła');
 if(!c||c.owned<=50)return toast('Najpierw wybierz firmę z ponad 50% udziałów w zakładce Firma');
 if(!spend(o.cost,'Kontrakt '+o.label))return;
 S.contracts.push({id:S.next++,company:c.id,type:o.type,label:o.label,bonus:o.bonus,expires:S.day+o.duration});
 S.marketOffers=S.marketOffers.filter(x=>x.id!==id);refillMarket();render();toast('Podpisano kontrakt: '+o.label);
}
function viewMarketOffers(){
 refillMarket();const c=selected();
 return '<h2>🤝 Rynek kontraktów</h2><p>Nowe oferty pojawiają się automatycznie w trakcie gry. Wybierz firmę z większością udziałów, aby podpisać umowę.</p><div id="ffe-alert">🏪 Wybrana firma: <b>'+esc(c?.name||'Brak')+'</b> · Udziały: '+(c?.owned||0)+'%</div><h3>✨ Dostępne oferty</h3><div class="offer-grid">'+S.marketOffers.map(o=>'<article class="offer-card"><h3>'+(o.type==='sport'?'🏆 ':'🥤 ')+esc(o.label)+'</h3><p>Opłata: <b>'+fmt(o.cost)+'</b></p><p>Premia do przychodów: +'+Math.round(o.bonus*100)+'% · Czas: '+o.duration+' dni</p><p class="muted">Oferta dostępna do dnia '+o.expires+'</p><button onclick="acceptMarketOffer('+o.id+')">Podpisz kontrakt</button></article>').join('')+'</div><h3>📋 Aktywne umowy</h3><div class="offer-grid">'+S.contracts.map(k=>{let c=S.companies.find(c=>c.id===k.company);return '<div class="offer-card"><b>'+esc(k.label)+'</b><p>'+esc(c?.name||'Firma')+' · wygasa dzień '+k.expires+'</p></div>'}).join('')+'</div>';
}
const oldTickFull=tick;
tick=function(){oldTickFull();if(S.day%3===0){S.marketOffers=S.marketOffers.filter(x=>x.expires>S.day);S.marketOffers.push(makeMarketOffer());if(S.marketOffers.length>14)S.marketOffers.shift();S.events.unshift('Nowa oferta kontraktu na rynku');S.events=S.events.slice(0,12)}refillMarket();render()};
refillMarket();
S.tab='Mapa';
render();
</script>
