<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f1e9"><title>POŁOT — Twoi ludzie, Twoje miejsce</title>
<style>
:root{--bg:#f5f1e9;--paper:#fffdf9;--ink:#292722;--muted:#777168;--line:#e6ded1;--red:#873344;--gold:#d8ad73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui, sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 14px;background:#eee8de;color:var(--ink);font-weight:700}.primary{background:var(--red);color:white}.top{height:66px;position:sticky;top:0;background:var(--paper);border-bottom:1px solid var(--line);z-index:3}.topin{max-width:1050px;margin:auto;padding:0 18px;height:100%;display:flex;align-items:center;gap:18px}.logo{font-size:26px;font-weight:950;color:var(--red);letter-spacing:-1px}.logo span{color:var(--gold)}.topin input{max-width:420px;flex:1}.topin input,textarea,.field{border:1px solid var(--line);background:#faf8f3;border-radius:11px;padding:11px 13px;outline:none}.topin button{margin-left:auto}.layout{max-width:1050px;margin:24px auto;padding:0 18px;display:grid;grid-template-columns:190px minmax(0,1fr) 220px;gap:18px}.box,.post,.composer{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 8px 24px #3825160a}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#635c53;margin:3px 0}.nav button.active,.nav button:hover{background:#eee5d9;color:var(--red)}.avatar{width:40px;height:40px;border-radius:50%;background:#ead9c7;color:#713a39;display:grid;place-items:center;font-weight:900;flex:none}.person{display:flex;gap:10px;align-items:center}.muted{color:var(--muted);font-size:13px}.welcome{background:linear-gradient(120deg,#fffdf9,#f1e5d6);padding:22px;border-radius:16px;margin-bottom:14px}.welcome h1{font-size:26px;line-height:1.15;margin:0 0 8px;letter-spacing:-1px}.welcome p{margin:0;color:var(--muted)}textarea{width:100%;min-height:85px;resize:vertical}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.posthead{display:flex;align-items:center;gap:10px}.postbody{white-space:pre-wrap;margin:14px 0}.postactions{border-top:1px solid var(--line);padding-top:9px;display:flex;gap:8px}.postactions button{background:transparent;color:#655e55}.postactions button:hover,.liked{color:var(--red)!important;background:#f7e8e8!important}.comment{background:#f5f0e8;padding:9px 11px;border-radius:10px;margin:7px 0;font-size:13px}.commentform{display:flex;gap:7px;margin-top:9px}.commentform input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px}.friend{display:flex;align-items:center;gap:9px;margin:12px 0}.friend button{margin-left:auto;padding:7px 10px}.tag{font-size:11px;color:var(--red);font-weight:800}.empty{text-align:center;padding:34px;color:var(--muted)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#28231f;color:white;padding:11px 16px;border-radius:11px;display:none;z-index:9}.modal{position:fixed;inset:0;background:#17130f99;display:grid;place-items:center;padding:18px;z-index:8}.modal[hidden]{display:none}.modalbox{width:min(410px,100%);background:var(--paper);border-radius:17px;padding:23px}.modalbox input{width:100%;margin:6px 0 12px}.modalactions{display:flex;justify-content:flex-end;gap:8px}.footer{font-size:11px;color:var(--muted);margin-top:20px}@media(max-width:850px){.layout{grid-template-columns:170px 1fr}.right{display:none}}@media(max-width:600px){.layout{display:block;margin:13px auto}.side{margin-bottom:12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.topin input{display:none}.welcome h1{font-size:22px}}
</style></head><body>
<header class="top"><div class="topin"><div class="logo">PO<span>Ł</span>OT</div><input id="search" placeholder="Szukaj wpisów…"><button class="primary" id="join">Dołącz</button><strong id="who"></strong></div></header>
<div class="layout"><aside class="side"><div class="box person" id="mini"><div class="avatar">P</div><div><b>Witaj na Połocie</b><div class="muted">Twoja społeczność</div></div></div><nav class="nav" id="nav"><button class="active" data-page="home">⌂ Aktualności</button><button data-page="friends">♧ Znajomi</button><button data-page="profile">◎ Mój profil</button></nav><div class="footer">POŁOT · wersja demonstracyjna</div></aside><main id="main"></main><aside class="right"><div class="box"><b>Warto wiedzieć</b><p class="muted">Wpisy, polubienia, komentarze i znajomi. To prototyp — dane są zapisywane lokalnie w tej przeglądarce.</p></div><div class="box"><b>Poznaj ludzi</b><div id="suggestions"></div></div></aside></div>
<div class="toast" id="toast"></div><div class="modal" id="modal" hidden><div class="modalbox"><h2>Dołącz do Połotu</h2><p class="muted">Utwórz swój profil demonstracyjny.</p><label class="muted">Imię i nazwisko</label><input class="field" id="name" placeholder="Twoje imię"><label class="muted">E-mail</label><input class="field" id="email" type="email" placeholder="ty@example.com"><div class="modalactions"><button id="cancel">Anuluj</button><button class="primary" id="create">Utwórz profil</button></div></div></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const people=[{id:'ania',name:'Ania Kowalska',bio:'Kawa, książki i małe podróże.'},{id:'marek',name:'Marek Nowak',bio:'Rower i dobre kino.'},{id:'ola',name:'Ola Wiśniewska',bio:'Fotografia i weekendowe wypady.'},{id:'jan',name:'Jan Zieliński',bio:'Muzyka, góry, planszówki.'}];
const initial=[{id:1,by:'ania',text:'W końcu weekend! Macie jakieś plany? ☀️',likes:3,liked:false,comments:[],at:Date.now()-3600000},{id:2,by:'marek',text:'Odkryłem świetną małą kawiarnię. Najlepsze espresso od dawna ☕',likes:5,liked:false,comments:[],at:Date.now()-7200000},{id:3,by:'ola',text:'Nie trzeba mieć wielkiego planu, żeby dobrze spędzić dzień. 🌿',likes:8,liked:false,comments:[],at:Date.now()-86400000}];
let data;try{data=JSON.parse(localStorage.getItem('polot'))}catch(e){}if(!data)data={user:null,posts:initial,friends:[],next:4};let page='home',query='';
const person=id=>id==='me'?data.user:people.find(p=>p.id===id)||{name:'Użytkownik'};
const av=p=>'<div class="avatar">'+esc(p?.name?.[0]||'?')+'</div>';
function save(){localStorage.setItem('polot',JSON.stringify(data))}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2200)}
function age(t){let m=Math.max(1,Math.floor((Date.now()-t)/60000));return m<60?m+' min temu':m<1440?Math.floor(m/60)+' godz. temu':Math.floor(m/1440)+' dni temu'}
function card(p){let a=person(p.by);return '<article class="post"><div class="posthead">'+av(a)+'<div><b>'+esc(a.name)+'</b><div class="muted">'+age(p.at)+'</div></div></div><div class="postbody">'+esc(p.text)+'</div><div class="muted">'+p.likes+' polubień · '+p.comments.length+' komentarzy</div><div class="postactions"><button data-like="'+p.id+'" class="'+(p.liked?'liked':'')+'">♥ Lubię to</button><button data-focus="'+p.id+'">Komentuj</button></div><div>'+p.comments.map(c=>'<div class="comment"><b>'+esc(c.name)+'</b> '+esc(c.text)+'</div>').join('')+'</div><form class="commentform" data-comment="'+p.id+'"><input name="text" placeholder="Napisz komentarz…" maxlength="280" required><button>Wyślij</button></form></article>'}
function render(){let m=$('#main');if(page==='home'){let list=data.posts.filter(p=>!query||(p.text+' '+person(p.by).name).toLowerCase().includes(query)).sort((a,b)=>b.at-a.at);m.innerHTML='<section class="welcome"><h1>Twoi ludzie. Twoje miejsce.</h1><p>Znajomi, rozmowy i codzienne chwile — po prostu po swojemu.</p></section>'+(data.user?'<section class="composer"><div class="person">'+av(data.user)+'<b>Co u Ciebie, '+esc(data.user.name.split(' ')[0])+'?</b></div><form id="publish"><textarea name="text" placeholder="Podziel się czymś ze światem…" maxlength="1000" required></textarea><div class="row"><span class="muted">✦ Miło Cię widzieć</span><button class="primary">Opublikuj</button></div></form></section>':'<section class="composer"><b>Dołącz do rozmowy</b><p class="muted">Utwórz profil, aby publikować i komentować.</p><button class="primary" id="join2">Utwórz profil</button></section>')+'<div class="feed">'+(list.length?list.map(card).join(''):'<div class="empty">Brak wpisów do wyświetlenia.</div>')+'</div>';$('#join2')?.addEventListener('click',openModal);$('#publish')?.addEventListener('submit',e=>{e.preventDefault();data.posts.push({id:data.next++,by:'me',text:e.target.text.value.trim(),likes:0,liked:false,comments:[],at:Date.now()});save();render();toast('Wpis opublikowany')});m.querySelectorAll('[data-like]').forEach(b=>b.onclick=()=>{let p=data.posts.find(x=>x.id==b.dataset.like);p.liked=!p.liked;p.likes+=p.liked?1:-1;save();render()});m.querySelectorAll('[data-comment]').forEach(f=>f.onsubmit=e=>{e.preventDefault();if(!data.user){openModal();return}let p=data.posts.find(x=>x.id==f.dataset.comment),v=f.text.value.trim();if(v){p.comments.push({name:data.user.name,text:v});save();render()}});m.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>m.querySelector('[data-comment="'+b.dataset.focus+'"] input')?.focus())}
if(page==='friends'){m.innerHTML='<h2>Znajomi</h2><section class="box"><b>Możesz ich znać</b>'+people.filter(p=>!data.friends.includes(p.id)).map(p=>'<div class="friend">'+av(p)+'<div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.bio)+'</div></div><button data-add="'+p.id+'">Dodaj</button></div>').join('')+'</section><section class="box"><b>Twoi znajomi</b>'+(data.friends.map(id=>'<div class="friend">'+av(person(id))+'<b>'+esc(person(id).name)+'</b></div>').join('')||'<p class="muted">Nie masz jeszcze znajomych.</p>')+'</section>';m.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{if(!data.user){openModal();return}data.friends.push(b.dataset.add);save();render();toast('Dodano do znajomych')})}
if(page==='profile'){m.innerHTML=data.user?'<section class="box">'+av(data.user)+'<h1>'+esc(data.user.name)+'</h1><p class="muted">'+esc(data.user.email)+'</p><button id="logout">Wyloguj z demo</button></section><h2>Twoje wpisy</h2>'+(data.posts.filter(p=>p.by==='me').map(card).join('')||'<div class="box muted">Nie masz jeszcze wpisów.</div>'):'<div class="box"><h2>Twój profil czeka na Ciebie</h2><button class="primary" id="profileJoin">Utwórz profil</button></div>';$('#profileJoin')?.addEventListener('click',openModal);$('#logout')?.addEventListener('click',()=>{data.user=null;save();render()})}
$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#who').textContent=data.user?.name||'';$('#join').hidden=!!data.user;$('#mini').innerHTML=data.user?av(data.user)+'<div><b>'+esc(data.user.name)+'</b><div class="muted">Twój profil</div></div>':'<div class="avatar">P</div><div><b>Witaj na Połocie</b><div class="muted">Twoja społeczność</div></div>';$('#suggestions').innerHTML=people.slice(0,3).map(p=>'<div class="friend">'+av(p)+'<b>'+esc(p.name)+'</b></div>').join('')}
function openModal(){$('#modal').hidden=false}$('#join').onclick=openModal;$('#cancel').onclick=()=>$('#modal').hidden=true;$('#create').onclick=()=>{let name=$('#name').value.trim(),email=$('#email').value.trim();if(!name||!email.includes('@')){toast('Podaj imię i poprawny e-mail');return}data.user={name,email};save();$('#modal').hidden=true;render();toast('Witaj na Połocie!')};$('#nav').onclick=e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}};$('#search').oninput=e=>{query=e.target.value.toLowerCase();page='home';render()};render();
</script></body></html>
