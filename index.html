<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Omini — odliczanie</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      overflow: hidden;
      background: #dce8e7;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
    }
    .village-scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(#75c8e8,#c9eff0 58%,#f8fbf2)}
    #village-canvas{display:block;width:100%;height:100%}
    .scene-fallback{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 80%,#fff 0 12%,transparent 42%),radial-gradient(ellipse at 15% 70%,#b8e3dd 0 10%,transparent 35%),radial-gradient(ellipse at 85% 65%,#a9ddd5 0 12%,transparent 36%)}
    .countdown {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 2;
      width: min(224px, calc(100vw - 24px));
      padding: 12px 14px;
      overflow: hidden;
      border: 1px solid rgba(232, 199, 125, .55);
      border-radius: 12px;
      background-color: #0d3029 !important;
      background-image:
        radial-gradient(ellipse at 50% -25%, rgba(255,255,255,.15), transparent 58%),
        linear-gradient(145deg, #173f34 0%, #0d3029 58%, #092720 100%) !important;
      box-shadow: 0 12px 32px rgba(13, 48, 41, .18), inset 0 0 0 3px rgba(230, 197, 126, .06);
    }
    .countdown::before, .countdown::after { content: none; }
    .topline {
      margin: 0 0 9px;
      color: #e8c77d;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .27em;
      text-align: center;
      text-transform: uppercase;
    }
    .heading {
      margin: 0 0 18px;
      color: #fffaf0;
      font-size: 25px;
      font-weight: 400;
      letter-spacing: .015em;
      text-align: center;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 17px;
      color: #d7b66e;
      font-size: 11px;
    }
    .divider::before, .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, transparent, rgba(215,182,110,.65));
    }
    .divider::after { transform: rotate(180deg); }
    .units { display: flex; align-items: flex-start; justify-content: center; gap: 7px; }
    .unit { min-width: 0; text-align: center; }
    .separator { color: #8b7447; font: 18px/1 ui-sans-serif, system-ui, sans-serif; padding-top: 1px; }
    .unit[hidden], .separator[hidden] { display: none; }
    .number {
      display: block;
      color: #f2d89b;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: clamp(17px, 4vw, 21px);
      line-height: 1.05;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.06em;
      text-shadow: 0 0 18px rgba(242,216,155,.17);
    }
    .unit-label {
      display: block;
      margin-top: 6px;
      color: #c4d2c8;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 8px;
      font-weight: 650;
      letter-spacing: .13em;
      text-transform: uppercase;
    }
    .date {
      margin: 15px 0 0;
      color: #d6c49c;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 10px;
      letter-spacing: .1em;
      text-align: center;
    }
    .launch {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle, #285c49, #0b2b25 72%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    .launch.active { opacity: 1; pointer-events: auto; }
    .glow {
      position: absolute;
      width: min(72vw, 620px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(239,211,148,.38), rgba(220,238,222,.12) 38%, transparent 70%);
      transform: scale(.2);
      transition: transform 2.4s cubic-bezier(.16,1,.3,1);
    }
    .launch.active .glow { transform: scale(2.2); }
    .launch-title {
      position: relative;
      margin: 0;
      color: #f4dfae;
      font-size: clamp(38px, 8vw, 78px);
      font-weight: 400;
      letter-spacing: -.04em;
      opacity: 0;
      transform: translateY(18px);
    }
    .launch.active .launch-title { animation: reveal 1.2s .55s forwards; }
    .snow {
      position: absolute;
      inset: -10vh 0;
      background-image:
        radial-gradient(3px 3px at 12% 18%, #fff 98%, transparent),
        radial-gradient(2px 2px at 72% 32%, #f2d89b 98%, transparent),
        radial-gradient(4px 4px at 42% 72%, #fff 98%, transparent),
        radial-gradient(2px 2px at 88% 84%, #e8c77d 98%, transparent),
        radial-gradient(3px 3px at 25% 52%, #fff 98%, transparent);
      background-size: 190px 190px;
      opacity: 0;
    }
    .launch.active .snow { opacity: .9; animation: snowfall 5s linear infinite; }
    @keyframes reveal { to { opacity: 1; transform: translateY(0); } }
    @keyframes snowfall { from { transform: translateY(-4%); } to { transform: translateY(8%); } }
    @media (max-width: 480px) {
      .countdown { top: 12px; right: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="village-scene" aria-hidden="true"><canvas id="village-canvas"></canvas><div class="scene-fallback"></div></div>
  <main class="countdown" aria-live="polite">
    <div class="units">
      <div class="unit" id="days-unit"><span class="number" id="days">0</span><span class="unit-label">dni</span></div>
      <span class="separator" id="days-separator">|</span>
      <div class="unit" id="hours-unit"><span class="number" id="hours">00</span><span class="unit-label">godz.</span></div>
      <span class="separator" id="hours-separator">|</span>
      <div class="unit"><span class="number" id="minutes">00</span><span class="unit-label">min</span></div>
      <span class="separator">|</span>
      <div class="unit"><span class="number" id="seconds">00</span><span class="unit-label">sek</span></div>
    </div>
  </main>

  <section class="launch" id="launch" aria-hidden="true">
    <div class="glow"></div>
    <div class="snow"></div>
  </section>

  <script>
    (() => {
      const target = new Date("2026-12-23T11:00:00+01:00").getTime();
      const fields = {
        days: document.getElementById("days"),
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds")
      };
      const launch = document.getElementById("launch");
      const daysUnit = document.getElementById("days-unit");
      const daysSeparator = document.getElementById("days-separator");
      const hoursUnit = document.getElementById("hours-unit");
      const hoursSeparator = document.getElementById("hours-separator");
      let redirected = false;

      function tick() {
        const remaining = target - Date.now();
        if (remaining <= 0) {
          Object.values(fields).forEach((field) => field.textContent = "00");
          if (!redirected) {
            redirected = true;
            launch.classList.add("active");
            launch.setAttribute("aria-hidden", "false");
            window.setTimeout(() => {
              window.location.href = "./tracker/";
            }, 4200);
          }
          return;
        }
        const days = Math.floor(remaining / 86400000);
        const hours = Math.floor((remaining % 86400000) / 3600000);
        const minutes = Math.floor((remaining % 3600000) / 60000);
        const seconds = Math.floor((remaining % 60000) / 1000);
        fields.days.textContent = String(days);
        daysUnit.hidden = days === 0;
        daysSeparator.hidden = days === 0;
        hoursUnit.hidden = days === 0;
        hoursSeparator.hidden = days === 0;
        fields.hours.textContent = String(hours).padStart(2, "0");
        fields.minutes.textContent = String(minutes).padStart(2, "0");
        fields.seconds.textContent = String(seconds).padStart(2, "0");
      }
      tick();
      window.setInterval(tick, 1000);
    })();
  </script>

<script type="module">
try {
 const T=await import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js");
 const scene=new T.Scene(); scene.background=new T.Color("#a8dce9"); scene.fog=new T.Fog("#c8e9e9",18,45);
 const camera=new T.PerspectiveCamera(38,1,.1,100); camera.position.set(0,8.5,23); camera.lookAt(0,3.3,0);
 const renderer=new T.WebGLRenderer({canvas:document.getElementById("village-canvas"),antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,2)); renderer.shadowMap.enabled=true; renderer.outputColorSpace=T.SRGBColorSpace; renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=1.15;
 scene.add(new T.HemisphereLight("#eafaff","#719b91",2));
 const sun=new T.DirectionalLight("#fff1d2",3); sun.position.set(-7,13,9); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); scene.add(sun);
 const M=(c,e=0)=>new T.MeshStandardMaterial({color:c,roughness:.8,emissive:e,emissiveIntensity:.7});
 const white=M("#fffdf4"), ice=M("#b8e9ed"), green=M("#71c9a9"), wood=M("#99634b"), gold=M("#ffd778","#a86618");
 const houses=["#f3a56e","#f08da5","#8ecb9d","#9bafe8","#e8c66d"].map(x=>M(x)), roofs=["#d94f61","#4f83c8","#e77e46","#6aaf9b","#9878c8"].map(x=>M(x));
 const box=new T.BoxGeometry(1,1,1), sph=new T.SphereGeometry(1,20,14), cone=new T.ConeGeometry(1,1,6), cyl=new T.CylinderGeometry(1,1,1,16);
 function add(g,geo,ma,x,y,z,sx=1,sy=1,sz=1){let o=new T.Mesh(geo,ma);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;g.add(o);return o}
 function group(p,x=0,y=0,z=0){let g=new T.Group();g.position.set(x,y,z);p.add(g);return g}
 function island(x,y,z,s=1){let g=group(scene,x,y,z);g.scale.setScalar(s);add(g,sph,ice,0,0,0,2.4,.42,1.5);add(g,sph,white,-1.3,.12,0,1,.46,.8);add(g,sph,white,1.3,.12,.1,1,.46,.8);add(g,sph,white,0,.2,-.5,1.4,.48,.8);add(g,sph,green,0,-.17,0,2.1,.2,1.3);return g}
 function house(p,x,y,z,s,i){let g=group(p,x,y,z);g.scale.setScalar(s);add(g,box,houses[i%5],0,.7,0,1.7,1.35,1.3);let r=add(g,cone,roofs[i%5],0,1.65,0,1.45,1.3,1.25);r.rotation.y=Math.PI/4;add(g,box,white,0,1.36,.68,1.85,.12,.1);add(g,box,wood,0,.4,.68,.36,.8,.08);for(let wx of [-.5,.5]){add(g,box,M("#ffe39a","#ffbd52"),wx,.88,.69,.3,.38,.07);add(g,box,white,wx,.88,.73,.04,.42,.025)}add(g,box,wood,.52,2,-.3,.23,.6,.25);add(g,sph,white,.52,2.35,-.3,.2,.13,.2);return g}
 function tree(p,x,y,z,s=1){let g=group(p,x,y,z);g.scale.setScalar(s);add(g,cyl,wood,0,.4,0,.18,.8,.18);for(let j=0;j<3;j++){add(g,cone,M(["#279b79","#38ae86","#58c69a"][j]),0,1+j*.42,0,1.05-j*.15,1.25,1.05-j*.15);add(g,sph,white,-.2,1.3+j*.35,.2,.35,.1,.3)}add(g,sph,gold,0,2.25,0,.12,.12,.12)}
 function elf(x,y,z,coat,hat,s=1){let g=group(scene,x,y,z);g.scale.setScalar(s);let skin=M("#f4bd91"),arm;add(g,sph,M(coat),0,.8,0,.36,.5,.27);add(g,sph,skin,0,1.5,.02,.31,.35,.28);add(g,sph,M("#754b38"),-.1,1.68,-.02,.2,.18,.23);add(g,cone,M(hat),0,1.98,0,.34,.7,.34);add(g,sph,white,0,2.34,0,.1,.1,.1);for(let ex of [-.12,.12])add(g,sph,M("#344e55"),ex,1.52,.27,.035,.05,.025);add(g,sph,M("#ed8d82"),0,1.42,.29,.04,.03,.02);add(g,box,gold,0,1,.25,.4,.07,.04);arm=add(g,cyl,skin,.39,1.1,0,.1,.55,.1);arm.rotation.z=-.8;g.userData.arm=arm;add(g,cyl,white,-.15,.2,0,.12,.4,.12);add(g,cyl,white,.15,.2,0,.12,.4,.12);add(g,box,wood,-.15,.02,.1,.28,.12,.35);add(g,box,wood,.15,.02,.1,.28,.12,.35);return g}
 const plaza=island(0,.35,0,1.45);add(plaza,sph,green,0,.18,.05,2.1,.24,1.3);
 const f=group(scene,0,1,1.2);add(f,cyl,M("#68b9c9"),0,.12,0,2.1,.3,2.1);add(f,cyl,ice,0,.3,0,1.8,.18,1.8);add(f,cyl,M("#4eb9d1"),0,.42,0,1.45,.12,1.45);add(f,cyl,white,0,.55,0,.32,.4,.32);add(f,sph,gold,0,.82,0,.18,.18,.18);
 const jets=[];for(let i=0;i<9;i++){let a=i/9*Math.PI*2;let d=add(f,sph,M("#d8ffff","#5ecce4"),Math.cos(a)*.5,1,Math.sin(a)*.5,.07,.15,.07);jets.push({d,a})}
 const configs=[[-7.2,4,-1.8,.9,0],[7.2,4.2,-2,.95,1],[-4.3,2.3,-3,.72,3],[4.5,2.5,-3.5,.72,2],[0,6,-5.5,.67,4]], islands=[];
 configs.forEach(([x,y,z,s,i],n)=>{let g=island(x,y,z,s);house(g,0,.22,0,.78,i);tree(g,-1.2,.1,.2,.43);tree(g,1.2,.1,-.2,.43);islands.push({g,y,n})});
 house(plaza,-2,.28,-.35,.5,2);house(plaza,2,.28,-.4,.48,1);tree(plaza,-2.8,.1,.3,.52);tree(plaza,2.8,.1,.3,.52);
 const elves=[elf(-2.1,1,2.3,"#e65361","#e65361",.82),elf(2.1,1,2.3,"#278d70","#3289c3",.82),elf(0,1,-2,"#8d68c8","#e65361",.66)];
 const n=900,pos=new Float32Array(n*3),speed=[];for(let i=0;i<n;i++){pos[i*3]=(Math.random()-.5)*34;pos[i*3+1]=Math.random()*18;pos[i*3+2]=(Math.random()-.5)*22;speed.push(.5+Math.random())}
 const sg=new T.BufferGeometry();sg.setAttribute("position",new T.BufferAttribute(pos,3));scene.add(new T.Points(sg,new T.PointsMaterial({color:"#fff",size:.075,transparent:true,opacity:.9})));
 const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,clock=new T.Clock();
 function resize(){let w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.position.z=w/h<.75?29:23;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}addEventListener("resize",resize);resize();
 function animate(){requestAnimationFrame(animate);let t=clock.getElapsedTime(),m=reduced?0:1;islands.forEach(o=>{o.g.position.y=o.y+Math.sin(t*.7+o.n)*.18*m;o.g.rotation.z=Math.sin(t*.4+o.n)*.025*m});plaza.position.y=.35+Math.sin(t*.5)*.06*m;elves.forEach((e,i)=>{e.position.y=1+Math.sin(t*2+i)*.08*m;e.userData.arm.rotation.z=-.8+Math.sin(t*3+i)*.3*m});jets.forEach((o,i)=>o.d.position.y=.85+Math.abs(Math.sin(t*2.5+i))*.65*m);for(let i=0;i<n;i++){pos[i*3+1]-=speed[i]*.018*m;if(pos[i*3+1]<-.5){pos[i*3+1]=18;pos[i*3]=(Math.random()-.5)*34}}sg.attributes.position.needsUpdate=true;renderer.render(scene,camera)}
 animate();document.querySelector(".scene-fallback").hidden=true;
} catch(e){console.warn("Scena 3D niedostępna:",e)}
</script>

</body>
</html>
