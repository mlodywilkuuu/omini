<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symulator Zarządzania Ligą Futsalu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto space-y-6">
        
        <!-- Nagłówek i Statystyki Główne -->
        <header class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-wide text-emerald-400">Ekstraklasa Futsalu - Zarządzanie Ligą</h1>
                <p class="text-sm text-slate-400">Prezydent Związku: <span class="text-slate-200 font-medium">Jan Kowalski</span></p>
            </div>
            <div class="flex flex-wrap gap-4 text-center">
                <div class="bg-slate-800 px-4 py-2 rounded-xl border border-slate-700">
                    <span class="block text-xs text-slate-400">Kolejka</span>
                    <span id="stat-kolejka" class="text-lg font-bold text-amber-400">1 / 10</span>
                </div>
                <div class="bg-slate-800 px-4 py-2 rounded-xl border border-slate-700">
                    <span class="block text-xs text-slate-400">Reputacja Ligi</span>
                    <span id="stat-reputacja" class="text-lg font-bold text-sky-400">65/100</span>
                </div>
                <div class="bg-slate-800 px-4 py-2 rounded-xl border border-slate-700">
                    <span class="block text-xs text-slate-400">Budżet Związku</span>
                    <span id="stat-budzet" class="text-lg font-bold text-emerald-400">15,000,000 PLN</span>
                </div>
            </div>
        </header>

        <!-- Panel Akcji / Menu -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <button onclick="symulujKolejke()" id="btn-symuluj" class="bg-emerald-600 hover:bg-emerald-500 font-semibold p-4 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                ⚽ Symuluj Kolejkę
            </button>
            <button onclick="pokazFinanse()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 font-semibold p-4 rounded-xl transition shadow-lg">
                💰 Finanse i Sponsorzy
            </button>
            <button onclick="pokazRegulamin()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 font-semibold p-4 rounded-xl transition shadow-lg">
                ⚖️ Komisja Ligi i Sędziowie
            </button>
            <button onclick="pokazKlubyMenu()" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 font-semibold p-4 rounded-xl transition shadow-lg">
                🏟️ Dotacje i Licencje Klubów
            </button>
            <button onclick="resetujGre()" class="bg-rose-900/40 hover:bg-rose-900/60 border border-rose-800 text-rose-300 font-semibold p-4 rounded-xl transition shadow-lg sm:col-span-2 md:col-span-2">
                🔄 Resetuj Sezon
            </button>
        </div>

        <!-- Sekcja Główna / Wyniki i Tabela -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Tabela Ligowa -->
            <div class="md:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-slate-200">Tabela Ligowa</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="border-b border-slate-800 text-slate-400">
                                <th class="py-2 px-2">Poz</th>
                                <th class="py-2 px-2">Klub</th>
                                <th class="py-2 px-2 text-center">M</th>
                                <th class="py-2 px-2 text-center">Pkt</th>
                                <th class="py-2 px-2 text-center">BZ:BS</th>
                                <th class="py-2 px-2 text-right">Budżet</th>
                            </tr>
                        </thead>
                        <tbody id="tabela-body">
                            <!-- Dynamiczne wiersze tabeli -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Panel Komunikatów / Logów -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col">
                <h2 class="text-xl font-bold mb-4 text-slate-200">Wydarzenia</h2>
                <div id="logi-kontener" class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex-1 text-xs text-slate-300 space-y-2 overflow-y-auto max-h-[300px]">
                    <p class="text-slate-500">Rozpoczął się nowy sezon rozgrywek. Zarządzaj ligą mądrze!</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal Interaktywny -->
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4">
            <h3 id="modal-tytul" class="text-xl font-bold text-slate-100">Tytuł</h3>
            <div id="modal-tresc" class="text-sm text-slate-300 space-y-3">
                <!-- Zawartość modala -->
            </div>
            <div class="flex justify-end pt-2">
                <button onclick="zamknijModal()" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl font-medium transition">Zamknij</button>
            </div>
        </div>
    </div>

    <script>
        let stan = {
            kolejka: 1,
            budzet_centralny: 15000000,
            reputacja: 65,
            kluby: {
                "Legion Białystok": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 2500000, forma: 3 },
                "Super Strikers": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 2200000, forma: 3 },
                "FC Dinamo Wrocław": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 3000000, forma: 3 },
                "Jagiellonia Futsal": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 3500000, forma: 3 },
                "Orły Warszawa": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 2800000, forma: 3 },
                "Błękitni Poznań": { punkty: 0, bramki_strzelone: 0, bramki_stracone: 0, budzet: 2000000, forma: 3 }
            },
            sponsorzy: {
                "Główny Sponsor (BetPol)": 3000000,
                "Sponsor Techniczny (Sportwear)": 1500000,
                "Partner Medyczny (MediCare)": 800000
            }
        };

        function odswiezUI() {
            document.getElementById('stat-kolejka').innerText = `${stan.kolejka} / 10`;
            document.getElementById('stat-reputacja').innerText = `${stan.reputacja}/100`;
            document.getElementById('stat-budzet').innerText = stan.budzet_centralny.toLocaleString() + " PLN";

            let tbody = document.getElementById('tabela-body');
            tbody.innerHTML = '';

            let posortowane = Object.entries(stan.kluby).sort((a, b) => {
                let pktA = a[1].punkty, pktB = b[1].punkty;
                if (pktA !== pktB) return pktB - pktA;
                let bilansA = a[1].bramki_strzelone - a[1].bramki_stracone;
                let bilansB = b[1].bramki_strzelone - b[1].bramki_stracone;
                if (bilansA !== bilansB) return bilansB - bilansA;
                return b[1].bramki_strzelone - a[1].bramki_strzelone;
            });

            posortowane.forEach(([nazwa, dane], idx) => {
                let bilans = dane.bramki_strzelone - dane.bramki_stracone;
                let row = `<tr class="border-b border-slate-800/50 hover:bg-slate-800/30">
                    <td class="py-3 px-2 font-semibold text-slate-400">${idx + 1}</td>
                    <td class="py-3 px-2 font-medium text-slate-200">${nazwa}</td>
                    <td class="py-3 px-2 text-center text-slate-400">${stan.kolejka - 1}</td>
                    <td class="py-3 px-2 text-center font-bold text-emerald-400">${dane.punkty}</td>
                    <td class="py-3 px-2 text-center text-slate-300">${dane.bramki_strzelone}:${dane.bramki_stracone} (${bilans > 0 ? '+' + bilans : bilans})</td>
                    <td class="py-3 px-2 text-right text-slate-400">${(dane.budzet / 1000000).toFixed(1)}M PLN</td>
                </tr>`;
                tbody.innerHTML += row;
            });

            if (stan.kolejka > 10) {
                document.getElementById('btn-symuluj').disabled = true;
                document.getElementById('btn-symuluj').classList.add('opacity-50', 'cursor-not-allowed');
                dodajLog("🏆 Sezon dobiegł końca! Sprawdź ostateczną tabelę ligową.");
            }
        }

        function dodajLog(tekst) {
            let kontener = document.getElementById('logi-kontener');
            kontener.innerHTML += `<p class="border-l-2 border-emerald-500 pl-2 py-0.5">${tekst}</p>`;
            kontener.scrollTop = kontener.scrollHeight;
        }

        function symulujKolejke() {
            if (stan.kolejka > 10) return;

            letklubyLista = Object.keys(stan.kluby);
            // Tasowanie tablicy
            for (let i = klubyLista.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [klubyLista[i], klubyLista[j]] = [klubyLista[j], klubyLista[i]];
            }

            let wynikiTekst = `<strong>Wyniki kolejki ${stan.kolejka}:</strong><br>`;
            for (let i = 0; i < klubyLista.length; i += 2) {
                let g = klubyLista[i];
                let as = klubyLista[i+1];

                let gBramki = Math.floor(Math.random() * 5) + (stan.kluby[g].forma > 3 ? 1 : 0);
                let asBramki = Math.floor(Math.random() * 5) + (stan.kluby[as].forma > 3 ? 1 : 0);

                stan.kluby[g].bramki_strzelone += gBramki;
                stan.kluby[g].bramki_stracone += asBramki;
                stan.kluby[as].bramki_strzelone += asBramki;
                stan.kluby[as].bramki_stracone += gBramki;

                if (gBramki > asBramki) {
                    stan.kluby[g].punkty += 3;
                } else if (asBramki > gBramki) {
                    stan.kluby[as].punkty += 3;
                } else {
                    stan.kluby[g].punkty += 1;
                    stan.kluby[as].punkty += 1;
                }

                wynikiTekst += `🏟️ ${g} ${gBramki} : ${asBramki} ${as}<br>`;
            }

            dodajLog(wynikiTekst);

            // Zdarzenia losowe
            let los = Math.floor(Math.random() * 4) + 1;
            if (los === 1) {
                stan.budzet_centralny += 50000;
                dodajLog("ℹ️ Komisja nałożyła kary finansowe na zawodników (+50,000 PLN).");
            } else if (los === 2) {
                stan.reputacja = Math.min(100, stan.reputacja + 2);
                dodajLog("ℹ️ Świetny poziom meczów podniósł reputację ligi!");
            } else if (los === 3) {
                stan.reputacja = Math.max(10, stan.reputacja - 2);
                dodajLog("ℹ️ Skandal sędziowski w jednej z hal! Spadek reputacji.");
            }

            stan.kolejka++;
            odswiezUI();
        }

        function pokazFinanse() {
            otworzModal("Finanse i Marketing", `
                <p class="text-slate-400">Dostępne środki związku: <strong class="text-emerald-400">${stan.budzet_centralny.toLocaleString()} PLN</strong></p>
                <div class="space-y-2 py-2">
                    <button onclick="negocjujSponsorow()" class="w-full bg-slate-800 hover:bg-slate-700 p-3 rounded-xl text-left transition flex justify-between items-center">
                        <span>🤝 Negocjuj nowe umowy sponsorskie</span>
                        <span class="text-xs text-slate-400">Koszt: 200k PLN</span>
                    </button>
                    <button onclick="kampaniaPromocyjna()" class="w-full bg-slate-800 hover:bg-slate-700 p-3 rounded-xl text-left transition flex justify-between items-center">
                        <span>📈 Ogólnokrajowa kampania promocyjna (+5 reputacji)</span>
                        <span class="text-xs text-slate-400">Koszt: 500k PLN</span>
                    </button>
                    <button onclick="wplacKlubom()" class="w-full bg-slate-800 hover:bg-slate-700 p-3 rounded-xl text-left transition flex justify-between items-center">
                        <span>💰 Wypłać dywidendę klubom (po 100k dla każdego)</span>
                        <span class="text-xs text-slate-400">Koszt zależny</span>
                    </button>
                </div>
            `);
        }

        function negocjujSponsorow() {
            if (stan.budzet_centralny >= 200000) {
                stan.budzet_centralny -= 200000;
                let zysk = Math.floor(Math.random() * 1000000) + 500000;
                stan.budzet_centralny += zysk;
                dodajLog(`🎉 Pozyskano nowego sponsora! Zysk netto: ${(zysk - 200000).toLocaleString()} PLN`);
                zamknijModal();
                odswiezUI();
            } else {
                alert("Za mało środków!");
            }
        }

        function kampaniaPromocyjna() {
            if (stan.budzet_centralny >= 500000) {
                stan.budzet_centralny -= 500000;
                stan.reputacja = Math.min(100, stan.reputacja + 5);
                dodajLog("📈 Kampania medialna przyciągnęła uwagę kibiców. Reputacja wzrosła.");
                zamknijModal();
                odswiezUI();
            } else {
                alert("Za mało środków!");
            }
        }

        function wplacKlubom() {
            let koszt = Object.keys(stan.kluby).length * 100000;
            if (stan.budzet_centralny >= koszt) {
                stan.budzet_centralny -= koszt;
                for (let k in stan.kluby) stan.kluby[k].budzet += 100000;
                dodajLog("🤝 Wsparto wszystkie kluby kwotą po 100,000 PLN.");
                zamknijModal();
                odswiezUI();
            } else {
                alert("Brak wystarczających środków w budżecie centralnym!");
            }
        }

        function pokazRegulamin() {
            otworzModal("Komisja Ligi i Sędziowie", `
                <div class="space-y-2">
                    <button onclick="szkolenieVar()" class="w-full bg-slate-800 hover:bg-slate-700 p-3 rounded-xl text-left transition flex justify-between items-center">
                        <span>🎯 Przeprowadź szkolenie VAR / Popraw sędziowanie</span>
                        <span class="text-xs text-slate-400">300k PLN</span>
                    </button>
                    <div class="pt-2">
                        <p class="text-xs text-slate-400 mb-2">Nałóż karę regulaminową (-1 pkt) na wybrany klub:</p>
                        <div class="grid grid-cols-2 gap-2">
                            ${Object.keys(stan.kluby).map(k => `<button onclick="ukarajKlub('${k}')" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-lg text-xs text-left">${k}</button>`).join('')}
                        </div>
                    </div>
                </div>
            `);
        }

        function szkolenieVar() {
            if (stan.budzet_centralny >= 300000) {
                stan.budzet_centralny -= 300000;
                stan.reputacja = Math.min(100, stan.reputacja + 3);
                dodajLog("✅ Szkolenie sędziów poprawiło jakość gwizdków. Wzrosła reputacja.");
                zamknijModal();
                odswiezUI();
            } else {
                alert("Za mało środków!");
            }
        }

        function ukarajKlub(klub) {
            stan.kluby[klub].punkty = Math.max(0, stan.kluby[klub].punkty - 1);
            stan.budzet_centralny += 50000;
            dodajLog(`⚖️ Klub ${klub} ukarany odebraniem 1 punktu i grzywną 50k PLN.`);
            zamknijModal();
            odswiezUI();
        }

        function pokazKlubyMenu() {
            otworzModal("Dotacje Infrastrukturalne", `
                <p class="text-xs text-slate-400 mb-3">Przekaż dotację celową (300,000 PLN), aby podnieść formę klubu:</p>
                <div class="space-y-2">
                    ${Object.entries(stan.kluby).map(([k, d]) => `
                        <div class="flex justify-between items-center bg-slate-800 p-2 rounded-lg text-xs">
                            <span>${k} (Forma:${d.forma}/5)</span>
                            <button onclick="dajDotacje('${k}')" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-1 rounded font-medium">Dotuj</button>
                        </div>
                    `).join('')}
                </div>
            `);
        }

        function dajDotacje(klub) {
            if (stan.budzet_centralny >= 300000) {
                stan.budzet_centralny -= 300000;
                stan.kluby[klub].forma = Math.min(5, stan.kluby[klub].forma + 1);
                dodajLog(`🏟️ Klub ${klub} doskonale wykorzystał dotację celową! Wzrosła forma drużyny.`);
                zamknijModal();
                odswiezUI();
            } else {
                alert("Brak środków w budżecie centralnym!");
            }
        }

        function otworzModal(tytul, tresc) {
            document.getElementById('modal-tytul').innerText = tytul;
            document.getElementById('modal-tresc').innerHTML = tresc;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('modal').classList.add('flex');
        }

        function zamknijModal() {
            document.getElementById('modal').classList.remove('flex');
            document.getElementById('modal').classList.add('hidden');
        }

        function resetujGre() {
            if (confirm("Czy na pewno chcesz zresetować cały sezon ligowy?")) {
                location.reload();
            }
        }

        // Inicjalizacja startowa
        odswiezUI();
    </script>
</body>
</html>
