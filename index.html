<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA — Tech Empire</title>
<style>
:root{--bg:#070b14;--panel:#0e1422cc;--panel2:#121a2bcc;--line:#ffffff12;--text:#eef4ff;--muted:#8e9bb5;--a:#6d7cff;--b:#22d3ee;--good:#42e6a4;--bad:#ff637d;--warn:#ffc857;--shadow:0 20px 60px #0008}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#17265a 0,#070b14 35%),radial-gradient(circle at 100% 100%,#123f4c 0,#070b14 35%);color:var(--text)}
button,input,select{font:inherit}button{border:0;cursor:pointer;color:#fff;background:linear-gradient(135deg,#6675ff,#24c8df);padding:10px 14px;border-radius:12px;font-weight:750;box-shadow:0 8px 25px #0003}button:hover{filter:brightness(1.12);transform:translateY(-1px)}button.secondary{background:#ffffff0c;border:1px solid var(--line);box-shadow:none}button.danger{background:linear-gradient(135deg,#ff4e6d,#bd3157)}button.good{background:linear-gradient(135deg,#20c997,#22b8cf)}button.small{padding:7px 10px;font-size:12px}.app{display:flex;min-height:100vh}.sidebar{width:255px;position:fixed;inset:0 auto 0 0;padding:22px 16px;background:#080d18d9;border-right:1px solid var(--line);backdrop-filter:blur(24px);z-index:5}.brand{font-size:25px;font-weight:950;letter-spacing:-1px;margin:4px 8px 3px}.brand span{color:#69d9ff}.tag{font-size:11px;color:var(--muted);margin:0 8px 22px}.nav{display:grid;gap:7px}.nav button{width:100%;text-align:left;background:transparent;border:1px solid transparent;box-shadow:none;color:#aab6cb}.nav button.active,.nav button:hover{background:linear-gradient(90deg,#6576ff24,#20d6eb12);border-color:#ffffff10;color:#fff}.sideBottom{position:absolute;bottom:18px;left:16px;right:16px}.saveDot{font-size:11px;color:var(--good);padding:9px 10px;background:#42e6a40c;border:1px solid #42e6a41c;border-radius:10px}.main{margin-left:255px;width:calc(100% - 255px);padding:25px;max-width:1700px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.title h1{margin:0;font-size:30px}.title p{margin:5px 0 0;color:var(--muted)}.topActions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:linear-gradient(145deg,#121a2be8,#0b111ddd);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow);backdrop-filter:blur(20px)}.stat{min-height:115px}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:27px;font-weight:900;margin-top:9px}.delta{font-size:11px;margin-top:6px}.goodtxt{color:var(--good)}.badtxt{color:var(--bad)}.warntxt{color:var(--warn)}.section{margin-top:17px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:0 0 11px}.sectionTitle h2{font-size:17px;margin:0}.muted{color:var(--muted)}.two{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px;background:#ffffff06;border:1px solid #ffffff0b;border-radius:13px}.row strong{display:block}.row small{color:var(--muted)}.pill{display:inline-flex;padding:4px 8px;border-radius:99px;background:#ffffff0b;border:1px solid var(--line);font-size:11px;color:#bdc7d8}.bar{height:8px;border-radius:99px;background:#ffffff0a;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:99px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid #ffffff0b;text-align:left;font-size:13px}.table th{color:var(--muted);font-weight:650}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #ffffff18;border-radius:15px}.hero{padding:23px;background:linear-gradient(135deg,#6978ff1d,#20d6eb10,#ffffff04);border:1px solid #ffffff12;border-radius:20px}.hero h2{margin:0 0 5px;font-size:25px}.hero p{color:#aeb9ce;margin:0;line-height:1.55}.productGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.product{min-height:190px}.productTop{display:flex;justify-content:space-between;gap:8px}.product h3{margin:0;font-size:17px}.metric{font-size:22px;font-weight:900;margin-top:15px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.miniGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.mini{background:#ffffff05;padding:10px;border-radius:11px}.mini span{display:block;color:var(--muted);font-size:10px}.mini b{font-size:14px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modalBox{width:min(760px,100%);max-height:88vh;overflow:auto;background:#0d1423f5;border:1px solid #ffffff18;border-radius:20px;padding:20px;box-shadow:0 30px 100px #000b;backdrop-filter:blur(25px)}.modalHead{display:flex;justify-content:space-between;align-items:center}.modalHead h2{margin:0}.close{background:#ffffff0b!important;padding:7px 10px!important}.form{display:grid;gap:10px}.form input,.form select{width:100%;padding:11px 12px;border-radius:11px;background:#080d18;border:1px solid #ffffff16;color:#fff;outline:none}.cheat{display:none;position:fixed;right:22px;bottom:22px;width:370px;z-index:30}.cheat.open{display:block}.code{font-family:ui-monospace,Consolas,monospace;color:#8fffe0;background:#050810;border:1px solid #ffffff14;padding:12px;border-radius:12px;min-height:120px;white-space:pre-wrap}.toast{position:fixed;right:20px;top:20px;z-index:50;display:grid;gap:8px}.toast div{background:#111a2bf2;border:1px solid #ffffff18;padding:12px 15px;border-radius:12px;box-shadow:var(--shadow)}.progress{height:10px;background:#ffffff0a;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#7b61ff,#1fd8eb)}.chart{height:180px;display:flex;align-items:end;gap:8px;padding-top:15px}.col{flex:1;display:flex;flex-direction:column;justify-content:end;height:100%;gap:5px}.col i{display:block;min-height:3px;background:linear-gradient(180deg,#62e7c0,#596dff);border-radius:6px 6px 2px 2px}.col span{text-align:center;color:var(--muted);font-size:9px}.map{height:300px;border-radius:18px;border:1px solid #ffffff10;position:relative;overflow:hidden;background:radial-gradient(circle at 25% 30%,#244b65 0 2%,transparent 2.5%),radial-gradient(circle at 65% 45%,#254c75 0 3%,transparent 3.5%),radial-gradient(circle at 50% 80%,#164958 0 2%,transparent 2.5%),linear-gradient(140deg,#0b1725,#0d2630)}.map:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:40px 40px}.city{position:absolute;z-index:1;padding:6px 9px;border-radius:99px;background:#101a2ce8;border:1px solid #ffffff17;font-size:10px}.city b{color:#71ddff}.timeline{border-left:2px solid #ffffff12;margin-left:8px;padding-left:16px;display:grid;gap:13px}.event{position:relative}.event:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:#6e7cff;box-shadow:0 0 18px #6e7cff}.dangerBox{border:1px solid #ff637d33;background:#ff637d08}.successBox{border:1px solid #42e6a433;background:#42e6a408}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.productGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.sidebar{position:relative;width:100%;height:auto}.sideBottom{position:static;margin-top:15px}.app{display:block}.main{margin:0;width:100%;padding:14px}.grid,.productGrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.nav{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand">NEXORA<span>●</span></div>
  <div class="tag">TECH EMPIRE SIMULATOR</div>
  <div class="nav" id="nav"></div>
  <div class="sideBottom"><div class="saveDot">● Automatyczny zapis aktywny</div></div>
</aside>
<main class="main">
  <div class="top">
    <div class="title"><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Buduj globalne imperium technologiczne.</p></div>
    <div class="topActions">
      <button class="secondary" onclick="toggleCheats()">⚡ F2 Cheaty</button>
      <button class="secondary" onclick="save(true)">💾 Zapisz</button>
      <button onclick="nextDay()">⏭ Następny dzień</button>
    </div>
  </div>
  <div id="content"></div>
</main>
</div>

<div class="modal" id="modal"><div class="modalBox" id="modalBox"></div></div>
<div class="cheat card" id="cheat">
  <div class="modalHead"><h2>⚡ Konsola cheatów</h2><button class="close" onclick="toggleCheats()">×</button></div>
  <p class="muted">F2 otwiera/zamyka. Enter wykonuje komendę.</p>
  <input id="cheatInput" placeholder="np. money 10000000">
  <div class="actions">
    <button class="small" onclick="runCheat('money 10000000')">+$10M</button>
    <button class="small" onclick="runCheat('users 1000000')">+1M users</button>
    <button class="small" onclick="runCheat('gpu 100')">+100 GPU</button>
    <button class="small" onclick="runCheat('employees 10')">+10 prac.</button>
    <button class="small" onclick="runCheat('rp 5000')">+5000 RP</button>
    <button class="small" onclick="runCheat('unlockall')">Odblokuj wszystko</button>
  </div>
  <div class="code" id="consoleLog">NEXORA console ready.</div>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY="nexora-tech-empire-v4";
const NAV=[
["dashboard","⌂","Dashboard"],["products","◈","Produkty"],["ai","◉","AI Lab"],["employees","♙","Pracownicy"],
["servers","▣","Data Center"],["companies","◆","Firmy"],["stocks","◌","Giełda"],["world","◎","Ekspansja"],
["rnd","✦","R&D"],["finance","$","Finanse"],["events","!","Wydarzenia"],["settings","⚙","Ustawienia"]
];
const roles=[
["Software Engineer",1700,"Programowanie"],["AI Engineer",2400,"AI"],["Product Designer",1450,"Design"],
["Data Scientist",2200,"Dane"],["Marketing Manager",1800,"Marketing"],["Cloud Engineer",2100,"Cloud"],
["Security Engineer",2300,"Security"],["Product Manager",2000,"Management"],["Hardware Engineer",1900,"Hardware"],["Recruiter",1300,"HR"]
];
const productTypes=["Search","AI","Social","Video","Cloud","Browser","OS","Hardware","Maps","Gaming"];
const techs=[
["Distributed Cloud",300,"Tańsza infrastruktura chmurowa.",.08],
["Neural Search",500,"Więcej użytkowników produktów Search.",.12],
["Autonomous Agents",800,"AI generuje większy przychód.",.15],
["Quantum Computing",1200,"Wysoka wycena i bonus R&D.",.22],
["Neural Hardware",1600,"Tańsza produkcja sprzętu.",.18],
["Global Ads Engine",2200,"Duży bonus do przychodu reklam.",.25]
];
function company(name,ticker,type,price,holders){return {id:uid(),name,ticker,type,price,prev:price,shares:100,holders,owned:0,controlled:false,strategy:"Wzrost",capital:0,products:[],history:[price]}}
function uid(){return Math.random().toString(36).slice(2,10)}
function defaultState(){
 return {
  version:4,companyName:"NEXORA",day:1,year:2026,month:1,cash:2500000,users:1200,reputation:72,
  employees:[],candidate:null,office:{level:1},products:[],gpu:10,gpuUsed:0,servers:[{id:uid(),name:"NEXORA Core-01",level:1,load:18}],
  models:[],subsidiaries:[],researchPoints:100,technologies:[],events:["Założono NEXORA — czas zbudować imperium."],
  incomeHistory:[],expenseHistory:[],profitHistory:[],userHistory:[1200],
  regions:{USA:false,Polska:true,Niemcy:false,UK:false,Japonia:false,Indie:false,Kanada:false,Australia:false,Brazylia:false},
  companies:[
   company("Quantum Labs","QTL","AI",42,[["Alex Morgan",34],["Atlas Capital",22],["Northstar Ventures",16],["Global Bank",10],["Public Investors",18]]),
   company("CloudForge","CFG","Cloud",28,[["Daniel Reed",31],["Vertex Fund",24],["Atlas Capital",18],["Global Bank",9],["Public Investors",18]]),
   company("PixelStream","PXS","Media",64,[["Maya Chen",38],["Media Growth Fund",20],["Northstar Ventures",15],["Global Bank",7],["Public Investors",20]]),
   company("Nova Systems","NVS","Software",91,[["Ethan Cole",29],["Atlas Capital",25],["Vertex Fund",19],["Global Bank",8],["Public Investors",19]]),
   company("Orbital AI","OAI","AI",117,[["Sarah Kim",27],["Northstar Ventures",23],["Atlas Capital",21],["Global Bank",9],["Public Investors",20]])
  ]
 }
}
let S=load(),page="dashboard",selectedCompany=null;
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));return x?migrate(x):defaultState()}catch(e){return defaultState()}}
function migrate(s){
 let d=defaultState(); s={...d,...s}; s.office={...d.office,...(s.office||{})}; s.regions={...d.regions,...(s.regions||{})};
 s.employees=Array.isArray(s.employees)?s.employees:[];s.products=Array.isArray(s.products)?s.products:[];s.companies=Array.isArray(s.companies)&&s.companies.length?s.companies:d.companies;
 s.companies.forEach(c=>{c.shares=100;c.holders=Array.isArray(c.holders)?c.holders:[];if(!c.holders.length)c.holders=[["Public Investors",100]]; normalize(c); c.history=c.history||[c.price]});
 return s
}
function normalize(c){
 let p=playerShares(c); let total=c.holders.reduce((a,h)=>a+Number(h[1]||0),0);
 if(total!==100){let pub=c.holders.find(h=>h[0]==="Public Investors");if(!pub){pub=["Public Investors",0];c.holders.push(pub)}pub[1]+=100-total}
 c.owned=p;c.controlled=p>=51;
}
function playerShares(c){let h=c.holders.find(x=>x[0]==="NEXORA");return h?Number(h[1]):0}
function save(show=false){localStorage.setItem(KEY,JSON.stringify(S));if(show)toast("💾 Gra zapisana");}
setInterval(()=>save(),5000);

function money(n){return "$"+Math.round(n).toLocaleString("en-US")}
function num(n){return Math.round(n).toLocaleString("pl-PL")}
function pct(n){return Math.round(n)+"%"}
function spend(v){if(S.cash<v){toast("Brakuje "+money(v-S.cash));return false}S.cash-=v;return true}
function earn(v){S.cash+=v}
function toast(t){let x=document.createElement("div");x.textContent=t;document.getElementById("toast").appendChild(x);setTimeout(()=>x.remove(),2800)}
function valuation(){
 let p=S.products.reduce((a,x)=>a+x.value,0), subs=S.subsidiaries.reduce((a,x)=>a+x.value,0), stocks=S.companies.reduce((a,c)=>a+playerShares(c)*c.price,0);
 return Math.max(2500000,S.cash*2+p*3+subs+stocks+S.users*1.7+S.reputation*10000)
}
function officeCapacity(){return 5+(S.office.level-1)*5}
function officeCost(){return Math.round(75000*Math.pow(S.office.level,1.28))}
function techBonus(){return S.technologies.reduce((a,id)=>{let t=techs.find(x=>x[0]===id);return a+(t?t[3]:0)},0)}
function dailyCalc(){
 let income=0,expense=0;
 let prodBonus=1+techBonus()/2;
 S.products.forEach(p=>{let growth=Math.max(1,Math.round(p.users*(.012+(p.rating-60)/5000)));p.users+=growth;p.value=Math.max(p.value,p.users*p.rating*4);let r=Math.round(p.users*(0.12+p.rating/700)*prodBonus);if(p.type==="AI")r=Math.round(r*1.35);income+=r;p.revenueDay=r});
 S.subsidiaries.forEach(c=>{let r=Math.round(c.revenueDay*(c.strategy==="Zysk"?1.15:1.05));c.revenueDay=r;income+=r});
 let adIncome=Math.round(S.users*(0.025+S.reputation/10000)*(S.products.length?1:.35)); income+=adIncome;
 S.employees.forEach(e=>expense+=e.salary);
 S.servers.forEach(s=>expense+=2500+s.level*900);
 expense+=Math.round(S.gpu*35);
 expense+=S.office.level*750;
 let profit=income-expense;S.cash+=profit;S.users=Math.round(S.users*(1.012+S.reputation/50000));
 S.products.forEach(p=>{if(p.type==="Social"||p.type==="Video")p.users=Math.round(p.users*1.006)});
 S.researchPoints+=10;
 S.incomeHistory.push(income);S.expenseHistory.push(expense);S.profitHistory.push(profit);S.userHistory.push(S.users);
 S.incomeHistory=S.incomeHistory.slice(-20);S.expenseHistory=S.expenseHistory.slice(-20);S.profitHistory=S.profitHistory.slice(-20);S.userHistory=S.userHistory.slice(-20);
 S.companies.forEach(c=>{c.prev=c.price;let performance=(Math.random()-.45)*.08+(c.controlled?.012:0);c.price=Math.max(1,Math.round(c.price*(1+performance)*100)/100);c.history.push(c.price);c.history=c.history.slice(-20);normalize(c)});
 return {income,expense,profit}
}
function nextDay(){
 let r=dailyCalc();S.day++;
 if(S.day>30){S.day=1;S.month++;if(S.month>12){S.month=1;S.year++}}
 if(Math.random()<.18)randomEvent();
 save();render();toast(`Dzień ${S.day}: ${r.profit>=0?"zysk ":"strata "}${money(Math.abs(r.profit))}`);
}
function randomEvent(){
 let ev=[
  ["🚀 Viral produktu","Jeden z produktów stał się viralem. Reputacja +3.",()=>S.reputation=Math.min(100,S.reputation+3)],
  ["📉 Rynek zwalnia","Nastroje inwestorów pogorszyły się. Reputacja -2.",()=>S.reputation=Math.max(0,S.reputation-2)],
  ["🧠 Talent","Rynek pracy odkrył NEXORA. Następny kandydat ma +20% produktywności.",()=>S.events.unshift("Talent czeka na rekrutację.")],
  ["☁️ Boom na cloud","Usługi chmurowe zyskują popularność.",()=>S.users=Math.round(S.users*1.015)],
  ["⚖️ Kontrola regulatora","Rosną wymagania regulacyjne. Koszty dnia rosną.",()=>S.cash-=Math.min(S.cash,25000)]
 ][Math.floor(Math.random()*5)];
 ev[2]();S.events.unshift(`${ev[0]} — ${ev[1]}`);S.events=S.events.slice(0,40)
}

function renderNav(){
 document.getElementById("nav").innerHTML=NAV.map(n=>`<button class="${page===n[0]?"active":""}" onclick="go('${n[0]}')">${n[1]} &nbsp; ${n[2]}</button>`).join("");
}
function go(p){page=p;render()}
function render(){
 renderNav();
 let meta={
 dashboard:["Dashboard","Centrum dowodzenia NEXORA."],products:["Produkty","Buduj ekosystem usług i urządzeń."],ai:["AI Lab","Trenuj modele i rozwijaj własną sztuczną inteligencję."],
 employees:["Pracownicy","Twój zespół — bez automatycznego generowania pracowników."],servers:["Data Center","GPU, serwery i infrastruktura."],companies:["Firmy","Spółki zależne, przejęcia i zarządzanie."],
 stocks:["Giełda","100 udziałów każdej spółki. Własność zmienia się tylko przy transakcjach."],world:["Ekspansja","Otwieraj kolejne rynki."],
 rnd:["R&D","Technologie zwiększające przewagę NEXORA."],finance:["Finanse","Przychody, koszty i wynik."],events:["Wydarzenia","Historia zdarzeń w imperium."],settings:["Ustawienia","Zapis i zarządzanie rozgrywką."]
 }[page]||[];
 document.getElementById("pageTitle").textContent=meta[0];document.getElementById("pageSub").textContent=meta[1];
 document.getElementById("content").innerHTML=pages[page]?pages[page]():pages.dashboard();
}
const pages={
 dashboard(){
  let last=S.profitHistory.at(-1)||0;
  return `<div class="hero"><h2>${S.companyName} — dzień ${S.day}, ${S.month}/${S.year}</h2><p>Od małego startupu do globalnego imperium. Rozwijaj produkty, buduj AI, przejmuj firmy i kontroluj rynki.</p></div>
  <div class="grid section">
   ${stat("Gotówka",money(S.cash),last>=0?"+ "+money(last)+" / dzień":"− "+money(-last),last>=0)}
   ${stat("Wycena",money(valuation()),"Reputacja "+S.reputation+"/100",true)}
   ${stat("Użytkownicy",num(S.users),"wzrost organiczny",true)}
   ${stat("Pracownicy",S.employees.length+" / "+officeCapacity(),"HQ lvl "+S.office.level,true)}
  </div>
  <div class="two section">
   <div class="card"><div class="sectionTitle"><h2>📈 Ostatnie wyniki</h2><button class="small secondary" onclick="go('finance')">Finanse</button></div>${chart(S.profitHistory)}</div>
   <div class="card"><div class="sectionTitle"><h2>🎯 Cele</h2></div>${goal("100 tys. użytkowników",S.users,100000)}${goal("10 produktów",S.products.length,10)}${goal("51% jednej spółki",Math.max(0,...S.companies.map(playerShares)),51)}${goal("10 poziom HQ",S.office.level,10)}</div>
  </div>
  <div class="three section">
   <div class="card"><h2>🏢 HQ</h2><p class="muted">Poziom ${S.office.level}/100 · pojemność ${officeCapacity()} osób</p><button onclick="upgradeOffice()">Ulepsz za ${money(officeCost())}</button></div>
   <div class="card"><h2>🧠 AI</h2><p class="muted">${S.gpu-S.gpuUsed} wolnych / ${S.gpu} GPU</p><button onclick="go('ai')">Otwórz AI Lab</button></div>
   <div class="card"><h2>🌍 Świat</h2><p class="muted">${Object.values(S.regions).filter(Boolean).length}/${Object.keys(S.regions).length} rynków aktywnych</p><button onclick="go('world')">Ekspansja</button></div>
  </div>`
 },
 products(){
  return `<div class="sectionTitle"><h2>Ekosystem produktów</h2><button onclick="createProduct()">＋ Nowy produkt</button></div>
  ${S.products.length?`<div class="productGrid">${S.products.map((p,i)=>productCard(p,i)).join("")}</div>`:`<div class="empty">Nie masz jeszcze produktów. Stwórz pierwszy produkt i zacznij generować przychód.</div>`}`
 },
 ai(){
  return `<div class="two"><div class="card"><div class="sectionTitle"><h2>🧠 Modele AI</h2><button onclick="trainAI()">Trenuj model</button></div>
  <p class="muted">GPU pozostają sprzętem. Trening wykorzystuje je czasowo, ale ich liczba nigdy nie maleje.</p>
  ${S.models.length?`<div class="list">${S.models.map(m=>`<div class="row"><div><strong>${m.name}</strong><small>${m.params}B parametrów · jakość ${m.quality}/100</small></div><span class="pill">${m.status}</span></div>`).join("")}</div>`:`<div class="empty">Brak modeli.</div>`}</div>
  <div class="card"><h2>GPU</h2><div class="metric">${S.gpu}</div><p class="muted">${S.gpuUsed} używanych · ${S.gpu-S.gpuUsed} wolnych</p><div class="progress"><i style="width:${Math.min(100,S.gpuUsed/S.gpu*100)}%"></i></div><div class="actions"><button onclick="buyGPU()">Kup GPU — $35k</button></div><div class="miniGrid"><div class="mini"><span>Koszt dzienny</span><b>${money(S.gpu*35)}</b></div><div class="mini"><span>Modele</span><b>${S.models.length}</b></div></div></div></div>`
 },
 employees(){
  let filled=S.employees.length/officeCapacity()*100;
  return `<div class="two"><div class="card"><div class="sectionTitle"><h2>👨‍💻 Zespół</h2><button onclick="generateCandidate()">Wygeneruj kandydata</button></div><p class="muted">Kandydaci pojawiają się wyłącznie po kliknięciu — nigdy automatycznie.</p>${S.employees.length?`<div class="list">${S.employees.map((e,i)=>`<div class="row"><div><strong>${e.name} <span class="pill">${e.role}</span></strong><small>${e.department} · lvl ${e.level} · produktywność ${e.productivity}%</small></div><div><b>${money(e.salary)}/d</b><button class="small danger" onclick="fire(${i})">Zwolnij</button></div></div>`).join("")}</div>`:`<div class="empty">Brak pracowników.</div>`}</div>
  <div class="card"><h2>🏢 Pojemność biura</h2><div class="metric">${S.employees.length}/${officeCapacity()}</div><div class="progress"><i style="width:${Math.min(100,filled)}%"></i></div>${candidateHTML()}</div></div>`
 },
 servers(){
  return `<div class="two"><div class="card"><div class="sectionTitle"><h2>☁️ Data Center</h2><button onclick="buyServer()">＋ Serwer</button></div><div class="list">${S.servers.map((s,i)=>`<div class="row"><div><strong>${s.name}</strong><small>Poziom ${s.level} · obciążenie ${s.load}%</small></div><div class="actions"><button class="small" onclick="upgradeServer(${i})">Ulepsz</button><button class="small danger" onclick="removeServer(${i})">Usuń</button></div></div>`).join("")}</div></div>
  <div class="card"><h2>Infrastruktura</h2>${mini("Serwery",S.servers.length)}${mini("GPU",S.gpu)}${mini("GPU zajęte",S.gpuUsed)}${mini("Dzienne koszty",money(S.servers.reduce((a,s)=>a+2500+s.level*900,0)+S.gpu*35))}</div></div>`
 },
 companies(){
  return `<div class="sectionTitle"><h2>Struktura korporacyjna</h2><button onclick="createSubsidiary()">＋ Spółka córka</button></div>
  <div class="three section">${S.subsidiaries.map((c,i)=>`<div class="card"><h2>${c.name}</h2><p class="muted">${c.strategy} · wartość ${money(c.value)}</p><div class="miniGrid"><div class="mini"><span>Przychód/d</span><b>${money(c.revenueDay)}</b></div><div class="mini"><span>Kapitał</span><b>${money(c.capital)}</b></div></div><div class="actions"><button class="small" onclick="manageSub(${i})">Zarządzaj</button><button class="small danger" onclick="closeSub(${i})">Zamknij</button></div></div>`).join("")||`<div class="empty">Nie posiadasz spółek zależnych.</div>`}</div>
  <div class="card section"><h2>Firmy z portfela</h2><table class="table"><tr><th>Firma</th><th>Branża</th><th>Akcje</th><th>Kontrola</th><th></th></tr>${S.companies.map((c,i)=>`<tr><td><b>${c.name}</b><br><small class="muted">${c.ticker}</small></td><td>${c.type}</td><td>${playerShares(c)}/100</td><td>${c.controlled?"<span class='goodtxt'>51%+ KONTROLA</span>":"Brak"}</td><td><button class="small" onclick="openCompany(${i})">Otwórz</button></td></tr>`).join("")}</table></div>`
 },
 stocks(){
  return `<div class="card"><h2>📈 Giełda NEXORA</h2><p class="muted">Każda spółka ma dokładnie 100 udziałów. Udziałowcy nie zmieniają się samoczynnie — tylko transakcje przenoszą udziały.</p><table class="table"><tr><th>Firma</th><th>Cena</th><th>Zmiana</th><th>NEXORA</th><th>Status</th><th></th></tr>${S.companies.map((c,i)=>`<tr><td><b>${c.name}</b><br><small>${c.ticker} · ${c.type}</small></td><td>${money(c.price)}</td><td class="${c.price>=c.prev?'goodtxt':'badtxt'}">${c.price>=c.prev?"▲":"▼"} ${Math.abs(c.price/c.prev*100-100).toFixed(2)}%</td><td>${playerShares(c)}%</td><td>${c.controlled?"<span class='goodtxt'>KONTROLA</span>":"Mniejszość"}</td><td><button class="small" onclick="openCompany(${i})">Udziałowcy</button></td></tr>`).join("")}</table></div>`
 },
 world(){
  const costs={USA:800000,Polska:0,Niemcy:350000,UK:450000,Japonia:700000,Indie:300000,Kanada:250000,Australia:400000,Brazylia:280000};
  return `<div class="two"><div class="card"><h2>🌍 Globalna mapa</h2><div class="map">${Object.keys(S.regions).map((r,i)=>`<div class="city" style="left:${10+(i*17)%80}%;top:${18+(i*31)%65}%">${S.regions[r]?"●":"○"} <b>${r}</b></div>`).join("")}</div></div>
  <div class="card"><h2>Rynki</h2><div class="list">${Object.keys(S.regions).map(r=>`<div class="row"><div><strong>${r}</strong><small>${S.regions[r]?"Rynek aktywny":"Rynek zamknięty"}</small></div>${S.regions[r]?`<span class="pill goodtxt">AKTYWNY</span>`:`<button class="small" onclick="expand('${r}',${costs[r]})">Otwórz ${money(costs[r])}</button>`}</div>`).join("")}</div></div></div>`
 },
 rnd(){
  return `<div class="two"><div class="card"><div class="sectionTitle"><h2>🔬 Technologie</h2><span class="pill">${S.researchPoints} RP</span></div><div class="list">${techs.map(t=>`<div class="row"><div><strong>${t[0]}</strong><small>${t[2]}</small></div><button class="small ${S.technologies.includes(t[0])?"secondary":""}" ${S.technologies.includes(t[0])?"disabled":""} onclick="research('${t[0]}',${t[1]})">${S.technologies.includes(t[0])?"ODBLOCKOWANA":t[1]+" RP"}</button></div>`).join("")}</div></div><div class="card"><h2>Postęp technologiczny</h2><div class="metric">${S.technologies.length}/${techs.length}</div><p class="muted">Bonus łączny: +${Math.round(techBonus()*100)}%</p><div class="progress"><i style="width:${S.technologies.length/techs.length*100}%"></i></div></div></div>`
 },
 finance(){
  let inc=S.incomeHistory.at(-1)||0,exp=S.expenseHistory.at(-1)||0,profit=S.profitHistory.at(-1)||0;
  return `<div class="grid">${stat("Przychód/d",money(inc),"ostatni dzień",true)}${stat("Wydatki/d",money(exp),"ostatni dzień",false)}${stat("Zysk/d",money(profit),profit>=0?"dodatni":"ujemny",profit>=0)}${stat("Wycena",money(valuation()),"szacunkowa",true)}</div><div class="two section"><div class="card"><h2>Wynik dzienny</h2>${chart(S.profitHistory)}</div><div class="card"><h2>Struktura kosztów</h2>${costBars()}</div></div>`
 },
 events(){
  return `<div class="card"><h2>📰 Historia imperium</h2><div class="timeline">${S.events.map(e=>`<div class="event"><strong>${e}</strong><div class="muted">Dzień ${S.day}</div></div>`).join("")}</div></div>`
 },
 settings(){
  return `<div class="three"><div class="card"><h2>💾 Zapis</h2><p class="muted">Stan gry jest zapisywany lokalnie co 5 sekund.</p><button onclick="save(true)">Zapisz teraz</button></div><div class="card"><h2>🔄 Nowa gra</h2><p class="muted">Usuwa obecny zapis i zaczyna od zera.</p><button class="danger" onclick="resetGame()">Reset gry</button></div><div class="card"><h2>⌨️ Skróty</h2><p class="muted">F2 — konsola cheatów<br>Enter — wykonaj komendę<br>Esc — zamknij okno</p></div></div>`
 }
};
function stat(a,b,c,g){return `<div class="card stat"><div class="label">${a}</div><div class="value">${b}</div><div class="delta ${g?"goodtxt":"muted"}">${c}</div></div>`}
function goal(label,val,max){let p=Math.min(100,val/max*100);return `<div style="margin:13px 0"><div style="display:flex;justify-content:space-between;font-size:12px"><span>${label}</span><span class="muted">${num(val)}/${num(max)}</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}
function chart(arr){if(!arr.length)return `<div class="empty">Zagraj kilka dni, aby zobaczyć wykres.</div>`;let mx=Math.max(...arr.map(x=>Math.abs(x)),1);return `<div class="chart">${arr.slice(-14).map((v,i)=>`<div class="col"><i style="height:${Math.max(4,Math.abs(v)/mx*125)}px"></i><span>${v>=0?"+":"−"}</span></div>`).join("")}</div>`}
function mini(a,b){return `<div class="row"><span>${a}</span><b>${b}</b></div>`}
function productCard(p,i){return `<div class="card product"><div class="productTop"><h3>${p.name}</h3><span class="pill">${p.type}</span></div><div class="metric">${num(p.users)}</div><small class="muted">użytkowników</small><div class="miniGrid"><div class="mini"><span>Ocena</span><b>${p.rating}/100</b></div><div class="mini"><span>Przychód/d</span><b>${money(p.revenueDay||0)}</b></div></div><div class="actions"><button class="small" onclick="updateProduct(${i})">Aktualizuj</button><button class="small danger" onclick="removeProduct(${i})">Wycofaj</button></div></div>`}
function candidateHTML(){if(!S.candidate)return `<div class="empty" style="margin-top:14px">Kliknij „Wygeneruj kandydata”, aby znaleźć pracownika.</div>`;let c=S.candidate;return `<div class="card successBox" style="margin-top:14px"><strong>${c.name}</strong><p class="muted">${c.role} · ${c.department}<br>Poziom ${c.level} · produktywność ${c.productivity}% · ${money(c.salary)}/dzień</p><div class="actions"><button onclick="hireCandidate()">Zatrudnij</button><button class="secondary" onclick="S.candidate=null;save();render()">Odrzuć</button></div></div>`}
function costBars(){let sal=S.employees.reduce((a,e)=>a+e.salary,0),srv=S.servers.reduce((a,s)=>a+2500+s.level*900,0),gpu=S.gpu*35,office=S.office.level*750;return `${goal("Pensje",sal,Math.max(1,(S.expenseHistory.at(-1)||1)))}${goal("Serwery",srv,Math.max(1,(S.expenseHistory.at(-1)||1)))}${goal("GPU",gpu,Math.max(1,(S.expenseHistory.at(-1)||1)))}${goal("HQ",office,Math.max(1,(S.expenseHistory.at(-1)||1)))}`}

function upgradeOffice(){if(S.office.level>=100)return toast("HQ ma maksymalny poziom");if(spend(officeCost())){S.office.level++;save();render();toast("🏢 HQ ulepszone do poziomu "+S.office.level)}}
function generateCandidate(){if(S.employees.length>=officeCapacity())return toast("Brak miejsca w biurze");let r=roles[Math.floor(Math.random()*roles.length)];S.candidate={name:["Adam","Maja","Oskar","Julia","Kacper","Zofia","Leon","Lena","Maks","Nina"][Math.floor(Math.random()*10)]+" "+["Kowalski","Nowak","Wójcik","Mazur","Lis","Kaczmarek"][Math.floor(Math.random()*6)],role:r[0],salary:r[1]+Math.floor(Math.random()*600-300),department:r[2],level:1+Math.floor(Math.random()*8),productivity:70+Math.floor(Math.random()*31)};save();render()}
function hireCandidate(){if(!S.candidate)return;if(S.employees.length>=officeCapacity())return toast("Brak miejsca");S.employees.push({...S.candidate,id:uid()});S.candidate=null;save();render();toast("👨‍💻 Pracownik zatrudniony")}
function fire(i){if(confirm("Zwolnić tego pracownika?")){S.employees.splice(i,1);save();render()}}
function createProduct(){if(!S.employees.length)return toast("Najpierw zatrudnij przynajmniej jednego pracownika");let name=prompt("Nazwa produktu:");if(!name)return;let type=prompt("Typ: "+productTypes.join(", "), "AI");if(!productTypes.includes(type))type="AI";let cost=25000+S.employees.length*2500;if(!spend(cost))return;let p={id:uid(),name,type,rating:60+Math.floor(Math.random()*40),users:300+Math.floor(Math.random()*3000),value:100000,revenueDay:0,version:"v1.0"};S.products.push(p);save();render();toast("🚀 Produkt "+name+" uruchomiony")}
function updateProduct(i){let p=S.products[i],cost=25000+p.rating*400;if(!spend(cost))return;p.rating=Math.min(100,p.rating+1+Math.floor(Math.random()*4));p.version="v"+(Number(p.version.slice(1))+1)+".0";p.value+=cost*8;save();render();toast("🔄 "+p.name+" otrzymał aktualizację")}
function removeProduct(i){if(confirm("Wycofać produkt z rynku?")){S.products.splice(i,1);save();render();toast("Produkt wycofany")}}
function buyGPU(){if(spend(35000)){S.gpu++;save();render();toast("🧩 Kupiono GPU")}}
function trainAI(){if(S.gpu-S.gpuUsed<5)return toast("Potrzebujesz 5 wolnych GPU");if(!spend(25000))return;S.gpuUsed+=5;let m={id:uid(),name:"NEXORA Neural "+(S.models.length+1),params:4+Math.floor(Math.random()*22),quality:70+Math.floor(Math.random()*30),status:"TRENING"};S.models.push(m);save();render();setTimeout(()=>{S.gpuUsed=Math.max(0,S.gpuUsed-5);m.status="GOTOWY";m.quality=Math.min(100,m.quality+2);save();render();toast("🧠 Model zakończył trening")},3500)}
function buyServer(){let cost=150000+S.servers.length*50000;if(spend(cost)){S.servers.push({id:uid(),name:"NEXORA Core-"+String(S.servers.length+1).padStart(2,"0"),level:1,load:10+Math.floor(Math.random()*25)});save();render()}}
function upgradeServer(i){let s=S.servers[i],cost=80000*s.level;if(spend(cost)){s.level++;s.load=Math.max(5,s.load-4);save();render();toast("☁️ Serwer ulepszony")}}
function removeServer(i){if(S.servers.length<=1)return toast("Musisz mieć minimum 1 serwer");if(confirm("Usunąć serwer?")){S.servers.splice(i,1);save();render()}}
function createSubsidiary(){let name=prompt("Nazwa spółki córki:");if(!name)return;let cost=150000;if(!spend(cost))return;S.subsidiaries.push({id:uid(),name,value:500000,revenueDay:5000,capital:0,strategy:"Wzrost",products:[]});save();render();toast("◆ Utworzono "+name)}
function manageSub(i){let c=S.subsidiaries[i];openModal(`<div class="modalHead"><h2>${c.name}</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Spółka generuje przychód niezależnie od NEXORA.</p><div class="actions"><button onclick="subInvest(${i})">Zainwestuj $100k</button><button onclick="subStrategy(${i})">Zmień strategię</button></div>`)}
function subInvest(i){if(spend(100000)){S.subsidiaries[i].capital+=100000;S.subsidiaries[i].value+=150000;S.subsidiaries[i].revenueDay+=1500;closeModal();save();render()}}
function subStrategy(i){let c=S.subsidiaries[i];c.strategy=c.strategy==="Wzrost"?"Zysk":"Wzrost";closeModal();save();render()}
function closeSub(i){if(confirm("Zamknąć spółkę?")){S.subsidiaries.splice(i,1);save();render()}}
function openCompany(i){selectedCompany=i;let c=S.companies[i];normalize(c);openModal(`<div class="modalHead"><h2>${c.name} <span class="pill">${c.ticker}</span></h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">${c.type} · cena ${money(c.price)} · dokładnie 100 udziałów</p><div class="bar"><i style="width:${playerShares(c)}%"></i></div><p><b>NEXORA: ${playerShares(c)}%</b> · ${c.controlled?"<span class='goodtxt'>KONTROLA ODBLOKOWANA</span>":"Potrzebujesz 51% do kontroli"}</p><table class="table"><tr><th>Udziałowiec</th><th>Udziały</th><th></th></tr>${c.holders.map((h,j)=>`<tr><td>${h[0]}</td><td>${h[1]}</td><td>${h[0]!=="NEXORA"&&h[1]>0?`<button class="small" onclick="buyFrom(${i},${j},1)">Kup 1</button> <button class="small" onclick="buyFrom(${i},${j},5)">Kup 5</button> <button class="small" onclick="buyFrom(${i},${j},${h[1]})">Kup wszystkie</button>`:""}</td></tr>`).join("")}</table><div class="actions">${playerShares(c)>0?`<input id="sellQty" type="number" min="1" max="${playerShares(c)}" value="1" style="width:110px"><button class="secondary" onclick="sellShares(${i})">Sprzedaj na rynek</button>`:""}${c.controlled?`<button class="good" onclick="manageControlled(${i})">⚙ Zarządzaj firmą</button>`:""}${playerShares(c)<100?`<button class="danger" onclick="buyout(${i})">Wykup pozostałe ${100-playerShares(c)} udziałów</button>`:""}</div>`)}
function buyFrom(ci,hi,qty){let c=S.companies[ci],h=c.holders[hi],q=Math.min(Number(qty),h[1]);if(q<=0)return;let cost=q*c.price;if(!spend(cost))return;let ph=c.holders.find(x=>x[0]==="NEXORA");if(!ph){ph=["NEXORA",0];c.holders.push(ph)}h[1]-=q;ph[1]+=q;normalize(c);save();render();openCompany(ci);toast(`Kupiono ${q} udziałów ${c.ticker}`)}
function sellShares(i){let c=S.companies[i],q=Math.min(Number(document.getElementById("sellQty").value||0),playerShares(c));if(q<=0)return;earn(q*c.price);let ph=c.holders.find(x=>x[0]==="NEXORA");ph[1]-=q;let pub=c.holders.find(x=>x[0]==="Public Investors");pub[1]+=q;normalize(c);save();render();openCompany(i);toast(`Sprzedano ${q} udziałów`)}
function buyout(i){let c=S.companies[i],q=100-playerShares(c);if(q<=0)return;let cost=q*c.price;if(!spend(cost))return;c.holders.forEach(h=>{if(h[0]!=="NEXORA")h[1]=0});let ph=c.holders.find(x=>x[0]==="NEXORA");ph[1]=100;normalize(c);save();render();openCompany(i);toast("🏆 Firma przejęta w 100%")}
function manageControlled(i){let c=S.companies[i];openModal(`<div class="modalHead"><h2>⚙ Zarządzanie: ${c.name}</h2><button class="close" onclick="closeModal()">×</button></div><div class="card"><h3>Strategia</h3><p class="muted">Aktualnie: ${c.strategy}</p><button onclick="changeCompanyStrategy(${i})">Zmień strategię</button></div><div class="actions"><button onclick="injectCapital(${i})">Zainwestuj $100k</button><button class="danger" onclick="mergeCompany(${i})">Połącz z NEXORA</button></div>`)}
function changeCompanyStrategy(i){S.companies[i].strategy=S.companies[i].strategy==="Wzrost"?"Zysk":"Wzrost";closeModal();save();render();toast("Strategia zmieniona")}
function injectCapital(i){if(spend(100000)){S.companies[i].capital+=100000;S.companies[i].price*=1.04;closeModal();save();render();toast("Kapitał przekazany")}
}
function mergeCompany(i){let c=S.companies[i];if(!c.controlled)return;S.cash+=Math.round(c.price*100*1.05);S.companies.splice(i,1);closeModal();save();render();toast("🔗 Firma połączona z NEXORA")}
function expand(region,cost){if(!spend(cost))return;S.regions[region]=true;S.users=Math.round(S.users*(region==="USA"?1.18:1.06));S.reputation=Math.min(100,S.reputation+2);S.events.unshift(`🌍 Otwarto rynek: ${region}`);save();render();toast("Nowy rynek: "+region)}
function research(name,cost){if(S.technologies.includes(name))return;if(S.researchPoints<cost)return toast("Brakuje RP");S.researchPoints-=cost;S.technologies.push(name);save();render();toast("✦ Odblokowano "+name)}
function openModal(html){document.getElementById("modalBox").innerHTML=html;document.getElementById("modal").classList.add("open")}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});

function toggleCheats(){let c=document.getElementById("cheat");c.classList.toggle("open");if(c.classList.contains("open"))setTimeout(()=>document.getElementById("cheatInput").focus(),50)}
function runCheat(cmd){document.getElementById("cheatInput").value=cmd;executeCheat()}
function executeCheat(){let x=document.getElementById("cheatInput").value.trim().split(/\s+/),cmd=x[0]?.toLowerCase(),v=Number(x[1]);let msg="Nieznana komenda";if(cmd==="money"){S.cash+=v;msg="Dodano "+money(v)}else if(cmd==="users"){S.users+=v;msg="Dodano "+num(v)+" użytkowników"}else if(cmd==="gpu"){S.gpu+=v;msg="Dodano "+v+" GPU"}else if(cmd==="employees"){for(let i=0;i<v;i++){let r=roles[i%roles.length];S.employees.push({id:uid(),name:"Cheat Employee "+(S.employees.length+1),role:r[0],salary:1,department:r[2],level:10,productivity:100})}msg="Dodano "+v+" pracowników"}else if(cmd==="rp"){S.researchPoints+=v;msg="Dodano "+v+" RP"}else if(cmd==="day"){S.day=Math.max(1,Math.floor(v)||1);msg="Dzień ustawiony"}else if(cmd==="office"){S.office.level=Math.max(1,Math.min(100,Math.floor(v)||1));msg="HQ ustawione na poziom "+S.office.level}else if(cmd==="rich"){S.cash+=100000000;S.users+=10000000;S.gpu+=500;msg="Tryb RICH"}else if(cmd==="unlockall"){S.technologies=techs.map(t=>t[0]);S.regions=Object.fromEntries(Object.keys(S.regions).map(k=>[k,true]));S.reputation=100;S.office.level=100;msg="Odblokowano wszystko"}document.getElementById("consoleLog").textContent="> "+(document.getElementById("cheatInput").value)+"\n"+msg;save();render();toast(msg)}
document.getElementById("cheatInput").addEventListener("keydown",e=>{if(e.key==="Enter")executeCheat();if(e.key==="Escape")toggleCheats()});
document.addEventListener("keydown",e=>{if(e.key==="F2"){e.preventDefault();toggleCheats()}if(e.key==="Escape"){closeModal();document.getElementById("cheat").classList.remove("open")}});

function resetGame(){if(confirm("Na pewno rozpocząć nową grę?")){S=defaultState();save();render();toast("Nowa gra rozpoczęta")}}
render();
</script>
</body>
</html>
