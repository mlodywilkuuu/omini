<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Ropucha Empire</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#101510;
  color:white;
}

button,select,input{font:inherit}

#map{
  position:absolute;
  inset:0;
  z-index:1;
}

/* ================= HUD ================= */

#hud{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:7px;
  z-index:1000;
  pointer-events:none;
}

.hudBox{
  min-width:105px;
  background:#111e;
  border:2px solid #333;
  border-radius:10px;
  padding:7px 13px;
  text-align:center;
  box-shadow:0 5px 15px #0005;
}

.hudBox small{
  display:block;
  color:#999;
  font-size:9px;
  text-transform:uppercase;
}

.hudBox strong{
  font-size:17px;
}

#money{color:#67e777}

/* ================= SIDEBAR ================= */

#sidebar{
  position:fixed;
  left:12px;
  top:80px;
  bottom:12px;
  width:330px;
  background:#111e;
  border:2px solid #333;
  border-radius:13px;
  z-index:1000;
  overflow-y:auto;
  padding:12px;
}

.title{
  font-size:19px;
  font-weight:900;
  color:#6de47b;
  margin-bottom:10px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-bottom:10px;
}

.tab{
  padding:8px;
  background:#292929;
  color:white;
  border:0;
  border-radius:6px;
  cursor:pointer;
}

.tab.active{
  background:#176d38;
}

.panel{display:none}
.panel.active{display:block}

.box{
  background:#252525;
  border-radius:9px;
  padding:10px;
  margin-bottom:8px;
}

.box h3{
  margin:0 0 8px;
  font-size:14px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
  color:#ccc;
  margin:5px 0;
}

.btn{
  width:100%;
  padding:9px;
  margin-top:5px;
  border:0;
  border-radius:6px;
  background:#176d38;
  color:white;
  cursor:pointer;
  font-weight:bold;
}

.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.btn.blue{background:#28619e}
.btn.orange{background:#a36122}
.btn.red{background:#913a3a}
.btn.gray{background:#555}

/* ================= COMPANIES ================= */

.company{
  background:#282828;
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
}

.companyName{
  font-weight:bold;
  margin-bottom:6px;
}

.shareBar{
  height:9px;
  background:#444;
  border-radius:5px;
  overflow:hidden;
  margin:7px 0;
}

.shareFill{
  height:100%;
  background:#61dc72;
}

.smallButtons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:4px;
}

.smallButtons button{
  border:0;
  padding:6px 3px;
  border-radius:5px;
  background:#345c3c;
  color:white;
  cursor:pointer;
  font-size:10px;
}

/* ================= MODAL ================= */

#modalBackground{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:5000;
  align-items:center;
  justify-content:center;
}

#modal{
  width:min(650px,90vw);
  max-height:85vh;
  overflow-y:auto;
  background:#181818;
  border:2px solid #444;
  border-radius:14px;
  padding:18px;
}

#modal h2{margin-top:0}

.close{
  float:right;
  border:0;
  background:#8b3434;
  color:white;
  padding:7px 11px;
  border-radius:6px;
  cursor:pointer;
}

/* ================= MONEY FX ================= */

.moneyFx{
  position:fixed;
  left:50%;
  top:72px;
  z-index:8000;
  font-size:25px;
  font-weight:900;
  pointer-events:none;
  animation:cash 1.4s forwards;
}

.plus{color:#6cff7a}
.minus{color:#ff6262}

@keyframes cash{
  0%{opacity:0;transform:translate(-50%,20px)}
  20%{opacity:1;transform:translate(-50%,0) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-50px)}
}

/* ================= NOTES ================= */

#notes{
  position:fixed;
  right:15px;
  bottom:15px;
  width:300px;
  z-index:7000;
}

.note{
  background:#111f;
  border-left:5px solid #68df77;
  border-radius:6px;
  padding:10px;
  margin-top:6px;
  font-size:12px;
}

/* ================= MAP BUILD ================= */

#buildInfo{
  display:none;
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:#111e;
  border:2px solid #555;
  border-radius:9px;
  padding:10px 20px;
  z-index:1500;
}

/* ================= MARKERS ================= */

.mapMarker{
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  border:3px solid white;
  box-shadow:0 3px 10px #0008;
}

.storeMarker{background:#176d38}
.centerMarker{background:#315e9d}
.factoryMarker{background:#9a5d27}
.hqMarker{background:#702d91}

/* ================= R&D ================= */

.progress{
  height:9px;
  background:#444;
  border-radius:5px;
  overflow:hidden;
  margin:6px 0;
}

.progressFill{
  height:100%;
  background:#5ddd72;
}

/* MOBILE */

@media(max-width:800px){
  #sidebar{
    width:290px;
  }

  .hudBox:nth-child(n+4){
    display:none;
  }
}
</style>
</head>

<body>

<div id="map"></div>

<div id="hud">
  <div class="hudBox">
    <small>Kapitał</small>
    <strong id="money">0 zł</strong>
  </div>

  <div class="hudBox">
    <small>Sklepy</small>
    <strong id="storeHUD">0</strong>
  </div>

  <div class="hudBox">
    <small>Centra</small>
    <strong id="centerHUD">0</strong>
  </div>

  <div class="hudBox">
    <small>Kierowcy</small>
    <strong id="driverHUD">0</strong>
  </div>

  <div class="hudBox">
    <small>Ciężarówki</small>
    <strong id="truckHUD">0</strong>
  </div>

  <div class="hudBox">
    <small>Dzień</small>
    <strong id="dayHUD">1</strong>
  </div>
</div>

<div id="sidebar">

  <div class="title">🐸 ROPUCHA GROUP</div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('network',this)">🏪 Sieć</button>
    <button class="tab" onclick="showTab('office',this)">🏢 Centrala</button>
    <button class="tab" onclick="showTab('companies',this)">📈 Firmy</button>
    <button class="tab" onclick="showTab('logistics',this)">🚛 Logistyka</button>
    <button class="tab" onclick="showTab('rnd',this)">🧪 R&D</button>
    <button class="tab" onclick="showTab('finance',this)">💰 Finanse</button>
  </div>

  <div id="network" class="panel active"></div>
  <div id="office" class="panel"></div>
  <div id="companies" class="panel"></div>
  <div id="logistics" class="panel"></div>
  <div id="rnd" class="panel"></div>
  <div id="finance" class="panel"></div>

</div>

<div id="buildInfo">
  Kliknij miejsce na mapie • ESC — anuluj
</div>

<div id="notes"></div>

<div id="modalBackground">
  <div id="modal"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   STATE
========================================================= */

let money = 5000000;
let day = 1;

let buildMode = null;

let stores = [];
let centers = [];
let drivers = [];
let trucks = [];
let routes = [];

let nextStoreId = 1;
let nextCenterId = 1;
let nextDriverId = 1;
let nextTruckId = 1;
let nextRouteId = 1;

let totalDividends = 0;
let totalStoreIncome = 0;
let totalLogisticsCosts = 0;

const firstNames = [
  "Adam","Marek","Kamil","Julia","Ola",
  "Natalia","Karolina","Michał","Patryk","Bartek"
];

const lastNames = [
  "Nowak","Kowalski","Lis","Król",
  "Mazur","Wójcik","Zieliński","Kaczmarek"
];

/* =========================================================
   MAP
========================================================= */

const map = L.map("map",{
  zoomControl:true
}).setView([52.1,19.4],6);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom:19,
    attribution:"&copy; OpenStreetMap contributors"
  }
).addTo(map);

function icon(emoji,type){

  return L.divIcon({
    className:"",
    html:`<div class="mapMarker ${type}">${emoji}</div>`,
    iconSize:[34,34],
    iconAnchor:[17,17]
  });
}

const icons = {
  store:icon("🏪","storeMarker"),
  center:icon("📦","centerMarker"),
  factory:icon("🏭","factoryMarker"),
  hq:icon("🏢","hqMarker")
};

/* =========================================================
   HQ
========================================================= */

const hq = L.marker(
  [52.2297,21.0122],
  {icon:icons.hq}
)
.addTo(map)
.bindPopup(`
  <b>🐸 Centrala Ropucha Group</b><br>
  Warszawa<br>
  Zarząd • HR • Marketing • Prawo • R&D
`);

/* =========================================================
   COMPANIES
========================================================= */

const companies = [
  {
    id:"bulapol",
    name:"🥖 BułaPol",
    product:"Bułki",
    valuation:2400000,
    profit:22000,
    shares:0,
    production:120000,
    capacity:160000,
    controlled:false,
    acquired:false,
    lat:52.40,
    lng:16.92
  },

  {
    id:"hotbula",
    name:"🌭 HotBuła",
    product:"Bułki do hot-dogów",
    valuation:4800000,
    profit:38000,
    shares:0,
    production:85000,
    capacity:110000,
    controlled:false,
    acquired:false,
    lat:51.76,
    lng:19.46
  },

  {
    id:"pizzafoods",
    name:"🍕 PizzaMax Foods",
    product:"Pizza",
    valuation:8500000,
    profit:72000,
    shares:0,
    production:45000,
    capacity:65000,
    controlled:false,
    acquired:false,
    lat:50.06,
    lng:19.94
  },

  {
    id:"freshbox",
    name:"🥪 FreshBox",
    product:"Kanapki",
    valuation:6200000,
    profit:51000,
    shares:0,
    production:70000,
    capacity:95000,
    controlled:false,
    acquired:false,
    lat:51.11,
    lng:17.03
  },

  {
    id:"meatfood",
    name:"🌭 MięsPol",
    product:"Parówki",
    valuation:10500000,
    profit:88000,
    shares:0,
    production:100000,
    capacity:145000,
    controlled:false,
    acquired:false,
    lat:53.13,
    lng:23.16
  },

  {
    id:"coffee",
    name:"☕ CoffeeWorks",
    product:"Kawa",
    valuation:12800000,
    profit:105000,
    shares:0,
    production:60000,
    capacity:90000,
    controlled:false,
    acquired:false,
    lat:54.35,
    lng:18.65
  }
];

companies.forEach(company => {

  company.marker = L.marker(
    [company.lat,company.lng],
    {icon:icons.factory}
  ).addTo(map);

  updateCompanyPopup(company);
});

function updateCompanyPopup(company){

  company.marker.bindPopup(`
    <b>${company.name}</b><br>
    Produkt: ${company.product}<br>
    Twoje udziały: ${company.shares}%<br>
    Produkcja: ${number(company.production)} szt./dzień
  `);
}

/* =========================================================
   OFFICE
========================================================= */

const departments = {

  marketing:{
    name:"📢 Marketing",
    level:1,
    employees:[],
    salary:350
  },

  legal:{
    name:"⚖️ Prawo",
    level:1,
    employees:[],
    salary:450
  },

  hr:{
    name:"👥 HR",
    level:1,
    employees:[],
    salary:320
  },

  logistics:{
    name:"🚚 Logistyka",
    level:1,
    employees:[],
    salary:380
  },

  rnd:{
    name:"🧪 R&D",
    level:1,
    employees:[],
    salary:480
  }
};

const perks = [
  {name:"⭐ Utalentowany",bonus:.15},
  {name:"🧠 Ekspert",bonus:.25},
  {name:"⚡ Szybki",bonus:.12},
  {name:"🎯 Dokładny",bonus:.18},
  {name:"🤝 Lider",bonus:.20}
];

function hireOfficeEmployee(type){

  const department = departments[type];

  const cost = 2500;

  if(money < cost){
    notify("❌ Brakuje pieniędzy.");
    return;
  }

  changeMoney(-cost);

  const perk =
    perks[random(0,perks.length-1)];

  department.employees.push({

    name:randomName(),

    perk,

    salary:
      department.salary +
      random(0,120)

  });

  notify(
    "👔 Nowy pracownik: "+
    department.name
  );

  render();
}

function upgradeDepartment(type){

  const dep = departments[type];

  const cost =
    Math.floor(
      5000 *
      Math.pow(1.18,dep.level-1)
    );

  if(money < cost){
    notify("❌ Brakuje pieniędzy.");
    return;
  }

  changeMoney(-cost);

  dep.level++;

  render();
}

/* =========================================================
   STORES
========================================================= */

function startStoreBuild(){

  const price =
    120000 +
    stores.length*15000;

  if(money < price){
    notify("❌ Brakuje pieniędzy.");
    return;
  }

  buildMode = "store";

  document.getElementById("buildInfo").style.display="block";

  notify("🏪 Kliknij miejsce na mapie.");
}

function createStore(lat,lng){

  const price =
    120000 +
    stores.length*15000;

  if(money < price) return;

  changeMoney(-price);

  const store = {

    id:nextStoreId++,

    lat,
    lng,

    workers:random(3,5),

    stock:100,

    baseIncome:
      random(5000,9000),

    marker:null
  };

  store.marker =
    L.marker(
      [lat,lng],
      {icon:icons.store}
    ).addTo(map);

  stores.push(store);

  updateStorePopup(store);

  notify(
    "🏪 Otwarto sklep #"+
    store.id
  );

  render();
}

function updateStorePopup(store){

  store.marker.bindPopup(`
    <b>🐸 Ropucha #${store.id}</b><br>
    Pracownicy: ${store.workers}<br>
    Towar: ${Math.round(store.stock)}%<br>
    Przychód bazowy:
    ${moneyText(store.baseIncome)}/dzień
  `);
}

/* =========================================================
   LOGISTICS CENTERS
========================================================= */

function startCenterBuild(){

  const cost =
    750000 +
    centers.length*250000;

  if(money < cost){
    notify("❌ Brakuje pieniędzy.");
    return;
  }

  buildMode = "center";

  document.getElementById("buildInfo").style.display="block";

  notify("📦 Kliknij miejsce dla centrum.");
}

function createCenter(lat,lng){

  const cost =
    750000 +
    centers.length*250000;

  if(money < cost) return;

  changeMoney(-cost);

  const center = {

    id:nextCenterId++,

    lat,
    lng,

    level:1,

    capacity:25000,

    drivers:[],

    trucks:[],

    routes:[],

    marker:null
  };

  center.marker =
    L.marker(
      [lat,lng],
      {icon:icons.center}
    ).addTo(map);

  centers.push(center);

  updateCenterPopup(center);

  notify(
    "📦 Otwarto centrum logistyczne #"+
    center.id
  );

  render();
}

function updateCenterPopup(center){

  center.marker.bindPopup(`
    <b>📦 Centrum #${center.id}</b><br>
    Poziom: ${center.level}<br>
    Kierowcy: ${center.drivers.length}<br>
    Ciężarówki: ${center.trucks.length}<br>
    Trasy: ${center.routes.length}
  `);
}

/* =========================================================
   DRIVERS
========================================================= */

function hireDriver(){

  if(money < 4000){
    notify("❌ Brakuje pieniędzy.");
    return;
  }

  changeMoney(-4000);

  drivers.push({

    id:nextDriverId++,

    name:randomName(),

    salary:random(350,520),

    centerId:null,

    truckId:null,

    routeId:null

  });

  notify("👷 Zatrudniono kierowcę.");

  render();
}

function assignDriver(driverId,centerId){

  const driver =
    drivers.find(d=>d.id===driverId);

  const center =
    centers.find(c=>c.id===centerId);

  if(!driver || !center) return;

  centers.forEach(c=>{
    c.drivers =
      c.drivers.filter(
        id=>id!==driverId
      );
  });

  driver.centerId=centerId;

  if(!center.drivers.includes(driverId)){
    center.drivers.push(driverId);
  }

  updateCenterPopup(center);

  render();
}

/* =========================================================
   TRUCKS
========================================================= */

const truckTypes = [

  {
    id:"small",
    name:"🚚 Lekka ciężarówka",
    price:90000,
    capacity:1200
  },

  {
    id:"large",
    name:"🚛 Ciężarówka",
    price:190000,
    capacity:3500
  },

  {
    id:"cold",
    name:"❄️ Chłodnia",
    price:320000,
    capacity:2800
  }
];

function buyTruck(typeId,centerId){

  const type =
    truckTypes.find(t=>t.id===typeId);

  const center =
    centers.find(c=>c.id===centerId);

  if(!type || !center) return;

  if(money < type.price){
    notify("❌ Brakuje pieniędzy.");
    return;
  }

  changeMoney(-type.price);

  const truck = {

    id:nextTruckId++,

    typeId,

    centerId,

    driverId:null,

    routeId:null,

    condition:100

  };

  trucks.push(truck);

  center.trucks.push(truck.id);

  updateCenterPopup(center);

  notify(
    "🚛 Kupiono "+
    type.name
  );

  render();
}

/* =========================================================
   ROUTES
========================================================= */

function createAutomaticRoute(centerId){

  const center =
    centers.find(c=>c.id===centerId);

  if(!center) return;

  const driver =
    drivers.find(
      d=>
        d.centerId===centerId &&
        !d.routeId
    );

  const truck =
    trucks.find(
      t=>
        t.centerId===centerId &&
        !t.routeId
    );

  const store =
    stores.find(
      s=>
        !routes.some(
          r=>r.storeId===s.id
        )
    );

  if(!driver){
    notify("❌ Brak wolnego kierowcy.");
    return;
  }

  if(!truck){
    notify("❌ Brak wolnej ciężarówki.");
    return;
  }

  if(!store){
    notify("❌ Wszystkie sklepy mają trasę.");
    return;
  }

  const route = {

    id:nextRouteId++,

    centerId,

    driverId:driver.id,

    truckId:truck.id,

    storeId:store.id,

    line:null
  };

  driver.routeId=route.id;
  driver.truckId=truck.id;

  truck.routeId=route.id;
  truck.driverId=driver.id;

  center.routes.push(route.id);

  route.line =
    L.polyline(
      [
        [center.lat,center.lng],
        [store.lat,store.lng]
      ],
      {
        color:"#2673d9",
        weight:4,
        opacity:.7
      }
    ).addTo(map);

  routes.push(route);

  updateCenterPopup(center);

  notify(
    "🗺️ Trasa #"+
    route.id+
    " → sklep #"+
    store.id
  );

  render();
}

/* =========================================================
   COMPANY SHARES
========================================================= */

function sharePrice(company,percent){

  const base =
    company.valuation *
    (percent/100);

  const premium =
    1 +
    company.shares/100*.35;

  return Math.floor(
    base*premium
  );
}

function buyShares(id,percent){

  const company =
    companies.find(c=>c.id===id);

  if(!company) return;

  percent =
    Math.min(
      percent,
      100-company.shares
    );

  if(percent<=0) return;

  const cost =
    sharePrice(
      company,
      percent
    );

  if(money < cost){

    notify(
      "❌ Pakiet kosztuje "+
      moneyText(cost)
    );

    return;
  }

  changeMoney(-cost);

  company.shares += percent;

  if(
    company.shares>50 &&
    !company.controlled
  ){

    company.controlled=true;

    notify(
      "🏢 Zdobyto kontrolę nad "+
      company.name
    );
  }

  if(company.shares>=100){

    company.shares=100;
    company.acquired=true;

    notify(
      "👑 Przejęto 100% "+
      company.name
    );
  }

  updateCompanyPopup(company);

  render();
}

/* =========================================================
   TAKEOVER
========================================================= */

function takeoverCompany(id){

  const company =
    companies.find(c=>c.id===id);

  if(
    !company ||
    company.shares<=50 ||
    company.shares>=100
  ) return;

  const remaining =
    100-company.shares;

  const value =
    company.valuation*
    (remaining/100);

  const legalPower =
    departments.legal.level +
    departments.legal.employees.length*2;

  const discount =
    Math.min(
      legalPower*.002,
      .20
    );

  const premium =
    1.25-discount;

  const price =
    Math.floor(
      value*premium
    );

  if(money < price){

    notify(
      "❌ Przejęcie kosztuje "+
      moneyText(price)
    );

    return;
  }

  changeMoney(-price);

function upgradeFactory(id){

  const company =
    companies.find(c=>c.id===id);

  if(!company) return;

  const cost =
    Math.floor(
      company.valuation*.08
    );

  if(money < cost){
    notify("❌ Brakuje pieniędzy.");
    return;
  }

  changeMoney(-cost);

  company.capacity =
    Math.floor(
      company.capacity*1.15
    );

  company.production =
    Math.floor(
      company.production*1.12
    );

  company.profit =
    Math.floor(
      company.profit*1.08
    );

  company.valuation =
    Math.floor(
      company.valuation*1.06
    );

  notify(
    "🏭 Rozbudowano "+
    company.name
  );

  manageCompany(id);
  render();
}

const projects = [

    bonus:.08
  },

  {

    required:500,
    progress:0,
    state:"available",
    bonus:.20
  }
];

let activeResearch=null;
let researchIncomeBonus=0;

function startResearch(id){

  if(activeResearch){
    notify("❌ R&D pracuje już nad projektem.");
    return;
  }

  const project =
    projects.find(p=>p.id===id);

  if(
    !project ||
    project.state==="done"
  ) return;

  project.state="research";
  activeResearch=project.id;

  notify(
    "🧪 Rozpoczęto: "+
    project.name
  );

  render();
}

function processResearch(){

  if(!activeResearch) return;

  const project =
    projects.find(
      p=>p.id===activeResearch
    );

  if(!project) return;

  const department =
    departments.rnd;

  let points =
    5 +
    department.level*2;

  department.employees.forEach(
    employee=>{
      points +=
        5 *
        (1+employee.perk.bonus);
    }
  );

  project.progress += points;

  if(project.progress>=project.required){

    project.progress=project.required;

    project.state="done";

    researchIncomeBonus +=
      project.bonus;

    activeResearch=null;

    notify(
      "🎉 Wdrożono: "+
      project.name
    );
  }
}

/* =========================================================
   ECONOMY
========================================================= */

function processDay(){

  day++;

  processResearch();

  let storeIncome=0;

  stores.forEach(store=>{

    const hasRoute =
      routes.some(
        r=>r.storeId===store.id
      );

    if(hasRoute){

      store.stock =
        Math.min(
          100,
          store.stock+35
        );

    }else{

      store.stock -= 12;
    }

    store.stock =
      Math.max(
        0,
        store.stock
      );

    const stockEfficiency =
      store.stock/100;

    let income =
      store.baseIncome *
      stockEfficiency;

    income *=
      1+researchIncomeBonus;

    income *=
      1+
      departments.marketing.level*.01;

    storeIncome += income;

    updateStorePopup(store);
  });

  storeIncome =
    Math.floor(storeIncome);

  totalStoreIncome +=
    storeIncome;

  let dividends=0;

  companies.forEach(company=>{

    if(company.shares<=0) return;

    const dividend =
      company.profit *
      (company.shares/100);

    dividends += dividend;
  });

  dividends =
    Math.floor(dividends);

  totalDividends += dividends;

  let salaries=0;

  Object.values(departments)
    .forEach(dep=>{

      dep.employees.forEach(
        employee=>{
          salaries += employee.salary;
        }
      );

    });

  drivers.forEach(driver=>{
    salaries += driver.salary;
  });

  let logisticsCosts =
    trucks.length*250 +
    routes.length*180;

  totalLogisticsCosts +=
    logisticsCosts;

  const totalIncome =
    storeIncome+
    dividends;

  const totalCosts =
    salaries+
    logisticsCosts;

  changeMoney(
    totalIncome,
    false
  );

  changeMoney(
    -totalCosts,
    false
  );

  notify(
    "📊 Dzień "+day+
    ": sklepy +"+
    moneyText(storeIncome)+
    ", dywidendy +"+
    moneyText(dividends)+
    ", koszty -"+
    moneyText(totalCosts)
  );

  render();
}

/* =========================================================
   MONEY
========================================================= */

function changeMoney(amount,animate=true){

  money += amount;

  if(animate){

    const fx =
      document.createElement("div");

    fx.className =
      "moneyFx "+
      (
        amount>=0
        ?"plus"
        :"minus"
      );

    fx.textContent =
      (amount>=0?"+":"")+
      moneyText(amount);

    document.body.appendChild(fx);

    setTimeout(
      ()=>fx.remove(),
      1500
    );
  }

  document.getElementById(
    "money"
  ).textContent=
    moneyText(money);
}

/* =========================================================
   NOTES
========================================================= */

function notify(text){

  const note =
    document.createElement("div");

  note.className="note";
  note.textContent=text;

  document.getElementById(
    "notes"
  ).appendChild(note);

  setTimeout(
    ()=>note.remove(),
    4000
  );
}

/* =========================================================
   UTILS
========================================================= */

function random(min,max){

  return Math.floor(
    Math.random()*
    (max-min+1)
  )+min;
}

function randomName(){

  return (
    firstNames[
      random(
        0,
        firstNames.length-1
      )
    ]
    +" "+
    lastNames[
      random(
        0,
        lastNames.length-1
      )
    ]
  );
}

function moneyText(value){

  return Math.round(value)
    .toLocaleString("pl-PL")
    +" zł";
}

function number(value){

  return Math.round(value)
    .toLocaleString("pl-PL");
}
