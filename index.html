<script>
/* ===== WIELE KRAJÓW DLA SPÓŁEK CÓREK ===== */
(function(){
 function subs(){return Array.isArray(window.subsidiaries)?subsidiaries:[]}
 function meta(s){
   s.rg=s.rg||{};
   if(!Array.isArray(s.rg.countries)||!s.rg.countries.length){
     s.rg.countries=Array.isArray(s.countries)&&s.countries.length?s.countries.slice():[s.country].filter(Boolean);
   }
   s.rg.countries=[...new Set(s.rg.countries.filter(Boolean))];
   s.countries=s.rg.countries.slice();
   if(s.countries.length)s.country=s.countries[0];
   return s.rg;
 }
 function findSub(id){return subs().find(s=>String(s.id)===String(id))}
 function addCountry(id){
   const s=findSub(id);if(!s)return;
   const m=meta(s);
   const country=prompt("Dodaj kolejny kraj działania spółki:");
   if(!country||!country.trim())return;
   const c=country.trim();
   if(m.countries.some(x=>x.toLowerCase()===c.toLowerCase()))return alert("Ten kraj jest już przypisany.");
   m.countries.push(c);s.countries=m.countries.slice();
   try{if(typeof autoAssignOwnership==="function")autoAssignOwnership()}catch(e){}
   renderCountriesPanel(id);
   try{if(typeof renderSection==="function")renderSection()}catch(e){}
 }
 function removeCountry(id,country){
   const s=findSub(id);if(!s)return;
   const m=meta(s);
   if(m.countries.length<=1)return alert("Spółka musi mieć przynajmniej jeden kraj działania.");
   m.countries=m.countries.filter(x=>x!==country);
   s.countries=m.countries.slice();s.country=s.countries[0]||"";
   try{if(typeof autoAssignOwnership==="function")autoAssignOwnership()}catch(e){}
   renderCountriesPanel(id);
   try{if(typeof renderSection==="function")renderSection()}catch(e){}
 }
 function renderCountriesPanel(id){
   const root=document.getElementById("subCountriesManager");if(!root)return;
   const s=findSub(id);if(!s)return;const m=meta(s);
   root.innerHTML=`<div class="subcountries-list">${m.countries.map(c=>`<span class="subcountry-chip">🌍 ${c}<button onclick="SUBCOUNTRIES.remove('${s.id}',${JSON.stringify(c)})">×</button></span>`).join("")}</div>
   <button onclick="SUBCOUNTRIES.add('${s.id}')">＋ Dodaj kolejny kraj</button>`;
 }
 function openManager(id){
   const s=findSub(id);if(!s)return;
   const m=meta(s);
   if(typeof modal==="function"){
     modal(`<button class="close" onclick="closeModal()">X</button><h2>🌍 Kraje działania — ${s.name}</h2>
     <div class="muted">Możesz przypisać dowolną liczbę krajów do jednej spółki córki.</div>
     <div id="subCountriesManager"></div>`);
     setTimeout(()=>renderCountriesPanel(id),0);
   }
 }
 window.SUBCOUNTRIES={add:addCountry,remove:removeCountry,open:openManager,render:renderCountriesPanel};

 // Do każdej widocznej karty spółki dokładamy przycisk zarządzania krajami.
 function inject(){
   document.querySelectorAll(".card").forEach(card=>{
     if(card.querySelector(".subcountries-btn"))return;
     const text=(card.textContent||"");
     const s=subs().find(x=>x.name&&text.includes(x.name));
     if(!s)return;
     meta(s);
     const b=document.createElement("button");
     b.className="subcountries-btn";
     b.textContent="🌍 Kraje ("+s.rg.countries.length+")";
     b.onclick=()=>openManager(s.id);
     card.appendChild(b);
   });
 }
 subs().forEach(meta);
 setInterval(inject,700);
})();
</script>

<script>
(function(){
 const E=window.EMPIRE=window.EMPIRE||{
  tab:"market",regions:[],brands:[],pilots:[],departments:{IT:1,Marketing:1,Logistyka:1,Ekspansja:1,Finanse:1,HR:1,RD:1},
  board:[],history:[],office:{},market:{},appUsers:0,lastMonth:"",nextId:1
 };
 const ss=()=>Array.isArray(window.stores)?stores:[];
 const fmt=n=>Math.round(Number(n)||0).toLocaleString("pl-PL")+" zł";
 const countries=()=>[...new Set(ss().map(s=>s.country).filter(Boolean))];

 function ensureMarket(){
  countries().forEach(c=>{if(E.market[c]==null)E.market[c]=Math.min(35,2+ss().filter(s=>s.country===c).length*.35)});
 }
 function addRegion(){
  const name=prompt("Nazwa regionu, np. Benelux:");if(!name)return;
  const first=prompt("Pierwszy kraj regionu:",countries()[0]||"Polska");if(!first)return;
  E.regions.push({id:E.nextId++,name,countries:[first.trim()],director:"Nieobsadzony",budget:250000});render();
 }
 function normalizeRegion(r){
  if(!Array.isArray(r.countries))r.countries=[r.country].filter(Boolean);
  r.countries=[...new Set(r.countries.filter(Boolean))];
  delete r.country;
  return r;
 }
 function addRegionCountry(id){
  const r=E.regions.find(x=>x.id==id);if(!r)return;normalizeRegion(r);
  const input=document.getElementById("empire_region_country_"+id);
  const c=(input?.value||"").trim();if(!c)return;
  if(!r.countries.some(x=>x.toLowerCase()===c.toLowerCase()))r.countries.push(c);
  if(input)input.value="";render();
 }
 function removeRegionCountry(id,c){
  const r=E.regions.find(x=>x.id==id);if(!r)return;normalizeRegion(r);
  if(r.countries.length<=1)return alert("Region musi mieć przynajmniej jeden kraj.");
  r.countries=r.countries.filter(x=>x!==c);render();
 }
 function hireDirector(id){
  const r=E.regions.find(x=>x.id==id);if(!r)return;
  const n=["Anna Król","Marek Lis","Julia Mazur","Tomasz Wójcik"][Math.floor(Math.random()*4)];
  r.director=n;render();
 }
 function createBrand(){
  const name=prompt("Nazwa marki własnej:","Ropucha Select");if(!name)return;
  const cat=prompt("Kategoria:","Napoje")||"Inne";
  E.brands.push({id:E.nextId++,name,category:cat,margin:25,markets:countries().slice(0,1)});render();
 }
 function pilot(){
  const name=prompt("Nazwa pilotażu:","Nowa usługa");if(!name)return;
  E.pilots.push({id:E.nextId++,name,stores:Math.min(10,ss().length),days:30,result:null});render();
 }
 function department(k){
  const cost=250000*E.departments[k];
  if(Number(window.money||0)<cost)return alert("Za mało gotówki.");
  try{changeMoney(-cost)}catch(e){window.money-=cost}
  E.departments[k]++;render();
 }
 function office(c){
  if(E.office[c])return;
  const cost=500000;if(Number(window.money||0)<cost)return alert("Za mało gotówki.");
  try{changeMoney(-cost)}catch(e){window.money-=cost}
  E.office[c]={level:1};render();
 }
 function monthly(){
  ensureMarket();
  countries().forEach(c=>{
   const count=ss().filter(s=>s.country===c).length;
   E.market[c]=Math.max(.1,Math.min(70,E.market[c]+count*.025+(Math.random()-.45)*.35));
  });
  E.appUsers+=Math.round(ss().length*(20+E.departments.Marketing*4));
  E.pilots.forEach(p=>{if(p.result==null){p.days-=30;if(p.days<=0)p.result=Math.round(50+Math.random()*50)}});
  E.history.push({y:window.year||1,m:window.month||1,stores:ss().length,cash:Number(window.money||0),countries:countries().length});
  E.history=E.history.slice(-60);
 }
 function marketUI(){
  ensureMarket();
  return countries().map(c=>`<div class="empire-card"><b>🌍 ${c}</b><div class="empire-big">${E.market[c].toFixed(1)}% rynku</div>
   <div>${ss().filter(s=>s.country===c).length} sklepów</div>
   <button onclick="COUNTRY_OFFICES_API.open('${c}')">${COUNTRY_OFFICES_API.has(c)?"🏢 Biuro krajowe aktywne":"🏢 Otwórz biuro — 500 000 zł"}</button>
    ${COUNTRY_OFFICES_API.has(c)?`<button onclick="COUNTRY_OFFICES_API.upgrade('${c}')">⬆️ Rozbuduj biuro (poziom ${COUNTRY_OFFICES_API.get(c).level})</button>`:""}</div>`).join("")||"<div class='empty'>Brak rynków.</div>";
 }
 function regionsUI(){
  const hints=[...new Set(["Polska","Niemcy","Niderlandy","Belgia","Francja","Czechy","Słowacja","Austria","Dania","Szwecja",...countries()])];
  return `<div class="empire-hero"><h2>🏙️ Regiony operacyjne</h2><p>Łącz kilka krajów w jeden region i oddawaj je pod zarządzanie dyrektora regionalnego.</p></div>
  <button class="btn" onclick="EMPIRE.addRegion()">＋ Utwórz region</button>`+
  E.regions.map(r=>{normalizeRegion(r);return `<div class="empire-card">
    <div class="empire-row"><div><div class="empire-kicker">REGION</div><b style="font-size:18px">🏙️ ${r.name}</b></div><span class="badge ok">${r.countries.length} krajów</span></div>
    <div class="empire-country-list">${r.countries.map(c=>`<span class="empire-country">🌍 ${c}<button onclick="EMPIRE.removeRegionCountry(${r.id},${JSON.stringify(c)})">×</button></span>`).join("")}</div>
    <div class="empire-add-country"><input id="empire_region_country_${r.id}" list="empire_country_hints_${r.id}" placeholder="Wpisz kolejny kraj..."><datalist id="empire_country_hints_${r.id}">${hints.map(c=>`<option value="${c}">`).join("")}</datalist><button onclick="EMPIRE.addRegionCountry(${r.id})">＋ Dodaj kraj</button></div>
    <div class="empire-row"><span>Dyrektor regionalny</span><b>${r.director}</b></div>
    <div class="empire-row"><span>Budżet regionu</span><b>${fmt(r.budget)}</b></div>
    ${r.director==="Nieobsadzony"?`<button onclick="EMPIRE.hireDirector(${r.id})">🧑‍💼 Zatrudnij dyrektora</button>`:""}
  </div>`}).join("")||"<div class='empty'>Nie masz jeszcze regionów. Utwórz pierwszy i przypisz mu kilka krajów.</div>";
 }
 function formatsUI(){
  const formats={standard:"🏪 Standard",mini:"🛒 Mini",market:"🏬 Market",nano:"🤖 Nano",station:"🚉 Dworzec/lotnisko"};
  return ss().map(s=>`<div class="empire-card"><b>${s.name||("Sklep #"+s.id)}</b><div>${s.country||""}</div><select onchange="this.closest('.empire-card');EMPIRE.format('${s.id}',this.value)">${Object.entries(formats).map(([k,n])=>`<option value="${k}" ${(s.format||"standard")===k?"selected":""}>${n}</option>`).join("")}</select></div>`).join("");
 }
 function brandsUI(){
  return `<button onclick="EMPIRE.brand()">＋ Nowa marka własna</button>`+E.brands.map(b=>`<div class="empire-card"><b>🥤 ${b.name}</b><div>${b.category} • marża ${b.margin}%</div><div>Rynki: ${b.markets.join(", ")||"brak"}</div></div>`).join("");
 }
 function pilotsUI(){
  return `<button onclick="EMPIRE.pilot()">＋ Nowy pilotaż</button>`+E.pilots.map(p=>`<div class="empire-card"><b>🧪 ${p.name}</b><div>${p.stores} sklepów • ${p.result==null?p.days+" dni testu":"wynik "+p.result+"/100"}</div>${p.result!=null?`<button onclick="EMPIRE.rollout(${p.id})">🚀 Wdróż w całej sieci</button>`:""}</div>`).join("");
 }
 function departmentsUI(){
  return Object.entries(E.departments).map(([k,v])=>`<div class="empire-card"><b>🏗️ ${k}</b><div class="empire-big">Poziom ${v}</div><button onclick="EMPIRE.department('${k}')">⬆️ Rozbuduj — ${fmt(250000*v)}</button></div>`).join("");
 }
 function extrasUI(){
  return `<div class="empire-card"><b>📱 Aplikacja Ropucha</b><div class="empire-big">${E.appUsers.toLocaleString("pl-PL")} użytkowników</div></div>
  <div class="empire-card"><b>💼 Zarząd grupy</b><div>CEO • CFO • COO • CTO — rozwój zarządu wpływa na kolejne systemy.</div></div>
  <div class="empire-card"><b>⚔️ Konkurencja AI</b><div>Konkurenci rozwijają sklepy, promocje i udział w rynku. Wojny cenowe wpływają na pozycję krajową.</div></div>
  <div class="empire-card"><b>🤝 Przejęcia sieci</b><div>Po przejęciu możesz zachować markę jako spółkę córkę albo konwertować sklepy na Ropucha.</div></div>
  <div class="empire-card"><b>🏆 Ranking globalny</b><div>Pozycja grupy rośnie wraz z liczbą sklepów, krajów, wynikiem i udziałem rynkowym.</div></div>`;
 }
 function historyUI(){
  return E.history.slice().reverse().map(h=>`<div class="empire-card"><b>${h.m}/${h.y}</b><div>${h.stores} sklepów • ${h.countries} krajów • ${fmt(h.cash)}</div></div>`).join("")||"<div class='empty'>Historia zapisze się po kolejnych miesiącach gry.</div>";
 }
 function render(){
  const root=document.getElementById("empireroot");if(!root)return;
  const tabs=[["market","📊 Rynek"],["regions","🏙️ Regiony"],["formats","🏪 Formaty"],["brands","🥤 Marki własne"],["pilots","🧪 Pilotaże"],["departments","🏗️ Centrala"],["history","📈 Historia"],["extras","🌐 Pozostałe"]];
  root.innerHTML=`<div class="empire-shell">
   <div class="empire-hero"><div class="empire-kicker">ROPUCHA GROUP</div><h2>🌐 Rozwój sieci</h2><p>Zarządzaj ekspansją, regionami, formatami sklepów, markami własnymi i projektami całej grupy.</p></div>
   <div class="empire-tabs">${tabs.map(([k,n])=>`<button class="${E.tab===k?"empire-active":""}" onclick="EMPIRE.tab('${k}')">${n}</button>`).join("")}</div>
   <div>${({market:marketUI,regions:regionsUI,formats:formatsUI,brands:brandsUI,pilots:pilotsUI,departments:departmentsUI,history:historyUI,extras:extrasUI}[E.tab]||marketUI)()}</div>
  </div>`;
 }
 window.EMPIRE={
  state:E,
  render,tab(k){E.tab=k;render()},addRegion,addRegionCountry,removeRegionCountry,hireDirector,brand:createBrand,pilot,department,office,
  format(id,v){const s=ss().find(x=>String(x.id)===String(id));if(s)s.format=v;render()},
  rollout(id){const p=E.pilots.find(x=>x.id==id);if(p){p.rolledOut=true;p.stores=ss().length}render()}
 };
 ensureMarket();
 setInterval(()=>{
  const mk=`${window.year||0}-${window.month||0}`;
  if(E.lastMonth!==mk){if(E.lastMonth)monthly();E.lastMonth=mk}
 },1000);
})();
</script>


<style>
.strategy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}

<script>
(function(){
 const S=window.GROUP_STRATEGY=window.GROUP_STRATEGY||{
  tab:"subs",subs:{},hq:{level:1,floors:2},cityMarkets:{},competitors:{},products:[],research:[],
  bonds:0,listed:false,sharePrice:0,news:[],goals:[],lastMonth:"",lastDay:"",nextId:1
 };
 const storesG=()=>Array.isArray(window.stores)?stores:[];
 const subsG=()=>Array.isArray(window.subsidiaries)?subsidiaries:[];
 const fmt=n=>Math.round(Number(n)||0).toLocaleString("pl-PL")+" zł";
 const subId=s=>String(s.id??s.uid??s.name);
 const subName=s=>s.name||"Spółka córka";
 const subCountries=s=>{
   const a=s?.rg?.countries||s?.countries||[s?.country].filter(Boolean);
   return [...new Set(a.filter(Boolean))];
 };
 function meta(s){
   const id=subId(s);
   if(!S.subs[id])S.subs[id]={ceo:"Nieobsadzony",ceoSkill:0,budget:0,strategy:"zrównoważona",auto:false,lastExpansion:"—"};
   return S.subs[id];
 }
 function hireCEO(id){
   const s=subsG().find(x=>subId(x)===String(id));if(!s)return;
   const m=meta(s),names=["Anna Zielińska","Marek Nowak","Julia Król","Piotr Mazur","Natalia Lis"];
   m.ceo=names[Math.floor(Math.random()*names.length)];m.ceoSkill=60+Math.round(Math.random()*35);render();
 }
 function fund(id){
   const s=subsG().find(x=>subId(x)===String(id));if(!s)return;const m=meta(s);
   const amount=Math.max(0,Number(prompt("Budżet dla spółki:",5000000))||0);if(!amount)return;
   if(Number(window.money||0)<amount)return alert("Za mało gotówki.");
   try{changeMoney(-amount)}catch(e){window.money-=amount}m.budget+=amount;render();
 }
 function strategy(id,v){const s=subsG().find(x=>subId(x)===String(id));if(s)meta(s).strategy=v;render()}
 function toggleAuto(id){const s=subsG().find(x=>subId(x)===String(id));if(s){meta(s).auto=!meta(s).auto;render()}}
 function expansionTick(){
   subsG().forEach(s=>{
    const m=meta(s);if(!m.auto||m.ceo==="Nieobsadzony"||m.budget<300000)return;
    const chance={konserwatywna:.08,zrównoważona:.16,agresywna:.30}[m.strategy]||.16;
    if(Math.random()>chance)return;
    const cs=subCountries(s);if(!cs.length)return;
    const country=cs[Math.floor(Math.random()*cs.length)];
    const cost=250000+Math.round(Math.random()*350000);if(m.budget<cost)return;
    m.budget-=cost;m.lastExpansion=`${country}: projekt sklepu (${fmt(cost)})`;
    m.pendingStores=(m.pendingStores||0)+1;
    S.news.unshift(`🏪 ${subName(s)} rozpoczęła projekt nowego sklepu w ${country}.`);
   });
   S.news=S.news.slice(0,30);
 }
 function cityMarket(){
   const cities=["Warszawa","Kraków","Gdańsk","Poznań","Wrocław","Rotterdam","Amsterdam","Berlin","Praga","Antwerpia"];
   cities.forEach(c=>{if(S.cityMarkets[c]==null)S.cityMarkets[c]=Math.max(.5,Math.min(35,2+Math.random()*12))});
 }
 function addProduct(){
   const n=prompt("Nazwa produktu marki własnej:","Ropucha Cola");if(!n)return;
   const cat=prompt("Kategoria:","Napoje")||"Inne";
   S.products.push({id:S.nextId++,name:n,category:cat,stock:0,margin:25});render();
 }
 function research(){
   const tech=["AI zamówień","Roboty magazynowe","Sklep autonomiczny","Kasy bezobsługowe","Optymalizacja tras","Ropucha Pay"];
   const name=tech.find(x=>!S.research.some(r=>r.name===x));if(!name)return alert("Wszystkie technologie są już badane.");
   S.research.push({name,progress:0});render();
 }
 function financeBond(){
   const v=Math.max(0,Number(prompt("Wartość emisji obligacji:",10000000))||0);if(!v)return;
   S.bonds+=v;try{changeMoney(v)}catch(e){window.money+=v}S.news.unshift(`🏦 Grupa wyemitowała obligacje za ${fmt(v)}.`);render();
 }
 function ipo(){
   if(S.listed)return;S.listed=true;S.sharePrice=Math.max(10,Math.round((Number(window.money||0)+storesG().length*250000)/1000000));
   S.news.unshift("📈 Ropucha Group zadebiutowała na giełdzie.");render();
 }
 function hqUpgrade(){
   const cost=S.hq.level*2000000;if(Number(window.money||0)<cost)return alert("Za mało gotówki.");
   try{changeMoney(-cost)}catch(e){window.money-=cost}S.hq.level++;S.hq.floors++;render();
 }
 function month(){
   expansionTick();cityMarket();
   S.research.forEach(r=>r.progress=Math.min(100,r.progress+5+Math.round(Math.random()*10)));
   if(S.listed)S.sharePrice=Math.max(1,S.sharePrice*(.96+Math.random()*.09));
   if(Math.random()<.35)S.news.unshift(["⚔️ Konkurent uruchomił promocję cenową.","🚛 Rosną koszty transportu.","📱 Liczba użytkowników aplikacji rośnie.","🏪 Konkurencja weszła do nowego miasta."][Math.floor(Math.random()*4)]);
   S.news=S.news.slice(0,30);
 }
 function subsUI(){
   return subsG().map(s=>{const m=meta(s);return `<div class="strategy-card"><b>🏢 ${subName(s)}</b><div>${subCountries(s).join(", ")||"Brak krajów"}</div>
    <div>CEO: <b>${m.ceo}</b>${m.ceoSkill?` • ${m.ceoSkill}/100`:""}</div><div>Budżet AI: <b>${fmt(m.budget)}</b></div>
    <div>Ostatnia ekspansja: ${m.lastExpansion}</div>
    <select onchange="GROUPSTRAT.strategy('${subId(s)}',this.value)"><option value="konserwatywna" ${m.strategy==="konserwatywna"?"selected":""}>Konserwatywna</option><option value="zrównoważona" ${m.strategy==="zrównoważona"?"selected":""}>Zrównoważona</option><option value="agresywna" ${m.strategy==="agresywna"?"selected":""}>Agresywna</option></select>
    ${m.ceo==="Nieobsadzony"?`<button onclick="GROUPSTRAT.hireCEO('${subId(s)}')">🧑‍💼 Zatrudnij CEO</button>`:""}

<script>
/* ===== STABLE COUNTRY OFFICES ===== */
(function(){
 const state=window.COUNTRY_OFFICES=window.COUNTRY_OFFICES||{offices:{}};
 function money(){return Number(window.money||0)}
 function pay(v){
   if(money()<v)return false;
   try{ if(typeof changeMoney==="function")changeMoney(-v); else window.money=money()-v; }
   catch(e){window.money=money()-v}
   return true;
 }
 function open(country){
   if(!country)return;
   const o=state.offices[country];
   if(o)return alert("Biuro w tym kraju już działa.");
   const cost=500000;
   if(!pay(cost))return alert("Za mało gotówki. Potrzeba 500 000 zł.");
   state.offices[country]={country,level:1,staff:5,cost,opened:`${window.day||1}.${window.month||1}.${window.year||1}`};
   try{
     if(window.EMPIRE && window.EMPIRE.state && window.EMPIRE.state.office) window.EMPIRE.state.office[country]=state.offices[country];
   }catch(e){}
   alert("Otwarto biuro krajowe: "+country);
   try{if(window.EMPIRE_WORLD && typeof EMPIRE_WORLD.render==="function")EMPIRE_WORLD.render()}catch(e){}
   try{if(typeof renderSection==="function")renderSection()}catch(e){console.error(e)}
 }
 function upgrade(country){
   const o=state.offices[country];if(!o)return;
   const cost=o.level*350000;
   if(!pay(cost))return alert("Za mało gotówki.");
   o.level++;o.staff+=3;
   try{if(typeof renderSection==="function")renderSection()}catch(e){}
 }
 function has(country){return !!state.offices[country]}
 function get(country){return state.offices[country]||null}
 window.COUNTRY_OFFICES_API={open,upgrade,has,get,state};
})();

    {id:2,name:"FreshLine Europe",country:"Niderlandy",category:"Napoje",quality:84,price:79,capacity:9500,contract:false},
    {id:3,name:"NordBake",country:"Niemcy",category:"Pieczywo",quality:88,price:83,capacity:7000,contract:false},
    {id:4,name:"Daily Goods",country:"Czechy",category:"Produkty codzienne",quality:73,price:67,capacity:15000,contract:false}
   ]
 };
 P.nextId=Math.max(P.nextId,...P.list.map(x=>x.id+1));
 const fmt=n=>Math.round(Number(n)||0).toLocaleString("pl-PL")+" zł";
 function sign(id){
   const p=P.list.find(x=>x.id==id);if(!p)return;
   const cost=100000;
   if(Number(window.money||0)<cost)return alert("Za mało gotówki na podpisanie umowy.");
   try{changeMoney(-cost)}catch(e){window.money-=cost}
   p.contract=true;p.contractCost=cost;render();
 }
 function cancel(id){const p=P.list.find(x=>x.id==id);if(p){p.contract=false;render()}}
 function add(){
   const name=prompt("Nazwa producenta:");if(!name)return;
   const country=prompt("Kraj producenta:","Polska")||"Polska";
   const category=prompt("Kategoria:","Żywność")||"Inne";
   P.list.push({id:P.nextId++,name,country,category,quality:60+Math.round(Math.random()*35),price:55+Math.round(Math.random()*35),capacity:5000+Math.round(Math.random()*15000),contract:false});
   render();
 }
 function render(){
   const root=document.getElementById("producers2root");if(!root)return;
   const active=P.list.filter(x=>x.contract).length;
   root.innerHTML=`<div class="grid">
     <div class="card"><small>Producenci</small><h3>${P.list.length}</h3></div>
     <div class="card"><small>Aktywne umowy</small><h3>${active}</h3></div>
     <div class="card"><small>Łączna zdolność dostaw</small><h3>${P.list.reduce((a,x)=>a+x.capacity,0).toLocaleString("pl-PL")}</h3></div>
    </div>
    <button class="btn" onclick="PRODUCERS_API.add()">＋ Dodaj producenta</button>
    <div class="prod-grid">${P.list.map(p=>`<div class="prod-card">
      <b>🏭 ${p.name}</b><div>${p.country} • ${p.category}</div>
      <div class="row"><span>Jakość</span><b>${p.quality}/100</b></div>
      <div class="row"><span>Poziom cen</span><b>${p.price}/100</b></div>
      <div class="row"><span>Moc produkcyjna</span><b>${p.capacity.toLocaleString("pl-PL")}</b></div>
      <div>Status: <b>${p.contract?"✅ Umowa aktywna":"Brak umowy"}</b></div>
      ${p.contract?`<button onclick="PRODUCERS_API.cancel(${p.id})">Rozwiąż umowę</button>`:`<button onclick="PRODUCERS_API.sign(${p.id})">📋 Podpisz umowę — ${fmt(100000)}</button>`}
    </div>`).join("")}</div>`;
 }
 window.PRODUCERS_API={render,sign,cancel,add};
})();
</script>

<script>
/* ===== LIVE FRANCZYZOBIORCY + FIX SCROLL ===== */
(function(){
 const LIVE=window.FRANCHISE_LIVE=window.FRANCHISE_LIVE||{nextId:50000,lastKey:"",maxCandidates:40};
 const first=["Anna","Marek","Julia","Piotr","Natalia","Tomasz","Katarzyna","Michał","Aleksandra","Paweł","Zofia","Jakub","Oliwia","Kacper"];
 const last=["Nowak","Kowalski","Mazur","Król","Wójcik","Lis","Zieliński","Kamińska","Lewandowski","Dąbrowska","Woźniak","Krawczyk"];
 const pick=a=>a[Math.floor(Math.random()*a.length)];

 function list(){
   if(Array.isArray(window.franchisees))return window.franchisees;
   if(Array.isArray(window.franchiseOperators))return window.franchiseOperators;
   window.franchisees=[]; return window.franchisees;
 }
 function markets(){
   const a=(Array.isArray(window.subsidiaries)?subsidiaries:[]).flatMap(s=>s?.rg?.countries||s?.countries||[s?.country].filter(Boolean));
   const b=(Array.isArray(window.stores)?stores:[]).map(s=>s.country).filter(Boolean);
   return [...new Set([...a,...b])].length?[...new Set([...a,...b])]:["Polska"];
 }
 function make(){
   return {id:LIVE.nextId++,name:pick(first)+" "+pick(last),country:pick(markets()),
    capital:150000+Math.floor(Math.random()*1850000),experience:Math.floor(Math.random()*18),
    rating:+(2.8+Math.random()*2.2).toFixed(1),risk:Math.round(15+Math.random()*80),
    management:Math.round(45+Math.random()*55),stores:[],employees:0,debt:0,active:true,ai:true,candidate:true};
 }
 function storeCount(x){return Array.isArray(x.stores)?x.stores.length:Number(x.storeCount||0)}
 function addCandidates(n){
   const a=list();
   for(let i=0;i<n;i++)a.push(make());
   // Nie usuwamy aktywnych operatorów. Ograniczamy tylko nadmiar wolnych kandydatów.
   const candidates=a.filter(x=>storeCount(x)===0 && x.candidate);
   while(candidates.length>LIVE.maxCandidates){
     const victim=candidates.shift(),idx=a.indexOf(victim);if(idx>=0)a.splice(idx,1);
   }
 }
 function tick(){
   const key=`${window.year||1}-${window.month||1}-${window.day||1}`;
   if(LIVE.lastKey===key)return;
   LIVE.lastKey=key;
   // każdego dnia pojawia się 1–3 nowych kandydatów
   addCandidates(1+Math.floor(Math.random()*3));
   refreshVisibleFranchiseOnly();
 }
 function refreshVisibleFranchiseOnly(){
   // Kluczowy fix scrolla: NIE wywołujemy renderSection() co chwilę.
   // Jeśli użytkownik jest w panelu franczyzy, odświeżamy tylko licznik/kontrolkę,
   // bez przebudowy całej zakładki i bez resetu scrollTop.
   const badge=document.getElementById("liveFranchiseCount");
   if(badge)badge.textContent=list().filter(x=>storeCount(x)===0).length;
 }
 function inject(){
   const panel=document.getElementById("panel");if(!panel)return;
   if(!/franczyz/i.test(panel.textContent||""))return;
   if(panel.querySelector("#liveFranchiseBox"))return;
   const y=panel.scrollTop;
   const box=document.createElement("div");box.id="liveFranchiseBox";box.className="card";
   box.innerHTML=`<b>🤖 Kandydaci AI na bieżąco</b>
    <div>Wolni kandydaci: <b id="liveFranchiseCount">${list().filter(x=>storeCount(x)===0).length}</b></div>
    <div class="muted">Każdego dnia gry pojawia się 1–3 nowych kandydatów. Aktywni franczyzobiorcy ze sklepami zostają.</div>
    <button onclick="FRANCHISE_LIVE_API.addNow()">＋ Wygeneruj 5 teraz</button>`;
   panel.prepend(box);
   panel.scrollTop=y;
 }
 function addNow(){addCandidates(5);refreshVisibleFranchiseOnly()}
 window.FRANCHISE_LIVE_API={addNow,tick,list};
 // Startowa pula, jeśli jeszcze nie ma kandydatów
 if(list().filter(x=>storeCount(x)===0).length<8)addCandidates(12);
 setInterval(tick,700);
 setInterval(inject,900);
})();
</script>

<script>
/* ===== GLOBALNY FIX: ZAKŁADKI NIE COFAJĄ SCROLLA DO GÓRY ===== */
(function(){
 let savedWindowY=0, savedPanelY=0;
 document.addEventListener("scroll",()=>{savedWindowY=window.scrollY||0},{passive:true});
 setInterval(()=>{
   const p=document.getElementById("panel");
   if(p && p.scrollTop>0)savedPanelY=p.scrollTop;
 },250);

 // Zachowaj scroll wokół automatycznych rerenderów wywoływanych przez grę.
 if(typeof window.renderSection==="function"){
   const original=window.renderSection;
   window.renderSection=function(){
     const wy=window.scrollY||savedWindowY;
     const p0=document.getElementById("panel");
     const py=p0?p0.scrollTop:savedPanelY;
     const result=original.apply(this,arguments);
     requestAnimationFrame(()=>{
       const p1=document.getElementById("panel");
       if(p1)p1.scrollTop=py;
       window.scrollTo(0,wy);
     });
     return result;
   };
 }
})();
</script>
