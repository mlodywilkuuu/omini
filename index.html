<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transport City — Stable</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px system-ui,Segoe UI,sans-serif;background:#102334;color:#edf7ff}#map{position:fixed;inset:0;overflow:hidden;background:#bed3c9;cursor:grab;touch-action:none}#tiles{position:absolute;inset:0;pointer-events:none}#tiles img{position:absolute;width:256px;height:256px;max-width:none}#paths{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#pins{position:absolute;inset:0;pointer-events:none}.pin{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;cursor:pointer;font-size:22px;filter:drop-shadow(0 2px 3px #111)}.vehicle{font-size:20px}.panel{position:fixed;z-index:5;top:12px;left:12px;bottom:12px;width:min(370px,calc(100vw - 24px));background:#0b1d30ef;border:1px solid #63849c;border-radius:18px;box-shadow:0 15px 45px #0007;display:flex;flex-direction:column;overflow:hidden}.header{padding:15px 16px 9px}.header h1{margin:0;color:#ffdf98;font-size:23px}.sub{color:#9fc1d3;font-size:12px;margin-top:5px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.stat{padding:9px;border-radius:10px;background:#21394b}.stat strong{display:block;margin-top:4px;font-size:16px}.tabs{display:flex;gap:5px;overflow:auto;padding:8px 12px;border-top:1px solid #345064;border-bottom:1px solid #345064}.tabs button{white-space:nowrap}button,select,input{font:inherit;border-radius:9px;border:1px solid #567a92;padding:9px 11px;background:#23465d;color:white}button{cursor:pointer}button:hover{background:#356a86}button.active,.primary{background:#147c80;border-color:#5ce0ca}button:disabled{opacity:.5}.content{padding:13px 16px 20px;overflow:auto;flex:1}.item{border:1px solid #38566b;border-radius:12px;padding:11px;margin:9px 0;background:#142e42}.row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:9px 0}.hint{color:#a9c6d5;font-size:12px;line-height:1.5}.title{font-size:17px;font-weight:750;margin:8px 0}.badge{background:#254e65;border-radius:7px;padding:3px 7px;font-size:12px}.right{position:fixed;right:15px;top:15px;z-index:4;background:#0b1d30e8;padding:12px;border-radius:12px;display:flex;gap:8px;align-items:center}.zoom{position:fixed;right:15px;bottom:30px;z-index:4;display:grid;gap:5px}.zoom button{font-size:21px}.footer{position:fixed;right:10px;bottom:3px;background:#ffffffbb;color:#1d3136;padding:2px 5px;font-size:11px;z-index:4}.toast{position:fixed;z-index:9;left:50%;bottom:28px;transform:translateX(-50%);background:#0c3447;padding:12px 18px;border-radius:12px;display:none;max-width:80vw}.warning{background:#64303a;color:white;padding:10px;border-radius:9px;margin-bottom:10px}.legend{font-size:12px;color:#c3d9e5}.progress{height:6px;background:#27485d;border-radius:5px;overflow:hidden;margin-top:7px}.progress>div{height:100%;background:#63dbc7;width:0%}@media(max-width:650px){.panel{top:auto;bottom:8px;height:57vh}.right{top:8px}.zoom{bottom:59vh}}
</style></head><body><div id="map"><div id="tiles"></div><svg id="paths"></svg><div id="pins"></div></div><div class="panel"><div class="header"><h1>🚇 Transport City</h1><div class="sub">STABLE EDITION · OpenStreetMap bez klucza API</div><div class="stats"><div class="stat">💰 Budżet<strong id="money">—</strong></div><div class="stat">🗓 Miesiąc<strong id="month">1</strong></div><div class="stat">🚏 Przystanki<strong id="stops">0</strong></div><div class="stat">🚌 Linie<strong id="lines">0</strong></div></div><div class="progress"><div id="progress"></div></div></div><div class="tabs" id="tabs"><button data-tab="build">🚏 Buduj</button><button data-tab="lines">🛣 Linie</button><button data-tab="fleet">🚌 Flota</button><button data-tab="traffic">🚦 Korki</button><button data-tab="finance">💰 Finanse</button><button data-tab="save">💾 Zapis</button></div><div class="content" id="content"></div></div><div class="right"><span id="clock">06:00</span><span id="trafficbadge">🚦 20%</span><button id="toggle">Ukryj panel</button></div><div class="zoom"><button id="zin">+</button><button id="zout">−</button></div><div class="footer">© OpenStreetMap contributors · dane mapy wymagają internetu</div><div id="toast" class="toast"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), fmt=n=>Math.round(n).toLocaleString('pl-PL'),R=Math.PI/180;
const START={money:4500000,month:1,nextId:1,stops:[],lines:[],staff:{bus:0,tram:0,metro:0},fares:{bus:3.5,tram:3.5,metro:3.5},ownedFleet:[],fleetSerial:1001,operations:{buslanes:0,signals:0}};
let state=structuredClone(START),tab='build',buildType='bus',draft=[],lineType='bus',showTraffic=true,monthStart=Date.now(),mapCenter=[53.1325,23.1688],zoom=13,drag=null,tileGrid='',toastTimer;
try{const old=JSON.parse(localStorage.getItem('transport-city-v1'));if(old&&Array.isArray(old.stops)&&Array.isArray(old.lines))state={...state,...old}}catch(e){}
state.staff={...START.staff,...(state.staff||{})};state.fares={...START.fares,...(state.fares||{})};state.operations={...START.operations,...(state.operations||{})};state.ownedFleet=Array.isArray(state.ownedFleet)?state.ownedFleet:[];state.nextId=Math.max(state.nextId||1,1,...state.stops.map(x=>Number(x.id)+1),...state.lines.map(x=>Number(x.id)+1));
function save(){try{localStorage.setItem('transport-city-v1',JSON.stringify(state))}catch(e){notify('Przeglądarka zablokowała zapis — użyj eksportu JSON')}}
function notify(s){const el=$('toast');el.textContent=s;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',2800)}
function xy(lat,lng,z=zoom){const q=256*2**z;lat=Math.max(-85,Math.min(85,lat));return [(lng+180)/360*q,(1-Math.log(Math.tan(lat*R)+1/Math.cos(lat*R))/Math.PI)/2*q]}
function ll(x,y,z=zoom){const q=256*2**z;return [Math.atan(Math.sinh(Math.PI*(1-2*y/q)))/R,x/q*360-180]}
function screen(lat,lng){const p=xy(lat,lng),c=xy(...mapCenter);return [p[0]-c[0]+innerWidth/2,p[1]-c[1]+innerHeight/2]}
function unproject(x,y){const c=xy(...mapCenter);return ll(c[0]+x-innerWidth/2,c[1]+y-innerHeight/2)}
function drawTiles(){const c=xy(...mapCenter),w=innerWidth,h=innerHeight,x0=Math.floor((c[0]-w/2)/256),x1=Math.floor((c[0]+w/2)/256),y0=Math.floor((c[1]-h/2)/256),y1=Math.floor((c[1]+h/2)/256);const key=[zoom,x0,x1,y0,y1].join(':');if(key!==tileGrid){tileGrid=key;let html='';for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){if(y<0||y>=2**zoom)continue;const tx=(x%(2**zoom)+2**zoom)%(2**zoom);html+=`<img data-x="${x}" data-y="${y}" src="https://tile.openstreetmap.org/${zoom}/${tx}/${y}.png" alt="">`}$('tiles').innerHTML=html}for(const im of $('tiles').children){im.style.left=Math.round(Number(im.dataset.x)*256-c[0]+w/2)+'px';im.style.top=Math.round(Number(im.dataset.y)*256-c[1]+h/2)+'px'}}
const colors={bus:'#ffbf64',tram:'#5ce2c6',metro:'#c5a1ff'},symbols={bus:'🚌',tram:'🚋',metro:'🚇'};
function pts(line){const arr=Array.isArray(line.routeCoords)&&line.routeCoords.length>1?line.routeCoords:line.stops.map(id=>state.stops.find(x=>x.id===id)).filter(Boolean).map(s=>[s.lat,s.lng]);return arr}
function hour(){return (6+Math.floor(((Date.now()-monthStart)%45000)/45000*24))%24}
function traffic(){const h=hour(),peak=Math.exp(-(((h-8)/1.8)**2))*54+Math.exp(-(((h-16.5)/2.1)**2))*50;return Math.round(Math.min(100,17+peak+Math.exp(-(((h-12)/4)**2))*10))}
function drawMap(){drawTiles();const svg=$('paths');svg.setAttribute('viewBox',`0 0 ${innerWidth} ${innerHeight}`);let lines='';for(const l of state.lines){const a=pts(l);if(a.length<2)continue;const points=a.map(p=>screen(p[0],p[1]).join(',')).join(' ');lines+=`<polyline points="${points}" fill="none" stroke="#102c40" stroke-width="9" stroke-linecap="round"/><polyline points="${points}" fill="none" stroke="${l.color||colors[l.type]||'#ffbd63'}" stroke-width="5" stroke-linecap="round"/>`;if(showTraffic&&l.type==='bus')for(let i=1;i<a.length;i++){const q=traffic()+((i*17+Number(l.id)*13)%35)-18,col=q>67?'#f05b59':q>43?'#eac15b':'#52d49a',p1=screen(...a[i-1]),p2=screen(...a[i]);lines+=`<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="${col}" stroke-width="3"/>`}}if(draft.length>1){const points=draft.map(id=>state.stops.find(s=>s.id===id)).filter(Boolean).map(s=>screen(s.lat,s.lng).join(',')).join(' ');lines+=`<polyline points="${points}" fill="none" stroke="white" stroke-width="4" stroke-dasharray="7 6"/>`}svg.innerHTML=lines;let html='';for(const st of state.stops){const [x,y]=screen(st.lat,st.lng);if(x<-30||x>innerWidth+30||y<-30||y>innerHeight+30)continue;html+=`<div class="pin" data-stop="${st.id}" title="${safe(st.name)}" style="left:${x}px;top:${y}px">${symbols[st.type]||'🚏'}</div>`}for(const l of state.lines){const a=pts(l);if(a.length<2)continue;const count=Math.min(12,Number(l.vehicles)||0);for(let i=0;i<count;i++){const phase=(Date.now()/17000+i/Math.max(1,count))%1,idx=Math.min(a.length-2,Math.floor(phase*(a.length-1))),f=phase*(a.length-1)-idx;const [x,y]=screen(a[idx][0]*(1-f)+a[idx+1][0]*f,a[idx][1]*(1-f)+a[idx+1][1]*f);html+=`<div class="pin vehicle" style="left:${x}px;top:${y}px" title="${safe(l.name)}">${symbols[l.type]}</div>`}}$('pins').innerHTML=html;$('pins').querySelectorAll('[data-stop]').forEach(el=>el.onclick=()=>{const st=state.stops.find(s=>s.id==el.dataset.stop);if(tab==='lines'&&st.type===lineType){if(!draft.includes(st.id))draft.push(st.id);render();notify('Dodano przystanek do trasy: '+st.name)}else notify(st.name)})}
function safe(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function charge(n){if(state.money<n){notify('Za mało pieniędzy');return false}state.money-=n;return true}
function money(){return state.lines.reduce((n,l)=>n+(l.vehicles||0)*18000+(l.stops.length*1200),0)}
function render(){const t=traffic();$('money').textContent=fmt(state.money)+' zł';$('month').textContent=state.month;$('stops').textContent=state.stops.length;$('lines').textContent=state.lines.length;$('clock').textContent=String(hour()).padStart(2,'0')+':00';$('trafficbadge').textContent='🚦 '+t+'%';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html='';
if(tab==='build'){html=`<div class="title">🚏 Budowanie przystanków</div><div class="hint">Wybierz rodzaj, a potem kliknij mapę. Każdy przystanek kosztuje pieniądze.</div><div class="row">${['bus','tram','metro'].map(k=>`<button data-build="${k}" class="${buildType===k?'active':''}">${symbols[k]} ${k==='bus'?'Autobus':k==='tram'?'Tramwaj':'Metro'}</button>`).join('')}</div><div class="item">Kliknij na mapie, aby postawić przystanek. Koszt: ${fmt({bus:35000,tram:150000,metro:650000}[buildType])} zł.</div><div class="title">Przystanki</div>${state.stops.map(s=>`<div class="item"><b>${symbols[s.type]} ${safe(s.name)}</b><div class="row"><button data-focus="${s.id}">Pokaż</button><button data-remove="${s.id}">Usuń</button></div></div>`).join('')||'<p class="hint">Brak przystanków — kliknij na mapę.</p>'}`}
if(tab==='lines'){html=`<div class="title">🛣 Tworzenie linii</div><div class="hint">Wybierz rodzaj, klikaj przystanki na mapie, a następnie utwórz linię. Potrzebne są minimum 2 przystanki tego samego rodzaju.</div><div class="row">${['bus','tram','metro'].map(k=>`<button data-linetype="${k}" class="${lineType===k?'active':''}">${symbols[k]}</button>`).join('')}</div><div class="item">Wybrane przystanki: <b>${draft.length}</b><div class="row"><input id="linename" placeholder="Numer/nazwa linii" style="min-width:110px;flex:1"><button id="createLine" class="primary">Utwórz</button><button id="clearDraft">Wyczyść</button></div></div>${state.lines.map(l=>`<div class="item"><b>${symbols[l.type]} ${safe(l.name)}</b><p>${l.stops.length} przystanków · ${l.vehicles||0} pojazdów · +${l.delay||0} min</p><div class="row"><button data-addbus="${l.id}">+ Pojazd</button><button data-delbus="${l.id}">− Pojazd</button><button data-deleteline="${l.id}">Usuń linię</button></div></div>`).join('')||'<p class="hint">Brak linii.</p>'}`}
if(tab==='fleet'){html=`<div class="title">🚌 Flota i pracownicy</div><div class="hint">Pojazdy są przypisane do linii. Kierowcy ograniczają liczbę pojazdów mogących wyjechać.</div>${['bus','tram','metro'].map(k=>`<div class="item"><b>${symbols[k]} ${k.toUpperCase()}</b><p>Pracownicy: ${state.staff[k]||0} · pojazdy: ${state.lines.filter(l=>l.type===k).reduce((n,l)=>n+(l.vehicles||0),0)}</p><button data-hire="${k}">Zatrudnij kierowcę</button></div>`).join('')}<div class="hint">Miesięczne wynagrodzenia są rozliczane automatycznie.</div>`}
if(tab==='traffic'){html=`<div class="title">🚦 Ruch uliczny i opóźnienia</div><div class="item"><b>Godzina ${String(hour()).padStart(2,'0')}:00 · ruch ${t}%</b><p>Rano 7–9 i po południu 15–18 występują korki. Autobusy mają największe opóźnienia, tramwaje mniejsze, metro jest niezależne od korków.</p><button id="toggleTraffic">${showTraffic?'Ukryj':'Pokaż'} korki na trasach</button></div>${state.lines.map(l=>`<div class="item"><b>${safe(l.name)}</b><p>Opóźnienie: +${l.delay||0} min</p></div>`).join('')||'<p class="hint">Zbuduj linię, aby zobaczyć opóźnienia.</p>'}<div class="hint">Kolory tras są symulacją, nie rzeczywistymi danymi drogowymi.</div>`}
if(tab==='finance'){html=`<div class="title">💰 Finanse</div><div class="item">Budżet: <b>${fmt(state.money)} zł</b><p>Przychody szacowane: ${fmt(money())} zł/mies.</p><p>Przystanki: ${state.stops.length} · linie: ${state.lines.length}</p></div><div class="hint">Miesiąc gry trwa 45 sekund. Ceny biletów:</div>${['bus','tram','metro'].map(k=>`<div class="row">${symbols[k]} <input type="number" min="0.5" max="20" step="0.5" value="${state.fares[k]}" data-fare="${k}"> zł</div>`).join('')}`}
if(tab==='save'){html=`<div class="title">💾 Zapis i kopia gry</div><div class="item"><button id="saveNow" class="primary">Zapisz grę</button> <button id="export">Eksport JSON</button><p class="hint">Gra zapisuje się automatycznie w pamięci Chrome. Możesz też pobrać kopię JSON.</p><input id="import" type="file" accept=".json,application/json"></div><div class="item"><button id="reset">Nowa gra (usuń zapis)</button></div>`}
$('content').innerHTML=html;bind();drawMap()}
function bind(){document.querySelectorAll('[data-build]').forEach(b=>b.onclick=()=>{buildType=b.dataset.build;render()});document.querySelectorAll('[data-linetype]').forEach(b=>b.onclick=()=>{lineType=b.dataset.linetype;draft=[];render()});document.querySelectorAll('[data-focus]').forEach(b=>b.onclick=()=>{const st=state.stops.find(s=>s.id==b.dataset.focus);mapCenter=[st.lat,st.lng];zoom=16;tileGrid='';drawMap()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.remove);if(state.lines.some(l=>l.stops.includes(id))){notify('Przystanek należy do linii');return}state.stops=state.stops.filter(s=>s.id!==id);save();render()});const cr=$('createLine');if(cr)cr.onclick=()=>{if(draft.length<2){notify('Wybierz minimum dwa przystanki');return}const cost={bus:70000,tram:260000,metro:1200000}[lineType];if(!charge(cost))return;const name=$('linename').value.trim()||'Linia '+state.nextId;state.lines.push({id:state.nextId++,name,type:lineType,stops:[...draft],vehicles:0,interval:15,delay:0,reliability:95});draft=[];save();render();notify('Utworzono linię '+name)};const cl=$('clearDraft');if(cl)cl.onclick=()=>{draft=[];render()};document.querySelectorAll('[data-addbus]').forEach(b=>b.onclick=()=>{const l=state.lines.find(l=>l.id==b.dataset.addbus),price={bus:200000,tram:850000,metro:3000000}[l.type];if(!charge(price))return;l.vehicles=(l.vehicles||0)+1;save();render()});document.querySelectorAll('[data-delbus]').forEach(b=>b.onclick=()=>{const l=state.lines.find(l=>l.id==b.dataset.delbus);l.vehicles=Math.max(0,(l.vehicles||0)-1);save();render()});document.querySelectorAll('[data-deleteline]').forEach(b=>b.onclick=()=>{state.lines=state.lines.filter(l=>l.id!=b.dataset.deleteline);save();render()});document.querySelectorAll('[data-hire]').forEach(b=>b.onclick=()=>{state.staff[b.dataset.hire]++;save();render()});document.querySelectorAll('[data-fare]').forEach(el=>el.onchange=()=>{state.fares[el.dataset.fare]=Math.max(.5,Number(el.value)||3.5);save()});const tt=$('toggleTraffic');if(tt)tt.onclick=()=>{showTraffic=!showTraffic;render()};const sn=$('saveNow');if(sn)sn.onclick=()=>{save();notify('Zapisano')};const ex=$('export');if(ex)ex.onclick=()=>{const a=document.createElement('a'),blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='transport-city-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};const imp=$('import');if(imp)imp.onchange=async()=>{try{const data=JSON.parse(await imp.files[0].text());if(!Array.isArray(data.stops)||!Array.isArray(data.lines))throw Error();state={...structuredClone(START),...data};save();render();notify('Wczytano zapis')}catch(e){notify('Nieprawidłowy plik zapisu')}};const rs=$('reset');if(rs)rs.onclick=()=>{if(confirm('Na pewno rozpocząć nową grę?')){state=structuredClone(START);save();render()}}}
const map=$('map');map.addEventListener('pointerdown',e=>{if(e.target.closest('.pin'))return;drag={x:e.clientX,y:e.clientY,c:xy(...mapCenter),moved:false};map.setPointerCapture(e.pointerId)});map.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)drag.moved=true;mapCenter=ll(drag.c[0]-dx,drag.c[1]-dy);drawMap()});map.addEventListener('pointerup',e=>{if(!drag)return;const clicked=!drag.moved;drag=null;if(!clicked||tab!=='build')return;const [lat,lng]=unproject(e.clientX,e.clientY),price={bus:35000,tram:150000,metro:650000}[buildType];if(!charge(price))return;const id=state.nextId++;state.stops.push({id,name:'Przystanek '+id,type:buildType,lat,lng,waiting:0});save();render();notify('Zbudowano przystanek')});$('zin').onclick=()=>{zoom=Math.min(18,zoom+1);tileGrid='';drawMap()};$('zout').onclick=()=>{zoom=Math.max(3,zoom-1);tileGrid='';drawMap()};$('toggle').onclick=()=>{const panel=document.querySelector('.panel'),hidden=panel.style.display==='none';panel.style.display=hidden?'flex':'none';$('toggle').textContent=hidden?'Ukryj panel':'Pokaż panel'};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});window.addEventListener('resize',drawMap);
setInterval(()=>{const elapsed=Date.now()-monthStart;if(elapsed>=45000){monthStart=Date.now();state.month++;const income=money(),cost=state.stops.length*450+state.lines.reduce((n,l)=>n+(l.vehicles||0)*4500,0)+Object.entries(state.staff).reduce((n,[k,v])=>n+v*7400,0);state.money+=income-cost;save();notify('Nowy miesiąc: '+fmt(income-cost)+' zł');render()}else{$('progress').style.width=(elapsed/45000*100)+'%';$('clock').textContent=String(hour()).padStart(2,'0')+':00';$('trafficbadge').textContent='🚦 '+traffic()+'%';if(tab==='traffic'&&elapsed%4000<500)render();drawMap()}},1100);
render();notify('Gra uruchomiona. Wybierz Buduj i kliknij mapę.');
})();
</script></body></html>
