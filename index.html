<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ropucha Group Tycoon</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
}

button,select,input{font:inherit}

#map{
  position:absolute;
  inset:0;
  background:#ddd;
  z-index:1;
}

/* poprawa ostrości */
.leaflet-tile{
  image-rendering:auto!important;
}

.leaflet-container{
  background:#d8d8d8;
}

/* HUD */

#hud{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  z-index:1500;
  pointer-events:none;
}

.hud{
  background:#111e;
  border:2px solid #333;
  border-radius:9px;
  min-width:100px;
  padding:7px 12px;
  text-align:center;
}

.hud small{
  display:block;
  color:#999;
  font-size:9px;
  text-transform:uppercase;
}

.hud strong{
  font-size:17px;
}

#money{color:#65e875}

/* SIDEBAR */

#sidebar{
  position:fixed;
  left:12px;
  top:80px;
  bottom:12px;
  width:340px;
  z-index:1400;
  background:#111e;
  border:2px solid #333;
  border-radius:13px;
  padding:12px;
  overflow-y:auto;
  backdrop-filter:blur(7px);
}

.logo{
  font-weight:900;
  font-size:19px;
  color:#68e777;
  margin-bottom:10px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-bottom:10px;
}

.tab{
  border:0;
  padding:8px 5px;
  border-radius:6px;
  background:#292929;
  color:white;
  cursor:pointer;
  font-size:12px;
}

.tab.active{
  background:#176d38;
}

.panel{display:none}
.panel.active{display:block}

.box{
  background:#252525;
  border-radius:9px;
  padding:10px;
  margin-bottom:8px;
}

.box h3{
  margin:0 0 8px;
  font-size:14px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin:5px 0;
  color:#ccc;
  font-size:12px;
}

.btn{
  width:100%;
  border:0;
  border-radius:6px;
  padding:8px;
  margin-top:5px;
  color:white;
  background:#176d38;
  font-weight:bold;
  cursor:pointer;
}

.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:not-allowed}

.blue{background:#285e9b}
.orange{background:#9c5e22}
.red{background:#8c3636}
.gray{background:#555}

/* PRODUCENCI */

.company{
  background:#282828;
  border-radius:8px;
  padding:10px;
  margin-bottom:8px;
}

.companyName{
  font-weight:bold;
  margin-bottom:6px;
}

.shareBar{
  height:8px;
  background:#444;
  border-radius:5px;
  overflow:hidden;
  margin:7px 0;
}

.shareFill{
  height:100%;
  background:#66df76;
}

.shareButtons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.shareButtons button{
  border:0;
  border-radius:5px;
  background:#315d3a;
  color:white;
  padding:6px;
  cursor:pointer;
}

/* MARKERY */

.marker{
  width:36px;
  height:36px;
  border:3px solid white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  box-shadow:0 3px 10px #0008;
}

.storeMarker{background:#18733b}
.centerMarker{background:#285e9d}
.factoryMarker{background:#9d612b}
.hqMarker{background:#722e91}

/* BUILD INFO */

#buildInfo{
  display:none;
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:2000;
  background:#111e;
  border:2px solid #555;
  border-radius:9px;
  padding:10px 20px;
}

/* MONEY FX */

.moneyFx{
  position:fixed;
  top:75px;
  left:50%;
  z-index:9000;
  font-size:25px;
  font-weight:900;
  pointer-events:none;
  animation:moneyAnimation 1.4s forwards;
}

.plus{color:#68f079}
.minus{color:#ff6262}

@keyframes moneyAnimation{
  0%{opacity:0;transform:translate(-50%,20px)}
  20%{opacity:1;transform:translate(-50%,0) scale(1.15)}
  100%{opacity:0;transform:translate(-50%,-50px)}
}

/* NOTIFICATIONS */

#notifications{
  position:fixed;
  right:15px;
  bottom:15px;
  width:310px;
  z-index:8000;
}

.notification{
  background:#111f;
  border-left:5px solid #63df73;
  padding:10px;
  margin-top:6px;
  border-radius:6px;
  font-size:12px;
}

/* PROGRESS */

.progress{
  height:8px;
  background:#444;
  border-radius:5px;
  overflow:hidden;
  margin:6px 0;
}

.progressFill{
  height:100%;
  background:#65df74;
}

/* MODAL */

#modalBackground{
  display:none;
  position:fixed;
  inset:0;
  z-index:7000;
  background:#000a;
  align-items:center;
  justify-content:center;
}

#modal{
  width:min(650px,90vw);
  max-height:85vh;
  overflow-y:auto;
  background:#181818;
  border:2px solid #444;
  border-radius:14px;
  padding:17px;
}

.closeBtn{
  float:right;
  background:#8d3434;
  color:white;
  border:0;
  border-radius:6px;
  padding:7px 10px;
  cursor:pointer;
}

/* CONSOLE */

#console{
  display:none;
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(700px,90vw);
  height:430px;
  background:#080b09f7;
  border:2px solid #59e36d;
  border-radius:10px;
  z-index:20000;
  font-family:Consolas,monospace;
  overflow:hidden;
  box-shadow:0 20px 80px #000;
}

#consoleHeader{
  height:45px;
  background:#142117;
  border-bottom:1px solid #315d38;
  color:#69ef7d;
  padding:13px;
  font-weight:bold;
}

#consoleHistory{
  height:325px;
  padding:12px;
  overflow-y:auto;
  white-space:pre-wrap;
  font-size:13px;
  color:#bacabd;
  line-height:1.5;
}

#consoleInputBox{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:58px;
  background:#0c110d;
  border-top:1px solid #315d38;
  display:flex;
  align-items:center;
  padding:8px 12px;
  gap:8px;
  color:#67e77a;
}

#consoleInput{
  flex:1;
  background:transparent;
  border:0;
  outline:0;
  color:white;
  font-family:Consolas,monospace;
}

/* RESPONSIVE */

@media(max-width:800px){
  #sidebar{width:290px}
  .hud:nth-child(n+4){display:none}
}
</style>
</head>

<body>

<div id="map"></div>

<div id="hud">

  <div class="hud">
    <small>Kasa</small>
    <strong id="money">0 zł</strong>
  </div>

  <div class="hud">
    <small>Sklepy</small>
    <strong id="storesHUD">0</strong>
  </div>

  <div class="hud">
    <small>Franczyza</small>
    <strong id="franchiseHUD">0</strong>
  </div>

  <div class="hud">
    <small>Kierowcy</small>
    <strong id="driversHUD">0</strong>
  </div>

  <div class="hud">
    <small>Dzień</small>
    <strong id="dayHUD">1</strong>
  </div>

</div>

<div id="sidebar">

  <div class="logo">
    🐸 ROPUCHA GROUP
  </div>

  <div class="tabs">

    <button class="tab active"
      onclick="showTab('network',this)">
      🏪 Sieć
    </button>

    <button class="tab"
      onclick="showTab('office',this)">
      🏢 Centrala
    </button>

    <button class="tab"
      onclick="showTab('companies',this)">
      📈 Firmy
    </button>

    <button class="tab"
      onclick="showTab('logistics',this)">
      🚛 Logistyka
    </button>

    <button class="tab"
      onclick="showTab('rnd',this)">
      🧪 R&D
    </button>

    <button class="tab"
      onclick="showTab('finance',this)">
      💰 Finanse
    </button>

  </div>

  <div id="network" class="panel active"></div>
  <div id="office" class="panel"></div>
  <div id="companies" class="panel"></div>
  <div id="logistics" class="panel"></div>
  <div id="rnd" class="panel"></div>
  <div id="finance" class="panel"></div>

</div>

<div id="buildInfo">
  Kliknij miejsce na mapie • ESC = anuluj
</div>

<div id="notifications"></div>

<div id="modalBackground">
  <div id="modal"></div>
</div>

<!-- DEV CONSOLE -->

<div id="console">

  <div id="consoleHeader">
    🛠 ROPUCHA DEV CONSOLE — ~ zamknij
  </div>

  <div id="consoleHistory">
Wpisz help aby zobaczyć komendy.
  </div>

  <div id="consoleInputBox">

    <span>&gt;</span>

    <input
      id="consoleInput"
      autocomplete="off"
      spellcheck="false"
      placeholder="komenda..."
    >

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   GAME STATE
========================================================= */

let money = 0;
let day = 1;

let buildMode = null;

let maxOfficeStaff = 5;
let maxFranchisees = 3;
let maxDrivers = 3;

let franchisees = [];
let stores = [];
let centers = [];
let drivers = [];
let trucks = [];
let routes = [];

let nextStoreId = 1;
let nextCenterId = 1;
let nextDriverId = 1;
let nextTruckId = 1;
let nextRouteId = 1;

let totalDividends = 0;
let totalStoreIncome = 0;
let totalExpenses = 0;

const firstNames = [
  "Adam","Marek","Kamil","Julia",
  "Ola","Natalia","Karolina",
  "Michał","Patryk","Bartek"
];

const lastNames = [
  "Nowak","Kowalski","Lis",
  "Król","Mazur","Wójcik",
  "Zieliński","Kaczmarek"
];

/* =========================================================
   MAP — SHARP ZOOM
========================================================= */

const map = L.map("map",{

  zoomControl:true,

  /*
    Wyłączenie skalowania starego obrazu
    podczas animacji zoomu.
  */

  zoomAnimation:false,
  fadeAnimation:false,
  markerZoomAnimation:false,

  zoomSnap:1,
  zoomDelta:1,

  wheelPxPerZoomLevel:100,

  minZoom:5,
  maxZoom:19

}).setView(
  [52.1,19.4],
  6
);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    minZoom:5,
    maxZoom:19,
    maxNativeZoom:19,

    tileSize:256,
    zoomOffset:0,

    keepBuffer:4,

    attribution:
      "&copy; OpenStreetMap contributors"
  }
).addTo(map);

/* =========================================================
   ICONS
========================================================= */

function createIcon(emoji,type){

  return L.divIcon({

    className:"",

    html:
      `<div class="marker ${type}">
        ${emoji}
      </div>`,

    iconSize:[36,36],

    iconAnchor:[18,18]

  });
}

const icons = {

  store:
    createIcon(
      "🏪",
      "storeMarker"
    ),

  center:
    createIcon(
      "📦",
      "centerMarker"
    ),

  factory:
    createIcon(
      "🏭",
      "factoryMarker"
    ),

  hq:
    createIcon(
      "🏢",
      "hqMarker"
    )
};

/* =========================================================
   HQ
========================================================= */

L.marker(
  [52.2297,21.0122],
  {icon:icons.hq}
)
.addTo(map)
.bindPopup(`
  <b>🐸 CENTRALA ROPUCHA GROUP</b>
  <br><br>
  Warszawa
  <br>
  📢 Marketing
  <br>
  👥 HR
  <br>
  ⚖️ Prawo
  <br>
  🚚 Logistyka
  <br>
  🧪 R&D
`);

/* =========================================================
   PRODUCERS
========================================================= */

const companies = [

  {
    id:"bulapol",
    name:"🥖 BułaPol",
    product:"Bułki",
    valuation:2400000,
    profit:22000,
    shares:0,
    production:120000,
    capacity:160000,
    controlled:false,
    acquired:false,
    lat:52.40,
    lng:16.92
  },

  {
    id:"hotbula",
    name:"🌭 HotBuła",
    product:"Bułki hot-dog",
    valuation:4800000,
    profit:38000,
    shares:0,
    production:85000,
    capacity:110000,
    controlled:false,
    acquired:false,
    lat:51.76,
    lng:19.46
  },

  {
    id:"pizza",
    name:"🍕 PizzaMax Foods",
    product:"Pizza",
    valuation:8500000,
    profit:72000,
    shares:0,
    production:45000,
    capacity:65000,
    controlled:false,
    acquired:false,
    lat:50.06,
    lng:19.94
  },

  {
    id:"fresh",
    name:"🥪 FreshBox",
    product:"Kanapki",
    valuation:6200000,
    profit:51000,
    shares:0,
    production:70000,
    capacity:95000,
    controlled:false,
    acquired:false,
    lat:51.11,
    lng:17.03
  },

  {
    id:"meat",
    name:"🌭 MięsPol",
    product:"Parówki",
    valuation:10500000,
    profit:88000,
    shares:0,
    production:100000,
    capacity:145000,
    controlled:false,
    acquired:false,
    lat:53.13,
    lng:23.16
  },

  {
    id:"coffee",
    name:"☕ CoffeeWorks",
    product:"Kawa",
    valuation:12800000,
    profit:105000,
    shares:0,
    production:60000,
    capacity:90000,
    controlled:false,
    acquired:false,
    lat:54.35,
    lng:18.65
  }

];

companies.forEach(company=>{

  company.marker =
    L.marker(
      [company.lat,company.lng],
      {icon:icons.factory}
    )
    .addTo(map);

  updateCompanyPopup(company);

});

function updateCompanyPopup(company){

  company.marker.bindPopup(`

    <b>${company.name}</b>

    <br><br>

    Produkt:
    ${company.product}

    <br>

    Twoje udziały:
    ${company.shares}%

    <br>

    Produkcja:
    ${number(company.production)}
    /
    ${number(company.capacity)}

  `);
}

/* =========================================================
   OFFICE
========================================================= */

const departments = {

  marketing:{
    name:"📢 Marketing",
    level:1,
    employees:[],
    salary:350
  },

  legal:{
    name:"⚖️ Prawo",
    level:1,
    employees:[],
    salary:450
  },

  hr:{
    name:"👥 HR",
    level:1,
    employees:[],
    salary:320
  },

  logistics:{
    name:"🚚 Logistyka",
    level:1,
    employees:[],
    salary:380
  },

  rnd:{
    name:"🧪 R&D / Testerzy",
    level:1,
    employees:[],
    salary:480
  }

};

const perks = [

  {
    name:"⭐ Utalentowany",
    bonus:.15
  },

  {
    name:"🧠 Ekspert",
    bonus:.25
  },

  {
    name:"⚡ Szybki",
    bonus:.12
  },

  {
    name:"🎯 Dokładny",
    bonus:.18
  },

  {
    name:"🤝 Lider",
    bonus:.20
  }

];

function getOfficeStaffCount(){

  return Object
    .values(departments)
    .reduce(
      (sum,dep)=>
        sum+
        dep.employees.length,
      0
    );
}

function hireOfficeEmployee(type){

  if(
    getOfficeStaffCount() >=
    maxOfficeStaff
  ){

    notify(
      "❌ Limit pracowników centrali."
    );

    return;
  }

  const dep =
    departments[type];

  const cost=2500;

  if(money<cost){

    notify(
      "❌ Brakuje pieniędzy."
    );

    return;
  }

  changeMoney(-cost);

  const perk =
    perks[
      random(
        0,
        perks.length-1
      )
    ];

  dep.employees.push({

    name:randomName(),

    perk,

    salary:
      dep.salary+
      random(0,120)

  });

  notify(
    "👔 Zatrudniono pracownika."
  );

  render();
}

function upgradeDepartment(type){

  const dep =
    departments[type];

  const cost =
    Math.floor(
      5000*
      Math.pow(
        1.18,
        dep.level-1
      )
    );

  if(money<cost){

    notify(
      "❌ Brakuje pieniędzy."
    );

    return;
  }

  changeMoney(-cost);

  dep.level++;

  render();
}

/* =========================================================
   FRANCHISE
========================================================= */

function recruitFranchisee(){

  if(
    franchisees.length >=
    maxFranchisees
  ){

    notify(
      "❌ Limit franczyzobiorców."
    );

    return;
  }

  const cost=5000;

  if(money<cost){

    notify(
      "❌ Brakuje pieniędzy."
    );

    return;
  }

  changeMoney(-cost);

  franchisees.push({

    id:Date.now(),

    name:randomName(),

    stores:[],

    recruitmentSkill:
      random(1,5)

  });

  notify(
    "🤝 Nowy franczyzobiorca."
  );

  render();
}

/* =========================================================
   STORES
========================================================= */

function getStorePrice(){

  return (
    120000+
    stores.length*15000
  );
}

function startStoreBuild(){

  if(franchisees.length===0){

    notify(
      "❌ Najpierw potrzebujesz franczyzobiorcy."
    );

    return;
  }

  if(money<getStorePrice()){

    notify(
      "❌ Brakuje pieniędzy."
    );

    return;
  }

  buildMode="store";

  showBuildInfo();
}

function createStore(lat,lng){

  const price =
    getStorePrice();

  if(money<price){
    return;
  }

  changeMoney(-price);

  const franchisee =
    franchisees
      .slice()
      .sort(
        (a,b)=>
          a.stores.length-
          b.stores.length
      )[0];

  const store={

    id:nextStoreId++,

    lat,
    lng,

    workers:random(2,4),

    stock:100,

    baseIncome:
      random(5000,9000),

    franchiseeId:
      franchisee.id,

    marker:null

  };

  stores.push(store);

  franchisee.stores.push(
    store.id
  );

  store.marker =
    L.marker(
      [lat,lng],
      {icon:icons.store}
    )
    .addTo(map);

  updateStorePopup(store);

  notify(
    "🏪 Otwarto sklep #"+
    store.id
  );

  render();
}

function updateStorePopup(store){

  const franchisee =
    franchisees.find(
      f=>
        f.id===
        store.franchiseeId
    );

  store.marker.bindPopup(`

    <b>
      🐸 Ropucha #${store.id}
    </b>

    <br><br>

    Franczyzobiorca:
    ${
      franchisee
      ?franchisee.name
      :"brak"
    }

    <br>

    Pracownicy:
    ${store.workers}

    <br>

    Towar:
    ${Math.round(store.stock)}%

  `);
}

/* =========================================================
   LOGISTICS CENTERS
========================================================= */

function getCenterPrice(){

  return (
    750000+
    centers.length*250000
  );
}

function startCenterBuild(){

  if(money<getCenterPrice()){

    notify(
      "❌ Brakuje pieniędzy."
    );

    return;
  }

  buildMode="center";

  showBuildInfo();
}

function createCenter(lat,lng){

  const price =
    getCenterPrice();

  if(money<price){
    return;
  }

  changeMoney(-price);

  const center={

    id:nextCenterId++,

    lat,
    lng,

    level:1,

    capacity:25000,

    drivers:[],

    trucks:[],

    routes:[],

    marker:null

  };

  centers.push(center);

  center.marker =
    L.marker(
      [lat,lng],
      {icon:icons.center}
    )
    .addTo(map);

  updateCenterPopup(center);

  notify(
    "📦 Centrum logistyczne #"+
    center.id
  );

  render();
}

function updateCenterPopup(center){

  center.marker.bindPopup(`

    <b>
      📦 Centrum #${center.id}
    </b>

    <br><br>

    Poziom:
    ${center.level}

    <br>

    Kierowcy:
    ${center.drivers.length}

    <br>

    Ciężarówki:
    ${center.trucks.length}

    <br>

    Trasy:
    ${center.routes.length}

  `);
}

/* =========================================================
   DRIVERS
========================================================= */

function hireDriver(){

  if(
    drivers.length>=
    maxDrivers
  ){

    notify(
      "❌ Limit kierowców."
    );

    return;
  }

  if(money<4000){

    notify(
      "❌ Brakuje pieniędzy."
    );

    return;
  }

  changeMoney(-4000);

  drivers.push({

    id:nextDriverId++,

    name:randomName(),

    salary:
      random(350,520),

    centerId:null,

    truckId:null,

    routeId:null

  });

  notify(
    "👷 Zatrudniono kierowcę."
  );

  render();
}

function assignDriver(
  driverId,
  centerId
){

  const driver =
    drivers.find(
      d=>d.id===driverId
    );

  if(!driver){
    return;
  }

  centers.forEach(center=>{

      center.drivers.filter(
        id=>id!==driverId

  if(!centerId){

    return;

  const center =
    centers.find(
      c=>c.id===centerId
    );

  if(!center){
    return;
  }

  driver.centerId =
    center.id;

  center.drivers.push(
    driver.id
  );

  updateCenterPopup(center);

  render();
}

========================================================= */

function createRoute(centerId){

  const center =
    centers.find(
      c=>c.id===centerId
    );

  if(!center){
    return;
  }

  const driver =
    drivers.find(
      d=>
        d.centerId===centerId &&
        !d.routeId
    );

  const truck =
    trucks.find(
      t=>
        t.centerId===centerId &&
        !t.routeId
    );

  const store =
    stores.find(
      s=>
        !routes.some(
          r=>
            r.storeId===
            s.id
        )
    );

  if(!driver){

    notify(
      "❌ Brak wolnego kierowcy."
    );

    return;
  }

  if(!truck){

    notify(
      "❌ Brak wolnej ciężarówki."
    );

    return;
  }

  if(!store){

    notify(
      "❌ Brak sklepu bez trasy."
    );

    return;
  }

  const route={

    id:nextRouteId++,

    centerId,

    driverId:
      driver.id,

    truckId:
      truck.id,

    storeId:
      store.id,

    line:null

  };

  driver.routeId =
    route.id;

  driver.truckId =
    truck.id;

  truck.routeId =
    route.id;

  truck.driverId =
    driver.id;

  center.routes.push(
    route.id
  );

  route.line =
    L.polyline(
      [
        [
          center.lat,
          center.lng
        ],

        [
          store.lat,
          store.lng
        ]
      ],
      {
        color:"#2673d9",
        weight:4,
        opacity:.75
      }
    )
    .addTo(map);

  routes.push(route);

  updateCenterPopup(center);

  notify(
    "🗺️ Trasa #"+
    route.id+
    " → sklep #"+
    store.id
  );

  render();
}

/* =========================================================
   SHARES
========================================================= */

function getSharePrice(
  company,
  percent
){

  const base =
    company.valuation*
    percent/100;

  const premium =
    1+
    company.shares/
    100*.35;

  return Math.floor(
    base*premium
  );
}

function buyShares(
  companyId,
  percent
){

  const company =
    companies.find(
      c=>c.id===companyId
    );

  if(!company){
    return;
  }

  percent =
    Math.min(
      percent,
      100-company.shares
    );

  if(percent<=0){
    return;
  }

  const cost =
    getSharePrice(
      company,
      percent
    );

  if(money<cost){

    notify(
      "❌ Pakiet kosztuje "+
      moneyText(cost)
    );

    return;
  }

  changeMoney(-cost);

  company.shares +=
    percent;

  if(
    company.shares>50 &&
    !company.controlled
  ){

    company.controlled=true;

    notify(
      "🏢 Masz większość w "+
      company.name
    );
  }

  if(
    company.shares>=100
  ){

    company.shares=100;

    company.acquired=true;

    company.controlled=true;

    notify(
      "👑 Przejęto "+
      company.name
    );
  }

  updateCompanyPopup(
    company
  );

  render();
}

function upgradeFactory(id){

  const company =
    companies.find(
      c=>c.id===id
    );

  if(!company){
    return;
  }

  const cost =
    Math.floor(
      company.valuation*
      .08
    );

  if(money<cost){

    notify(
      "❌ Brakuje pieniędzy."
    );

    return;
  }

  changeMoney(-cost);

  company.capacity =
    Math.floor(
      company.capacity*
      1.15
    );

  company.production =
    Math.floor(
      company.production*
      1.12
    );

  company.profit =
    Math.floor(
      company.profit*
      1.08
    );

  company.valuation =
    Math.floor(
      company.valuation*
      1.06
    );

  notify(
    "🏭 Rozbudowano fabrykę."
  );

  manageCompany(id);

  render();
}

function takeoverCompany(id){

  const company =
    companies.find(
      c=>c.id===id
    );

  if(
    !company ||
    company.shares<=50 ||
    company.shares>=100
  ){
    return;
  }

  const remaining =
    100-
    company.shares;

  const normalValue =
    company.valuation*
    remaining/100;

  const legalPower =
    departments.legal.level+
    departments.legal.employees.length*2;

  const discount =
    Math.min(
      legalPower*.002,
      .20
    );

  const price =
    Math.floor(
      normalValue*
      (1.25-discount)
    );

  if(money<price){

    notify(
      "❌ Przejęcie kosztuje "+
      moneyText(price)
    );

    return;
  }

  changeMoney(-price);

  company.shares=100;
  company.controlled=true;
  company.acquired=true;

  updateCompanyPopup(
    company
  );

  notify(
    "👑 PEŁNE PRZEJĘCIE: "+
    company.name
  );

  closeModal();

  render();
}

const researchProjects = [

  {
    id:"sandwich",
    name:"🥪 Nowe kanapki",
    required:100,
    progress:0,
    state:"available",
    bonus:.08
  },

  {

    required:200,
    progress:0,
    state:"available",
    bonus:.12
  },

  {
    id:"coffee",
    name:"☕ Kawa premium",
    required:300,
    progress:0,
    state:"available",
    bonus:.15
  },

  {
    id:"checkout",
    name:"🤖 Kasy samoobsługowe",
    required:500,
    progress:0,
    state:"available",
    bonus:.20
  }

];

let activeResearch=null;
let researchBonus=0;

function startResearch(id){

  if(activeResearch){

    notify(
      "❌ R&D już prowadzi projekt."
    );

    return;
  }

  const project =
    researchProjects.find(
      p=>p.id===id
    );

  if(
    !project ||
    project.state==="done"
  ){
    return;
  }

  project.state =
    "research";

  activeResearch =
    project.id;

  notify(
    "🧪 Rozpoczęto "+
    project.name
  );

  render();
}

function processResearch(){

  if(!activeResearch){
    return;
  }

  const project =
    researchProjects.find(
      p=>
        p.id===
        activeResearch
    );

  const dep =
    departments.rnd;

  let points =
    5+
    dep.level*2;

  dep.employees.forEach(
    employee=>{

      points +=
        5*
        (
          1+
          employee.perk.bonus
        );

    }
  );

  project.progress +=
    points;

  if(
    project.progress>=
    project.required
  ){

    project.progress =
      project.required;

    project.state =
      "done";

    researchBonus +=
      project.bonus;

    activeResearch=null;

    notify(
      "🎉 WDROŻONO: "+
      project.name
    );
  }
}

/* =========================================================
   ECONOMY
========================================================= */

function processDay(){

  day++;

  processResearch();

  let storeIncome=0;

  stores.forEach(store=>{

    const hasRoute =
      routes.some(
        r=>
          r.storeId===
          store.id
      );

    if(hasRoute){

      store.stock =
        Math.min(
          100,
          store.stock+30
        );

    }else{

      store.stock -=
        12;
    }

    store.stock =
      Math.max(
        0,
        store.stock
      );

    let income =
      store.baseIncome*
      (
        store.stock/100
      );

    income *=
      1+
      researchBonus;

    income *=
      1+
      departments.marketing.level*
      .01;

    storeIncome +=
      income;

    updateStorePopup(
      store
    );
  });

  storeIncome =
    Math.floor(
      storeIncome
    );

  let dividends=0;

  companies.forEach(
    company=>{

      if(
        company.shares<=0
      ){
        return;
      }

      dividends +=
        company.profit*
        company.shares/100;

    }
  );

  dividends =
    Math.floor(
      dividends
    );

  let expenses=0;

  Object.values(
    departments
  ).forEach(dep=>{

    dep.employees.forEach(
      employee=>{

        expenses +=
          employee.salary;

      }
    );

  });

  drivers.forEach(
    driver=>{

      expenses +=
        driver.salary;

    }
  );

  expenses +=
    trucks.length*250;

  expenses +=
    routes.length*180;

  totalStoreIncome +=
    storeIncome;

  totalDividends +=
    dividends;

  totalExpenses +=
    expenses;

  changeMoney(
    storeIncome+
    dividends,
    false
  );

  changeMoney(
    -expenses,
    false
  );

  notify(
    "📊 Dzień "+
    day+
    ": sklepy +"+
    moneyText(storeIncome)+
    " | dywidendy +"+
    moneyText(dividends)+
    " | koszty -"+
    moneyText(expenses)
  );

  render();
}

            <b>
              ${Math.round(
                project.progress
              )}
              /
              ${project.required}
            </b>

          </div>

          <div class="progress">

            <div
              class="progressFill"
              style="
                width:
                ${
                  Math.min(
                    100,
                    project.progress/
                    project.required*
                    100
                  )
                }%
              ">
            </div>

          </div>

          ${
            project.state===
            "done"
            ?`

            <b
              style="
                color:#65e875
              ">
              ✓ WDROŻONO
            </b>

            `
            :`

            <button
              class="btn blue"

              ${
                activeResearch
                ?"disabled"
                :""
              }

              onclick="
                startResearch(
                  '${project.id}'
                )
              ">

              🔬 Rozpocznij

            </button>

            `
          }

        </div>

      `
      ).join("")
    }

  `;
}

/* =========================================================
   TABS
========================================================= */

function showTab(
  id,
  button
){

  document
    .querySelectorAll(
      ".panel"
    )
    .forEach(
      panel=>
        panel.classList.remove(
          "active"
        )
    );

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      tab=>
        tab.classList.remove(
          "active"
        )
    );

  document
    .getElementById(id)
    .classList.add(
      "active"
    );

  button.classList.add(
    "active"
  );
}

/* =========================================================
   MODAL
========================================================= */

function openModal(html){

  document.getElementById(
    "modal"
  ).innerHTML=
    html;

  document.getElementById(
    "modalBackground"
  ).style.display=
    "flex";
}

function closeModal(){

  document.getElementById(
    "modalBackground"
  ).style.display=

}

/* =========================================================
   MONEY
========================================================= */

function changeMoney(
  amount,
  animate=true
){

  money += amount;

  if(animate){

    const fx =
      document.createElement(
        "div"
      );

    fx.className =
      "moneyFx "+
      (
        amount>=0
        ?"plus"
        :"minus"
      );

    fx.textContent =
      (
        amount>=0
        ?"+"
        :""
      )+
      moneyText(amount);

    document.body.appendChild(
      fx
    );

    setTimeout(
      ()=>fx.remove(),
      1500
    );
  }

  document.getElementById(
    "money"
  ).textContent=
    moneyText(money);
}

/* =========================================================
   NOTIFICATIONS
========================================================= */

function notify(text){

  const div =
    document.createElement(
      "div"
    );

  div.className=
    "notification";

  div.textContent=
    text;

  document
    .getElementById(
      "notifications"
    )
    .appendChild(div);

  setTimeout(
    ()=>div.remove(),
    4000
  );
}

/* =========================================================
   DEV CONSOLE
========================================================= */

const devConsole =
  document.getElementById(
    "console"
  );

const consoleInput =
  document.getElementById(
    "consoleInput"
  );

const consoleHistory =
  document.getElementById(
    "consoleHistory"
  );

let consoleOpen=false;

window.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="`" ||
      event.key==="~"
    ){

      event.preventDefault();

      consoleOpen =
        !consoleOpen;

      devConsole.style.display =
        consoleOpen
        ?"block"
        :"none";

      if(consoleOpen){

        setTimeout(
          ()=>consoleInput.focus(),
          20
        );
      }

      return;
    }

    if(
      event.key==="Escape"
    ){

      if(consoleOpen){

        consoleOpen=false;

        devConsole.style.display=
          "none";

        return;
      }

      buildMode=null;

      hideBuildInfo();
    }

  }
);

consoleInput.addEventListener(
  "keydown",
  event=>{

    if(
      event.key!=="Enter"
    ){
      return;
    }

    const command =
      consoleInput.value.trim();

    consoleInput.value="";

    if(!command){
      return;
    }

    consolePrint(
      "> "+command,
      "#fff"
    );

    executeCommand(
      command
    );
  }
);

function consolePrint(
  text,
  color="#bacabd"
){

  const line =
    document.createElement(
      "div"
    );

  line.textContent=text;

  line.style.color=color;

  consoleHistory.appendChild(
    line
  );

  consoleHistory.scrollTop =
    consoleHistory.scrollHeight;
}

function executeCommand(
  command
){

  const parts =
    command
      .split(/\s+/);

  const name =
    parts[0]
      .toLowerCase();

  const value =
    Number(
      parts[1]
    );

  if(name==="help"){

    consolePrint(
`KOMENDY:

kasa [kwota]
maxstaff [liczba]
maxfranczyzobiorcy [liczba]
maxkierowcy [liczba]
status
clear`
    );

    return;
  }

  if(name==="kasa"){

    if(!validNumber(value)){

      consolePrint(
        "Użycie: kasa [kwota]",
        "#ff6969"
      );

      return;
    }

    money=value;

    render();

    consolePrint(
      "Kasa: "+
      moneyText(money),
      "#6cff7a"
    );

    return;
  }

  if(name==="maxstaff"){

    if(!validLimit(value)){
      return;
    }

    maxOfficeStaff =
      Math.floor(value);

    render();

    consolePrint(
      "MAX STAFF = "+
      maxOfficeStaff,
      "#6cff7a"
    );

    return;
  }

  if(
    name===
    "maxfranczyzobiorcy"
  ){

    if(!validLimit(value)){
      return;
    }

    maxFranchisees =
      Math.floor(value);

    render();

    consolePrint(
      "MAX FRANCZYZA = "+
      maxFranchisees,
      "#6cff7a"
    );

    return;
  }

  if(name==="maxkierowcy"){

    if(!validLimit(value)){
      return;
    }

    maxDrivers =
      Math.floor(value);

    render();

    consolePrint(
      "MAX KIEROWCY = "+
      maxDrivers,
      "#6cff7a"
    );

    return;
  }

  if(name==="status"){

    consolePrint(
`Kasa:
${moneyText(money)}

Biuro:
${getOfficeStaffCount()} / ${maxOfficeStaff}

Franczyzobiorcy:
${franchisees.length} / ${maxFranchisees}

Kierowcy:
${drivers.length} / ${maxDrivers}

Sklepy:
${stores.length}

Centra:
${centers.length}

Ciężarówki:
${trucks.length}`
    );

    return;
  }

  if(name==="clear"){

    consoleHistory.innerHTML="";

    return;
  }

  consolePrint(
    "Nieznana komenda. Wpisz help.",
    "#ff6969"
  );
}

function validNumber(value){

  return (
    Number.isFinite(value) &&
    value>=0
  );
}

function validLimit(value){

  if(
    !Number.isFinite(value) ||
    value<0 ||
    value>100000
  ){

    consolePrint(
      "Nieprawidłowa liczba.",
      "#ff6969"
    );

    return false;
  }

  return true;
}

/* =========================================================
   UTILS
========================================================= */

function random(
  min,
  max
){

  return Math.floor(
    Math.random()*
    (
      max-min+1
    )
  )+min;
}

function randomName(){

  return (
    firstNames[
      random(
        0,
        firstNames.length-1
      )
    ]
    +" "+
    lastNames[
      random(
        0,
        lastNames.length-1
      )
    ]
  );
}

function moneyText(value){

  return Math.round(
    value
  )
  .toLocaleString(
    "pl-PL"
  )
  +" zł";
}

function number(value){

  return Math.round(
    value
  )
  .toLocaleString(
    "pl-PL"
  );
}
