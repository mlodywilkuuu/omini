
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Władca Narodów | Gra strategiczna</title>

<style>
:root {
  --gold: #f6d38a;
  --gold-dark: #bd8c42;
  --white: #f5f7ff;
  --muted: #a9b8d1;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  font-family: "Segoe UI", Arial, sans-serif;
  color: var(--white);
  background: #080d20;
  overflow-x: hidden;
}

/* ANIMOWANY GRADIENT TŁA */

.background {
  position: fixed;
  inset: 0;
  z-index: -3;
  background: linear-gradient(
    125deg,
    #080d20,
    #152d54,
    #32214f,
    #092e43,
    #080d20
  );
  background-size: 400% 400%;
  animation: gradientMove 18s ease infinite;
}

@keyframes gradientMove {
  0%, 100% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
}

/* ŚWIECĄCE KULE */

.orb {
  position: fixed;
  z-index: -2;
  border-radius: 50%;
  filter: blur(75px);
  opacity: 0.45;
  pointer-events: none;
  animation: floating 12s ease-in-out infinite;
}

.orb1 {
  width: 450px;
  height: 450px;
  top: -160px;
  left: -150px;
  background: #537cff;
}

.orb2 {
  width: 420px;
  height: 420px;
  bottom: -170px;
  right: -130px;
  background: #a74cff;
  animation-delay: -5s;
}

.orb3 {
  width: 280px;
  height: 280px;
  top: 35%;
  left: 45%;
  background: #d8a54b;
  opacity: 0.2;
  animation-delay: -8s;
}

@keyframes floating {
  0%, 100% {
    transform: translate(0, 0);
  }
  50% {
    transform: translate(40px, -50px);
  }
}

/* DELIKATNA SIATKA */

.grid-background {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    linear-gradient(#ffffff08 1px, transparent 1px),
    linear-gradient(90deg, #ffffff08 1px, transparent 1px);
  background-size: 55px 55px;
  mask-image: linear-gradient(
    to bottom,
    transparent,
    black,
    transparent
  );
}

/* GŁÓWNY EKRAN */

.page {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 18px;
}

/* SZKLANY PANEL */

.glass {
  position: relative;
  width: 100%;
  max-width: 510px;
  padding: 45px 38px;
  text-align: center;

  background: rgba(255, 255, 255, 0.07);

  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);

  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 28px;

  box-shadow:
    0 25px 90px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255,255,255,0.2);

  animation: panelAppear 1s ease both;
}

@keyframes panelAppear {
  from {
    opacity: 0;
    transform: translateY(40px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* KORONA */

.crown {
  font-size: 60px;
  color: var(--gold);
  margin-bottom: 18px;
  text-shadow: 0 0 35px #f6d38a88;
  animation: crownFloat 4s ease-in-out infinite;
}

@keyframes crownFloat {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}

/* NAZWA GRY */

h1 {
  font-size: clamp(30px, 6vw, 43px);
  font-weight: 800;
  letter-spacing: 2px;

  background: linear-gradient(
    90deg,
    #fff3cb,
    #d8a54b,
    #ffffff,
    #d8a54b,
    #fff3cb
  );

  background-size: 250%;
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;

  animation: goldShine 6s linear infinite;
}

@keyframes goldShine {
  to {
    background-position: 250%;
  }
}

.subtitle {
  margin-top: 16px;
  margin-bottom: 32px;
  font-size: 14px;
  color: var(--muted);
  line-height: 1.8;
}

/* OZDOBNA LINIA */

.divider {
  width: 110px;
  height: 2px;
  margin: 0 auto 30px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--gold),
    transparent
  );
  box-shadow: 0 0 15px #f6d38a88;
}

/* PRZYCISKI */

.menu-btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  width: 100%;
  min-height: 55px;
  margin: 13px 0;
  padding: 15px 20px;

  color: white;
  font-family: inherit;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.7px;

  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 14px;

  cursor: pointer;
  overflow: hidden;

  transition:
    transform 0.3s,
    background 0.3s,
    box-shadow 0.3s,
    border-color 0.3s;
}

.menu-btn:hover {
  transform: translateY(-4px);
  background: rgba(255,255,255,0.17);
  border-color: rgba(255,255,255,0.45);
  box-shadow: 0 12px 35px #0005;
}

.menu-btn:active {
  transform: scale(0.97);
}

.menu-btn:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

/* ZŁOTY PRZYCISK NOWA GRA */

.primary {
  color: #171822;
  font-weight: 800;

  background: linear-gradient(
    120deg,
    #bd8c42,
    #ffe6aa,
    #d7a54c,
    #ffe6aa
  );

  background-size: 250%;
  border: 1px solid #f6d38a;

  box-shadow: 0 8px 35px #d6a34c44;

  animation: goldShine 6s linear infinite;
}

.primary:hover {
  background: linear-gradient(
    120deg,
    #e4b45f,
    #fff0c6,
    #e4b45f
  );
  box-shadow: 0 12px 45px #e9ba6488;
}

/* BŁYSK NA PRZYCISKACH */

.menu-btn::after {
  content: "";
  position: absolute;
  top: 0;
  left: -130%;
  width: 60%;
  height: 100%;

  transform: skewX(-25deg);

  background: linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,0.35),
    transparent
  );

  transition: left 0.7s;
}

.menu-btn:hover::after {
  left: 150%;
}

/* STOPKA */

.footer {
  margin-top: 30px;
  font-size: 11px;
  letter-spacing: 1.5px;
  color: #91a1ba;
}

.version {
  margin-top: 9px;
  color: #697b98;
  font-size: 11px;
}

/* TELEFONY */

@media (max-width: 500px) {
  .glass {
    padding: 35px 23px;
  }

  .crown {
    font-size: 48px;
  }

  .menu-btn {
    min-height: 52px;
  }

  .orb {
    opacity: 0.3;
  }
}

/* OGRANICZENIE ANIMACJI */

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<!-- TŁO -->
<div class="background"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="grid-background"></div>

<!-- MENU GŁÓWNE -->
<main class="page">

  <section class="glass">

    <div class="crown">♛</div>

    <h1>WŁADCA<br>NARODÓW</h1>

    <p class="subtitle">
      Każda decyzja zmienia historię.<br>
      Zbuduj potęgę swojego państwa.
    </p>

    <div class="divider"></div>

    <!-- NOWA GRA -->
    <button
      class="menu-btn primary"
      onclick="goTo('nowa-gra.html')">
      ✦ NOWA GRA
    </button>

    <!-- WCZYTAJ GRĘ -->
    <button
      class="menu-btn"
      onclick="goTo('wczytaj.html')">
      ◈ KONTYNUUJ GRĘ
    </button>

    <!-- USTAWIENIA -->
    <button
      class="menu-btn"
      onclick="goTo('ustawienia.html')">
      ⚙ USTAWIENIA
    </button>

    <!-- O GRZE -->
    <button
      class="menu-btn"
      onclick="goTo('o-grze.html')">
      ⓘ O GRZE
    </button>

    <div class="footer">
      STRATEGIA • POLITYKA • GOSPODARKA
    </div>

    <div class="version">
      WERSJA ALPHA 0.1
    </div>

  </section>

</main>

<script>

/* PRZECHODZENIE DO INNYCH EKRANÓW */

function goTo(page) {
  window.location.href = page;
}

</script>

</body>
</html>
