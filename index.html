        // Rozszerzenia stanu gry (kompatybilne także ze starszym zapisem).
        function uzupelnijStan() {
            stan.sezon = stan.sezon || 1;
            stan.historiaSezonow = stan.historiaSezonow || [];
            stan.puchar = stan.puchar || { runda: 1, aktywny: true, uczestnicy: [], historia: [], zwyciezca: null };
            stan.ostatnieWydarzenie = stan.ostatnieWydarzenie || 'Brak';
            stan.europa = stan.europa || {
                sezon: stan.sezon,
                rozgrywki: {
                    LM: { nazwa: 'Liga Mistrzów', kod: 'LM', etap: 0, aktywni: [], historia: [], zwyciezca: null },
                    LE: { nazwa: 'Liga Europy', kod: 'LE', etap: 0, aktywni: [], historia: [], zwyciezca: null },
                    LK: { nazwa: 'Liga Konferencji', kod: 'LK', etap: 0, aktywni: [], historia: [], zwyciezca: null }
                }
            };
            if (!stan.europa.rozgrywki) stan.europa.rozgrywki = {};
            ['LM','LE','LK'].forEach(kod => {
                const nazwy = {LM:'Liga Mistrzów', LE:'Liga Europy', LK:'Liga Konferencji'};
                stan.europa.rozgrywki[kod] = stan.europa.rozgrywki[kod] || { nazwa:nazwy[kod], kod, etap:0, aktywni:[], oczekujacy:[], historia:[], zwyciezca:null };
                stan.europa.rozgrywki[kod].aktywni = stan.europa.rozgrywki[kod].aktywni || [];
                stan.europa.rozgrywki[kod].oczekujacy = stan.europa.rozgrywki[kod].oczekujacy || [];
                stan.europa.rozgrywki[kod].historia = stan.europa.rozgrywki[kod].historia || [];
            });
            const brakHistoriiEuropy = ['LM','LE','LK'].every(kod => stan.europa.rozgrywki[kod].aktywni.length === 0 && stan.europa.rozgrywki[kod].historia.length === 0 && !stan.europa.rozgrywki[kod].zwyciezca);
            if (stan.sezon === 1 && brakHistoriiEuropy) {
                // Startowa obsada pierwszego sezonu według nowych rund kwalifikacyjnych.
                stan.europa.rozgrywki.LM.etap = 1;
                stan.europa.rozgrywki.LM.aktywni = ['Śląsk Wrocław'].filter(n => stan.kluby[n]);
                stan.europa.rozgrywki.LM.oczekujacy = [{klub:'Jagiellonia Białystok', startEtap:3, zrodlo:'Mistrz — IV runda eliminacji'}].filter(w => stan.kluby[w.klub]);
                stan.europa.rozgrywki.LE.etap = 1;
                stan.europa.rozgrywki.LE.aktywni = ['Legia Warszawa'].filter(n => stan.kluby[n]);
                stan.europa.rozgrywki.LE.oczekujacy = [{klub:'Wisła Kraków', startEtap:3, zrodlo:'Puchar Polski — IV runda eliminacji'}].filter(w => stan.kluby[w.klub]);
                stan.europa.rozgrywki.LK.etap = 1;
                stan.europa.rozgrywki.LK.aktywni = ['Pogoń Szczecin'].filter(n => stan.kluby[n]);
            }

            // Zaplecze 3. Ligi — kluby te są poza głównym widokiem, ale walczą o awans do 2. Ligi.
            const zaplecze3Ligi = ['Unia Skierniewice','Rekord Bielsko-Biała','Podhale Nowy Targ','Avia Świdnik','Świt Nowy Dwór Mazowiecki','Star Starachowice','Sokół Kleczew','Legionovia Legionowo'];
            zaplecze3Ligi.forEach((nazwa, i) => {
                if (!stan.kluby[nazwa]) stan.kluby[nazwa] = { punkty:0, bramki_strzelone:0, bramki_stracone:0, budzet:1800000 + i*120000, forma:2 + (i%3), licencja:true, liga:'3. Liga', morale:65, akademia:1, infrastruktura:1, kibice:35 };
            });

            stan.kluby && Object.values(stan.kluby).forEach(k => {
                if (typeof k.morale !== 'number') k.morale = 70;
                if (typeof k.akademia !== 'number') k.akademia = 1;
                if (typeof k.infrastruktura !== 'number') k.infrastruktura = 1;
                if (typeof k.kibice !== 'number') k.kibice = 50;
                if (typeof k.forma !== 'number') k.forma = 3;
            });
            if (!stan.puchar.uczestnicy.length) przygotujPuchar();
        }

        function przygotujPuchar() {
            if (!stan.puchar) stan.puchar = { runda: 1, aktywny: true, uczestnicy: [], historia: [], zwyciezca: null };
            stan.puchar.uczestnicy = Object.keys(stan.kluby).filter(k => stan.kluby[k].licencja);
            for (let i = stan.puchar.uczestnicy.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [stan.puchar.uczestnicy[i], stan.puchar.uczestnicy[j]] = [stan.puchar.uczestnicy[j], stan.puchar.uczestnicy[i]];
            }
            stan.puchar.runda = 1;
            stan.puchar.aktywny = true;
            stan.puchar.historia = [];
            stan.puchar.zwyciezca = null;
        }

        function zmienWidok(widok) {
            stan.aktywnyWidok = widok;
            document.querySelectorAll('aside nav button').forEach(b => {
                b.classList.remove('bg-emerald-600', 'font-semibold');
                b.classList.add('bg-slate-800', 'font-medium');
            });
            let aktywnyBtn = document.getElementById('nav-' + widok);
            if (aktywnyBtn) {
                aktywnyBtn.classList.remove('bg-slate-800', 'font-medium');
                aktywnyBtn.classList.add('bg-emerald-600', 'font-semibold');
            }
            renderujWidok();
        }

        function odswiezUI() {
            document.getElementById('stat-sezon').innerText = stan.sezon;
            document.getElementById('stat-kolejka').innerText = `${stan.kolejka} / 34`;
            document.getElementById('stat-reputacja').innerText = `${stan.reputacja}/100`;
            document.getElementById('stat-budzet').innerText = stan.budzet_centralny.toLocaleString() + " PLN";
            document.getElementById('tytul-ligi').innerText = stan.aktualnaLiga;
            renderujWidok();
        }

        function dodajLog(tekst) {
            stan.logi.unshift(tekst);
            if (stan.logi.length > 25) stan.logi.pop();
        }

        function dodajWydarzenieMeczowe(tekst) {
            stan.meczoweWydarzenia.unshift(tekst);
            if (stan.meczoweWydarzenia.length > 100) stan.meczoweWydarzenia.pop();
        }

        function zmienLige(nowaLiga) {
            stan.aktualnaLiga = nowaLiga;
            renderujWidok();
        }

        function generujParyDlaLigi(nazwaLigi) {
            let kluby = Object.keys(stan.kluby).filter(k => stan.kluby[k].liga === nazwaLigi && stan.kluby[k].licencja);
            let pary = [];
            for (let i = 0; i < kluby.length; i += 2) {
                if (i + 1 < kluby.length) {
                    pary.push([kluby[i], kluby[i+1]]);
                }
            }
            return pary;
        }

        function strefyDlaPozycji(liga, idx, liczba, nazwaKlubu, posortowane) {
            let strefy = [];
            if (liga === 'Ekstraklasa') {
                const zdobywcaPP = stan.puchar && stan.puchar.zwyciezca;
                const top4 = posortowane.slice(0,4).map(x => x[0]);
                const slotPP = zdobywcaPP && top4.includes(zdobywcaPP)
                    ? (posortowane.find(([nazwa]) => !top4.includes(nazwa)) || [null])[0]
                    : zdobywcaPP;

                if (idx === 0) strefy.push({tekst:'IV runda el. Ligi Mistrzów', klasa:'bg-sky-900/60 text-sky-200 border-sky-700', wiersz:'bg-sky-950/25'});
                if (idx === 1) strefy.push({tekst:'II runda el. Ligi Mistrzów', klasa:'bg-cyan-900/60 text-cyan-200 border-cyan-700', wiersz:'bg-cyan-950/20'});
                if (idx === 2) strefy.push({tekst:'II runda el. Ligi Europy', klasa:'bg-orange-900/60 text-orange-200 border-orange-700', wiersz:'bg-orange-950/20'});
                if (idx === 3) strefy.push({tekst:'II runda el. Ligi Konferencji Europy', klasa:'bg-emerald-900/60 text-emerald-200 border-emerald-700', wiersz:'bg-emerald-950/20'});

                if (slotPP && nazwaKlubu === slotPP && !top4.includes(nazwaKlubu)) {
                    strefy.push({tekst: zdobywcaPP === slotPP ? 'IV runda el. Ligi Europy — Puchar Polski' : 'IV runda el. Ligi Europy — slot Pucharu Polski', klasa:'bg-amber-900/60 text-amber-200 border-amber-700', wiersz:'bg-amber-950/20'});
                }
                if (idx >= liczba - 3) strefy.push({tekst:'Spadek do 1. Ligi', klasa:'bg-rose-900/60 text-rose-200 border-rose-700', wiersz:'bg-rose-950/30'});
            } else if (liga === '1. Liga') {
                if (idx < 3) strefy.push({tekst:'Awans do Ekstraklasy', klasa:'bg-emerald-900/60 text-emerald-200 border-emerald-700', wiersz:'bg-emerald-950/20'});
                if (idx >= liczba - 3) strefy.push({tekst:'Spadek do 2. Ligi', klasa:'bg-rose-900/60 text-rose-200 border-rose-700', wiersz:'bg-rose-950/30'});
            } else if (liga === '2. Liga') {
                if (idx < 3) strefy.push({tekst:'Awans do 1. Ligi', klasa:'bg-emerald-900/60 text-emerald-200 border-emerald-700', wiersz:'bg-emerald-950/20'});
                if (idx >= liczba - 3) strefy.push({tekst:'Spadek do 3. Ligi', klasa:'bg-rose-900/60 text-rose-200 border-rose-700', wiersz:'bg-rose-950/30'});
            }
            // Zdobywca Pucharu Polski z niższej ligi wchodzi do IV rundy eliminacji Ligi Europy.
            if (liga !== 'Ekstraklasa' && stan.puchar && stan.puchar.zwyciezca === nazwaKlubu) {
                strefy.unshift({tekst:'IV runda el. Ligi Europy — Puchar Polski', klasa:'bg-amber-900/60 text-amber-200 border-amber-700', wiersz:'bg-amber-950/20'});
            }
            return strefy;
        }

        function legendaStref(liga) {
            if (liga === 'Ekstraklasa') return `
                <div class="flex flex-wrap gap-2 text-[10px]">
                    <span class="px-2 py-1 rounded border bg-sky-900/50 text-sky-200 border-sky-700">Mistrz → IV runda el. Ligi Mistrzów</span>
                    <span class="px-2 py-1 rounded border bg-cyan-900/50 text-cyan-200 border-cyan-700">Wicemistrz → II runda el. Ligi Mistrzów</span>
                    <span class="px-2 py-1 rounded border bg-amber-900/50 text-amber-200 border-amber-700">Puchar Polski → IV runda el. Ligi Europy</span>
                    <span class="px-2 py-1 rounded border bg-orange-900/50 text-orange-200 border-orange-700">3. miejsce → II runda el. Ligi Europy</span>
                    <span class="px-2 py-1 rounded border bg-emerald-900/50 text-emerald-200 border-emerald-700">4. miejsce → II runda el. Ligi Konferencji Europy</span>
                    <span class="px-2 py-1 rounded border bg-rose-900/50 text-rose-200 border-rose-700">3 ostatnie → 1. Liga</span>
                </div>`;
            if (liga === '1. Liga') return `<div class="flex flex-wrap gap-2 text-[10px]"><span class="px-2 py-1 rounded border bg-emerald-900/50 text-emerald-200 border-emerald-700">TOP 3 → Ekstraklasa</span><span class="px-2 py-1 rounded border bg-rose-900/50 text-rose-200 border-rose-700">3 ostatnie → 2. Liga</span></div>`;
            if (liga === '2. Liga') return `<div class="flex flex-wrap gap-2 text-[10px]"><span class="px-2 py-1 rounded border bg-emerald-900/50 text-emerald-200 border-emerald-700">TOP 3 → 1. Liga</span><span class="px-2 py-1 rounded border bg-rose-900/50 text-rose-200 border-rose-700">3 ostatnie → 3. Liga</span></div>`;
            return '';
        }

        function renderujWidok() {
            let kontener = document.getElementById('widok-kontener');
            kontener.innerHTML = '';

            if (stan.aktywnyWidok === 'tabela') {
                let klubyW1Lidze = Object.entries(stan.kluby).filter(([k, d]) => d.liga === stan.aktualnaLiga);
                let posortowane = klubyW1Lidze.sort((a, b) => {
                    if (b[1].punkty !== a[1].punkty) return b[1].punkty - a[1].punkty;
                    let bilansA = a[1].bramki_strzelone - a[1].bramki_stracone;
                    let bilansB = b[1].bramki_strzelone - b[1].bramki_stracone;
                    if (bilansB !== bilansA) return bilansB - bilansA;
                    return b[1].bramki_strzelone - a[1].bramki_strzelone;

                    let bilans = dane.bramki_strzelone - dane.bramki_stracone;

                    let klasaWiersza = strefy.length ? strefy[strefy.length - 1].wiersz : '';
                    return `
                        <tr class="border-b border-slate-800/50 hover:bg-slate-800/40 ${klasaWiersza}">

                                <span class="px-2 py-0.5 rounded text-[10px] font-semibold ${dane.licencja ? 'bg-emerald-900/50 text-emerald-300 border border-emerald-700' : 'bg-rose-900/50 text-rose-300 border border-rose-700'}">
                                    ${dane.licencja ? 'Aktywna' : 'Brak'}

                kontener.innerHTML = `

                                </select>

                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse text-sm">
                                    <thead>
                                        <tr class="border-b border-slate-800 text-slate-400">
                                            <th class="py-2 px-2">Poz</th>
                                            <th class="py-2 px-2">Klub</th>
                                            <th class="py-2 px-2 text-center">M</th>
                                            <th class="py-2 px-2 text-center">Pkt</th>
                                            <th class="py-2 px-2 text-center">Bilans</th>
                                            <th class="py-2 px-2">Strefa</th>
                                            <th class="py-2 px-2 text-right">Licencja</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${wierszeTabeli || '<tr><td colspan="7" class="py-4 text-center text-slate-500">Brak klubów w tej lidze</td></tr>'}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col">
                            <h2 class="text-lg font-bold mb-4 text-slate-200">Dziennik Związku</h2>
                            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 flex-1 text-xs text-slate-300 space-y-2 overflow-y-auto max-h-[380px]">
                                ${stan.logi.map(l => `<p class="border-l-2 border-emerald-500 pl-2 py-0.5">${l}</p>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (stan.aktywnyWidok === 'wydarzenia') {
                kontener.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                        <h2 class="text-xl font-bold text-slate-100">Kronika Wydarzeń i Meczów Piłkarskich</h2>
                        <p class="text-xs text-slate-400">Tutaj pojawiają się szczegółowe relacje ze spotkań ligowych, gole, kartki oraz najważniejsze wydarzenia.</p>
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs text-slate-300 space-y-3 overflow-y-auto max-h-[500px]">
                            ${stan.meczoweWydarzenia.length > 0 ? stan.meczoweWydarzenia.map(w => `<div class="border-b border-slate-800/80 pb-2">${w}</div>`).join('') : '<p class="text-slate-500">Brak zarejestrowanych wydarzeń z meczów. Rozegraj pierwszą kolejkę!</p>'}
                        </div>
                    </div>
                `;
            } else if (stan.aktywnyWidok === 'finanse') {
                kontener.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                        <h2 class="text-xl font-bold text-slate-100">Zarządzanie Finansami i Marketingiem</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                                <h3 class="font-semibold text-emerald-400 mb-2">Pakiet Medialny TV</h3>
                                <p class="text-xs text-slate-300 mb-4">Zainwestuj w nowoczesny sprzęt transmisyjny, aby podnieść atrakcyjność ligi.</p>
                                <button onclick="inwestujFinanse('tv')" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded-lg text-sm font-medium">Inwestuj (1.000.000 PLN)</button>
                            </div>
                            <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl">
                                <h3 class="font-semibold text-sky-400 mb-2">Kampania Wizerunkowa</h3>
                                <p class="text-xs text-slate-300 mb-4">Ogólnokrajowa akcja marketingowa zwiększająca reputację organizacji (+8 pkt).</p>
                                <button onclick="inwestujFinanse('marketing')" class="w-full bg-sky-600 hover:bg-sky-500 py-2 rounded-lg text-sm font-medium">Kup Kampanię (750.000 PLN)</button>
                            </div>
                            <div class="bg-slate-800/50 border border-slate-700 p-4 rounded-xl">
                                <h3 class="font-semibold text-amber-400 mb-2">Gala Sezonu</h3>
                                <p class="text-xs text-slate-300 mb-4">Organizacja prestiżowej gali nagród dla najlepszych zawodników i klubów.</p>
                                <button onclick="inwestujFinanse('gala')" class="w-full bg-amber-600 hover:bg-amber-500 py-2 rounded-lg text-sm font-medium">Zorganizuj Galę (500.000 PLN)</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (stan.aktywnyWidok === 'kontrakty') {
                kontener.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                        <h2 class="text-xl font-bold text-slate-100">Aktywne Kontrakty i Nowe Oferty</h2>
                        <p class="text-xs text-slate-400">Zarządzaj trwającymi umowami oraz przeglądaj automatycznie generowane propozycje rynkowe.</p>
                        
                        <div class="space-y-3">
                            <h3 class="font-semibold text-sm text-slate-300">Podpisane Kontrakty:</h3>
                            ${stan.kontrakty.map(k => `
                                <div class="bg-slate-800 border border-slate-700 p-4 rounded-xl flex justify-between items-center">
                                    <div>
                                        <h4 class="font-bold text-slate-200">${k.nazwa}</h4>
                                        <p class="text-xs text-emerald-400">Przychód: +${k.zyskNaKolejke.toLocaleString()} PLN / kolejkę</p>
                                        <p class="text-xs text-amber-400">Pozostało kolejek: ${k.pozostałoKolejek}</p>
                                    </div>
                                    <button onclick="negocjujKontrakt(${k.id})" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm font-medium">Przedłuż (+5 kolejek)</button>
                                </div>
                            `).join('')}
                        </div>

                        <div class="pt-4 border-t border-slate-800 space-y-3">
                            <h3 class="font-semibold text-sm text-slate-300">Dostępne Nowe Oferty na Rynku:</h3>
                            ${stan.ofertyKontraktow.length > 0 ? stan.ofertyKontraktow.map(o => `
                                <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex justify-between items-center">
                                    <div>
                                        <h4 class="font-bold text-emerald-400">${o.nazwa}</h4>
                                        <p class="text-xs text-slate-300">Zysk: +${o.zyskNaKolejke.toLocaleString()} PLN/kolejkę \vert{} Czas: ${o.kolejek} kolejek</p>
                                        <p class="text-xs text-slate-400">Koszt podpisania: ${o.kosztPodpisania.toLocaleString()} PLN</p>
                                    </div>
                                    <button onclick="podpiszOfertu(${o.id})" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded-lg text-sm font-medium">Podpisz Umowę</button>
                                </div>

                        </div>
                    </div>
                `;
            } else if (stan.aktywnyWidok === 'sedziowie') {
                kontener.innerHTML = `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-6">
                        <h2 class="text-xl font-bold text-slate-100">Obsada Sędziowska na Kolejkę ${stan.kolejka} (Wszystkie Ligi)</h2>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="space-y-4">
                                ${stan.ligi.map(liga => {
                                    let pary = generujParyDlaLigi(liga);
                                    if(pary.length === 0) return '';
                                    return `
                                        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-2">
                                            <h3 class="font-bold text-emerald-400 text-sm border-b border-slate-800 pb-1">Liga: ${liga}</h3>${pary.map((para, pIdx) => {
                                                let globalnyID = `${liga}_${pIdx}`;
                                                return `
                                                    <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-lg text-xs space-y-1">
                                                        <p class="font-medium text-slate-200">${para[0]} vs ${para[1]}</p>
                                                        <div class="flex items-center gap-2">
                                                            <span class="text-slate-400">Sędzia:</span>
                                                            <select onchange="przypiszSedziego('${globalnyID}', this.value)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 flex-1 text-slate-200">
                                                                <option value="">-- Wybierz sędziego --</option>
                                                                ${stan.sedziowie.filter(s => s.przypisanyMecz === null || s.przypisanyMecz === globalnyID).map(s => `

                                                            </select>
                                                        </div>

                                                `;
                                            }).join('')}
                                        </div>
                                    `;
                                }).join('')}
                            </div>

                            <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl space-y-3 h-fit">
                                <h3 class="font-semibold text-sm text-slate-300">Wszyscy Sędziowie Związku:</h3>
                                <div class="space-y-2 max-h-[450px] overflow-y-auto">
                                    ${stan.sedziowie.map(s => `
                                        <div class="bg-slate-900 border border-slate-800 p-2 rounded-lg text-xs flex justify-between items-center">
                                            <div>
                                                <span class="font-medium text-slate-200">${s.imie}</span>
                                                <p class="text-[10px] text-slate-400">Poziom: ${s.poziom} \vert{} Kontrowersje:${s.kontrowersje}</p>
                                            </div>
                                            <span class="px-2 py-1 rounded text-[10px] ${s.przypisanyMecz !== null ? 'bg-amber-900/50 text-amber-300 border border-amber-800' : 'bg-emerald-900/50 text-emerald-300 border border-emerald-800'}">

                                            </span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (stan.aktywnyWidok === 'kary') {
                kontener.innerHTML = `

            dodajLog(`🗑️ Usunięto klub ${nazwa} ze struktur związku.`);
            renderujWidok();
        }

        function dodajLige() {
            let nazwa = document.getElementById('nowa-liga-nazwa').value.trim();
            if (nazwa && !stan.ligi.includes(nazwa)) {
                stan.ligi.push(nazwa);
                dodajLog(`⚙️ Utworzono nowe rozgrywki ligowe: ${nazwa}.`);
                zmienWidok('tabela');
            } else {
                alert("Podaj poprawną lub unikalną nazwę ligi.");
            }
        }

        function usunLige(index) {
            let ligaDoUsuniecia = stan.ligi[index];
            if (stan.ligi.length <= 1) {
                alert("Musisz zostawić przynajmniej jedną ligę!");
                return;
            }
            if (confirm(`Czy na pewno chcesz usunąć ligę "${ligaDoUsuniecia}"? Kluby z tej ligi zostaną przeniesione.`)) {
                stan.ligi.splice(index, 1);
                let nowaDomyslna = stan.ligi[0];
                for (let k in stan.kluby) {
                    if (stan.kluby[k].liga === ligaDoUsuniecia) {
                        stan.kluby[k].liga = nowaDomyslna;
                    }
                }
                if (stan.aktualnaLiga === ligaDoUsuniecia) {
                    stan.aktualnaLiga = nowaDomyslna;
                }
                dodajLog(`🗑️ Usunięto ligę "${ligaDoUsuniecia}". Kluby przeniesiono do: ${nowaDomyslna}.`);
                odswiezUI();
            }
        }

        function zapiszNazweLigi(index) {
            let inputEl = document.getElementById(`edit-liga-${index}`);
            if (!inputEl) return;
            let inputVal = inputEl.value.trim();
            if (inputVal) {
                let staraNazwa = stan.ligi[index];
                if (staraNazwa === inputVal) return;
                
                stan.ligi[index] = inputVal;
                for (let k in stan.kluby) {
                    if (stan.kluby[k].liga === staraNazwa) {
                        stan.kluby[k].liga = inputVal;
                    }
                }
                if (stan.aktualnaLiga === staraNazwa) {
                    stan.aktualnaLiga = inputVal;
                }
                dodajLog(`⚙️ Zmieniono nazwę ligi z "${staraNazwa}" na "${inputVal}".`);
                odswiezUI();
            }
        }

        function inwestujWKlub(nazwa, typ) {
            let klub = stan.kluby[nazwa];
            if (!klub) return;
            let poziom = klub[typ] || 1;
            if (poziom >= 5) return alert('Ten element jest już na maksymalnym poziomie.');
            let koszt = 250000 * poziom;
            if (stan.budzet_centralny < koszt) return alert('Brak środków w budżecie związku.');
            stan.budzet_centralny -= koszt;
            klub[typ]++;
            klub.morale = Math.min(100, klub.morale + 4);
            klub.kibice = Math.min(100, klub.kibice + (typ === 'infrastruktura' ? 4 : 2));
            dodajLog(`📈 Związek dofinansował ${typ === 'akademia' ? 'akademię' : 'infrastrukturę'} klubu ${nazwa} za ${koszt.toLocaleString()} PLN.`);
            zapiszGre(false); odswiezUI();
        }

        function aktualizujRozwojKlubow() {
            Object.values(stan.kluby).forEach(k => {
                let impuls = (k.akademia - 1) * 0.08 + (k.infrastruktura - 1) * 0.05 + (k.morale - 50) / 500;
                if (Math.random() < 0.18 + impuls) k.forma = Math.min(5, k.forma + 1);
                else if (Math.random() < 0.12 && k.morale < 45) k.forma = Math.max(1, k.forma - 1);
                k.morale = Math.max(25, Math.min(100, k.morale + Math.floor(Math.random()*7)-3));
            });
        }

        function losoweWydarzenieFederacji() {
            if (Math.random() > 0.35) return;
            const wydarzenia = [
                {t:'📺 Rekordowa oglądalność kolejki', kasa:450000, rep:2},
                {t:'🎟️ Wzrost frekwencji na stadionach', kasa:250000, rep:3},
                {t:'⚠️ Kryzys organizacyjny po kontrowersjach', kasa:-300000, rep:-4},
                {t:'🤝 Program szkolenia młodzieży otrzymał dotację', kasa:600000, rep:2},
                {t:'🌧️ Problemy pogodowe zwiększyły koszty organizacji', kasa:-200000, rep:-1}
            ];
            let e = wydarzenia[Math.floor(Math.random()*wydarzenia.length)];
            stan.budzet_centralny = Math.max(0, stan.budzet_centralny + e.kasa);
            stan.reputacja = Math.max(0, Math.min(100, stan.reputacja + e.rep));
            stan.ostatnieWydarzenie = e.t;
            dodajLog(`${e.t}: ${e.kasa >= 0 ? '+' : ''}${e.kasa.toLocaleString()} PLN, reputacja ${e.rep >= 0 ? '+' : ''}${e.rep}.`);
        }

        function rozegrajRundePucharu() {
            if (!stan.puchar.aktywny || stan.puchar.uczestnicy.length < 2) return;
            let gracze = [...stan.puchar.uczestnicy];
            let awans = [];
            let wyniki = [];
            if (gracze.length % 2 === 1) {
                let wolny = gracze.pop();
                awans.push(wolny);
                wyniki.push(`🎫 Wolny los: ${wolny}`);
            }
            for (let i=0; i<gracze.length; i+=2) {
                let a=gracze[i], b=gracze[i+1];
                let fa=stan.kluby[a].forma + stan.kluby[a].morale/50 + Math.random()*2;
                let fb=stan.kluby[b].forma + stan.kluby[b].morale/50 + Math.random()*2;
                let ga=Math.floor(Math.random()*3)+(fa>fb?1:0), gb=Math.floor(Math.random()*3)+(fb>fa?1:0);
                if (ga===gb) { if (Math.random()<.5) ga++; else gb++; }
                let wygrany=ga>gb?a:b;
                awans.push(wygrany);
                stan.kluby[wygrany].morale=Math.min(100,stan.kluby[wygrany].morale+5);
                wyniki.push(`${a} ${ga}:${gb} ${b} → <b>${wygrany}</b>`);
            }
            stan.puchar.historia.push({runda:stan.puchar.runda, wyniki});
            stan.puchar.uczestnicy=awans;
            if (awans.length===1) {
                stan.puchar.aktywny=false; stan.puchar.zwyciezca=awans[0];
                stan.kluby[awans[0]].budzet += 2500000;
                stan.kluby[awans[0]].morale=100;
                stan.reputacja=Math.min(100,stan.reputacja+4);
                dodajLog(`🏅 ${awans[0]} zdobywa Puchar Polski i otrzymuje 2,5 mln PLN premii!`);
            } else {
                dodajLog(`🏅 Rozegrano rundę ${stan.puchar.runda} Pucharu Polski. W grze pozostało ${awans.length} klubów.`);
                stan.puchar.runda++;
            }
        }

        function etapyEuropejskie() {
            return ['I runda eliminacji','II runda eliminacji','III runda eliminacji','IV runda eliminacji','Play-off','Faza ligowa','1/8 finału','Ćwierćfinał','Półfinał','Finał'];
        }

        function wyznaczKwalifikacjeEuropejskie(ekstr) {
            const top = ekstr.map(x => x[0]);
            const wynik = { LM: [], LE: [], LK: [] };
            const zajete = new Set();

            const dodaj = (kod, klub, startEtap, zrodlo) => {
                if (!klub || zajete.has(klub)) return false;
                wynik[kod].push({klub, startEtap, zrodlo});
                zajete.add(klub);
                return true;
            };

            // Ekstraklasa: miejsca ligowe według zasad użytkownika.
            dodaj('LM', top[0], 3, 'Mistrz Ekstraklasy — IV runda eliminacji');
            dodaj('LM', top[1], 1, 'Wicemistrz Ekstraklasy — II runda eliminacji');
            dodaj('LE', top[2], 1, '3. miejsce Ekstraklasy — II runda eliminacji');
            dodaj('LK', top[3], 1, '4. miejsce Ekstraklasy — II runda eliminacji');

            // Puchar Polski: IV runda eliminacji LE. Jeśli zdobywca ma już slot z tabeli,
            // miejsce przechodzi na najwyżej sklasyfikowany klub bez europejskiej kwalifikacji.
            const pp = stan.puchar && stan.puchar.zwyciezca;
            if (pp) {
                if (!dodaj('LE', pp, 3, 'Zdobywca Pucharu Polski — IV runda eliminacji')) {
                    const zastepca = top.find(klub => klub && !zajete.has(klub));
                    dodaj('LE', zastepca, 3, 'Slot Pucharu Polski — IV runda eliminacji');
                }
            }
            return wynik;
        }

        function przygotujEuropejskiePuchary(kwalifikacje) {
            const nazwy = {LM:'Liga Mistrzów', LE:'Liga Europy', LK:'Liga Konferencji Europy'};
            stan.europa = { sezon: stan.sezon, rozgrywki: {} };
            ['LM','LE','LK'].forEach(kod => {
                const wpisy = (kwalifikacje[kod] || []).map(w => typeof w === 'string' ? {klub:w,startEtap:0,zrodlo:''} : w);
                const start = wpisy.length ? Math.min(...wpisy.map(w => w.startEtap ?? 0)) : 0;
                const aktywni = wpisy.filter(w => (w.startEtap ?? 0) === start).map(w => w.klub);
                const oczekujacy = wpisy.filter(w => (w.startEtap ?? 0) > start);
                stan.europa.rozgrywki[kod] = { nazwa:nazwy[kod], kod, etap:start, aktywni, oczekujacy, kwalifikacje:wpisy, historia:[], zwyciezca:null };
            });
            const wszyscy = ['LM','LE','LK'].flatMap(kod => (kwalifikacje[kod] || []).map(w => typeof w === 'string' ? w : w.klub));
            if (wszyscy.length) dodajLog(`🌍 Europejskie puchary: ${wszyscy.join(', ')} otrzymali miejsca w rozgrywkach UEFA na kolejny sezon.`);
        }

        function losowyRywalEuropejski(kod) {
            const rywale = {
                LM:['Real Madrid','Manchester City','Bayern Monachium','Inter Mediolan','Paris SG','FC Barcelona','Arsenal','Borussia Dortmund','Benfica','PSV Eindhoven'],
                LE:['AS Roma','Tottenham','Real Sociedad','Lazio','Feyenoord','FC Porto','Lyon','Real Betis','Eintracht Frankfurt','Rangers'],
                LK:['Fiorentina','AZ Alkmaar','Rapid Wiedeń','Gent','Hearts','Djurgården','Molde','Lugano','Hajduk Split','Omonia Nikozja']
            };
            const pula = rywale[kod];
            return pula[Math.floor(Math.random()*pula.length)];
        }

        function rozegrajRundeEuropejska() {
            if (!stan.europa || !stan.europa.rozgrywki) return;
            const etapy = etapyEuropejskie();
            const bazowaSila = {LM:6.4, LE:5.7, LK:5.0};
            const premie = [500000,700000,1000000,1500000,2200000,3500000,5000000,9000000];

            ['LM','LE','LK'].forEach(kod => {
                const r = stan.europa.rozgrywki[kod];
                if (!r || r.zwyciezca || r.etap >= etapy.length) return;
                r.aktywni = r.aktywni || [];
                r.oczekujacy = r.oczekujacy || [];

                // Dołącz kluby dokładnie w rundzie, od której mają rozpocząć eliminacje.
                if (!r.aktywni.length && r.oczekujacy.length) {
                    const najblizszyStart = Math.min(...r.oczekujacy.map(w => w.startEtap));
                    if (r.etap < najblizszyStart) r.etap = najblizszyStart;
                }
                const dolaczajacy = r.oczekujacy.filter(w => w.startEtap === r.etap);
                dolaczajacy.forEach(w => { if (!r.aktywni.includes(w.klub)) r.aktywni.push(w.klub); });
                r.oczekujacy = r.oczekujacy.filter(w => w.startEtap !== r.etap);
                if (!r.aktywni.length) return;

                const etapNazwa = etapy[r.etap];
                let wyniki = [];
                let awans = [];

                // Jeśli dwa polskie kluby dotarły do finału LK, grają finał między sobą.
                if (r.etap === etapy.length - 1 && r.aktywni.length === 2) {
                    const [a,b] = r.aktywni;
                    const ka=stan.kluby[a], kb=stan.kluby[b];
                    let sa=(ka?.forma||3)+(ka?.morale||60)/45+Math.random()*2;
                    let sb=(kb?.forma||3)+(kb?.morale||60)/45+Math.random()*2;
                    let ga=Math.floor(Math.random()*3)+(sa>sb?1:0), gb=Math.floor(Math.random()*3)+(sb>sa?1:0);
                    if (ga===gb) { if (Math.random()<.5) ga++; else gb++; }
                    const wygrany=ga>gb?a:b;
                    r.zwyciezca=wygrany;
                    r.aktywni=[];
                    stan.kluby[wygrany].budzet += premie[r.etap];
                    stan.kluby[wygrany].morale=100;
                    stan.reputacja=Math.min(100,stan.reputacja+7);
                    wyniki.push(`🏆 ${a} ${ga}:${gb} ${b} → <b>${wygrany} zdobywa ${r.nazwa}</b>`);
                    dodajLog(`🏆 ${wygrany} zdobywa ${r.nazwa}!`);
                } else {
                    r.aktywni.forEach(klubNazwa => {
                        const klub=stan.kluby[klubNazwa];
                        if (!klub) return;
                        const rywal=losowyRywalEuropejski(kod);
                        const sila=(klub.forma||3)*1.05+(klub.morale||60)/50+(klub.infrastruktura||1)*0.18+Math.random()*2.2;
                        const silaRywala=bazowaSila[kod]+r.etap*0.22+Math.random()*2.0;
                        let gk=Math.floor(Math.random()*3)+(sila>silaRywala?1:0);
                        let gr=Math.floor(Math.random()*3)+(silaRywala>sila?1:0);
                        if (gk===gr) { if (sila+Math.random()>silaRywala+Math.random()) gk++; else gr++; }
                        if (gk>gr) {
                            klub.budzet += premie[r.etap];
                            klub.morale=Math.min(100,klub.morale+6);
                            stan.reputacja=Math.min(100,stan.reputacja+1);
                            if (r.etap === etapy.length - 1) {
                                r.zwyciezca=klubNazwa;
                                stan.reputacja=Math.min(100,stan.reputacja+6);
                                wyniki.push(`🏆 ${klubNazwa} ${gk}:${gr} ${rywal} → <b>${klubNazwa} zdobywa ${r.nazwa}</b>`);
                                dodajLog(`🏆 ${klubNazwa} zdobywa ${r.nazwa}!`);
                            } else {
                                awans.push(klubNazwa);
                                wyniki.push(`✅ ${klubNazwa} ${gk}:${gr} ${rywal} → awans`);
                            }
                        } else {
                            klub.morale=Math.max(25,klub.morale-5);
                            wyniki.push(`❌ ${klubNazwa} ${gk}:${gr} ${rywal} → odpadnięcie`);
                        }
                    });
                    r.aktywni = r.zwyciezca ? [] : awans;
                }
                r.historia.push({etap:etapNazwa, wyniki});
                if (!r.zwyciezca) r.etap++;
                if (wyniki.length) dodajWydarzenieMeczowe(`[EUROPA — ${r.nazwa}, ${etapNazwa}] ${wyniki.join(' | ')}`);
            });
        }

        function zapiszGre(pokazKomunikat=true) {
            try { localStorage.setItem('symulatorPolskichLig_save_v2', JSON.stringify(stan)); if (pokazKomunikat) alert('Gra została zapisana w tej przeglądarce.'); } catch(e) { if (pokazKomunikat) alert('Nie udało się zapisać gry.'); }
        }

        function wczytajGre(pokazKomunikat=true) {
            try {
                let dane = localStorage.getItem('symulatorPolskichLig_save_v2');
                if (!dane) { if (pokazKomunikat) alert('Brak zapisu gry.'); return; }
                stan = JSON.parse(dane); uzupelnijStan(); odswiezUI();
                if (pokazKomunikat) alert('Zapis wczytany.');

        }

        function symulujKolejke() {
            if (stan.kolejka > 34) return;

            let sumaPrzychodow = 0;
            stan.kontrakty.forEach(k => {
                sumaPrzychodow += k.zyskNaKolejke;
                k.pozostałoKolejek--;
            });
            stan.budzet_centralny += sumaPrzychodow;
            stan.kontrakty = stan.kontrakty.filter(k => k.pozostałoKolejek > 0);

            stan.ligi.forEach(liga => {
                let klubyW2Lidze = Object.keys(stan.kluby).filter(k => stan.kluby[k].liga === liga && stan.kluby[k].licencja);
                for (let i = klubyW2Lidze.length - 1; i > 0; i--) {
                    let j = Math.floor(Math.random() * (i + 1));
                    [klubyW2Lidze[i], klubyW2Lidze[j]] = [klubyW2Lidze[j], klubyW2Lidze[i]];
                }

                let wynikiTekst = `<strong>Wyniki kolejki ${stan.kolejka} (${liga}):</strong><br>`;
                let rozegranoMecze = false;
                for (let i = 0; i < klubyW2Lidze.length; i += 2) {
                    if (i + 1 >= klubyW2Lidze.length) break;
                    rozegranoMecze = true;
                    let g = klubyW2Lidze[i];
                    let as = klubyW2Lidze[i+1];

                    let gBramki = Math.floor(Math.random() * 4) + (stan.kluby[g].forma > 3 ? 1 : 0);
                    let asBramki = Math.floor(Math.random() * 4) + (stan.kluby[as].forma > 3 ? 1 : 0);

                    stan.kluby[g].bramki_strzelone += gBramki;
                    stan.kluby[g].bramki_stracone += asBramki;
                    stan.kluby[as].bramki_strzelone += asBramki;
                    stan.kluby[as].bramki_stracone += gBramki;

                    if (gBramki > asBramki) {
                        stan.kluby[g].punkty += 3;
                    } else if (asBramki > gBramki) {
                        stan.kluby[as].punkty += 3;
                    } else {
                        stan.kluby[g].punkty += 1;
                        stan.kluby[as].punkty += 1;
                    }

                    wynikiTekst += `⚽ ${g} ${gBramki} : ${asBramki} ${as}<br>`;
                    
                    let opisMeczu = `[Kolejka ${stan.kolejka} | ${liga}] ${g} ${gBramki}:${asBramki} ${as} — Emocjonujące starcie na murawie. Kibice obejrzeli ${gBramki + asBramki} bramek.`;
                    dodajWydarzenieMeczowe(opisMeczu);
                }
                if (rozegranoMecze) {
                    dodajLog(wynikiTekst);
                }
            });

            dodajLog(`💰 Zasilenie budżetu z aktywnych kontraktów: +${sumaPrzychodow.toLocaleString()} PLN.`);

            stan.sedziowie.forEach(s => s.przypisanyMecz = null);
            generujLosowaOfertaKontraktu();
            aktualizujRozwojKlubow();
            losoweWydarzenieFederacji();
            if (stan.kolejka % 5 === 0) rozegrajRundePucharu();
            if (stan.kolejka % 4 === 0) rozegrajRundeEuropejska();

            stan.kolejka++;

            if (stan.kolejka > 34) {
                rozstrzygnijAwansISpadek();
            }

            zapiszGre(false);
            odswiezUI();
        }

        function rozstrzygnijAwansISpadek() {
            dodajLog("🏆 Koniec 34. kolejki! Sezon dobiegł końca. Przeprowadzanie awansów i spadków między ligami.");
            
            let ekstr = Object.entries(stan.kluby).filter(([k, d]) => d.liga === "Ekstraklasa");
            let liga1 = Object.entries(stan.kluby).filter(([k, d]) => d.liga === "1. Liga");
            let liga2 = Object.entries(stan.kluby).filter(([k, d]) => d.liga === "2. Liga");

            ekstr.sort((a, b) => b[1].punkty - a[1].punkty);
            liga1.sort((a, b) => b[1].punkty - a[1].punkty);
            liga2.sort((a, b) => b[1].punkty - a[1].punkty);

            // Kwalifikacje europejskie liczymy na podstawie końcowej tabeli przed awansami i spadkami.
            const kwalifikacjeEuropa = wyznaczKwalifikacjeEuropejskie(ekstr);

            if (ekstr.length >= 3 && liga1.length > 0) {
                let s1 = ekstr[ekstr.length - 1][0];
                let s2 = ekstr[ekstr.length - 2][0];
                let s3 = ekstr[ekstr.length - 3][0];
                stan.kluby[s1].liga = "1. Liga";
                stan.kluby[s2].liga = "1. Liga";
                stan.kluby[s3].liga = "1. Liga";
                dodajLog(`🔻 Spadek z Ekstraklasy do 1. Ligi: ${s1}, ${s2}, ${s3}`);
            }

            if (liga1.length >= 3) {
                let a1 = liga1[0][0];
                let a2 = liga1[1][0];
                let a3 = liga1[2][0];
                stan.kluby[a1].liga = "Ekstraklasa";
                stan.kluby[a2].liga = "Ekstraklasa";
                stan.kluby[a3].liga = "Ekstraklasa";
                dodajLog(`🚀 Awans z 1. Ligi do Ekstraklasy: ${a1}, ${a2}, ${a3}`);

                let s1_1l = liga1[liga1.length - 1][0];
                let s2_1l = liga1[liga1.length - 2][0];
                let s3_1l = liga1[liga1.length - 3][0];
                stan.kluby[s1_1l].liga = "2. Liga";
                stan.kluby[s2_1l].liga = "2. Liga";
                stan.kluby[s3_1l].liga = "2. Liga";
                dodajLog(`🔻 Spadek z 1. Ligi do 2. Ligi: ${s1_1l}, ${s2_1l}, ${s3_1l}`);
            }

            if (liga2.length >= 3) {
                let a1_2l = liga2[0][0];
                let a2_2l = liga2[1][0];
                let a3_2l = liga2[2][0];
                stan.kluby[a1_2l].liga = "1. Liga";
                stan.kluby[a2_2l].liga = "1. Liga";
                stan.kluby[a3_2l].liga = "1. Liga";
                dodajLog(`🚀 Awans z 2. Ligi do 1. Ligi: ${a1_2l}, ${a2_2l}, ${a3_2l}`);

                const spadek2 = liga2.slice(-3).map(x => x[0]);
                spadek2.forEach(n => stan.kluby[n].liga = '3. Liga');
                dodajLog(`🔻 Spadek z 2. Ligi do 3. Ligi: ${spadek2.join(', ')}`);

                let kandydaci3 = Object.entries(stan.kluby).filter(([n,d]) => d.liga === '3. Liga' && !spadek2.includes(n));
                kandydaci3.sort((a,b) => ((b[1].forma||3)+(b[1].morale||60)/50+Math.random()*2) - ((a[1].forma||3)+(a[1].morale||60)/50+Math.random()*2));
                const awans3 = kandydaci3.slice(0,3).map(x => x[0]);
                awans3.forEach(n => stan.kluby[n].liga = '2. Liga');
                if (awans3.length) dodajLog(`⬆️ Awans z 3. Ligi do 2. Ligi: ${awans3.join(', ')}`);
            }

            let mistrz = ekstr.length ? ekstr[0][0] : 'Brak';
            const europaWyniki = {
                LM: stan.europa?.rozgrywki?.LM?.zwyciezca || null,
                LE: stan.europa?.rozgrywki?.LE?.zwyciezca || null,
                LK: stan.europa?.rozgrywki?.LK?.zwyciezca || null
            };
            stan.historiaSezonow.push({ sezon: stan.sezon, mistrz, puchar: stan.puchar.zwyciezca, europa: europaWyniki, reputacja: stan.reputacja, budzet: stan.budzet_centralny });
            stan.sezon++;

            for (let k in stan.kluby) {
                stan.kluby[k].punkty = 0;
                stan.kluby[k].bramki_strzelone = 0;
                stan.kluby[k].bramki_stracone = 0;
            }
            stan.kolejka = 1;
            przygotujPuchar();
            przygotujEuropejskiePuchary(kwalifikacjeEuropa);
            const fmtKwal = arr => (arr||[]).map(w => `${w.klub} (${etapyEuropejskie()[w.startEtap]})`).join(', ') || 'brak';
            dodajLog(`🌍 Kwalifikacje do Europy: LM — ${fmtKwal(kwalifikacjeEuropa.LM)}; LE — ${fmtKwal(kwalifikacjeEuropa.LE)}; LK — ${fmtKwal(kwalifikacjeEuropa.LK)}.`);
            dodajLog(`🔄 Rozpoczęto sezon ${stan.sezon}. Tabele wyzerowano, a Puchar Polski otrzymał nową drabinkę.`);
        }

        function resetujGre() {
            if (confirm("Czy na pewno chcesz rozpocząć całkowicie nową grę? Zapis lokalny zostanie usunięty.")) {
                localStorage.removeItem('symulatorPolskichLig_save_v2');
                location.reload();
            }
        }

        uzupelnijStan();
        // Automatycznie wczytaj poprzednią karierę, jeśli istnieje.
        if (localStorage.getItem('symulatorPolskichLig_save_v2')) wczytajGre(false);
        else odswiezUI();
    </script>
