 s.subsidiaries.forEach(c=>{c.id=c.id||uid();c.parentId=c.parentId||null;c.type=c.type||'Software';c.strategy=c.strategy||'Wzrost';c.products=Array.isArray(c.products)?c.products:[];c.children=Array.isArray(c.children)?c.children:[]});
 repairProductOwnership(s);
 s.companies=Array.isArray(s.companies)?s.companies:[];
 s.acquiredCompanies=s.acquiredCompanies.filter((c,i,a)=>c&&c.id&&!a.slice(0,i).some(x=>x.id===c.id));

function normalize(c){
 if(!c)return;
 const map=new Map();
 (Array.isArray(c.holders)?c.holders:[]).forEach(h=>{
   if(!Array.isArray(h)||!h[0])return;
   const name=String(h[0]);
   const shares=Math.max(0,Math.floor(Number(h[1])||0));
   if(shares>0)map.set(name,(map.get(name)||0)+shares);
 });
 c.holders=[...map.entries()].map(([name,shares])=>[name,shares]);
 let total=c.holders.reduce((a,h)=>a+h[1],0);
 if(total===0){c.holders=[['Public Investors',100]];total=100}
 // Naprawa zapisu wykonywana tylko wtedy, gdy dane firmy są uszkodzone.
 // Transakcje używają transferShares(), więc nie tworzą ani nie kasują udziałów.
 if(total!==100){
   let pub=c.holders.find(h=>h[0]==='Public Investors');
   if(!pub){pub=['Public Investors',0];c.holders.push(pub)}
   pub[1]+=100-total;
   if(pub[1]<0){
     let need=-pub[1];pub[1]=0;
     c.holders.filter(h=>h[0]!=='Public Investors').sort((a,b)=>b[1]-a[1]).some(h=>{const take=Math.min(h[1],need);h[1]-=take;need-=take;return need<=0});
   }
   c.holders=c.holders.filter(h=>h[1]>0);
 }
 c.shares=100;
 c.owned=playerShares(c);
 c.controlled=c.owned>=51;
}
function playerShares(c){const h=(c?.holders||[]).find(x=>x[0]==='NEXORA');return h?Number(h[1])||0:0}
function shareholderCount(c){return (c?.holders||[]).filter(h=>Number(h[1])>0).length}
function totalShares(c){return (c?.holders||[]).reduce((a,h)=>a+Math.max(0,Math.floor(Number(h[1])||0)),0)}
function transferShares(c,sellerName,buyerName,qty){
 if(!c||sellerName===buyerName)return false;
 const seller=c.holders.find(h=>h[0]===sellerName);
 if(!seller)return false;
 const q=Math.floor(Number(qty)||0);
 if(q<=0||seller[1]<q)return false;
 let buyer=c.holders.find(h=>h[0]===buyerName);
 if(!buyer){buyer=[buyerName,0];c.holders.push(buyer)}
 seller[1]-=q;buyer[1]+=q;
 c.holders=c.holders.filter(h=>Number(h[1])>0);
 if(totalShares(c)!==100){
   // Awaryjny rollback — transfer nigdy nie może zmienić sumy udziałów.
   buyer[1]-=q;
   if(buyer[1]<=0)c.holders=c.holders.filter(h=>h!==buyer);
   seller[1]+=q;
   return false;
 }
 c.owned=playerShares(c);c.controlled=c.owned>=51;
 return true;
}

function randomInvestor(exclude=[]){const pool=INVESTOR_NAMES.filter(n=>!exclude.includes(n)&&n!=='NEXORA');return pool.length?pool[Math.floor(Math.random()*pool.length)]:('Investor '+Math.floor(100+Math.random()*900));}
function randomHolders(count){
 count=Math.max(3,Math.min(8,count));
 const names=[];while(names.length<count)names.push(randomInvestor(names));
 const vals=[];let remaining=100;
 for(let i=0;i<count-1;i++){const min=1,max=remaining-(count-i-1);const v=Math.floor(Math.random()*(max-min+1))+min;vals.push(v);remaining-=v}
 vals.push(remaining);
 return names.map((n,i)=>[n,vals[i]]);
}
function generateMarketCompany(){

 const available=COMPANY_NAMES.filter(x=>!used.has(x[1]));
 if(!available.length)return null;
 const [name,ticker,type]=available[Math.floor(Math.random()*available.length)];
 const price=Math.round((18+Math.random()*170)*100)/100;
 const c=company(name,ticker,type,price,randomHolders(3+Math.floor(Math.random()*6)));
 normalize(c);c.history=[c.price];S.companies.push(c);return c;
}
function marketDynamics(){
 S.companies.forEach(c=>{
   if(!c||c.acquired||c.merged)return;
   if(totalShares(c)!==100){normalize(c)}
   const sellers=c.holders.filter(h=>h[0]!=='NEXORA'&&h[1]>=2);
   if(!sellers.length){
     c.prev=c.price;c.price=Math.max(1,Math.round(c.price*(1+(Math.random()-.48)*.025)*100)/100);return;
   }
   const seller=sellers[Math.floor(Math.random()*sellers.length)];
   const qty=Math.min(seller[1],1+Math.floor(Math.random()*Math.min(4,seller[1])));
   const buyers=c.holders.filter(h=>h!==seller&&h[0]!=='NEXORA'&&h[1]>0);
   let buyerName;
   if(Math.random()<.30 || !buyers.length){
     buyerName=randomInvestor(c.holders.map(h=>h[0]));
   }else buyerName=buyers[Math.floor(Math.random()*buyers.length)][0];
   if(buyerName && buyerName!==seller[0])transferShares(c,seller[0],buyerName,qty);
   c.prev=c.price;
   const demand=(Math.random()-.48)*.04;
   c.price=Math.max(1,Math.round(c.price*(1+demand)*100)/100);
   c.history=Array.isArray(c.history)?c.history:[];c.history.push(c.price);c.history=c.history.slice(-60);
 });
}

function syncMarketCompanies(state=S){
 if(!Array.isArray(state.companies))state.companies=[];
 if(!Array.isArray(state.acquiredCompanies))state.acquiredCompanies=[];
 const acquiredIds=new Set(state.acquiredCompanies.map(c=>c?.id).filter(Boolean));
 const market=[];
 state.companies.forEach(c=>{
   if(!c)return;
   c.id=c.id||uid();c.shares=100;c.holders=Array.isArray(c.holders)?c.holders:[];
   normalize(c);
   if(c.acquired||c.merged||acquiredIds.has(c.id)||playerShares(c)>=100){
     c.holders=[['NEXORA',100]];c.owned=100;c.controlled=true;c.acquired=true;
     if(!acquiredIds.has(c.id)){state.acquiredCompanies.push(c);acquiredIds.add(c.id)}
   }else market.push(c);
 });
 state.companies=market;
 const seen=new Set();
 state.acquiredCompanies=state.acquiredCompanies.filter(c=>c&&c.id&&!seen.has(c.id)&&(seen.add(c.id),true)).map(c=>{c.holders=[['NEXORA',100]];c.owned=100;c.controlled=true;c.acquired=true;return c});
}

function repairProductOwnership(state=S){
 const subs=Array.isArray(state.subsidiaries)?state.subsidiaries:[];
 const valid=new Set(subs.map(c=>c.id));
 (state.products||[]).forEach(p=>{
   if(!p.ownerId||p.ownerId!=='NEXORA'&&!valid.has(p.ownerId))p.ownerId='NEXORA';
 });
 subs.forEach(c=>{c.products=[]});
 (state.products||[]).forEach(p=>{
   if(p.ownerId!=='NEXORA'){const c=subs.find(x=>x.id===p.ownerId);if(c)c.products.push(p.id);else p.ownerId='NEXORA'}
 });
}
function setProductOwner(productId,ownerId){
 const p=S.products.find(x=>x.id===productId);
 if(!p)return false;
 const target=ownerId==='NEXORA'?null:S.subsidiaries.find(c=>c.id===ownerId);
 if(ownerId!=='NEXORA'&&!target)return false;
 S.subsidiaries.forEach(c=>{c.products=Array.isArray(c.products)?c.products.filter(id=>String(id)!==String(productId)):[]});
 p.ownerId=ownerId==='NEXORA'?'NEXORA':target.id;
 if(target){target.products=Array.isArray(target.products)?target.products:[];if(!target.products.some(id=>String(id)===String(productId)))target.products.push(productId)}
 repairProductOwnership(S);
 return p.ownerId===ownerId;
}
function autonomousSubsidiaryProducts(){
 if(!Array.isArray(S.subsidiaries)||!S.subsidiaries.length)return;
 S.subsidiaries.forEach(c=>{
   const ids=new Set(c.products||[]);
   S.products.filter(p=>p.ownerId===c.id).forEach(p=>ids.add(p.id));
   c.products=[...ids].filter(id=>S.products.some(p=>p.id===id&&p.ownerId===c.id));
   const interval=c.strategy==='Innowacje'?2:c.strategy==='Wzrost'?3:4;
   if(S.day%interval!==0)return;
   c.products.forEach(pid=>{
     const p=S.products.find(x=>x.id===pid&&x.ownerId===c.id&&x.status!=='WYCOFANY');
     if(!p)return;

     // Każda aktualizacja losuje inny rodzaj rozwoju. Ten sam typ może trafić się ponownie,
     // ale spółka nie wykonuje zawsze tego samego schematu.
     const shuffled=[...UPDATE_OPTIONS].sort(()=>Math.random()-.5);
     const option=shuffled[0]||UPDATE_OPTIONS[0];
     const secondChance=Math.random();
     const second=secondChance<0.22?shuffled.find(x=>x!==option&&x[0]!=='localization'):null;
     const selected=second?[option,second]:[option];

     const availableLangs=LANGUAGES.filter(lang=>!(p.languages||[]).includes(lang));
     let newLangs=[];
     // Język jest osobnym, losowym typem rozwoju. Czasem firma zrobi tylko język,
     // czasem połączy język z inną zmianą, a czasem nie doda języka wcale.
     if(availableLangs.length && Math.random()<0.42){
       const count=Math.min(Math.random()<0.78?1:2,availableLangs.length);
       const pool=[...availableLangs];
       for(let k=0;k<count;k++){
         const idx=Math.floor(Math.random()*pool.length);
         newLangs.push(pool.splice(idx,1)[0]);
       }
     }

     let usersMult=1, ratingBonus=0, valueBonus=0;
     const updateNames=[];
     selected.forEach(o=>{
       updateNames.push(o[1]);
       if(o[0]==='bugs')ratingBonus+=2;
       else if(o[0]==='content')usersMult*=1.06;
       else if(o[0]==='ai')ratingBonus+=3;
       else if(o[0]==='features')valueBonus+=.08;
       else if(o[0]==='performance')usersMult*=1.06;
       else if(o[0]==='security')ratingBonus+=2;
       else if(o[0]==='design')ratingBonus+=2;
       else if(o[0]==='ads')usersMult*=1.06;
       else if(o[0]==='mobile')usersMult*=1.07;
       else if(o[0]==='accessibility')usersMult*=1.04;
       else if(o[0]==='cloud')valueBonus+=.07;
       else if(o[0]==='hardware')valueBonus+=.08;
       else if(o[0]==='analytics')valueBonus+=.05;
       else if(o[0]==='subscriptions')valueBonus+=.07;
     });

     if(newLangs.length){
       p.languages=[...(p.languages||[]),...newLangs];
       p.languages=[...new Set(p.languages)];
       usersMult*=1+.08*newLangs.length;
     }
     p.updates=(Number(p.updates)||0)+1;
     p.version='v'+(1+p.updates)+'.0';
     p.rating=Math.min(100,(Number(p.rating)||60)+ratingBonus);
     p.users=Math.round((Number(p.users)||0)*usersMult);
     p.value=Math.max(p.value||100000,Math.round((p.value||100000)*(1+valueBonus)));
     p.updatesLog=Array.isArray(p.updatesLog)?p.updatesLog:[];
     p.updatesLog.unshift({
       day:S.day,
       options:updateNames.concat(newLangs.length?['🌍 Nowe języki']:[]).map(String),
       langs:newLangs,
       automatic:true,
       company:c.name
     });
     p.updatesLog=p.updatesLog.slice(0,30);

     let detail=updateNames.join(' + ');
     if(newLangs.length)detail+=` · 🌍 języki: ${newLangs.join(', ')}`;
     S.events.unshift(`🏢 ${c.name}: ${p.name} → ${p.version} | ${detail}`);
   });
 });
 S.events=S.events.slice(0,50);
}
function dailyCalc(){
 let income=0,expense=0;
 const prodBonus=1+techBonus()/2+engineBonus();
 
 // PRODUKTY — właściciel decyduje, kto prowadzi produkt.
 S.products.forEach(p=>{
   if(p.status==='WYCOFANY')return;
   const owner=S.subsidiaries.find(c=>c.id===p.ownerId);
   const growth=Math.max(1,Math.round((Number(p.users)||0)*(.012+((Number(p.rating)||60)-60)/5000)));
   p.users=(Number(p.users)||0)+growth;
   p.value=Math.max(Number(p.value)||100000,p.users*(Number(p.rating)||60)*4);
   let r=Math.round(p.users*(.12+(Number(p.rating)||60)/700)*prodBonus);
   if(p.type==='AI')r=Math.round(r*1.35);
   if(p.languages?.length)r=Math.round(r*(1+Math.min(.35,p.languages.length*.006)));
   if(owner) r=Math.round(r*(owner.strategy==='Zysk'?1.12:owner.strategy==='Innowacje'?1.10:1.06));
   p.revenueDay=r;
   income+=r;
 });

 // SPÓŁKI CÓRKI — samodzielnie rozwijają przypisane produkty.
 autonomousSubsidiaryProducts(); 
 // SPÓŁKI CÓRKI — ich przychód trafia do NEXORA.
 S.subsidiaries.forEach(c=>{
   let r=Math.round((Number(c.revenueDay)||5000)*(c.strategy==='Zysk'?1.15:c.strategy==='Innowacje'?1.10:1.05));
   c.revenueDay=r;
   income+=r;
 });
 
 // BAZOWY PRZYCHÓD FIRMY.
 income+=Math.round(S.users*(.025+S.reputation/10000)*(S.products.length?.1:.35));
 
 // DYWIDENDY Z UDZIAŁÓW — wypłata każdego dnia.
 const shareIncome=sharesDailyIncome();
 income+=shareIncome;
 
 // KOSZTY — pensje są osobnym, rzeczywistym kosztem każdego dnia.
 const payroll=S.employees.reduce((a,e)=>a+Math.max(0,Number(e.salary)||0),0);
 const serverCost=S.servers.reduce((a,s)=>a+2500+(Number(s.level)||1)*900,0);
 const gpuCost=Math.max(0,Number(S.gpu)||0)*35;
 const engineCost=S.engines.reduce((a,owned)=>{const e=ENGINE_TYPES.find(x=>x[0]===owned.name);return a+(e?Math.round(e[3]*(1+0.10*(Math.max(1,owned.level||1)-1))*.002):0)},0);
 const officeCostDaily=Math.max(1,Number(S.office.level)||1)*750;
 const infrastructure=serverCost+gpuCost+officeCostDaily+engineCost;
 expense=payroll+infrastructure;
 const profit=income-expense;
 
 // Najpierw wpływy, potem osobno pensje i infrastruktura — dzięki temu widać każdy koszt.
 if(income>0)earn(income,'przychód dnia');
 if(payroll>0)changeCash(-payroll,'pensje pracowników');
 if(infrastructure>0)changeCash(-infrastructure,'infrastruktura');
 
 S.users=Math.round(S.users*(1.012+S.reputation/50000));
 S.researchPoints+=10;
 S.incomeHistory.push(income);
 S.expenseHistory.push(expense);
 S.profitHistory.push(profit);
 S.userHistory.push(S.users);
 S.incomeHistory=S.incomeHistory.slice(-40);
 S.expenseHistory=S.expenseHistory.slice(-40);
 S.profitHistory=S.profitHistory.slice(-40);
 S.userHistory=S.userHistory.slice(-40);
 S.stats={
   day:S.day,income,expense,profit,payroll,
   shareIncome,payrollPerDay:payroll,products:S.products.length,
   productUsers:S.products.reduce((a,p)=>a+(Number(p.users)||0),0),
   productRevenue:S.products.reduce((a,p)=>a+(Number(p.revenueDay)||0),0),
   subsidiaryRevenue:S.subsidiaries.reduce((a,c)=>a+(Number(c.revenueDay)||0),0),
   gpu:S.gpu,gpuLevel:S.gpuLevel,servers:S.servers.length,
   serverCost,gpuCost,engineCost,officeCost:officeCostDaily,employees:S.employees.length,
   models:S.models.length,valuation:valuation()
 };
 
 // Kurs zmienia się, ale liczba udziałów/właściciele nie zmieniają się automatycznie.
 S.companies.forEach(c=>{
   c.prev=c.price;
   c.price=Math.max(1,Math.round(c.price*(1+(Math.random()-.45)*.08+(c.controlled?.012:0))*100)/100);
   c.history.push(c.price);
   c.history=c.history.slice(-40);
   normalize(c);
 });

 // Obrót rynku odbywa się również w czasie rzeczywistym przez realtimeMarketTick().
 marketDynamics();

 return{income,expense,profit,payroll,shareIncome};
}

function createProduct(){if(!S.employees.length)return toast('Najpierw zatrudnij pracownika');openModal(`<div class="modalHead"><div><h2>🚀 Centrum produkcji</h2><p class="muted">Wybierz języki dostępne dla produktu.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>Nazwa<input id="newProductName" placeholder="np. NEXORA Search"></label><label>Typ<select id="newProductType">${PRODUCT_TYPES.map(x=>`<option>${x}</option>`).join('')}</select></label><label>Języki${selectionGrid('newLanguages',LANGUAGES,['polski','angielski'])}</label><div class="card"><b>Koszt uruchomienia: ${money(25000+S.employees.length*2500)}</b></div><button onclick="confirmCreateProduct()">🚀 Uruchom produkt</button></div>`)}
function confirmCreateProduct(){const name=document.getElementById('newProductName').value.trim(),type=document.getElementById('newProductType').value,languages=checkedValues('newLanguages');if(!name)return toast('Podaj nazwę');if(!languages.length)return toast('Wybierz język');const cost=25000+S.employees.length*2500;if(!spend(cost,'uruchomienie produktu'))return;S.products.push({id:uid(),name,type,rating:60+Math.floor(Math.random()*40),users:300+Math.floor(Math.random()*3000),value:100000,revenueDay:0,version:'v1.0',status:'AKTYWNY',languages,updates:0,updatesLog:[],ownerId:'NEXORA'});save();closeModal();render();toast('🚀 Produkt uruchomiony')}
function openProduct(i){const p=S.products[i];openModal(`<div class="modalHead"><div><h2>📦 ${escapeHtml(p.name)}</h2><p class="muted">${p.type} · ${p.version} · ${escapeHtml(ownerName(p.ownerId))}</p></div><button class="close" onclick="closeModal()">×</button></div><div class="grid">${stat('Użytkownicy',num(p.users),'aktywni')}${stat('Ocena',p.rating+'/100','jakość')}${stat('Przychód/d',money(p.revenueDay),'ostatni dzień')}${stat('Aktualizacje',p.updates||0,'wdrożonych')}</div><div class="card section"><h3>🌐 Języki produktu</h3><p class="muted">${(p.languages||[]).length} języków</p><div class="actions"><button onclick="openUpdateProduct(${i})">🔄 Panel aktualizacji</button><button onclick="openProductAssignment(${i})">🏢 Przypisz do spółki</button></div></div><div class="card section"><h3>📜 Ostatnie aktualizacje</h3>${(p.updatesLog||[]).slice(0,8).map(u=>`<div class="row"><div><strong>Dzień ${u.day}</strong><small>${u.options.join(' · ')}</small></div><span class="pill">+${u.langs.length} jęz.</span></div>`).join('')||'<div class="empty">Brak aktualizacji.</div>'}</div>`)}
function openUpdateProduct(i){const p=S.products[i];const base=Math.round(18000+(p.rating||60)*350);const availableLanguages=LANGUAGES.filter(lang=>!(p.languages||[]).includes(lang));openModal(`<div class=\"modalHead\"><div><h2>🔄 Panel aktualizacji — ${escapeHtml(p.name)}</h2><p class=\"muted\">Języki już dodane do produktu są usunięte z listy i nie można ich dodać ponownie.</p></div><button class=\"close\" onclick=\"closeModal()\">×</button></div><div class=\"form\"><label>Co aktualizujesz?${selectionGrid('updateOptions',UPDATE_OPTIONS.map(x=>x[1]),[])}</label><label>Dodaj nowe języki${availableLanguages.length?selectionGrid('updateLanguages',availableLanguages,[]):'<div class=\"empty\">Produkt ma już wszystkie dostępne języki.</div>'}</label><div class=\"card\"><h3>💰 Koszt bazowy</h3><div class=\"metric\">${money(base)}</div><p class=\"muted\">Języki są dodawane do już posiadanych — nie zastępują wcześniejszych.</p></div><button onclick=\"confirmProductUpdate(${i},${base})\">🚀 Wdróż aktualizację</button></div>`) }
function confirmProductUpdate(i,base){const p=S.products[i],opts=checkedValues('updateOptions'),langs=checkedValues('updateLanguages');if(!opts.length)return toast('Wybierz aktualizację');const existing=new Set(p.languages||[]);const newLangs=langs.filter(x=>!existing.has(x));const cost=Math.round(base*(1+Math.max(0,opts.length-1)*.55));if(!spend(cost,'aktualizacja produktu'))return;let usersMult=1,valueBonus=0,rating=0;opts.forEach(label=>{const o=UPDATE_OPTIONS.find(x=>x[1]===label);if(!o)return;if(o[0]==='bugs')rating+=3;if(o[0]==='content')usersMult*=1.14;if(o[0]==='ai'){rating+=8;p.aiLevel=(p.aiLevel||0)+1}if(o[0]==='features')valueBonus+=.18;if(o[0]==='performance')usersMult*=1.09;if(o[0]==='security'){rating+=3;S.reputation=Math.min(100,S.reputation+3)}if(o[0]==='design')rating+=4;if(['ads','mobile','localization','accessibility'].includes(o[0]))usersMult*=o[0]==='ads'?1.10:o[0]==='mobile'?1.12:o[0]==='localization'?1.08:1.04;if(['cloud','hardware','analytics','subscriptions'].includes(o[0]))valueBonus+=o[3]||.1});p.languages=[...(p.languages||[]),...newLangs];p.languages=[...new Set(p.languages)];p.users=Math.round(p.users*usersMult);p.rating=Math.min(100,p.rating+rating);p.value=Math.round(p.value*(1+valueBonus)+cost*4);p.version='v'+((parseInt(String(p.version).replace(/[^0-9]/g,''))||1)+1)+'.0';p.updates=(p.updates||0)+1;p.updatesLog.unshift({day:S.day,options:opts,langs:newLangs,cost});save();closeModal();render();toast(`🔄 ${p.name}: ${opts.length} zmian${newLangs.length?` · +${newLangs.length} jęz.`:''}`)}
function openProductAssignment(i){const p=S.products[i];if(!p)return toast('Nie znaleziono produktu');repairProductOwnership(S);openModal(`<div class="modalHead"><div><h2>🏢 Właściciel produktu</h2><p class="muted">Produkt może należeć do NEXORA albo jednej konkretnej spółki córki.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>Przypisz do<select id="assignOwner"><option value="NEXORA" ${p.ownerId==='NEXORA'?'selected':''}>NEXORA</option>${S.subsidiaries.map(c=>`<option value="${escapeHtml(c.id)}" ${p.ownerId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></label><button onclick="assignProduct(${i})">💾 Zapisz właściciela</button></div>`)}
function assignProduct(i){const p=S.products[i],el=document.getElementById('assignOwner');if(!p||!el)return toast('Nie znaleziono produktu');const id=el.value||'NEXORA';if(!S.subsidiaries.some(c=>c.id===id)&&id!=='NEXORA')return toast('Nieprawidłowa spółka');if(!setProductOwner(p.id,id))return toast('Nie udało się przypisać produktu');save();closeModal();render();toast(`📦 ${p.name} → ${ownerName(id)}`)}
function buyGPU(){if(spend(35000,'zakup GPU')){S.gpu++;save();render();toast(`🧩 GPU: ${S.gpu}`)}}
function upgradeGPU(){const cost=gpuUpgradeCost();if(spend(cost,'ulepszenie GPU')){S.gpuLevel++;S.gpu+=5;S.models.forEach(m=>m.quality=Math.min(100,(m.quality||70)+1));save();render();toast(`⚡ GPU ulepszone: poziom ${S.gpuLevel}, ${S.gpu} GPU`)}}
function buildEngine(name){const e=ENGINE_TYPES.find(x=>x[0]===name);if(!e||S.engines.some(x=>x.name===name))return toast('Silnik jest już zbudowany');if(!spend(e[3],'budowa silnika'))return;S.engines.push({name,level:1,version:'v1.0',updates:0});S.events.unshift(`⚙️ Zbudowano ${name} v1.0`);save();render();toast(`⚙️ ${name} gotowy`)}
function upgradeEngine(name){const owned=S.engines.find(x=>x.name===name),e=ENGINE_TYPES.find(x=>x[0]===name);if(!owned||!e)return toast('Nie znaleziono silnika');if(owned.level>=100)return toast('Silnik osiągnął maksymalny poziom 100');const cost=Math.round(e[3]*(0.55+owned.level*0.08));if(!spend(cost,'aktualizacja silnika'))return;owned.level++;owned.updates++;owned.version='v'+owned.level+'.0';owned.lastUpgradeDay=S.day;S.events.unshift(`🔧 Zaktualizowano ${name} do ${owned.version}`);save();render();toast(`🔧 ${name} → ${owned.version} (+${Math.round(e[4]*(1+0.10*(owned.level-1))*100)}% bonusu)`)}
function trainAI(){if(S.gpu-S.gpuUsed<5)return toast('Potrzebujesz 5 wolnych GPU');if(!spend(25000,'trening AI'))return;S.gpuUsed+=5;const m={id:uid(),name:'NEXORA Neural '+(S.models.length+1),params:4+Math.floor(Math.random()*22),quality:70+Math.floor(Math.random()*30),status:'TRENING',architecture:['Transformer','Multimodal','Agentic','Neural Search'][Math.floor(Math.random()*4)]};S.models.push(m);save();render();setTimeout(()=>{S.gpuUsed=Math.max(0,S.gpuUsed-5);m.status='GOTOWY';m.quality=Math.min(100,m.quality+2);save();render();toast('🧠 Model gotowy')},3500)}
function buyServer(){
 S.servers=Array.isArray(S.servers)?S.servers:[];
 const cost=150000+S.servers.length*50000;
 if(!spend(cost,'zakup serwera'))return;
 S.serverSerial=Math.max(Number(S.serverSerial)||1,S.servers.length+1);
 const server={id:uid(),name:'NEXORA Core-'+String(S.serverSerial).padStart(2,'0'),level:1,load:10+Math.floor(Math.random()*25),createdDay:S.day};
 S.serverSerial++;S.servers.push(server);
 save();render();toast('☁️ Dodano '+server.name+' · razem '+S.servers.length+' serwerów');
}
function upgradeServer(i){const s=S.servers[i],cost=serverUpgradeCost(s);if(spend(cost,'ulepszenie serwera')){s.level++;s.load=Math.max(5,s.load-4);save();render();toast(`${s.name} → poziom ${s.level}`)}}
function removeServer(i){if(S.servers.length<=1)return toast('Musisz mieć minimum 1 serwer');if(confirm('Usunąć serwer?')){S.servers.splice(i,1);save();render()}}
function ownerName(id){if(!id||id==='NEXORA')return S.companyName;const c=S.subsidiaries.find(x=>x.id===id);return c?c.name:S.companyName}
function subsidiaryCard(c,i){const children=S.subsidiaries.filter(x=>x.parentId===c.id);return`<div class="card"><div class="productTop"><h3>${escapeHtml(c.name)}</h3><span class="pill">${escapeHtml(c.type||'Software')}</span></div><p class="muted">${c.strategy} · nadrzędna: ${escapeHtml(ownerName(c.parentId))}</p><div class="miniGrid"><div class="mini"><span>Wartość</span><b>${money(c.value)}</b></div><div class="mini"><span>Przychód/d</span><b>${money(c.revenueDay)}</b></div><div class="mini"><span>Produkty</span><b>${(c.products||[]).length}</b></div><div class="mini"><span>Podspółki</span><b>${children.length}</b></div></div><div class="actions"><button class="small" onclick="manageSub(${i})">Zarządzaj</button><button class="small secondary" onclick="createSubsidiary(${i})">＋ Podspółka</button><button class="small danger" onclick="closeSub(${i})">Zamknij</button></div>${children.length?`<div class="subtree">${children.map(x=>subsidiaryCard(x,S.subsidiaries.indexOf(x))).join('')}</div>`:''}</div>`}
function createSubsidiary(parentIndex=null){const parentId=parentIndex!=null?S.subsidiaries[parentIndex]?.id:null;openModal(`<div class="modalHead"><div><h2>🏢 Nowa spółka</h2><p class="muted">Pełna konfiguracja i możliwość tworzenia podspółek.</p></div><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>Nazwa<input id="subName" placeholder="np. NEXORA Cloud"></label><label>Typ<select id="subType">${['AI','Cloud','Software','Hardware','Media','Cybersecurity','Gaming','Fintech','Robotics'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Strategia<select id="subStrategy"><option>Wzrost</option><option>Zysk</option><option>Innowacje</option><option>Ekspansja</option></select></label><label>Spółka nadrzędna<select id="subParent"><option value="">NEXORA</option>${S.subsidiaries.map(c=>`<option value="${c.id}" ${parentId===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></label><label>Kapitał startowy<input id="subBudget" type="number" min="50000" step="10000" value="150000"></label><label>Przypisz istniejące produkty${selectionGrid('subProducts',S.products.map(p=>p.id),[])}</label><button onclick="confirmCreateSubsidiary()">🏢 Utwórz spółkę</button></div>`)}
function confirmCreateSubsidiary(){const name=document.getElementById('subName').value.trim(),type=document.getElementById('subType').value,strategy=document.getElementById('subStrategy').value,parentId=document.getElementById('subParent').value||null,budget=Math.max(50000,Number(document.getElementById('subBudget').value)||150000),prodIds=checkedValues('subProducts');if(!name)return toast('Podaj nazwę');if(!spend(budget,'kapitał spółki'))return;const c={id:uid(),name,type,strategy,parentId,value:budget*3,revenueDay:Math.round(budget*.035),capital:budget,products:[],children:[]};S.subsidiaries.push(c);prodIds.forEach(id=>{const p=S.products.find(x=>x.id===id);if(p)assignProductToSub(p,c)});save();closeModal();render();toast('◆ Utworzono '+name)}
function assignProductToSub(p,c){if(!p||!c)return;setProductOwner(p.id,c.id)}
function manageSub(i){const c=S.subsidiaries[i];openModal(`<div class="modalHead"><div><h2>⚙ ${escapeHtml(c.name)}</h2><p class="muted">${c.type} · nadrzędna: ${escapeHtml(ownerName(c.parentId))}</p></div><button class="close" onclick="closeModal()">×</button></div><div class="grid">${stat('Wartość',money(c.value),'kapitał')}${stat('Przychód/d',money(c.revenueDay),'operacyjny')}${stat('Produkty',(c.products||[]).length,'przypisane')}${stat('Podspółki',S.subsidiaries.filter(x=>x.parentId===c.id).length,'poziom niżej')}</div><div class="actions"><button onclick="subInvest(${i})">Zainwestuj $100k</button><button onclick="subStrategy(${i})">Zmień strategię</button><button onclick="openSubProducts(${i})">📦 Produkty</button><button onclick="createSubsidiary(${i})">＋ Utwórz podspółkę</button></div>`)}
function openSubProducts(i){const c=S.subsidiaries[i];openModal(`<div class="modalHead"><h2>📦 Produkty — ${escapeHtml(c.name)}</h2><button class="close" onclick="closeModal()">×</button></div>${S.products.map((p,j)=>`<label class="check"><input type="checkbox" id="subprod${j}" ${p.ownerId===c.id?'checked':''}>${escapeHtml(p.name)} · ${p.type}</label>`).join('')||'<div class="empty">Brak produktów</div>'}<div class="actions"><button onclick="saveSubProducts(${i})">Zapisz</button></div>`)}
function saveSubProducts(i){const c=S.subsidiaries[i];if(!c)return;S.products.forEach((p,j)=>{const b=document.getElementById('subprod'+j);if(b?.checked)setProductOwner(p.id,c.id);else if(p.ownerId===c.id)setProductOwner(p.id,'NEXORA')});repairProductOwnership();save();closeModal();render();toast('📦 Przypisania zapisane')}
function subInvest(i){if(spend(100000,'inwestycja w spółkę')){const c=S.subsidiaries[i];c.capital+=100000;c.value+=150000;c.revenueDay+=1500;closeModal();save();render();toast('Kapitał przekazany')}}
function subStrategy(i){const c=S.subsidiaries[i];c.strategy=c.strategy==='Wzrost'?'Zysk':c.strategy==='Zysk'?'Innowacje':'Wzrost';closeModal();save();render()}
function closeSub(i){const id=S.subsidiaries[i].id;if(confirm('Zamknąć spółkę?')){const gone=new Set([id]);let changed=true;while(changed){changed=false;S.subsidiaries.forEach(c=>{if(c.parentId&&gone.has(c.parentId)&&!gone.has(c.id)){gone.add(c.id);changed=true}})}S.products.forEach(p=>{if(gone.has(p.ownerId))setProductOwner(p.id,'NEXORA')});S.subsidiaries=S.subsidiaries.filter(c=>!gone.has(c.id));repairProductOwnership();save();render();toast('🏢 Spółka zamknięta — produkty wróciły do NEXORA')}}
function openCompany(i){const c=S.companies[i];if(!c)return;openCompanyById(c.id)}
function openCompanyById(id){
 syncMarketCompanies();
 const ci=S.companies.findIndex(c=>c.id===id);if(ci<0)return toast('Ta firma nie jest już na giełdzie');
 const c=S.companies[ci];normalize(c);
 openModal(`<div class="modalHead"><div><h2>📈 ${escapeHtml(c.name)} <span class="pill">${c.ticker}</span></h2><p class="muted">Cena jednego udziału: <b>${money(c.price)}</b> · dokładnie 100 udziałów</p></div><button class="close" onclick="closeModal()">×</button></div><div class="grid">${stat('NEXORA',playerShares(c)+'%','udziały')}${stat('Wartość pakietu',money(playerShares(c)*c.price),'portfel')}${stat('Kontrola',c.controlled?'TAK':'NIE',c.controlled?'panel odblokowany':'potrzebujesz 51%',c.controlled)}</div><h3>Lista inwestorów <span class="pill">${shareholderCount(c)}</span></h3><div class="list">${c.holders.map(h=>`<div class="row"><div><strong>${escapeHtml(h[0])}</strong><small>${num(h[1])} udziałów · ${money(h[1]*c.price)}</small></div>${h[0]!=='NEXORA'&&h[1]>0?`<button class="small" onclick="openBuySharesById('${c.id}','${escapeHtml(h[0])}')">Kup od inwestora</button>`:''}</div>`).join('')}</div><div class="actions">${playerShares(c)>0?`<input id="sellQty" type="number" min="1" max="${playerShares(c)}" value="1" style="width:120px"><button class="secondary" onclick="sellSharesById('${c.id}')">Sprzedaj</button>`:''}${c.controlled?`<button class="good" onclick="manageControlledById('${c.id}')">⚙ Zarządzaj firmą</button>`:''}${playerShares(c)<100?`<button class="danger" onclick="buyoutById('${c.id}')">Wykup całą resztę</button>`:''}</div>`);
}
function openBuyShares(ci,hi){const c=S.companies[ci];if(!c)return;const h=c.holders[hi];if(!h)return;openBuySharesById(c.id,h[0])}
function openBuySharesById(companyId,sellerName){
 const c=S.companies.find(x=>x.id===companyId);if(!c)return toast('Firma nie jest już na giełdzie');
 const h=c.holders.find(x=>x[0]===sellerName);if(!h||sellerName==='NEXORA'||h[1]<=0)return toast('Ten inwestor nie ma już udziałów');
 const safeName=escapeHtml(sellerName);
 openModal(`<div class="modalHead"><div><h2>💰 Kup udziały</h2><p class="muted">${safeName} · cena za udział: <b>${money(c.price)}</b></p></div><button class="close" onclick="closeModal()">×</button></div><div class="form"><label>Liczba udziałów<input id="buyQty" type="number" min="1" max="${h[1]}" value="1" oninput="updateBuyTotal('${c.id}','${safeName}',this.value)"></label><div class="card"><div class="metric" id="buyTotal">${money(c.price)}</div><p class="muted">Dostępne u inwestora: <span id="buyAvailable">${num(h[1])}</span></p></div><button onclick="confirmBuySharesById('${c.id}','${safeName}')">Kup udziały</button></div>`);
}
function updateBuyTotal(companyId,sellerName,value){const c=S.companies.find(x=>x.id===companyId);if(!c)return;const h=c.holders.find(x=>x[0]===sellerName)||c.holders.find(x=>escapeHtml(x[0])===sellerName);const q=Math.max(0,Math.min(Math.floor(Number(h?.[1]||0)),Math.floor(Number(value)||0)));const total=document.getElementById('buyTotal');if(total)total.textContent=money(q*c.price);const av=document.getElementById('buyAvailable');if(av&&h)av.textContent=num(h[1])}
function confirmBuyShares(ci,hi){const c=S.companies[ci];if(!c)return;const h=c.holders[hi];if(h)confirmBuySharesById(c.id,h[0])}
function confirmBuySharesById(companyId,sellerName){
 const c=S.companies.find(x=>x.id===companyId);if(!c)return toast('Firma nie jest już na giełdzie');
 const h=c.holders.find(x=>x[0]===sellerName);if(!h||sellerName==='NEXORA'||h[1]<=0)return toast('Ten inwestor nie ma już udziałów');
 const q=Math.max(1,Math.min(Math.floor(h[1]),Math.floor(Number(document.getElementById('buyQty')?.value)||1)));
 const cost=Math.round(q*c.price*100)/100;if(!spend(cost,'zakup udziałów'))return;
 if(!transferShares(c,sellerName,'NEXORA',q)){earn(cost,'zwrot za błędną transakcję');return toast('Transakcja anulowana — liczba udziałów pozostała bez zmian')}
 save();closeModal();render();openCompanyById(c.id);toast(`Kupiono ${q} udziałów ${c.ticker} od ${sellerName}`);
}
function sellShares(i){const c=S.companies[i];if(c)sellSharesById(c.id)}
function sellSharesById(companyId){
 const c=S.companies.find(x=>x.id===companyId);if(!c)return toast('Firma nie jest już na giełdzie');
 const ph=c.holders.find(x=>x[0]==='NEXORA');
 const q=Math.min(Math.floor(Number(document.getElementById('sellQty')?.value)||0),Math.floor(ph?.[1]||0));
 if(q<=0)return toast('Podaj liczbę udziałów');
 const pub=c.holders.find(x=>x[0]==='Public Investors');
 const buyer=pub||['Public Investors',0];if(!pub)c.holders.push(buyer);
 if(!transferShares(c,'NEXORA','Public Investors',q)){if(!pub)c.holders=c.holders.filter(h=>h!==buyer);return toast('Nie udało się sprzedać udziałów')}
 earn(q*c.price,'sprzedaż udziałów');save();render();openCompanyById(c.id);toast(`Sprzedano ${q} udziałów ${c.ticker}`);
}
function buyout(i){const c=S.companies[i];if(c)buyoutById(c.id)}
function buyoutById(companyId){
 syncMarketCompanies();const c=S.companies.find(x=>x.id===companyId);if(!c)return toast('Firma nie jest już na giełdzie');normalize(c);
 const q=100-playerShares(c);if(q<=0)return toast('Masz już 100% udziałów');const cost=Math.round(q*c.price*100)/100;if(!spend(cost,'wykup firmy'))return;
 c.holders=[['NEXORA',100]];c.owned=100;c.controlled=true;c.acquired=true;c.merged=false;
 if(!S.acquiredCompanies.some(x=>x.id===c.id))S.acquiredCompanies.push(c);S.companies=S.companies.filter(x=>x.id!==c.id);
 save();closeModal();render();toast(`🏆 ${c.name} przejęta w 100% — firma zniknęła z giełdy`);
}
function manageControlled(i){const c=S.companies[i];if(c)manageControlledById(c.id)}
function manageControlledById(companyId){
 const c=S.companies.find(x=>x.id===companyId);if(!c)return toast('Firma nie jest już na giełdzie');normalize(c);
 openModal(`<div class="modalHead"><h2>⚙ Zarządzanie: ${escapeHtml(c.name)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="card"><h3>Kontrola właścicielska</h3><p class="muted">NEXORA posiada ${playerShares(c)}%. Panel zarządzania jest odblokowany od 51%.</p></div><div class="actions"><button onclick="changeCompanyStrategyById('${c.id}')">Strategia: ${escapeHtml(c.strategy)}</button><button onclick="injectCapitalById('${c.id}')">Zainwestuj $100k</button><button class="danger" onclick="mergeCompanyById('${c.id}')">Połącz z NEXORA</button></div>`);
}
function changeCompanyStrategy(i){const c=S.companies[i];if(c)changeCompanyStrategyById(c.id)}
function changeCompanyStrategyById(companyId){const c=S.companies.find(x=>x.id===companyId);if(!c)return;c.strategy=c.strategy==='Wzrost'?'Zysk':'Wzrost';save();closeModal();render();openCompanyById(c.id)}
function injectCapital(i){const c=S.companies[i];if(c)injectCapitalById(c.id)}
function injectCapitalById(companyId){const c=S.companies.find(x=>x.id===companyId);if(!c)return;if(spend(100000,'kapitał firmy')){c.capital=(c.capital||0)+100000;c.price=Math.round(c.price*1.04*100)/100;save();closeModal();render();openCompanyById(c.id)}}
function mergeCompany(i){const c=S.companies[i];if(c)mergeCompanyById(c.id)}
function mergeCompanyById(companyId){
 syncMarketCompanies();const c=S.companies.find(x=>x.id===companyId);if(!c)return toast('Firma nie jest już na giełdzie');normalize(c);if(!c.controlled)return toast('Najpierw zdobądź minimum 51% udziałów');
 c.holders=[['NEXORA',100]];c.owned=100;c.controlled=true;c.acquired=true;c.merged=true;
 if(!S.acquiredCompanies.some(x=>x.id===c.id))S.acquiredCompanies.push(c);S.companies=S.companies.filter(x=>x.id!==c.id);
 save();closeModal();render();toast(`🔗 ${c.name} połączona z NEXORA — usunięto ją z giełdy`);
}
function expandCountry(region){const cost=region==='Polska'?0:50000+Math.round(Math.random()*950000);if(!spend(cost,'ekspansja'))return;S.regions[region]=true;S.users=Math.round(S.users*(region==='Stany Zjednoczone'?1.18:1.05));S.reputation=Math.min(100,S.reputation+1);save();render();toast('🌍 Otworzono '+region)}
function filterCountries(){const q=document.getElementById('countrySearch').value.toLowerCase();document.querySelectorAll('.countryRow').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'flex':'none')}
function research(name,cost){if(S.technologies.includes(name)||S.researchPoints<cost)return;S.researchPoints-=cost;S.technologies.push(name);save();render();toast('✦ Odblokowano '+name)}
function toggleCheats(force){const o=document.getElementById('cheatOverlay');if(!o)return;const open=typeof force==='boolean'?force:!o.classList.contains('open');o.classList.toggle('open',open);if(open)setTimeout(()=>{const i=document.getElementById('cheatInput');if(i){i.focus();i.select()}},50)}
function executeCheatText(text){const i=document.getElementById('cheatInput');if(i)i.value=text;executeCheat()}
function executeCheat(){
 const input=document.getElementById('cheatInput');
 if(!input)return;
 const raw=input.value.trim();
 if(!raw)return;
 const x=raw.split(/\s+/),cmd=(x[0]||'').toLowerCase(),v=Number(x[1]);
 let msg='Nieznana komenda';
 if(cmd==='money'&&Number.isFinite(v)){changeCash(v,'cheat');msg='Dodano '+money(v)}
 else if(cmd==='users'&&Number.isFinite(v)){S.users=Math.max(0,S.users+v);msg='Dodano '+num(v)}
 else if(cmd==='gpu'&&Number.isFinite(v)){S.gpu=Math.max(0,S.gpu+v);msg='Dodano '+v+' GPU'}
 else if(cmd==='maxgpu'){S.gpu=10000;S.gpuLevel=100;msg='MAX GPU: 10 000 / lvl 100'}
 else if(cmd==='employees'&&Number.isFinite(v)){cheatAddEmployees(v);msg='Pracownicy: '+S.employees.length}
 else if(cmd==='maxemployees'||cmd==='maxworkers'){cheatMaxEmployees();msg='MAX pracownicy: '+S.employees.length}

 else if(cmd==='rp'&&Number.isFinite(v)){S.researchPoints+=v;msg='Dodano '+v+' RP'}
 else if(cmd==='office'&&Number.isFinite(v)){cheatSetOffice(v);msg='HQ ustawione na lvl '+S.office.level}
 else if(cmd==='rich'){S.cash+=100000000;S.users+=10000000;S.gpu+=500;msg='RICH: +$100M, +10M users, +500 GPU'}
 else if(cmd==='unlockall'){S.technologies=TECHS.map(t=>t[0]);COUNTRIES.forEach(c=>S.regions[c]=true);S.reputation=100;S.office.level=100;msg='Odblokowano wszystko'}
 document.getElementById('consoleLog').textContent='> '+raw+'\n'+msg;
 save();render();toast(msg);
 input.value='';
 input.focus();
}
document.getElementById('cheatInput').addEventListener('keydown',e=>{if(e.key==='Enter')executeCheat();if(e.key==='Escape')toggleCheats()});document.addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();toggleCheats()}if(e.key==='Escape'){closeModal();document.getElementById('cheatOverlay').classList.remove('open')}});
render();

/* NEXORA SAVE ENGINE v14 — trwały zapis + ręczna kopia */
const NEXORA_IDB='NEXORA_SAVE_DB_V14';
function nexoraIDB(){return new Promise((resolve,reject)=>{try{const r=indexedDB.open(NEXORA_IDB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('save'))r.result.createObjectStore('save');};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}catch(e){reject(e)}})}
function nexoraIDBWrite(snapshot){return nexoraIDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('save','readwrite');tx.objectStore('save').put(snapshot,'current');tx.oncomplete=()=>{db.close();res(true)};tx.onerror=()=>{db.close();rej(tx.error)}})).catch(e=>{console.warn('IDB write',e);return false})}
function nexoraIDBRead(){return nexoraIDB().then(db=>new Promise((res,rej)=>{const tx=db.transaction('save','readonly');const q=tx.objectStore('save').get('current');q.onsuccess=()=>{db.close();res(q.result||null)};q.onerror=()=>{db.close();rej(q.error)}})).catch(()=>null)}
async function nexoraRecover(){const raw=await nexoraIDBRead();if(!raw)return false;try{const x=JSON.parse(raw);if(!x)return false;const idbTime=Number(x._savedAt||0),localTime=Number(S._savedAt||0);if(idbTime>localTime){S=migrate(x);try{localStorage.setItem(KEY,raw);localStorage.setItem(BACKUP_KEY,raw)}catch(e){}render();toast('♻️ Przywrócono zapis');return true}}catch(e){console.warn('IDB recover',e)}return false}
function save(show=false){try{repairProductOwnership(S);S._savedAt=Date.now();const snapshot=JSON.stringify(S);localStorage.setItem(KEY,snapshot);localStorage.setItem(BACKUP_KEY,snapshot);nexoraIDBWrite(snapshot);if(show)toast('💾 Zapisano')}catch(e){console.error('NEXORA save failed',e);if(show)toast('⚠️ Błąd zapisu')}}
function exportSave(){try{save(false);const blob=new Blob([JSON.stringify({app:'NEXORA',version:SAVE_VERSION,savedAt:S._savedAt,state:S},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='NEXORA-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('⬇️ Kopia zapisu pobrana')}catch(e){toast('⚠️ Nie udało się wyeksportować zapisu')}}
function importSaveFile(input){const file=input.files&&input.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const raw=JSON.parse(r.result);const state=raw&&raw.state?raw.state:raw;if(!state||typeof state!=='object'||!Array.isArray(state.products))throw new Error('Nieprawidłowy zapis');S=migrate(state);S._savedAt=Date.now();save(false);render();toast('⬆️ Zapis wczytany')}catch(e){console.error(e);toast('⚠️ Nieprawidłowy plik zapisu')}};r.readAsText(file);input.value=''}
function savePanel(){return `<div class="card section"><div class="sectionTitle"><div><h2>💾 Zapis gry</h2><p class="muted">Postęp zapisuje się automatycznie. Możesz też zrobić niezależną kopię pliku.</p></div><span class="pill">AUTO</span></div><div class="actions"><button onclick="save(true)">💾 Zapisz teraz</button><button class="secondary" onclick="exportSave()">⬇️ Eksportuj zapis</button><button class="secondary" onclick="document.getElementById('saveImport').click()">⬆️ Wczytaj zapis</button><input id="saveImport" type="file" accept="application/json,.json" style="display:none" onchange="importSaveFile(this)"></div><small class="muted">Ostatni zapis: ${S._savedAt?new Date(S._savedAt).toLocaleString('pl-PL'):'brak'}</small></div>`}
window.addEventListener('beforeunload',()=>{try{save(false)}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')try{save(false)}catch(e){}});
setInterval(()=>save(false),5000);
/* Nie zapisuj pustego stanu przy starcie. Najpierw próbujemy odzyskać starszą kopię z IDB. */
setTimeout(async()=>{const recovered=await nexoraRecover();if(!recovered&& !S._savedAt)save(false);},250);
</script>
