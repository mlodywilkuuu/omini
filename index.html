function newCompany(i){let nm=names[i%names.length],id='ai'+i;return {id,name:nm,ticker:nm.replace(/[^A-Z]/gi,'').slice(0,4).toUpperCase(),sector:sectors[i%sectors.length],shares:10000,price:Math.round(600+Math.random()*8000),value:0,owned:0,ownedByPlayer:false,listed:true,generated:true,change:0,shareholders:[],cash:500000+Math.random()*2500000,parcels:Math.round(80+Math.random()*1800),lockers:Math.round(Math.random()*60),depots:1+Math.floor(Math.random()*5),vans:2+Math.floor(Math.random()*40),employees:8+Math.floor(Math.random()*100),growth:.5+Math.random()*2.5,parentId:null,subs:[],level:1,expansionStrategy:'balanced',expansionPace:'normal',hiringPolicy:'normal',investmentBudget:35,targetRegion:'Polska'};}
function seed(){let firms=[];for(let i=0;i<8;i++){let c=newCompany(i);c.shareholders=[{name:'Założyciel',shares:3000},{name:'Fundusz Północny',shares:2500},{name:'Inwestor prywatny',shares:2000},{name:'Fundusz Rozwoju',shares:1500},{name:'Drobni inwestorzy',shares:1000}];c.value=c.price*c.shares;firms.push(c)}return {day:1,cash:500000,bank:500000,debt:0,companies:firms,assets:[],activity:[{day:1,title:'Start działalności',desc:'Masz 500 000 zł kapitału. Nie posiadasz jeszcze żadnej infrastruktury.'}],history:[500000],speed:1,paused:false,selected:'overview',nextCompany:4,playerShares:{},mapCenter:[52.1,19.4]}}
let s;try{s=JSON.parse(localStorage.getItem('logistics_tycoon_v2'))||seed()}catch(e){s=seed()}
if(!Array.isArray(s.assets))s.assets=[];if(!Array.isArray(s.routes))s.routes=[];if(!Array.isArray(s.companies))s.companies=seed().companies;s.companies.forEach(c=>{if(!Array.isArray(c.shareholders))c.shareholders=[{name:'Założyciel',shares:Math.floor(c.shares*.3)},{name:'Fundusz inwestycyjny',shares:Math.floor(c.shares*.25)},{name:'Inwestorzy indywidualni',shares:c.shares-Math.floor(c.shares*.55)}];if(!c.value)c.value=c.price*c.shares});
function save(){localStorage.setItem('logistics_tycoon_v2',JSON.stringify(s))}
function log(title,desc){s.activity.unshift({day:s.day,title,desc});s.activity=s.activity.slice(0,30)}
function ownedCompanies(){return s.companies.filter(c=>c.ownedByPlayer)}
const geoMarkets=[{continent:'Europa',countries:['Polska','Niemcy','Czechy','Słowacja','Litwa','Łotwa','Estonia','Ukraina','Francja','Hiszpania','Włochy','Holandia','Belgia','Austria','Rumunia','Węgry','Szwecja','Norwegia','Dania','Finlandia','Portugalia','Grecja','Chorwacja','Bułgaria','Szwajcaria','Irlandia','Wielka Brytania']},{continent:'Azja',countries:['Chiny','Japonia','Indie','Korea Południowa','Turcja','Kazachstan','ZEA','Arabia Saudyjska','Singapur','Tajlandia','Wietnam','Indonezja']},{continent:'Ameryka Północna',countries:['USA','Kanada','Meksyk']},{continent:'Ameryka Południowa',countries:['Brazylia','Argentyna','Chile','Kolumbia','Peru']},{continent:'Afryka',countries:['Egipt','Maroko','RPA','Nigeria','Kenia']},{continent:'Oceania',countries:['Australia','Nowa Zelandia']}];
function managementPanel(){let list=ownedCompanies();if(!list.length)return '<section class="panel"><div class="ph"><b>PANEL ZARZĄDZANIA GRUPĄ</b><span class="tag warn">ZABLOKOWANY</span></div><p class="muted" style="font-size:10px">Zdobądź ponad 50% udziałów w dowolnej spółce, aby odblokować jej panel zarządzania. Przejęta firma nadal samodzielnie prowadzi codzienną działalność.</p></section>';return list.map(c=>'<section class="panel"><div class="ph"><b>⚙ ZARZĄDZANIE · '+c.name+'</b><span class="tag good">KONTROLA '+(100*(s.playerShares[c.id]||0)/c.shares).toFixed(1)+'%</span></div><div class="grid2"><div><div class="field"><label>STRATEGIA EKSPANSJI</label><select onchange="setCompanyPolicy(\''+c.id+'\',\'expansionStrategy\',this.value)"><option value="balanced" '+(c.expansionStrategy==='balanced'?'selected':'')+'>Zrównoważona</option><option value="lockers" '+(c.expansionStrategy==='lockers'?'selected':'')+'>Sieć automatów paczkowych</option><option value="depots" '+(c.expansionStrategy==='depots'?'selected':'')+'>Centra i sortownie</option><option value="fleet" '+(c.expansionStrategy==='fleet'?'selected':'')+'>Flota i transport</option><option value="regional" '+(c.expansionStrategy==='regional'?'selected':'')+'>Ekspansja regionalna</option></select></div><div class="field"><label>TEMPO ROZWOJU</label><select onchange="setCompanyPolicy(\''+c.id+'\',\'expansionPace\',this.value)"><option value="slow" '+(c.expansionPace==='slow'?'selected':'')+'>Ostrożne</option><option value="normal" '+(c.expansionPace==='normal'?'selected':'')+'>Normalne</option><option value="fast" '+(c.expansionPace==='fast'?'selected':'')+'>Agresywne</option></select></div></div><div><div class="field"><label>POLITYKA ZATRUDNIENIA</label><select onchange="setCompanyPolicy(\''+c.id+'\',\'hiringPolicy\',this.value)"><option value="lean" '+(c.hiringPolicy==='lean'?'selected':'')+'>Oszczędna</option><option value="normal" '+(c.hiringPolicy==='normal'?'selected':'')+'>Normalna</option><option value="growth" '+(c.hiringPolicy==='growth'?'selected':'')+'>Zatrudniaj pod wzrost</option></select></div><div class="field"><label>BUDŻET INWESTYCYJNY · '+c.investmentBudget+'% PRZYCHODÓW</label><input type="range" min="5" max="80" step="5" value="'+c.investmentBudget+'" oninput="setCompanyPolicy(\''+c.id+'\',\'investmentBudget\',+this.value)"></div></div></div><div class="field"><label>OBSZAR EKSPANSJI</label><select onchange="setCompanyPolicy(\''+c.id+'\',\'targetRegion\',this.value)">'+['Polska','Północna Polska','Południowa Polska','Wschodnia Polska','Zachodnia Polska','Europa Środkowa'].map(x=>'<option '+(c.targetRegion===x?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="notice">Firma samodzielnie rekrutuje, kupuje pojazdy i rozbudowuje infrastrukturę. Aktualnie: '+number(c.employees)+' pracowników · '+number(c.vans)+' pojazdów · '+number(c.depots)+' centrów · '+number(c.lockers)+' automatów · gotówka '+money(c.cash)+'.</div><div class="ph"><b>SPÓŁKI CÓRKI I RYNKI</b><button class="btn primary" onclick="openSubsidiary(\''+c.id+'\')">+ Nowa spółka córka</button></div><div class="muted" style="font-size:9px">'+(c.subs||[]).map(x=>x.name+' — '+x.countries.join(", ")).join("<br>")+'</div></section>').join('')}
window.openSubsidiary=function(id){let p=s.companies.find(x=>x.id===id);if(!p||!p.ownedByPlayer)return;let opts=geoMarkets.map(g=>'<option>'+g.continent+'</option>').join('');show('<h2>Nowa spółka córka · '+p.name+'</h2><p>Wybierz kontynent, aby zaznaczyć wszystkie kraje z tego regionu, albo wybierz pojedyncze państwa.</p><div class="field"><label>NAZWA SPÓŁKI</label><input id="subName" value="'+p.name+' International"></div><div class="field"><label>KONTYNENT</label><select id="subContinent" onchange="selectContinentCountries()">'+opts+'</select></div><div class="actions"><button class="btn" onclick="selectContinentCountries()">Zaznacz wszystkie kraje kontynentu</button><button class="btn" onclick="clearCountrySelection()">Wyczyść wybór</button></div><div id="countryChoices" class="featuregrid" style="margin-top:12px"></div><div class="actions"><button class="btn" onclick="openShares(\''+id+'\')">Anuluj</button><button class="btn primary" onclick="createSubsidiary(\''+id+'\')">Utwórz spółkę córkę</button></div>');renderCountryChoices();};
window.renderCountryChoices=function(){let el=$('countryChoices');if(!el)return;let cont=$('subContinent').value,g=geoMarkets.find(x=>x.continent===cont);el.innerHTML=g.countries.map(country=>'<label class="feature"><input type="checkbox" class="country-check" value="'+country+'"> '+country+'</label>').join('');};
window.selectContinentCountries=function(){renderCountryChoices();document.querySelectorAll('.country-check').forEach(x=>x.checked=true)};
window.clearCountrySelection=function(){document.querySelectorAll('.country-check').forEach(x=>x.checked=false)};
window.createSubsidiary=function(id){let p=s.companies.find(x=>x.id===id);let countries=[...document.querySelectorAll('.country-check:checked')].map(x=>x.value);if(!countries.length){toast('Zaznacz co najmniej jeden kraj.');return}let name=$('subName').value.trim();if(!name){toast('Wpisz nazwę spółki.');return}let continent=geoMarkets.find(g=>g.countries.includes(countries[0])).continent;p.subs=p.subs||[];p.subs.push({id:uid(),name,countries,continent,cash:100000,employees:5,depots:0,vans:1,lockers:0,parcels:30,level:1});log('Utworzono spółkę córkę: '+name,countries.join(', '));save();closeModal();render();toast('Spółka córka została utworzona.')};
function subsidiaryManagement(){let rows=ownedCompanies().flatMap(c=>(c.subs||[]).map(sub=>'<div class="shareholder"><div style="flex:1"><b>'+sub.name+'</b><small style="display:block;color:#91a1b5">'+sub.continent+' · '+sub.countries.join(', ')+'</small></div><button class="btn" onclick="editSubsidiary(\''+c.id+'\',\''+sub.id+'\')">Edytuj spółkę córkę</button></div>'));return '<section class="panel"><div class="ph"><b>SPÓŁKI CÓRKI · EDYCJA</b></div>'+(rows.join('')||'<p class="muted">Nie masz jeszcze spółek córek.</p>')+'</section>'}
window.editSubsidiary=function(parentId,subId){let p=s.companies.find(x=>x.id===parentId),sub=p?.subs?.find(x=>x.id===subId);if(!sub)return;show('<h2>Edytuj spółkę córkę</h2><div class="field"><label>NAZWA</label><input id="editSubName" value="'+sub.name+'"></div><div class="field"><label>KONTYNENT</label><select id="editSubContinent">'+geoMarkets.map(g=>'<option '+(g.continent===sub.continent?'selected':'')+'>'+g.continent+'</option>').join('')+'</select></div><div class="field"><label>KRAJE DZIAŁALNOŚCI (oddziel przecinkami)</label><textarea id="editSubCountries" rows="3">'+sub.countries.join(', ')+'</textarea></div><div class="actions"><button class="btn" onclick="closeModal()">Anuluj</button><button class="btn primary" onclick="saveSubsidiary(\''+parentId+'\',\''+subId+'\')">Zapisz zmiany</button></div>')}
window.saveSubsidiary=function(parentId,subId){let p=s.companies.find(x=>x.id===parentId),sub=p?.subs?.find(x=>x.id===subId);if(!sub)return;let name=$('editSubName').value.trim(),countries=$('editSubCountries').value.split(',').map(x=>x.trim()).filter(Boolean);if(!name||!countries.length){toast('Podaj nazwę i co najmniej jeden kraj.');return}sub.name=name;sub.countries=countries;sub.continent=$('editSubContinent').value;save();closeModal();render();toast('Zapisano spółkę córkę.')}
window.assignAsset=function(id,key){let a=s.assets.find(x=>x.id===id);if(!a)return;a.ownerKey=key;save();toast('Zmieniono operatora obiektu.')}
window.assignLockerCenter=function(id,centerId){let a=s.assets.find(x=>x.id===id);if(!a)return;a.centerId=centerId||null;save();toast(centerId?'Paczkomat przypisany do centrum.':'Odłączono paczkomat od centrum.')}
window.createRoute=function(){let from=$('routeFrom')?.value,to=$('routeTo')?.value;if(!from||!to||from===to){toast('Wybierz dwa różne centra.');return}if((s.routes||[]).some(r=>r.from===from&&r.to===to)){toast('Taka linia już istnieje.');return}let a=s.assets.find(x=>x.id===from),b=s.assets.find(x=>x.id===to);if(!a||!b)return;let d=Math.hypot((a.coords?.[0]||0)-(b.coords?.[0]||0),(a.coords?.[1]||0)-(b.coords?.[1]||0));s.routes.push({id:uid(),from,to,travelDays:Math.max(1,Math.min(4,Math.ceil(d/2))),inTransit:null,delivered:0});save();render();toast('Uruchomiono linię przewozową.')}
window.deleteRoute=function(id){s.routes=(s.routes||[]).filter(r=>r.id!==id);save();render()}
function processRoutes(){s.assets.filter(a=>a.type==='locker'&&a.centerId).forEach(locker=>{let center=s.assets.find(a=>a.id===locker.centerId);if(center)center.parcelStock=(center.parcelStock||0)+12});(s.routes||[]).forEach(r=>{let from=s.assets.find(a=>a.id===r.from),to=s.assets.find(a=>a.id===r.to);if(!from||!to)return;if(r.inTransit){r.inTransit.daysRemaining--;if(r.inTransit.daysRemaining<=0){to.parcelStock=(to.parcelStock||0)+r.inTransit.count;r.delivered=(r.delivered||0)+r.inTransit.count;log('Dostarczono transport',r.inTransit.count+' paczek: '+from.city+' → '+to.city);r.inTransit=null}}else{let count=Math.min(from.parcelStock||0,Math.max(10,((s.assets.filter(a=>a.centerId===from.id).length)*12)));if(count>0){from.parcelStock-=count;r.inTransit={count,daysRemaining:r.travelDays};}}})}
window.setCompanyPolicy=function(id,key,value){let c=s.companies.find(x=>x.id===id);if(!c||!c.ownedByPlayer)return;c[key]=value;save();toast('Zapisano politykę '+c.name);};
function total(k){return s.assets.reduce((a,x)=>a+(x[k]||0),0)+ownedCompanies().reduce((a,c)=>a+(c[k]||0),0)}
function toast(t){let x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2600)}
function head(k,t,d,buttons=''){return '<div class="head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p>'+d+'</p></div><div>'+buttons+'</div></div>'}
function stats(){return '<div class="stats"><div class="stat"><small>GOTÓWKA GRACZA</small><strong>'+money(s.cash)+'</strong><small>Kapitał na rozwój od zera</small></div><div class="stat"><small>WARTOŚĆ MAJĄTKU</small><strong>'+money(s.assets.reduce((a,x)=>a+x.value,0))+'</strong><small>Własna infrastruktura</small></div><div class="stat"><small>SPÓŁKI POD KONTROLĄ</small><strong>'+ownedCompanies().length+'</strong><small>Przejęte i założone firmy</small></div><div class="stat"><small>INFRASTRUKTURA</small><strong>'+s.assets.length+'</strong><small>Obiektów na mapie</small></div></div>'}
function render(){if(map){map.remove();map=null;markers=[]}let pages={overview,map:mapPage,companies,market,assets,features,regions};$('content').innerHTML=(pages[s.selected]||overview)();$('pageName').textContent=({overview:'CENTRUM DOWODZENIA',map:'MAPA POLSKI',companies:'SPÓŁKI',market:'GIEŁDA',assets:'MAJĄTEK',features:'ROZWÓJ FIRMY',regions:'RYNKI I KONTYNENTY'})[s.selected];$('clock').textContent='DZIEŃ '+s.day+' · '+(s.paused?'PAUZA':'RYNEK OTWARTY');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===s.selected));if(s.selected==='map')setTimeout(initMap,80)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{s.selected=b.dataset.page;render();save()});
function overview(){return head('NOWY PRZEDSIĘBIORCA','Zbuduj firmę od zera','Zaczynasz z 500 000 zł. Nie masz firmy, pracowników, samochodów ani paczkomatów. Wszystko stawiasz samodzielnie.','<button class="btn" onclick="togglePause()">'+(s.paused?'WZNÓW':'PAUZA')+'</button>')+stats()+'<div class="notice">Twoja pierwsza decyzja: wybierz miasto na mapie i postaw pierwszy punkt. Obiekty pojawiają się na rzeczywistej mapie OpenStreetMap. Z czasem odblokujesz kolejne inwestycje.</div><div class="grid2"><section class="panel"><div class="ph"><b>PIERWSZE KROKI</b><span class="muted">PLAN ROZWOJU</span></div><div class="list">'+[['📍','Wybierz lokalizację','Mapa Polski → kliknij miejsce na mapie.'],['🏢','Załóż pierwszą bazę','Kup mały magazyn lub punkt kurierski.'],['🚐','Zdobądź flotę','Kup lub leasinguj pierwszy samochód.'],['👷','Zatrudnij ludzi','Kurierzy obsłużą dostawy.'],['📦','Zdobądź klientów','Wysyłaj paczki i rozwijaj sieć.']].map(x=>'<div class="rowitem"><b>'+x[0]+'</b><span>'+x[1]+'<small>'+x[2]+'</small></span></div>').join('')+'</div></section><section class="panel"><div class="ph"><b>OSTATNIE ZDARZENIA</b><span class="muted">DZIENNIK</span></div>'+s.activity.slice(0,8).map(a=>'<div class="shareholder"><span><b>'+a.title+'</b><small style="display:block;color:#91a1b5;margin-top:3px">'+a.desc+'</small></span><span class="pill">D'+a.day+'</span></div>').join('')+'</section></div><section class="panel"><div class="ph"><b>RYNEK KONKURENCJI</b><button class="btn" onclick="s.selected=\'market\';render()">Otwórz giełdę →</button></div><div class="muted" style="font-size:10px">Na rynku działa '+s.companies.length+' niezależnych firm. Nowe przedsiębiorstwa będą generowane automatycznie w trakcie rozgrywki.</div></section>'}
let map=null,markers=[];
function mapPage(){return head('OTWARTA MAPA','Mapa Polski — buduj w prawdziwych lokalizacjach','Kliknij wybrane miejsce, aby zobaczyć opcje inwestycji. Mapa korzysta z OpenStreetMap.', '<button class="btn" onclick="map&&map.setView([52.1,19.4],6)">Pokaż całą Polskę</button>')+stats()+`<div class="maplayout"><div id="gameMap" class="mapbox"></div><section class="panel"><div class="ph"><b>MENU BUDOWY</b><span class="muted">WYBIERZ TYP</span></div><div id="selectedPlace" class="notice">Kliknij na mapie, aby wybrać lokalizację inwestycji.</div><div class="maptools">${[['🏠','Punkt kurierski',120000,'office'],['📮','Paczkomat',18000,'locker'],['🏭','Mały magazyn',240000,'warehouse'],['🚚','Baza floty',95000,'fleet'],['🛠️','Warsztat',85000,'workshop'],['🛒','Punkt partnerski',25000,'partner'],['⚡','Ładowarka EV',32000,'charger'],['🧊','Magazyn chłodniczy',310000,'cold'],['✈️','Terminal cargo',650000,'airport'],['🚉','Hub przeładunkowy',420000,'hub']].map(a=>`<button class="btn" onclick="buildAsset('${a[3]}')">${a[0]} ${a[1]}<small style="display:block;color:#91a1b5;margin-top:3px">${money(a[2])}</small></button>`).join('')}</div><p class="maphelp">Koszty są pobierane z gotówki gracza. Kliknięcie na mapie ustawia dokładne współrzędne obiektu. Mapa korzysta z rzeczywistych danych OpenStreetMap.</p></section></div>`}
let selectedCoord=null,selectedCity='Nieznana lokalizacja';
function initMap(){if(!window.L)return;let el=$('gameMap');if(!el)return;if(map){map.invalidateSize();drawMarkers();return}map=L.map(el).setView(s.mapCenter||[52.1,19.4],6);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);map.on('click',e=>{selectedCoord=[e.latlng.lat,e.latlng.lng];selectedCity='Wybrana lokalizacja';let near=cities.sort((a,b)=>Math.hypot(a[1]-selectedCoord[0],(a[2]-selectedCoord[1])*Math.cos(selectedCoord[0]*Math.PI/180))-Math.hypot(b[1]-selectedCoord[0],(b[2]-selectedCoord[1])*Math.cos(selectedCoord[0]*Math.PI/180)))[0];if(Math.hypot(near[1]-selectedCoord[0],near[2]-selectedCoord[1])<.16)selectedCity=near[0];$('selectedPlace').innerHTML='<b>'+selectedCity+'</b><br>GPS: '+selectedCoord[0].toFixed(5)+', '+selectedCoord[1].toFixed(5)+'<br>Wybierz obiekt do zbudowania.';});drawMarkers()}
function drawMarkers(){if(!map)return;markers.forEach(m=>map.removeLayer(m));markers=[];s.assets.forEach(a=>{let m=L.marker(a.coords).addTo(map).bindPopup('<b>'+a.name+'</b><br>'+a.city+'<br>Wartość: '+money(a.value));markers.push(m)});cities.forEach(c=>{let m=L.circleMarker([c[1],c[2]],{radius:3,color:'#6e9cb8',fillOpacity:.6}).addTo(map).bindTooltip(c[0]);markers.push(m)})}
const buildTypes={office:['🏠','Punkt kurierski',120000,5,0,2,2],locker:['📮','Paczkomat',18000,0,1,0,0],warehouse:['🏭','Mały magazyn',240000,10,0,1,5],fleet:['🚚','Baza floty',95000,0,0,0,8],workshop:['🛠️','Warsztat',85000,0,0,0,3],partner:['🛒','Punkt partnerski',25000,2,1,0,0],charger:['⚡','Ładowarka EV',32000,0,0,0,0],cold:['🧊','Magazyn chłodniczy',310000,8,0,1,4],airport:['✈️','Terminal cargo',650000,20,0,1,12],hub:['🚉','Hub przeładunkowy',420000,15,0,1,7]};
window.buildAsset=function(type){if(!selectedCoord){toast('Najpierw kliknij lokalizację na mapie.');return}let t=buildTypes[type];if(s.cash<t[2]){toast('Za mało gotówki. Potrzebujesz '+money(t[2])+'.');return}let city=selectedCity,coords=selectedCoord.slice();s.cash-=t[2];s.assets.push({id:uid(),type,name:t[1],city,coords,value:t[2],employees:t[3],lockers:t[4],depots:t[5],vans:t[6],level:1});log('Zbudowano: '+t[1],city+' · '+coords.map(x=>x.toFixed(4)).join(', '));save();render();toast('Inwestycja zbudowana na mapie!')};
function companies(){return head('RYNEK PRZEDSIĘBIORSTW','Firmy i konkurencja','Spółki powstają, rosną, zatrudniają i emitują udziały bez Twojego udziału.')+stats()+'<section class="panel"><div class="ph"><b>SPÓŁKI NA RYNKU · '+s.companies.length+'</b><span class="muted">GENEROWANIE: AUTOMATYCZNE</span></div><div class="tablewrap"><table><thead><tr><th>FIRMA</th><th>BRANŻA</th><th>WYCENA</th><th>KURS</th><th>UDZIAŁOWCY</th><th></th></tr></thead><tbody>'+s.companies.map(c=>'<tr><td class="firm">'+c.name+'<small>'+c.ticker+'</small></td><td>'+c.sector+'</td><td>'+money(c.value)+'</td><td>'+money(c.price)+'</td><td>'+c.shareholders.length+'</td><td><button class="btn" onclick="openShares(\''+c.id+'\')">Akcjonariat</button></td></tr>').join('')+'</tbody></table></div></section><section class="panel"><div class="ph"><b>TWOJE SPÓŁKI</b><span class="muted">KONTROLOWANE FIRMY</span></div>'+ (ownedCompanies().length?ownedCompanies().map(c=>'<div class="shareholder"><b>'+c.name+'</b><span class="tag good">KONTROLA</span></div>').join(''):'<div class="muted" style="font-size:10px">Nie masz jeszcze żadnej spółki. Zacznij od infrastruktury lub przejmij pakiet kontrolny na giełdzie.</div>')+'</section>'+managementPanel()+subsidiaryManagement()}
function market(){return head('RYNEK KAPITAŁOWY','Giełda i udziały','Kupuj udziały od konkretnych inwestorów. Po przekroczeniu 50% przejmujesz spółkę.')+stats()+'<div class="notice">TRANSAKCJE ODBYWAJĄ SIĘ W OKNIE: wybierasz udziałowca, liczbę udziałów i cenę. Możesz kupować pakiety od różnych osób, aż uzyskasz kontrolę. Dostępny jest też wykup udziałów własnych przez spółki.</div><section class="panel"><div class="tablewrap"><table><thead><tr><th>SPÓŁKA</th><th>WYCENA</th><th>KURS</th><th>TWÓJ PAKIET</th><th>NAJWIĘKSZY UDZIAŁOWIEC</th><th>TRANSAKCJA</th></tr></thead><tbody>'+s.companies.map(c=>{let own=s.playerShares[c.id]||0;let largest=c.shareholders.slice().sort((a,b)=>b.shares-a.shares)[0];return '<tr><td class="firm">'+c.name+'<small>'+c.sector+'</small></td><td>'+money(c.value)+'</td><td>'+money(c.price)+'</td><td>'+number(own)+' / '+number(c.shares)+'</td><td>'+largest.name+' ('+Math.round(largest.shares/c.shares*100)+'%)</td><td><button class="btn primary" onclick="openShares(\''+c.id+'\')">Otwórz transakcję</button></td></tr>'}).join('')+'</tbody></table></div></section><section class="panel"><div class="ph"><b>WYKUP UDZIAŁÓW WŁASNYCH</b><span class="muted">BUYBACK</span></div><p class="muted" style="font-size:10px">Gdy założysz lub przejmiesz firmę, możesz otworzyć jej akcjonariat i zlecić spółce odkupienie udziałów od inwestorów z jej własnej gotówki. Wykupione udziały stają się udziałami własnymi i nie dają głosu.</p>'+ownedCompanies().map(c=>'<button class="btn" onclick="openShares(\''+c.id+'\')">'+c.name+' · zarządzaj akcjonariatem</button> ').join('')+'</section>'}
window.openShares=function(id){let c=s.companies.find(x=>x.id===id);if(!c)return;let owners=c.shareholders.map((h,i)=>'<div class="shareholder"><span><b>'+h.name+'</b><small style="display:block;color:#91a1b5">'+number(h.shares)+' udziałów · '+(100*h.shares/c.shares).toFixed(1)+'%</small></span><button class="btn" onclick="buyFromHolder(\''+id+'\','+i+')">Kup od niego</button></div>').join('');let player=s.playerShares[id]||0;show('<h2>Akcjonariat · '+c.name+'</h2><p>Kurs rynkowy: <b>'+money(c.price)+'</b> za udział · Łącznie: '+number(c.shares)+' udziałów · Twój pakiet: '+number(player)+' ('+(100*player/c.shares).toFixed(1)+'%).</p><div class="notice">Kupuj udziały od konkretnych udziałowców. Wycena transakcji uwzględnia premię za większy pakiet. Po uzyskaniu ponad 50% przejmujesz kontrolę nad firmą i jej aktywami.</div><div class="ph"><b>UDZIAŁOWCY</b><span class="muted">'+c.shareholders.length+' POSIADACZY</span></div>'+owners+'<div class="notice">Gotówka spółki do wykupu własnych udziałów: '+money(c.cash)+'.</div><div class="actions"><button class="btn" onclick="closeModal()">Zamknij</button><button class="btn gold" onclick="buyback(\''+id+'\')">Wykup udziałów przez spółkę</button></div>')}
function show(html){$('modal').innerHTML=html;$('modalback').classList.add('open')}window.closeModal=()=> $('modalback').classList.remove('open');$('modalback').onclick=e=>{if(e.target===$('modalback'))closeModal()};
window.buyFromHolder=function(id,index){let c=s.companies.find(x=>x.id===id),h=c.shareholders[index];show('<h2>Kup udziały · '+h.name+'</h2><p>Spółka: '+c.name+' · Posiada: '+number(h.shares)+' · Cena rynkowa: '+money(c.price)+'</p><div class="field"><label>ILE UDZIAŁÓW KUPUJESZ?</label><input id="qty" type="number" min="1" max="'+h.shares+'" value="'+Math.min(100,h.shares)+'" oninput="calcDeal(\''+id+'\','+index+')"></div><div id="dealCost" class="notice"></div><div class="actions"><button class="btn" onclick="openShares(\''+id+'\')">Wróć</button><button class="btn primary" onclick="confirmBuy(\''+id+'\','+index+')">Potwierdź zakup</button></div>');calcDeal(id,index)};
window.calcDeal=function(id,i){let c=s.companies.find(x=>x.id===id),h=c.shareholders[i],q=Math.max(0,Math.floor(+$('qty').value||0)),premium=q>c.shares*.2?1.12:q>c.shares*.05?1.05:1;$('dealCost').textContent='Koszt: '+money(q*c.price*premium)+' · '+number(q)+' udziałów · premia pakietowa '+Math.round((premium-1)*100)+'%';};
window.confirmBuy=function(id,i){let c=s.companies.find(x=>x.id===id),h=c.shareholders[i],q=Math.floor(+$('qty').value),premium=q>c.shares*.2?1.12:q>c.shares*.05?1.05:1,cost=Math.round(q*c.price*premium);if(!q||q>h.shares){toast('Nieprawidłowa liczba udziałów.');return}if(s.cash<cost){toast('Za mało gotówki gracza.');return}h.shares-=q;s.playerShares[id]=(s.playerShares[id]||0)+q;s.cash-=cost;c.cash+=cost; if(h.shares===0)c.shareholders.splice(i,1);log('Zakup udziałów: '+c.name,'Kupiono '+q+' udziałów od '+h.name+'.');let pct=(s.playerShares[id]||0)/c.shares;if(pct>.5&&!c.ownedByPlayer){c.ownedByPlayer=true;c.listed=false;log('PRZEJĘCIE: '+c.name,'Masz większość udziałów. Firma, pracownicy, flota, magazyny i automaty wchodzą do Twojej grupy.');toast('PRZEJĘCIE KONTROLNE! '+c.name)}save();closeModal();render()};
window.buyback=function(id){let c=s.companies.find(x=>x.id===id);show('<h2>Wykup udziałów własnych · '+c.name+'</h2><p>Spółka użyje własnej gotówki, aby odkupić udziały od akcjonariuszy. Udziały własne nie dają głosu i zmniejszają liczbę udziałów w wolnym obrocie.</p><div class="field"><label>LICZBA UDZIAŁÓW DO WYKUPU</label><input id="buybackQty" type="number" min="1" max="'+c.shares+'" value="100"></div><div class="field"><label>OD KOGO ODKUPIĆ?</label><select id="buybackHolder">'+c.shareholders.map((h,i)=>'<option value="'+i+'">'+h.name+' · '+number(h.shares)+'</option>').join('')+'</select></div><div id="buybackCost" class="notice">Cena: —</div><div class="actions"><button class="btn" onclick="openShares(\''+id+'\')">Wróć</button><button class="btn gold" onclick="confirmBuyback(\''+id+'\')">Zleć wykup</button></div>');$('buybackQty').oninput=()=>calcBuyback(id);$('buybackHolder').onchange=()=>calcBuyback(id);calcBuyback(id)};
function calcBuyback(id){let c=s.companies.find(x=>x.id===id),h=c.shareholders[+$('buybackHolder').value],q=Math.floor(+$('buybackQty').value||0);$('buybackCost').textContent='Koszt: '+money(q*c.price*1.04)+' · Gotówka spółki: '+money(c.cash)}
window.confirmBuyback=function(id){let c=s.companies.find(x=>x.id===id),i=+$('buybackHolder').value,h=c.shareholders[i],q=Math.floor(+$('buybackQty').value),cost=Math.round(q*c.price*1.04);if(!q||q>h.shares){toast('Nieprawidłowa liczba udziałów.');return}if(cost>c.cash){toast('Spółka nie ma wystarczającej gotówki.');return}h.shares-=q;c.cash-=cost;c.treasury=(c.treasury||0)+q;if(!h.shares)c.shareholders.splice(i,1);log('Wykup własnych udziałów: '+c.name,'Spółka odkupiła '+q+' udziałów od '+h.name+'.');save();render();closeModal();toast('Wykup udziałów zakończony.')};
function regions(){return head('RYNKI MIĘDZYNARODOWE','Kraje i kontynenty','Sprawdzaj ekspansję grupy i przypisuj spółki córki do rynków na wybranych kontynentach.')+stats()+geoMarkets.map(g=>'<section class="panel"><div class="ph"><b>'+g.continent+'</b><span class="muted">'+g.countries.length+' rynków</span></div><div class="featuregrid">'+g.countries.map(country=>{let subs=s.companies.flatMap(c=>(c.subs||[]).filter(x=>x.countries.includes(country)).map(x=>x.name));return '<div class="feature"><b>'+country+'</b><span class="muted">'+(subs.length?subs.join(', '):'Brak spółki córki')+'</span></div>'}).join('')+'</div></section>').join('')}
function assets(){return head('ZASOBY','Majątek i sieć operacyjna','Przypisuj obiekty do spółek i spółek córek, łącz paczkomaty z centrami oraz uruchamiaj przewozy między centrami.')+stats()+assetManagement()+routesPanel()+'<section class="panel"><div class="ph"><b>INFRASTRUKTURA Z PRZEJĘTYCH SPÓŁEK</b></div><p class="muted" style="font-size:10px">Majątek spółek kontrolowanych: '+number(total('lockers'))+' automatów, '+number(total('depots'))+' centrów, '+number(total('vans'))+' pojazdów i '+number(total('employees'))+' pracowników.</p></section>'}
function entityOptions(selected){let out='<option value="player" '+(selected==='player'?'selected':'')+'>Własna firma (gracz)</option>';s.companies.forEach(c=>{out+='<option value="co:'+c.id+'" '+(selected==='co:'+c.id?'selected':'')+'>'+c.name+'</option>';(c.subs||[]).forEach(sub=>{let k='sub:'+c.id+':'+sub.id;out+='<option value="'+k+'" '+(selected===k?'selected':'')+'>'+c.name+' / '+sub.name+'</option>'})});return out}
function centerAssets(){return s.assets.filter(a=>['office','warehouse','cold','airport','hub'].includes(a.type)||((a.depots||0)>0))}
function assetManagement(){let centers=centerAssets();return '<section class="panel"><div class="ph"><b>PRZYPISANIE INFRASTRUKTURY</b><button class="btn" onclick="s.selected=\'map\';render()">+ Zbuduj obiekt</button></div><p class="muted">Każdy obiekt może należeć do Twojej firmy, przejętej spółki albo konkretnej spółki córki. Paczkomat możesz dodatkowo przypisać do centrum obsługującego jego przesyłki.</p>'+(s.assets.length?s.assets.map(a=>'<div class="shareholder" style="align-items:flex-start"><div style="min-width:145px;flex:1"><b>'+a.name+'</b><small style="display:block;color:#91a1b5">'+a.city+' · '+(a.type==='locker'?'Paczkomat':centerAssets().some(x=>x.id===a.id)?'Centrum':'Obiekt')+'</small></div><div style="min-width:190px;flex:1"><label>OPERATOR / WŁAŚCICIEL</label><select onchange="assignAsset(\''+a.id+'\',this.value)">'+entityOptions(a.ownerKey||'player')+'</select></div>'+(a.type==='locker'?'<div style="min-width:180px;flex:1"><label>CENTRUM OBSŁUGUJĄCE</label><select onchange="assignLockerCenter(\''+a.id+'\',this.value)"><option value="">Bez przypisania</option>'+centers.map(x=>'<option value="'+x.id+'" '+(a.centerId===x.id?'selected':'')+'>'+x.name+' · '+x.city+'</option>').join('')+'</select></div>':'')+'</div>').join(''):'<p class="muted">Nie masz jeszcze obiektów. Zbuduj pierwszy na mapie.</p>')+'</section>'}
function routesPanel(){let centers=centerAssets();return '<section class="panel"><div class="ph"><b>LINIE MIĘDZY CENTRAMI</b><span class="muted">TRANSPORT PACZEK</span></div><p class="muted">Paczkomaty dostarczają paczki do przypisanego centrum. Linie przewozowe zabierają zapas z centrum nadawczego i po czasie podróży dostarczają go do centrum docelowego.</p><div class="grid2"><div class="field"><label>CENTRUM NADAWCZE</label><select id="routeFrom">'+centers.map(x=>'<option value="'+x.id+'">'+x.name+' · '+x.city+'</option>').join('')+'</select></div><div class="field"><label>CENTRUM DOCELOWE</label><select id="routeTo">'+centers.filter(x=>x.id!==centers[0]?.id).map(x=>'<option value="'+x.id+'">'+x.name+' · '+x.city+'</option>').join('')+'</select></div></div><div class="actions"><button class="btn primary" '+(centers.length<2?'disabled':'')+' onclick="createRoute()">Uruchom linię transportową</button></div>'+(s.routes||[]).map(r=>{let a=s.assets.find(x=>x.id===r.from),b=s.assets.find(x=>x.id===r.to);return '<div class="shareholder"><div style="flex:1"><b>'+ (a?a.name+' · '+a.city:'Usunięte centrum')+' → '+(b?b.name+' · '+b.city:'Usunięte centrum')+'</b><small style="display:block;color:#91a1b5">Przewóz: '+r.travelDays+' dni · Dostarczono: '+number(r.delivered||0)+' paczek · W trasie: '+number(r.inTransit?.count||0)+'</small><small style="display:block;color:#91a1b5">Zapas nadawczy: '+number(a?.parcelStock||0)+'</small></div><button class="btn danger" onclick="deleteRoute(\''+r.id+'\')">Usuń linię</button></div>'}).join('')+(s.routes?.length?'':'<p class="muted">Nie ma jeszcze aktywnych linii. Zbuduj co najmniej dwa centra, aby uruchomić przewozy.</p>')+'</section>'}
function features(){return head('ROZBUDOWA','Ponad 50 systemów rozwoju','Katalog dostępnych kierunków inwestycji. Część odblokowuje się wraz ze wzrostem firmy i infrastruktury.')+stats()+'<div class="featuregrid">'+featureNames.map((n,i)=>'<div class="feature"><b>'+String(i+1).padStart(2,'0')+'. '+n+'</b><span class="muted">'+(i<10?'Dostępne od początku':i<30?'Odblokowanie: pierwsza baza':i<50?'Odblokowanie: 3 obiekty':'Odblokowanie: rozwinięta firma')+'</span></div>').join('')+'</div><p class="foot">Katalog zawiera '+featureNames.length+' gałęzi rozwoju. To systemy i specjalizacje do rozwijania firmy, a nie dekoracyjne dodatki.</p>'}
window.togglePause=function(){s.paused=!s.paused;render()};
function tick(){if(s.paused)return;s.day++;let rev=0,expenses=0;s.assets.forEach(a=>{let income=(a.lockers||0)*35+(a.employees||0)*45+(a.vans||0)*30+(a.depots||0)*120;rev+=income;expenses+=(a.employees||0)*35+100});s.companies.forEach(c=>{let growth=c.growth/100*(.4+Math.random());c.parcels=Math.round(c.parcels*(1+growth));c.value=Math.round(c.value*(1+growth*.25));c.price=Math.max(10,Math.round(c.price*(1+(Math.random()-.48)*.04)));c.change=(Math.random()-.48)*4;
let turnover=c.parcels*(c.ownedByPlayer?12:8),payroll=c.employees*(c.ownedByPlayer?75:58),running=c.vans*(c.ownedByPlayer?65:42)+c.depots*(c.ownedByPlayer?700:450)+c.lockers*3;
let operating=turnover-payroll-running;c.cash=Math.max(0,c.cash+operating);
let pace=c.expansionPace==='fast'?1.8:c.expansionPace==='slow'?.55:1,investRate=(c.investmentBudget||25)/100,available=c.cash*investRate*pace;
let hireNeed=c.hiringPolicy==='lean'?0:c.hiringPolicy==='growth'?3:1;
if(c.cash>30000&&Math.random()<.78){let hire=Math.min(Math.floor(available/1800),Math.max(0,Math.ceil(c.parcels/90)-c.employees),hireNeed+Math.floor(c.parcels/700));if(hire>0){c.employees+=hire;c.cash-=hire*1800;}}
let kind='',cost=0,st=c.expansionStrategy||'balanced';
if(st==='lockers'){kind='lockers';cost=18000}else if(st==='depots'){kind='depots';cost=240000}else if(st==='fleet'){kind='vans';cost=22000}else if(st==='regional'){kind=Math.random()<.5?'depots':'lockers';cost=kind==='depots'?240000:18000}else{let roll=Math.random();kind=roll<.45?'lockers':roll<.7?'vans':'depots';cost=kind==='lockers'?18000:kind==='vans'?22000:240000}
if(c.cash>cost+20000&&available>cost&&Math.random()<(c.ownedByPlayer ? .75 : .42)*pace){if(kind==='lockers')c.lockers++;if(kind==='depots')c.depots++;if(kind==='vans')c.vans++;c.cash-=cost;c.value+=cost*.85;}
if(c.ownedByPlayer){rev+=turnover;expenses+=payroll+running;}(c.subs||[]).forEach(sub=>{sub.parcels=Math.round(sub.parcels*1.025);let subIncome=sub.parcels*7,subCosts=sub.employees*45+sub.vans*35+sub.depots*350;sub.cash=Math.max(0,sub.cash+subIncome-subCosts);if(sub.cash>90000&&Math.random()<.25){sub.depots++;sub.cash-=65000;sub.employees+=2;}if(sub.cash>25000&&Math.random()<.3){sub.lockers++;sub.cash-=18000;sub.employees++;}});
});s.cash=Math.max(0,s.cash+rev-expenses);if(s.day%4===0){let c=newCompany(s.nextCompany++);c.value=c.price*c.shares;c.shareholders=[{name:'Założyciel '+c.name,shares:3000},{name:'Fundusz Bałtycki',shares:2500},{name:'Inwestor prywatny',shares:2000},{name:'Fundusz Infrastruktury',shares:1500},{name:'Drobni inwestorzy',shares:1000}];s.companies.push(c);log('Nowa firma na rynku: '+c.name,'Nowy podmiot wszedł na giełdę. '+c.sector+'.');}processRoutes();s.history.push(s.cash);s.history=s.history.slice(-25);save();render()}
window.resetGame=function(){if(!confirm('Zresetować zapis? Start od zera z 500 000 zł?'))return;s=seed();map=null;save();render();toast('Nowa rozgrywka — start od zera.')};
// Inline HTML handlers execute in the global scope, while the game is wrapped in an IIFE.
window.assetManagement=assetManagement;window.routesPanel=routesPanel;window.processRoutes=processRoutes;window.entityOptions=entityOptions;
Object.defineProperty(window,'s',{configurable:true,get:()=>s});
Object.defineProperty(window,'map',{configurable:true,get:()=>map});
window.render=render;
window.toast=toast;
window.log=log;
window.money=money;
window.number=number;
window.ownedCompanies=ownedCompanies;
window.managementPanel=managementPanel;
window.openSubsidiary=openSubsidiary;
window.renderCountryChoices=renderCountryChoices;
window.selectContinentCountries=selectContinentCountries;
window.clearCountrySelection=clearCountrySelection;
window.createSubsidiary=createSubsidiary;
window.setCompanyPolicy=setCompanyPolicy;
window.buildAsset=buildAsset;
window.openShares=openShares;
window.buyFromHolder=buyFromHolder;
window.calcDeal=calcDeal;
window.confirmBuy=confirmBuy;
window.buyback=buyback;
window.confirmBuyback=confirmBuyback;
window.closeModal=closeModal;
window.togglePause=togglePause;
window.initMap=initMap;
window.drawMarkers=drawMarkers;
window.tick=tick;
render();setInterval(tick,12000);
})();
</script></body></html>
