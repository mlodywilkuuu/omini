
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Władca Narodów | Menu główne</title>

<style>
:root {
  --gold: #f6d38a;
  --text: #f5f7ff;
  --muted: #a9b8d1;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
}

body {
  background: #080d20;
  color: var(--text);
  font-family: "Segoe UI", Arial, sans-serif;
  overflow-x: hidden;
}

/* ANIMOWANE TŁO */

.background {
  position: fixed;
  inset: 0;
  z-index: -3;
  background: linear-gradient(
    125deg,
    #080d20,
    #152d54,
    #32214f,
    #092e43,
    #080d20
  );
  background-size: 400% 400%;
  animation: gradientMove 18s ease infinite;
}

@keyframes gradientMove {
  0%, 100% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
}

/* ŚWIECĄCE KULE */

.orb {
  position: fixed;
  z-index: -2;
  border-radius: 50%;
  filter: blur(75px);
  opacity: .4;
  pointer-events: none;
  animation: float 12s ease-in-out infinite;
}

.orb1 {
  width: 350px;
  height: 350px;
  top: -120px;
  left: -120px;
  background: #537cff;
}

.orb2 {
  width: 350px;
  height: 350px;
  bottom: -130px;
  right: -130px;
  background: #a74cff;
  animation-delay: -5s;
}

.orb3 {
  width: 230px;
  height: 230px;
  top: 35%;
  left: 45%;
  background: #d8a54b;
  opacity: .18;
  animation-delay: -8s;
}

@keyframes float {
  50% {
    transform: translate(35px, -40px);
  }
}

/* SIATKA */

.grid-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background-image:
    linear-gradient(#ffffff08 1px, transparent 1px),
    linear-gradient(90deg, #ffffff08 1px, transparent 1px);
  background-size: 55px 55px;
}

/* UKŁAD */

.page {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 12px;
}

/* SZKLANY PANEL */

.glass {
  width: 100%;
  max-width: 440px;
  padding: 22px 28px;
  text-align: center;

  background: rgba(255,255,255,.07);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);

  border: 1px solid rgba(255,255,255,.2);
  border-radius: 22px;

  box-shadow:
    0 25px 75px #0006,
    inset 0 1px 0 #ffffff30;

  animation: appear .8s ease both;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(25px) scale(.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* KORONA */

.crown {
  font-size: 38px;
  color: var(--gold);
  margin-bottom: 7px;
  text-shadow: 0 0 30px #f6d38a88;
  animation: crownFloat 4s ease-in-out infinite;
}

@keyframes crownFloat {
  50% {
    transform: translateY(-7px);
  }
}

/* TYTUŁ */

h1 {
  margin: 0;
  font-size: 30px;
  line-height: 1.12;
  letter-spacing: 2px;

  background: linear-gradient(
    90deg,
    #fff3cb,
    #d8a54b,
    #ffffff,
    #d8a54b
  );

  background-size: 250%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;

  animation: shine 6s linear infinite;
}

@keyframes shine {
  to {
    background-position: 250%;
  }
}

.subtitle {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
  margin: 10px 0 14px;
}

.divider {
  width: 100px;
  height: 2px;
  margin: 0 auto 14px;
  background: linear-gradient(
    90deg,
    transparent,
    var(--gold),
    transparent
  );
}

/* PRZYCISKI */

.menu-btn {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;

  width: 100%;
  min-height: 42px;
  margin: 8px 0;
  padding: 10px;

  background: rgba(255,255,255,.08);
  color: white;

  border: 1px solid rgba(255,255,255,.18);
  border-radius: 12px;

  font-family: inherit;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .6px;

  cursor: pointer;
  overflow: hidden;

  transition:
    transform .3s,
    background .3s,
    box-shadow .3s;
}

.menu-btn:hover {
  transform: translateY(-3px);
  background: rgba(255,255,255,.16);
  box-shadow: 0 10px 30px #0005;
}

.menu-btn:active {
  transform: scale(.98);
}

.menu-btn:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

/* ZŁOTY PRZYCISK */

.primary {
  color: #171822;
  font-weight: 800;

  background: linear-gradient(
    120deg,
    #bd8c42,
    #ffe6aa,
    #d7a54c
  );

  background-size: 250%;
  border-color: var(--gold);

  box-shadow: 0 8px 30px #d6a34c44;
  animation: shine 6s linear infinite;
}

.primary:hover {
  background: linear-gradient(
    120deg,
    #d5a04c,
    #fff0c6,
    #d5a04c
  );
  box-shadow: 0 12px 35px #e9ba6488;
}

/* BŁYSK */

.menu-btn::after {
  content: "";
  position: absolute;
  top: 0;
  left: -130%;
  width: 60%;
  height: 100%;

  transform: skewX(-25deg);

  background: linear-gradient(
    90deg,
    transparent,
    #ffffff55,
    transparent
  );

  transition: left .7s;
}

.menu-btn:hover::after {
  left: 150%;
}

/* STOPKA */

.footer {
  margin-top: 16px;
  color: #91a1ba;
  font-size: 10px;
  letter-spacing: 1px;
}

.version {
  margin-top: 5px;
  color: #697b98;
  font-size: 10px;
}

/* NISKIE EKRANY */

@media (max-height: 650px) {
  .glass {
    padding: 14px 24px;
  }

  .crown {
    font-size: 29px;
    margin-bottom: 4px;
  }

  h1 {
    font-size: 25px;
  }

  .subtitle {
    margin: 7px 0;
  }

  .divider {
    margin-bottom: 8px;
  }

  .menu-btn {
    min-height: 36px;
    margin: 5px 0;
    padding: 7px;
  }

  .footer {
    margin-top: 8px;
  }
}

@media (max-width: 480px) {
  .glass {
    padding-left: 20px;
    padding-right: 20px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="orb orb3"></div>
<div class="grid-bg"></div>

<main class="page">
  <section class="glass">

    <div class="crown">♛</div>

    <h1>WŁADCA<br>NARODÓW</h1>

    <p class="subtitle">
      Każda decyzja zmienia historię.<br>
      Zbuduj potęgę swojego państwa.
    </p>

    <div class="divider"></div>

    <button class="menu-btn primary"
      onclick="goTo('nowa-gra.html')">
      ✦ NOWA GRA
    </button>

    <button class="menu-btn"
      onclick="goTo('wczytaj.html')">
      ◈ KONTYNUUJ GRĘ
    </button>

    <button class="menu-btn"
      onclick="goTo('ustawienia.html')">
      ⚙ USTAWIENIA
    </button>

    <button class="menu-btn"
      onclick="goTo('o-grze.html')">
      ⓘ O GRZE
    </button>

    <div class="footer">
      STRATEGIA • POLITYKA • GOSPODARKA
    </div>

    <div class="version">
      WERSJA ALPHA 0.1
    </div>

  </section>
</main>

<script>
function goTo(page) {
  window.location.href = page;
}
</script>

</body>
</html>
