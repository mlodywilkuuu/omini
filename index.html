<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glitch Defense - Idle Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #02233b, #090d16);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.2s ease;
        }
        .glass-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="animated-bg text-slate-100 h-screen flex flex-col overflow-hidden font-sans">

    <!-- Górny pasek statystyk -->
    <header class="glass-panel border-b border-slate-800 px-6 py-4 flex justify-between items-center shadow-xl z-30">
        <div class="flex items-center gap-3">
            <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse shadow-lg shadow-emerald-500/50"></div>
            <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-indigo-400 to-emerald-400 bg-clip-text text-transparent">Glitch Defense <span class="text-xs bg-indigo-500/20 border border-indigo-500/40 text-indigo-300 px-2.5 py-0.5 rounded-full ml-2">Idle Clicker</span></h1>
        </div>
        <div class="flex gap-6 text-sm">
            <div class="glass-card px-4 py-1.5 rounded-xl border border-slate-700/60 flex items-center gap-2">
                <span>⚡ Punkty kodu:</span>
                <span id="score" class="font-bold text-emerald-400 text-base">0</span>
            </div>
            <div class="glass-card px-4 py-1.5 rounded-xl border border-slate-700/60 flex items-center gap-2">
                <span>🚀 CPS (Na sekundę):</span>
                <span id="cps" class="font-bold text-indigo-400 text-base">0</span>
            </div>
        </div>
    </header>

    <!-- Główna zawartość gry -->
    <main class="flex-1 flex overflow-hidden p-6 gap-6">

        <!-- Główny obszar klikania / akcji -->
        <div class="flex-1 glass-panel rounded-3xl flex flex-col items-center justify-center relative overflow-hidden shadow-2xl p-8">
            <div class="absolute top-6 left-6 text-xs text-slate-400 uppercase tracking-widest font-semibold">Rdzeń Systemu</div>
            
            <!-- Główny przycisk do klikania -->
            <div class="relative group cursor-pointer select-none" onclick="clickCore(event)">
                <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-emerald-500 rounded-full blur-xl opacity-40 group-hover:opacity-75 transition duration-500 animate-pulse"></div>
                <div id="core-btn" class="relative w-48 h-48 rounded-full bg-slate-900 border-2 border-indigo-500/50 flex flex-col items-center justify-center shadow-2xl transition transform active:scale-95">
                    <span class="text-3xl mb-1">🛡️</span>
                    <span class="font-bold text-sm text-slate-200">KOMPILUJ</span>
                    <span class="text-[10px] text-indigo-400 mt-1">+<span id="click-power">1</span> pkt</span>
                </div>
            </div>

            <!-- Aktywne efekty / powiadomienia na środku -->
            <div id="click-effects" class="absolute inset-0 pointer-events-none overflow-hidden"></div>

            <div class="absolute bottom-6 text-center text-xs text-slate-500">
                Klikaj rdzeń, aby generować kod i odpierać napływające błędy. Kupuj ulepszenia po prawej stronie!
            </div>
        </div>

        <!-- Panel Ulepszeń (Sklep) -->
        <div class="w-96 glass-panel rounded-3xl flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b border-slate-800 font-bold text-base text-slate-200 bg-slate-900/40 flex justify-between items-center">
                <span>Sklep Ulepszeń</span>
                <span class="text-xs text-slate-400">Automatyzacja</span>
            </div>
            
            <div class="flex-1 p-4 overflow-y-auto space-y-3" id="shop-container">
                <!-- Dynamiczne ulepszenia generowane w JS -->
            </div>
        </div>

    </main>

    <script>
        // Stan gry
        let game = {
            score: 0,
            clickPower: 1,
            cps: 0,
            upgrades: [
                { id: 'script', name: 'Prosty Skrypt', desc: '+1 punkt na sekundę', cost: 15, cps: 1, count: 0, costMultiplier: 1.15 },
                { id: 'bot', name: 'Bot Naprawczy', desc: '+8 punktów na sekundę', cost: 100, cps: 8, count: 0, costMultiplier: 1.15 },
                { id: 'ai', name: 'Moduł AI', desc: '+40 punktów na sekundę', cost: 500, cps: 40, count: 0, costMultiplier: 1.15 },
                { id: 'server', name: 'Serwer Centralny', desc: '+200 punktów na sekundę', cost: 2500, cps: 200, count: 0, costMultiplier: 1.15 },
                { id: 'upgrade_click', name: 'Lepszy Kompilator', desc: '+1 siła kliknięcia', cost: 50, power: 1, count: 0, costMultiplier: 2.0 }
            ]
        };

        // Ładowanie stanu z localStorage
        function loadGame() {
            const saved = localStorage.getItem('glitch_defense_save');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    game.score = parsed.score || 0;
                    game.clickPower = parsed.clickPower || 1;
                    if (parsed.upgrades) {
                        parsed.upgrades.forEach((u, i) => {
                            if (game.upgrades[i]) {
                                game.upgrades[i].count = u.count;
                                game.upgrades[i].cost = u.cost;
                            }
                        });
                    }
                } catch(e) { console.error('Błąd wczytywania gry'); }
            }
            calculateCPS();
        }

        function saveGame() {
            localStorage.setItem('glitch_defense_save', JSON.stringify(game));
        }

        function calculateCPS() {
            let totalCPS = 0;
            game.upgrades.forEach(u => {
                if (u.cps) totalCPS += u.cps * u.count;
            });
            game.cps = totalCPS;
            document.getElementById('cps').textContent = game.cps;
        }

        function clickCore(e) {
            game.score += game.clickPower;
            updateUI();
            
            // Efekt pływającej cyferki po kliknięciu
            const rect = e.currentTarget.getBoundingClientRect();
            const x = e.clientX - rect.left - 20;
            const y = e.clientY - rect.top - 20;
            
            const floatText = document.createElement('div');
            floatText.textContent = `+${game.clickPower}`;
            floatText.className = 'absolute text-emerald-400 font-bold text-lg pointer-events-none animate-ping';
            floatText.style.left = `${x + 90}px`;
            floatText.style.top = `${y + 90}px`;
            
            document.getElementById('click-effects').appendChild(floatText);
            setTimeout(() => floatText.remove(), 400);
        }

        function buyUpgrade(id) {
            const upgrade = game.upgrades.find(u => u.id === id);
            if (game.score >= upgrade.cost) {
                game.score -= upgrade.cost;
                upgrade.count++;
                
                if (upgrade.power) {
                    game.clickPower += upgrade.power;
                    document.getElementById('click-power').textContent = game.clickPower;
                }
                
                upgrade.cost = Math.floor(upgrade.cost * upgrade.costMultiplier);
                calculateCPS();
                updateUI();
                renderShop();
                saveGame();
            }
        }

        function renderShop() {
            const container = document.getElementById('shop-container');
            container.innerHTML = '';

            game.upgrades.forEach(u => {
                const canAfford = game.score >= u.cost;
                container.innerHTML += `
                    <div class="glass-card p-3.5 rounded-2xl flex justify-between items-center border border-slate-700/60">
                        <div>
                            <div class="font-bold text-slate-200 text-sm">${u.name} <span class="text-xs text-indigo-400 font-normal">(osiadane: ${u.count})</span></div>
                            <div class="text-[11px] text-slate-400">${u.desc}</div>
                        </div>
                        <button onclick="buyUpgrade('${u.id}')" ${!canAfford ? 'disabled' : ''} class="px-4 py-2 rounded-xl text-xs font-semibold transition ${canAfford ? 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 cursor-pointer' : 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'}">
                            ${u.cost} pkt
                        </button>
                    </div>
                `;
            });
        }

        function updateUI() {
            document.getElementById('score').textContent = Math.floor(game.score);
            // Dynamiczne podświetlanie przycisków sklepu bez pełnego odświeżania domyślnie co klatkę dla płynności
            const buttons = document.querySelectorAll('#shop-container button');
            game.upgrades.forEach((u, i) => {
                if (buttons[i]) {
                    if (game.score >= u.cost) {
                        buttons[i].className = "px-4 py-2 rounded-xl text-xs font-semibold transition bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30 cursor-pointer";
                        buttons[i].removeAttribute('disabled');
                    } else {
                        buttons[i].className = "px-4 py-2 rounded-xl text-xs font-semibold transition bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700";
                        buttons[i].setAttribute('disabled', 'true');
                    }
                }
            });
        }

        // Pętla gry (Idle tick co 1 sekundę)
        setInterval(() => {
            if (game.cps > 0) {
                game.score += game.cps;
                updateUI();
                saveGame();
            }
        }, 1000);

        // Automatyczny zapis co 10 sekund
        setInterval(saveGame, 10000);

        // Inicjalizacja
        loadGame();
        document.getElementById('click-power').textContent = game.clickPower;
        renderShop();
        updateUI();
    </script>
</body>
</html>
