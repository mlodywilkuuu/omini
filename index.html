<script>

var $=function(id){return document.getElementById(id)}, fmt=function(n){return new Intl.NumberFormat('pl-PL',{maximumFractionDigits:0}).format(Math.floor(n||0))+' zł'}, num=function(n){return new Intl.NumberFormat('pl-PL',{maximumFractionDigits:0}).format(n||0)}, pct=function(n){return (n>=0?'+':'')+n.toFixed(1)+'%'}, uid=function(){return Math.random().toString(36).slice(2,8).toUpperCase()};
var seed=function(){return {day:1,bank:25000000,debt:0,revenue:0,expenses:0,profit:0,history:[25000000],speed:1,paused:false,selected:'overview',holding:'OMEGA HOLDING',activity:[{icon:'🚀',title:'OMEGA HOLDING rozpoczęło działalność',desc:'Zbuduj sieć kurierską, przejmuj konkurencję i rozwijaj grupę.',day:1}],companies:[
{id:'own',name:'Omega Logistics',ticker:'OMGL',sector:'Kurier i dostawy',owned:1000,shares:1000,price:25000,value:25000000,cash:4500000,parcels:1200,depots:2,lockers:35,vans:28,employees:64,level:1,subs:[],growth:1.8,ownedByPlayer:true,listed:false,parentId:null},
{id:'swift',name:'Swift Parcel',ticker:'SWFT',sector:'Kurier i dostawy',owned:0,shares:1000,price:8200,value:8200000,cash:1500000,parcels:520,depots:1,lockers:18,vans:14,employees:32,level:1,subs:[],growth:2.4,ownedByPlayer:false,listed:true,parentId:null},
{id:'pacel',name:'Pacel Polska',ticker:'PACL',sector:'Paczkomaty',owned:0,shares:1000,price:14600,value:14600000,cash:2900000,parcels:890,depots:2,lockers:120,vans:22,employees:51,level:2,subs:[],growth:1.7,ownedByPlayer:false,listed:true,parentId:null},
{id:'north',name:'NorthLine Express',ticker:'NLEX',sector:'Transport',owned:0,shares:1000,price:11200,value:11200000,cash:2100000,parcels:700,depots:3,lockers:8,vans:48,employees:73,level:1,subs:[],growth:1.3,ownedByPlayer:false,listed:true,parentId:null},
{id:'box',name:'BoxPoint',ticker:'BXPT',sector:'Paczkomaty',owned:0,shares:1000,price:6800,value:6800000,cash:900000,parcels:400,depots:1,lockers:95,vans:9,employees:25,level:1,subs:[],growth:2.9,ownedByPlayer:false,listed:true,parentId:null},
{id:'cargo',name:'CargoMax',ticker:'CRMX',sector:'Centra logistyczne',owned:0,shares:1000,price:19400,value:19400000,cash:3700000,parcels:1100,depots:7,lockers:12,vans:65,employees:110,level:3,subs:[],growth:1.1,ownedByPlayer:false,listed:true,parentId:null},
{id:'euro',name:'EuroShip',ticker:'ERSH',sector:'Kurier międzynarodowy',owned:0,shares:1000,price:27300,value:27300000,cash:5100000,parcels:1600,depots:4,lockers:40,vans:82,employees:145,level:2,subs:[],growth:1.6,ownedByPlayer:false,listed:true,parentId:null}
]}};
var state;try{state=JSON.parse(localStorage.getItem('logistics_tycoon_save'))||seed()}catch(e){state=seed()}
function normalize(){state.companies.forEach(function(c){if(typeof c.shares!=='number')c.shares=1000;if(typeof c.owned!=='number')c.owned=Math.round((c.owned||0)*10);if(c.parentId===undefined)c.parentId=null;if(!Array.isArray(c.subs))c.subs=[];if(typeof c.ownedByPlayer!=='boolean')c.ownedByPlayer=c.owned>c.shares/2;});if(!state.holding)state.holding='OMEGA HOLDING'}
normalize();
function save(){try{localStorage.setItem('logistics_tycoon_save',JSON.stringify(state))}catch(e){}}
function firm(id){return state.companies.find(function(c){return c.id===id})}
function controlled(){return state.companies.filter(function(c){return c.ownedByPlayer})}
function groupValue(){return controlled().reduce(function(a,c){return a+c.value*c.owned/c.shares},0)}
function total(key){return controlled().reduce(function(a,c){return a+(c[key]||0)},0)}
function log(icon,title,desc){state.activity.unshift({icon:icon,title:title,desc:desc,day:state.day});state.activity=state.activity.slice(0,35)}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2800)}
function head(k,title,sub,action){return '<div class="pagehead"><div><div class="eyebrow">'+k+'</div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="actions">'+(action||'')+'</div></div>'}
function stats(){return '<div class="stats"><div class="stat"><label>WARTOŚĆ GRUPY</label><strong>'+fmt(groupValue())+'</strong><small class="positive">Wartość kontrolowanych udziałów</small></div><div class="stat"><label>GOTÓWKA HOLDINGU</label><strong>'+fmt(state.bank)+'</strong><small>Kapitał na inwestycje i przejęcia</small></div><div class="stat"><label>SPÓŁKI POD KONTROLĄ</label><strong>'+controlled().length+'</strong><small>Spółki główne i zależne</small></div><div class="stat"><label>PACZKI / DZIEŃ</label><strong>'+num(total('parcels'))+'</strong><small>Wolumen całej grupy</small></div></div>'}
function firmCell(c){return '<div class="firm"><div class="logo">'+c.ticker.slice(0,2)+'</div><div><b>'+c.name+'</b><small>'+c.ticker+' · '+c.sector+'</small></div></div>'}
function rows(list,market){return list.map(function(c){return '<tr><td>'+firmCell(c)+'</td><td>'+fmt(c.price)+'</td><td class="'+((c.change||0)>=0?'positive':'negative')+'">'+pct(c.change||0)+'</td><td>'+num(c.owned)+' / '+num(c.shares)+'</td><td>'+(c.ownedByPlayer?'<span class="tag good">W GRUPIE</span>':c.owned>c.shares/2?'<span class="tag warn">KONTROLA</span>':'<span class="tag">NA SPRZEDAŻ</span>')+'</td><td><button class="btn small" onclick="'+(market?'openTrade':'openCompany')+'(\''+c.id+'\')">'+(market?'Handluj':'Zarządzaj')+'</button></td></tr>'}).join('')}
function overview(){var comps=controlled(),bars=state.history.slice(-14),max=Math.max.apply(null,bars.concat([1]));return head('CENTRUM DOWODZENIA','Buduj logistyczne imperium','Przejmuj konkurencję, twórz spółki-córki i rozwijaj całą sieć.', '<div class="speed"><button onclick="setSpeed(0)" class="'+(state.paused?'active':'')+'">PAUZA</button><button onclick="setSpeed(1)" class="'+(state.speed===1&&!state.paused?'active':'')+'">1×</button><button onclick="setSpeed(3)" class="'+(state.speed===3&&!state.paused?'active':'')+'">3×</button><button onclick="setSpeed(8)" class="'+(state.speed===8&&!state.paused?'active':'')+'">8×</button></div>')+stats()+'<div class="grid2"><section class="panel"><div class="panelhead"><h2>WYNIKI HOLDINGU</h2><small>Gotówka · ostatnie dni</small></div><div class="bars">'+bars.map(function(v,i){return '<div class="barcol"><div class="bar" style="height:'+Math.max(3,v/max*100)+'%"></div><small>'+(state.day-bars.length+i+1)+'</small></div>'}).join('')+'</div><div class="chartlabels"><span>HISTORIA KAPITAŁU</span><span>'+fmt(state.bank)+'</span></div></section><section class="panel"><div class="panelhead"><h2>AKTYWNOŚĆ GRUPY</h2><small>OSTATNIE ZDARZENIA</small></div><div class="activity">'+state.activity.slice(0,5).map(function(a){return '<div class="activityrow"><div class="activityicon">'+a.icon+'</div><div><b>'+a.title+'</b><small>'+a.desc+'</small></div><time>D'+a.day+'</time></div>'}).join('')+'</div></section></div><section class="panel"><div class="panelhead"><h2>SPÓŁKI W TWOJEJ GRUPIE</h2><button class="btn small" onclick="nav(\'companies\')">Zobacz strukturę →</button></div><div class="tablewrap"><table><thead><tr><th>SPÓŁKA</th><th>KURS</th><th>ZMIANA</th><th>UDZIAŁY</th><th>STATUS</th><th></th></tr></thead><tbody>'+rows(comps,false)+'</tbody></table></div></section><div class="footerhint">Próg przejęcia to ponad 50% udziałów. Po przejęciu firma zachowuje własną nazwę i zarząd operacyjny, ale jej majątek, gotówka, pracownicy i infrastruktura są wliczane do całej grupy. Możesz przypisać ją do dowolnej spółki zależnej.</div>'}
function companies(){var list=controlled();return head('STRUKTURA HOLDINGU','Spółki i zależności','Każda firma ma własną kasę, flotę, pracowników i tempo wzrostu.','<button class="btn primary" onclick="createSub()">＋ Nowa spółka-córka</button>')+stats()+'<div class="companygrid">'+list.map(function(c){return '<article class="companycard"><div class="companytop">'+firmCell(c)+'</div><div style="display:flex;justify-content:space-between;margin-bottom:12px"><span class="tag good">'+Math.round(c.owned/c.shares*100)+'% UDZIAŁÓW</span><span class="tag">POZIOM '+c.level+'</span></div><div class="companymetrics"><div><small>WYCENA</small><b>'+fmt(c.value)+'</b></div><div><small>GOTÓWKA FIRMY</small><b>'+fmt(c.cash)+'</b></div><div><small>PRACOWNICY</small><b>'+num(c.employees)+'</b></div><div><small>PACZKI / DZIEŃ</small><b>'+num(c.parcels)+'</b></div></div><div class="cardfoot"><small>📮 '+num(c.lockers)+' · 🏭 '+num(c.depots)+' · 🚚 '+num(c.vans)+'</small><button class="btn small" onclick="openCompany(\''+c.id+'\')">Zarządzaj →</button></div></article>'}).join('')+'</div><section class="panel" style="margin-top:14px"><div class="panelhead"><h2>STRUKTURA WŁASNOŚCI</h2><small>HIERARCHIA HOLDINGU</small></div><div class="tree">'+treeRows()+'</div></section>'}
function treeRows(){var roots=controlled().filter(function(c){return !c.parentId||!firm(c.parentId)||!firm(c.parentId).ownedByPlayer});var out='';function add(c,depth){out+='<div class="treeitem '+(depth?'child':'')+'" style="margin-left:'+(depth*19)+'px"><div class="logo">'+c.ticker.slice(0,2)+'</div><div><b>'+c.name+'</b><small>'+Math.round(c.owned/c.shares*100)+'% udziałów · '+(c.parentId&&firm(c.parentId)?'właściciel: '+firm(c.parentId).name:'spółka główna')+'</small></div><span class="spacer"></span><span class="tag good">KONTROLA</span></div>';controlled().filter(function(x){return x.parentId===c.id}).forEach(function(x){add(x,depth+1)})}roots.forEach(function(c){add(c,0)});return out||'<div class="empty">Brak spółek w grupie.</div>'}
function market(){var list=state.companies.filter(function(c){return c.listed&&!c.ownedByPlayer});return head('RYNEK KAPITAŁOWY','Giełda papierów wartościowych','Kupuj udziały konkurencji. Pakiet kontrolny daje realną władzę nad przedsiębiorstwem.')+stats()+'<div class="notice">◆ PRZEJĘCIE KONTROLNE — kupno ponad 50% udziałów przejmuje spółkę. Jej automaty paczkowe, centra logistyczne, samochody, pracownicy, gotówka i działalność zostają włączone do skonsolidowanej grupy. W oknie transakcji wybierzesz spółkę, do której ją przypiąć.</div><section class="panel"><div class="panelhead"><h2>NOTOWANE SPÓŁKI</h2><small>'+list.length+' SPÓŁEK NA PARKIECIE</small></div><div class="tablewrap"><table><thead><tr><th>SPÓŁKA</th><th>CENA UDZIAŁU</th><th>ZMIANA</th><th>TWOJE UDZIAŁY</th><th>STATUS</th><th>OPERACJE</th></tr></thead><tbody>'+rows(list,true)+'</tbody></table></div></section><p class="footerhint">Notowania reagują na kondycję operacyjną firm. Spółki poza Twoją grupą również rozwijają się samodzielnie — konkurencja nie stoi w miejscu.</p>'}
function assets(){return head('ZASOBY OPERACYJNE','Majątek grupy','Skonsolidowane zasoby wszystkich spółek, nad którymi masz kontrolę.')+stats()+'<div class="assetgrid">'+[['📦','Paczki dziennie','parcels'],['📮','Automaty paczkowe','lockers'],['🏭','Centra logistyczne','depots'],['🚚','Pojazdy we flocie','vans'],['👷','Pracownicy','employees']].map(function(a){return '<div class="asset"><div class="big">'+a[0]+'</div><b>'+num(total(a[2]))+'</b><small>'+a[1]+'</small></div>'}).join('')+'</div><section class="panel"><div class="panelhead"><h2>MAJĄTEK WEDŁUG SPÓŁEK</h2><small>OPERACJE I INFRASTRUKTURA</small></div><div class="tablewrap"><table><thead><tr><th>SPÓŁKA</th><th>AUTOMATY</th><th>CENTRA</th><th>POJAZDY</th><th>PRACOWNICY</th><th>PACZKI / DZIEŃ</th></tr></thead><tbody>'+controlled().map(function(c){return '<tr><td>'+firmCell(c)+'</td><td>'+num(c.lockers)+'</td><td>'+num(c.depots)+'</td><td>'+num(c.vans)+'</td><td>'+num(c.employees)+'</td><td>'+num(c.parcels)+'</td></tr>'}).join('')+'</tbody></table></div></section>'}
function finance(){return head('DZIAŁ FINANSOWY','Finanse holdingu','Przepływy pieniężne, rentowność i płynność całej grupy.')+stats()+'<div class="stats"><div class="stat"><label>PRZYCHÓD / DZIEŃ</label><strong class="positive">'+fmt(state.revenue)+'</strong><small>Wszystkie kontrolowane spółki</small></div><div class="stat"><label>KOSZTY / DZIEŃ</label><strong>'+fmt(state.expenses)+'</strong><small>Płace, flota, centra i automaty</small></div><div class="stat"><label>WYNIK NETTO / DZIEŃ</label><strong class="'+(state.profit>=0?'positive':'negative')+'">'+fmt(state.profit)+'</strong><small>Po kosztach operacyjnych</small></div><div class="stat"><label>ZADŁUŻENIE</label><strong>'+fmt(state.debt)+'</strong><small>Finansowanie zewnętrzne</small></div></div><section class="panel"><div class="panelhead"><h2>RAPORT OPERACYJNY</h2><small>OSTATNI ZAMKNIĘTY DZIEŃ</small></div><div class="activity"><div class="activityrow"><div class="activityicon">↗</div><div><b>Przychody operacyjne</b><small>Obsługa przesyłek i usług logistycznych</small></div><time class="positive">'+fmt(state.revenue)+'</time></div><div class="activityrow"><div class="activityicon">↘</div><div><b>Koszty operacyjne</b><small>Wynagrodzenia, paliwo, utrzymanie infrastruktury</small></div><time class="negative">−'+fmt(state.expenses)+'</time></div><div class="activityrow"><div class="activityicon">◈</div><div><b>Wynik netto</b><small>Zmiana gotówki holdingu</small></div><time class="'+(state.profit>=0?'positive':'negative')+'">'+fmt(state.profit)+'</time></div></div></section>'}
function render(){var pages={overview:overview,companies:companies,market:market,assets:assets,finance:finance};$('content').innerHTML=pages[state.selected]?pages[state.selected]():overview();$('day').textContent='DZIEŃ '+num(state.day);$('sideName').textContent=state.holding;$('crumb').textContent=({overview:'PRZEGLĄD',companies:'SPÓŁKI',market:'GIEŁDA',assets:'MAJĄTEK',finance:'FINANSE'})[state.selected]||'PRZEGLĄD'}
function nav(page){state.selected=page;document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.dataset.page===page)});render();save()}
document.querySelectorAll('.nav button').forEach(function(b){b.addEventListener('click',function(){nav(b.dataset.page)})});
window.nav=nav;
window.setSpeed=function(n){state.paused=n===0;state.speed=n||1;render();save()};
function showModal(html){$('modal').innerHTML=html;$('modalback').classList.add('open')}
window.closeModal=function(){$('modalback').classList.remove('open')};
$('modalback').addEventListener('click',function(e){if(e.target===$('modalback'))window.closeModal()});
window.openTrade=function(id){var c=firm(id),available=c.shares-c.owned;var parentOptions=controlled().map(function(p){return '<option value="'+p.id+'" '+(p.id==='own'?'selected':'')+'>'+p.name+'</option>'}).join('');showModal('<h2>Zakup udziałów · '+c.name+'</h2><p>Kurs: <b>'+fmt(c.price)+'</b> za udział. Posiadasz '+num(c.owned)+' z '+num(c.shares)+' udziałów. Kontrola wymaga ponad 50% kapitału zakładowego.</p><div class="field"><label>LICZBA UDZIAŁÓW DO KUPIENIA</label><input id="tradeQty" type="number" min="1" max="'+available+'" value="'+Math.min(100,available)+'"></div><div id="tradeCost" class="notice">Koszt transakcji: —</div><div class="field"><label>SPÓŁKA NADRZĘDNA PO PRZEJĘCIU</label><select id="tradeParent">'+parentOptions+'</select></div><div class="modalactions"><button class="btn" onclick="closeModal()">Anuluj</button><button class="btn primary" onclick="buyShares(\''+id+'\')">Kup udziały</button></div>');var input=$('tradeQty');input.addEventListener('input',function(){$('tradeCost').textContent='Koszt transakcji: '+fmt(Math.max(0,Math.floor(Number(input.value)||0))*c.price)+' · '+(c.owned+Math.max(0,Math.floor(Number(input.value)||0)))+'/'+c.shares+' udziałów'});input.dispatchEvent(new Event('input'))};
window.buyShares=function(id){var c=firm(id),q=Math.floor(Number($('tradeQty').value)),parentId=$('tradeParent').value;if(!q||q<1||q>c.shares-c.owned){toast('Nieprawidłowa liczba udziałów.');return}var cost=q*c.price;if(cost>state.bank){toast('Za mało gotówki w holdingu.');return}state.bank-=cost;c.owned+=q;log('📈','Zakup udziałów: '+c.name,'Nabyto '+q+' udziałów za '+fmt(cost)+'.');if(c.owned>c.shares/2&&!c.ownedByPlayer){takeover(c,parentId)}else{save();render();toast('Zakupiono '+q+' udziałów.')}window.closeModal()};
function takeover(c,parentId){var p=firm(parentId);if(!p||!p.ownedByPlayer||p.id===c.id){p=firm('own')}c.ownedByPlayer=true;c.listed=false;c.parentId=p.id;if(!p.subs.includes(c.id))p.subs.push(c.id);log('🏆','PRZEJĘCIE KONTROLNE: '+c.name,'Firma dołącza do '+p.name+'. '+num(c.lockers)+' automatów, '+num(c.depots)+' centrów, '+num(c.vans)+' pojazdów i '+num(c.employees)+' pracowników przejęto pod kontrolę grupy.');save();render();toast('PRZEJĘCIE ZAKOŃCZONE — '+c.name+' dołącza do '+p.name+'!')}
window.openCompany=function(id){var c=firm(id),parents=controlled().filter(function(p){return p.id!==c.id&&!isDescendant(p.id,c.id)}).map(function(p){return '<option value="'+p.id+'" '+(c.parentId===p.id?'selected':'')+'>'+p.name+'</option>'}).join('');showModal('<h2>'+c.name+'</h2><p>'+c.sector+' · '+Math.round(c.owned/c.shares*100)+'% udziałów · Poziom '+c.level+'</p><div class="companymetrics"><div><small>WYCENA SPÓŁKI</small><b>'+fmt(c.value)+'</b></div><div><small>GOTÓWKA FIRMY</small><b>'+fmt(c.cash)+'</b></div><div><small>PRACOWNICY</small><b>'+num(c.employees)+'</b></div><div><small>PACZKI / DZIEŃ</small><b>'+num(c.parcels)+'</b></div><div><small>AUTOMATY</small><b>'+num(c.lockers)+'</b></div><div><small>CENTRA / AUTA</small><b>'+num(c.depots)+' / '+num(c.vans)+'</b></div></div><div class="notice" style="margin-top:13px">Firma rozwija się automatycznie. Inwestycje przyspieszają wzrost i zwiększają jej zdolności operacyjne.</div><div class="field"><label>SPÓŁKA NADRZĘDNA</label><select id="newParent">'+(c.id==='own'?'<option value="">Główna spółka holdingu</option>':parents)+'</select></div><div class="modalactions"><button class="btn" onclick="closeModal()">Zamknij</button><button class="btn" onclick="moveCompany(\''+id+'\')">Zmień strukturę</button><button class="btn primary" onclick="upgradeCompany(\''+id+'\')">Rozwiń · '+fmt(500000*c.level)+'</button></div>')};
function isDescendant(candidate,ancestor){var p=firm(candidate),guard=0;while(p&&p.parentId&&guard++<20){if(p.parentId===ancestor)return true;p=firm(p.parentId)}return false}
window.moveCompany=function(id){var c=firm(id),parentId=$('newParent').value;if(!parentId||!firm(parentId)||!firm(parentId).ownedByPlayer||isDescendant(parentId,id)){toast('Nieprawidłowa spółka nadrzędna.');return}if(c.parentId&&firm(c.parentId)){firm(c.parentId).subs=firm(c.parentId).subs.filter(function(x){return x!==id})}c.parentId=parentId;if(!firm(parentId).subs.includes(id))firm(parentId).subs.push(id);log('🏢','Zmiana struktury: '+c.name,'Spółka została przypisana do '+firm(parentId).name+'.');save();render();window.closeModal();toast('Zmieniono strukturę holdingu.')};
window.upgradeCompany=function(id){var c=firm(id),cost=500000*c.level;if(state.bank<cost){toast('Za mało gotówki w holdingu.');return}state.bank-=cost;c.level++;c.parcels=Math.round(c.parcels*1.22);c.lockers+=Math.max(5,Math.round(c.lockers*.12));c.vans+=Math.max(2,Math.round(c.vans*.1));c.employees+=Math.max(5,Math.round(c.employees*.08));c.depots+=1;c.value=Math.round(c.value*1.2);c.cash+=Math.round(cost*.15);log('⬆️','Rozwój spółki '+c.name,'Inwestycja '+fmt(cost)+' podniosła poziom firmy do '+c.level+'.');save();render();window.closeModal();toast('Spółka rozwinięta!')};
window.createSub=function(){var options=controlled().map(function(p){return '<option value="'+p.id+'" '+(p.id==='own'?'selected':'')+'>'+p.name+'</option>'}).join('');showModal('<h2>Załóż spółkę-córkę</h2><p>Nowa firma będzie miała własną kasę, pracowników, flotę i tempo rozwoju. Otrzymasz 100% jej udziałów.</p><div class="field"><label>NAZWA SPÓŁKI</label><input id="subName" maxlength="30" placeholder="np. Omega Air Cargo"></div><div class="field"><label>SPECJALIZACJA</label><select id="subSector"><option>Kurier i dostawy</option><option>Paczkomaty</option><option>Transport ciężarowy</option><option>Centra logistyczne</option><option>Transport lotniczy</option><option>Logistyka międzynarodowa</option><option>Technologie logistyczne</option></select></div><div class="field"><label>SPÓŁKA NADRZĘDNA</label><select id="subParent">'+options+'</select></div><div class="notice">Kapitał założycielski: 1 500 000 zł · Twoja własność: 100%</div><div class="modalactions"><button class="btn" onclick="closeModal()">Anuluj</button><button class="btn primary" onclick="confirmSub()">Załóż spółkę</button></div>')};
window.confirmSub=function(){var name=$('subName').value.trim(),sector=$('subSector').value,parentId=$('subParent').value;if(name.length<3){toast('Nazwa musi mieć co najmniej 3 znaki.');return}if(state.bank<1500000){toast('Potrzebujesz 1 500 000 zł kapitału.');return}if(state.companies.some(function(c){return c.name.toLowerCase()===name.toLowerCase()})){toast('Taka nazwa już istnieje.');return}var p=firm(parentId);if(!p||!p.ownedByPlayer){toast('Wybierz spółkę z własnej grupy.');return}state.bank-=1500000;var id='sub'+uid(),ticker=name.replace(/[^A-Z0-9]/gi,'').slice(0,4).toUpperCase()||'NEW';state.companies.push({id:id,name:name,ticker:ticker,sector:sector,owned:1000,shares:1000,price:1500,value:1500000,cash:300000,parcels:100,depots:1,lockers:5,vans:4,employees:12,level:1,subs:[],growth:2.2,ownedByPlayer:true,listed:false,parentId:parentId});p.subs.push(id);log('🏢','Utworzono spółkę-córkę: '+name,'Nowa firma rozpoczęła działalność pod skrzydłami '+p.name+'.');save();render();window.closeModal();toast('Spółka-córka została utworzona.')};
function simulate(){if(state.paused)return;state.day++;var rev=0,cost=0;state.companies.forEach(function(c){var active=c.ownedByPlayer;var g=c.growth/100*(active?(.55+Math.random()*.9):(.25+Math.random()*.6));c.parcels=Math.max(1,Math.round(c.parcels*(1+g)));c.value=Math.max(100000,Math.round(c.value*(1+g*.32)));c.lockers+=Math.random()<g*1.6?1:0;c.vans+=Math.random()<g*.8?1:0;if(active){var r=c.parcels*18,ex=c.employees*95+c.vans*110+c.depots*900+c.lockers*3.2;rev+=r;cost+=ex;c.cash+=r-ex;c.cash=Math.max(0,c.cash)}c.change=(Math.random()-(active?.42:.46))*(active?2.5:3.1);c.price=Math.max(100,Math.round(c.price*(1+c.change/100)));});state.revenue=Math.round(rev);state.expenses=Math.round(cost);state.profit=Math.round(rev-cost);state.bank=Math.max(0,state.bank+state.profit);state.history.push(state.bank);state.history=state.history.slice(-30);if(state.day%5===0)log('📊','Raport operacyjny — dzień '+state.day,'Wynik grupy: '+fmt(state.profit)+'. Wolumen: '+num(total('parcels'))+' paczek dziennie.');save();render()}
window.resetGame=function(){if(!confirm('Usunąć zapis gry i rozpocząć nowe imperium od początku?'))return;state=seed();save();nav('overview');toast('Nowa gra rozpoczęta.')};
render();setInterval(function(){if(!state.paused){for(var i=0;i<state.speed;i++)simulate()}},5000);
})();
</script>
</body>
</html>
