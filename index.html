<div class="shell">
<aside>
 <div class="brand"><div class="brandmark">L</div><div class="brandtext"><strong>LOGISTICS TYCOON</strong><small>BUSINESS SIMULATOR</small></div></div>
 <div><div class="navlabel">ZARZĄDZANIE</div><nav class="nav">
 <button class="active" data-page="overview"><span class="ico">▦</span><span class="navtext">Przegląd</span></button>
 <button data-page="companies"><span class="ico">▤</span><span class="navtext">Moje spółki</span></button>

 <button data-page="assets"><span class="ico">▣</span><span class="navtext">Majątek</span></button>

 <div class="topbar"><div class="crumb">OMEGA HOLDING <span style="color:#53647b"> / </span> <b id="crumb">PRZEGLĄD</b></div><div class="topright"><span class="live">GOSPODARKA NA ŻYWO</span><span class="day" id="day">DZIEŃ 1</span></div></div>
 <main class="content" id="content"></main>
</div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id), fmt=n=>new Intl.NumberFormat('pl-PL',{maximumFractionDigits:0}).format(Math.floor(n))+' zł', num=n=>new Intl.NumberFormat('pl-PL',{maximumFractionDigits:0}).format(n), pct=n=>(n>=0?'+':'')+n.toFixed(1)+'%', uid=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const initial=()=>({day:1,bank:25000000,debt:0,profit:0,revenue:0,expenses:0,history:[25000000],speed:1,paused:false,selected:'overview',activity:[{icon:'🚀',title:'OMEGA HOLDING rozpoczęło działalność',desc:'Witamy w branży logistycznej. Czas zbudować imperium.',day:1}],companies:[
{id:'own',name:'Omega Logistics',ticker:'OMGL',sector:'Kurier i dostawy',owned:100,shares:1000,price:25000,value:25000000,cash:4500000,parcels:1200,depots:2,lockers:35,vans:28,employees:64,level:1,subs:[],growth:1.8,ownedByPlayer:true,listed:false},
{id:'swift',name:'Swift Parcel',ticker:'SWFT',sector:'Kurier i dostawy',owned:0,shares:1000,price:8200,value:8200000,cash:1500000,parcels:520,depots:1,lockers:18,vans:14,employees:32,level:1,subs:[],growth:2.4,listed:true},
{id:'pacel',name:'Pacel Polska',ticker:'PACL',sector:'Paczkomaty',owned:0,shares:1000,price:14600,value:14600000,cash:2900000,parcels:890,depots:2,lockers:120,vans:22,employees:51,level:2,subs:[],growth:1.7,listed:true},
{id:'north',name:'NorthLine Express',ticker:'NLEX',sector:'Transport',owned:0,shares:1000,price:11200,value:11200000,cash:2100000,parcels:700,depots:3,lockers:8,vans:48,employees:73,level:1,subs:[],growth:1.3,listed:true},
{id:'box',name:'BoxPoint',ticker:'BXPT',sector:'Paczkomaty',owned:0,shares:1000,price:6800,value:6800000,cash:900000,parcels:400,depots:1,lockers:95,vans:9,employees:25,level:1,subs:[],growth:2.9,listed:true},
{id:'cargo',name:'CargoMax',ticker:'CRMX',sector:'Centra logistyczne',owned:0,shares:1000,price:19400,value:19400000,cash:3700000,parcels:1100,depots:7,lockers:12,vans:65,employees:110,level:3,subs:[],growth:1.1,listed:true},
{id:'euro',name:'EuroShip',ticker:'ERSH',sector:'Kurier międzynarodowy',owned:0,shares:1000,price:27300,value:27300000,cash:5100000,parcels:1600,depots:4,lockers:40,vans:82,employees:145,level:2,subs:[],growth:1.6,listed:true}
],events:[]});
let state;try{state=JSON.parse(localStorage.getItem('logistics_tycoon_save'))||initial()}catch(e){state=initial()}
let modalAction=null;
function save(){localStorage.setItem('logistics_tycoon_save',JSON.stringify(state))}
function log(icon,title,desc){state.activity.unshift({icon,title,desc,day:state.day});state.activity=state.activity.slice(0,30)}
function company(id){return state.companies.find(c=>c.id===id)}
function groupValue(){return state.companies.filter(c=>c.ownedByPlayer).reduce((a,c)=>a+c.value*c.owned/100,0)}
function total(key){return state.companies.filter(c=>c.ownedByPlayer).reduce((a,c)=>a+c[key],0)}
function controlled(){return state.companies.filter(c=>c.ownedByPlayer).length}
function ownedCompanies(){return state.companies.filter(c=>c.ownedByPlayer)}
function nav(page){state.selected=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('crumb').textContent=({overview:'PRZEGLĄD',companies:'MOJE SPÓŁKI',market:'GIEŁDA',assets:'MAJĄTEK',finance:'FINANSE'})[page];render();save()}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.page)));
function toast(msg){let t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function head(k,title,sub,action=''){return '<div class="pagehead"><div><div class="eyebrow">'+k+'</div><h1>'+title+'</h1><p>'+sub+'</p></div>'+action+'</div>'}
function stats(){return '<div class="stats"><div class="stat"><label>WARTOŚĆ GRUPY</label><strong>'+fmt(groupValue())+'</strong><small class="positive">Wycena wszystkich kontrolowanych spółek</small></div><div class="stat"><label>GOTÓWKA HOLDINGU</label><strong>'+fmt(state.bank)+'</strong><small>Wolne środki na inwestycje</small></div><div class="stat"><label>SPÓŁKI W GRUPIE</label><strong>'+controlled()+'</strong><small>Spółki zależne i główna</small></div><div class="stat"><label>DZIENNY WOLUMEN</label><strong>'+num(total('parcels'))+'</strong><small>Paczki obsługiwane dziennie</small></div></div>'}
function companyRows(list,market=false){return list.map(c=>'<tr><td><div class="companycell"><div class="logo">'+c.ticker.slice(0,2)+'</div><div><b>'+c.name+'</b><small>'+c.ticker+' · '+c.sector+'</small></div></div></td><td>'+fmt(c.price)+'</td><td class="'+(c.change>=0?'positive':'negative')+'">'+pct(c.change||0)+'</td><td>'+num(c.owned)+' / '+num(c.shares)+'</td><td>'+(c.ownedByPlayer?'<span class="tag good">W GRUPIE</span>':c.owned>500?'<span class="tag warn">KONTROLA</span>':'<span class="tag">NA SPRZEDAŻ</span>')+'</td><td><div class="rowactions">'+(market?'<button class="btn mini" onclick="openTrade(\\''+c.id+'\\')">Handluj</button>':'<button class="btn mini" onclick="openCompany(\\''+c.id+'\\')">Zarządzaj</button>')+'</div></td></tr>').join('')}
function overview(){let comps=ownedCompanies();return head('CENTRUM DOWODZENIA','Buduj logistyczne imperium','Twoja grupa kapitałowa działa przez całą dobę. Zarządzaj aktywami i przejmuj konkurencję.','<div class="speed"><button onclick="setSpeed(0)" class="'+(state.paused?'active':'')+'">PAUZA</button><button onclick="setSpeed(1)" class="'+(state.speed===1&&!state.paused?'active':'')+'">1×</button><button onclick="setSpeed(3)" class="'+(state.speed===3&&!state.paused?'active':'')+'">3×</button><button onclick="setSpeed(8)" class="'+(state.speed===8&&!state.paused?'active':'')+'">8×</button></div>')+stats()+'<div class="grid2"><section class="panel"><div class="panelhead"><h2>WYNIKI GRUPY</h2><small>Wartość gotówki · ostatnie 12 dni</small></div><div class="bars">'+state.history.slice(-12).map((v,i)=>'<div class="barcol"><div class="bar" style="height:'+Math.max(3,Math.min(100,v/Math.max(1,...state.history.slice(-12))*100))+'%"></div><small>'+(i+1)+'</small></div>').join('')+'</div><div class="chartlabels"><span>HISTORIA</span><span>'+fmt(state.bank)+'</span></div></section><section class="panel"><div class="panelhead"><h2>AKTYWNOŚĆ GRUPY</h2><small>OSTATNIE ZDARZENIA</small></div><div class="activity">'+state.activity.slice(0,5).map(a=>'<div class="activityrow"><div class="activityicon">'+a.icon+'</div><div><b>'+a.title+'</b><small>'+a.desc+'</small></div><time>D'+a.day+'</time></div>').join('')+'</div></section></div><section class="panel"><div class="panelhead"><h2>SPÓŁKI W TWOJEJ GRUPIE</h2><button class="btn mini" onclick="nav(\\'companies\\')">Zobacz wszystkie →</button></div><div class="tablewrap"><table><thead><tr><th>SPÓŁKA</th><th>KURS / WYCENA</th><th>ZMIANA</th><th>UDZIAŁY</th><th>STATUS</th><th></th></tr></thead><tbody>'+companyRows(comps)+'</tbody></table></div></section><div class="footerhint">Wskazówka: kupuj udziały konkurencji na giełdzie. Przekroczenie 50% udziałów daje Ci kontrolę nad spółką, a jej majątek i działalność zostaną włączone do Twojej grupy.</div>'}
function companies(){let c=ownedCompanies();return head('STRUKTURA HOLDINGU','Moje spółki','Zarządzaj firmami, rozwijaj je i twórz kolejne spółki-córki.','<button class="btn primary" onclick="createSub()">＋ Utwórz spółkę-córkę</button>')+stats()+'<div class="companygrid">'+c.map(x=>'<article class="companycard"><div class="companytop"><div class="logo">'+x.ticker.slice(0,2)+'</div><div><h3>'+x.name+'</h3><small>'+x.ticker+' · '+x.sector+'</small></div></div><div style="display:flex;justify-content:space-between"><span class="tag good">'+(x.owned===100?'100% WŁASNOŚCI':x.owned+'% UDZIAŁÓW')+'</span><span class="tag">POZIOM '+x.level+'</span></div><div class="companymetrics"><div><small>WYCENA SPÓŁKI</small><b>'+fmt(x.value)+'</b></div><div><small>PRZYCHÓD / DZIEŃ</small><b>'+fmt(x.parcels*18)+'</b></div><div><small>PRACOWNICY</small><b>'+num(x.employees)+'</b></div><div><small>OBSŁUGA PACZEK</small><b>'+num(x.parcels)+'</b></div></div><div class="cardfoot"><small style="color:var(--muted)">'+x.lockers+' automatów · '+x.depots+' centrów · '+x.vans+' aut</small><button class="btn mini" onclick="openCompany(\\''+x.id+'\\')">Zarządzaj →</button></div></article>').join('')+'</div>'}
function market(){let list=state.companies.filter(c=>c.listed&&!c.ownedByPlayer);return head('RYNEK KAPITAŁOWY','Giełda papierów wartościowych','Kupuj udziały, buduj pozycję i przejmuj konkurencyjne przedsiębiorstwa.')+stats()+'<div class="notice">◆ PRZEJĘCIE KONTROLNE: posiadanie ponad 50% udziałów pozwala przejąć spółkę. Jej aktywa, pracownicy, flota, centra i automaty paczkowe zostaną włączone do Twojej grupy.</div><section class="panel"><div class="panelhead"><h2>NOTOWANE SPÓŁKI</h2><small>'+list.length+' SPÓŁEK NA PARKIECIE</small></div><div class="tablewrap"><table><thead><tr><th>SPÓŁKA</th><th>CENA UDZIAŁU</th><th>ZMIANA DNIA</th><th>TWOJE UDZIAŁY</th><th>STATUS</th><th>OPERACJE</th></tr></thead><tbody>'+companyRows(list,true)+'</tbody></table></div></section><p class="footerhint">Ceny akcji zmieniają się wraz z wynikami operacyjnymi spółek. Duże pakiety udziałów mogą kosztować więcej — rynek reaguje na popyt.</p>'}
function assets(){return head('ZASOBY OPERACYJNE','Majątek grupy','Wszystkie zasoby należące do spółek, nad którymi sprawujesz kontrolę.')+stats()+'<div class="assetgrid">'+[['📦','Paczki dziennie','parcels'],['📮','Automaty paczkowe','lockers'],['🏭','Centra logistyczne','depots'],['🚚','Pojazdy we flocie','vans'],['👷','Pracownicy','employees']].map(a=>'<div class="asset"><div class="bigico">'+a[0]+'</div><b>'+num(total(a[2]))+'</b><small>'+a[1]+'</small></div>').join('')+'</div><section class="panel" style="margin-top:15px"><div class="panelhead"><h2>ROZKŁAD MAJĄTKU WEDŁUG SPÓŁEK</h2><small>AKTYWA OPERACYJNE</small></div><div class="tablewrap"><table><thead><tr><th>SPÓŁKA</th><th>AUTOMATY</th><th>CENTRA</th><th>POJAZDY</th><th>PRACOWNICY</th><th>WOLUMEN / DZIEŃ</th></tr></thead><tbody>'+ownedCompanies().map(c=>'<tr><td><b>'+c.name+'</b></td><td>'+num(c.lockers)+'</td><td>'+num(c.depots)+'</td><td>'+num(c.vans)+'</td><td>'+num(c.employees)+'</td><td>'+num(c.parcels)+'</td></tr>').join('')+'</tbody></table></div></section>'}
function finance(){return head('DZIAŁ FINANSOWY','Finanse holdingu','Kontroluj płynność, przychody, koszty i wynik całej grupy.')+stats()+'<div class="stats"><div class="stat"><label>PRZYCHÓD ŁĄCZNY / DZIEŃ</label><strong class="positive">'+fmt(state.revenue)+'</strong><small>Przychody operacyjne spółek</small></div><div class="stat"><label>KOSZTY ŁĄCZNE / DZIEŃ</label><strong>'+fmt(state.expenses)+'</strong><small>Wynagrodzenia, paliwo, utrzymanie</small></div><div class="stat"><label>WYNIK DZIENNY</label><strong class="'+(state.profit>=0?'positive':'negative')+'">'+fmt(state.profit)+'</strong><small>Po odliczeniu kosztów</small></div><div class="stat"><label>ZADŁUŻENIE</label><strong>'+fmt(state.debt)+'</strong><small>Finansowanie zewnętrzne</small></div></div><section class="panel"><div class="panelhead"><h2>RAPORT FINANSOWY</h2><small>OSTATNI ZAMKNIĘTY DZIEŃ</small></div><div class="activity"><div class="activityrow"><div class="activityicon">↗</div><div><b>Przychody operacyjne</b><small>Wszystkie spółki w grupie</small></div><time class="positive">'+fmt(state.revenue)+'</time></div><div class="activityrow"><div class="activityicon">↘</div><div><b>Koszty operacyjne</b><small>Flota, pracownicy, infrastruktura</small></div><time class="negative">−'+fmt(state.expenses)+'</time></div><div class="activityrow"><div class="activityicon">◈</div><div><b>Wynik netto</b><small>Zmiana gotówki holdingu</small></div><time class="'+(state.profit>=0?'positive':'negative')+'">'+fmt(state.profit)+'</time></div></div></section>'}
function render(){let html=({overview,companies,market,assets,finance})[state.selected]();$('content').innerHTML=html;$('day').textContent='DZIEŃ '+num(state.day)}
window.nav=nav;window.setSpeed=n=>{state.paused=n===0;state.speed=n||1;render();save()};
window.openTrade=id=>{let c=company(id);showModal('<h2>Handel akcjami · '+c.name+'</h2><p>Kurs jednej akcji: <b>'+fmt(c.price)+'</b>. Posiadasz '+c.owned+' z '+c.shares+' udziałów. Przy przekroczeniu 50% przejmiesz całą spółkę.</p><div class="field"><label>LICZBA UDZIAŁÓW DO KUPIENIA</label><input id="tradeQty" type="number" min="1" max="'+(c.shares-c.owned)+'" value="'+Math.min(100,c.shares-c.owned)+'"></div><div id="tradeCost" class="notice">Koszt: —</div><div class="modalactions"><button class="btn" onclick="closeModal()">Anuluj</button><button class="btn primary" onclick="buyShares(\\''+id+'\\')">Kup udziały</button></div>');$('tradeQty').addEventListener('input',()=>{$('tradeCost').textContent='Koszt: '+fmt(Math.max(0,Number($('tradeQty').value))*c.price)}) ;$('tradeQty').dispatchEvent(new Event('input'))};
window.buyShares=id=>{let c=company(id),q=Math.floor(Number($('tradeQty').value));if(!q||q<1||q>c.shares-c.owned){toast('Nieprawidłowa liczba udziałów.');return}let cost=q*c.price;if(cost>state.bank){toast('Za mało gotówki na tę transakcję.');return}state.bank-=cost;c.owned+=q;log('📈','Zakup udziałów '+c.name,'Nabyto '+q+' udziałów za '+fmt(cost)+'.');if(c.owned>500){takeover(c)}closeModal();save();render();toast('Zakupiono '+q+' udziałów.')};
function takeover(c){c.ownedByPlayer=true;c.listed=false;let parent=company('own');if(c.id!=='own')parent.subs.push(c.id);log('🏆','PRZEJĘCIE: '+c.name,'Twoja grupa przejęła pełną kontrolę. '+c.lockers+' automatów, '+c.depots+' centrów, '+c.vans+' pojazdów i '+c.employees+' pracowników dołączono do holdingu.');toast('PRZEJĘCIE ZAKOŃCZONE: '+c.name+' jest teraz w Twojej grupie!')}
window.openCompany=id=>{let c=company(id);showModal('<h2>'+c.name+'</h2><p>'+c.sector+' · '+c.owned+'% udziałów · Poziom '+c.level+'</p><div class="companymetrics"><div><small>GOTÓWKA SPÓŁKI</small><b>'+fmt(c.cash)+'</b></div><div><small>WYCENA</small><b>'+fmt(c.value)+'</b></div><div><small>PRACOWNICY</small><b>'+num(c.employees)+'</b></div><div><small>PACZKI / DZIEŃ</small><b>'+num(c.parcels)+'</b></div></div><div class="notice" style="margin-top:15px">Rozwój spółki zwiększa jej wydajność, przychody i wycenę. Każda firma rozwija się automatycznie w czasie.</div><div class="modalactions"><button class="btn" onclick="closeModal()">Zamknij</button><button class="btn primary" onclick="upgradeCompany(\\''+id+'\\')">Rozwiń spółkę · '+fmt(500000*c.level)+'</button></div>')};
window.upgradeCompany=id=>{let c=company(id),cost=500000*c.level;if(state.bank<cost){toast('Za mało gotówki w holdingu.');return}state.bank-=cost;c.level++;c.parcels=Math.round(c.parcels*1.22);c.lockers+=Math.max(5,Math.round(c.lockers*.12));c.vans+=Math.max(2,Math.round(c.vans*.1));c.employees+=Math.max(5,Math.round(c.employees*.08));c.value=Math.round(c.value*1.18);log('⬆️','Rozwój spółki '+c.name,'Inwestycja '+fmt(cost)+' podniosła poziom firmy do '+c.level+'.');closeModal();save();render();toast('Spółka rozwinięta!')};
window.createSub=()=>showModal('<h2>Nowa spółka-córka</h2><p>Załóż niezależną firmę w ramach Omega Holding. Możesz wybrać jej nazwę i specjalizację. Spółka od razu rozpocznie działalność.</p><div class="field"><label>NAZWA SPÓŁKI</label><input id="subName" maxlength="28" placeholder="np. Omega Air Cargo"></div><div class="field"><label>SPECJALIZACJA</label><input id="subSector" maxlength="28" value="Kurier i dostawy" placeholder="np. Transport lotniczy"></div><div class="notice">Kapitał założycielski: 1 500 000 zł. 100% udziałów pozostaje w holdingu.</div><div class="modalactions"><button class="btn" onclick="closeModal()">Anuluj</button><button class="btn primary" onclick="confirmSub()">Załóż spółkę</button></div>');
window.confirmSub=()=>{let name=$('subName').value.trim(),sector=$('subSector').value.trim()||'Logistyka';if(name.length<3){toast('Podaj nazwę spółki (min. 3 znaki).');return}if(state.bank<1500000){toast('Potrzebujesz 1 500 000 zł kapitału.');return}if(state.companies.some(c=>c.name.toLowerCase()===name.toLowerCase())){toast('Taka nazwa już istnieje.');return}state.bank-=1500000;let id='sub'+uid(),ticker=name.replace(/[^A-Z0-9]/gi,'').slice(0,4).toUpperCase()||'NEW';state.companies.push({id,name,ticker,sector,owned:100,shares:1000,price:1500,value:1500000,cash:300000,parcels:100,depots:1,lockers:5,vans:4,employees:12,level:1,subs:[],growth:2.2,ownedByPlayer:true,listed:false});company('own').subs.push(id);log('🏢','Utworzono spółkę-córkę '+name,'Nowa firma rozpoczęła działalność w grupie Omega Holding.');closeModal();save();render();toast('Spółka-córka została utworzona.')};
function showModal(html){$('modal').innerHTML=html;$('modalback').classList.add('open')}window.closeModal=()=>$('modalback').classList.remove('open');$('modalback').addEventListener('click',e=>{if(e.target===$('modalback'))closeModal()});
function simulate(){if(state.paused)return;state.day++;let rev=0,cost=0;for(let c of ownedCompanies()){let growth=1+c.growth/100*(.5+Math.random());c.parcels=Math.round(c.parcels*growth);c.value=Math.round(c.value*(1+c.growth/100*.24));let r=c.parcels*18,ex=c.employees*95+c.vans*110+c.depots*900+c.lockers*3.2;rev+=r;cost+=ex;c.cash+=r-ex;c.change=(Math.random()-.42)*2.5;c.price=Math.max(100,Math.round(c.price*(1+c.change/100)));}for(let c of state.companies.filter(c=>!c.ownedByPlayer)){c.parcels=Math.round(c.parcels*(1+c.growth/100*.12));c.value=Math.round(c.value*(1+c.growth/100*.2));c.change=(Math.random()-.46)*3;c.price=Math.max(100,Math.round(c.price*(1+c.change/100)));}state.revenue=Math.round(rev);state.expenses=Math.round(cost);state.profit=Math.round(rev-cost);state.bank=Math.max(0,state.bank+state.profit);state.history.push(state.bank);state.history=state.history.slice(-30);if(state.day%5===0){log('📊','Raport operacyjny — dzień '+state.day,'Wynik grupy: '+fmt(state.profit)+'. Łącznie '+num(total('parcels'))+' paczek dziennie.')}save();render()}
setInterval(()=>{if(!state.paused){for(let i=0;i<state.speed;i++)simulate()}},5000);
render();
})();
</script>
</body></html>
