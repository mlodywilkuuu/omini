<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ropucha Group Tycoon</title>

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#111;
  color:#fff;
}

button,input,select{
  font:inherit;
}

#map{
  position:absolute;
  inset:0;
  z-index:1;
  background:#ddd;
}

.leaflet-tile{
  image-rendering:auto!important;
}

/* ================= HUD ================= */

#hud{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:6px;
  z-index:1500;
  pointer-events:none;
}

.hudBox{
  min-width:100px;
  background:#111e;
  border:2px solid #333;
  border-radius:9px;
  padding:7px 12px;
  text-align:center;
  box-shadow:0 4px 15px #0006;
}

.hudBox small{
  display:block;
  color:#999;
  font-size:9px;
  text-transform:uppercase;
}

.hudBox strong{
  font-size:17px;
}

#money{
  color:#67eb79;
}

/* ================= SIDEBAR ================= */

#sidebar{
  position:fixed;
  left:12px;
  top:80px;
  bottom:12px;
  width:350px;
  z-index:1400;
  background:#111e;
  border:2px solid #333;
  border-radius:13px;
  padding:12px;
  overflow-y:auto;
  backdrop-filter:blur(8px);
}

.logo{
  color:#67e879;
  font-size:20px;
  font-weight:900;
  margin-bottom:10px;
}

.tabs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  margin-bottom:10px;
}

.tab{
  border:0;
  border-radius:6px;
  background:#292929;
  color:#fff;
  padding:8px 5px;
  cursor:pointer;
  font-size:12px;
}

.tab.active{
  background:#176d38;
}

.panel{
  display:none;
}

.panel.active{
  display:block;
}

.box{
  background:#252525;
  border-radius:9px;
  padding:10px;
  margin-bottom:8px;
}

.box h3{
  margin:0 0 8px;
  font-size:14px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin:5px 0;
  color:#ccc;
  font-size:12px;
}

.btn{
  width:100%;
  border:0;
  border-radius:6px;
  padding:8px;
  margin-top:5px;
  background:#176d38;
  color:#fff;
  cursor:pointer;
  font-weight:bold;
}

.btn:hover{
  filter:brightness(1.15);
}

.btn:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.blue{background:#285e9b}
.orange{background:#9c5e22}
.gray{background:#555}
.red{background:#8d3838}

/* ================= COMPANY ================= */

.company{
  background:#282828;
  border-radius:8px;
  padding:10px;
  margin-bottom:8px;
}

.companyName{
  font-weight:bold;
  margin-bottom:6px;
}

.shareBar{
  height:8px;
  background:#444;
  border-radius:5px;
  overflow:hidden;
  margin:7px 0;
}

.shareFill{
  height:100%;
  background:#65df75;
}

.shareButtons{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:4px;
}

.shareButtons button{
  border:0;
  border-radius:5px;
  padding:6px;
  background:#315d3a;
  color:white;
  cursor:pointer;
}

/* ================= MARKERS ================= */

.gameMarker{
  width:36px;
  height:36px;
  border:3px solid white;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:19px;
  box-shadow:0 3px 10px #0008;
}

.storeMarker{
  background:#18733b;
}

.centerMarker{
  background:#285e9d;
}

.factoryMarker{
  background:#9d612b;
}

/* ================= BUILD ================= */

#buildInfo{
  display:none;
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  z-index:3000;
  background:#111e;
  border:2px solid #555;
  border-radius:9px;
  padding:10px 20px;
}

/* ================= NOTIFICATIONS ================= */

#notifications{
  position:fixed;
  right:15px;
  bottom:15px;
  width:310px;
  z-index:8000;
}

.notification{
  background:#111f;
  border-left:5px solid #63df73;
  border-radius:6px;
  padding:10px;
  margin-top:6px;
  font-size:12px;
}

/* ================= MONEY FX ================= */

.moneyFx{
  position:fixed;
  top:75px;
  left:50%;
  z-index:9000;
  font-size:25px;
  font-weight:900;
  pointer-events:none;
  animation:moneyAnim 1.4s forwards;
}

.moneyPlus{color:#68f079}
.moneyMinus{color:#ff6262}

@keyframes moneyAnim{
  0%{
    opacity:0;
    transform:translate(-50%,20px);
  }

  20%{
    opacity:1;
    transform:translate(-50%,0) scale(1.15);
  }

  100%{
    opacity:0;
    transform:translate(-50%,-50px);
  }
}

/* ================= MODAL ================= */

#modalBackground{
  display:none;
  position:fixed;
  inset:0;
  z-index:7000;
  background:#000a;
  align-items:center;
  justify-content:center;
}

#modal{
  width:min(650px,90vw);
  max-height:85vh;
  overflow-y:auto;
  background:#181818;
  border:2px solid #444;
  border-radius:14px;
  padding:17px;
}

.closeBtn{
  float:right;
  border:0;
  border-radius:6px;
  padding:7px 10px;
  background:#8d3434;
  color:#fff;
  cursor:pointer;
}

/* ================= CONSOLE ================= */

#console{
  display:none;
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(700px,90vw);
  height:430px;
  background:#080b09f7;
  border:2px solid #59e36d;
  border-radius:10px;
  z-index:20000;
  overflow:hidden;
  font-family:Consolas,monospace;
  box-shadow:0 20px 80px #000;
}

#consoleHeader{
  height:45px;
  padding:13px;
  background:#142117;
  border-bottom:1px solid #315d38;
  color:#69ef7d;
  font-weight:bold;
}

#consoleHistory{
  height:325px;
  padding:12px;
  overflow-y:auto;
  white-space:pre-wrap;
  color:#bacabd;
  font-size:13px;
  line-height:1.5;
}

#consoleInputBox{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:58px;
  padding:8px 12px;
  display:flex;
  align-items:center;
  gap:8px;
  background:#0c110d;
  border-top:1px solid #315d38;
  color:#67e77a;
}

#consoleInput{
  flex:1;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-family:Consolas,monospace;
}

/* ================= MOBILE ================= */

@media(max-width:800px){

  #sidebar{
    width:290px;
  }

  .hudBox:nth-child(n+4){
    display:none;
  }
}
</style>
</head>

function generateFoodCompany(
  silent=false
){

  const location =
    worldLocations[
      random(
        0,
        worldLocations.length-1
      )
    ];

  const product =
    companyProducts[
      random(
        0,
        companyProducts.length-1
      )
    ];

  const prefix =
    companyPrefixes[
      random(
        0,
        companyPrefixes.length-1
      )
    ];

  const suffix =
    companySuffixes[
      random(
        0,
        companySuffixes.length-1
      )
    ];

  const valuation =
    random(
      600000,
      30000000
    );

  const profit =
    Math.max(
      3000,
      Math.floor(
        valuation*
        random(3,10)/
        1000
      )
    );

  const capacity =
    random(
      30000,
      250000
    );

  const production =
    Math.floor(
      capacity*
      random(55,95)/
      100
    );

  const company = {

    id:
      "company_"+
      nextCompanyId++,

    name:
      product.emoji+
      " "+
      prefix+
      suffix,

    product:
      product.name,

    city:
      location.city,

    country:
      location.country,

    lat:
      location.lat+
      (
        Math.random()-.5
      )*.8,

    lng:
      location.lng+
      (
        Math.random()-.5
      )*.8,

    valuation,

    profit,

    production,

    capacity,

    shares:0,

    controlled:false,

    acquired:false,

    foundedDay:day,

    marker:null
  };

  companies.push(
    company
  );

  company.marker =
    L.marker(
      [
        company.lat,
        company.lng
      ],
      {
        icon:
          icons.factory
      }
    )
    .addTo(map);

  updateCompanyPopup(
    company
  );

  if(!silent){

    notify(
      "🌍 Nowa firma: "+
      company.name+
      " • "+
      company.city
    );
  }

  return company;
}

function updateCompanyPopup(
  company
){

  company.marker.bindPopup(`

    <br><br>

    📍

    ${company.country}

    <br>

    🍴
    ${company.product}

    <br>

    💰 Wycena:

    )}

    <br>

    📈 Zysk:
    ${moneyText(
      company.profit
    )}/dzień

    <br>

    🏭 Produkcja:
    ${number(
      company.production
    )}
    /
    ${number(
      company.capacity
    )}

    <br>

    📊 Twoje udziały:
    ${company.shares}%

  `);
}

*/

    generateFoodCompany();

/* =========================================================

========================================================= */

function recruitFranchisee(){

  if(
    franchisees.length>=
    maxFranchisees
  ){

    notify(
      "❌ Limit franczyzobiorców."
    );

    return;
  }

  const cost=5000;

  if(money<cost){

    notify(
      "❌ Brakuje pieniędzy."
    );

    return;
  }

  changeMoney(-cost);

  franchisees.push({

    id:
      Date.now()+
      Math.random(),

    name:
      randomName(),

    stores:[],

    skill:
      random(1,5)

  });

  notify(
    "🤝 Zrekrutowano franczyzobiorcę."
  );

  render();
}

/* =========================================================

========================================================= */

function getStorePrice(){

  return (
    120000+
    stores.length*
    15000
  );
}

function startStoreBuild(){

  if(
    franchisees.length===0
  ){

    notify(
      "❌ Najpierw zatrudnij franczyzobiorcę."
    );

    return;
  }

  const price =
    getStorePrice();

function hireDriver(){

    );

    return;
  }

  const cost=4000;

  if(money<cost){

  }

  changeMoney(
    -cost
  );

  drivers.push({

    id:
      nextDriverId++,

      randomName(),

        350,
        520

    truckId:null,

  });

  notify(
    "👷 Zatrudniono kierowcę."
  );

}

function assignDriver(
  driverId,
  centerId
){

  const driver =
    drivers.find(
      d=>d.id===driverId
    );

  if(!driver){
    return;
  }

  centers.forEach(
    center=>{

      center.drivers =
        center.drivers.filter(
          id=>
            id!==driverId
        );
    }
  );

  if(!centerId){

    driver.centerId=null;

    render();

    return;
  }

  const center =
    centers.find(
      c=>c.id===centerId
    );

  if(!center){
    return;
  }

  driver.centerId=
    centerId;

  if(
    !center.drivers.includes(
      driverId
    )
  ){

    center.drivers.push(
      driverId
    );
  }

  updateCenterPopup(
    center
  );

  render();
}

/* =========================================================
   ROUTES
========================================================= */

function createRoute(
  centerId
){

  const center =
    centers.find(
      c=>c.id===centerId
    );

  if(!center){
    return;
  }

  const driver =
    drivers.find(
      d=>
        d.centerId===
        centerId &&
        !d.routeId
    );

  const truck =
    trucks.find(
      t=>
        t.centerId===
        centerId &&
        !t.routeId
    );

  const store =
    stores.find(
      s=>
        !routes.some(
          r=>
            r.storeId===
            s.id
        )
    );

  if(!driver){

    notify(
      "❌ Brak wolnego kierowcy."
    );

    return;
  }

  if(!truck){

    notify(
      "❌ Brak wolnej ciężarówki."
    );

    return;
  }

  if(!store){

    notify(
      "❌ Brak sklepu bez trasy."
    );

    return;
  }

  const route={

    id:
      nextRouteId++,

    centerId,

    driverId:
      driver.id,

    truckId:
      truck.id,

    storeId:
      store.id,

    line:null
  };

  driver.routeId=
    route.id;

  driver.truckId=
    truck.id;

  truck.routeId=
    route.id;

  truck.driverId=
    driver.id;

  center.routes.push(
    route.id
  );

  route.line =
    L.polyline(
      [
        [
          center.lat,
          center.lng
        ],

        [
          store.lat,
          store.lng
        ]
      ],
      {
        weight:4,
        opacity:.75
      }
    )
    .addTo(map);

  routes.push(
    route
  );

  updateCenterPopup(
    center
  );

  notify(
    "🗺️ Trasa #"+
    route.id+
    " → sklep #"+
    store.id
  );

  render();
}

/* =========================================================
   SHARES
========================================================= */

function getSharePrice(
  company,
  percent
){

  const base =
    company.valuation*
    percent/100;

  /*
    Im więcej udziałów już posiadamy,
    tym droższe stają się kolejne.
  */

  const premium =
    1+
    company.shares/
    100*.35;

  return Math.floor(
    base*premium
  );
}

function buyShares(
  companyId,
  percent
){

  const company =
    companies.find(
      c=>
        c.id===
        companyId
    );

  if(!company){
    return;
  }

  percent =
    Math.min(
      percent,
      100-
      company.shares
    );

  if(percent<=0){
    return;
  }

  const price =
    getSharePrice(
      company,
      percent
    );

  if(money<price){

    notify(
      "❌ Pakiet kosztuje "+
      moneyText(price)
    );

    return;
  }

  changeMoney(
    -price
  );

  company.shares +=
    percent;

  if(
    company.shares>50 &&
    !company.controlled
  ){

    company.controlled=
      true;

    notify(
      "🏢 Zdobyto kontrolę nad "+
      company.name
    );
  }

  if(
    company.shares>=100
  ){

    company.shares=100;

    company.controlled=true;

    company.acquired=true;

    notify(
      "👑 Przejęto "+
      company.name
    );
  }

  updateCompanyPopup(
    company
  );

  render();
}

/* =========================================================
   TAKEOVER
========================================================= */

function takeoverCompany(
  id
){

  const company =
    companies.find(
      c=>c.id===id
    );

  if(
    !company ||
    company.shares<=50 ||
    company.shares>=100
  ){
    return;
  }

  const remaining =
    100-
    company.shares;

  const price =
    Math.floor(
      company.valuation*
      remaining/100*
      1.20
    );

  if(money<price){

    notify(
      "❌ Przejęcie kosztuje "+
      moneyText(price)
    );

    return;
  }

  changeMoney(
    -price
  );

  company.shares=100;
  company.controlled=true;
  company.acquired=true;

  updateCompanyPopup(
    company
  );

  notify(
    "👑 PEŁNE PRZEJĘCIE: "+
    company.name
  );

  closeModal();

  render();
}

/* =========================================================
   COMPANY MARKET
========================================================= */

function updateCompanyMarket(){

  companies.forEach(
    company=>{

      const change =
        random(
          -3,
          4
        )/100;

      company.profit =
        Math.max(
          1000,
          Math.floor(
            company.profit*
            (
              1+
              change
            )
          )
        );

      company.valuation =
        Math.max(
          250000,
          Math.floor(
            company.valuation*
            (
              1+
              change*.25
            )
          )
        );

      /*
        Produkcja też trochę się zmienia.
      */

      const productionChange =
        random(
          -4,
          5
        )/100;

      company.production =
        Math.floor(
          company.production*
          (
            1+
            productionChange
          )
        );

      company.production =
        Math.max(
          1000,
          Math.min(
            company.capacity,
            company.production
          )
        );

      updateCompanyPopup(
        company
      );
    }
  );
}

/* =========================================================
   ECONOMY
========================================================= */

function processDay(){

  day++;

  updateCompanyMarket();

  let storeIncome=0;

  stores.forEach(
    store=>{

      const hasRoute =
        routes.some(
          route=>
            route.storeId===
            store.id
        );

      if(hasRoute){

        store.stock =
          Math.min(
            100,
            store.stock+30
          );

      }else{

        store.stock -=
          12;
      }

      store.stock =
        Math.max(
          0,
          store.stock
        );

      const income =
        store.baseIncome*
        (
          store.stock/100
        );

      storeIncome +=
        income;

      updateStorePopup(
        store
      );
    }
  );

  storeIncome =
    Math.floor(
      storeIncome
    );

  let dividends=0;

  companies.forEach(
    company=>{

      if(
        company.shares<=0
      ){
        return;
      }

      dividends +=
        company.profit*
        company.shares/
        100;
    }
  );

  dividends =
    Math.floor(
      dividends
    );

  let expenses=0;

  drivers.forEach(
    driver=>{

      expenses +=
        driver.salary;
    }
  );

  expenses +=
    trucks.length*
    250;

  expenses +=
    routes.length*
    180;

  totalStoreIncome +=
    storeIncome;

  totalDividends +=
    dividends;

  totalExpenses +=
    expenses;

  changeMoney(
    storeIncome+
    dividends,
    false
  );

  changeMoney(
    -expenses,
    false
  );

  notify(
    "📊 Dzień "+
    day+
    " | sklepy +"+
    moneyText(storeIncome)+
    " | udziały +"+
    moneyText(dividends)+
    " | koszty -"+
    moneyText(expenses)
  );

  render();
}

/* =========================================================
   TABS
========================================================= */

function showTab(
  id,
  button
){

  document
    .querySelectorAll(
      ".panel"
    )
    .forEach(
      panel=>
        panel.classList.remove(
          "active"
        )
    );

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      tab=>
        tab.classList.remove(
          "active"
        )
    );

  document
    .getElementById(
      id
    )
    .classList.add(
      "active"
    );

  button.classList.add(
    "active"
  );
}

/* =========================================================
   MONEY
========================================================= */

function changeMoney(
  amount,
  animate=true
){

  money +=
    amount;

  if(animate){

    const fx =
      document.createElement(
        "div"
      );

    fx.className =
      "moneyFx "+
      (
        amount>=0
        ?"moneyPlus"
        :"moneyMinus"
      );

    fx.textContent =
      (
        amount>=0
        ?"+"
        :""
      )+
      moneyText(
        amount
      );

    document.body.appendChild(
      fx
    );

    setTimeout(
      ()=>fx.remove(),
      1500
    );
  }

  document.getElementById(
    "money"
  ).textContent=
    moneyText(money);
}

/* =========================================================
   DEV CONSOLE
========================================================= */

const devConsole =
  document.getElementById(
    "console"
  );

const consoleInput =
  document.getElementById(
    "consoleInput"
  );

const consoleHistory =
  document.getElementById(
    "consoleHistory"
  );

let consoleOpen=false;

window.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="`" ||
      event.key==="~"
    ){

      event.preventDefault();

      consoleOpen =
        !consoleOpen;

      devConsole.style.display =
        consoleOpen
        ?"block"
        :"none";

      if(consoleOpen){

        setTimeout(
          ()=>consoleInput.focus(),
          20
        );
      }

      return;
    }

    if(
      event.key==="Escape"
    ){

      if(consoleOpen){

        consoleOpen=false;

        devConsole.style.display=
          "none";

        return;
      }

      buildMode=null;

      hideBuildInfo();
    }
  }
);

consoleInput.addEventListener(
  "keydown",
  event=>{

    if(
      event.key!=="Enter"
    ){
      return;
    }

    const command =
      consoleInput.value.trim();

    consoleInput.value="";

    if(!command){
      return;
    }

    consolePrint(
      "> "+command,
      "#fff"
    );

    executeCommand(
      command
    );
  }
);

function consolePrint(
  text,
  color="#bacabd"
){

  const line =
    document.createElement(
      "div"
    );

  line.textContent=
    text;

  line.style.color=
    color;

  consoleHistory.appendChild(
    line
  );

  consoleHistory.scrollTop =
    consoleHistory.scrollHeight;
}

function executeCommand(
  command
){

  const parts =
    command.split(
      /\s+/
    );

  const name =
    parts[0]
      .toLowerCase();

  const value =
    Number(
      parts[1]
    );

  if(
    name===
    "help"
  ){

    consolePrint(
`KOMENDY:

kasa [kwota]
maxfranczyzobiorcy [liczba]
maxkierowcy [liczba]
firma
firmy [liczba]
status
clear`
    );

    return;
  }

  if(
    name===
    "kasa"
  ){

    if(
      !validNumber(
        value
      )
    ){

      consolePrint(
        "Użycie: kasa [kwota]",
        "#ff6969"
      );

      return;
    }

    money=
      value;

    render();

    consolePrint(
      "Kasa = "+
      moneyText(money),
      "#6cff7a"
    );

    return;
  }

  if(
    name===
    "maxfranczyzobiorcy"
  ){

    if(
      !validLimit(
        value
      )
    ){
      return;
    }

    maxFranchisees =
      Math.floor(
        value
      );

    render();

    consolePrint(
      "Limit franczyzobiorców = "+
      maxFranchisees,
      "#6cff7a"
    );

    return;
  }

  if(
    name===
    "maxkierowcy"
  ){

    if(
      !validLimit(
        value
      )
    ){
      return;
    }

    maxDrivers =
      Math.floor(
        value
      );

    render();

    consolePrint(
      "Limit kierowców = "+
      maxDrivers,
      "#6cff7a"
    );

    return;
  }

  /*
    firma
    tworzy jedną nową firmę
  */

  if(
    name===
    "firma"
  ){

    const company =
      generateFoodCompany();

    render();

    consolePrint(
      "Utworzono: "+
      company.name,
      "#6cff7a"
    );

    return;
  }

  /*
    firmy 10
    tworzy 10 firm
  */

  if(
    name===
    "firmy"
  ){

    const count =
      Math.min(
        100,
        Math.max(
          1,
          Math.floor(
            value || 1
          )
        )
      );

    for(
      let i=0;
      i<count;
      i++
    ){

      generateFoodCompany(
        true
      );
    }

    render();

    consolePrint(
      "Utworzono firm: "+
      count,
      "#6cff7a"
    );

    return;
  }

  if(
    name===
    "status"
  ){

    consolePrint(
`Kasa:
${moneyText(money)}

Sklepy:
${stores.length}

Franczyzobiorcy:
${franchisees.length} / ${maxFranchisees}

Firmy:
${companies.length}

Firmy z udziałami:
${companies.filter(c=>c.shares>0).length}

Kontrolowane firmy:
${companies.filter(c=>c.controlled).length}

Centra logistyczne:
${centers.length}

Kierowcy:
${drivers.length} / ${maxDrivers}

Ciężarówki:
${trucks.length}

Trasy:
${routes.length}`
    );

    return;
  }

  if(
    name===
    "clear"
  ){

    consoleHistory.innerHTML="";

    return;
  }

  consolePrint(
    "Nieznana komenda. Wpisz help.",
    "#ff6969"
  );
}

function validNumber(
  value
){

  return (
    Number.isFinite(
      value
    ) &&
    value>=0
  );
}

function validLimit(
  value
){

  if(
    !Number.isFinite(
      value
    ) ||
    value<0 ||
    value>100000
  ){

    consolePrint(
      "Nieprawidłowa liczba.",
      "#ff6969"
    );

    return false;
  }

  return true;
}

/* =========================================================
   UTILS
========================================================= */

function random(
  min,
  max
){

  return Math.floor(
    Math.random()*
    (
      max-min+1
    )
  )+min;
}

function randomName(){

  return (
    firstNames[
      random(
        0,
        firstNames.length-1
      )
    ]
    +" "+
    lastNames[
      random(
        0,
        lastNames.length-1
      )
    ]
  );
}

function moneyText(
  value
){

  return Math.round(
    value
  )
  .toLocaleString(
    "pl-PL"
  )
  +" zł";
}

function number(
  value
){

  return Math.round(
    value
  )
  .toLocaleString(
    "pl-PL"
  );
}
