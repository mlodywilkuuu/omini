<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ropucha Simulator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #151515;
      color: white;
      overflow: hidden;
      user-select: none;
    }

    #game {
      width: 100vw;
      height: 100vh;
      position: relative;
      background:
        linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px),
        #d7c49e;
      background-size: 50px 50px;
    }

    /* HUD */

    #hud {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 100;
    }

    .hudBox {
      background: rgba(20,20,20,.92);
      padding: 10px 18px;
      border-radius: 10px;
      border: 2px solid #333;
      min-width: 120px;
      text-align: center;
      box-shadow: 0 5px 15px rgba(0,0,0,.25);
    }

    .hudTitle {
      color: #aaa;
      font-size: 11px;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .hudValue {
      font-size: 20px;
      font-weight: bold;
    }

    #money {
      color: #68e36f;
    }

    /* SHOP */

    #shop {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translate(-50%, -50%);
      width: 900px;
      height: 570px;
      background: #eee2c7;
      border: 15px solid #444;
      box-shadow: 0 20px 50px rgba(0,0,0,.4);
      overflow: hidden;
    }

    #shopName {
      position: absolute;
      top: 12px;
      left: 20px;
      font-size: 25px;
      color: #176d37;
      font-weight: 900;
      letter-spacing: 2px;
    }

    /* SHELVES */

    .shelf {
      position: absolute;
      width: 230px;
      height: 65px;
      background: #555;
      border: 6px solid #333;
      border-radius: 6px;
      box-shadow: 0 7px 0 #292929;
      display: flex;
      align-items: center;
      justify-content: space-around;
    }

    .product {
      width: 24px;
      height: 36px;
      border-radius: 3px 3px 1px 1px;
      border: 2px solid rgba(0,0,0,.25);
    }

    .cola {
      background: #c72c2c;
    }

    .water {
      background: #48a7e8;
    }

    .chips {
      background: #f3c43c;
    }

    .juice {
      background: #ef8c27;
    }

    #shelf1 {
      left: 100px;
      top: 120px;
    }

    #shelf2 {
      left: 100px;
      top: 270px;
    }

    #shelf3 {
      right: 120px;
      top: 120px;
    }

    /* FRIDGE */

    #fridge {
      position: absolute;
      right: 30px;
      top: 210px;
      width: 100px;
      height: 250px;
      background: #d9f4ff;
      border: 8px solid #555;
      color: #333;
      text-align: center;
      font-size: 12px;
      padding-top: 10px;
    }

    .fridgeShelf {
      height: 50px;
      border-bottom: 4px solid #777;
      margin: 0 5px;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      padding-bottom: 4px;
    }

    .bottle {
      width: 12px;
      height: 27px;
      background: #4ba6e8;
      border-radius: 4px 4px 2px 2px;
    }

    /* CHECKOUT */

    #checkout {
      position: absolute;
      left: 330px;
      bottom: 35px;
      width: 270px;
      height: 85px;
      background: #176d37;
      border: 7px solid #104b27;
      border-radius: 7px;
      color: white;
      text-align: center;
      padding-top: 45px;
      font-weight: bold;
    }

    #register {
      position: absolute;
      left: 30px;
      top: -35px;
      width: 65px;
      height: 48px;
      background: #333;
      border: 5px solid #222;
      border-radius: 5px;
    }

    #screen {
      width: 35px;
      height: 18px;
      background: #73e8ff;
      margin: 5px auto;
    }

    /* PLAYER */

    #player {
      width: 38px;
      height: 38px;
      background: #2876db;
      border: 4px solid #164681;
      border-radius: 50%;
      position: absolute;
      left: 430px;
      top: 380px;
      z-index: 20;
      transition: transform .05s;
    }

    #player::after {
      content: "TY";
      position: absolute;
      width: 100%;
      text-align: center;
      top: 9px;
      font-size: 10px;
      font-weight: bold;
    }

    /* CUSTOMER */

    .customer {
      position: absolute;
      width: 35px;
      height: 35px;
      background: #db6a42;
      border: 4px solid #8d3b20;
      border-radius: 50%;
      z-index: 10;
    }

    .customer::after {
      content: "🙂";
      position: absolute;
      font-size: 17px;
      left: 5px;
      top: 4px;
    }

    /* INTERACTION */

    #interaction {
      display: none;
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.9);
      padding: 12px 25px;
      border-radius: 8px;
      border: 2px solid white;
      z-index: 200;
      font-weight: bold;
    }

    kbd {
      background: white;
      color: black;
      padding: 4px 8px;
      border-radius: 4px;
      margin-right: 5px;
    }

    /* NOTIFICATIONS */

    #notifications {
      position: fixed;
      right: 20px;
      top: 100px;
      width: 260px;
      z-index: 300;
    }

    .notification {
      background: rgba(20,20,20,.94);
      border-left: 5px solid #62d66a;
      padding: 12px;
      margin-bottom: 8px;
      border-radius: 5px;
      animation: slide .25s;
    }

    @keyframes slide {
      from {
        transform: translateX(100px);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    /* HELP */

    #help {
      position: fixed;
      left: 20px;
      bottom: 20px;
      background: rgba(0,0,0,.8);
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.8;
    }

    #door {
      position: absolute;
      bottom: -15px;
      left: 70px;
      width: 110px;
      height: 35px;
      background: #75c8eb;
      border: 6px solid #444;
    }

    #clock {
      color: #ffdc65;
    }

    @media(max-width: 950px) {
      #shop {
        transform: translate(-50%, -50%) scale(.75);
      }
    }
  </style>
</head>

<body>

<div id="game">

  <div id="hud">
    <div class="hudBox">
      <div class="hudTitle">Kasa</div>
      <div class="hudValue" id="money">50.00 zł</div>
    </div>

    <div class="hudBox">
      <div class="hudTitle">Dzień</div>
      <div class="hudValue" id="day">1</div>
    </div>

    <div class="hudBox">
      <div class="hudTitle">Godzina</div>
      <div class="hudValue" id="clock">06:00</div>
    </div>

    <div class="hudBox">
      <div class="hudTitle">Klienci</div>
      <div class="hudValue" id="customersServed">0</div>
    </div>
  </div>

  <div id="shop">

    <div id="shopName">ROPUCHA 🐸</div>

    <div class="shelf" id="shelf1">
      <div class="product cola"></div>
      <div class="product cola"></div>
      <div class="product water"></div>
      <div class="product water"></div>
      <div class="product juice"></div>
    </div>

    <div class="shelf" id="shelf2">
      <div class="product chips"></div>
      <div class="product chips"></div>
      <div class="product chips"></div>
      <div class="product cola"></div>
      <div class="product juice"></div>
    </div>

    <div class="shelf" id="shelf3">
      <div class="product water"></div>
      <div class="product juice"></div>
      <div class="product cola"></div>
      <div class="product chips"></div>
    </div>

    <div id="fridge">
      LODÓWKA

      <div class="fridgeShelf">
        <div class="bottle"></div>
        <div class="bottle"></div>
        <div class="bottle"></div>
      </div>

      <div class="fridgeShelf">
        <div class="bottle"></div>
        <div class="bottle"></div>
        <div class="bottle"></div>
      </div>

      <div class="fridgeShelf">
        <div class="bottle"></div>
        <div class="bottle"></div>
      </div>
    </div>

    <div id="checkout">
      <div id="register">
        <div id="screen"></div>
      </div>

      KASA
    </div>

    <div id="door"></div>

    <div id="player"></div>

  </div>

  <div id="interaction">
    <kbd>E</kbd>
    Obsłuż klienta
  </div>

  <div id="notifications"></div>

  <div id="help">
    <b>STEROWANIE</b><br>
    WASD / strzałki — chodzenie<br>
    E — interakcja<br>
    R — zamów towar (10 zł)
  </div>

</div>

<script>
  const player = document.getElementById("player");
  const shop = document.getElementById("shop");
  const moneyElement = document.getElementById("money");
  const clockElement = document.getElementById("clock");
  const dayElement = document.getElementById("day");
  const servedElement = document.getElementById("customersServed");
  const interaction = document.getElementById("interaction");

  let playerX = 430;
  let playerY = 380;

  let money = 50;
  let day = 1;
  let minutes = 360;
  let customersServed = 0;

  let currentCustomer = null;

  const keys = {};

  document.addEventListener("keydown", (event) => {
    keys[event.key.toLowerCase()] = true;

    if (event.key.toLowerCase() === "e") {
      interact();
    }

    if (event.key.toLowerCase() === "r") {
      orderStock();
    }
  });

  document.addEventListener("keyup", (event) => {
    keys[event.key.toLowerCase()] = false;
  });

  function gameLoop() {
    const speed = 3;

    if (keys["w"] || keys["arrowup"]) {
      playerY -= speed;
    }

    if (keys["s"] || keys["arrowdown"]) {
      playerY += speed;
    }

    if (keys["a"] || keys["arrowleft"]) {
      playerX -= speed;
    }

    if (keys["d"] || keys["arrowright"]) {
      playerX += speed;
    }

    playerX = Math.max(15, Math.min(830, playerX));
    playerY = Math.max(60, Math.min(500, playerY));

    player.style.left = playerX + "px";
    player.style.top = playerY + "px";

    checkInteraction();

    requestAnimationFrame(gameLoop);
  }

  function spawnCustomer() {
    if (currentCustomer) {
      return;
    }

    const customer = document.createElement("div");
    customer.className = "customer";

    customer.style.left = "90px";
    customer.style.top = "500px";

    shop.appendChild(customer);

    currentCustomer = {
      element: customer,
      x: 90,
      y: 500,
      state: "walking",
      wait: 0
    };

    notify("Nowy klient wszedł do sklepu!");

    moveCustomer();
  }

  function moveCustomer() {
    if (!currentCustomer) {
      return;
    }

    const customer = currentCustomer;

    const targetX = 410;
    const targetY = 420;

    const interval = setInterval(() => {
      if (!currentCustomer || customer !== currentCustomer) {
        clearInterval(interval);
        return;
      }

      const dx = targetX - customer.x;
      const dy = targetY - customer.y;

      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < 5) {
        clearInterval(interval);

        customer.state = "waiting";

        notify("Klient czeka przy kasie.");

        return;
      }

      customer.x += (dx / distance) * 2;
      customer.y += (dy / distance) * 2;

      customer.element.style.left = customer.x + "px";
      customer.element.style.top = customer.y + "px";
    }, 20);
  }

  function checkInteraction() {
    if (!currentCustomer || currentCustomer.state !== "waiting") {
      interaction.style.display = "none";
      return;
    }

    const dx = playerX - currentCustomer.x;
    const dy = playerY - currentCustomer.y;

    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance < 90) {
      interaction.style.display = "block";
    } else {
      interaction.style.display = "none";
    }
  }

  function interact() {
    if (!currentCustomer) {
      return;
    }

    if (currentCustomer.state !== "waiting") {
      return;
    }

    const dx = playerX - currentCustomer.x;
    const dy = playerY - currentCustomer.y;

    const distance = Math.sqrt(dx * dx + dy * dy);

    if (distance > 90) {
      return;
    }

    const earnings = randomNumber(6, 20);

    money += earnings;
    customersServed++;

    updateHUD();

    notify(
      "Obsłużono klienta! +" +
      earnings.toFixed(2) +
      " zł"
    );

    currentCustomer.element.remove();
    currentCustomer = null;

    interaction.style.display = "none";

    setTimeout(() => {
      spawnCustomer();
    }, randomNumber(2000, 6000));
  }

  function orderStock() {
    if (money < 10) {
      notify("Za mało pieniędzy!");
      return;
    }

    money -= 10;

    updateHUD();

    notify("Zamówiono dostawę. -10 zł");

    setTimeout(() => {
      notify("Dostawa dotarła! 📦");
    }, 3000);
  }

  function updateClock() {
    minutes += 5;

    if (minutes >= 24 * 60) {
      minutes = 360;
      day++;

      notify("Rozpoczyna się dzień " + day + ".");
    }

    const hours = Math.floor(minutes / 60);
    const mins = minutes % 60;

    clockElement.textContent =
      String(hours).padStart(2, "0") +
      ":" +
      String(mins).padStart(2, "0");

    dayElement.textContent = day;
  }

  function updateHUD() {
    moneyElement.textContent = money.toFixed(2) + " zł";
    servedElement.textContent = customersServed;
    dayElement.textContent = day;
  }

  function notify(text) {
    const container =
      document.getElementById("notifications");

    const notification =
      document.createElement("div");

    notification.className = "notification";
    notification.textContent = text;

    container.appendChild(notification);

    setTimeout(() => {
      notification.remove();
    }, 3000);
  }

  function randomNumber(min, max) {
    return Math.floor(
      Math.random() * (max - min + 1)
    ) + min;
  }

  gameLoop();

  setInterval(updateClock, 1000);

  setTimeout(() => {
    spawnCustomer();
  }, 1500);

  updateHUD();
</script>

</body>
</html>
