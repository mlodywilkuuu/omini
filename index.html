<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ropucha Group Tycoon</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#111;color:#fff}
button,input,select{font:inherit}
button{cursor:pointer}
#map{position:fixed;inset:0;z-index:1}
.leaflet-tile{image-rendering:auto!important}

/* LEFT NAV */
#nav{
 position:fixed;left:0;top:0;bottom:0;width:190px;z-index:2000;
 background:#101310f2;border-right:1px solid #333;padding:12px 8px;
 backdrop-filter:blur(8px);overflow:auto
}
.logo{font-weight:900;font-size:17px;color:#72ef83;padding:8px;margin-bottom:8px}
.navBtn{
 width:100%;border:0;background:transparent;color:#bbb;text-align:left;
 padding:11px 10px;border-radius:7px;margin:2px 0;font-size:13px
}
.navBtn:hover{background:#242824;color:#fff}
.navBtn.active{background:#176d38;color:#fff;font-weight:bold}

/* PANEL */
#panel{
 position:fixed;left:190px;top:0;bottom:0;width:390px;z-index:1900;
 background:#151715f2;border-right:1px solid #333;padding:13px;
 overflow:auto;backdrop-filter:blur(8px)
}
#panel.mapOnly{display:none}
.panelTitle{font-size:20px;font-weight:900;margin:5px 0 13px}

.box,.card{
 background:#252825;border:1px solid #353935;border-radius:9px;
 padding:10px;margin-bottom:8px
}
.box h3,.card h3{margin:0 0 8px;font-size:14px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:6px 0;font-size:12px;color:#bbb}
.row b{color:#fff;text-align:right}
.muted{color:#888;font-size:11px}
.green{color:#72ef83!important}
.redText{color:#ff7676!important}
.yellow{color:#ffd76a!important}

.btn{
 width:100%;border:0;border-radius:6px;padding:8px;margin-top:5px;
 background:#176d38;color:#fff;font-weight:bold
}
.btn:hover{filter:brightness(1.13)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.blue{background:#28609e}
.red{background:#923d3d}
.orange{background:#a26225}
.purple{background:#704c9a}
.gray{background:#4d524d}

input,select{
 background:#333;color:#fff;border:1px solid #555;border-radius:5px;padding:6px
}
.full{width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}

/* HUD */
#hud{
 position:fixed;top:10px;left:600px;right:10px;z-index:1800;
 display:flex;justify-content:center;gap:5px;pointer-events:none
}
.hud{
 min-width:95px;background:#101310e8;border:1px solid #333;border-radius:8px;
 padding:7px 10px;text-align:center
}
.hud small{display:block;color:#888;font-size:9px;text-transform:uppercase}
.hud strong{font-size:15px}
#money{color:#72ef83}

/* MARKERS */
.marker{
 width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
 justify-content:center;border:3px solid white;font-size:17px;
 box-shadow:0 3px 10px #0009
}
.playerStore{background:#16723a}
.compStore{background:#9a3838}
.centerMarker{background:#28609e}
.factoryMarker{background:#9b632b}

/* GROUP TREE */
.tree{border-left:3px solid #62df74;padding-left:10px}
.treeNode{margin:6px 0}
.treeChildren{border-left:2px solid #555;margin-left:10px;padding-left:10px}
.badge{display:inline-block;background:#444;padding:3px 7px;border-radius:10px;font-size:10px;margin:2px}
.sharebar{height:7px;background:#444;border-radius:6px;overflow:hidden;margin:6px 0}
.sharefill{height:100%;background:#6eea7e}

/* NEWS */
.news{border-left:3px solid #5fcf70;padding-left:8px;margin:7px 0;font-size:11px}

/* NOTIFY */
#notifications{position:fixed;right:12px;bottom:12px;width:310px;z-index:10000}
.notification{
 background:#111f;border-left:4px solid #6bea7c;border-radius:6px;
 padding:9px;margin-top:5px;font-size:12px
}

/* BUILD */
#buildInfo{
 display:none;position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
 z-index:9000;background:#111e;border:1px solid #555;border-radius:8px;padding:10px 18px
}

/* MONEY FX */
.moneyFx{
 position:fixed;top:70px;left:50%;z-index:12000;font-size:25px;font-weight:900;
 pointer-events:none;animation:moneyFx 1.3s forwards
}
.moneyPlus{color:#72ef83}.moneyMinus{color:#ff6f6f}
@keyframes moneyFx{
 0%{opacity:0;transform:translate(-50%,15px)}
 20%{opacity:1;transform:translate(-50%,0)}
 100%{opacity:0;transform:translate(-50%,-50px)}
}

/* MODAL */
#modalBg{
 display:none;position:fixed;inset:0;background:#000b;z-index:15000;
 align-items:center;justify-content:center
}
#modal{
 width:min(750px,94vw);max-height:90vh;overflow:auto;background:#191c19;
 border:1px solid #555;border-radius:12px;padding:15px
}
.close{float:right;background:#923d3d;color:#fff;border:0;border-radius:5px;padding:6px 10px}

/* CONSOLE */
#console{
 display:none;position:fixed;z-index:20000;left:50%;top:50%;
 transform:translate(-50%,-50%);width:min(700px,94vw);height:430px;
 background:#080b09f8;border:2px solid #64df74;border-radius:9px;overflow:hidden;
 font-family:Consolas,monospace
}
#consoleHead{height:42px;padding:12px;background:#142117;color:#6bea7c}
#consoleHistory{height:325px;padding:10px;overflow:auto;white-space:pre-wrap;font-size:13px}
#consoleBottom{height:60px;border-top:1px solid #315d38;padding:9px;display:flex;gap:8px;align-items:center}
#consoleInput{flex:1;background:transparent;border:0;outline:0}

@media(max-width:850px){
 #nav{width:65px}
 .logo{font-size:0}.logo:after{content:"🐸";font-size:25px}
 .navBtn{font-size:0;text-align:center}.navBtn span{font-size:20px}
 #panel{left:65px;width:310px}
 #hud{left:380px}
}
</style>
</head>

<body>

<div id="map"></div>

<nav id="nav">
 <div class="logo">🐸 ROPUCHA GROUP</div>
 <button class="navBtn active" onclick="openSection('map',this)"><span>🗺️</span> Mapa</button>
 <button class="navBtn" onclick="openSection('stores',this)"><span>🏪</span> Sklepy</button>
 <button class="navBtn" onclick="openSection('group',this)"><span>🏛️</span> Grupa</button>
 <button class="navBtn" onclick="openSection('products',this)"><span>📦</span> Produkty</button>
 <button class="navBtn" onclick="openSection('companies',this)"><span>🏭</span> Producenci</button>
 <button class="navBtn" onclick="openSection('logistics',this)"><span>🚛</span> Logistyka</button>
 <button class="navBtn" onclick="openSection('competition',this)"><span>⚔️</span> Konkurencja</button>
 <button class="navBtn" onclick="openSection('market',this)"><span>🌍</span> Rynek</button>
 <button class="navBtn" onclick="openSection('finance',this)"><span>📊</span> Finanse</button>
 <button class="navBtn" onclick="openSection('news',this)"><span>📰</span> Wiadomości</button>
</nav>

<main id="panel" class="mapOnly"></main>

<div id="hud">
 <div class="hud"><small>Kasa</small><strong id="money">0</strong></div>
 <div class="hud"><small>Sklepy</small><strong id="storeHud">0</strong></div>
 <div class="hud"><small>Wartość grupy</small><strong id="valueHud">0</strong></div>
 <div class="hud"><small>Reputacja</small><strong id="repHud">50</strong></div>
 <div class="hud"><small>Dzień</small><strong id="dayHud">1</strong></div>
</div>

<div id="buildInfo"></div>
<div id="notifications"></div>

<div id="modalBg"><div id="modal"></div></div>

<div id="console">
 <div id="consoleHead">🛠 ROPUCHA DEV CONSOLE — ~ zamknij</div>
 <div id="consoleHistory">Wpisz help.</div>
 <div id="consoleBottom">&gt; <input id="consoleInput" autocomplete="off"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =========================================================
   CORE
========================================================= */

let money=500000;
let day=1;
let reputation=50;
let fuelPrice=6.20;
let currentSection="map";
let buildMode=null;

let maxFranchisees=5;
let maxDrivers=5;
let maxStaff=20;

let nextStoreId=1;
let nextSubsidiaryId=1;
let nextCompanyId=1;
let nextInvestorId=1;
let nextCenterId=1;
let nextDriverId=1;
let nextTruckId=1;
let nextCompetitorId=1;
let nextCompetitorStoreId=1;

let stores=[];
let subsidiaries=[];
let companies=[];
let centers=[];
let drivers=[];
let trucks=[];
let franchisees=[];
let competitors=[];
let newsFeed=[];

let totalRevenue=0;
let totalExpenses=0;
let totalDividends=0;

const DAY_TIME=10000;

/* =========================================================
   HELPERS
========================================================= */

function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rndf(a,b){return Math.random()*(b-a)+a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function cash(v){return Math.round(v).toLocaleString("pl-PL")+" zł"}
function num(v){return Math.round(v).toLocaleString("pl-PL")}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function product(id){return PRODUCTS.find(p=>p.id===id)}

function esc(s){
 return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;")
 .replaceAll(">","&gt;").replaceAll('"',"&quot;");
}

function randomName(){
 return pick(["Adam","Marek","Kamil","Julia","Natalia","Ola","Michał","Piotr","Anna","Karol"])+" "+
 pick(["Nowak","Kowalski","Lis","Król","Mazur","Wójcik","Zieliński","Lewandowski"]);
}

function notify(text){
 const n=document.createElement("div");
 n.className="notification";n.textContent=text;
 document.getElementById("notifications").appendChild(n);
 setTimeout(()=>n.remove(),4200);
}

function addNews(text){
 newsFeed.unshift({day,text});
 newsFeed=newsFeed.slice(0,100);
}

function changeMoney(amount,fx=true){
 money+=amount;
 if(fx){
  const el=document.createElement("div");
  el.className="moneyFx "+(amount>=0?"moneyPlus":"moneyMinus");
  el.textContent=(amount>=0?"+":"")+cash(amount);
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1400);
 }
 updateHud();
}

function openModal(html){
 document.getElementById("modal").innerHTML=html;
 document.getElementById("modalBg").style.display="flex";
}
function closeModal(){document.getElementById("modalBg").style.display="none"}

/* =========================================================
   PRODUCTS
========================================================= */

const PRODUCTS=[
 {id:"hotdog",name:"Hot-dog",emoji:"🌭",buy:3.1,price:7.99},
 {id:"pizza",name:"Pizza",emoji:"🍕",buy:7,price:15.99},
 {id:"coffee",name:"Kawa",emoji:"☕",buy:2.2,price:7.49},
 {id:"drink",name:"Napój",emoji:"🥤",buy:2.8,price:6.49},
 {id:"sandwich",name:"Kanapka",emoji:"🥪",buy:5,price:11.99},
 {id:"icecream",name:"Lody",emoji:"🍦",buy:3.2,price:7.99},
 {id:"bun",name:"Bułka",emoji:"🥖",buy:1.1,price:3.49}
];

function freshProducts(){
 const o={};
 PRODUCTS.forEach(p=>o[p.id]={stock:150,price:p.price,promo:0,promoDays:0});
 return o;
}

/* =========================================================
   WORLD
========================================================= */

const LOCATIONS=[
 ["Warszawa","Polska",52.23,21.01],["Kraków","Polska",50.06,19.94],
 ["Białystok","Polska",53.13,23.16],["Gdańsk","Polska",54.35,18.65],
 ["Berlin","Niemcy",52.52,13.40],["Hamburg","Niemcy",53.55,10],
 ["Praga","Czechy",50.07,14.43],["Paryż","Francja",48.85,2.35],
 ["Londyn","Wielka Brytania",51.50,-0.12],["Rzym","Włochy",41.90,12.49],
 ["Madryt","Hiszpania",40.41,-3.70],["Amsterdam","Holandia",52.37,4.89],
 ["Sztokholm","Szwecja",59.32,18.06],["Oslo","Norwegia",59.91,10.75],
 ["Nowy Jork","USA",40.71,-74],["Los Angeles","USA",34.05,-118.24],
 ["Chicago","USA",41.87,-87.62],["Toronto","Kanada",43.65,-79.38],
 ["São Paulo","Brazylia",-23.55,-46.63],["Tokio","Japonia",35.67,139.65],
 ["Seul","Korea Południowa",37.56,126.97],["Pekin","Chiny",39.90,116.40],
 ["Singapur","Singapur",1.35,103.81],["Bangkok","Tajlandia",13.75,100.50],
 ["Delhi","Indie",28.61,77.20],["Dubaj","ZEA",25.20,55.27],
 ["Kair","Egipt",30.04,31.23],["Johannesburg","RPA",-26.20,28.04],
 ["Sydney","Australia",-33.86,151.20],["Melbourne","Australia",-37.81,144.96]
];

const COUNTRIES=[...new Set(LOCATIONS.map(x=>x[1]))];

function detectCountry(lat,lng){
 let best=null,dist=Infinity;
 LOCATIONS.forEach(l=>{
  const d=(lat-l[2])**2+(lng-l[3])**2;
  if(d<dist){dist=d;best=l}
 });
 return best?best[1]:"Nieznany";
}

/* =========================================================
   MAP
========================================================= */

const map=L.map("map",{
 zoomControl:true,
 zoomAnimation:false,
 fadeAnimation:false,
 markerZoomAnimation:false,
 minZoom:2,maxZoom:19,
 zoomSnap:1
}).setView([35,10],3);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
 maxZoom:19,maxNativeZoom:19,keepBuffer:5,
 attribution:"&copy; OpenStreetMap contributors"
}).addTo(map);

function icon(emoji,cls){
 return L.divIcon({
  className:"",
  html:`<div class="marker ${cls}">${emoji}</div>`,
  iconSize:[34,34],iconAnchor:[17,17]
 });
}

const ICON={
 store:icon("🏪","playerStore"),
 comp:icon("🏬","compStore"),
 center:icon("📦","centerMarker"),
 factory:icon("🏭","factoryMarker")
};

/* =========================================================
   PLAYER STORES
========================================================= */

function storePrice(){return 100000+stores.length*12000}

function buildStore(){
 if(franchisees.length===0){notify("❌ Najpierw zatrudnij franczyzobiorcę.");return}
 if(money<storePrice()){notify("❌ Brakuje pieniędzy.");return}
 buildMode="store";showBuild("🏪 Kliknij na mapie miejsce nowego sklepu • ESC anuluj");
}

function createStore(lat,lng,free=false,brand="Ropucha"){
 const cost=storePrice();
 if(!free&&money<cost)return;
 if(!free)changeMoney(-cost);

 const country=detectCountry(lat,lng);
 const f=franchisees.length?franchisees.slice().sort((a,b)=>a.stores.length-b.stores.length)[0]:null;

 const s={
  id:nextStoreId++,lat,lng,country,brand,
  subsidiaryId:null,franchiseeId:f?f.id:null,
  products:freshProducts(),warehouse:500,checkout:1,
  revenueToday:0,customersToday:0,lostToday:0,marker:null
 };

 stores.push(s);
 if(f)f.stores.push(s.id);
 autoAssignStores();

 s.marker=L.marker([lat,lng],{icon:ICON.store}).addTo(map);
 updateStorePopup(s);

 addNews(`🏪 ${brand} otwiera sklep w ${country}.`);
 notify(`🏪 Otwarto sklep #${s.id} • ${country}`);
 render();
 return s;
}

function updateStorePopup(s){
 s.marker.bindPopup(`
 <b>🐸 ${esc(s.brand)} #${s.id}</b><br><br>
 🌍 ${esc(s.country)}<br>
 🏛️ ${esc(storeOwner(s))}<br>
 👥 ${s.customersToday} klientów<br>
 💰 ${cash(s.revenueToday)}
 `);
}

function storeOwner(s){
 if(!s.subsidiaryId)return "Ropucha Group";
 const sub=subsidiaries.find(x=>x.id===s.subsidiaryId);
 return sub?sub.name:"Ropucha Group";
}

function recruitFranchisee(){
 if(franchisees.length>=maxFranchisees){notify("❌ Limit franczyzobiorców.");return}
 if(money<5000){notify("❌ Brakuje pieniędzy.");return}
 changeMoney(-5000);
 franchisees.push({id:Date.now()+Math.random(),name:randomName(),stores:[],skill:rnd(1,5)});
 notify("🤝 Zatrudniono franczyzobiorcę.");
 render();
}

/* =========================================================
   SUBSIDIARIES — UNLIMITED TREE
========================================================= */

function createSubsidiary(parentId=null){
 if(money<50000){notify("❌ Utworzenie spółki kosztuje 50 000 zł.");return}
 changeMoney(-50000);

 const s={
  id:nextSubsidiaryId++,
  parentId:parentId?Number(parentId):null,
  name:"Ropucha Company "+nextSubsidiaryId,
  countries:[],
  capital:0
 };
 subsidiaries.push(s);
 addNews(`🏛️ Utworzono spółkę ${s.name}.`);
 render();
}

function renameSubsidiary(id,name){
 const s=subsidiaries.find(x=>x.id===id);
 if(!s)return;
 name=String(name).trim();
 if(name.length<2||name.length>50){notify("❌ Nazwa musi mieć 2–50 znaków.");return}
 s.name=name;notify("✏️ Zmieniono nazwę spółki.");render();
}

function isDescendant(parentId,targetId){
 let cur=subsidiaries.find(x=>x.id===targetId);
 while(cur){
  if(cur.parentId===parentId)return true;
  cur=subsidiaries.find(x=>x.id===cur.parentId);
 }
 return false;
}

function changeParent(id,parentId){
 const s=subsidiaries.find(x=>x.id===id);if(!s)return;
 parentId=parentId?Number(parentId):null;
 if(parentId===id||isDescendant(id,parentId)){notify("❌ Nie można utworzyć pętli w strukturze.");return}
 s.parentId=parentId;render();
}

function assignCountry(subId,country){
 subsidiaries.forEach(s=>s.countries=s.countries.filter(c=>c!==country));
 const s=subsidiaries.find(x=>x.id===subId);if(!s)return;
 s.countries.push(country);autoAssignStores();
 notify(`🌍 ${country} → ${s.name}`);render();
}

function autoAssignStores(){
 stores.forEach(store=>{
  const sub=subsidiaries.find(s=>s.countries.includes(store.country));
  store.subsidiaryId=sub?sub.id:null;
 });
}

function treeHTML(parentId=null,depth=0){
 const list=subsidiaries.filter(s=>s.parentId===parentId);
 return list.map(s=>{
  const count=stores.filter(x=>x.subsidiaryId===s.id).length;
  return `<div class="treeNode">
   🏢 <b>${esc(s.name)}</b> <span class="badge">🏪 ${count}</span>
   <div class="muted">${s.countries.length?s.countries.map(esc).join(", "):"brak przypisanych krajów"}</div>
   <div class="treeChildren">${treeHTML(s.id,depth+1)}</div>
  </div>`;
 }).join("");
}

/* =========================================================
   PRODUCERS / SHAREHOLDERS
========================================================= */

const investorNames=["North Capital","Atlas Investments","Global Equity","GreenRock Fund","Nova Partners","Mercury Capital","Orion Ventures","Europa Holding"];

function shareholders(){
 const arr=[];
 let left=100;
 const count=rnd(3,5);
 for(let i=0;i<count;i++){
  let sh=i===count-1?left:rnd(5,Math.max(5,left-(count-i-1)*5));
  left-=sh;
  arr.push({id:nextInvestorId++,name:i===0?"Założyciele":pick(investorNames),shares:sh});
 }
 return arr;
}

function generateCompany(silent=false){
 const l=pick(LOCATIONS),p=pick(PRODUCTS),valuation=rnd(300000,12000000);
 const c={
  id:"co_"+nextCompanyId++,
  name:p.emoji+" "+pick(["Fresh","Golden","Prime","Urban","Global","North","Mega","Daily"])+" "+pick(["Foods","Kitchen","Industries","Products","Factory"]),
  productId:p.id,city:l[0],country:l[1],
  lat:l[2]+rndf(-.35,.35),lng:l[3]+rndf(-.35,.35),
  valuation,profit:Math.floor(valuation*rndf(.003,.009)),
  shares:0,shareholders:shareholders(),controlled:false,inGroup:false,
  groupParentId:null,marker:null
 };
 companies.push(c);
 c.marker=L.marker([c.lat,c.lng],{icon:ICON.factory}).addTo(map);
 updateCompanyPopup(c);
 if(!silent)addNews(`🏭 Powstała firma ${c.name} w ${c.country}.`);
 return c;
}

function updateCompanyPopup(c){
 c.marker.bindPopup(`<b>${esc(c.name)}</b><br>📍 ${esc(c.city)}, ${esc(c.country)}<br>💰 ${cash(c.valuation)}<br>📊 Twoje udziały: ${c.shares}%`);
}

function openShareholders(id){
 const c=companies.find(x=>x.id===id);if(!c)return;
 openModal(`
 <button class="close" onclick="closeModal()">X</button>
 <h2>📊 ${esc(c.name)}</h2>
 <div class="box">
  <div class="row"><span>Twoje udziały</span><b class="green">${c.shares}%</b></div>
  <div class="sharebar"><div class="sharefill" style="width:${c.shares}%"></div></div>
 </div>
 ${c.shareholders.map(i=>`
 <div class="card">
  <div class="row"><span>👤 ${esc(i.name)}</span><b>${i.shares}%</b></div>
  ${i.shares?`<div class="grid3">
   <button class="btn" onclick="buyCompanyShares('${c.id}',${i.id},1,1.15)">1%</button>
   <button class="btn blue" onclick="buyCompanyShares('${c.id}',${i.id},5,1.25)">5%</button>
   <button class="btn orange" onclick="buyCompanyShares('${c.id}',${i.id},${i.shares},1.4)">Całość</button>
  </div>`:""}
 </div>`).join("")}
 ${c.shares>50&&!c.inGroup?`<button class="btn purple" onclick="putCompanyInGroup('${c.id}')">🏛️ Włącz do grupy</button>`:""}
 `);
}

function buyCompanyShares(cid,iid,amount,mult){
 const c=companies.find(x=>x.id===cid),i=c?.shareholders.find(x=>x.id===iid);
 if(!c||!i)return;
 amount=Math.min(amount,i.shares);
 const price=Math.floor(c.valuation*amount/100*mult);
 if(money<price){notify("❌ Brakuje pieniędzy.");return}

 let chance=mult>=1.4?.9:mult>=1.25?.7:.55;
 if(Math.random()>chance){notify(`❌ ${i.name} odrzucił ofertę.`);return}

 changeMoney(-price);i.shares-=amount;c.shares+=amount;

/* =========================================================
   SALES / ECONOMY
========================================================= */

function processSales(){
 let revenue=0;

 stores.forEach(s=>{
  s.revenueToday=0;s.customersToday=0;s.lostToday=0;

  let potential=Math.max(10,Math.floor(35+reputation+rnd(-10,25)));
  let capacity=50+s.checkout*35;

  for(let i=0;i<Math.min(potential,capacity);i++){
   const available=PRODUCTS.filter(p=>s.products[p.id].stock>0);
   if(!available.length){s.lostToday++;continue}

   const p=pick(available),item=s.products[p.id];
   const finalPrice=item.promoDays?item.price*(1-item.promo/100):item.price;
   const chance=clamp(1.12-(finalPrice/p.price)*.42+(item.promoDays?.12:0),.15,.95);

   if(Math.random()<chance){
    item.stock--;s.customersToday++;s.revenueToday+=finalPrice;revenue+=finalPrice;
   }else s.lostToday++;
  }

  Object.values(s.products).forEach(i=>{
   if(i.promoDays>0){i.promoDays--;if(i.promoDays<=0)i.promo=0}
  });
  updateStorePopup(s);
 });

 return Math.floor(revenue);
}

function processDividends(){
 let d=0;
 companies.forEach(c=>d+=c.profit*.25*c.shares/100);
 return Math.floor(d);
}

function processExpenses(){
 let e=drivers.reduce((a,d)=>a+d.salary,0);
 e+=trucks.length*fuelPrice*20;
 return Math.floor(e);
}

function processCompanies(){
 companies.forEach(c=>{
  const change=rndf(-.03,.04);
  c.profit=Math.max(300,Math.floor(c.profit*(1+change)));
  c.valuation=Math.max(100000,Math.floor(c.valuation*(1+change*.4)));
  updateCompanyPopup(c);
 });
}

function processDay(){
 day++;
 processCompetitors();
 processCompanies();

 const rev=processSales();
 const div=processDividends();
 const exp=processExpenses();

 changeMoney(rev+div-exp,false);
 totalRevenue+=rev;totalDividends+=div;totalExpenses+=exp;

 if(stores.length){
  const served=stores.reduce((a,s)=>a+s.customersToday,0);
  const lost=stores.reduce((a,s)=>a+s.lostToday,0);
  reputation=clamp(reputation+(served>lost?.25:-.35),0,100);
 }

 if(Math.random()<.12){
  fuelPrice*=rndf(.94,1.08);
  addNews(`⛽ Cena paliwa zmieniła się do ${fuelPrice.toFixed(2)} zł/l.`);
 }

 addNews(`📊 Dzień ${day}: sprzedaż ${cash(rev)}, dywidendy ${cash(div)}, koszty ${cash(exp)}.`);
 render();
}

}

/* =========================================================
   SAVE
========================================================= */

function saveGame(){
 const cleanStores=stores.map(s=>({...s,marker:null}));
 const cleanCompanies=companies.map(c=>({...c,marker:null}));
 const cleanCenters=centers.map(c=>({...c,marker:null}));
 const cleanCompetitors=competitors.map(c=>({
  ...c,
  stores:c.stores.map(s=>({...s,marker:null}))
 }));

 const data={
  money,day,reputation,fuelPrice,maxFranchisees,maxDrivers,maxStaff,
  stores:cleanStores,subsidiaries,companies:cleanCompanies,centers:cleanCenters,
  drivers,trucks,franchisees,competitors:cleanCompetitors,newsFeed,
  nextStoreId,nextSubsidiaryId,nextCompanyId,nextInvestorId,nextCenterId,
  nextDriverId,nextTruckId,nextCompetitorId,nextCompetitorStoreId,
  totalRevenue,totalExpenses,totalDividends
 };
 localStorage.setItem("ropuchaMegaSave",JSON.stringify(data));
 notify("💾 Zapisano grę.");
}

function resetGame(){
 if(confirm("Usunąć zapis i rozpocząć od nowa?")){
  localStorage.removeItem("ropuchaMegaSave");location.reload();
 }
}

/* =========================================================
   CONSOLE ~
========================================================= */

const con=document.getElementById("console");
const conInput=document.getElementById("consoleInput");
const conHistory=document.getElementById("consoleHistory");
let conOpen=false;

window.addEventListener("keydown",e=>{
 if(e.key==="`"||e.key==="~"){
  e.preventDefault();conOpen=!conOpen;
  con.style.display=conOpen?"block":"none";
  if(conOpen)setTimeout(()=>conInput.focus(),20);
 }else if(e.key==="Escape"){
  if(conOpen){conOpen=false;con.style.display="none"}
  else{buildMode=null;hideBuild()}
 }
});

conInput.addEventListener("keydown",e=>{
 if(e.key!=="Enter")return;
 const cmd=conInput.value.trim();conInput.value="";
 printCon("> "+cmd,"#fff");execute(cmd);
});

function printCon(t,c="#b9c9bc"){
 const d=document.createElement("div");d.textContent=t;d.style.color=c;
 conHistory.appendChild(d);conHistory.scrollTop=conHistory.scrollHeight;
}

function execute(str){
 const a=str.split(/\s+/),cmd=a[0]?.toLowerCase(),v=Number(a[1]);

 if(cmd==="help"){
  printCon(`KOMENDY:
kasa [kwota]
maxstaff [liczba]
maxfranczyzobiorcy [liczba]
maxkierowcy [liczba]
reputacja [0-100]
firma
firmy [liczba]
dzien
paliwo [cena]
sklep
status
save
clear`);
  return;
 }

 if(cmd==="kasa"&&Number.isFinite(v))money=Math.max(0,v);
 else if(cmd==="maxstaff"&&Number.isFinite(v))maxStaff=Math.max(0,Math.floor(v));
 else if(cmd==="maxfranczyzobiorcy"&&Number.isFinite(v))maxFranchisees=Math.max(0,Math.floor(v));
 else if(cmd==="maxkierowcy"&&Number.isFinite(v))maxDrivers=Math.max(0,Math.floor(v));
 else if(cmd==="reputacja"&&Number.isFinite(v))reputation=clamp(v,0,100);
 else if(cmd==="firma"){generateCompany();render();return}
 else if(cmd==="firmy"){
  for(let i=0;i<clamp(Math.floor(v||1),1,100);i++)generateCompany(true);
 }
 else if(cmd==="dzien"){processDay();return}
 else if(cmd==="paliwo"&&Number.isFinite(v))fuelPrice=Math.max(.1,v);
 else if(cmd==="sklep"){
  if(!franchisees.length)franchisees.push({id:Date.now(),name:"DEV",stores:[],skill:5});
  const l=pick(LOCATIONS);createStore(l[2],l[3],true);return;
 }
 else if(cmd==="save"){saveGame();return}
 else if(cmd==="clear"){conHistory.innerHTML="";return}
 else if(cmd==="status"){
  printCon(`Dzień: ${day}
Kasa: ${cash(money)}
Wartość grupy: ${cash(groupValue())}
Sklepy: ${stores.length}
Spółki córki: ${subsidiaries.length}
Producenci: ${companies.length}
Konkurenci: ${competitors.filter(c=>!c.acquired).length}
Centra: ${centers.length}
Kierowcy: ${drivers.length}/${maxDrivers}`);
  return;
 }else{
  printCon("Nieznana komenda. Wpisz help.","#ff7070");return;
 }

 render();
}

/* =========================================================
   START WORLD
========================================================= */

for(let i=0;i<22;i++)generateCompany(true);
COMP_NAMES.forEach(n=>makeCompetitor(n));

addNews("🐸 Ropucha Group rozpoczyna działalność z kapitałem 500 000 zł.");
addNews("⚔️ Konkurencyjne sieci rozpoczęły ekspansję.");
addNews("🏭 Na świecie działają niezależni producenci żywności.");

render();

setInterval(processDay,DAY_TIME);

setInterval(()=>{
 if(companies.length<150){
  generateCompany();
  render();
 }
},45000);

notify("🐸 Ropucha Group wystartowała.");
notify("💰 Kapitał początkowy: 500 000 zł");
</script>
