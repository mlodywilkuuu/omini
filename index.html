/* =====================================================
   HELPERY
===================================================== */

function rnd(a,b){
    return Math.floor(Math.random()*(b-a+1))+a;
}

function rndf(a,b){
    return Math.random()*(b-a)+a;
}

function pick(a){
    return a[Math.floor(Math.random()*a.length)];
}

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

function cash(v){
    return Math.round(v).toLocaleString("pl-PL")+" zł";
}

function num(v){
    return Math.round(v).toLocaleString("pl-PL");
}

function esc(s){
    return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
}

function randomName(){
    return pick([
        "Adam","Marek","Kamil","Julia","Natalia","Ola",
        "Michał","Piotr","Anna","Karol","Jakub","Zofia"
    ])+" "+pick([
        "Nowak","Kowalski","Lis","Król","Mazur",
        "Wójcik","Zieliński","Lewandowski","Dąbrowski"
    ]);
}

function notify(text){
    const n=document.createElement("div");
    n.className="notification";
    n.textContent=text;
    document.getElementById("notifications").appendChild(n);
    setTimeout(()=>n.remove(),4200);
}

function addNews(text){
    newsFeed.unshift({day,text});
    newsFeed=newsFeed.slice(0,150);
}

function changeMoney(amount,fx=true){
    money+=amount;

    if(fx){
        const el=document.createElement("div");
        el.className="moneyFx "+(amount>=0?"moneyPlus":"moneyMinus");
        el.textContent=(amount>=0?"+":"")+cash(amount);
        document.body.appendChild(el);
        setTimeout(()=>el.remove(),1400);
    }

    updateHud();
}

function openModal(html){
    document.getElementById("modal").innerHTML=html;
    document.getElementById("modalBg").style.display="flex";

/* =====================================================
   PRODUKTY
===================================================== */

const PRODUCTS=[
    {id:"hotdog",name:"Hot-dog",emoji:"🌭",buy:3.1,price:7.99},
    {id:"pizza",name:"Pizza",emoji:"🍕",buy:7,price:15.99},
    {id:"coffee",name:"Kawa",emoji:"☕",buy:2.2,price:7.49},
    {id:"drink",name:"Napój",emoji:"🥤",buy:2.8,price:6.49},
    {id:"sandwich",name:"Kanapka",emoji:"🥪",buy:5,price:11.99},
    {id:"icecream",name:"Lody",emoji:"🍦",buy:3.2,price:7.99},
    {id:"bun",name:"Bułka",emoji:"🥖",buy:1.1,price:3.49}
];

function freshProducts(){
    const o={};

    PRODUCTS.forEach(p=>{
        o[p.id]={
            stock:150,
            price:p.price,
            promo:0,
            promoDays:0
        };
    });

    return o;
}

/* =====================================================
   SPRZĘT
===================================================== */

const EQUIPMENT={
    checkout:{name:"Kasa",emoji:"💳",price:15000,energy:3,capacity:35},
    shelf:{name:"Regał",emoji:"🗄️",price:6000,energy:0,capacity:100},
    fridge:{name:"Lodówka",emoji:"🧊",price:18000,energy:12,capacity:130},
    freezer:{name:"Zamrażarka",emoji:"❄️",price:22000,energy:15,capacity:100},
    coffee:{name:"Ekspres do kawy",emoji:"☕",price:28000,energy:8,capacity:45},
    hotdog:{name:"Stanowisko hot-dog",emoji:"🌭",price:24000,energy:7,capacity:50},
    pizza:{name:"Piec do pizzy",emoji:"🍕",price:45000,energy:18,capacity:40}
};

function emptyEquipment(){
    return {
        checkout:0,shelf:0,fridge:0,freezer:0,
        coffee:0,hotdog:0,pizza:0
    };
}

/* =====================================================
   STANDARDY
===================================================== */

let standards=[{
    id:1,
    name:"Ropucha Standard",
    version:1,
    area:100,
    equipment:{
        checkout:2,
        shelf:5,
        fridge:3,
        freezer:1,
        coffee:1,
        hotdog:1,
        pizza:1
    },
    planogram:{
        hotdog:"hotdog",
        pizza:"pizza",
        coffee:"coffee",
        drink:"fridge",
        sandwich:"fridge",
        icecream:"freezer",
        bun:"shelf"
    }
}];

let defaultStandardId=1;

function getStandard(id){
    return standards.find(x=>x.id===Number(id));
}

function equipmentCost(eq){
    let c=0;

    Object.keys(EQUIPMENT).forEach(k=>{
        c+=(eq[k]||0)*EQUIPMENT[k].price;
    });

    return c;
}

function standardCost(s){
    return Math.floor(s.area*650+equipmentCost(s.equipment));
}

function standardEnergy(s){
    let e=0;

    Object.keys(EQUIPMENT).forEach(k=>{
        e+=(s.equipment[k]||0)*EQUIPMENT[k].energy;
    });

    return e;
}

function standardCapacity(s){
    return 30+
        (s.equipment.checkout||0)*35+
        (s.equipment.shelf||0)*5+
        (s.equipment.fridge||0)*3;
}

function createStandard(){
    if(money<10000){
        notify("❌ Utworzenie projektu kosztuje 10 000 zł.");
        return;
    }

    changeMoney(-10000);

    const s={
        id:nextStandardId++,
        name:"Nowy standard",
        version:1,
        area:80,
        equipment:emptyEquipment(),
        planogram:{}
    };

    standards.push(s);
    defaultStandardId=s.id;

    notify("📐 Utworzono nowy standard sklepu.");
    render();
}

function renameStandard(id,name){
    const s=getStandard(id);
    if(!s)return;

    name=String(name).trim();

    if(name.length<2){
        notify("❌ Nazwa jest za krótka.");
        return;
    }

    s.name=name;
    render();
}

function setDefaultStandard(id){
    defaultStandardId=Number(id);
    notify("⭐ Ustawiono domyślny standard.");
    render();
}

function setStandardArea(id,v){
    const s=getStandard(id);
    if(!s)return;

    s.area=clamp(Number(v)||50,30,2000);
    s.version++;
}

function equipmentChange(id,type,delta){
    const s=getStandard(id);
    if(!s || !EQUIPMENT[type])return;

    s.equipment[type]=Math.max(0,(s.equipment[type]||0)+delta);
    s.version++;
    render();
}

function setPlanogram(id,productId,equipmentType){
    const s=getStandard(id);
    if(!s)return;

    if(equipmentType===""){
        delete s.planogram[productId];
    }else{
        s.planogram[productId]=equipmentType;
    }

    s.version++;
    render();
}

function cloneStandard(id){
    const src=getStandard(id);
    if(!src)return;

    const copy=JSON.parse(JSON.stringify(src));
    copy.id=nextStandardId++;
    copy.name=src.name+" Copy";
    copy.version=1;

    standards.push(copy);
    render();
}

function deployStandard(id){
    const s=getStandard(id);
    if(!s)return;

    let cost=0;

    stores.forEach(store=>{
        if(store.standardId!==s.id || store.standardVersion!==s.version){
            cost+=Math.floor(standardCost(s)*0.20);
        }
    });

    if(cost===0){
        notify("✅ Wszystkie sklepy mają aktualną wersję.");
        return;
    }

    if(money<cost){
        notify("❌ Brakuje pieniędzy na modernizację.");
        return;
    }

    changeMoney(-cost);

    stores.forEach(store=>{
        store.standardId=s.id;
        store.standardVersion=s.version;
        store.area=s.area;
        store.equipment=JSON.parse(JSON.stringify(s.equipment));
        store.planogram=JSON.parse(JSON.stringify(s.planogram));
    });

    addNews(`📐 Wdrożono ${s.name} v${s.version} do całej sieci.`);
    notify("🔄 Zmodernizowano wszystkie sklepy.");
    render();
}

function storeEfficiency(store){
    let efficiency=1;
    const eq=store.equipment||emptyEquipment();

    if((eq.checkout||0)<1){
        efficiency*=0.35;
    }else{
        efficiency*=Math.min(1.4,0.75+eq.checkout*0.15);
    }

    if((eq.fridge||0)<1) efficiency*=0.88;
    if((eq.shelf||0)<2) efficiency*=0.9;

    const assigned=Object.keys(store.planogram||{}).length;
    efficiency*=0.75+Math.min(.3,assigned*.04);

    return efficiency;
}

const COUNTRIES=[...new Set(LOCATIONS.map(x=>x[1]))];

function detectCountry(lat,lng){
    let best=null;
    let dist=Infinity;

    LOCATIONS.forEach(l=>{
        const d=(lat-l[2])**2+(lng-l[3])**2;

        if(d<dist){
            dist=d;
            best=l;
        }
    });

    return best?best[1]:"Nieznany";
}

/* =====================================================

const map=L.map("map",{

/*
   Całkowicie własna obsługa kółka.
   Leaflet nie dostaje wheel zoom.
*/

const mapElement=document.getElementById("map");

let wheelAccumulator=0;
let wheelTimer=null;

mapElement.addEventListener("wheel",function(event){

    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();

    wheelAccumulator+=event.deltaY;

    clearTimeout(wheelTimer);

    wheelTimer=setTimeout(()=>{

        const center=map.getCenter();
        const currentZoom=map.getZoom();

        let newZoom=currentZoom;

        if(wheelAccumulator<0) newZoom++;
        if(wheelAccumulator>0) newZoom--;

        wheelAccumulator=0;

        newZoom=clamp(
            newZoom,
            map.getMinZoom(),
            map.getMaxZoom()
        );

        if(newZoom===currentZoom)return;

        /*
        Ten sam lat/lng przed i po zoomie.
        */

        map.setView(
            [center.lat,center.lng],
            newZoom,
            {animate:false}
        );

    },45);

},{
    passive:false,
    capture:true
});

/* własne + / - */

const FixedZoom=L.Control.extend({

    options:{position:"topright"},

    onAdd:function(){

        const container=L.DomUtil.create(
            "div",
            "leaflet-bar leaflet-control"
        );

        const plus=L.DomUtil.create("a","",container);
        plus.innerHTML="+";
        plus.href="#";
        plus.title="Przybliż";

        const minus=L.DomUtil.create("a","",container);
        minus.innerHTML="−";
        minus.href="#";
        minus.title="Oddal";

        plus.style.fontSize="22px";
        plus.style.fontWeight="bold";
        plus.style.textAlign="center";

        minus.style.fontSize="22px";
        minus.style.fontWeight="bold";
        minus.style.textAlign="center";

        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);

        L.DomEvent.on(plus,"click",e=>{
            L.DomEvent.preventDefault(e);
            fixedZoom(1);
        });

        L.DomEvent.on(minus,"click",e=>{
            L.DomEvent.preventDefault(e);
            fixedZoom(-1);
        });

        return container;
    }
});

map.addControl(new FixedZoom());

function fixedZoom(delta){
    const center=map.getCenter();

    const zoom=clamp(
        map.getZoom()+delta,
        map.getMinZoom(),
        map.getMaxZoom()
    );

    map.setView(
        [center.lat,center.lng],
        zoom,
        {animate:false}
    );
}

function safeMapResize(){
    const center=map.getCenter();
    const zoom=map.getZoom();

    map.invalidateSize({
        animate:false,
        pan:false
    });

    requestAnimationFrame(()=>{
        map.setView(
            [center.lat,center.lng],
            zoom,
            {animate:false}
        );
    });
}

function createSubsidiary(parentId=null){

        return;
    }

    changeMoney(-50000);

    const s={
        id:nextSubsidiaryId++,
        parentId:parentId?Number(parentId):null,
        name:"Ropucha Company "+nextSubsidiaryId,
        countries:[],
        capital:0
    };

    subsidiaries.push(s);

    addNews(`🏛️ Utworzono spółkę ${s.name}.`);
    render();
}

function renameSubsidiary(id,name){
    const s=subsidiaries.find(x=>x.id===id);
    if(!s)return;

    name=String(name).trim();

    if(name.length<2 || name.length>50){
        notify("❌ Nazwa musi mieć 2–50 znaków.");
        return;
    }

    s.name=name;
    render();
}

function isDescendant(parentId,targetId){
    let cur=subsidiaries.find(x=>x.id===targetId);

    while(cur){
        if(cur.parentId===parentId)return true;
        cur=subsidiaries.find(x=>x.id===cur.parentId);
    }

    return false;
}

function changeParent(id,parentId){
    const s=subsidiaries.find(x=>x.id===id);
    if(!s)return;

    parentId=parentId?Number(parentId):null;

    if(parentId===id || isDescendant(id,parentId)){
        notify("❌ Nie można utworzyć pętli.");
        return;
    }

    s.parentId=parentId;
    render();
}

function assignCountry(subId,country){
    subsidiaries.forEach(s=>{
        s.countries=s.countries.filter(c=>c!==country);
    });

    const s=subsidiaries.find(x=>x.id===subId);
    if(!s)return;

    s.countries.push(country);

    autoAssignStores();

    notify(`🌍 ${country} → ${s.name}`);
    render();
}

function autoAssignStores(){
    stores.forEach(store=>{
        const sub=subsidiaries.find(
            s=>s.countries.includes(store.country)
        );

        store.subsidiaryId=sub?sub.id:null;
    });
}

function treeHTML(parentId=null){
    const list=subsidiaries.filter(s=>s.parentId===parentId);

    return list.map(s=>{
        const count=stores.filter(x=>x.subsidiaryId===s.id).length;

        return `
        <div class="treeNode">
            🏢 <b>${esc(s.name)}</b>
            <span class="badge">🏪 ${count}</span>

            <div class="muted">
                ${s.countries.length?s.countries.map(esc).join(", "):"brak przypisanych krajów"}
            </div>

            <div class="treeChildren">
                ${treeHTML(s.id)}
            </div>
        </div>`;
    }).join("");
}

        <br>

        <br>
        📊 Twoje udziały: ${c.shares}%
    `);

function processCompanies(){
    companies.forEach(c=>{

        c.age++;

        const marketRandom=rndf(-0.025,0.045);
        const researchBonus=c.research*0.001;
        const brandBonus=c.brandPower*0.0005;

        const growth=
            c.growth+
            marketRandom+
            researchBonus+
            brandBonus;

        c.production=Math.floor(
            c.production*(1+growth*.4)
        );

        c.production=Math.min(
            c.production,
            c.productionCapacity
        );

        c.profit=Math.max(
            100,
            Math.floor(
                c.profit*(1+growth*.25)
            )
        );

        c.valuation=Math.max(
            100000,
            Math.floor(
                c.valuation*(1+growth*.15)
            )
        );

        if(Math.random()<.15){
            c.research+=rndf(.1,1);
        }

        if(Math.random()<.12){
            c.brandPower=Math.min(
                100,
                c.brandPower+rndf(.1,1)
            );
        }

        if(c.production>c.employees*80){
            c.employees+=rnd(2,15);
        }

        /*
        Firma rozbudowuje zakład.
        */

        if(
            c.production>c.productionCapacity*.85 &&
            c.profit>5000 &&
            Math.random()<.18
        ){
            c.factories++;

            c.productionCapacity+=rnd(
                5000,
                20000
            );

            c.employees+=rnd(20,100);
            c.level++;

            addNews(
                `🏭 ${c.name} rozbudowuje produkcję. Zakłady: ${c.factories}.`
            );
        }

        /*
        Ekspansja międzynarodowa.
        */

        if(
            c.factories>=3 &&
            Math.random()<.015
        ){
            const location=pick(LOCATIONS);

            c.brandPower=Math.min(
                100,
                c.brandPower+2
            );

            addNews(
                `🌍 ${c.name} rozpoczyna ekspansję: ${location[1]}.`
            );
        }

        updateCompanyPopup(c);
    });
}

function buyCompanyShares(cid,iid,amount,mult){
    const c=companies.find(x=>x.id===cid);
    const i=c?.shareholders.find(x=>x.id===iid);

    if(!c || !i)return;

    amount=Math.min(amount,i.shares);

    const price=Math.floor(
        c.valuation*amount/100*mult
    );

    if(money<price){
        notify("❌ Brakuje pieniędzy.");
        return;
    }

    const chance=
        mult>=1.4?.9:
        mult>=1.25?.7:
        .55;

    if(Math.random()>chance){
        notify(`❌ ${i.name} odrzucił ofertę.`);
        return;
    }

    changeMoney(-price);

    i.shares-=amount;
    c.shares=clamp(c.shares+amount,0,100);
    c.controlled=c.shares>50;

    updateCompanyPopup(c);

    addNews(`🤝 Ropucha Group kupiła ${amount}% ${c.name}.`);

    openShareholders(cid);
    render();
}

function putCompanyInGroup(id){
    const c=companies.find(x=>x.id===id);

    if(!c || c.shares<=50)return;

    c.inGroup=true;

    closeModal();

    addNews(`🏛️ ${c.name} dołącza do Ropucha Group.`);
    render();
}

function buyCompetitorShares(cid,iid,amount,mult){
    const c=competitors.find(x=>x.id===cid);
    const i=c?.shareholders.find(x=>x.id===iid);

    if(!c || !i)return;

    amount=Math.min(amount,i.shares);

    const price=Math.floor(
        c.valuation*amount/100*mult
    );

    if(money<price){
        notify("❌ Brakuje pieniędzy.");
        return;
    }

    const chance=
        mult>=1.45?.93:
        mult>=1.25?.72:
        .55;

    if(Math.random()>chance){
        notify("❌ Inwestor odrzucił ofertę.");
        return;
    }

    changeMoney(-price);

    i.shares-=amount;
    c.shares=clamp(c.shares+amount,0,100);
    c.controlled=c.shares>50;

    addNews(`📈 Kupiono ${amount}% udziałów ${c.name}.`);

    openCompetitor(cid);
    render();
}

function acquireCompetitor(id,rebrand){
    const c=competitors.find(x=>x.id===id);

    if(!c || c.shares<=50 || c.acquired)return;

    c.acquired=true;

    const oldName=c.name;
    const converted=[...c.stores];

    converted.forEach(cs=>{
        if(cs.marker)map.removeLayer(cs.marker);

        createStore(
            cs.lat,
            cs.lng,
            true,
            rebrand?"Ropucha":oldName
        );
    });

    c.stores=[];

    closeModal();

    addNews(
        `👑 Ropucha Group przejęła ${oldName}. ${converted.length} sklepów stało się częścią grupy.`
    );

    notify(`👑 Przejęto ${oldName}!`);
    render();
}

/* =====================================================
   EKONOMIA
===================================================== */

function processSales(){
    let revenue=0;

    stores.forEach(s=>{
        s.revenueToday=0;
        s.customersToday=0;
        s.lostToday=0;

        const efficiency=storeEfficiency(s);

        const potential=Math.max(
            10,
            Math.floor(
                (35+reputation+rnd(-10,25))*efficiency
            )
        );

        const capacity=40+(s.equipment?.checkout||0)*40;

        for(let i=0;i<Math.min(potential,capacity);i++){

            const available=PRODUCTS.filter(p=>{
                const item=s.products[p.id];

                if(!item || item.stock<=0)return false;

                const required=s.planogram?.[p.id];

                if(
                    required &&
                    (s.equipment?.[required]||0)<=0
                )return false;

                return true;
            });

            if(!available.length){
                s.lostToday++;
                continue;
            }

            const p=pick(available);
            const item=s.products[p.id];

            const finalPrice=item.promoDays
                ?item.price*(1-item.promo/100)
                :item.price;

            const chance=clamp(
                1.12-(finalPrice/p.price)*.42+
                (item.promoDays?.12:0),
                .15,
                .95
            );

            if(Math.random()<chance){
                item.stock--;
                s.customersToday++;
                s.revenueToday+=finalPrice;
                revenue+=finalPrice;
            }else{
                s.lostToday++;
            }
        }

        Object.values(s.products).forEach(i=>{
            if(i.promoDays>0){
                i.promoDays--;

                if(i.promoDays<=0){
                    i.promo=0;
                }
            }
        });

        updateStorePopup(s);
    });

    return Math.floor(revenue);
}

function processDividends(){
    let d=0;

    companies.forEach(c=>{
        d+=c.profit*.25*c.shares/100;
    });

    return Math.floor(d);
}

function processExpenses(){
    let e=drivers.reduce((a,d)=>a+d.salary,0);

    e+=trucks.length*fuelPrice*20;

    stores.forEach(s=>{
        Object.keys(EQUIPMENT).forEach(k=>{
            e+=(s.equipment?.[k]||0)*EQUIPMENT[k].energy*2;
        });
    });

    return Math.floor(e);
}

function processDay(){
    day++;

    processCompetitors();
    processCompanies();

    const rev=processSales();
    const div=processDividends();
    const exp=processExpenses();

    changeMoney(rev+div-exp,false);

    totalRevenue+=rev;
    totalDividends+=div;
    totalExpenses+=exp;

    if(stores.length){
        const served=stores.reduce((a,s)=>a+s.customersToday,0);
        const lost=stores.reduce((a,s)=>a+s.lostToday,0);

        reputation=clamp(
            reputation+(served>lost?.25:-.35),
            0,
            100
        );
    }

    if(Math.random()<.18){
        generateContact();
    }

    if(Math.random()<.12){
        fuelPrice*=rndf(.94,1.08);

        addNews(
            `⛽ Cena paliwa zmieniła się do ${fuelPrice.toFixed(2)} zł/l.`
        );
    }

    addNews(
        `📊 Dzień ${day}: sprzedaż ${cash(rev)}, dywidendy ${cash(div)}, koszty ${cash(exp)}.`
    );

    render();
}

function countryStats(country){
    const ours=stores.filter(s=>s.country===country).length;

    const others=competitors.reduce(
        (n,c)=>n+c.stores.filter(s=>s.country===country).length,
        0
    );

    const total=ours+others;

    return {
        ours,
        others,
        total,
        share:total?ours/total*100:0
    };
}

function openSection(id,btn){

        .forEach(b=>b.classList.remove("active"));

    });
}

/* =====================================================

===================================================== */

function groupValue(){
    const portfolio=companies.reduce(
        (a,c)=>a+c.valuation*c.shares/100,
        0
    );

    const storesValue=stores.reduce(
        (a,s)=>a+50000+equipmentCost(s.equipment||{}),
        0
    );

    const centersValue=centers.length*200000;

    return Math.floor(
        money+
        portfolio+
        storesValue+
        centersValue
    );
}

/* =====================================================

===================================================== */

function saveGame(){
    const cleanStores=stores.map(s=>({
        ...s,
        marker:null
    }));

    const cleanCompanies=companies.map(c=>({
        ...c,
        marker:null
    }));

    const cleanCenters=centers.map(c=>({
        ...c,
        marker:null
    }));

    const cleanCompetitors=competitors.map(c=>({
        ...c,
        stores:c.stores.map(s=>({
            ...s,
            marker:null
        }))
    }));

    const data={
        money,day,reputation,fuelPrice,

        maxFranchisees,
        maxDrivers,
        maxStaff,

        stores:cleanStores,
        subsidiaries,
        companies:cleanCompanies,
        centers:cleanCenters,
        drivers,
        trucks,
        franchisees,
        competitors:cleanCompetitors,
        contacts,
        standards,
        defaultStandardId,
        newsFeed,

        nextStoreId,
        nextSubsidiaryId,
        nextCompanyId,
        nextInvestorId,
        nextCenterId,
        nextDriverId,
        nextTruckId,
        nextCompetitorId,
        nextCompetitorStoreId,
        nextContactId,
        nextStandardId,

        totalRevenue,
        totalExpenses,
        totalDividends
    };

    localStorage.setItem(
        "ropuchaMegaSave",
        JSON.stringify(data)
    );

    notify("💾 Zapisano grę.");
}

function resetGame(){
    if(confirm("Usunąć zapis i rozpocząć od nowa?")){
        localStorage.removeItem("ropuchaMegaSave");
        location.reload();
    }
}

/* =====================================================
   DEV CONSOLE
===================================================== */

const con=document.getElementById("console");
const conInput=document.getElementById("consoleInput");
const conHistory=document.getElementById("consoleHistory");

let conOpen=false;

window.addEventListener("keydown",e=>{

    if(e.key==="`" || e.key==="~"){
        e.preventDefault();

        conOpen=!conOpen;

        con.style.display=conOpen
            ?"block"
            :"none";

        if(conOpen){
            setTimeout(()=>conInput.focus(),20);
        }
    }

    else if(e.key==="Escape"){

        if(conOpen){
            conOpen=false;
            con.style.display="none";
        }else{
            buildMode=null;
            hideBuild();
        }
    }
});

conInput.addEventListener("keydown",e=>{
    if(e.key!=="Enter")return;

    const cmd=conInput.value.trim();

    conInput.value="";

    printCon("> "+cmd,"#fff");

    execute(cmd);
});

function printCon(t,c="#b9c9bc"){
    const d=document.createElement("div");

    d.textContent=t;
    d.style.color=c;

    conHistory.appendChild(d);
    conHistory.scrollTop=conHistory.scrollHeight;
}

function execute(str){
    const a=str.split(/\s+/);
    const cmd=a[0]?.toLowerCase();
    const v=Number(a[1]);

    if(cmd==="help"){
        printCon(
`KOMENDY:

kasa [kwota]
maxstaff [liczba]
maxfranczyzobiorcy [liczba]
maxkierowcy [liczba]

reputacja [0-100]

firma
firmy [liczba]

kontakt
kontakty [liczba]

dzien
paliwo [cena]
sklep

status
save
clear`
        );

        return;
    }

    if(cmd==="kasa" && Number.isFinite(v)){
        money=Math.max(0,v);
    }

    else if(cmd==="maxstaff" && Number.isFinite(v)){
        maxStaff=Math.max(0,Math.floor(v));
    }

    else if(cmd==="maxfranczyzobiorcy" && Number.isFinite(v)){
        maxFranchisees=Math.max(0,Math.floor(v));
    }

    else if(cmd==="maxkierowcy" && Number.isFinite(v)){
        maxDrivers=Math.max(0,Math.floor(v));
    }

    else if(cmd==="reputacja" && Number.isFinite(v)){
        reputation=clamp(v,0,100);
    }

    else if(cmd==="firma"){
        generateCompany();
        render();
        return;
    }

    else if(cmd==="firmy"){
        for(let i=0;i<clamp(Math.floor(v||1),1,100);i++){
            generateCompany(true);
        }

        render();
        return;
    }

    else if(cmd==="kontakt"){
        generateContact();
        render();
        return;
    }

    else if(cmd==="kontakty"){
        for(let i=0;i<clamp(Math.floor(v||1),1,100);i++){
            generateContact(true);
        }

        render();
        return;
    }

    else if(cmd==="dzien"){
        processDay();
        return;
    }

    else if(cmd==="paliwo" && Number.isFinite(v)){
        fuelPrice=Math.max(.1,v);
    }

    else if(cmd==="sklep"){
        if(!franchisees.length){
            franchisees.push({
                id:Date.now(),
                name:"DEV",
                stores:[],
                skill:5
            });
        }

        const l=pick(LOCATIONS);

        createStore(
            l[2],
            l[3],
            true
        );

        return;
    }

    else if(cmd==="save"){
        saveGame();
        return;
    }

    else if(cmd==="clear"){
        conHistory.innerHTML="";
        return;
    }

    else if(cmd==="status"){
        printCon(
`Dzień: ${day}
Kasa: ${cash(money)}
Wartość grupy: ${cash(groupValue())}
Sklepy: ${stores.length}
Standardy: ${standards.length}
Kontakty: ${contacts.length}
Spółki córki: ${subsidiaries.length}
Producenci: ${companies.length}
Konkurenci: ${competitors.filter(c=>!c.acquired).length}
Centra: ${centers.length}
Kierowcy: ${drivers.length}/${maxDrivers}`
        );

        return;
    }

    else{
        printCon(
            "Nieznana komenda. Wpisz help.",
            "#ff7070"
        );

        return;
    }

    render();
}
