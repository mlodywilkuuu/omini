<style>
:root{
 --bg:#0a0f0c;--panel:#111813;--panel2:#18221b;--card:#1b261f;

 --text:#f3f7f4;--muted:#91a096;--red:#ff626c;--orange:#ffad4d;

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}

#map{
 position:fixed;left:220px;top:0;right:0;bottom:0;z-index:1;
}

/* SIDEBAR */

#sidebar{
 position:fixed;left:0;top:0;bottom:0;width:220px;z-index:5000;
 background:#0c120e;border-right:1px solid var(--line);
 overflow:auto;padding:10px;
}

.logo{
 font-size:18px;font-weight:900;color:#6aee90;padding:12px 8px 16px;
}
.logo small{
 display:block;color:#607066;font-size:9px;letter-spacing:2px;margin-top:3px;
}

.navLabel{
 font-size:9px;color:#5b6b60;font-weight:800;letter-spacing:1.3px;
 margin:15px 9px 5px;
}

.nav{
 display:flex;align-items:center;gap:9px;width:100%;
 border:0;border-radius:7px;background:transparent;color:#9bac9f;
 padding:9px;text-align:left;margin:2px 0;
}

.nav:hover{background:#18221b;color:white}
.nav.active{background:#153d24;color:#7af09a}
.nav span{width:21px;text-align:center}

/* TOP HUD */

#top{
 position:fixed;left:235px;top:12px;right:15px;z-index:4000;
 display:flex;justify-content:space-between;pointer-events:none;
}

.huds{display:flex;gap:6px;flex-wrap:wrap}

.hud{
 background:#0d120feb;border:1px solid var(--line);
 padding:7px 11px;border-radius:8px;min-width:90px;
 box-shadow:0 4px 15px #0005;
}

.hud small{
 display:block;font-size:8px;color:#77867d;font-weight:800;
}

.hud strong{font-size:13px}

.time{
 pointer-events:auto;background:#0d120feb;border:1px solid var(--line);
 border-radius:8px;padding:5px;
}

.time button{
 border:0;background:#202a23;color:#aaa;border-radius:5px;padding:6px 9px;
}

.time button.active{background:var(--green2);color:white}

/* PANEL */

#panel{
 position:fixed;z-index:4500;left:220px;top:0;bottom:0;width:530px;
 background:#101612f8;border-right:1px solid var(--line);
 overflow:auto;padding:18px;box-shadow:15px 0 35px #0007;
}

#panel.hidden{display:none}

.title{font-size:22px;font-weight:900;margin-bottom:4px}
.subtitle{font-size:11px;color:var(--muted);margin-bottom:16px}

.tabs{
 display:flex;gap:4px;margin-bottom:12px;flex-wrap:wrap;
}

.tab{
 border:1px solid var(--line);background:#18201b;color:#9dac9f;
 border-radius:6px;padding:7px 10px;
}

.tab.active{
 background:#205832;color:white;border-color:#347a49;
}

.card{
 background:var(--card);border:1px solid var(--line);
 border-radius:10px;padding:12px;margin-bottom:8px;
}

.card:hover{border-color:#3d5143}

.kpis{
 display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;

.kpi{
 background:#18211b;border:1px solid var(--line);
 border-radius:9px;padding:12px;
}

.kpi small{
 display:block;color:#7c8e82;font-size:9px;font-weight:800;
}

.kpi strong{font-size:18px}

.row{

 margin:6px 0;font-size:12px;color:#9cac9f;

.row b{color:white;text-align:right}

.green{color:#64e889!important}
.red{color:var(--red)!important}
.orange{color:var(--orange)!important}
.blueText{color:var(--blue)!important}

.muted{
 font-size:11px;color:var(--muted);line-height:1.45;

.btn{
 width:100%;border:0;border-radius:6px;padding:8px;

.btn:hover{filter:brightness(1.12)}

.btn.redBtn{background:#8e3940}
.btn.orangeBtn{background:#a76428}
.btn.gray{background:#3a463e}

.grid2{
 display:grid;grid-template-columns:1fr 1fr;gap:5px;

.grid3{
 display:grid;grid-template-columns:repeat(3,1fr);gap:5px;

input,select{

.full{width:100%}

.badge{

.badge.ok{background:#18552c;color:#83f3a1}
.badge.warn{background:#65491c;color:#ffd08b}
.badge.bad{background:#61282c;color:#ff9da4}
.badge.blue{background:#204c71;color:#9ed0ff}
.badge.purple{background:#4f396c;color:#d4b7ff}

.sectionTitle{

.empty{
 padding:25px;text-align:center;color:#718078;

.table{
 width:100%;border-collapse:collapse;font-size:11px;

.table th{
 text-align:left;color:#73847a;padding:7px;
 border-bottom:1px solid var(--line);
}

.table td{
 padding:8px 7px;border-bottom:1px solid #273129;

.table tr:hover td{background:#202a23}

.holdingRoot{

 border-radius:12px;padding:14px;margin-bottom:10px;
}

.companyNode{

 padding-left:12px;margin:8px 0 8px 12px;

.companyBox{
 background:#18221b;border:1px solid #33443a;
 border-radius:8px;padding:10px;margin-bottom:5px;

.companyBox.selected{

.assetGrid{

.asset{
 background:#111713;border:1px solid #2d3c32;
 border-radius:6px;padding:7px;font-size:10px;

/* MODAL */

#modalBg{
 display:none;position:fixed;inset:0;background:#000c;
 z-index:60000;align-items:center;justify-content:center;
}

#modal{
 background:#121914;border:1px solid #3b4a40;
 border-radius:12px;width:min(1100px,96vw);
 max-height:94vh;overflow:auto;padding:17px;
}

.close{
 float:right;border:0;border-radius:6px;
 background:#7d3238;color:white;padding:7px 11px;
}

.formLabel{
 display:block;font-size:10px;color:#829187;
 font-weight:800;margin:11px 0 4px;
}

/* STORE EDITOR */

.editorWrap{
 display:grid;grid-template-columns:200px 1fr;gap:12px;
}

.palette{
 background:#18201b;border-radius:8px;padding:8px;
 max-height:75vh;overflow:auto;
}

.palette button{
 width:100%;background:#253029;color:#ddd;
 border:1px solid #39473e;padding:7px;text-align:left;
 border-radius:5px;margin:2px 0;
}

.storeGrid{
 display:grid;gap:2px;background:#080b09;padding:4px;
 border:2px solid #48554c;width:min(690px,68vw);
 aspect-ratio:1;
}

.cell{
 border:1px solid #354139;display:flex;
 align-items:center;justify-content:center;
 cursor:pointer;user-select:none;
}

.cell.sales{background:#243126}
.cell.backroom{background:#3c3325}
.cell:hover{outline:2px solid #5ce782}

/* MAP */

.mapMarker{
 width:30px;height:30px;border-radius:9px;border:2px solid white;
 display:flex;align-items:center;justify-content:center;
 font-size:15px;box-shadow:0 4px 10px #0008;
}

.storeM{background:#18733b}
.centerM{background:#2868a3}
.factoryM{background:#9b622d}

#mapFilters{
 position:fixed;right:15px;bottom:15px;z-index:4000;
 background:#0d120fe8;border:1px solid var(--line);
 padding:7px;border-radius:8px;

#mapFilters label{
 font-size:10px;margin-right:8px;

#buildInfo{
 display:none;position:fixed;z-index:50000;
 bottom:20px;left:50%;transform:translateX(-50%);
 background:#111;border:1px solid #4a5c50;
 padding:10px 18px;border-radius:7px;
}

/* TOAST */

#notes{
 position:fixed;right:12px;bottom:60px;
 width:300px;z-index:70000;
}

.note{
 background:#121914;border:1px solid #35463b;
 border-left:4px solid #49db73;
 padding:9px;border-radius:7px;margin-top:5px;font-size:11px;
}

/* CONSOLE */

#console{
 display:none;position:fixed;z-index:90000;
 width:min(700px,94vw);height:420px;
 left:50%;top:50%;transform:translate(-50%,-50%);
 background:#060907f8;border:1px solid #42ce69;border-radius:8px;
}

#consoleHistory{
 height:360px;overflow:auto;padding:10px;

}

#consoleInput{
 width:100%;height:58px;border:0;

 background:#0b100d;color:white;font-family:monospace;
}

.progress{
 height:7px;background:#303b33;border-radius:10px;overflow:hidden;
}

.progress div{
 height:100%;background:#49db73;
}

@media(max-width:900px){

 .nav span{font-size:20px}
 #map{left:70px}
 #panel{left:70px;width:360px}
 #top{left:82px}
}

function nearestPlace(lat,lng){

 let best=PLACES[0];
 let dist=Infinity;

 PLACES.forEach(p=>{

  const d=
   (lat-p[2])**2+
   (lng-p[3])**2;

  if(d<dist){
   dist=d;
   best=p;
  }

 });

 return best;
}

========================================================= */

function getSub(id){

 return subsidiaries.find(
  s=>s.id===Number(id)
 );

}

function subName(id){

 if(!id)return "Ropucha Group";

 const s=getSub(id);

 return s?s.name:"Ropucha Group";

}

function getSubChildren(id){

 return subsidiaries.filter(
  s=>s.parentId===id
 );

}

function getDescendantIds(id){

 const result=[];

 function walk(parent){

  subsidiaries
   .filter(s=>s.parentId===parent)
   .forEach(s=>{

    result.push(s.id);
    walk(s.id);

   });

 }

 walk(id);

 return result;

}

function subAssets(id){

 const ownStores=
  stores.filter(s=>s.subsidiaryId===id);

 const ownCenters=
  centers.filter(c=>c.subsidiaryId===id);

 const ownFactories=[];

 companies.forEach(c=>{

  c.factories.forEach(f=>{

   if(f.subsidiaryId===id){

    ownFactories.push({
     company:c,
     factory:f
    });

   }

  });

 });

 const ownedCompanies=
  companies.filter(c=>
   c.owned&&
   c.subsidiaryId===id
  );

 return {
  stores:ownStores,
  centers:ownCenters,
  factories:ownFactories,
  companies:ownedCompanies
 };

}

function calculateSubFinances(id){

 const a=subAssets(id);

 let revenue=0;

 a.stores.forEach(s=>{
  revenue+=s.sales||0;
 });

 a.companies.forEach(c=>{
  revenue+=c.profit||0;
 });

 let costs=0;

 employees.forEach(e=>{

  if(e.status!=="employed")return;

  if(e.storeId){

   const store=
    stores.find(s=>s.id===e.storeId);

   if(store?.subsidiaryId===id){
    costs+=e.salary/30;
   }

  }

 });

 drivers.forEach(d=>{

  if(d.centerId){

   const center=
    centers.find(c=>c.id===d.centerId);

   if(center?.subsidiaryId===id){
    costs+=d.salary/30;
   }

  }

 });

 return {
  revenue,
  costs,
  profit:revenue-costs
 };

}

function subAssetValue(id){

 const a=subAssets(id);

 let value=0;

 a.stores.forEach(s=>{
  value+=STORE_SIZES[s.size]?.cost||0;
 });

 a.centers.forEach(c=>{
  value+=200000+(c.level-1)*150000;
 });

 a.factories.forEach(x=>{
  value+=x.company.valuation/
   Math.max(1,x.company.factories.length);
 });

 a.companies.forEach(c=>{
  value+=c.valuation;
 });

 return value;

}

  prompt(
   "Nowa nazwa spółki:",

 if(!name)return;

 const clean=name.trim();

 if(clean.length<2)return;

 if(
  subsidiaries.some(
   x=>
    x.id!==id&&
    x.name.toLowerCase()===
    clean.toLowerCase()
  )
 ){

  return notify(
   "Taka nazwa jest już używana."
  );

 }

 const old=s.name;

 s.name=clean;

 addNews(
  `🏛️ ${old} zmienia nazwę na ${clean}.`
 );

 openSubsidiary(id);

 render();

}

function moveSubsidiary(id,parentValue){

 const s=getSub(id);

 if(!s)return;

 const parentId=
  parentValue
   ?Number(parentValue)
   :null;

 if(parentId===id){

  notify(
   "Spółka nie może posiadać samej siebie."
  );

  return openSubsidiary(id);

 }

 const descendants=
  getDescendantIds(id);

 if(
  parentId&&
  descendants.includes(parentId)
 ){

  notify(
   "Nie można przenieść spółki pod jej własną spółkę córkę."
  );

  return openSubsidiary(id);

 }

 s.parentId=parentId;

 addNews(
  `🏛️ ${s.name} została przeniesiona pod ${subName(parentId)}.`
 );

 openSubsidiary(id);

 render();

}

function editorCell(x,y){

 const s=
  stores.find(
   a=>a.id===editorStore
  );

 const c=
  s.layout[y][x];

 if(editorZone){

  if(c.eq){

   return notify(
    "Usuń najpierw sprzęt."
   );

  }

  c.zone=editorZone;

  return drawEditor();

 }

 if(editorTool==="erase"){

  c.eq=null;
  c.plan=[];

  return drawEditor();

 }

 if(c.eq===editorTool){

  return openPlanogram(
   x,
   y
  );

 }

 const e=
  EQUIPMENT[editorTool];

 if(!e)return;

 if(
  e.back&&
  c.zone!=="backroom"
 ){

  return notify(
   "Ten sprzęt musi być na zapleczu."
  );

 }

 if(
  !e.back&&
  c.zone==="backroom"&&
  editorTool!=="door"
 ){

  return notify(
   "Ten sprzęt musi być na sali."
  );

 }

 if(c.eq){

  return notify(
   "Pole jest zajęte."
  );

 }

 if(money<e.cost){

  return notify(
   "Za mało pieniędzy."
  );

 }

 changeMoney(-e.cost);

 c.eq=editorTool;
 c.plan=[];

 drawEditor();

}

function logisticsDistance(a,b){
 return map.distance([a.lat,a.lng],[b.lat,b.lng])/1000;
}

function nearestCenterForStore(s){
 if(!centers.length)return null;
 return centers.slice().sort((a,b)=>logisticsDistance(a,s)-logisticsDistance(b,s))[0];
}

function autoAssignStoresToCenters(){
 const MAX_AUTO_CENTER_KM=180;

 stores.forEach(s=>{
  if(s.logisticsManual===true && centers.some(c=>Number(c.id)===Number(s.logisticsCenterId))){
   return;
  }

  const ranked=centers
   .map(c=>({c,km:logisticsDistance(c,s)}))
   .sort((a,b)=>a.km-b.km);

  const best=ranked[0];
  if(!best || best.km>MAX_AUTO_CENTER_KM){
   s.logisticsCenterId=null;
   return;
  }

  const current=centers.find(c=>Number(c.id)===Number(s.logisticsCenterId));
  if(!current){
   s.logisticsCenterId=best.c.id;
   return;
  }

  const currentKm=logisticsDistance(current,s);
  if(best.c.id!==current.id && best.km+25<currentKm){
   s.logisticsCenterId=best.c.id;
  }
 });
}

function clearAutoRoutes(){
 routes.forEach(r=>{

 });
 routes=[];

  d.truckId=null;
  d.status="free";
 });
 trucks.forEach(t=>{

 });
}

function autoBuildRoutes(force=false){
 if(!centers.length || !stores.length)return;

 autoAssignStoresToCenters();

 // Usuwamy tylko stare linie tras. Przypisanie kierowcy i ciężarówki
 // do centrum pozostaje stałe.
 routes.forEach(r=>{
  if(r.line){
   try{layers.routes.removeLayer(r.line)}catch(e){}
  }
 });
 routes=[];

 drivers.forEach(d=>{
  d.routeId=null;
  d.truckId=null;
  if(d.status!=="route")d.status="free";
 });
 trucks.forEach(t=>{
  t.routeId=null;
  t.driverId=null;
 });

 centers.forEach(c=>{
  const centerStores=stores
   .filter(s=>s.logisticsCenterId===c.id)
   .sort((a,b)=>logisticsDistance(c,a)-logisticsDistance(c,b));

  const ds=drivers.filter(d=>Number(d.centerId)===Number(c.id));
  const ts=trucks.filter(t=>Number(t.centerId)===Number(c.id));
  const pairs=Math.min(ds.length,ts.length);

  if(!pairs)return;

  // Maksymalnie 6 sklepów na jeden zestaw kierowca + ciężarówka.
  // Jeśli floty jest za mało, sklepy pozostają przypisane do centrum,
  // ale panel pokaże niedobór.
  const served=centerStores.slice(0,pairs*6);
  const buckets=Array.from({length:pairs},()=>[]);
  served.forEach((s,i)=>buckets[i%pairs].push(s.id));

  for(let i=0;i<pairs;i++){
   if(!buckets[i].length)continue;

   const d=ds[i], t=ts[i];
   const r={
    id:ids.route++,
    centerId:c.id,
    driverId:d.id,
    truckId:t.id,
    storeIds:buckets[i],
    frequency:1,
    active:true,
    auto:true,
    lastDelivery:0,
    distance:0,
    line:null
   };

   let prev={lat:c.lat,lng:c.lng};
   let distance=0;
   r.storeIds.forEach(sid=>{
    const s=stores.find(x=>x.id===sid);
    if(!s)return;
    distance+=logisticsDistance(prev,s);
    prev=s;
   });
   distance+=logisticsDistance(prev,c);
   r.distance=Math.max(1,Math.round(distance));

   routes.push(r);
   d.routeId=r.id;
   d.truckId=t.id;
   d.centerId=c.id;
   t.routeId=r.id;
   t.driverId=d.id;
   t.centerId=c.id;
   drawRoute(r);
  }
 });
}

function animateTruckDelivery(r){
 const c=centers.find(x=>x.id===r.centerId);
 const t=trucks.find(x=>x.id===r.truckId);
 if(!c||!t)return;

 const pts=[[c.lat,c.lng]];
 r.storeIds.forEach(id=>{
  const s=stores.find(x=>x.id===id);
  if(s)pts.push([s.lat,s.lng]);
 });
 pts.push([c.lat,c.lng]);

 if(t.marker){
  try{map.removeLayer(t.marker)}catch(e){}
 }

 t.marker=L.marker(pts[0],{icon:icons.truck,zIndexOffset:1000}).addTo(map);
 t.status="route";

 let seg=0, step=0;
 const steps=20;

 const timer=setInterval(()=>{
  if(seg>=pts.length-1){
   clearInterval(timer);
   if(t.marker){
    try{map.removeLayer(t.marker)}catch(e){}
    t.marker=null;
   }
   t.status="center";
   return;
  }

  const a=pts[seg], b=pts[seg+1];
  step++;
  const k=step/steps;
  t.marker.setLatLng([
   a[0]+(b[0]-a[0])*k,
   a[1]+(b[1]-a[1])*k
  ]);

  if(step>=steps){
   seg++;
   step=0;
  }
 },60);
}

function processRoutes(){
 // Każdego dnia system ponownie sprawdza sklepy, centra i dostępne zestawy.
 clearAutoRoutes();
 autoBuildRoutes(true);

 routes.filter(r=>r.active).forEach(r=>{
  const c=centers.find(x=>x.id===r.centerId);
  const t=trucks.find(x=>x.id===r.truckId);
  const d=drivers.find(x=>x.id===r.driverId);
  if(!c||!t||!d)return;

  d.status="route";
  let capacity=t.capacity;

  r.storeIds.forEach(sid=>{
   const s=stores.find(x=>x.id===sid);
   if(!s)return;

   PRODUCTS.forEach(p=>{
    if(capacity<=0)return;
    const wanted=Math.max(0,160-(s.stock[p.id]||0));
    const available=c.stock[p.id]||0;
    const qty=Math.min(wanted,available,capacity);
    if(qty>0){
     c.stock[p.id]-=qty;
     s.stock[p.id]=(s.stock[p.id]||0)+qty;
     capacity-=qty;
    }
   });
  });

  let liters=r.distance*0.34;
  if(d.perk==="⛽ Oszczędny")liters*=0.88;
  const fuel=Math.round(liters*fuelPrice);
  changeMoney(-fuel);
  totals.fuel+=fuel;

  t.mileage+=r.distance;
  t.condition=clamp(t.condition-r.distance*.001,0,100);
  r.lastDelivery=day;

  animateTruckDelivery(r);

  setTimeout(()=>{
   d.status="free";
  },Math.max(1200,r.storeIds.length*300));
 });
}

function processStores(){

 let groupIncome=0;

 stores.forEach(s=>{

  let customers=
   20+rnd(5,40);

  const staff=
   employees.filter(
    e=>
     e.status==="employed"&&
     e.storeId===s.id
   );

  customers+=
   Math.floor(
    staff.reduce(
     (a,e)=>a+e.skill,
     0
    )*.5
   );

  s.sales=0;
  s.customers=0;

  for(
   let i=0;
   i<customers;
   i++
  ){

   const available=
    PRODUCTS.filter(
     p=>
      (s.stock[p.id]||0)>0
    );

   if(!available.length)break;

   const p=
    pick(available);

   const price=
    productPrice(p.id);

   if(Math.random()<.75){

    s.stock[p.id]--;

    s.sales+=price;

    s.customers++;

   }

  }

  s.ideas.forEach(id=>{

   const idea=
    ideas.find(
     x=>x.id===id
    );

   if(idea){

    s.sales*=
     1+idea.bonus;

   }

  });

  groupIncome+=
   s.sales*.15;

  totals.sales+=
   s.sales;

  updateStorePopup(s);

 });

 changeMoney(
  Math.round(groupIncome)
 );

}

function processFranchise(){

 let income=0;

 franchisees.forEach(f=>{

  let x=0;

  f.stores.forEach(id=>{

   const s=
    stores.find(
     a=>a.id===id
    );

   if(s){

    x+=
     s.sales*
     (.08+
      f.skill*.004);

   }

  });

  x=Math.round(x);

  f.paid+=x;
  income+=x;

 });

 totals.franchise+=income;

 changeMoney(income);

}

function processCompanies(){

 companies.forEach(c=>{

  c.valuation=
   Math.max(
    100000,
    Math.round(
     c.valuation*
     (
      1+
      rndf(-.003,.009)
     )
    )

  if(c.shares>0){

   const dividend=

     c.profit*
     .04*
     c.shares/100
    );

   totals.dividends+=

   changeMoney(

   );

  if(
   Math.random()<.012&&
   c.factories.length<8
  ){

   createFactory(
    c,
    false
   );

  }

 });

}

function processSubsidiaries(){

 subsidiaries.forEach(s=>{

  const f=
   calculateSubFinances(
    s.id
   );

  /*
   W tej wersji spółka ma własną kasę.
   Wynik operacyjny trafia do jej kasy.
  */

  s.cash+=
   Math.round(
    f.profit*.1
   );

 });

}

function processPayroll(){

 const staff=
  employees
   .filter(
    e=>e.status==="employed"
   )
   .reduce(
    (a,e)=>a+e.salary,
    0
   );

 const driverPay=
  drivers.reduce(
   (a,d)=>a+d.salary,
   0
  );

 const total=
  staff+
  driverPay+
  25000;

 changeMoney(-total);

 totals.wages+=
  staff+
  driverPay;

 addNews(
  `💸 Koszty pracownicze: ${cash(total)}.`
 );

}

function gameDay(){

 if(speed===0)return;

 day++;

 /* Cena paliwa zmienia się KAŻDEGO dnia gry. */
 const oldFuel=fuelPrice;
 fuelPrice=clamp(fuelPrice*rndf(.965,1.04),3.5,12.5);
 fuelPrice=Math.round(fuelPrice*100)/100;
 fuelHistory.unshift({day,month,year,price:fuelPrice});
 fuelHistory=fuelHistory.slice(0,120);
 if(Math.abs(fuelPrice-oldFuel)>=0.15) addNews(`⛽ Paliwo: ${fuelPrice.toFixed(2)} zł/l (${fuelPrice>oldFuel?"wzrost":"spadek"}).`);

 /* Spółki technologiczne automatycznie prowadzą badania. */
 subsidiaries.filter(s=>Array.isArray(s.specializations)&&s.specializations.includes("technology")).forEach(sub=>{
  sub.research=(sub.research||0)+rndf(.6,1.8)*(sub.researchLevel||1);
  if(sub.research>=100){
   sub.research-=100; sub.researchLevel=(sub.researchLevel||1)+1;
   if(sub.researchLevel>=4) nanoUnlocked=true;
   addNews(`🧪 ${sub.name} ukończyła automatyczne badanie. Poziom technologii: ${sub.researchLevel}.`);
  }
 });

 processRoutes();
 processStores();
 processFranchise();
 processCompanies();
 processSubsidiaries();

 Object.values(
  prices
 ).forEach(x=>{

  if(x.days>0){

   x.days--;

   if(!x.days){

    x.discount=0;

   }

  }

 });

 if(day>30){

  day=1;
  month++;

  if(month>12){

   month=1;
   year++;

  }

  processPayroll();

 }

 if(
  Math.random()<.08&&
  employees.filter(
   x=>x.status==="candidate"
  ).length<30
 ){

  newCandidate();

 }

 render();

}

function savePromotion(id){
 const x=prices[id], type=document.getElementById('promoType').value;
 x.promoType=type; x.days=Math.max(1,Math.floor(Number(document.getElementById('promoDays').value)||1));

 closeModal(); render();
}
function clearPromotion(id){ prices[id].days=0; prices[id].discount=0; closeModal(); render(); }

function rgDeleteSub(id){
 const list=rgSubs();
 const s=list.find(x=>String(getSubId(x))===String(id));
 if(!s)return;
 const m=subMeta(s);
 const children=list.filter(x=>String(subMeta(x).parentId)===String(id));
 const ownedStores=rgStores().filter(st=>String(st.companyId)===String(id)||String(st.companyOverride)===String(id));
 const ownedFactories=(Array.isArray(window.companies)?window.companies:[])
   .flatMap(c=>(c.factories||[]).map(f=>({c,f})))
   .filter(x=>String(x.f.subsidiaryId)===String(id));

 if(!confirm(`Usunąć spółkę "${getSubName(s)}"?\n\nSklepy: ${ownedStores.length}\nFabryki: ${ownedFactories.length}\nSpółki zależne: ${children.length}\n\nAktywa zostaną odpięte od tej spółki.`))return;

 ownedStores.forEach(st=>{st.companyId=null;st.companyOverride=null});
 ownedFactories.forEach(x=>x.f.subsidiaryId=null);
 children.forEach(ch=>subMeta(ch).parentId=null);

 const idx=list.indexOf(s);
 if(idx>=0)list.splice(idx,1);
 autoAssignOwnership();
 rgNotify("Usunięto spółkę "+getSubName(s));
 rgRender();
}

function financeUI(){
 const ss=Array.isArray(window.stores)?stores:[];
 const fmt=n=>Math.round(Number(n)||0).toLocaleString("pl-PL")+" zł";
 const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const monthProfit=ss.reduce((a,s)=>a+Number(s.monthProfit||0),0);
 const todayRevenue=ss.reduce((a,s)=>a+Number(s.dailyRevenue||0),0);
 const todayCogs=ss.reduce((a,s)=>a+Number(s.dailyCOGS||0),0);
 const todayProfit=ss.reduce((a,s)=>a+Number(s.lastStoreProfit||0),0);
 const profitable=ss.filter(s=>Number(s.monthProfit||0)>=0).length;
 const losing=ss.length-profitable;
 const avg=ss.length?monthProfit/ss.length:0;
 const employeeCount=(Array.isArray(window.employees)?employees.length:0)+(Array.isArray(window.drivers)?drivers.length:0);
 const monthlyPayroll=employeeCount*25000;
 const centerCount=Array.isArray(window.centers)?centers.length:0;
 const truckCount=Array.isArray(window.trucks)?trucks.length:0;
 const fuel=Number(window.fuelPrice||0);
 const companyValue=Math.max(0,Number(window.money||0)+ss.length*250000+centerCount*900000+truckCount*120000);
 const best=ss.slice().sort((a,b)=>Number(b.monthProfit||0)-Number(a.monthProfit||0));
 const byCountry={};
 ss.forEach(s=>{const c=s.country||"Polska";byCountry[c]=(byCountry[c]||0)+Number(s.monthProfit||0)});

 return `
 <h2>💰 Finanse</h2>
 <div class="grid">
  <div class="card"><small>Gotówka</small><h3>${fmt(window.money)}</h3></div>
  <div class="card"><small>Sprzedaż dzisiaj</small><h3>${fmt(todayRevenue)}</h3></div>
  <div class="card"><small>Wynik sklepów dzisiaj</small><h3 class="${todayProfit>=0?"green":"red"}">${todayProfit>=0?"+":""}${fmt(todayProfit)}</h3></div>
  <div class="card"><small>Wynik sklepów w miesiącu</small><h3 class="${monthProfit>=0?"green":"red"}">${monthProfit>=0?"+":""}${fmt(monthProfit)}</h3></div>
  <div class="card"><small>Płace / miesiąc</small><h3>${fmt(monthlyPayroll)}</h3></div>
  <div class="card"><small>Wartość grupy</small><h3>${fmt(companyValue)}</h3></div>
 </div>

 <div class="card">
  <b>📊 Dzisiejszy rachunek sklepów</b>
  <div class="row"><span>Przychód</span><b>${fmt(todayRevenue)}</b></div>
  <div class="row"><span>Koszt towaru</span><b>-${fmt(todayCogs)}</b></div>
  <div class="row"><span>Wynik operacyjny sklepów</span><b class="${todayProfit>=0?"green":"red"}">${todayProfit>=0?"+":""}${fmt(todayProfit)}</b></div>
  <div class="row"><span>Rentowne / stratne sklepy</span><b>${profitable} / ${losing}</b></div>
  <div class="row"><span>Średni wynik / sklep w miesiącu</span><b>${fmt(avg)}</b></div>
  <div class="row"><span>Cena paliwa</span><b>${fuel.toFixed(2)} zł/l</b></div>
 </div>

 <h3>🌍 Wynik według kraju</h3>
 ${Object.entries(byCountry).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`
  <div class="card"><b>${safe(c)}</b><span class="badge ${v>=0?"ok":"bad"}">${v>=0?"+":""}${fmt(v)}</span>
  <div>${ss.filter(s=>(s.country||"Polska")===c).length} sklepów</div></div>`).join("")||"<div class='empty'>Brak danych finansowych.</div>"}

 <h3>🏪 Sklepy</h3>
 ${best.slice(0,50).map(s=>`<div class="card"><b>${safe(s.name||("Sklep #"+s.id))}</b>
  <span class="badge ${Number(s.monthProfit||0)>=0?"ok":"bad"}">${fmt(s.monthProfit||0)}</span>
  <div class="row"><span>Dzisiaj</span><b>${fmt(s.lastStoreProfit||0)}</b></div>
  <div class="row"><span>Sprzedaż</span><b>${fmt(s.dailyRevenue||0)}</b></div>
 </div>`).join("")||"<div class='empty'>Brak sklepów.</div>"}`;
}

   .getElementById(

document
.getElementById(
 "consoleInput"
)

"keydown",
e=>{

 if(e.key!=="Enter")return;

 const input=
  e.target.value.trim();

 e.target.value="";

 const h=
  document.getElementById(
   "consoleHistory"
  );

 h.textContent+=
  "\n> "+input;

 const a=
  input.split(/\s+/);

 const cmd=
  (a[0]||"")
   .toLowerCase();

 const value=
  Number(a[1]);

 if(cmd==="help"){

  h.textContent+=`

help
kasa [kwota]
maxstaff [liczba]
maxfranczyzobiorcy [liczba]
maxkierowcy [liczba]
kandydat
dzien
save
status

`;

 }

 else if(
  cmd==="kasa"&&
  Number.isFinite(value)
 ){

  money=value;

 }

 else if(
  cmd==="maxstaff"&&
  Number.isFinite(value)
 ){

  maxStaff=
   Math.max(

    Math.floor(value)
   );

 }

 else if(
  cmd==="maxfranczyzobiorcy"&&
  Number.isFinite(value)
 ){

  maxFranchisees=
   Math.max(
    0,
    Math.floor(value)
   );

 }

 else if(
  cmd==="maxkierowcy"&&
  Number.isFinite(value)
 ){

  maxDrivers=
   Math.max(
    0,
    Math.floor(value)
   );

 }

 else if(cmd==="kandydat"){

  newCandidate();

 }

 else if(cmd==="dzien"){

  gameDay();

 }

 else if(cmd==="save"){

  saveGame();

 }

 else if(cmd==="status"){

  h.textContent+=`

Kasa: ${cash(money)}
Sklepy: ${stores.length}

 }

 else{

  h.textContent+=

 }

 render();

 h.scrollTop=

}
);

<script>
/* ===== PEŁNA LISTA KRAJÓW + WYSZUKIWANIE ===== */
(function(){
const ISO2 = [
"AD","AE","AF","AG","AL","AM","AO","AR","AT","AU","AZ","BA","BB","BD","BE","BF","BG","BH","BI","BJ","BN","BO","BR","BS","BT","BW","BY","BZ",
"CA","CD","CF","CG","CH","CI","CL","CM","CN","CO","CR","CU","CV","CY","CZ","DE","DJ","DK","DM","DO","DZ","EC","EE","EG","ER","ES","ET",
"FI","FJ","FM","FR","GA","GB","GD","GE","GH","GM","GN","GQ","GR","GT","GW","GY","HN","HR","HT","HU","ID","IE","IL","IN","IQ","IR","IS","IT",
"JM","JO","JP","KE","KG","KH","KI","KM","KN","KP","KR","KW","KZ","LA","LB","LC","LI","LK","LR","LS","LT","LU","LV","LY","MA","MC","MD","ME",
"MG","MH","MK","ML","MM","MN","MR","MT","MU","MV","MW","MX","MY","MZ","NA","NE","NG","NI","NL","NO","NP","NR","NZ","OM","PA","PE","PG","PH",
"PK","PL","PS","PT","PW","PY","QA","RO","RS","RU","RW","SA","SB","SC","SD","SE","SG","SI","SK","SL","SM","SN","SO","SR","SS","ST","SV","SY",
"SZ","TD","TG","TH","TJ","TL","TM","TN","TO","TR","TT","TV","TZ","UA","UG","US","UY","UZ","VA","VC","VE","VN","VU","WS","YE","ZA","ZM","ZW"
];

const dn = (typeof Intl!=="undefined" && Intl.DisplayNames)
 ? new Intl.DisplayNames(["pl"],{type:"region"})
 : null;

const ALL_WORLD_COUNTRIES = ISO2.map(code=>({
 code,
 name: dn ? dn.of(code) : code
})).filter(x=>x.name && x.name!==x.code)
  .sort((a,b)=>a.name.localeCompare(b.name,"pl"));

window.ALL_WORLD_COUNTRIES=ALL_WORLD_COUNTRIES;

function norm(s){
 return String(s||"").toLocaleLowerCase("pl-PL")
  .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}
function countryMatches(q){
 q=norm(q);
 if(!q)return ALL_WORLD_COUNTRIES;
 const starts=[], contains=[];
 ALL_WORLD_COUNTRIES.forEach(c=>{
   const n=norm(c.name), code=norm(c.code);
   if(n.startsWith(q)||code.startsWith(q))starts.push(c);
   else if(n.includes(q))contains.push(c);
 });
 return starts.concat(contains);
}
window.countryMatches=countryMatches;

function countryPickerHTML(inputId, selected="", onPick=""){
 const listId=inputId+"_country_results";
 return `
 <div class="countryPicker" style="position:relative">
  <input id="${inputId}" class="full" autocomplete="off"
   placeholder="🌍 Wpisz kraj, np. Pol..."
   value="${String(selected||"").replace(/"/g,"&quot;")}"
   oninput="WORLD_COUNTRY_PICKER.search('${inputId}','${listId}')"
   onfocus="WORLD_COUNTRY_PICKER.search('${inputId}','${listId}')">
  <div id="${listId}" class="countryResults"
   style="display:none;position:absolute;z-index:99999;left:0;right:0;top:100%;max-height:260px;overflow:auto;background:#111b15;border:1px solid #385044;border-radius:8px;box-shadow:0 8px 24px #0008"></div>
 </div>`;
}
window.countryPickerHTML=countryPickerHTML;

window.WORLD_COUNTRY_PICKER={
 search(inputId,listId){
   const input=document.getElementById(inputId),box=document.getElementById(listId);
   if(!input||!box)return;
   const items=countryMatches(input.value).slice(0,40);
   box.innerHTML=items.map(c=>`<button type="button"
     style="display:block;width:100%;text-align:left;padding:8px 10px;border:0;border-bottom:1px solid #24362c;background:#111b15;color:#e7efe9;cursor:pointer"
     onmousedown="event.preventDefault();WORLD_COUNTRY_PICKER.pick('${inputId}','${listId}','${c.name.replace(/'/g,"\\'")}')">
     ${c.name} <span style="opacity:.55">${c.code}</span>
   </button>`).join("") || `<div style="padding:10px">Nie znaleziono kraju.</div>`;
   box.style.display="block";
 },
 pick(inputId,listId,name){
   const input=document.getElementById(inputId),box=document.getElementById(listId);
   if(input){input.value=name;input.dispatchEvent(new Event("change",{bubbles:true}))}
   if(box)box.style.display="none";
 },
 value(inputId){
   const el=document.getElementById(inputId);
   return el?el.value.trim():"";
 }
};

document.addEventListener("mousedown",e=>{
 document.querySelectorAll(".countryResults").forEach(box=>{
   if(!box.parentElement.contains(e.target))box.style.display="none";
 });
});
})();
</script>

<script>
/* ===== ROPUCHA GROUP: EXPANSION PACK ===== */
(function(){
const RG = window.RG = window.RG || {
 version: "6.0",
 storeTemplate: {
   version: 1, width: 10, height: 8,
   cells: Array(80).fill("floor"),
   equipment: {shelf:12,fridge:3,cash:2,coffee:1,hotdog:1,oven:1,printer:1,parcel:1},
   backroomLevel:1
 },
 nanoTemplate: {
   version:1,width:8,height:6,cells:Array(48).fill("floor"),
   equipment:{smartShelf:8,camera:10,gate:2,fridge:2}
 },
 promotions: {},
 companies: [],
 marketRules: {},
 research: [],
 pilots: [],
 competitors: [],
 countryMarket: {},
 ideas: [],
 daily: {lastFuelDay:null},
 ui: {section:"overview", layoutTool:"shelf"}
};

const SPEC = {
 retail:"🏪 Handel", technology:"💻 Technologia", research:"🧪 R&D",
 logistics:"🚛 Logistyka", production:"🏭 Produkcja", innovation:"💡 Nowe koncepty"
};
const LAYOUT_TOOLS = {
 floor:["⬛","Pusta podłoga"], shelf:["🗄️","Regał"], fridge:["🧊","Lodówka"],
 cash:["💳","Kasa"], coffee:["☕","Ekspres"], hotdog:["🌭","Hot-dog"],
 oven:["🍕","Piec"], printer:["🖨️","Drukarka"], parcel:["📦","Paczki"],
 backroom:["🚪","Zaplecze"]
};
const COUNTRIES=(window.ALL_WORLD_COUNTRIES||[]).map(x=>x.name);
if(!COUNTRIES.length)COUNTRIES.push("Polska","Niemcy","Czechy","Słowacja");

function rgCash(n){ try{return cash(n)}catch(e){return Math.round(n).toLocaleString("pl-PL")+" zł"} }
function rgEsc(s){ try{return esc(s)}catch(e){return String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))} }
function rgNotify(s){ try{return notify(s)}catch(e){console.log(s)} }
function rgNews(s){ try{return addNews(s)}catch(e){console.log(s)} }
function rgRnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function rgPick(a){return a[Math.floor(Math.random()*a.length)]}
function rgMoney(delta){try{return changeMoney(delta)}catch(e){window.money=(window.money||0)+delta}}
function rgStores(){return Array.isArray(window.stores)?window.stores:[]}
function rgCenters(){return Array.isArray(window.centers)?window.centers:[]}
function rgProducts(){return Array.isArray(window.PRODUCTS)?window.PRODUCTS:[]}
function rgSubs(){return Array.isArray(window.subsidiaries)?window.subsidiaries:[]}

function ensureStoreFields(){
 rgStores().forEach(s=>{
   if(!s.country) s.country = guessCountry(s);
   if(s.companyOverride===undefined) s.companyOverride=null;
   if(!s.templateVersion) s.templateVersion=RG.storeTemplate.version;
   if(!s.format) s.format="standard";
   if(s.reputation===undefined) s.reputation=50;
   if(s.monthProfit===undefined) s.monthProfit=0;
 });
}
function guessCountry(s){
 const text=((s.city||"")+" "+(s.name||"")).toLowerCase();
 if(/berlin|hamburg|munich|münchen|germany/.test(text)) return "Niemcy";
 if(/prag|praha|brno|czech/.test(text)) return "Czechy";
 if(/vilnius|kaunas|lith/.test(text)) return "Litwa";
 return "Polska";
}
function getSubId(x){return x?.id ?? x?.companyId ?? x?.sid}
function getSubName(x){return x?.name || x?.companyName || ("Spółka #"+getSubId(x))}
function subMeta(s){
 s.rg = s.rg || {countries:[], specializations:["retail"], budget:0, parentId:null, techLevel:0};
 return s.rg;
}
function autoAssignOwnership(){
 ensureStoreFields();
 const subs=rgSubs();
 rgStores().forEach(st=>{
   if(st.companyOverride!==null && st.companyOverride!==undefined){
     st.companyId=Number(st.companyOverride)||st.companyOverride;
     return;
   }
   const owner=subs.find(s=>{
   const m=subMeta(s);
   return m.specializations.includes("retail") && m.countries.includes(st.country);
 });
   st.companyId=owner?getSubId(owner):null;
 });
}
function setStoreOwner(id,val){
 const s=rgStores().find(x=>x.id==id); if(!s)return;
 s.companyOverride=val==="auto"?null:Number(val);
 autoAssignOwnership(); rgNotify("Zmieniono właściciela sklepu."); rgRender();
}
function setCompanyCountry(id,country,on){
 const s=rgSubs().find(x=>getSubId(x)==id); if(!s)return;
 // Jeden domyślny właściciel rynku, żeby nie było konfliktów.
 if(on) rgSubs().forEach(x=>{if(getSubId(x)!=id) subMeta(x).countries=subMeta(x).countries.filter(c=>c!==country)});
 const m=subMeta(s);
 if(on && !m.countries.includes(country))m.countries.push(country);
 if(!on)m.countries=m.countries.filter(c=>c!==country);
 autoAssignOwnership(); rgRender();
}
function toggleSpec(id,key){
 const s=rgSubs().find(x=>getSubId(x)==id); if(!s)return;
 const m=subMeta(s); const i=m.specializations.indexOf(key);
 if(i>=0)m.specializations.splice(i,1); else m.specializations.push(key);
 rgRender();
}
function renameSub(id){
 const s=rgSubs().find(x=>getSubId(x)==id); if(!s)return;
 const n=prompt("Nowa nazwa spółki:",getSubName(s));
 if(n&&n.trim()){s.name=n.trim();rgRender();}
}
function setParent(id,parentId){
 const s=rgSubs().find(x=>getSubId(x)==id); if(!s)return;
 subMeta(s).parentId=parentId?Number(parentId):null; rgRender();
}

function applyTemplateAll(){
 RG.storeTemplate.version++;
 rgStores().filter(s=>s.format!=="nano").forEach(s=>s.templateVersion=RG.storeTemplate.version);
 rgMoney(-rgStores().length*2500);
 rgNews("📐 Wdrożono Standard Sieci v"+RG.storeTemplate.version+" we wszystkich zwykłych sklepach.");
 rgRender();
}
function cycleLayoutCell(i){

 rgRender();
}

 rgMoney(-cost); RG.storeTemplate.backroomLevel++;

}

function setPromo(pid,type){
 RG.promotions[pid]=RG.promotions[pid]||{type:"none",qty:2,bundlePrice:10,discount:20,days:7};
 RG.promotions[pid].type=type; rgRender();
}
function updatePromo(pid,key,val){
 RG.promotions[pid]=RG.promotions[pid]||{};
 RG.promotions[pid][key]=Number(val); rgRender();
}
function promoMultiplier(pid){
 const p=RG.promotions[pid]; if(!p||p.type==="none")return 1;
 if(p.type==="discount")return 1+Math.min(0.7,p.discount/100*.8);
 if(p.type==="multi")return 1.25;
 if(p.type==="second50")return 1.18;
 return 1;
}

function createIdea(){
 const names=["Smart Shelf","Ropucha Pay","Szybki Hot-Dog","Automatyczny piec","Dynamiczny planogram","Ropucha Box","Nowa kasa samoobsługowa","Prognoza popytu AI"];
 const idea={id:Date.now(),name:rgPick(names)+" "+rgRnd(1,99),status:"gotowy",stores:[],effect:rgRnd(2,12),cost:rgRnd(10000,90000)};
 RG.ideas.push(idea); rgRender();
}
function pilotIdea(id){

 if(!sample.length)return rgNotify("Najpierw otwórz sklepy.");
 idea.status="pilot"; idea.stores=sample.map(s=>s.id); idea.days=30; idea.result=null;
 rgMoney(-idea.cost); rgRender();
}
function deployIdea(id){
 const idea=RG.ideas.find(x=>x.id==id); if(!idea)return;

 rgMoney(-cost); idea.status="wdrożony"; idea.stores=rgStores().map(s=>s.id);

 });
}

 RG.competitors.forEach(c=>{

     const co=rgPick(COUNTRIES); if(!c.countries.includes(co))c.countries.push(co);
   }

 });
 if(Math.random()<.02 && RG.competitors.length<25){
   RG.competitors.push({id:Date.now()+Math.random(),name:"NewFood "+rgRnd(100,999),cash:rgRnd(400000,3000000),stores:1,countries:[rgPick(COUNTRIES)],tech:0,reputation:50});
 }

 ensureCompetitors();
 COUNTRIES.forEach(co=>{

 });

function processStoreEconomy(){
 rgStores().forEach(s=>{

<script>
(function(){
const V7=window.V7=window.V7||{
 version:7, ui:"supply", contracts:[], privateBrands:[], loans:[], bonds:[],
 news:[], managers:[], companyTransfers:[], locationReports:{},
 countryEconomy:{}, history:[], lastDay:null, lastMonth:null, lastYear:null,
 app:{level:1,members:0,pointsIssued:0},
 settings:{autosave:true,autoOrders:true,autoExpansion:false}
};
const vStores=()=>Array.isArray(window.stores)?window.stores:[];
const vCenters=()=>Array.isArray(window.centers)?window.centers:[];
const vTrucks=()=>Array.isArray(window.trucks)?window.trucks:[];
const vDrivers=()=>Array.isArray(window.drivers)?window.drivers:[];
const vProducts=()=>Array.isArray(window.PRODUCTS)?window.PRODUCTS:[];
const vCompanies=()=>Array.isArray(window.companies)?window.companies:[];
const vSubs=()=>Array.isArray(window.subsidiaries)?window.subsidiaries:[];
const vr=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const vp=a=>a[Math.floor(Math.random()*a.length)];
const vc=n=>{try{return cash(n)}catch(e){return Math.round(n).toLocaleString("pl-PL")+" zł"}};
const ve=s=>{try{return esc(s)}catch(e){return String(s??"")}};
const vm=d=>{try{return changeMoney(d)}catch(e){window.money=(window.money||0)+d}};
const vn=s=>{try{addNews(s)}catch(e){};V7.news.unshift({day:window.day||0,text:s});V7.news=V7.news.slice(0,80)};
const countries=(window.ALL_WORLD_COUNTRIES||[]).map(x=>x.name);
if(!countries.length)countries.push("Polska","Niemcy","Czechy","Słowacja");

function ensureEconomy(){
 countries.forEach(c=>{
  V7.countryEconomy[c]=V7.countryEconomy[c]||{
   wage:vr(80,135)/100,tax:vr(12,28),energy:vr(75,145)/100,demand:vr(80,125)/100,
   rent:vr(70,150)/100
  };
 });
}
function ensureSupplyFields(){
 ensureEconomy();
 vCenters().forEach(c=>{
  c.capacity=c.capacity||30000;c.throughput=c.throughput||12000;c.usedThroughput=0;
  c.stock=c.stock||{}; vProducts().forEach(p=>{if(c.stock[p.id]==null)c.stock[p.id]=vr(300,1600)});
  c.autoOrders=c.autoOrders!==false;
 });
 vStores().forEach(s=>{
  s.stock=s.stock||{};s.pendingOrders=s.pendingOrders||[];s.lostSales=s.lostSales||0;
  s.dailyRevenue=s.dailyRevenue||0;s.dailyCOGS=s.dailyCOGS||0;s.customers=s.customers||0;
  s.customerMix=s.customerMix||{uczniowie:25,biura:25,kierowcy:25,rodziny:25};
  s.rentOwned=s.rentOwned||false;s.propertyValue=s.propertyValue||vr(350000,900000);
  vProducts().forEach(p=>{if(s.stock[p.id]==null)s.stock[p.id]=vr(30,120)});
 });
}
function nearestCenter(s){
 if(!vCenters().length)return null;
 return vCenters().map(c=>({c,d:typeof logisticsDistance==="function"?logisticsDistance(c,s):999}))
   .sort((a,b)=>a.d-b.d)[0];
}
function productCost(p){return Number(p.cost||p.buyPrice||p.baseCost||3)}
function productPrice(p){return Number(p.price||p.sellPrice||p.basePrice||Math.max(5,productCost(p)*1.65))}
function promoBoost(pid){
 try{return typeof promoMultiplier==="function"?promoMultiplier(pid):1}catch(e){return 1}
}
function demandFor(s,p){
 const rep=.65+(Number(s.reputation||50)/100)*.7;
 const country=V7.countryEconomy[s.country||"Polska"]||V7.countryEconomy.Polska;
 const hourMix=(s.customerMix.uczniowie+s.customerMix.biura*1.1+s.customerMix.kierowcy*.9+s.customerMix.rodziny)/100;
 return Math.max(1,Math.round(vr(5,18)*rep*country.demand*hourMix*promoBoost(p.id)));
}
function createAutoOrders(){
 if(!V7.settings.autoOrders)return;
 vStores().forEach(s=>{
  const c=vCenters().find(x=>Number(x.id)===Number(s.logisticsCenterId)) || nearestCenter(s)?.c;
  if(!c)return;
  vProducts().forEach(p=>{
   const current=Number(s.stock[p.id]||0);
   const target=120+Math.round((s.reputation||50)*1.6);
   if(current<target*.45 && !s.pendingOrders.some(o=>o.pid===p.id)){
    s.pendingOrders.push({pid:p.id,qty:Math.max(20,target-current),centerId:c.id,created:window.day||0});
   }
  });
 });
}
function fulfillOrders(){
 vCenters().forEach(c=>c.usedThroughput=0);
 vStores().forEach(s=>{
  const remaining=[];
  s.pendingOrders.forEach(o=>{
   const c=vCenters().find(x=>Number(x.id)===Number(o.centerId));
   if(!c){remaining.push(o);return}
   const room=Math.max(0,c.throughput-c.usedThroughput);
   const available=Number(c.stock[o.pid]||0);
   const qty=Math.min(o.qty,available,room);
   if(qty>0){
    c.stock[o.pid]-=qty;s.stock[o.pid]=(s.stock[o.pid]||0)+qty;c.usedThroughput+=qty;o.qty-=qty;
   }
   if(o.qty>0)remaining.push(o);
  });
  s.pendingOrders=remaining;
 });
}
function replenishCenters(){
 vCenters().forEach(c=>{
  vProducts().forEach(p=>{
   const ownedFactories=vCompanies().filter(x=>x.owned).flatMap(x=>x.factories||[]);
   const prod=ownedFactories.length?Math.round(ownedFactories.reduce((a,f)=>a+Number(f.production||0),0)/Math.max(1,vProducts().length)):0;
   let external=0;
   V7.contracts.filter(x=>x.active&&x.pid===p.id).forEach(x=>external+=x.dailyQty);
   const qty=Math.min(c.capacity-Object.values(c.stock).reduce((a,b)=>a+Number(b||0),0),Math.max(0,prod+external));
   if(qty>0)c.stock[p.id]=(c.stock[p.id]||0)+qty;
  });
 });
}
function simulateCustomers(){
 vStores().forEach(s=>{
  let revenue=0,cogs=0,customers=0,lost=0;
  vProducts().forEach(p=>{
   const want=demandFor(s,p),have=Number(s.stock[p.id]||0),sold=Math.min(want,have);
   s.stock[p.id]=have-sold;lost+=want-sold;
   revenue+=sold*productPrice(p);cogs+=sold*productCost(p);customers+=Math.ceil(sold/2.7);
  });
  const co=V7.countryEconomy[s.country||"Polska"]||V7.countryEconomy.Polska;
  const wage=vr(350,650)*co.wage, energy=vr(90,250)*co.energy;
  const rent=s.rentOwned?0:vr(180,420)*co.rent;
  const loyalty=1+Math.min(.12,V7.app.level*.01);
  revenue*=loyalty;
  const profit=Math.round(revenue-cogs-wage-energy-rent);
  s.dailyRevenue=Math.round(revenue);s.dailyCOGS=Math.round(cogs);s.customers=customers;
  s.lostSales=(s.lostSales||0)+lost;
  s.monthProfit=(s.monthProfit||0)+profit;
  s.lastStoreProfit=profit;

  // Każdy sklep księguje swój wynik dokładnie raz na dzień gry.
  const today=Number(window.day||0);
  if(Number(s.lastProfitPaidDay)!==today){
    vm(profit);
    s.lastProfitPaidDay=today;
    s.totalStoreProfit=(s.totalStoreProfit||0)+profit;
  }
  if(lost>20)s.reputation=Math.max(0,(s.reputation||50)-.15);
  else s.reputation=Math.min(100,(s.reputation||50)+.03);
 });
}
function processContracts(){
 V7.contracts.filter(x=>x.active).forEach(x=>{
  const cost=x.dailyQty*x.unitCost;
  vm(-cost);
 });
}
function processFinance(){
 V7.loans.filter(x=>x.balance>0).forEach(l=>{
  const interest=l.balance*(l.rate/365);
  l.balance+=interest;
  if((window.day||0)%30===0){
   const pay=Math.min(l.balance,l.monthly);
   vm(-pay);l.balance-=pay;
  }
 });
}
function marketShock(){
 if(Math.random()<.035){
  const c=vp(countries),e=V7.countryEconomy[c],kind=vp(["popyt","energia","czynsze","płace"]);
  if(kind==="popyt")e.demand=Math.max(.65,Math.min(1.5,e.demand*(.9+Math.random()*.22)));
  if(kind==="energia")e.energy=Math.max(.6,Math.min(1.8,e.energy*(.9+Math.random()*.25)));
  if(kind==="czynsze")e.rent=Math.max(.6,Math.min(1.8,e.rent*(.92+Math.random()*.18)));
  if(kind==="płace")e.wage=Math.max(.7,Math.min(1.6,e.wage*(.96+Math.random()*.12)));
  vn("📰 "+c+": zmiana gospodarcza — "+kind+".");
 }
}
function recordHistory(){
 const profit=vStores().reduce((a,s)=>a+Number(s.monthProfit||0),0);
 V7.history.push({day:window.day||0,money:Number(window.money||0),stores:vStores().length,profit,fuel:Number(window.fuelPrice||0)});
 V7.history=V7.history.slice(-365);
}
function v7day(){
 ensureSupplyFields();

 // Nowy miesiąc zeruje tylko raport miesięczny. Nie zatrzymuje zarabiania sklepów.
 const monthKey=String(window.year||0)+"-"+String(window.month||0);
 if(V7.lastMonth!==monthKey){
   vStores().forEach(s=>s.monthProfit=0);
   V7.lastMonth=monthKey;
 }

 replenishCenters();createAutoOrders();fulfillOrders();simulateCustomers();
 processContracts();processFinance();marketShock();recordHistory();
 if(typeof autoBuildRoutes==="function")try{autoBuildRoutes(true)}catch(e){}
}
function newContract(pid){
 const p=vProducts().find(x=>String(x.id)===String(pid));if(!p)return;
 const q=Number(prompt("Ile sztuk dziennie?",500));if(!q||q<1)return;
 const years=Number(prompt("Umowa na ile lat?",1))||1;
 const discount=Math.min(.22,Math.log10(q+10)*.05+years*.025);
 V7.contracts.push({id:Date.now(),pid:p.id,name:"Kontrakt: "+(p.name||p.id),dailyQty:q,unitCost:Math.max(.5,productCost(p)*(1-discount)),years,active:true});
 vRender();
}
function createBrand(){
 const name=prompt("Nazwa własnej marki / produktu:","Ropucha Select");if(!name)return;
 const cost=Number(prompt("Koszt produkcji za sztukę:",3))||3;
 const price=Number(prompt("Cena sprzedaży:",6.99))||6.99;
 V7.privateBrands.push({id:Date.now(),name,cost,price,quality:vr(45,90),producer:"Ropucha Foods"});
 vn("🛒 Utworzono własną markę: "+name);vRender();
}
function takeLoan(){
 const amount=Number(prompt("Kwota kredytu:",1000000));if(!amount||amount<=0)return;

<script>
(function(){
function enhanceCountrySelects(root=document){
 root.querySelectorAll("select").forEach(sel=>{
   if(sel.dataset.worldCountryEnhanced)return;
   const text=((sel.id||"")+" "+(sel.name||"")+" "+(sel.previousElementSibling?.textContent||"")).toLowerCase();
   const opts=[...sel.options].map(o=>o.textContent.trim());
   const looksCountry=/country|kraj|rynek/.test(text) ||
      opts.some(x=>["Polska","Niemcy","Czechy","Francja"].includes(x));
   if(!looksCountry)return;

   sel.dataset.worldCountryEnhanced="1";
   const id="world_country_"+Math.random().toString(36).slice(2);
   const wrap=document.createElement("div");
   wrap.innerHTML=countryPickerHTML(id,sel.options[sel.selectedIndex]?.textContent||"");
   const picker=wrap.firstElementChild;
   sel.style.display="none";
   sel.parentNode.insertBefore(picker,sel);

   const inp=picker.querySelector("input");
   inp.addEventListener("change",()=>{
     const chosen=countryMatches(inp.value).find(c=>c.name===inp.value) || countryMatches(inp.value)[0];

 });

<script>
/* ===== NAWIGACJA / PRZYCISKI FIX v9 ===== */
(function(){
 function syncMainNav(){
   document.querySelectorAll(".nav").forEach(btn=>{
     const oc=btn.getAttribute("onclick")||"";
     const m=oc.match(/openSection\(['"]([^'"]+)/);
     btn.classList.toggle("active",!!m && m[1]===window.current);
   });
 }

 // Stable wrappers. Some panels are fully rebuilt after every click,
 // so we never keep references to old buttons.
 window.safeOpenSection=function(sec){
   current=sec;
   const p=document.getElementById("panel");
   if(!p)return;
   if(sec==="map"){
     p.classList.add("hidden");
   }else{
     p.classList.remove("hidden");
     renderSection();
   }
   syncMainNav();
   setTimeout(()=>{try{map.invalidateSize({pan:false,animate:false})}catch(e){}},50);
 };

 // Delegated fallback for sidebar navigation. It still works after rerenders.
 

 // If an exception occurs in an inline tab handler, use the visible tab label
 // to switch the correct state anyway.
 document.addEventListener("click",function(e){
   const b=e.target.closest(".tab");
   if(!b)return;
   const oc=b.getAttribute("onclick")||"";
   let m=oc.match(/setLogTab\(['"]([^'"]+)/);
   if(m){e.preventDefault();window.logisticsTab=m[1];renderSection();return}
   m=oc.match(/setEmployeeTab\(['"]([^'"]+)/);
   if(m){e.preventDefault();window.employeeTab=m[1];renderSection();return}
   m=oc.match(/setCompanyTab\(['"]([^'"]+)/);
   if(m){e.preventDefault();window.companyTab=m[1];renderSection();return}
 },true);

 window.addEventListener("error",function(ev){
   console.error("Błąd interfejsu:",ev.error||ev.message);
 });
 setTimeout(syncMainNav,100);
})();
</script>

<script>
/* ===== FINANSE + MENU FIX v12 ===== */
(function(){
 function hideStoreDesign(){
   document.querySelectorAll("button.nav").forEach(b=>{
     const t=(b.textContent||"").toLowerCase();
     const oc=(b.getAttribute("onclick")||"").toLowerCase();
     if(t.includes("projekt sklepu")||t.includes("planogram")||t.includes("układ sklepu")||
        oc.includes("'design'")||oc.includes("'layout'")||oc.includes("'planogram'")){
       b.remove();
     }
   });
 }

 // Finanse mają działać przez oryginalny openSection().
 // Ten kod tylko naprawia ewentualny przycisk po ponownym renderowaniu menu.
 function fixFinanceButton(){
   document.querySelectorAll("button.nav").forEach(b=>{
     const txt=(b.textContent||"").toLowerCase();
     if(txt.includes("finanse")){
       b.onclick=function(){
         current="finance";
         const p=document.getElementById("panel");
         if(p){
           p.classList.remove("hidden");
           renderSection();
         }
         document.querySelectorAll(".nav").forEach(x=>x.classList.remove("active"));
         b.classList.add("active");
       };
       b.removeAttribute("onclick");
     }
   });
 }

 function fixMenu(){
   hideStoreDesign();
   fixFinanceButton();
 }
 if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",fixMenu);
 else fixMenu();
 new MutationObserver(fixMenu).observe(document.body,{childList:true,subtree:true});

<script>
(function(){
 const S=window.SIM2=window.SIM2||{
   ui:"calendar",weather:{},taxRates:{Polska:19,Niemcy:15.8,Niderlandy:25.8,Belgia:25,Francja:25,Czechy:21},
   tenders:[],events:[],marketing:[],competitorAI:true,lastDayKey:""
 };
 const stores2=()=>Array.isArray(window.stores)?stores:[];
 const centers2=()=>Array.isArray(window.centers)?centers:[];
 const trucks2=()=>Array.isArray(window.trucks)?trucks:[];
 const money2=n=>{try{return cash(n)}catch(e){return Math.round(Number(n)||0).toLocaleString("pl-PL")+" zł"}};
 const esc2=s=>{try{return esc(s)}catch(e){return String(s||"")}};

 function dateKey(){return `${window.year||1}-${window.month||1}-${window.day||1}`}
 function season(){
   const m=Number(window.month||1);
   if([12,1,2].includes(m))return "❄️ Zima";
   if([3,4,5].includes(m))return "🌱 Wiosna";
   if([6,7,8].includes(m))return "☀️ Lato";
   return "🍂 Jesień";
 }
 function weekday(){
   const names=["Poniedziałek","Wtorek","Środa","Czwartek","Piątek","Sobota","Niedziela"];
   const d=Math.max(1,Number(window.day||1)),m=Math.max(1,Number(window.month||1)),y=Math.max(1,Number(window.year||1));
   return names[(d+(m-1)*30+(y-1)*360-1)%7];
 }
 function allCountries(){return [...new Set(stores2().map(s=>s.country).filter(Boolean))]}
 function weatherFor(country){
   if(!S.weather[country]) S.weather[country]={type:"☁️ Pochmurno",temp:12,delay:0};
   return S.weather[country];
 }
 function rollWeather(){
   const opts=[
     ["☀️ Słonecznie",24,0],["☁️ Pochmurno",13,0],["🌧️ Deszcz",9,0.08],
     ["🌬️ Wiatr",8,0.05],["❄️ Śnieg",-3,0.18],["🔥 Upał",32,0.03]
   ];
   allCountries().forEach(c=>{
     const x=opts[Math.floor(Math.random()*opts.length)];
     S.weather[c]={type:x[0],temp:x[1]+Math.round(Math.random()*6-3),delay:x[2]};
   });
 }
 function createTender(){
   const names=["Baltic Supply","EuroFoods","FreshWay","Nord Distribution","Central Trade"];
   const t={id:Date.now(),supplier:names[Math.floor(Math.random()*names.length)],
     price:80+Math.round(Math.random()*35),quality:60+Math.round(Math.random()*40),
     speed:1+Math.floor(Math.random()*4),days:10};
   S.tenders.unshift(t);S.tenders=S.tenders.slice(0,8);renderSim2();
 }
 function acceptTender(id){
   const t=S.tenders.find(x=>x.id===id);if(!t)return;
   S.activeTender=t;S.tenders=S.tenders.filter(x=>x.id!==id);renderSim2();
 }
 function marketing(){
   const cost=Number(prompt("Budżet kampanii:",100000));if(!cost||cost<=0)return;
   if(Number(window.money||0)<cost)return alert("Za mało gotówki.");
   try{changeMoney(-cost)}catch(e){window.money-=cost}
   S.marketing.push({id:Date.now(),budget:cost,days:30,boost:Math.min(.25,.04+cost/2000000)});
   renderSim2();
 }
 function randomEvent(){
   const pool=[
    ["📈 Rekordowy weekend sprzedaży",75000],
    ["⚡ Wzrost cen energii",-60000],
    ["🚛 Opóźnienia u dostawców",-45000],
    ["🎉 Udana kampania marki",90000],
    ["🏭 Awaria dostawcy",-80000]
   ];
   const x=pool[Math.floor(Math.random()*pool.length)];
   S.events.unshift({text:x[0],value:x[1],date:dateKey()});
   S.events=S.events.slice(0,10);
   try{changeMoney(x[1])}catch(e){window.money+=x[1]}
 }
 function daily(){
   const k=dateKey();if(S.lastDayKey===k)return;S.lastDayKey=k;
   rollWeather();
   S.marketing.forEach(x=>x.days--);S.marketing=S.marketing.filter(x=>x.days>0);
   S.tenders.forEach(x=>x.days--);S.tenders=S.tenders.filter(x=>x.days>0);
   if(Math.random()<.08)randomEvent();
   if(Math.random()<.05)createTender();

   // Prosta sezonowość i marketing wpływają na zapamiętany mnożnik popytu sklepu.
   const m=Number(window.month||1), weekend=["Sobota","Niedziela"].includes(weekday());
   const campaign=S.marketing.reduce((a,x)=>a+x.boost,0);
   stores2().forEach(st=>{
     const w=weatherFor(st.country);
     let mult=1+(weekend?.10:0)+campaign;
     if([6,7,8].includes(m))mult+=.06;
     if(w.type.includes("Upał"))mult+=.08;
     if(w.type.includes("Śnieg"))mult-=.05;
     st.simDemandMultiplier=Math.max(.7,Math.min(1.5,mult));
   });
 }
 function pnl(){
   const revenue=stores2().reduce((a,s)=>a+Number(s.dailyRevenue||0),0);
   const cogs=stores2().reduce((a,s)=>a+Number(s.dailyCOGS||0),0);
   const wages=(Array.isArray(window.employees)?employees.length:0)*25000/30+(Array.isArray(window.drivers)?drivers.length:0)*25000/30;
   const fuel=trucks2().length*(Number(window.fuelPrice||6.5))*35;
   const marketingCost=S.marketing.reduce((a,x)=>a+x.budget/30,0);
   const ebitda=revenue-cogs-wages-fuel-marketingCost;
   return {revenue,cogs,wages,fuel,marketingCost,ebitda};
 }
 function calendarUI(){
   return `<div class="sim2-grid">
    <div class="sim2-card"><small>Data</small><div class="sim2-big">${window.day||1}.${window.month||1}.${window.year||1}</div><b>${weekday()}</b></div>
    <div class="sim2-card"><small>Sezon</small><div class="sim2-big">${season()}</div></div>
    <div class="sim2-card"><small>Aktywne kampanie</small><div class="sim2-big">${S.marketing.length}</div></div>
    <div class="sim2-card"><small>Przetargi</small><div class="sim2-big">${S.tenders.length}</div></div>
   </div>
   <button onclick="SIM2API.marketing()">📣 Uruchom kampanię</button>
   <button onclick="SIM2API.createTender()">📑 Nowy przetarg</button>`;
 }
 function weatherUI(){
   const cs=allCountries();
   return cs.map(c=>{const w=weatherFor(c);return `<div class="sim2-card"><b>🌍 ${esc2(c)}</b><div class="sim2-big">${w.type} ${w.temp}°C</div><small>Ryzyko opóźnienia dostaw: ${Math.round(w.delay*100)}%</small></div>`}).join("")||"<div class='empty'>Brak krajów ze sklepami.</div>";
 }
 function pnlUI(){
   const p=pnl();
   return `<div class="sim2-card">
    <div class="row"><span>Przychód sklepów / dzień</span><b>${money2(p.revenue)}</b></div>
    <div class="row"><span>Koszt towaru</span><b>-${money2(p.cogs)}</b></div>
    <div class="row"><span>Wynagrodzenia / dzień</span><b>-${money2(p.wages)}</b></div>
    <div class="row"><span>Paliwo / dzień</span><b>-${money2(p.fuel)}</b></div>
    <div class="row"><span>Marketing / dzień</span><b>-${money2(p.marketingCost)}</b></div>
    <hr><div class="row"><span>EBITDA uproszczona</span><b class="${p.ebitda>=0?"sim2-good":"sim2-bad"}">${money2(p.ebitda)}</b></div>
   </div>
   <div class="sim2-card"><b>💸 Podatki</b>${allCountries().map(c=>`<div class="row"><span>${esc2(c)}</span><b>${S.taxRates[c]??20}%</b></div>`).join("")}</div>`;
 }
 function tendersUI(){
   return `<button onclick="SIM2API.createTender()">＋ Wygeneruj ofertę</button>`+
    (S.activeTender?`<div class="sim2-card"><b>✅ Aktywny dostawca: ${esc2(S.activeTender.supplier)}</b><div>Cena indeks: ${S.activeTender.price} • jakość ${S.activeTender.quality}% • dostawa ${S.activeTender.speed} dni</div></div>`:"")+
    S.tenders.map(t=>`<div class="sim2-card"><b>${esc2(t.supplier)}</b><div>Cena: ${t.price} • jakość: ${t.quality}% • ${t.speed} dni</div><button onclick="SIM2API.acceptTender(${t.id})">Wybierz ofertę</button></div>`).join("");
 }
 function eventsUI(){
   return S.events.map(e=>`<div class="sim2-card"><b>${esc2(e.text)}</b><div>${e.date} • ${e.value>=0?"+":""}${money2(e.value)}</div></div>`).join("")||"<div class='empty'>Brak ostatnich wydarzeń.</div>";
 }
 function renderSim2(){
   const root=document.getElementById("sim2root");if(!root)return;
   const tabs=[["calendar","📅 Kalendarz"],["weather","🌦️ Pogoda"],["pnl","📊 P&L"],["tenders","📑 Dostawcy"],["events","📰 Wydarzenia"]];
   root.innerHTML=`<div class="sim2-tabs">${tabs.map(([k,n])=>`<button onclick="SIM2API.tab('${k}')">${n}</button>`).join("")}</div>`+
    ({calendar:calendarUI,weather:weatherUI,pnl:pnlUI,tenders:tendersUI,events:eventsUI}[S.ui]||calendarUI)();
 }
 window.SIM2API={tab(k){S.ui=k;renderSim2()},render:renderSim2,marketing,createTender,acceptTender};
 let oldKey="";
 setInterval(()=>{const k=dateKey();if(k!==oldKey){oldKey=k;daily();renderSim2()}},800);
})();
</script>


<script>
(function(){

   <h3>⚠️ Do sprawdzenia</h3>

 const names=["Jan Kowalski","Anna Nowak","Marek Wiśniewski","Julia Wójcik","Piotr Kamiński","Oliwia Lewandowska","Kamil Zieliński","Natalia Szymańska","Tomasz Woźniak","Zuzanna Dąbrowska"];

 function franchiseStores(p){return fs().filter(s=>String(s.franchiseeId)===String(p.id))}
 function getP(id){return F.people.find(p=>String(p.id)===String(id))}
 function newPerson(country){
   return {
    id:F.nextId++, name:names[Math.floor(Math.random()*names.length)],
    country:country||"Polska", cash:350000+Math.round(Math.random()*1150000),
    experience:20+Math.round(Math.random()*75), rating:55+Math.round(Math.random()*40),
    debt:0, totalPaid:0, employees:0, active:true
   };
 }
 function chooseFranchisee(store){
   // Jeden franczyzobiorca może mieć wiele sklepów.
   // Preferujemy istniejącego operatora z tego samego kraju, jeśli ma dobrą ocenę.
   const candidates=F.people.filter(p=>p.active && p.country===(store.country||"Polska") && p.rating>=60);
   candidates.sort((a,b)=>{
     const ac=franchiseStores(a).length, bc=franchiseStores(b).length;
     return (b.rating-bc*4)-(a.rating-ac*4);
   });
   if(candidates.length && Math.random()<0.72)return candidates[0];
   const p=newPerson(store.country||"Polska");F.people.push(p);return p;
 }
 function assignStore(store){
   if(!store || store.franchiseeId!=null || store.ownership==="company")return;
   const p=chooseFranchisee(store);
   store.franchiseeId=p.id;
   store.ownership="franchise";
   store.franchiseSince=`${window.day||1}.${window.month||1}.${window.year||1}`;
   store.franchiseStaff=0;
   hireForStore(store,p);
 }
 function hireForStore(store,p){
   // Franczyzobiorca sam ustala obsadę na podstawie ruchu/sprzedaży.
   const customers=Math.max(20,Number(store.customers||80));
   const target=Math.max(2,Math.min(12,Math.ceil(customers/55)));
   store.franchiseStaff=target;
 }
 function scanNewStores(){
   if(!F.autoAssign)return;
   fs().forEach(s=>{
     // Nowy sklep bez właściciela operacyjnego automatycznie dostaje franczyzobiorcę.
     if(s.franchiseeId==null && s.ownership!=="company" && !s.forceCompanyOwned)assignStore(s);
   });
 }
 function daily(){
   scanNewStores();
   F.people.forEach(p=>{
     const list=franchiseStores(p);
     p.employees=0;
     list.forEach(s=>{
       hireForStore(s,p);
       p.employees+=Number(s.franchiseStaff||0);
       const revenue=Math.max(0,Number(s.dailyRevenue||0));
       const profit=Number(s.lastStoreProfit||0);
       const payroll=Number(s.franchiseStaff||0)*25000/30;
       const royalty=Math.max(0,revenue*F.royaltyRate);
       p.cash += profit-payroll-royalty;
       p.totalPaid += royalty;
       // Opłata franczyzowa trafia do grupy codziennie proporcjonalnie.
       try{changeMoney(royalty)}catch(e){window.money=(window.money||0)+royalty}
       s.lastFranchiseRoyalty=royalty;
     });
     // Operator może mieć kilka sklepów; dobra ocena i gotówka zwiększają jego zdolność rozwoju.
     if(p.cash<0){p.rating=Math.max(0,p.rating-1)}
     else if(list.length>0){p.rating=Math.min(100,p.rating+0.03)}
   });
 }
 function takeOver(storeId){
   const s=fs().find(x=>String(x.id)===String(storeId));if(!s)return;
   s.franchiseeId=null;s.ownership="company";s.forceCompanyOwned=true;s.franchiseStaff=0;
   renderF();
 }
 function returnToFranchise(storeId){
   const s=fs().find(x=>String(x.id)===String(storeId));if(!s)return;
   s.ownership="franchise";s.forceCompanyOwned=false;s.franchiseeId=null;assignStore(s);renderF();
 }
 function settings(){
   const r=Number(prompt("Royalty od obrotu (%)",Math.round(F.royaltyRate*100)));
   if(Number.isFinite(r)&&r>=0&&r<=30)F.royaltyRate=r/100;
   renderF();
 }
 function renderF(){
   const root=document.getElementById("franchise2root");if(!root)return;
   scanNewStores();
   const franchised=fs().filter(s=>s.franchiseeId!=null);
   const totalStaff=F.people.reduce((a,p)=>a+Number(p.employees||0),0);
   const today=franchised.reduce((a,s)=>a+Number(s.lastFranchiseRoyalty||0),0);
   root.innerHTML=`
    <div class="fr2-grid">
     <div class="fr2-card"><small>Franczyzobiorcy</small><h3>${F.people.filter(p=>p.active).length}</h3></div>
     <div class="fr2-card"><small>Sklepy franczyzowe</small><h3>${franchised.length}</h3></div>
     <div class="fr2-card"><small>Pracownicy franczyzobiorców</small><h3>${totalStaff}</h3></div>
     <div class="fr2-card"><small>Royalty dzisiaj</small><h3>${fmt(today)}</h3></div>
    </div>
    <div class="fr2-card"><b>⚙️ Zasady</b>
      <div>Nowy sklep: <b>automatyczne znalezienie franczyzobiorcy</b></div>
      <div>Royalty: <b>${Math.round(F.royaltyRate*100)}% obrotu</b></div>
      <div>Jeden franczyzobiorca może prowadzić <b>wiele sklepów</b>.</div>
      <div>Franczyzobiorcy <b>sami zatrudniają pracowników</b> i płacą ich pensje.</div>
      <button onclick="FR2.settings()">⚙️ Zmień royalty</button>
    </div>
    <h3>👤 Operatorzy franczyzowi</h3>
    ${F.people.filter(p=>p.active).map(p=>{
      const list=franchiseStores(p);
      return `<div class="fr2-card"><b>${p.name}</b> <span class="badge ok">⭐ ${Math.round(p.rating)}</span>
       <div>${p.country} • kapitał ${fmt(p.cash)} • doświadczenie ${p.experience}/100</div>
       <div><b>${list.length}</b> sklepów • <b>${p.employees}</b> pracowników • wpłacono grupie ${fmt(p.totalPaid)}</div>
       ${list.map(s=>`<div class="card"><b>🏪 ${s.name||("Sklep #"+s.id)}</b>
         <div>Obsada: ${s.franchiseStaff||0} • royalty dziś: ${fmt(s.lastFranchiseRoyalty||0)}</div>
         <button onclick="FR2.takeOver('${s.id}')">🏢 Przejmij jako własny</button>
       </div>`).join("")}
      </div>`;
    }).join("")||"<div class='empty'>Postaw sklep — system automatycznie znajdzie pierwszego franczyzobiorcę.</div>"}
    <h3>🏢 Sklepy własne</h3>
    ${fs().filter(s=>s.ownership==="company").map(s=>`<div class="fr2-card"><b>${s.name||("Sklep #"+s.id)}</b>
      <button onclick="FR2.returnToFranchise('${s.id}')">🤝 Przekaż franczyzobiorcy</button></div>`).join("")||"<div class='empty'>Brak sklepów własnych.</div>"}`;
 }
 window.FR2={render:renderF,settings,takeOver,returnToFranchise,assignStore};

 // Obserwujemy liczbę sklepów: po postawieniu nowego sklepu od razu pojawia się operator.
 let storeCount=fs().length;
 setInterval(()=>{
   if(fs().length!==storeCount){storeCount=fs().length;scanNewStores();renderF()}
   const k=`${window.year||0}-${window.month||0}-${window.day||0}`;
   if(F.lastDay!==k){F.lastDay=k;daily();renderF()}
 },700);
})();
</script>


<style>
.fr3tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.fr3card{background:#142019;border:1px solid #30453a;border-radius:10px;padding:10px;margin:7px 0}
.fr3grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.fr3warn{color:#ffd36d}.fr3bad{color:#ff8b8b}.fr3good{color:#7be293}
</style>
<script>
(function(){
 const X=window.FRANCHISE3=window.FRANCHISE3||{
   ui:"operators", applications:[], inspections:[], contracts:{},
   auto:{enabled:false,minRating:80,minCash:500000,maxStores:8},
   lastMonth:"", lastApplicationDay:""
 };
 const F=window.FRANCHISE2;
 const ss=()=>Array.isArray(window.stores)?stores:[];
 const people=()=>F?.people||[];
 const fmt=n=>Math.round(Number(n)||0).toLocaleString("pl-PL")+" zł";
 const pStores=p=>ss().filter(s=>String(s.franchiseeId)===String(p.id));
 const getP=id=>people().find(p=>String(p.id)===String(id));

 function contract(p){
   if(!X.contracts[p.id])X.contracts[p.id]={
     entryFee:50000,monthlyFee:2500,royalty:Number(F?.royaltyRate||.06),
     years:5,qualityMin:65
   };
   return X.contracts[p.id];
 }
 function scoreStore(s,p){
   let score=70;
   score+=Math.min(15,Number(p.rating||0)/10);
   if(Number(s.lastStoreProfit||0)>0)score+=8;else score-=10;
   if(Number(s.franchiseStaff||0)>=2)score+=5;else score-=12;
   score+=Math.round(Math.random()*10-5);
   return Math.max(0,Math.min(100,Math.round(score)));
 }
 function inspect(id){
   const p=getP(id);if(!p)return;
   const list=pStores(p);if(!list.length)return;
   let avg=0;
   list.forEach(s=>{s.franchiseQuality=scoreStore(s,p);avg+=s.franchiseQuality});
   avg=Math.round(avg/list.length);
   X.inspections.unshift({id:Date.now(),pId:p.id,score:avg,date:`${window.day||1}.${window.month||1}.${window.year||1}`});
   X.inspections=X.inspections.slice(0,30);
   if(avg<contract(p).qualityMin)p.rating=Math.max(0,p.rating-6);
   else p.rating=Math.min(100,p.rating+2);
   render();
 }
 function application(){
   const active=people().filter(p=>p.active);
   if(!active.length)return;
   const p=active[Math.floor(Math.random()*active.length)];
   if(pStores(p).length>=12)return;
   const cities=["Warszawa","Kraków","Gdańsk","Poznań","Wrocław","Łódź","Rotterdam","Amsterdam","Antwerpia","Berlin","Praga"];
   X.applications.push({
     id:Date.now()+Math.random(),pId:p.id,city:cities[Math.floor(Math.random()*cities.length)],
     country:p.country||"Polska",investment:250000+Math.round(Math.random()*450000),status:"pending"
   });
   autoProcess();
 }
 function autoProcess(){
   if(!X.auto.enabled)return;
   X.applications.filter(a=>a.status==="pending").forEach(a=>{
     const p=getP(a.pId);if(!p)return;
     if(p.rating>=X.auto.minRating && p.cash>=X.auto.minCash && pStores(p).length<X.auto.maxStores)approve(a.id);
   });
 }
 function approve(id){
   const a=X.applications.find(x=>String(x.id)===String(id));if(!a||a.status!=="pending")return;
   const p=getP(a.pId);if(!p)return;
   a.status="approved";
   // Jeśli gra ma funkcję budowania sklepu, nie zgadujemy jej API.
   // Tworzymy zatwierdzony projekt, który operator finansuje; sklep pojawi się po standardowym postawieniu.
   p.approvedExpansion=(p.approvedExpansion||0)+1;
   p.cash-=Math.min(p.cash,a.investment*.25);
   render();
 }
 function reject(id){const a=X.applications.find(x=>String(x.id)===String(id));if(a)a.status="rejected";render()}
 function loan(id){
   const p=getP(id);if(!p)return;
   const amount=Math.min(1000000,Math.max(100000,Number(prompt("Kwota kredytu franczyzobiorcy:",300000))||0));
   if(!amount)return;
   p.cash+=amount;p.debt=(p.debt||0)+amount*1.08;render();
 }
 function monthly(){
   people().forEach(p=>{
     if(!p.active)return;
     const c=contract(p), list=pStores(p);
     const fees=list.length*c.monthlyFee;
     p.cash-=fees;
     try{changeMoney(fees)}catch(e){window.money=(window.money||0)+fees}
     if(p.debt>0){
       const pay=Math.min(p.cash*.08,p.debt,30000);
       if(pay>0){p.cash-=pay;p.debt-=pay}
     }
     if(p.cash < -150000){
       p.active=false;
       list.forEach(s=>{s.franchiseeId=null;s.ownership="company";s.forceCompanyOwned=true});
     }
   });
 }
 function setContract(id){
   const p=getP(id);if(!p)return;const c=contract(p);
   const fee=Number(prompt("Miesięczna opłata franczyzowa:",c.monthlyFee));
   const roy=Number(prompt("Royalty od obrotu (%):",Math.round(c.royalty*100)));
   const q=Number(prompt("Minimalna ocena jakości:",c.qualityMin));
   if(Number.isFinite(fee)&&fee>=0)c.monthlyFee=fee;
   if(Number.isFinite(roy)&&roy>=0&&roy<=30)c.royalty=roy/100;
   if(Number.isFinite(q)&&q>=0&&q<=100)c.qualityMin=q;
   render();
 }
 function toggleAuto(){X.auto.enabled=!X.auto.enabled;autoProcess();render()}
 function operatorsUI(){
   return people().filter(p=>p.active).map(p=>{
     const c=contract(p),list=pStores(p),quality=list.length?Math.round(list.reduce((a,s)=>a+Number(s.franchiseQuality||70),0)/list.length):0;
     return `<div class="fr3card"><b>👤 ${p.name}</b> <span class="badge ok">⭐ ${Math.round(p.rating)}</span>
      <div class="row"><span>Sklepy / pracownicy</span><b>${list.length} / ${p.employees||0}</b></div>
      <div class="row"><span>Kapitał / zadłużenie</span><b>${fmt(p.cash)} / ${fmt(p.debt||0)}</b></div>
      <div class="row"><span>Jakość sieci</span><b>${quality||"—"}</b></div>
      <div class="row"><span>Umowa</span><b>${Math.round(c.royalty*100)}% + ${fmt(c.monthlyFee)}/mies.</b></div>
      <button onclick="FR3.inspect('${p.id}')">⭐ Kontrola jakości</button>
      <button onclick="FR3.contract('${p.id}')">📋 Umowa</button>
      <button onclick="FR3.loan('${p.id}')">🏦 Kredyt</button>
     </div>`;
   }).join("")||"<div class='empty'>Brak aktywnych franczyzobiorców.</div>";
 }
 function applicationsUI(){
   return `<div class="fr3card"><b>🤖 Autopilot centrali</b><div>Automatyczna akceptacja: <b>${X.auto.enabled?"WŁĄCZONA":"WYŁĄCZONA"}</b></div>
    <div>Warunki: ocena ≥ ${X.auto.minRating}, kapitał ≥ ${fmt(X.auto.minCash)}, maks. ${X.auto.maxStores} sklepów/operator</div>
    <button onclick="FR3.toggleAuto()">${X.auto.enabled?"Wyłącz":"Włącz"} autopilot</button>
    <button onclick="FR3.application()">＋ Wygeneruj wniosek</button></div>`+
   X.applications.slice().reverse().map(a=>{const p=getP(a.pId);return `<div class="fr3card"><b>📍 ${a.city}, ${a.country}</b>
    <div>${p?.name||"Operator"} chce otworzyć kolejny sklep • inwestycja ${fmt(a.investment)}</div>
    <div>Status: <b>${a.status}</b></div>
    ${a.status==="pending"?`<button onclick="FR3.approve('${a.id}')">✅ Zatwierdź</button><button onclick="FR3.reject('${a.id}')">❌ Odrzuć</button>`:""}
   </div>`}).join("");
 }
 function inspectionsUI(){
   return X.inspections.map(i=>{const p=getP(i.pId);return `<div class="fr3card"><b>${p?.name||"Operator"}</b><span class="badge ${i.score>=65?"ok":"bad"}">${i.score}/100</span><div>${i.date}</div></div>`}).join("")||"<div class='empty'>Brak kontroli.</div>";
 }
 function risksUI(){
   const risk=people().filter(p=>p.active).sort((a,b)=>(a.cash-a.debt)-(b.cash-b.debt));
   return risk.map(p=>`<div class="fr3card"><b>${p.name}</b>
    <div class="${p.cash-p.debt<0?"fr3bad":"fr3good"}">Kapitał netto: ${fmt(p.cash-p.debt)}</div>
    <div>${pStores(p).length} sklepów • dług ${fmt(p.debt||0)}</div>
    ${p.cash<0?`<div class="fr3warn">⚠️ Operator ma problemy z płynnością. Przy dużej stracie jego sklepy przejmie centrala.</div>`:""}
   </div>`).join("");
 }
 function render(){
   const root=document.getElementById("franchise3root");if(!root)return;
   const tabs=[["operators","👥 Operatorzy"],["applications","📍 Wnioski o sklepy"],["inspections","⭐ Kontrole"],["risks","🏦 Ryzyko"]];
   root.innerHTML=`<div class="fr3tabs">${tabs.map(([k,n])=>`<button onclick="FR3.tab('${k}')">${n}</button>`).join("")}</div>`+
    ({operators:operatorsUI,applications:applicationsUI,inspections:inspectionsUI,risks:risksUI}[X.ui]||operatorsUI)();
 }
 window.FR3={render,tab(k){X.ui=k;render()},inspect,contract:setContract,loan,application,approve,reject,toggleAuto};
 let lastDay="";
 setInterval(()=>{
   const dk=`${window.year||0}-${window.month||0}-${window.day||0}`;
   if(dk!==lastDay){lastDay=dk;if(Math.random()<.07)application()}
   const mk=`${window.year||0}-${window.month||0}`;
   if(mk!==X.lastMonth){if(X.lastMonth)monthly();X.lastMonth=mk}
 },900);
})();
</script>


<script>
(function(){
 const A=window.FRANCHISE_AI_FULL=window.FRANCHISE_AI_FULL||{managers:{},lossDays:{},orders:{},lastDay:""};
 const storesA=()=>Array.isArray(window.stores)?stores:[];
 const peopleA=()=>window.FRANCHISE2?.people||[];

 function enrichPeople(){
   peopleA().forEach(p=>{
     if(p.riskTolerance==null)p.riskTolerance=20+Math.round(Math.random()*80);
     if(p.managementQuality==null)p.managementQuality=45+Math.round(Math.random()*50);
   });
 }

 function ownStoreManager(s){
   if(!A.managers[s.id]){
     A.managers[s.id]={
       name:["Anna Mazur","Marek Lis","Julia Król","Kamil Nowak","Oliwia Wójcik"][Math.floor(Math.random()*5)],
       quality:55+Math.round(Math.random()*40),
       staff:2,
       budget:125000
     };
   }
   const m=A.managers[s.id];
   const target=Math.max(2,Math.min(14,Math.ceil(Number(s.customers||70)/50)));
   m.staff=target;
   s.companyManagedStaff=target;
 }

 function autoOrder(s){
   const sales=Math.max(0,Number(s.dailyRevenue||0));
   const desired=Math.max(40,Math.round(sales/120));
   const stock=Number(s.stock||s.inventory||0);
   if(stock<desired*.45){
     A.orders[s.id]={qty:Math.max(20,desired-stock),status:"oczekuje na logistykę",day:window.day||1};
     // Istniejący system logistyczny nadal wybiera centrum/ciężarówkę.
     s.autoOrderQty=A.orders[s.id].qty;
     s.needsDelivery=true;
   }
 }

 function franchiseCosts(s,p){
   const staff=Number(s.franchiseStaff||0);
   const payroll=staff*25000/30;
   const rent=Number(s.rentDaily||s.rent||4500/30);
   const operating=Math.max(250,Number(s.dailyRevenue||0)*.025);
   p.lastPayroll=(p.lastPayroll||0)+payroll;
   p.lastRent=(p.lastRent||0)+rent;
   p.lastOperating=(p.lastOperating||0)+operating;
   p.cash-=rent+operating;
 }

 function lossAI(s,p){
   const loss=Number(s.lastStoreProfit||0)<0;
   A.lossDays[s.id]=loss?(A.lossDays[s.id]||0)+1:Math.max(0,(A.lossDays[s.id]||0)-2);
   const d=A.lossDays[s.id];

   // Najpierw próba naprawy: zwiększenie jakości zarządzania / ograniczenie kosztów.
   if(d===14){
     p.managementQuality=Math.min(100,p.managementQuality+4);
     s.franchiseRecovery=true;
   }
   // Dopiero długotrwała strata może zamknąć sklep.
   if(d>=45 && Number(p.riskTolerance||50)<70){
     s.closed=true;
     s.franchiseClosedReason="Długotrwała nierentowność";
     s.franchiseeId=null;
     s.ownership="closed";
   }
 }

 function day(){
   enrichPeople();
   peopleA().forEach(p=>{p.lastPayroll=0;p.lastRent=0;p.lastOperating=0});
   storesA().forEach(s=>{
     if(s.closed)return;
     if(s.franchiseeId!=null){
       const p=peopleA().find(x=>String(x.id)===String(s.franchiseeId));
       if(p){franchiseCosts(s,p);autoOrder(s);lossAI(s,p)}
     }else if(s.ownership==="company"||s.forceCompanyOwned){
       ownStoreManager(s);autoOrder(s);
     }
   });
 }

 window.FRANCHISE_AI_API={
   enrich:enrichPeople,
   managerFor(id){return A.managers[id]},
   orderFor(id){return A.orders[id]}
 };

 let k="";
 setInterval(()=>{
   const n=`${window.year||0}-${window.month||0}-${window.day||0}`;
   if(n!==k){k=n;day()}
 },850);
})();
</script>


<style>
.subcountries-list{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.subcountry-chip{display:inline-flex;align-items:center;gap:6px;background:#1a2a21;border:1px solid #385345;border-radius:999px;padding:6px 9px}
