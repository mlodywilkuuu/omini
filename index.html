<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ropucha Market Simulator</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#101510;
  color:white;
  overflow:hidden;
  user-select:none;
}
button{font:inherit}

#game{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
}

/* =========================
   MAPA
========================= */

#world{
  position:absolute;
  width:2200px;
  height:1600px;
  left:0;
  top:0;
  background:
    linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
    #72a856;
  background-size:50px 50px;
}

.road{
  position:absolute;
  background:#444;
  border:5px solid #555;
}

#road1{
  left:0;
  top:700px;
  width:2200px;
  height:250px;
}

#road2{
  left:950px;
  top:0;
  width:260px;
  height:1600px;
}

.roadLine{
  position:absolute;
  background:#ddd;
}

.tree{
  position:absolute;
  width:45px;
  height:45px;
  border-radius:50%;
  background:#276c35;
  border:6px solid #174523;
  box-shadow:0 10px 0 rgba(0,0,0,.12);
}

.house{
  position:absolute;
  width:150px;
  height:120px;
  background:#d9b37b;
  border:8px solid #7d5d3d;
}

.house:before{
  content:"";
  position:absolute;
  left:-15px;
  top:-35px;
  width:165px;
  height:40px;
  background:#8e3f35;
  border:6px solid #642b25;
}

.parking{
  position:absolute;
  width:500px;
  height:350px;
  background:#777;
  border:10px solid #555;
}

/* =========================
   SKLEPY / BUDYNKI
========================= */

.store{
  position:absolute;
  width:380px;
  height:300px;
  background:#eee1bf;
  border:12px solid #333;
  box-shadow:0 15px 30px rgba(0,0,0,.35);
}

.storeSign{
  position:absolute;
  top:12px;
  left:15px;
  padding:7px 13px;
  background:#176c37;
  border-radius:5px;
  font-weight:900;
  letter-spacing:1px;
}

.storeDoor{
  position:absolute;
  bottom:-12px;
  left:145px;
  width:70px;
  height:45px;
  background:#80d8ff;
  border:6px solid #333;
}

.counter{
  position:absolute;
  right:25px;
  bottom:35px;
  width:120px;
  height:50px;
  background:#176c37;
  border:5px solid #0d4824;
}

.register{
  position:absolute;
  top:-27px;
  left:15px;
  width:45px;
  height:32px;
  background:#222;
  border:4px solid #111;
}

.shelf{
  position:absolute;
  width:130px;
  height:38px;
  background:#555;
  border:5px solid #333;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.product{
  width:15px;
  height:23px;
  border-radius:3px;
}

.red{background:#d83b3b}
.blue{background:#4aa5ef}
.yellow{background:#f0ca39}
.orange{background:#ef8529}

/* =========================
   GRACZ
========================= */

#player{
  position:absolute;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#3282e6;
  border:5px solid #174d91;
  z-index:30;
  box-shadow:0 7px 10px rgba(0,0,0,.25);
}

#player:after{
  content:"TY";
  position:absolute;
  width:100%;
  text-align:center;
  top:10px;
  font-size:10px;
  font-weight:bold;
}

/* =========================
   HUD
========================= */

#topHUD{
  position:fixed;
  left:50%;
  top:15px;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
  z-index:1000;
}

.hud{
  background:rgba(15,15,15,.94);
  border:2px solid #333;
  border-radius:10px;
  padding:8px 17px;
  min-width:115px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,.3);
}

.hud small{
  display:block;
  color:#999;
  font-size:10px;
  margin-bottom:3px;
  text-transform:uppercase;
}

.hud strong{
  font-size:19px;
}

#money{
  color:#63df72;
}

/* =========================
   ANIMACJA KASY
========================= */

.moneyAnimation{
  position:fixed;
  left:50%;
  top:85px;
  transform:translateX(-50%);
  font-size:27px;
  font-weight:900;
  z-index:3000;
  pointer-events:none;
  animation:moneyPop 1.4s forwards;
}

.moneyPlus{color:#6dff79}
.moneyMinus{color:#ff6565}

@keyframes moneyPop{
  0%{
    opacity:0;
    transform:translate(-50%,20px) scale(.7);
  }
  20%{
    opacity:1;
    transform:translate(-50%,0) scale(1.15);
  }
  70%{
    opacity:1;
  }
  100%{
    opacity:0;
    transform:translate(-50%,-45px) scale(.9);
  }
}

#money.flashPlus{
  animation:greenFlash .4s;
}

#money.flashMinus{
  animation:redFlash .4s;
}

@keyframes greenFlash{
  50%{color:white;transform:scale(1.25)}
}

@keyframes redFlash{
  50%{color:#ff4242;transform:scale(1.25)}
}

/* =========================
   BUILD MENU
========================= */

#buildMenu{
  position:fixed;
  left:20px;
  bottom:20px;
  width:260px;
  background:rgba(15,15,15,.95);
  border:2px solid #333;
  border-radius:12px;
  padding:14px;
  z-index:1000;
}

#buildMenu h3{
  margin-bottom:10px;
  color:#76e685;
}

.buildButton{
  width:100%;
  padding:10px;
  margin:4px 0;
  border:0;
  border-radius:7px;
  background:#292929;
  color:white;
  cursor:pointer;
  text-align:left;
}

.buildButton:hover{
  background:#3b3b3b;
}

.buildButton.selected{
  background:#176c37;
}

.buildButton span{
  float:right;
  color:#6ee77a;
}

/* =========================
   PRODUCT PANEL
========================= */

#productPanel{
  position:fixed;
  right:20px;
  top:100px;
  width:285px;
  background:rgba(15,15,15,.95);
  border:2px solid #333;
  border-radius:12px;
  padding:14px;
  z-index:1000;
}

#productPanel h3{
  margin-bottom:10px;
}

.productRow{
  background:#272727;
  margin:6px 0;
  padding:10px;
  border-radius:7px;
  cursor:pointer;
  position:relative;
}

.productRow:hover{
  background:#343434;
}

.productName{
  font-weight:bold;
}

.productPrice{
  float:right;
  color:#71e67d;
  font-weight:bold;
}

.oldPrice{
  color:#999;
  text-decoration:line-through;
  font-size:12px;
  margin-right:5px;
}

.promoBadge{
  display:inline-block;
  margin-top:5px;
  padding:3px 6px;
  border-radius:4px;
  background:#df3838;
  color:white;
  font-size:10px;
  font-weight:bold;
}

/* =========================
   NOTYFIKACJE
========================= */

#notifications{
  position:fixed;
  right:20px;
  bottom:20px;
  width:280px;
  z-index:2500;
}

.note{
  background:rgba(20,20,20,.96);
  border-left:5px solid #68df75;
  padding:11px;
  border-radius:6px;
  margin-top:7px;
  animation:noteIn .25s;
}

@keyframes noteIn{
  from{
    opacity:0;
    transform:translateX(60px);
  }
}

/* =========================
   BUILD PREVIEW
========================= */

#buildPreview{
  display:none;
  position:absolute;
  pointer-events:none;
  z-index:100;
  opacity:.65;
}

.previewStore{
  width:380px;
  height:300px;
  background:#e9dcb7;
  border:10px dashed white;
}

.previewParking{
  width:500px;
  height:350px;
  background:#777;
  border:10px dashed white;
}

.previewShelf{
  width:130px;
  height:40px;
  background:#555;
  border:5px dashed white;
}

/* =========================
   INFO
========================= */

#controls{
  position:fixed;
  left:20px;
  top:100px;
  background:rgba(0,0,0,.8);
  padding:10px 13px;
  border-radius:8px;
  font-size:12px;
  line-height:1.7;
  z-index:1000;
}

#modeText{
  color:#7bea87;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="game">

  <div id="world">

    <div class="road" id="road1"></div>
    <div class="road" id="road2"></div>

    <div class="parking" style="left:300px;top:300px"></div>

    <div class="house" style="left:100px;top:110px"></div>
    <div class="house" style="left:1600px;top:200px"></div>
    <div class="house" style="left:1800px;top:1100px"></div>

    <div class="tree" style="left:80px;top:500px"></div>
    <div class="tree" style="left:180px;top:570px"></div>
    <div class="tree" style="left:1450px;top:400px"></div>
    <div class="tree" style="left:1550px;top:500px"></div>
    <div class="tree" style="left:1700px;top:450px"></div>
    <div class="tree" style="left:350px;top:1200px"></div>
    <div class="tree" style="left:500px;top:1300px"></div>

    <div id="buildPreview"></div>

    <div id="player"></div>

  </div>

  <div id="topHUD">

    <div class="hud">
      <small>Kasa firmy</small>
      <strong id="money">25 000 zł</strong>
    </div>

    <div class="hud">
      <small>Dzień</small>
      <strong id="day">1</strong>
    </div>

    <div class="hud">
      <small>Godzina</small>
      <strong id="clock">08:00</strong>
    </div>

    <div class="hud">
      <small>Sklepy</small>
      <strong id="storeCount">0</strong>
    </div>

  </div>

  <div id="controls">
    WASD — poruszanie<br>
    B — tryb budowania<br>
    ESC — anuluj budowę<br>
    Kliknij mapę — postaw obiekt<br>
    <span id="modeText">TRYB: CHODZENIE</span>
  </div>

  <div id="buildMenu">

    <h3>🏗️ BUDOWA</h3>

    <button class="buildButton" data-build="store">
      🏪 Nowy sklep
      <span>5 000 zł</span>
    </button>

    <button class="buildButton" data-build="parking">
      🅿️ Parking
      <span>1 200 zł</span>
    </button>

    <button class="buildButton" data-build="shelf">
      🧃 Regał
      <span>350 zł</span>
    </button>

  </div>

  <div id="productPanel">

    <h3>🛒 Produkty</h3>

    <div id="productList"></div>

    <div style="font-size:11px;color:#999;margin-top:10px">
      Kliknij produkt, aby włączyć lub wyłączyć promocję.
    </div>

  </div>

  <div id="notifications"></div>

</div>

<script>

/* =====================================================
   GAME STATE
===================================================== */

let money = 25000;
let day = 1;
let gameMinutes = 8 * 60;

let playerX = 1050;
let playerY = 1000;

let buildMode = false;
let selectedBuild = null;

let stores = [];

const keys = {};

const world = document.getElementById("world");
const player = document.getElementById("player");
const moneyEl = document.getElementById("money");
const dayEl = document.getElementById("day");
const clockEl = document.getElementById("clock");
const storeCountEl = document.getElementById("storeCount");
const buildPreview = document.getElementById("buildPreview");
const modeText = document.getElementById("modeText");

/* =====================================================
   PRODUKTY
===================================================== */

const products = [
  {
    id:"cola",
    name:"🥤 Cola",
    price:6.99,
    promoPrice:4.99,
    promo:false
  },
  {
    id:"water",
    name:"💧 Woda",
    price:2.99,
    promoPrice:1.99,
    promo:false
  },
  {
    id:"chips",
    name:"🥔 Chipsy",
    price:7.49,
    promoPrice:5.49,
    promo:false
  },
  {
    id:"hotdog",
    name:"🌭 Hot-dog",
    price:8.99,
    promoPrice:5.99,
    promo:true
  },
  {
    id:"coffee",
    name:"☕ Kawa",
    price:9.99,
    promoPrice:6.99,
    promo:false
  },
  {
    id:"juice",
    name:"🧃 Sok",
    price:5.49,
    promoPrice:3.99,
    promo:false
  }
];

/* =====================================================
   CENY BUDOWY
===================================================== */

const buildPrices = {
  store:5000,
  parking:1200,
  shelf:350
};

/* =====================================================
   PLAYER
===================================================== */

player.style.left = playerX + "px";
player.style.top = playerY + "px";

document.addEventListener("keydown",e=>{

  keys[e.key.toLowerCase()] = true;

  if(e.key.toLowerCase() === "b"){
    buildMode = !buildMode;

    if(!buildMode){
      cancelBuild();
    }

    updateMode();
  }

  if(e.key === "Escape"){
    cancelBuild();
  }

});

document.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()] = false;
});

function playerLoop(){

  if(!buildMode){

    const speed = 5;

    if(keys["w"] || keys["arrowup"]) playerY -= speed;
    if(keys["s"] || keys["arrowdown"]) playerY += speed;
    if(keys["a"] || keys["arrowleft"]) playerX -= speed;
    if(keys["d"] || keys["arrowright"]) playerX += speed;

    playerX = Math.max(0,Math.min(2150,playerX));
    playerY = Math.max(0,Math.min(1550,playerY));

    player.style.left = playerX+"px";
    player.style.top = playerY+"px";

    camera();
  }

  requestAnimationFrame(playerLoop);
}

/* =====================================================
   CAMERA
===================================================== */

function camera(){

  const targetX =
    window.innerWidth/2 - playerX;

  const targetY =
    window.innerHeight/2 - playerY;

  const minX =
    window.innerWidth - 2200;

  const minY =
    window.innerHeight - 1600;

  const x =
    Math.min(0,Math.max(minX,targetX));

  const y =
    Math.min(0,Math.max(minY,targetY));

  world.style.left = x+"px";
  world.style.top = y+"px";
}

/* =====================================================
   BUILD SYSTEM
===================================================== */

document.querySelectorAll(".buildButton").forEach(button=>{

  button.addEventListener("click",e=>{

    e.stopPropagation();

    document
      .querySelectorAll(".buildButton")
      .forEach(b=>b.classList.remove("selected"));

    button.classList.add("selected");

    selectedBuild =
      button.dataset.build;

    buildMode = true;

    updatePreview();
    updateMode();

    notify(
      "Wybrano budowę: " +
      selectedBuild
    );
  });

});

function updatePreview(){

  buildPreview.className = "";

  if(!selectedBuild){
    buildPreview.style.display="none";
    return;
  }

  buildPreview.style.display="block";

  if(selectedBuild==="store"){
    buildPreview.className="previewStore";
  }

  if(selectedBuild==="parking"){
    buildPreview.className="previewParking";
  }

  if(selectedBuild==="shelf"){
    buildPreview.className="previewShelf";
  }
}

world.addEventListener("mousemove",e=>{

  if(!selectedBuild) return;

  const rect =
    world.getBoundingClientRect();

  const x =
    e.clientX - rect.left;

  const y =
    e.clientY - rect.top;

  const grid = 25;

  const snapX =
    Math.round(x/grid)*grid;

  const snapY =
    Math.round(y/grid)*grid;

  buildPreview.style.left =
    snapX+"px";

  buildPreview.style.top =
    snapY+"px";

});

world.addEventListener("click",e=>{

  if(!selectedBuild) return;

  if(e.target.closest(".store")){
    return;
  }

  const rect =
    world.getBoundingClientRect();

  const grid = 25;

  const x =
    Math.round(
      (e.clientX-rect.left)/grid
    )*grid;

  const y =
    Math.round(
      (e.clientY-rect.top)/grid
    )*grid;

  placeBuilding(
    selectedBuild,
    x,
    y
  );

});

function placeBuilding(type,x,y){

  const price =
    buildPrices[type];

  if(money < price){

    notify(
      "❌ Nie masz wystarczająco pieniędzy."
    );

    return;
  }

  if(type==="store"){
    createStore(x,y);
  }

  if(type==="parking"){
    createParking(x,y);
  }

  if(type==="shelf"){
    createShelf(x,y);
  }

  changeMoney(
    -price,
    "Budowa"
  );
}

/* =====================================================
   CREATE STORE
===================================================== */

function createStore(x,y){

  const store =
    document.createElement("div");

  store.className="store";

  store.style.left=x+"px";
  store.style.top=y+"px";

  store.innerHTML=`
    <div class="storeSign">
      ROPUCHA #${stores.length+1}
    </div>

    <div class="shelf"
         style="left:30px;top:90px">
      <div class="product red"></div>
      <div class="product blue"></div>
      <div class="product yellow"></div>
      <div class="product orange"></div>
    </div>

    <div class="shelf"
         style="left:30px;top:160px">
      <div class="product yellow"></div>
      <div class="product red"></div>
      <div class="product blue"></div>
    </div>

    <div class="counter">
      <div class="register"></div>
    </div>

    <div class="storeDoor"></div>
  `;

  world.insertBefore(
    store,
    buildPreview
  );

  stores.push({
    element:store,
    x:x,
    y:y,
    income:0
  });

  storeCountEl.textContent =
    stores.length;

  notify(
    "🏪 Otwarto nowy sklep!"
  );
}

/* =====================================================
   PARKING
===================================================== */

function createParking(x,y){

  const parking =
    document.createElement("div");

  parking.className="parking";

  parking.style.left=x+"px";
  parking.style.top=y+"px";

  world.insertBefore(
    parking,
    buildPreview
  );

  notify("🅿️ Zbudowano parking.");
}

/* =====================================================
   SHELF
===================================================== */

function createShelf(x,y){

  const shelf =
    document.createElement("div");

  shelf.className="shelf";

  shelf.style.left=x+"px";
  shelf.style.top=y+"px";

  shelf.innerHTML=`
    <div class="product red"></div>
    <div class="product blue"></div>
    <div class="product yellow"></div>
    <div class="product orange"></div>
  `;

  world.insertBefore(
    shelf,
    buildPreview
  );

  notify("🛒 Postawiono regał.");
}

/* =====================================================
   CANCEL BUILD
===================================================== */

function cancelBuild(){

  selectedBuild=null;
  buildMode=false;

  buildPreview.style.display="none";

  document
    .querySelectorAll(".buildButton")
    .forEach(
      b=>b.classList.remove("selected")
    );

  updateMode();
}

function updateMode(){

  if(buildMode){

    modeText.textContent=
      "TRYB: BUDOWANIE";

  }else{

    modeText.textContent=
      "TRYB: CHODZENIE";
  }
}

/* =====================================================
   MONEY SYSTEM
===================================================== */

function changeMoney(amount,reason=""){

  money += amount;

  if(money < 0){
    money=0;
  }

  updateMoney();

  const animation =
    document.createElement("div");

  animation.className=
    "moneyAnimation " +
    (
      amount>=0
      ?"moneyPlus"
      :"moneyMinus"
    );

  animation.textContent=
    (amount>=0?"+":"") +
    formatMoney(amount);

  document.body.appendChild(
    animation
  );

  moneyEl.classList.remove(
    "flashPlus",
    "flashMinus"
  );

  void moneyEl.offsetWidth;

  moneyEl.classList.add(
    amount>=0
    ?"flashPlus"
    :"flashMinus"
  );

  setTimeout(()=>{
    animation.remove();
  },1500);

  if(reason){
    console.log(
      reason,
      amount
    );
  }
}

function updateMoney(){

  moneyEl.textContent =
    formatMoney(money);
}

function formatMoney(value){

  return value.toLocaleString(
    "pl-PL",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  )+" zł";
}

/* =====================================================
   PRODUCT UI
===================================================== */

function renderProducts(){

  const list =
    document.getElementById(
      "productList"
    );

  list.innerHTML="";

  products.forEach(product=>{

    const row =
      document.createElement("div");

    row.className=
      "productRow";

    if(product.promo){

      row.innerHTML=`
        <span class="productName">
          ${product.name}
        </span>

        <span class="productPrice">
          <span class="oldPrice">
            ${product.price.toFixed(2)} zł
          </span>

          ${product.promoPrice.toFixed(2)} zł
        </span>

        <br>

        <span class="promoBadge">
          PROMOCJA
        </span>
      `;

    }else{

      row.innerHTML=`
        <span class="productName">
          ${product.name}
        </span>

        <span class="productPrice">
          ${product.price.toFixed(2)} zł
        </span>
      `;
    }

    row.addEventListener(
      "click",
      ()=>{
        togglePromotion(product);
      }
    );

    list.appendChild(row);
  });
}

/* =====================================================
   PROMOCJE
===================================================== */

function togglePromotion(product){

  product.promo =
    !product.promo;

  renderProducts();

  if(product.promo){

    notify(
      "🔥 Promocja: "+
      product.name+
      " — "+
      product.promoPrice.toFixed(2)+
      " zł"
    );

  }else{

    notify(
      "Promocja zakończona: "+
      product.name
    );
  }
}

/* =====================================================
   SPRZEDAŻ
===================================================== */

function simulateSales(){

  if(stores.length===0){
    return;
  }

  stores.forEach(store=>{

    const amountOfCustomers =
      random(1,4);

    for(
      let i=0;
      i<amountOfCustomers;
      i++
    ){

      const product =
        products[
          random(
            0,
            products.length-1
          )
        ];

      const salePrice =
        product.promo
        ?product.promoPrice
        :product.price;

      store.income += salePrice;

      changeMoney(
        salePrice,
        "Sprzedaż "+product.name
      );
    }
  });
}

/* =====================================================
   LOSOWE PROMOCJE
===================================================== */

function randomPromotion(){

  const product =
    products[
      random(
        0,
        products.length-1
      )
    ];

  product.promo=true;

  renderProducts();

  notify(
    "🔥 PROMOCJA DNIA: "+
    product.name+
    " za "+
    product.promoPrice.toFixed(2)+
    " zł!"
  );
}

/* =====================================================
   CLOCK
===================================================== */

function updateClock(){

  gameMinutes += 10;

  if(gameMinutes >= 24*60){

    gameMinutes=6*60;
    day++;

    dayEl.textContent=day;

    notify(
      "🌅 Rozpoczyna się dzień "+
      day
    );

    if(day%2===0){
      randomPromotion();
    }
  }

  const hours =
    Math.floor(
      gameMinutes/60
    );

  const minutes =
    gameMinutes%60;

  clockEl.textContent=
    String(hours).padStart(2,"0")+
    ":"+
    String(minutes).padStart(2,"0");
}

/* =====================================================
   NOTIFICATIONS
===================================================== */

function notify(text){

  const container =
    document.getElementById(
      "notifications"
    );

  const note =
    document.createElement("div");

  note.className="note";
  note.textContent=text;

  container.appendChild(note);

  setTimeout(()=>{
    note.remove();
  },3500);
}

/* =====================================================
   UTILS
===================================================== */

function random(min,max){

  return Math.floor(
    Math.random()*
    (max-min+1)
  )+min;
}

/* =====================================================
   START
===================================================== */

renderProducts();
updateMoney();
camera();
playerLoop();

setInterval(
  updateClock,
  1000
);

setInterval(
  simulateSales,
  5000
);

notify(
  "🐸 Witaj w Ropucha Market Simulator!"
);

</script>
