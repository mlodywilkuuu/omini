<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>USA PRESIDENT — Simulator</title><style>
*{box-sizing:border-box}body{margin:0;background:#07111f;color:#edf5ff;font:14px system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#050c16;border-right:1px solid #ffffff12;padding:22px;position:sticky;top:0;height:100vh}.logo{font-size:20px;font-weight:900;margin:8px 5px 28px}.logo span{color:#68a5ff}.nav{display:grid;gap:7px}.nav button{background:transparent;color:#91a4bd;border:1px solid transparent;padding:11px;border-radius:11px;text-align:left}.nav button.active,.nav button:hover{background:#4d8dff18;color:#fff;border-color:#4d8dff35}.side small{position:absolute;bottom:20px;color:#64758c}.main{padding:25px;max-width:1550px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#72adff;font-weight:800}h1{margin:4px 0;font-size:29px}.muted{color:#91a4bd}.actions,.rowActions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#ffffff09;color:#fff;border:1px solid #ffffff14;border-radius:10px;padding:10px 13px}.btn:hover{background:#ffffff14}.primary{background:#4d8dff;border-color:#4d8dff;font-weight:800}.danger{color:#ff9ba8;border-color:#ff536733;background:#ff536312}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 3;background:#10203dcc;border:1px solid #ffffff10;border-radius:17px;padding:17px;box-shadow:0 18px 50px #0005;backdrop-filter:blur(15px)}.wide{grid-column:span 8}.half{grid-column:span 6}.full{grid-column:1/-1}.card h3{margin:0 0 13px}.metric{font-size:28px;font-weight:900}.pos{color:#46d69b}.neg{color:#ff6575}.gold{color:#ffd36a}.stat{display:flex;justify-content:space-between;padding:8px 0;color:#91a4bd}.stat b{color:#fff}.bar{height:8px;background:#ffffff0d;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4d8dff,#79b0ff);border-radius:99px}.map{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}.state{min-height:56px;border:1px solid #ffffff10;border-radius:8px;padding:7px;background:#ffffff06;font-size:10px;display:flex;flex-direction:column;justify-content:space-between}.state b{font-size:11px}.state small{color:#c2d0e1}.state.blue{background:#4d8dff2c}.state.red{background:#ff5e7028}.state.swing{background:linear-gradient(135deg,#4d8dff22,#ff5e7022)}.state:hover{transform:translateY(-2px)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid #ffffff0d}th{color:#91a4bd;font-size:10px;text-transform:uppercase}.notice{background:#4d8dff0d;border-left:3px solid #4d8dff;padding:11px;border-radius:8px}.pill{display:inline-block;border:1px solid #ffffff12;border-radius:20px;padding:4px 8px;color:#91a4bd;font-size:11px}.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:800}.b{background:#4d8dff20;color:#9ec4ff}.r{background:#ff5e7020;color:#ff9da9}.g{background:#46d69b18;color:#7de7ba}.y{background:#ffd15b18;color:#ffda78}.event{border-left:3px solid #ffd15b;background:#ffd15b08;padding:12px;border-radius:8px;margin-bottom:9px}.empty{text-align:center;padding:28px;color:#71839a}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modalBox{width:min(620px,100%);max-height:90vh;overflow:auto;background:#0c1929;border:1px solid #ffffff15;border-radius:19px;padding:21px}.close{float:right}label{display:block;color:#91a4bd;font-size:12px;margin:12px 0 5px}input,select,textarea{width:100%;background:#071220;color:#fff;border:1px solid #ffffff14;border-radius:9px;padding:10px}textarea{min-height:80px}.list{display:grid;gap:8px}.list .row{border:1px solid #ffffff0d;border-radius:10px;padding:10px;background:#ffffff04}
@media(max-width:950px){.app{grid-template-columns:1fr}.side{height:auto;position:relative}.side small{display:none}.nav{grid-template-columns:repeat(3,1fr)}.card,.wide,.half{grid-column:span 6}.map{grid-template-columns:repeat(5,1fr)}}@media(max-width:600px){.main{padding:14px}.nav{grid-template-columns:repeat(2,1fr)}.card,.wide,.half,.full{grid-column:1/-1}.map{grid-template-columns:repeat(3,1fr)}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="app"><aside class="side"><div class="logo">🇺🇸 USA <span>PRESIDENT</span></div><div id="nav" class="nav"></div><small>Political strategy simulator<br>Local save enabled</small></aside><main class="main"><header class="top"><div><div id="eyebrow" class="eyebrow"></div><h1 id="title"></h1><div id="date" class="muted"></div></div><div class="actions"><button class="btn" onclick="advanceMonth()">Advance month</button><button class="btn" onclick="save()">Save</button><button class="btn danger" onclick="newGame()">New game</button></div></header><section id="content"></section></main></div><div id="modal" class="modal"><div class="modalBox"><button class="btn close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div><script>
'use strict';
const STATES=[['Alabama','AL',9],['Alaska','AK',3],['Arizona','AZ',11],['Arkansas','AR',6],['California','CA',54],['Colorado','CO',10],['Connecticut','CT',7],['Delaware','DE',3],['Florida','FL',30],['Georgia','GA',16],['Hawaii','HI',4],['Idaho','ID',4],['Illinois','IL',19],['Indiana','IN',11],['Iowa','IA',6],['Kansas','KS',6],['Kentucky','KY',8],['Louisiana','LA',8],['Maine','ME',4],['Maryland','MD',10],['Massachusetts','MA',11],['Michigan','MI',15],['Minnesota','MN',10],['Mississippi','MS',6],['Missouri','MO',10],['Montana','MT',4],['Nebraska','NE',5],['Nevada','NV',6],['New Hampshire','NH',4],['New Jersey','NJ',14],['New Mexico','NM',5],['New York','NY',28],['North Carolina','NC',16],['North Dakota','ND',3],['Ohio','OH',17],['Oklahoma','OK',7],['Oregon','OR',8],['Pennsylvania','PA',19],['Rhode Island','RI',4],['South Carolina','SC',9],['South Dakota','SD',3],['Tennessee','TN',11],['Texas','TX',40],['Utah','UT',6],['Vermont','VT',3],['Virginia','VA',13],['Washington','WA',12],['West Virginia','WV',4],['Wisconsin','WI',10],['Wyoming','WY',3]];
const NAV=[['overview','Overview','🏛️'],['election','Election','🗳️'],['congress','Congress','🏛️'],['laws','Federal laws','📜'],['states','States','🗺️'],['economy','Economy','📈'],['foreign','Foreign affairs','🌐'],['military','Defense','🛡️'],['events','Events','⚡']];
function fresh(){let s={page:'overview',year:2029,month:1,president:false,electionFinished:false,cash:850,popularity:52,campaign:0,gdp:100,inflation:3.1,unemployment:4.8,foreign:55,defense:65,senateD:48,senateR:48,senateI:4,houseD:215,houseR:215,houseI:5,laws:[],events:[],news:[],nextLaw:1,states:{}};STATES.forEach((x,i)=>s.states[x[1]]={support:48+(i*7%15)});return s}
let G=load()||fresh();
function load(){try{return JSON.parse(localStorage.getItem('usaPresidentSave'))}catch(e){return null}}function save(){localStorage.setItem('usaPresidentSave',JSON.stringify(G));toast('Game saved')}function newGame(){if(confirm('Start a new game?')){G=fresh();save();render()}}function toast(t){const e=document.createElement('div');e.textContent=t;e.style.cssText='position:fixed;right:20px;bottom:20px;background:#10243c;border:1px solid #ffffff18;padding:12px 16px;border-radius:10px;z-index:99';document.body.appendChild(e);setTimeout(()=>e.remove(),1600)}function money(n){return '$'+n.toLocaleString('en-US',{maximumFractionDigits:1})+'M'}function pct(n){return Math.round(n)+'%'}
function setPage(p){G.page=p;render()}function renderNav(){nav.innerHTML=NAV.map(n=>`<button class="${G.page===n[0]?'active':''}" onclick="setPage('${n[0]}')">${n[2]} &nbsp;${n[1]}</button>`).join('')}
function render(){renderNav();const m={overview:['White House','Overview'],election:['Campaign HQ','Election'],congress:['Capitol Hill','Congress'],laws:['Legislative Office','Federal Laws'],states:['Governors & States','States'],economy:['Treasury','Economy'],foreign:['State Department','Foreign Affairs'],military:['Pentagon','Defense'],events:['Situation Room','Events']}[G.page]||['White House','Overview'];eyebrow.textContent=m[0];title.textContent=m[1];date.textContent=`${G.year} • Month ${G.month} • ${G.president?'President of the United States':'Presidential campaign'}`;const f={overview:vOverview,election:vElection,congress:vCongress,laws:vLaws,states:vStates,economy:vEconomy,foreign:vForeign,military:vMilitary,events:vEvents};content.innerHTML=(f[G.page]||vOverview)()}
function C(cls,t,b){return `<div class="card ${cls||''}"><h3>${t}</h3>${b}</div>`}function bar(v,min=0,max=100){return `<div class="bar"><i style="width:${Math.max(0,Math.min(100,(v-min)/(max-min)*100))}%"></i></div>`}function stat(a,b){return `<div class="stat"><span>${a}</span><b>${b}</b></div>`}
function vOverview(){if(!G.president)return `<div class="grid">${C('wide','Welcome, candidate',`<div class="metric">Win the presidency.</div><p class="muted">Run a national campaign, win 270 Electoral College votes, then govern by passing laws and managing the economy.</p><div class="rowActions"><button class="btn primary" onclick="setPage('election')">Start campaign</button></div>`)}${C('','National support',`<div class="metric">${pct(G.popularity)}</div>${bar(G.popularity)}`)}${C('','Electoral votes',`<div class="metric">${ev()} / 270</div><span class="muted">Projected</span>`)}${C('','Campaign funds',`<div class="metric">${money(G.cash)}</div>`)}${C('','Congress',stat('Senate',senateControl())+stat('House',houseControl()))}${C('half','National indicators',stat('GDP index',G.gdp.toFixed(1))+stat('Inflation',G.inflation.toFixed(1)+'%')+stat('Unemployment',G.unemployment.toFixed(1)+'%'))}${C('half','News',newsHTML())}</div>`;return ''}
function newsHTML(){return G.news.length?G.news.slice(-6).reverse().map(x=>`<div class="list"><div class="row">${x}</div></div>`).join(''):'<div class="empty">No news yet.</div>'}
function mapHTML(){return `<div class="map">${STATES.map(x=>{let s=G.states[x[1]].support,c=s>=52?'blue':s<=45?'red':'swing';return `<div class="state ${c}" onclick="stateInfo('${x[1]}')"><b>${x[1]}</b><small>${x[2]} EV • ${s.toFixed(0)}%</small></div>`}).join('')}</div>`}
function ev(){return STATES.reduce((n,x)=>n+(G.states[x[1]].support>=50?x[2]:0),0)}
function stateInfo(a){let x=STATES.find(z=>z[1]===a),s=G.states[a].support;openModal(`<h2>${x[0]} (${a})</h2><div class="metric">${s.toFixed(0)}%</div><p class="muted">${x[2]} Electoral College votes</p>${bar(s)}<div class="rowActions"><button class="btn primary" onclick="visit('${a}')">Hold rally — $20M</button></div>`)}
function vElection(){return `<div class="grid">${C('wide','Electoral College map',mapHTML())}${C('','Campaign stats',stat('Support',pct(G.popularity))+stat('Momentum',pct(G.campaign))+stat('Funds',money(G.cash))+`<div class="rowActions"><button class="btn primary" onclick="nationalRally()">National rally</button><button class="btn" onclick="swingRally()">Target swing states</button><button class="btn" onclick="debate()">Debate</button></div>`)}${C('half','Victory condition',`<div class="metric ${ev()>=270?'pos':'neg'}">${ev()>=270?'ON TRACK':'NOT ENOUGH'}</div><p class="muted">You need at least 270 electoral votes. State results are simplified: 50%+ wins the state.</p>${!G.electionFinished?`<button class="btn primary" onclick="holdElection()">Hold presidential election</button>`:''}`)}${C('half','Campaign news',newsHTML())}</div>`}
function nationalRally(){if(G.cash<35)return toast('Not enough funds');G.cash-=35;G.popularity=Math.min(90,G.popularity+1.2);G.campaign=Math.min(100,G.campaign+5);STATES.forEach(x=>G.states[x[1]].support=Math.max(20,Math.min(80,G.states[x[1]].support+(Math.random()-.35)*2)));G.news.push('National rally increased campaign momentum.');save();render()}function swingRally(){if(G.cash<45)return toast('Not enough funds');G.cash-=45;G.campaign=Math.min(100,G.campaign+8);STATES.filter(x=>G.states[x[1]].support>=46&&G.states[x[1]].support<=54).forEach(x=>G.states[x[1]].support=Math.min(75,G.states[x[1]].support+3));G.news.push('Campaign staff focused on swing states.');save();render()}function visit(a){if(G.cash<20)return toast('Not enough funds');G.cash-=20;G.states[a].support=Math.min(80,G.states[a].support+4);G.campaign=Math.min(100,G.campaign+3);closeModal();G.news.push('You campaigned directly in '+a+'.');save();render()}function debate(){G.popularity=Math.max(20,Math.min(90,G.popularity+(Math.random()-.35)*6));G.campaign=Math.min(100,G.campaign+7);G.news.push('The national debate changed the race.');save();render()}function holdElection(){G.electionFinished=true;if(ev()>=270){G.president=true;G.popularity=Math.max(50,G.popularity);G.news.push('🎉 You won the presidential election and became President!')}else G.news.push('You lost the presidential election. Start a new game to try again.');save();render()}
function senateControl(){return G.senateD>G.senateR&&G.senateD>G.senateI?'Democratic':G.senateR>G.senateD&&G.senateR>G.senateI?'Republican':'No majority'}function houseControl(){return G.houseD>G.houseR&&G.houseD>G.houseI?'Democratic':G.houseR>G.houseD&&G.houseR>G.houseI?'Republican':'No majority'}function partybar(n,v,t){return stat(n,v)+bar(v,0,t)}
function vCongress(){return `<div class="grid">${C('half','Senate',`<div class="metric">${G.senateD+G.senateR+G.senateI}</div>${partybar('Democratic',G.senateD,100)}${partybar('Republican',G.senateR,100)}${partybar('Independent',G.senateI,100)}`)}${C('half','House of Representatives',`<div class="metric">${G.houseD+G.houseR+G.houseI}</div>${partybar('Democratic',G.houseD,435)}${partybar('Republican',G.houseR,435)}${partybar('Independent',G.houseI,435)}`)}${C('wide','Build a coalition',`<p class="muted">Recruit legislators to strengthen your coalition. Approval makes governing easier.</p><div class="rowActions"><button class="btn primary" onclick="recruit('senate')">Recruit Senate ally — $30M</button><button class="btn" onclick="recruit('house')">Recruit House ally — $15M</button></div>`)}${C('','Political approval',`<div class="metric">${pct(G.popularity)}</div>${bar(G.popularity)}`)}</div>`}
function recruit(ch){let cost=ch==='senate'?30:15;if(G.cash<cost)return toast('Not enough cash');if(Math.random()<.5){ch==='senate'?G.senateD++:G.houseD++}else{ch==='senate'?G.senateR++:G.houseR++}G.cash-=cost;G.news.push('You negotiated with a '+ch+' legislator and gained an ally.');save();render()}
function vLaws(){return `<div class="grid">${C('wide','Create a federal law',`<p class="muted">Draft a bill. It must pass the Senate and House before you can sign it.</p><button class="btn primary" onclick="lawModal()">Draft new law</button>`)}${C('','Legislative outlook',stat('Senate votes needed','51')+stat('House votes needed','218')+stat('Approval',pct(G.popularity)))}${C('full','Bills & laws',G.laws.length?`<table><thead><tr><th>Bill</th><th>Area</th><th>Cost</th><th>Status</th></tr></thead><tbody>${G.laws.slice().reverse().map(l=>`<tr><td><b>${l.name}</b><br><span class="muted">${l.desc}</span></td><td>${l.area}</td><td>${money(l.cost)}</td><td><span class="badge ${l.status==='Signed'?'g':'r'}">${l.status}</span></td></tr>`).join('')}</tbody></table>`:'<div class="empty">No bills drafted.</div>')}</div>`}
function lawModal(){openModal(`<h2>Draft a federal law</h2><label>Bill name</label><input id="ln" value="American Progress Act"><label>Policy area</label><select id="la"><option>Economy</option><option>Infrastructure</option><option>Healthcare</option><option>Education</option><option>Technology</option><option>Defense</option><option>Environment</option><option>Immigration</option></select><label>Federal cost ($M)</label><input id="lc" type="number" value="50" min="0"><label>Description</label><textarea id="ld">A new federal program designed to improve the country.</textarea><div class="rowActions"><button class="btn primary" onclick="submitLaw()">Send to Congress</button></div>`)}
function submitLaw(){let name=ln.value.trim()||'Unnamed Act',area=la.value,cost=Math.max(0,+lc.value||0),desc=ld.value.trim();let sy=G.senateD+G.senateI+(G.popularity>60?Math.floor(G.senateR*.25):Math.floor(G.senateR*.1));let hy=G.houseD+G.houseI+(G.popularity>60?Math.floor(G.houseR*.25):Math.floor(G.houseR*.1));let pass=sy>=51&&hy>=218&&cost<=G.cash;G.laws.push({name,area,cost,desc,status:pass?'Signed':'Failed'});if(pass){G.cash-=cost;G.gdp+=cost*.015;G.popularity+=area==='Economy'?1:.3;G.news.push(name+' passed Congress and was signed into law.')}else G.news.push(name+' failed to pass Congress.');closeModal();save();render()}
function vStates(){return `<div class="grid">${C('full','United States',mapHTML())}${C('wide','States',`<table><thead><tr><th>State</th><th>EV</th><th>Support</th><th>Position</th></tr></thead><tbody>${STATES.map(x=>{let s=G.states[x[1]].support;return `<tr><td>${x[0]}</td><td>${x[2]}</td><td>${s.toFixed(0)}%</td><td><span class="badge ${s>=52?'b':s<=45?'r':'y'}">${s>=52?'You':s<=45?'Opponent':'Swing'}</span></td></tr>`}).join('')}</tbody></table>`)}${C('','Federalism',stat('States','50')+stat('Electoral votes','538')+`<p class="muted">State-level politics are simulated through support and Electoral College results.</p>`)}</div>`}
function vEconomy(){return `<div class="grid">${C('','GDP index',`<div class="metric">${G.gdp.toFixed(1)}</div><span class="pos">Growth</span>`)}${C('','Inflation',`<div class="metric">${G.inflation.toFixed(1)}%</div><span class="${G.inflation<4?'pos':'neg'}">${G.inflation<4?'Stable':'Elevated'}</span>`)}${C('','Unemployment',`<div class="metric">${G.unemployment.toFixed(1)}%</div><span class="${G.unemployment<5?'pos':'neg'}">${G.unemployment<5?'Healthy':'High'}</span>`)}${C('','Treasury',`<div class="metric">${money(G.cash)}</div>`)}${C('half','Economic policy',`<div class="rowActions"><button class="btn primary" onclick="econ('stimulus')">Infrastructure stimulus — $60M</button><button class="btn" onclick="econ('tax')">Tax reform</button><button class="btn" onclick="econ('austerity')">Austerity</button></div>`)}${C('half','Indicators',stat('GDP',G.gdp.toFixed(1))+stat('Inflation',G.inflation.toFixed(1)+'%')+stat('Unemployment',G.unemployment.toFixed(1)+'%'))}</div>`}
function econ(a){if(a==='stimulus'){if(G.cash<60)return toast('Not enough cash');G.cash-=60;G.gdp+=2;G.unemployment=Math.max(2.5,G.unemployment-.3);G.inflation+=.25;G.popularity+=1}else if(a==='tax'){G.cash+=80;G.gdp+=.5;G.popularity-=1}else{G.cash+=70;G.gdp-=.7;G.inflation=Math.max(1,G.inflation-.3);G.popularity-=2}G.news.push('Economic policy implemented.');save();render()}
function vForeign(){return `<div class="grid">${C('','Global standing',`<div class="metric">${G.foreign}/100</div>${bar(G.foreign)}`)}${C('wide','Diplomatic actions',`<div class="rowActions"><button class="btn primary" onclick="foreign('summit')">International summit</button><button class="btn" onclick="foreign('aid')">Foreign aid — $35M</button><button class="btn" onclick="foreign('sanctions')">Sanctions</button></div>`)}${C('full','Diplomatic dashboard',stat('Allied relations',G.foreign+'/100')+stat('Credibility',Math.round((G.foreign+G.popularity)/2)+'/100')+stat('International pressure',Math.max(5,100-G.foreign)+'/100'))}</div>`}function foreign(a){if(a==='aid'){if(G.cash<35)return toast('Not enough cash');G.cash-=35;G.foreign=Math.min(100,G.foreign+8)}else if(a==='summit')G.foreign=Math.min(100,G.foreign+5);else{G.foreign=Math.max(10,G.foreign-3);G.popularity+=1}G.news.push('Foreign policy action completed.');save();render()}
function vMilitary(){return `<div class="grid">${C('','Defense readiness',`<div class="metric">${G.defense}/100</div>${bar(G.defense)}`)}${C('','Defense allocation',`<div class="metric">$180M</div><span class="muted">Simulation budget</span>`)}${C('wide','Defense policy',`<div class="rowActions"><button class="btn primary" onclick="military('modernize')">Modernize — $70M</button><button class="btn" onclick="military('ready')">Readiness — $40M</button><button class="btn" onclick="military('diplomacy')">Reduce tensions</button></div>`)}${C('half','Commander in Chief',stat('Readiness',G.defense+'/100')+stat('Foreign relations',G.foreign+'/100'))}${C('half','Strategic note',`<p class="muted">Defense actions affect readiness, the treasury and international relations.</p>`)}</div>`}function military(a){let c=a==='modernize'?70:a==='ready'?40:0;if(c&&G.cash<c)return toast('Not enough cash');G.cash-=c;if(a==='modernize')G.defense=Math.min(100,G.defense+9);else if(a==='ready')G.defense=Math.min(100,G.defense+5);else{G.defense=Math.max(20,G.defense-2);G.foreign=Math.min(100,G.foreign+5)}G.news.push('Defense policy updated.');save();render()}
function vEvents(){return `<div class="grid">${C('wide','Situation room',G.events.length?G.events.map((e,i)=>`<div class="event"><b>${e.title}</b><p class="muted">${e.text}</p><div class="rowActions">${e.options.map((o,j)=>`<button class="btn" onclick="resolveEvent(${i},${j})">${o}</button>`).join('')}</div></div>`).join(''):'<div class="empty">No active events. Advance the month.</div>')}${C('','Presidential schedule',stat('Month',G.month)+stat('Approval',pct(G.popularity))+stat('Defense',G.defense+'/100'))}${C('full','News feed',newsHTML())}</div>`}
function createEvent(){let a=[['Economic slowdown','Markets are weakening.', ['Launch stimulus','Address the nation','Do nothing']],['Storm emergency','A major storm has hit several states.',['Emergency funding','Mobilize military aid','Wait']],['Congressional revolt','Opposition leaders are organizing against your agenda.',['Negotiate','Campaign publicly','Ignore them']],['International crisis','A foreign crisis requires a response.',['Diplomatic talks','Increase readiness','Stay neutral']]];let x=a[Math.floor(Math.random()*a.length)];G.events.push({title:x[0],text:x[1],options:x[2]})}
function resolveEvent(i,j){let e=G.events[i];if(!e)return;if(e.title.includes('Economic')){if(j===0){if(G.cash<50)return toast('Not enough cash');G.cash-=50;G.gdp+=1;G.popularity+=1}else if(j===1)G.popularity+=.5;else G.gdp-=1}else if(e.title.includes('Storm')){if(j===0){if(G.cash<30)return toast('Not enough cash');G.cash-=30;G.popularity+=1}else if(j===1)G.defense+=3;else G.popularity-=2}else if(e.title.includes('Congressional')){if(j===0)G.popularity+=2;else if(j===1){G.popularity+=1;G.cash=Math.max(0,G.cash-20)}else G.popularity-=2}else{if(j===0)G.foreign+=4;else if(j===1)G.defense+=5;else G.foreign-=4}G.events.splice(i,1);G.news.push('Event resolved: '+e.title+'.');save();render()}
function advanceMonth(){G.month++;if(G.month>12){G.month=1;G.year++}G.cash+=Math.max(5,Math.round(45-G.unemployment*2));G.gdp+=.15-(G.inflation>5?.2:0);G.unemployment=Math.max(2.5,G.unemployment+(Math.random()-.5)*.25);G.inflation=Math.max(1,G.inflation+(Math.random()-.5)*.2);G.popularity=Math.max(15,Math.min(90,G.popularity+(Math.random()-.5)*2));if(Math.random()<.7)createEvent();G.news.push(`Advanced to ${G.year}, month ${G.month}.`);save();render()}
function openModal(x){modalBody.innerHTML=x;modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});render();
</script></body></html>
