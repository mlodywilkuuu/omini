<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7fbff">
  <title>Omini Tracker</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 42%, #e8f4ff 0, #f7fbff 42%, #fff 78%);
      color: #203b5b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    h1 { margin: 0; font-size: clamp(42px, 9vw, 82px); letter-spacing: -.075em; }
    p { margin: 14px 0 0; color: #8295aa; font-size: 15px; }
    .dot { display: inline-block; width: 9px; height: 9px; margin-right: 8px; border-radius: 50%; background: #8bc7f7; box-shadow: 0 0 18px #8bc7f7; }
  </style>
</head>
<body>
  <main>
    <h1>Omini Tracker</h1>
    <p><span class="dot"></span>Wielka przygoda właśnie się rozpoczyna.</p>
  </main>
</body>
</html>
