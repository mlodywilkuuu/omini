
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ustawienia | Władca Narodów</title>

<style>
* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
  background: #080d20;
}

body {
  --text: #f4f6ff;
  --muted: #abbad4;
  --gold: #f6d38a;
  --panel: rgba(255,255,255,.08);
  --border: rgba(255,255,255,.17);
  --input: #25344f;
  --bg1: #080d20;
  --bg2: #172c54;
  --bg3: #34214d;
  --scale: 1;

  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--text);
  font-family: "Segoe UI", Arial, sans-serif;
  font-size: calc(14px * var(--scale));
  background: linear-gradient(
    125deg,
    var(--bg1),
    var(--bg2),
    var(--bg3),
    var(--bg1)
  );
  background-size: 400% 400%;
  animation: gradient 16s ease infinite;
  overflow-x: hidden;
}

body.light {
  --text: #18243a;
  --muted: #52617b;
  --gold: #89591b;
  --panel: rgba(255,255,255,.72);
  --border: rgba(38,57,90,.2);
  --input: #fff;
  --bg1: #dce8fc;
  --bg2: #eee3fa;
  --bg3: #cfe6ef;
}

body.contrast {
  --panel: #101a30;
  --text: #fff;
  --muted: #fff;
  --gold: #ffe28c;
  --border: #ffe28c;
  --input: #071020;
}

body.light.contrast {
  --panel: #fff;
  --text: #000;
  --muted: #111;
  --gold: #624000;
  --border: #000;
  --input: #fff;
}

body.font-small {
  --scale: .9;
}

body.font-large {
  --scale: 1.16;
}

@keyframes gradient {
  0%, 100% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
}

.orb {
  position: fixed;
  z-index: 0;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  filter: blur(75px);
  opacity: .35;
  pointer-events: none;
  animation: float 12s ease-in-out infinite;
}

.orb.one {
  top: -110px;
  left: -100px;
  background: #527cff;
}

.orb.two {
  right: -110px;
  bottom: -110px;
  background: #a44dff;
  animation-delay: -5s;
}

@keyframes float {
  50% {
    transform: translate(35px, -35px);
  }
}

body.no-particles .orb {
  display: none;
}

body.quality-low .orb {
  filter: blur(35px);
  opacity: .2;
}

body.quality-medium .orb {
  filter: blur(55px);
  opacity: .28;
}

body.no-animation,
body.no-animation *,
body.no-animation *::before,
body.no-animation *::after {
  animation: none !important;
  transition: none !important;
}

main {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  padding: 12px;
}

.panel {
  width: 100%;
  max-width: 610px;
  padding: 20px 24px;
  border-radius: 22px;
  border: 1px solid var(--border);
  background: var(--panel);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  box-shadow:
    0 20px 70px #0005,
    inset 0 1px 0 #ffffff25;
}

.header {
  text-align: center;
  margin-bottom: 14px;
}

.crown {
  font-size: 29px;
  color: var(--gold);
  text-shadow: 0 0 20px #d7a54c66;
}

h1 {
  margin: 3px 0;
  font-size: 1.85em;
  letter-spacing: 1.5px;
  color: var(--gold);
}

.subtitle {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: .85em;
}

.tabs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 12px;
}

.tab {
  min-width: 0;
  padding: 10px 3px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,.06);
  color: var(--text);
  font-family: inherit;
  font-size: .76em;
  cursor: pointer;
  transition: .2s;
}

.tab.active {
  background: linear-gradient(
    120deg,
    #bd8c42,
    #ffe6aa,
    #d7a54c
  );
  color: #171822;
  border-color: #f6d38a;
  font-weight: bold;
}

.tab:hover {
  transform: translateY(-2px);
}

.tab:focus-visible,
.btn:focus-visible,
select:focus-visible,
input:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 2px;
}

.content {
  min-height: 245px;
  padding: 14px 17px;
  border-radius: 14px;
  border: 1px solid var(--border);
  background: rgba(0,0,0,.1);
}

body.light .content {
  background: rgba(255,255,255,.25);
}

.page {
  display: none;
}

.page.active {
  display: block;
}

h2 {
  margin: 0 0 12px;
  color: var(--gold);
  font-size: 1.1em;
}

.setting {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}

.setting:last-child {
  border-bottom: none;
}

.setting-label {
  font-size: .93em;
  font-weight: 600;
}

select {
  width: 175px;
  max-width: 55%;
  padding: 9px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--input);
  color: var(--text);
  font-family: inherit;
  font-size: .86em;
  cursor: pointer;
}

.switch {
  position: relative;
  display: inline-block;
  width: 46px;
  height: 26px;
  flex-shrink: 0;
}

.switch input {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}

.slider {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 30px;
  background: #657087;
  transition: .25s;
  pointer-events: none;
}

.slider::before {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  top: 3px;
  left: 3px;
  border-radius: 50%;
  background: white;
  transition: .25s;
}

.switch input:checked + .slider {
  background: linear-gradient(
    120deg,
    #bd8c42,
    #f6d38a
  );
}

.switch input:checked + .slider::before {
  transform: translateX(20px);
}

.switch input:focus-visible + .slider {
  outline: 3px solid var(--gold);
  outline-offset: 3px;
}

.volume {
  width: 150px;
  max-width: 48%;
  accent-color: #d7a54c;
}

.volume-value {
  color: var(--gold);
  font-weight: bold;
  font-size: .9em;
}

.volume-control {
  display: flex;
  align-items: center;
  gap: 10px;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 12px;
}

.btn {
  padding: 12px 8px;
  border-radius: 10px;
  border: 1px solid var(--border);
  font-family: inherit;
  font-size: .85em;
  font-weight: bold;
  cursor: pointer;
  transition: .25s;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 25px #0004;
}

.btn.gold {
  color: #171822;
  background: linear-gradient(
    120deg,
    #bd8c42,
    #ffe6aa,
    #d7a54c
  );
  border-color: #f6d38a;
}

.btn.secondary {
  background: var(--panel);
  color: var(--text);
}

.footer {
  text-align: center;
  margin-top: 12px;
  color: var(--muted);
  font-size: .72em;
}

.notice {
  text-align: center;
  min-height: 18px;
  margin-top: 8px;
  color: var(--gold);
  font-size: .8em;
}

[dir="rtl"] .setting {
  text-align: right;
}

@media (max-width: 520px) {
  .panel {
    padding: 16px 12px;
  }

  .tabs {
    gap: 4px;
  }

  .tab {
    padding: 9px 2px;
    font-size: .68em;
  }

  .content {
    padding: 12px;
  }

  select {
    width: 145px;
  }
}

@media (max-width: 360px) {
  .tabs {
    grid-template-columns: repeat(3, 1fr);
  }

  .buttons {
    grid-template-columns: 1fr;
  }
}

@media (max-height: 650px) and (min-width: 600px) {
  .panel {
    padding: 10px 20px;
  }

  .header {
    margin-bottom: 7px;
  }

  .crown {
    font-size: 22px;
  }

  .tabs {
    margin-bottom: 7px;
  }

  .tab {
    padding: 7px 3px;
  }

  .content {
    min-height: 215px;
    padding: 10px 14px;
  }

  .setting {
    min-height: 40px;
    padding: 5px 0;
  }

  .buttons {
    margin-top: 7px;
  }

  .btn {
    padding: 8px;
  }

  .footer {
    margin-top: 5px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<div class="orb one"></div>
<div class="orb two"></div>

<main>
<section class="panel">

  <header class="header">
    <div class="crown">♛</div>
    <h1 data-t="settings">USTAWIENIA</h1>
    <p class="subtitle" data-t="subtitle">
      Dostosuj grę do swoich preferencji
    </p>
  </header>

  <!-- ZAKŁADKI -->

  <nav class="tabs" aria-label="Kategorie ustawień">

    <button class="tab active"
      data-page="general"
      data-t="general">
      Ogólne
    </button>

    <button class="tab"
      data-page="graphics"
      data-t="graphics">
      Grafika
    </button>

    <button class="tab"
      data-page="audio"
      data-t="audio">
      Dźwięk
    </button>

    <button class="tab"
      data-page="gameplay"
      data-t="gameplay">
      Rozgrywka
    </button>

    <button class="tab"
      data-page="access"
      data-t="access">
      Dostępność
    </button>

  </nav>

  <div class="content">

    <!-- OGÓLNE -->

    <section class="page active" id="general">
      <h2 data-t="generalTitle">
        ⚙ Ustawienia ogólne
      </h2>

      <div class="setting">
        <label class="setting-label"
          for="language"
          data-t="language">
          🌍 Język gry
        </label>

        <select id="language">
          <option value="pl">🇵🇱 Polski</option>
          <option value="en">🇬🇧 English</option>
          <option value="es">🇪🇸 Español</option>
          <option value="ru">🇷🇺 Русский</option>
          <option value="de">🇩🇪 Deutsch</option>
          <option value="fr">🇫🇷 Français</option>
          <option value="ar">🇸🇦 العربية</option>
        </select>
      </div>

      <div class="setting">
        <label class="setting-label"
          for="theme"
          data-t="theme">
          🎨 Motyw interfejsu
        </label>

        <select id="theme">
          <option value="dark">Ciemny</option>
          <option value="light">Jasny</option>
          <option value="system">Systemowy</option>
        </select>
      </div>
    </section>

    <!-- GRAFIKA -->

    <section class="page" id="graphics">
      <h2 data-t="graphicsTitle">
        ✨ Grafika i efekty
      </h2>

      <div class="setting">
        <label class="setting-label"
          for="animations"
          data-t="animations">
          Animacje interfejsu
        </label>

        <label class="switch">
          <input type="checkbox" id="animations" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting">
        <label class="setting-label"
          for="particles"
          data-t="particles">
          Cząsteczki i poświaty
        </label>

        <label class="switch">
          <input type="checkbox" id="particles" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting">
        <label class="setting-label"
          for="quality"
          data-t="quality">
          Jakość efektów
        </label>

        <select id="quality">
          <option value="low">Niska</option>
          <option value="medium">Średnia</option>
          <option value="high">Wysoka</option>
        </select>
      </div>
    </section>

    <!-- DŹWIĘK -->

    <section class="page" id="audio">
      <h2 data-t="audioTitle">
        🔊 Ustawienia dźwięku
      </h2>

      <div class="setting">
        <label class="setting-label"
          for="volume"
          data-t="volume">
          Głośność główna
        </label>

        <div class="volume-control">
          <input class="volume"
            id="volume"
            type="range"
            min="0"
            max="100"
            step="5"
            value="65">
          <span class="volume-value" id="volumeValue">
            65%
          </span>
        </div>
      </div>

      <div class="setting">
        <label class="setting-label"
          for="music"
          data-t="music">
          Muzyka w tle
        </label>

        <label class="switch">
          <input type="checkbox" id="music" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting">
        <label class="setting-label"
          for="effects"
          data-t="effects">
          Efekty dźwiękowe
        </label>

        <label class="switch">
          <input type="checkbox" id="effects" checked>
          <span class="slider"></span>
        </label>
      </div>
    </section>

    <!-- ROZGRYWKA -->

    <section class="page" id="gameplay">
      <h2 data-t="gameplayTitle">
        🎮 Rozgrywka
      </h2>

      <div class="setting">
        <label class="setting-label"
          for="autosave"
          data-t="autosave">
          Automatyczny zapis
        </label>

        <label class="switch">
          <input type="checkbox" id="autosave" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting">
        <label class="setting-label"
          for="hints"
          data-t="hints">
          Podpowiedzi
        </label>

        <label class="switch">
          <input type="checkbox" id="hints" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="setting">
        <label class="setting-label"
          for="speed"
          data-t="speed">
          Prędkość rozgrywki
        </label>

        <select id="speed">
          <option value="slow">Wolna</option>
          <option value="normal">Normalna</option>
          <option value="fast">Szybka</option>
        </select>
      </div>
    </section>

    <!-- DOSTĘPNOŚĆ -->

    <section class="page" id="access">
      <h2 data-t="accessTitle">
        ♿ Dostępność
      </h2>

      <div class="setting">
        <label class="setting-label"
          for="fontSize"
          data-t="fontSize">
          Wielkość tekstu
        </label>

        <select id="fontSize">
          <option value="small">Mała</option>
          <option value="normal">Normalna</option>
          <option value="large">Duża</option>
        </select>
      </div>

      <div class="setting">
        <label class="setting-label"
          for="contrast"
          data-t="contrast">
          Wysoki kontrast
        </label>

        <label class="switch">
          <input type="checkbox" id="contrast">
          <span class="slider"></span>
        </label>
      </div>
    </section>

  </div>

  <!-- PRZYCISKI -->

  <div class="buttons">

    <button class="btn gold" id="save"
      data-t="save">
      ZAPISZ I WRÓĆ
    </button>

    <button class="btn secondary" id="reset"
      data-t="reset">
      PRZYWRÓĆ DOMYŚLNE
    </button>

  </div>

  <div class="notice" id="notice"
    role="status"
    aria-live="polite"></div>

  <div class="footer">
    WŁADCA NARODÓW • ALPHA 0.2
  </div>

</section>
</main>

/* USTAWIENIA DOMYŚLNE */

const defaults = {
  language: "pl",
  theme: "dark",
  animations: true,
  particles: true,
  quality: "high",
  volume: 65,
  music: true,
  effects: true,
  autosave: true,
  hints: true,
  speed: "normal",
  fontSize: "normal",
  contrast: false
};

const storageKey = "wladcaNarodowSettings";

/* BEZPIECZNE WCZYTYWANIE */

function loadSettings() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(storageKey)
    );

    if (!saved || typeof saved !== "object") {
      return {...defaults};
    }

    const result = {...defaults};

    for (const key in defaults) {
      const value = saved[key];

      if (typeof defaults[key] === "boolean") {
        if (typeof value === "boolean") {
          result[key] = value;
        }
      } else if (key === "volume") {
        if (Number.isFinite(value)) {
          result[key] = Math.max(
            0, Math.min(100, value)
          );
        }
      } else if (typeof value === "string") {
        result[key] = value;
      }
    }

    if (!translations[result.language]) {
      result.language = "pl";
    }

    if (!["dark","light","system"].includes(result.theme)) {
      result.theme = "dark";
    }

    if (!["low","medium","high"].includes(result.quality)) {
      result.quality = "high";
    }

    if (!["slow","normal","fast"].includes(result.speed)) {
      result.speed = "normal";
    }

    if (!["small","normal","large"].includes(result.fontSize)) {
      result.fontSize = "normal";
    }

    return result;
  } catch {
    return {...defaults};
  }
}

let settings = loadSettings();

/* ELEMENTY */

const controls = {};

Object.keys(defaults).forEach(key => {
  controls[key] = document.getElementById(key);
});

/* ODCZYT FORMULARZA */

function readControls() {
  Object.keys(defaults).forEach(key => {
    const el = controls[key];

    if (el.type === "checkbox") {
      settings[key] = el.checked;
    } else if (key === "volume") {
      settings[key] = Number(el.value);
    } else {
      settings[key] = el.value;
    }
  });
}

/* USTAWIANIE FORMULARZA */

function fillControls() {
  Object.keys(defaults).forEach(key => {
    const el = controls[key];

    if (el.type === "checkbox") {
      el.checked = settings[key];
    } else {
      el.value = settings[key];
    }
  });

  document.getElementById("volumeValue").textContent =
    settings.volume + "%";
}

/* TŁUMACZENIE */

function translatePage() {
  const t = translations[settings.language];

  document.documentElement.lang = settings.language;
  document.documentElement.dir =
    settings.language === "ar" ? "rtl" : "ltr";

  document.querySelectorAll("[data-t]").forEach(el => {
    const key = el.dataset.t;
    if (t[key]) el.textContent = t[key];
  });

  const optionGroups = {
    theme: ["dark","light","system"],
    quality: ["low","medium","high"],
    speed: ["slow","normal","fast"],
    fontSize: ["small","normal","large"]
  };

  Object.entries(optionGroups).forEach(([id, keys]) => {
    const select = document.getElementById(id);

    keys.forEach((key, index) => {
      select.options[index].textContent = t[key];
    });
  });

  Object.keys(defaults).forEach(key => {
    const el = controls[key];

    if (el.type === "checkbox") {
      const label = document.querySelector(
        'label[for="' + key + '"]'
      );

      if (label) {
        el.setAttribute(
          "aria-label",
          label.textContent.trim()
        );
      }
    }
  });
}

/* MOTYW SYSTEMOWY */

const systemTheme = window.matchMedia(
  "(prefers-color-scheme: light)"
);

function applyAppearance() {
  const light = settings.theme === "light" ||
    (settings.theme === "system" && systemTheme.matches);

  document.body.classList.toggle("light", light);

  document.body.classList.toggle(
    "no-animation", !settings.animations
  );

  document.body.classList.toggle(
    "no-particles", !settings.particles
  );

  document.body.classList.toggle(
    "contrast", settings.contrast
  );

  document.body.classList.remove(
    "quality-low",
    "quality-medium",
    "quality-high",
    "font-small",
    "font-normal",
    "font-large"
  );

  document.body.classList.add(
    "quality-" + settings.quality
  );

  document.body.classList.add(
    "font-" + settings.fontSize
  );
}

/* ZASTOSUJ WSZYSTKO */

function applyAll() {
  fillControls();
  translatePage();
  applyAppearance();
}

/* ZAPIS */

function saveSettings() {
  try {
    localStorage.setItem(
      storageKey,
      JSON.stringify(settings)
    );
    return true;
  } catch {
    document.getElementById("notice").textContent =
      translations[settings.language].saveError;
    return false;
  }
}

/* DŹWIĘK KLIKNIĘCIA */

let audioContext;

function playClick() {
  if (!settings.effects || settings.volume === 0) {
    return;
  }

  try {
    const AudioCtx =
      window.AudioContext || window.webkitAudioContext;

    if (!AudioCtx) return;

    audioContext ||= new AudioCtx();

    if (audioContext.state === "suspended") {
      audioContext.resume();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 650;

    const now = audioContext.currentTime;
    const loudness = .05 * (settings.volume / 100);

    gain.gain.setValueAtTime(
      Math.max(loudness, .0001), now
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001, now + .08
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(now);
    oscillator.stop(now + .08);
  } catch {
    // Dźwięk jest opcjonalny.
  }
}

/* ZAKŁADKI */

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(item => {
      item.classList.remove("active");
    });

    document.querySelectorAll(".page").forEach(page => {
      page.classList.remove("active");
    });

    tab.classList.add("active");

    document.getElementById(
      tab.dataset.page
    ).classList.add("active");

    playClick();
  });
});

/* ZMIANY USTAWIEŃ */

Object.values(controls).forEach(control => {
  control.addEventListener("change", () => {
    readControls();
    applyAll();
    playClick();
  });
});

controls.volume.addEventListener("input", () => {
  readControls();
  document.getElementById("volumeValue").textContent =
    settings.volume + "%";
});

/* ZAPISZ I WRÓĆ */

document.getElementById("save").addEventListener(
  "click", () => {
    readControls();
    playClick();

    if (saveSettings()) {
      window.location.href = "index.html";
    }
  }
);

/* RESET */

document.getElementById("reset").addEventListener(
  "click", () => {
    settings = {...defaults};
    applyAll();
    playClick();

    if (saveSettings()) {
      document.getElementById("notice").textContent =
        translations[settings.language].resetDone;
    }
  }
);

/* ZMIANA MOTYWU SYSTEMOWEGO */

systemTheme.addEventListener?.("change", () => {
  if (settings.theme === "system") {
    applyAppearance();
  }
});

/* START */

applyAll();

</script>
